# -Xmx4G, not 8G. The host has 16 GB, so WSL gets ~8 GB by default — an 8 GB
# Gradle heap is larger than the entire WSL VM and took it down with
# `Wsl/Service/E_UNEXPECTED` mid-build. 4 GB is ample for this app, leaves room
# for the Kotlin daemon, and changes nothing on CI runners (also 16 GB).
# Metaspace 4G was likewise over-provisioned; 1G is well above what it uses.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
