name: subly
description: "Subly — a cross-platform subscription tracker. App #1 and the reusable template for the Cross Platform Apps portfolio."
publish_to: "none"
resolution: workspace

# THE RELEASE LINE (`major.minor`) IS THE ONLY PART A HUMAN OWNS HERE.
# The patch and the build number below are the LOCAL-DEV placeholder; every
# deployed build overrides both with `github.run_number` via
# `flutter build --build-name=<major.minor>.<run_number> --build-number=<run_number>`
# (.github/workflows/deploy-web.yml), which is monotonic and reproducible from
# the run. Bump `major.minor` to declare a new release line; nothing needs to
# touch the patch, and nothing should — a hand-maintained counter is exactly
# what froze this file at 1.0.0+1 from the first deploy onward, leaving the
# CFG-1 force-update kill-switch with no floor it could usefully sit on
# (packages/core/lib/src/config/version_gate.dart drops everything after `+`).
# Enforced by tooling/ci/assert-app-versioning.mjs.
version: 1.0.0+1

environment:
  sdk: ^3.9.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # Shared core domain layer (models, Result/Failure, content packs).
  nikatru_core:
    path: ../../packages/core
  nikatru_api_client:
    path: ../../packages/api_client

  # Shared design system (tokens, theming, adaptive AppScaffold).
  nikatru_design_system:
    path: ../../packages/design_system

  # Plugin-backed impls of core's storage seams. Needed by the G-12 analytics
  # funnel: the pseudonymous `anon_id` and the consent decision must BOTH
  # survive a restart, and the queue must survive being offline.
  nikatru_platform_storage:
    path: ../../packages/platform_storage
  # [G-43] The identity adapter, taken for ONE reason: `initNikatruAuth` is what
  # passes the SecureStore-backed session storage to the Supabase SDK. Without
  # it main.dart called `Supabase.initialize` bare and the refresh token was
  # written in plaintext — see the dated declared exception in lib/main.dart.
  # Subly keeps its own frozen AuthRepository (39-CHASSIS cut 1); this is the
  # initialisation call and nothing else.
  nikatru_auth_supabase:
    path: ../../packages/auth_supabase
  # [pipeline C-2] Until this line existed, the ONLY app in production had no
  # crash reporting at all — the package was declared by the brick template and by
  # nothing that ships. Subly is a frozen legacy rail-prover (cut list item 1) and
  # telemetry is one of exactly three things it is allowed to receive, precisely
  # because a live app is the one place a crash report is worth anything.
  nikatru_telemetry:
    path: ../../packages/telemetry

  # State management
  flutter_riverpod: ^2.5.0

  # Navigation (real URLs on web; deep links on all 6 platforms)
  go_router: ^14.2.0

  # HTTP client for the Cloudflare Worker API (bearer-token interceptor)
  dio: ^5.4.0

  # Shared identity — pure REST, works on all 6 platforms (no desktop delegate)
  supabase_flutter: ^2.5.0

  # On-device renewal reminders (iOS/Android/macOS/Windows/Linux)
  flutter_local_notifications: ^17.2.0
  timezone: ^0.9.4

  # 🔴 [pipeline S-4] THE UPPER BOUND HAD TO WIDEN, and the reason is a workspace
  # one rather than a Subly one. Every STAMPED app pulls `flutter_localizations`
  # (gen-l10n drives lib/l10n/*.arb), and that SDK package hard-pins `intl 0.20.2`.
  # One workspace = ONE resolution, so `^0.19.0` here and 0.20.2 there cannot both
  # hold: resolving from the repo root with any stamped app present fails with
  # "because subly depends on intl ^0.19.0, version solving failed" — the whole
  # tree, not just Subly. Found while fixing the `resolution: workspace` half of
  # the same time bomb; both had the same fuse (app #2 being committed) and fixing
  # only one just changes the error message.
  # Subly's entire intl surface is `NumberFormat('#,##0.00', 'en_US')` in
  # lib/core/format/currency.dart — unchanged across 0.19 → 0.20 — and the widened
  # range was verified by resolving, analyzing and testing the tree on 0.20.2.
  intl: ">=0.19.0 <0.21.0"
  cupertino_icons: ^1.0.8

  # Open external URLs (nikatru.com legal pages + company site) on all 6 platforms.
  url_launcher: ^6.3.0

  # 🪦 THE REVENUECAT LINE THAT USED TO SIT HERE IS GONE — [ADR 026], [ADR 004].
  # RevenueCat is an aggregator over Apple/Google in-app purchase, and native IAP
  # is deferred by 39-CHASSIS §4 cut 5; the merchant of record is locked to
  # Paddle / Lemon Squeezy. The client rail lives in `packages/purchases` and is
  # inherited by every stamped app. Subly stays frozen and simply has no purchase
  # path, which is honest — it had none before either, it just looked like it did.

dev_dependencies:
  # [pipeline C-12] resolves the shared ruleset in analysis_options.yaml.
  nikatru_lints:
    path: ../../packages/analysis
  flutter_test:
    sdk: flutter

  # Drives the real widget tree in a browser for the live E2E suite
  # (integration_test/). Works regardless of the web renderer (canvas).
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Generates every platform's launcher icon from ONE source image. A
  # dev_dependency rather than `dart pub global activate` for the same reason
  # `msix` below is: the workspace lockfile is what makes the generation
  # reproducible, and a globally activated tool resolves whatever is newest that
  # day. See the `flutter_launcher_icons:` block near the bottom of this file for
  # what it produces and why hand-placed icons were rejected.
  flutter_launcher_icons: ^0.14.4

  # MSIX packaging for the `windows-store` channel of tooling/channel-register.json.
  # This is the Flutter-documented route for a Microsoft Store package
  # (docs.flutter.dev/deployment/windows → "Packaging and publishing to the
  # Microsoft Store"). A dev_dependency rather than `dart pub global activate`
  # ON PURPOSE: the workspace lockfile is what makes the packaging step
  # reproducible, and `flutter pub get --enforce-lockfile` (every CI lane) is
  # what enforces it — a globally activated tool resolves whatever is newest
  # that day, which is exactly the drift [pipeline F-8] exists to remove.
  # Configured by the `msix_config:` block at the bottom of this file.
  msix: ^3.18.0

flutter:
  uses-material-design: true

  # Nikatru co-branding lockups (light + dark) and icon, used by NikatruWordmark.
  assets:
    - assets/brand/

  # The design uses Manrope (body) + Space Grotesk (numerals/titles). Drop the .ttf
  # files under app/assets/fonts/ and uncomment to match the mockup exactly. Without
  # them the app still runs, falling back to the platform default font.
  # fonts:
  #   - family: Manrope
  #     fonts:
  #       - asset: assets/fonts/Manrope-Regular.ttf
  #       - asset: assets/fonts/Manrope-Bold.ttf
  #         weight: 700
  #   - family: Space Grotesk
  #     fonts:
  #       - asset: assets/fonts/SpaceGrotesk-Bold.ttf
  #         weight: 700

# ─────────────────────────────────────────────────────────────────────────────
# LAUNCHER ICONS — every platform, from one source, by one command
# ─────────────────────────────────────────────────────────────────────────────
# 🔴 WHY THIS BLOCK IS NO LONGER COMMENTED OUT. It was STAGED here for two weeks
# while the app shipped Flutter's default logo on ANDROID, iOS, macOS AND
# WINDOWS — measured 2026-08-04, all 29 native icon files BYTE-IDENTICAL to
# `flutter create` output. The 23-July brand refresh reached `web/` and nothing
# else, while company/logo/logo-usage.md recorded that it had been "rolled out
# across the app (Subly)". A staged block is not a shipped icon.
# Enforced from now on by tooling/ci/assert-launcher-icons.mjs.
#
# ── WHY A GENERATOR AND NOT HAND-PLACED FILES ────────────────────────────────
# Thirty-one artefacts across five platforms — five Android densities, fifteen
# iOS sizes, seven macOS sizes, a multi-image Windows .ico and the adaptive
# layers — is not a set anyone re-derives correctly by hand at 2am, and this is
# an app FACTORY: app #2 must inherit the MECHANISM, not a folder of PNGs
# somebody copied. One command regenerates all of them from `image_path`:
#
#   cd apps/subly && dart run flutter_launcher_icons
#
# ── WHY WEB IS `generate: false`, WHICH IS NOT AN OVERSIGHT ──────────────────
# web/ is the ONE platform whose icons were already correct, and its plain and
# MASKABLE assets are deliberately DIFFERENT images: Icon-512 is the rounded
# tile, Icon-maskable-512 is the full-bleed variant with the mark in the safe
# zone (company/logo/nikatru-icon-maskable.svg). flutter_launcher_icons derives
# all four from a single `image_path`, so turning web on would overwrite the
# maskable pair with the non-maskable art and silently undo the one platform
# that was right — a regression dressed as consistency. It also rewrites
# web/manifest.json, which is hand-maintained here.
#
# ── THE ANDROID ADAPTIVE ICON ────────────────────────────────────────────────
# Two layers, not one. Android composites them at 108dp and guarantees only the
# centre 72dp (66.7%) survives the launcher's mask, which differs per OEM.
#   · background — the brand tile gradient, FULL-BLEED (no corner radius: the
#     launcher supplies the silhouette, and a pre-rounded tile shows the mask
#     cutting into an already-rounded shape).
#   · foreground — the mark alone on transparency, painted extent 52% x 50% of
#     the canvas and centred, so it is inside the safe box for every mask shape.
# `adaptive_icon_foreground_inset: 0` because that inset is ALREADY in the
# artwork; leaving the default 16 would shrink the mark twice.
# Both are rasterised from the SVGs beside them, whose path data and gradient
# stops are copied verbatim from company/logo/nikatru-icon.svg.
#
# ── `remove_alpha_ios` IS NOT OPTIONAL ───────────────────────────────────────
# The 1024 master is RGBA. App Store Connect REJECTS an app icon carrying an
# alpha channel (ITMS-90717), so without this the build uploads and then fails
# validation — late, remotely, and with a message that does not mention icons.
#
# ⚠️ OPEN DESIGN QUESTION, DELIBERATELY NOT RESOLVED HERE — two of the owner's
# own documents disagree and only the owner can settle it:
#   · company/logo/logo-usage.md designates the Nikatru mark as the
#     "App icon (all 6 stores)".
#   · MASTER_PLAN.md requires every app to carry a DISTINCT icon so the
#     portfolio does not look templated at 50 apps.
# Using the company mark is right for app #1 — Subly is the only app, and an
# unbranded default is strictly worse than a company mark. It is wrong at scale:
# fifty identical home-screen tiles is the "templated" outcome MASTER_PLAN
# names. SETTLE IT BEFORE APP #2, not before this ships.
flutter_launcher_icons:
  # The company mark at 1024, copied from company/logo/nikatru-icon-1024.png.
  # Swap this one line for Subly's own glyph when the question above is settled.
  image_path: "assets/icon/app_icon_1024.png"

  android: "ic_launcher"
  adaptive_icon_background: "assets/icon/app_icon_background.png"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  adaptive_icon_foreground_inset: 0

  ios: true
  remove_alpha_ios: true

  macos:
    generate: true
    image_path: "assets/icon/app_icon_1024.png"

  windows:
    generate: true
    image_path: "assets/icon/app_icon_1024.png"
    icon_size: 256

  # See the block above — NOT an oversight. web/ is already correct and its
  # maskable pair is separate art that this generator cannot reproduce.
  web:
    generate: false

  # LINUX has no entry because flutter_launcher_icons has no Linux target — that
  # is a fact about the tool, not a gap. Flutter's Linux embedder has no icon
  # slot, so on Linux the launcher icon is a PACKAGING artefact: a freedesktop
  # `.desktop` entry plus a hicolor icon theme, which snap/flatpak/deb/AppImage
  # all consume.
  #
  # ✅ NO LONGER MISSING (this comment used to end "and this repo has neither
  # yet"). Both are generated from the SAME master named above by
  #   node tooling/store/render-linux-icons.mjs --app subly
  # into linux/packaging/, installed into the bundle by linux/CMakeLists.txt, and
  # RE-DERIVED on every CI run by assert-launcher-icons.mjs limb 7 — which is a
  # stronger check than the other five platforms get, since it proves the icon is
  # THIS app's mark rather than merely "not Flutter's".

# ─────────────────────────────────────────────────────────────────────────────
# MSIX PACKAGE IDENTITY — the `windows-store` channel's artifact
# ─────────────────────────────────────────────────────────────────────────────
# 🔴 THE IDENTITY IS THE CHANNEL ROW'S FIELD, NOT STAGE 3's TRIPWIRE BUNDLE.
# tooling/channel-register.json → channels[windows-store].packageIdentity is the
# single declaration; the three values below MUST agree with it, and
# tooling/ci/assert-store-metadata.mjs compares them. Two copies of an identity
# is how the wrong one ships — [pipeline F-2].
#
# It has a real downstream consumer beyond packaging: [13]T-5's Windows
# `cancelAll` is a NO-OP without a package identity, because the Windows
# notification APIs key scheduled toasts on it.
#
# ⬜ ALL THREE ARE OWNER-GATED BEHIND OWNER_QUEUE A-2. Partner Center ASSIGNS
# them (Product → Product identity → Package/Identity/Name,
# Package/Properties/PublisherDisplayName, Package/Properties/Publisher) and
# there is no way to derive or guess them. Until the account exists they carry
# the sentinel `PARTNER-CENTER-PENDING`, which the guard recognises as
# NOT-YET-CONFIGURED and PRINTS. A plausible-looking made-up value would
# package and submit CLEANLY under the wrong identity, which is unrecoverable
# once published — the sentinel is chosen so it cannot be mistaken for a real
# one and so `msix` still runs locally (it satisfies the identity-name charset
# rule ^[a-zA-Z0-9.-]{3,50}$, so packaging is provable before the account exists).
#
# ⬜ NO PER-APP STORE ICON EXISTS YET (see the STAGED block above): with no
# `logo_path`, `msix` falls back to its own bundled default icons. That is fine
# for a build proof and NOT fine for a submission — [10]D-6 requires a distinct
# visual identity per app. Point `logo_path` at Subly's own mark before the
# first submission; it is listed in apps/subly/store/windows-store/README.md.
#
# Package locally with:
#   flutter build windows --release
#   dart run msix:create
msix_config:
  display_name: Subly
  publisher_display_name: PARTNER-CENTER-PENDING
  identity_name: PARTNER-CENTER-PENDING
  publisher: CN=PARTNER-CENTER-PENDING
  # `store: true` is the keyKind "none" half of the register row made real: the
  # Store re-signs the submitted package, so nothing here holds or needs a
  # certificate, and `msix` skips signing entirely in this mode. Flipping it to
  # false silently re-introduces a test certificate nobody owns.
  store: true
  # CI already ran `flutter build windows --release` in the step before this
  # one; letting msix build again would double the runner time and package a
  # DIFFERENT build from the one the upload proves.
  build_windows: false
  architecture: x64
  languages: en-us
  capabilities: internetClient
  output_path: build/windows/msix
  output_name: subly
