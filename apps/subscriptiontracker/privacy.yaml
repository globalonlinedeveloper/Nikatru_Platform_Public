# ─────────────────────────────────────────────────────────────────────────────
# Subly — the privacy declaration. What this app collects, why, for how long,
# and who else touches it, written ONCE.
#
# ── WHAT THIS FILE IS, AND WHAT IT IS NOT YET ────────────────────────────────
# It is the DECLARATION. Its renderings — the Play data-safety answers, the
# Apple privacy manifest, the published policy text — are NOT generated from it
# today, and nothing here pretends they are: those four sworn JSON files are
# statements about Subly's real code, each answer carrying its own citation and
# two of them closed by reading a vendored SDK. [ADR 037]: "a sworn declaration
# regenerated by a template is a statement nobody made."
#
# So this file is written in the SAME discipline instead: every row carries the
# basis it was decided on, the source that basis was read from, and the date it
# was read. `tooling/ci/assert-app-yaml.mjs` grades it against
# `tooling/app-yaml/schema/privacy.schema.json` and cross-checks the two things
# a schema cannot: that every processor id is a row in
# tooling/legal/provider-register.json, and that no row declares a network
# address.
#
# ── THE ROWS ARE DERIVED, NOT INVENTED ───────────────────────────────────────
# Every `collects` row below is one of the TWELVE rows that are
# `collected: true` under the `backend-live` posture in
# apps/subscriptiontracker/store/android-play/data-safety.json — the same twelve the Apple
# manifest carries, which assert-apple-privacy-manifest.mjs already holds in
# step. There is no thirteenth row and no eleventh.
#
# ── RETENTION IS AN ENUM, NOT A NUMBER ───────────────────────────────────────
# 400 / 730 / 1100 days, locked by [ADR 045] and by C-RETENTION-PERIODS. 400 is
# raw event-level data (floor 365 from DPDP Rules 2025, ceiling 425 from GA4);
# 730 is the money rail (Paddle will not replay a notification older than 90
# days, and Visa's outer dispute window is 540); 1100 is the derived rollup,
# which holds strictly less than the raw table it comes from. A convenience
# change cannot quietly extend any of them: the schema admits no fourth value.
# ─────────────────────────────────────────────────────────────────────────────

app: subscriptiontracker
# Which kind of shipped thing this declares. An app answers Play's Data safety
# form and Apple's App Privacy questions; an extension answers the Chrome Web
# Store's Privacy practices tab. The two vocabularies are different, so the
# schema's arity rules are per surface — and the app floor (at least one
# collected category, at least one processor) is exactly what it always was.
surface: app
state: declared
asOf: "2026-09-11"

# C-NO-NETWORK-ADDRESS-COLUMN, restated where a renderer would have to break it.
# The schema admits only `false`. The one identifier that would turn every
# analytics row into personal data is the one this portfolio does not keep, and
# the promise is PUBLISHED — a published claim is a representation, and failing
# it is a misstatement rather than a bug.
networkAddress: false

collects:
  - category: Location
    type: Approximate location
    purposes:
      - Analytics
    retentionClass: 400
    required: false
    shared: false
    basis: >-
      The device never provides a location. The only geography that exists
      anywhere is inferred at the Cloudflare edge from the connection, which is
      why the row is collected but not required and carries Analytics alone.
    source: apps/subscriptiontracker/store/android-play/data-safety.json
    asOf: "2026-09-05"

  - category: Personal info
    type: Email address
    purposes:
      - Account management
      - App functionality
    retentionClass: 730
    required: true
    shared: false
    basis: >-
      Login is mandatory in the apps (ADR 058) and identity is one Supabase auth
      project for the whole portfolio (C-ONE-IDENTITY-PER-USER), so an address
      is the account. It is held for the account's life and erased by the
      schema-derived erasure route, identity last.
    source: apps/subscriptiontracker/store/android-play/data-safety.json
    asOf: "2026-09-05"

  - category: Personal info
    type: Name
    purposes:
      - Account management
    retentionClass: 730
    required: false
    shared: false
    basis: >-
      Optional. The user can enter a name in Settings, and if the user chooses
      Sign in with Apple, an optional way to sign in, Apple shares the name on
      that account as the user allows; an account needs no name. It sits on
      the identity record beside the address, is held for the account's life
      and is erased with the identity.
    source: apps/subscriptiontracker/store/android-play/data-safety.json
    asOf: "2026-09-25"

  - category: Personal info
    type: User IDs
    purposes:
      - Account management
      - App functionality
    retentionClass: 730
    required: true
    shared: false
    basis: >-
      The one identity per user across every app is a user id issued by the
      auth project; every app row keys on it, which is what makes erasure reach
      derivable from the schema rather than from a hand-kept list of tables.
    source: apps/subscriptiontracker/store/android-play/data-safety.json
    asOf: "2026-09-05"

  - category: Financial info
    type: Purchase history
    purposes:
      - App functionality
    retentionClass: 730
    required: false
    shared: false
    basis: >-
      Paddle is the merchant of record and will not replay a notification older
      than ninety days, so from day ninety-one ours is the sole surviving copy
      of the entitlement history a customer can be shown.
    source: tooling/legal/data-inventory.json
    asOf: "2026-09-05"

  - category: Financial info
    type: Other financial info
    purposes:
      - App functionality
    retentionClass: 730
    required: true
    shared: false
    basis: >-
      The subscriptions a person tracks in this app are financial facts about
      them,
      and they are the product itself. They sit in the app's own rows and are
      reached by the same erasure route as everything else keyed on the user id.
    source: apps/subscriptiontracker/store/android-play/data-safety.json
    asOf: "2026-09-05"

  - category: App activity
    type: App interactions
    purposes:
      - Analytics
    retentionClass: 400
    required: false
    shared: false
    basis: >-
      The first-party events rail, consented per purpose and append-only, so a
      grant for analytics is never evidence of a grant for anything else. Swept
      at four hundred days by the events retention job.
    source: services/platform/migrations/0007_events_rollup.sql
    asOf: "2026-09-05"

  - category: App activity
    type: Other user-generated content
    purposes:
      - App functionality
    retentionClass: 730
    required: true
    shared: false
    basis: >-
      The names, amounts and renewal dates a person enters. This is the content
      the app exists to hold, so it lives as long as the account does and goes
      with it.
    source: apps/subscriptiontracker/store/android-play/data-safety.json
    asOf: "2026-09-05"

  - category: App info and performance
    type: Crash logs
    purposes:
      - App functionality
    retentionClass: 400
    required: true
    shared: false
    basis: >-
      Crash reports reach the self-hosted GlitchTip in Mumbai, whose event
      retention is bounded rather than indefinite. The software is ours and no
      analytics company receives them; the machine it runs on is rented from
      Hostinger, which is listed below as infrastructure under the same rule
      that lists the vendor of the identity machine.
    source: tooling/legal/provider-register.json
    asOf: "2026-09-11"

  - category: App info and performance
    type: Diagnostics
    purposes:
      - App functionality
    retentionClass: 400
    required: true
    shared: false
    basis: >-
      Performance and error diagnostics on the same rail as the crash reports,
      bounded by the same retention and carrying nothing that identifies a
      connection.
    source: apps/subscriptiontracker/store/android-play/data-safety.json
    asOf: "2026-09-05"

  - category: App info and performance
    type: Other app performance data
    purposes:
      - App functionality
    retentionClass: 400
    required: true
    shared: false
    basis: >-
      Timing and resource measurements emitted by the same instrumentation as
      the diagnostics row above; they are one stream answered as three rows
      because the Play console asks three questions.
    source: apps/subscriptiontracker/store/android-play/data-safety.json
    asOf: "2026-09-05"

  - category: Device or other IDs
    type: Device or other IDs
    purposes:
      - Analytics
      - App functionality
    retentionClass: 400
    required: true
    shared: false
    basis: >-
      An install id generated on the device. It is what lets an analytics row
      exist at all with nothing about the connection in it, it is the identifier
      the consent trail is keyed on, and it is deleted with the account.
    source: apps/subscriptiontracker/store/android-play/data-safety.json
    asOf: "2026-09-05"

# Everyone outside this repository who touches any of the above. Each id is a
# row in tooling/legal/provider-register.json — that register is the ONE
# declaration of who they are, and a second spelling here would be the first to
# drift. Self-hosted SERVICES are deliberately absent: GlitchTip and the auth
# stack are software this company operates, not a party the data is disclosed
# to. The VENDOR of each machine they run on is present, as `infrastructure`,
# and the rule is one rule for every such machine: `hostinger` for the
# identity stack (Box C) and the crash sink (Box B), and `oracle-cloud` for
# the encrypted third backup copy.
#
# ⏱ 2026-09-24 — the identity stack moved from Box A (Oracle) to Box C
# (Hostinger), and Box A was wiped of the platform. `oracle-cloud` STAYS: it
# runs none of the services now, but its Object Storage still holds the
# encrypted third backup copy (duty.restic-third-copy in
# tooling/ops/register.json), and dropping a party that still holds data
# would under-disclose. Until this date the line above read "`oracle-cloud`
# for the identity stack (Box A), `hostinger` for the crash sink (Box B)".
#
# ⏱ 2026-09-11 — owner decision "Name Hostinger". Until then this list named
# oracle-cloud and omitted hostinger, the LIVE crash sink, while the portfolio
# policy §4 already named Hostinger: the rule above was applied to one vendor
# only (HANDOFF-stores REVIEW #12). Each processor here is also recorded in its
# register row's `namedIn`, so assert-policy-claims re-reads the rendered page
# for it on every run and a dropped row is a build failure, not a quiet edit.
#
# ⏱ 2026-09-25 — O-APP-PRIVACY-OMITS-STORE-BILLING. `billing.mobileIap` in
# app.yaml made RevenueCat, the Apple App Store and Google Play parties to a
# purchase, and this list did not name them. Which providers must appear here
# is now read from each register row's `requiredWhen`, evaluated against
# app.yaml and the laned channels of tooling/channel-register.json by
# tooling/legal/required-providers.mjs, and assert-app-yaml limb 9 fails a
# list that omits one. `supabase` is required by that rule until the Phase 5
# cutover: both Workers still point SUPABASE_URL at the HOSTED project (P4-2),
# a vendor, which the self-hosted stack above is not.
processors:
  - id: cloudflare
    role: infrastructure
    purpose: Serves the web app, runs the Workers and holds the D1 rows.
    source: tooling/legal/provider-register.json
    asOf: "2026-09-05"

  - id: oracle-cloud
    role: infrastructure
    purpose: Stores an encrypted copy of the backups; it runs none of the services.
    source: tooling/legal/provider-register.json
    asOf: "2026-09-24"

  - id: hostinger
    role: infrastructure
    purpose: Hosts the machines the self-hosted identity stack and crash-report service run on.
    source: tooling/legal/provider-register.json
    asOf: "2026-09-24"

  - id: supabase
    role: identity
    purpose: Runs the hosted account and sign-in service the app's servers are still configured to use.
    source: tooling/legal/provider-register.json
    asOf: "2026-09-25"

  - id: paddle
    role: merchant_of_record
    purpose: Takes the payment and is the seller of record for the web channel.
    source: tooling/legal/provider-register.json
    asOf: "2026-09-05"

  - id: revenuecat
    role: iap_aggregator
    purpose: Records which store purchase entitles the account to Pro, on our behalf; it is never the seller.
    source: tooling/legal/provider-register.json
    asOf: "2026-09-25"

  - id: apple-app-store
    role: store_billing
    purpose: Bills and delivers in-app purchases made through that store, under its own terms.
    source: tooling/legal/provider-register.json
    asOf: "2026-09-25"

  - id: google-play
    role: store_billing
    purpose: Bills and delivers in-app purchases made through that store, under its own terms.
    source: tooling/legal/provider-register.json
    asOf: "2026-09-25"

  - id: razorpay
    role: payment_gateway
    purpose: When you buy in India anywhere other than the Apple App Store or Google Play, Nikatru is the seller and Razorpay takes the payment as our payment gateway, processing your payment details on our behalf.
    source: tooling/legal/provider-register.json
    asOf: "2026-09-25"

  - id: resend
    role: email_delivery
    purpose: Delivers the transactional email an account needs to exist.
    source: tooling/legal/provider-register.json
    asOf: "2026-09-05"
