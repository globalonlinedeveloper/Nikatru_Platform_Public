# -Xmx4G, not 8G. The host has 16 GB, so WSL gets ~8 GB by default — an 8 GB
# Gradle heap is larger than the entire WSL VM and took it down with
# `Wsl/Service/E_UNEXPECTED` mid-build. 4 GB is ample for this app, leaves room
# for the Kotlin daemon, and changes nothing on CI runners (also 16 GB).
# Metaspace 4G was likewise over-provisioned; 1G is well above what it uses.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# --- AGP 9.0 removed the default ProGuard file a transitive plugin still asks for ---
# ASCII ONLY IN THIS FILE ON PURPOSE: Gradle reads gradle.properties as ISO-8859-1,
# so a non-ASCII comment character arrives mangled.
#
# android/settings.gradle.kts pins com.android.application 9.4.1. AGP 9.0 made
# getDefaultProguardFile('proguard-android.txt') throw, because that file carries
# -dontoptimize and so switches off most of R8. The replacement is
# proguard-android-optimize.txt, and every build.gradle IN THIS REPOSITORY already
# uses it -- the caller is not ours:
#
#   ~/.pub-cache/hosted/pub.dev/flutter_inappwebview_android-1.1.3/android/build.gradle:44
#
# flutter_inappwebview_android arrives transitively under cloudflare_turnstile
# (apps/subscriptiontracker/pubspec.yaml), which the Turnstile cutover declared and swore, so the
# package does not get removed to make a build green. AND THERE IS NO VERSION TO MOVE
# TO: 1.1.3 is the NEWEST release on pub.dev (measured 2026-09-07 -- every 1.1.x was
# published ~23 months ago) and upstream issue pichillilorenzo/flutter_inappwebview#2852
# is open with no released fix. A dependency bump is not on offer here.
#
# So this is AGP's own documented escape hatch, named in the AGP 9.0.0 release notes,
# and it is scoped to this Gradle build. IT IS A DATED WAIVER, NOT A PREFERENCE:
# delete this line the day flutter_inappwebview_android publishes a build.gradle that
# asks for proguard-android-optimize.txt. The day AGP removes the flag this build fails
# loudly rather than silently, which is the outcome we want.
android.r8.proguardAndroidTxt.disallowed=false
