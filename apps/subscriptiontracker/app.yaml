# ─────────────────────────────────────────────────────────────────────────────
# Subly — the app declaration. [ADR 067] decision 2: an app is app.yaml + its
# own screens.
#
# THIS FILE IS THE SOURCE. Do not edit anything it renders — change a value
# here and run:
#
#     node tooling/app-yaml/render.mjs
#
# It renders catalog/apps.json (the published catalogue, from which the live
# site's feed is generated in turn) and, in every store channel directory this
# app carries, title.txt · short-description.txt · category.txt ·
# privacy-policy-url.txt · support-url.txt, plus terms-of-use-url.txt in the
# two Apple channels, whose register rows declare it.
#
# It does NOT render, and must never render:
#   · the four SWORN declarations — android-play/data-safety.json,
#     content-rating.json, ads-declaration.json and ios-appstore/
#     privacy-manifest.json. They are statements about Subly's real code with
#     their own citations; [ADR 037]: "a sworn declaration regenerated by a
#     template is a statement nobody made."
#   · the EDITORIAL copy — long-description.txt, keywords.txt, subtitle.txt,
#     promotional-text.txt, search-terms.txt, snap-name.txt, license.txt.
#     Reviewed prose about what Subly actually does. Yours to sharpen.
# ─────────────────────────────────────────────────────────────────────────────

# 🔴 THE WHOLE IDENTIFIER FAMILY HAS MOVED, `id` INCLUDED. This paragraph
# replaces two earlier ones — the first said the identifiers were "deliberately
# not renamed", the second said `id` was a SEPARATE, SEQUENCED change. Both were
# true when written; the OWNER RULED OTHERWISE on 2026-09-09: one identifier
# family, no special cases. A stale paragraph is how a settled decision gets
# re-derived by the next reader, so both are gone rather than annotated.
#
# WHY THE SLUG HAD TO MOVE RATHER THAN THE PACKAGE ID ALONE: the package id is
# DERIVED from the slug, at assert-store-identity.mjs's `canonical()` and again
# at submit-play.mjs (architecture §24, `com.nikatru.${id}`). The rejected
# alternative was declaring the package id separately here, which decouples it
# from the slug and rewrites a locked rule for every future app to save one URL
# hyphen. The slug moved instead, and the derivation rule is untouched.
#
# WHY `subscriptiontracker` AND NOT `subscription-tracker`: services/platform/
# src/config.ts's APP_ID_PATTERN is /^[a-z][a-z0-9_]{0,31}$/ — NO HYPHENS — and
# it is a SILENT FILTER at buildRegistry (:205): a hyphenated slug would not
# throw, it would simply stop being served. Android package SEGMENTS forbid
# hyphens too. One spelling satisfies both.
#
# WHAT MOVED, and why it had to move NOW: every store identifier below is bound
# PERMANENTLY and unreclaimably at the FIRST upload on its channel, and on
# 2026-09-09 not one of them was claimed (Play 404, iTunes lookup resultCount 0
# against a green Gmail control, snap 404 against a green firefox control).
# That window is the whole reason for the sequencing.
#
#   subscriptiontracker               this `id` — the repo directory, the
#                                     Cloudflare Pages project, the Worker name
#                                     `subscriptiontracker-api`, the analytics
#                                     `app_id`, and nikatru.com/<id>
#   com.nikatru.subscriptiontracker   Android applicationId + namespace,
#                                     iOS + macOS bundle id, Linux APPLICATION_ID
#   subscription-tracker              Linux BINARY_NAME
#   nikatru-subscription-tracker      the snap name
#
# ⚠️ WHAT DELIBERATELY DID NOT MOVE, because each is a LIVE resource whose
# rename is a data migration and not a declaration edit. Renaming these here
# would not rename them in the account; it would point this file at something
# that does not exist. Each is owed as its own change:
#
#   subly_db                 MOVED 2026-09-11 ([ADR 079]): the rows were copied
#                            to `subscriptiontracker_db` (verified identical) and
#                            every binding moved. The old database is kept,
#                            unbound, until the owner deletes it.
#   subly.nikatru.com        REMOVED 2026-09-11 ([ADR 079]): its DNS records, its
#                            zone 301 and the /subly path redirects were deleted
#                            on the owner's word; old links no longer resolve.
#   api-subly.nikatru.com    same, for the API host.
#   subly@<version>          historical GlitchTip release stamps, and SUBLY-8/9/A
#                            are GlitchTip ISSUE ids. Records of what happened.
#                            Rewriting them would falsify the citation.
id: subscriptiontracker
name: Nikatru Subscription Tracker
# The ICON label. Shares the token `Subscription(s)` with `name` per Apple
# QA1892, and is what a home screen has room for — see the schema.
shortName: Subscriptions
tagline: Track every subscription in one place
category: Productivity
# 🔴 `live` THROUGHOUT THE SLUG MIGRATION, AND `preview` WAS TRIED AND REJECTED.
# assert-catalog-reachable.mjs probes every `live` row and offers `preview` as the
# way to stop advertising an address that does not answer yet. Taking that offer
# was measured on 2026-09-09 and it is WRONG FOR AN APP THAT IS ALREADY SHIPPED:
# with 0 live rows the discovery generator drops the app from the sitemap, from
# llms.txt and from the apps hub, check-site-integrity.mjs then refuses the
# hand-maintained homepage APPS array for naming an app the registry does not
# call live, and discovery-surface.test.mjs's homepage case loses its subject and
# reports COVERAGE LOST. `preview` here means "never been live"; it is not a
# transitional state, and using it would take a working app off the public site
# for the length of a migration.
#
# The address is made to answer BEFORE this lands instead — see `_redirects` in
# sites/nikatru, and the pull request for the sequencing.
status: live

# No DNS record is created BY HAND for either host: the API host is bound by the
# Worker deploy (`custom_domain: true` writes the record and the certificate) and
# the web origin by its own project. What a host needs is ATTACHMENT, not a
# record. [ADR 006]'s proxied wildcard *.nikatru.com was the old reason; [ADR 080]
# section 4 deleted it on 2026-09-12, so an unattached host is now NXDOMAIN.
hosts:
  # [ADR 079] `subly.nikatru.com` was DELETED on 2026-09-11 (owner: "Rename all,
  # remove redirects too"), so it is no longer this app's origin host. The app's
  # own origin IS its Pages project, declared twice on purpose: `web` is the
  # schema's required origin field and `pagesOrigin` the field the router reads.
  web: subscriptiontracker-7qg.pages.dev
  # WHERE THE APEX ROUTER FETCHES THE BYTES. Not derivable and deliberately
  # declared: Cloudflare assigns the *.pages.dev subdomain AT PROJECT CREATION
  # and appends a suffix when the bare name is taken -- the retired project was
  # created as `subly` and got `subly-9cp.pages.dev`, which is why `<id>.pages.
  # dev` was never a safe derivation here. It is preferred over `web` because
  # *.pages.dev sits OUTSIDE the nikatru.com zone, so the Redirect Rule that
  # 301s the retired subdomain cannot match the router's own proxy subrequest.
  #
  # 🔴 THIS MOVES WITH THE SLUG, BECAUSE THE DEPLOY TARGET DOES.
  # deploy-web.yml deploys with `--project-name=${{ matrix.app }}`, and the
  # matrix is the workspace app set -- the DIRECTORY name. Renaming
  # `apps/subly` to `apps/subscriptiontracker` therefore re-points the deploy at
  # a Pages project called `subscriptiontracker`, and leaving this line on the
  # old project would make the router proxy bytes nothing deploys to any more.
  # That failure is a WHITE PAGE, not an error: the old project's index.html
  # still answers 200 with `<base href="/subly/">`, every asset resolves to a
  # path the router no longer claims, and the app never boots.
  #
  # MEASURED 2026-09-09, READ BACK FROM THE API AND NOT ASSUMED:
  #   POST /accounts/{a}/pages/projects {"name":"subscriptiontracker"}
  #     -> result.subdomain = subscriptiontracker-7qg.pages.dev
  # The `-7qg` suffix is Cloudflare's, appended because the bare name was taken:
  # `subscriptiontracker.pages.dev` answers HTTP 200 and belongs to a THIRD
  # PARTY (a different Supabase backend). So `<id>.pages.dev` is not merely
  # underived here, it is somebody else's origin, and guessing it would have
  # proxied this app's address to a stranger's app. Red control on the same run:
  # `subscriptiontracker-7qg.pages.dev` answered 522 until the first deployment
  # existed, which is what proves the suffix was newly minted for this account.
  pagesOrigin: subscriptiontracker-7qg.pages.dev
  api: subscriptiontracker-api.nikatru.com

platforms:
  - web

# The store builds (android-play, ios-appstore, macos-appstore) sell in-app
# through RevenueCat. The ids are RevenueCat's own app ids — the Play Store app
# and the App Store app; the App Store app also serves macOS (one App Store
# Connect record, universal purchase), which is why there is no macos key.
# The PUBLIC SDK key is not here: the store lanes compile it in as
# `--dart-define=REVENUECAT_KEY` (tooling/channel-register.json
# `purchaseRails.storeKeyDefine`). `assert-app-yaml` limb 6 holds this block,
# the nikatru_billing_revenuecat dependency and the store declarations together.
billing:
  mobileIap:
    provider: revenuecat
    entitlementId: pro
    revenuecatAppIds:
      android: appa553a1e2c6
      ios: app805d73cd44

# Keyed by tooling/channel-register.json's `storefrontKey`. `web` is derived
# from hosts.web and is refused here. Every other key is absent until a store
# issues a real listing URL — the renderer writes null, because a plausible
# invented URL is a link a stranger follows into a 404.
listings:

legal:
  privacyPolicyUrl: https://nikatru.com/privacy
  supportUrl: https://nikatru.com/contact
  termsUrl: https://nikatru.com/terms

# O-PLAY-AI-CONTENT-REPORTING. Required of every app, false included. This app
# tracks subscriptions and generates nothing with AI; assert-app-yaml limb 7
# holds that answer to the content-rating `generates-ai-content` claim, whose
# tells fail the day an AI package becomes a dependency.
ai:
  generatesContent: false

# O-APPLE-PLIST-KEYS-UNRENDERED. Required of every app, false included: it is a
# legal answer, rendered into ITSAppUsesNonExemptEncryption in both Info.plists.
# Measured at Public main 80ef8e39 and re-measured 2026-09-25 (design
# apple-plist-keys section 1). assert-app-yaml limb 8 holds a false to the code.
exportCompliance:
  usesNonExemptEncryption: false
  basis: >-
    OS-provided HTTPS for transport, Ed25519 signature verify of content packs,
    sha256 hashing, the OS keychain and JWT verify only; no first-party cipher.
    All of it falls inside the exemption for authentication, digital signatures
    and hashing.
