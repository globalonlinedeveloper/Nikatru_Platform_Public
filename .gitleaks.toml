# gitleaks configuration — the credential shapes THIS repo actually uses.
#
# WHY THIS EXISTS. Until 2026-07-28 the scan ran on gitleaks' DEFAULT rules only.
# Those cover GitHub tokens (`ghp_`, `github_pat_`) and generic private keys, and
# the wrapper's self-test plants a PEM private key — so everything reported green.
#
# But the vault holds three vendors, and the defaults knew one of them:
#
#   ghp_…              GitHub PAT              -> caught by the default rules
#   cfut_…             Cloudflare API token    -> NO default rule
#   sbp_…              Supabase PAT            -> NO default rule
#   sb_publishable_…   Supabase publishable    -> NO default rule
#
# The one the scanner could catch is the least dangerous of the three. A leaked
# Cloudflare token can delete the D1 databases, the Workers and the DNS records,
# including the *.nikatru.com wildcard. F-6 ("nothing private can enter the
# public repository, and that is asserted") read VERIFIED while two of three
# vendors were unasserted.
#
# ⚠️ PREFIX-ANCHORED ON PURPOSE. A rule like "40 chars of base62" matches commit
# SHAs, base64 blobs and lockfile integrity hashes, and a scanner that cries wolf
# gets muted or allowlisted — and every allowlist entry is a permanent hole. Each
# rule below requires a vendor-specific prefix, so a hit is almost certainly real.
#
# ⚠️ THE SELF-TEST MUST PLANT ONE OF EACH. tooling/ci/scan-secrets.mjs plants a
# canary per rule below and fails if any goes undetected. Adding a rule here
# without a canary there means the rule is never proven to fire — which is the
# same "assertion that cannot fail" this repo keeps finding.

title = "NIKATRU secret scanning"

[extend]
# Keep every default rule; these are additions, never replacements. Dropping
# useDefault would silently un-cover GitHub tokens and private keys.
useDefault = true

[[rules]]
id = "nikatru-cloudflare-api-token"
description = "Cloudflare API token (cfut_/cfat_/cfk_ prefix)"
regex = '''\b(cfut|cfat|cfk)_[A-Za-z0-9_-]{30,}'''
keywords = ["cfut_", "cfat_", "cfk_"]

[[rules]]
id = "nikatru-supabase-pat"
description = "Supabase personal access token (sbp_ prefix)"
regex = '''\bsbp_[A-Za-z0-9]{36,}'''
keywords = ["sbp_"]

# ⚠️ NO RULE FOR `sb_publishable_`, DELIBERATELY — and this is the interesting one.
# A first draft included it. Running the real scanner immediately flagged the live
# publishable key in company/PROJECT_STATE.md, which is CORRECT USAGE: a Supabase
# publishable key is public by design and ships compiled into the web bundle as
# SUPABASE_ANON_KEY. Vendor naming says so out loud.
#
# So the rule would fire on every legitimate mention, someone would allowlist it,
# and the allowlist entry would be a permanent hole. A scanner that cries wolf
# gets muted — which is worse than one rule fewer. Written down so the "missing"
# prefix reads as a decision rather than an oversight.

[[rules]]
id = "nikatru-supabase-secret-key"
description = "Supabase secret key (sb_secret_ prefix)"
regex = '''\bsb_secret_[A-Za-z0-9_-]{20,}'''
keywords = ["sb_secret_"]

# ── THE MONEY RAIL — [pipeline 5]M-1/M-12, [ADR 004] ─────────────────────────
# Added 2026-08-01 with the merchant-of-record webhook. These do not exist yet
# (OWNER_QUEUE A-1 is pending), and that is exactly when to add the rule: the
# scanner has to be ready BEFORE the credential does, or the first time anybody
# handles one is the first time it is unguarded.
#
# The webhook destination secret is the highest-value credential this repo will
# ever touch. It is not a read token — anyone holding it can SIGN a notification,
# and a correctly signed notification writes the shared entitlements table. A leak
# is a stranger granting themselves, and anyone else, a paid subscription.
#
# ⚠️ THE SANDBOX KEY IS SCANNED TOO, and that is not belt-and-braces: [5]M-12 is
# about the two worlds never mixing, and a sandbox key committed "because it is
# only sandbox" is how the habit forms. Prefixes verified against
# developer.paddle.com on 2026-08-01 (signature-verification ·
# api-reference/about/authentication · sdks/sandbox).
#
# ⚠️ NO RULE FOR THE CLIENT-SIDE TOKEN, deliberately, and for the same reason
# `sb_publishable_` has none: Paddle's client-side token is PUBLIC by design and
# ships in the web bundle. A rule for it would fire on every legitimate use,
# somebody would allowlist it, and the allowlist entry would be a permanent hole.

[[rules]]
id = "nikatru-paddle-notification-secret"
description = "Paddle webhook destination secret (pdl_ntfset_ prefix) — signs entitlement writes"
regex = '''\bpdl_ntfset_[A-Za-z0-9]{20,}'''
keywords = ["pdl_ntfset_"]

[[rules]]
id = "nikatru-paddle-live-api-key"
description = "Paddle LIVE API key (pdl_live_apikey_ prefix)"
regex = '''\bpdl_live_apikey_[A-Za-z0-9]{20,}'''
keywords = ["pdl_live_apikey_"]

[[rules]]
id = "nikatru-paddle-sandbox-api-key"
description = "Paddle SANDBOX API key (pdl_sdbx_apikey_ prefix) — scanned too, see [5]M-12"
regex = '''\bpdl_sdbx_apikey_[A-Za-z0-9]{20,}'''
keywords = ["pdl_sdbx_apikey_"]

# ─────────────────────────────────────────────────────────────────────────────
# INDIAN PII. Added 2026-08-05 after the proprietor's REAL PAN was found committed
# to this public repository in packages/telemetry/test/pii_scrubber_test.dart —
# the PII scrubber's own test fixture, live on origin/main since 82a309d.
#
# 🔴 WHY THE EXISTING CONTROLS ALL PASSED, because that is the reason these rules
# exist rather than a one-line fixture swap:
#   · .gitignore excludes Personal/ and says why in its own comment — "these carry
#     PAN, salary figures and date of birth, and origin is a PUBLIC repository".
#     That control is PATH-based. This was a string literal in ordinary source.
#   · Every rule above this block is a CREDENTIAL rule. A credential scanner has
#     no opinion about a national identity number.
# So a green ci-gate and 100+ guards were fully consistent with a PAN in the tree.
# The class was unguarded, not the instance.
#
# ⚠️ THESE ARE SHAPE RULES AND WILL MATCH SYNTHETIC VALUES TOO. That is deliberate
# and is the correct trade: the alternative is allowlisting real values, which
# means writing them down here. Test fixtures must use the documented placeholders
# below, which are allowlisted by exact value — anything else is a finding.
# ─────────────────────────────────────────────────────────────────────────────

[[rules]]
id = "nikatru-india-pan"
description = "Indian PAN (5 letters, 4 digits, 1 letter) — a national identity number, never a test fixture"
regex = '''\b[A-Z]{5}[0-9]{4}[A-Z]\b'''
keywords = []
  [rules.allowlist]
  # EXACTLY the placeholder the tree actually uses, and no more. A second, all-A
  # entry was here and was used by nothing — a permanent hole in the net with zero
  # users, which is the same shape as an assertion that cannot fail. Add one when
  # something needs it, in the change that needs it.
  #
  # ⚠️ AND DO NOT SPELL THE REMOVED VALUE OUT IN THIS COMMENT. Naming it made this
  # file a finding in its own scan — the same trap scan-secrets.mjs documents for
  # its PEM canary. A rule's own documentation is inside the rule's blast radius.
  description = "The canonical documentation placeholder, used by packages/telemetry/test/pii_scrubber_test.dart. A real PAN must never be added here."
  regexes = ['''\bABCDE1234F\b''']

[[rules]]
id = "nikatru-india-gstin"
description = "Indian GSTIN — embeds the PAN as characters 3-12, so leaking it leaks the PAN"
regex = '''\b[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][0-9A-Z]{3}\b'''
keywords = []

[[rules]]
id = "nikatru-india-aadhaar"
# The leading [2-9] is not a shortcut, it is the UIDAI numbering rule: no issued
# Aadhaar begins 0 or 1. That is also why this rule needs NO allowlist. Every
# fixture in packages/telemetry/test/pii_scrubber_test.dart begins with 1
# (1234 5678 9012, 1111-2222-3333), so they are outside the real value space BY
# CONSTRUCTION and this rule cannot match them.
#
# An allowlist for exactly those fixtures was here, and it was DEAD: the rule it
# guarded could never match the strings it exempted, so it protected nothing
# while looking like protection. Deleted rather than kept "for safety" — being
# unmatchable by the rule is a stronger guarantee than being excused by it.
#
# 🔴 THE `\b`-ONLY FORM OF THIS RULE FIRED ON FIVE CLASSES OF TRACKED FILE and
# would have reddened every build. Measured with the real scanner, not guessed:
#   · every UUID test fixture — a UUID's first two groups are eight digits then a
#     hyphen then four more, which IS the 4-4-4 Aadhaar shape
#   · sites/nikatru/contact.html — the business's own published phone number, a
#     country code plus ten digits behind a `+`, is twelve digits
# (The offending literals are deliberately NOT written out here. Spelling them in
# this comment made this file a finding in its own scan, twice.)
# `\b` does not help: a digit run bounded by `-` or `+` has word boundaries on
# both sides. Go's RE2 has NO lookaround, so the boundary is CAPTURED instead and
# `secretGroup` reports only the number. A rule that fires on good input is how a
# check gets deleted, or allowlisted until it guards nothing.
#
# ⚠️ DELIBERATELY NARROWER THAN THE RUNTIME SCRUBBER, which uses
# `\b\d{4}[\s-]?\d{4}[\s-]?\d{4}\b` with no leading-digit constraint and
# over-redacts on purpose. The cost profiles are opposite: a runtime redactor
# that over-matches costs one unreadable field in a crash report, while a
# commit-blocking scanner that over-matches blocks every branch. Same fact, two
# tools, two correct answers — do not "align" them.
# 🔴 TWO MORE BOUNDARY GUARDS, ADDED 2026-09-05 WITH THE EXTENSIONS SUBTREE
# ([ADR 067] decision 1). The form above — a leading class that excludes a digit,
# a `+` or a `-` — is NOT enough once extensions/ is in the tree, and this was
# measured with the real scanner rather than reasoned about:
#
#     node tooling/ci/scan-secrets.mjs .   ->  55 hits, ALL of them
#     nikatru-india-aadhaar, ALL under extensions/, 51 of them in
#     Full_Screen_Shot's redaction test fixtures.
#
# Not one is an Aadhaar. They are PAYMENT-CARD and ORDER-ID fixtures: the middle
# three groups of `4242 4242 4242 4242` ARE the 4-4-4 Aadhaar shape, and the
# character before them is a SPACE, which the leading class above permits. A rule
# that reddens every branch is a rule somebody deletes, or allowlists until it
# guards nothing — so the fix is to make the rule unable to match, never to
# excuse 51 strings by name.
#
# The two guards are carried across verbatim in MEANING from
# extensions/scripts/secret-scan.mjs, where the same 51 hits were measured on the
# same fixtures and the same fix took them to 0 of 540:
#
#     not a continuation of an earlier 4-digit group   (nothing like "…2 " before)
#     not continued by a later one                     (nothing like " 4…" after)
#
# ⚠️ EXPRESSED WITH CAPTURED BOUNDARIES, NOT LOOKAROUND. Go's RE2 has no
# lookaround at all, so the JS scanner's `(?<![0-9][ -])` / `(?![ -]?[0-9])` are
# spelled here as alternations over the neighbouring characters. `secretGroup = 1`
# still names the number itself, so the finding prints the value and not the
# padding. Since a `-` neighbour is already excluded by the classes, only the
# SPACE case needs the extra arm on each side.
#
# ⚠️ KNOWN, ACCEPTED FALSE NEGATIVE, stated here rather than discovered later: a
# real Aadhaar written immediately after another digit run and a single space
# ("560001 2345 6789 0123") is now skipped. That is the price of not firing on
# every card fixture in the repository, and for a gate that blocks commits it is
# the right side to fail on. The runtime scrubber in packages/telemetry is
# deliberately wider and stays wider — see the note above.
#
# MUTATION-PROVEN 2026-09-05, green control first: with the rule below, the whole
# merged tree scans clean; planting `>2345 6789 0123<` into an extension fixture
# reddens the scan naming that file; removing it returns the scan to green. The
# canary in tooling/ci/scan-secrets.mjs (`AADHAAR=999988887777`, preceded by `=`)
# is still matched, so the rule is still proven to fire.
description = "Indian Aadhaar (12 digits, optionally 4-4-4 grouped; UIDAI never issues one starting 0 or 1)"
regex = '''(?:^|^ |[^0-9] |[^ 0-9A-Za-z+-])([2-9][0-9]{3}[ -]?[0-9]{4}[ -]?[0-9]{4})(?:$|[ ]$|[ ][^0-9]|[^ 0-9A-Za-z-])'''
secretGroup = 1
keywords = []
  [rules.allowlist]
  # ONE hole, and it is load-bearing. This fixture is Aadhaar-shaped ON PURPOSE:
  # it pins the runtime scrubber's accepted over-redaction ("a 12-digit order id
  # is redacted even though it is not an Aadhaar"), so making it un-Aadhaar-like
  # to please this scanner would delete the test's entire subject.
  description = "packages/telemetry/test/pii_scrubber_test.dart — the deliberately Aadhaar-shaped order id that pins the scrubber's fail-closed over-redaction."
  regexes = ['''\b480000123456\b''']
