# none of them in the shipped app. They were there before; nothing read them. They are
# moved by an AGP / Kotlin / Gradle bump, not by an edit here, so each is acknowledged
# for ONE MONTH: on 2026-10-31 the daily scan of main reddens on whatever is left.
# REVIEWED (PR #1154, 2026-10-02): the ignores stay, rather than
# `--experimental-disable-plugins` for the verification-metadata extractor, which
# would hide them. From 14 days before the date, scan-dependencies.mjs prints a
# warning naming every id still here (EXPIRY_WARN_DAYS), on every PR and on the
# daily scan; the owner row is O-OSV-BUILD-CLASSPATH-IGNORES-EXPIRE-2026-10-31
# (the toolchain-bump lane). ⚠️ An ignore is by GHSA id across ALL lockfiles, not
