# OSV-Scanner findings that are ACKNOWLEDGED AND DATED, never waived.
#
# Read by tooling/ci/scan-dependencies.mjs, which runs `osv-scanner scan source
# -r --config <this file>` in ci.yml's security-scan lane (every pull request and
# push) and in ops-watch.yml's heartbeats job (main, daily at 07:30 UTC).
#
# [rv2-security-004] A PULL REQUEST is graded only on the lockfiles it changed:
# an advisory in a lockfile it did not touch is printed and owned by the daily
# scan of main. A pull request that changes THIS FILE is graded on every
# lockfile, so adding or removing an entry here is judged against the whole tree.
#
# ⚠️ [rv2-security-018] THE CANARY RUNS WITH THIS FILE TOO. Before the tree is
# scanned, the script hands OSV a canary lockfile per tracked format (lodash
# 4.17.4; Dart http 0.13.0) and refuses (exit 2) unless each is flagged. An entry
# here that ignores a canary's advisory, or a [[PackageOverrides]] that ignores a
# whole ecosystem, fails that canary ON PURPOSE: it would blind the tree the same
# way. Acknowledge the ONE advisory you mean, by id, with an ignoreUntil.
#
# Every entry carries an `ignoreUntil`. When that date passes the finding
# reddens the lane again, so an entry left here by accident becomes loud
# instead of permanent. An entry with no expiry does not belong in this file.
#
# ── THIS FILE IS DELIBERATELY EMPTY OF ENTRIES, 2026-09-05 ───────────────────
# It held four, all dated 2026-09-19, all dev dependencies of packages/tokens:
# brace-expansion 5.0.7 (GHSA-mh99-v99m-4gvg, GHSA-rgw5-rvv9-x895) and qs 6.15.3
# (GHSA-4mjr-xmp4-gh2g, GHSA-x5fp-wj9c-mxmx). They were recorded rather than
# fixed because the change that added the scanner did not own packages/, and a
# lockfile bump belongs in the same commit as the install that produced it.
#
# That commit is this one. Both are transitive — minimatch declares
# `brace-expansion: ^5.0.5` and url declares `qs: ^6.12.3` — so the fix is
# `npm update brace-expansion qs` inside packages/tokens, which moves them to
# 5.0.9 and 6.16.0 inside the existing ranges. No direct devDependency was added
# for either: a direct pin on a package nothing imports would be a second thing
# to remember, and the ranges already permit the fixed versions.
#
# ⚠️ AN EMPTY FILE IS NOT A DEAD FILE. OSV-Scanner resolves this by its own
# default name and scan-dependencies.mjs passes it explicitly with `--config`
# (without which v2 resolves a config per lockfile DIRECTORY, loads the root
# file, prints "unused ignores" and ignores nothing for
# packages/tokens/package-lock.json — measured, run 33960900452). Deleting this
# file would make that flag point at nothing, so it stays, and the next
# acknowledged finding is appended below with its own `ignoreUntil`.

# ⏱ 2026-10-01 21:35Z (lead db0cc7): main went red on the day GHSA-86w9-cpqp-85rv was published (CI run 36929041146).
# node-forge <= 1.4.0, RSA PKCS#1 v1.5 signature verification accepts extra nested DigestAlgorithm elements (high).
# NO PATCHED RELEASE EXISTS (1.4.0 is the newest on npm; the advisory names no fixed version), so it cannot be moved today.
# Exposure: a TRANSITIVE devDependency of web-ext 10.7.0 in tooling/web-ext ONLY (the Firefox lint and the AMO signer,
# run in CI). It is in no app, Worker, site or extension package and verifies no user-supplied signature.
# Fix when node-forge publishes one: `npm update node-forge --prefix tooling/web-ext` (or a web-ext bump), and delete
# this entry in the same commit. The expiry re-reddens the lane if that has not happened.
