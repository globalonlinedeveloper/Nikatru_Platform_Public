<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>claim-e2e — PII inside a CLOSED shadow root, plain nav outside</title>
<!-- SPEC §7.1 I / §5.4. `attachShadow({mode:'closed'})` is a door that cannot
     be opened: `host.shadowRoot` is null. §5.4 is explicit that this is a
     genuine reach limit AND that a door you did not open is still countable —
     "custom elements whose shadowRoot is null" are named there. But §2.1 gives
     a counter only for iframes (`frames{sameOrigin, scanned, crossOrigin}`).
     So the honest outcome is specified in prose and unspecified in the ledger.
     The suite grades what the spec does fix (no positive claim over content
     FullShot could not read) and records the missing counter as a question. -->
<style>
  html, body { margin: 0; background: #fff; font: 16px/1.5 system-ui, sans-serif; }
  #nav { background: rgb(35, 45, 70); color: #fff; padding: 18px 24px; }
  .band { height: 300px; background: rgb(238, 240, 248); }
  #bottom { height: 152px; background: rgb(0, 136, 255); }
</style>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var host = document.getElementById('app');
  var root = host.attachShadow({ mode: 'closed' });
  root.innerHTML =
    '<style>' +
    '  .card { padding: 30px 24px; font: 600 20px/1.6 ui-monospace, monospace; }' +
    '  .mark { font: 600 20px/1 ui-monospace, monospace; }' +
    '  .email { background: rgb(255, 90, 90); color: #300; }' +
    '  .card2 { background: rgb(90, 130, 255); color: #0b2a6b; }' +
    '</style>' +
    '<div class="card">Statement recipient: <span class="mark email">jane.doe@example.com</span></div>' +
    '<div class="card">Card ending <span class="mark card2">4242 4242 4242 4242</span></div>';
});
</script>
</head>
<body>
  <div id="nav">Dashboard &nbsp; Reports &nbsp; Billing &nbsp; Settings &nbsp; Help centre and product documentation</div>
  <div class="band"></div>
  <div id="app"></div>
  <div class="band"></div>
  <div class="band"></div>
  <div id="bottom"></div>
</body>
</html>
