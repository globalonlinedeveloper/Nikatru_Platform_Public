<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>claim-e2e — SVG &lt;text&gt;, whole and split across &lt;tspan&gt;s</title>
<!-- Task shape: SVG <text>. SPEC §5.1 / §7.1 H.
     Two cases on one page, and the difference between them is the point:
       A. <text> whose only child is a text node — a childless element with
          text, a real rect, a real font-size. It should be fed, matched,
          boxed, painted and verified.
       B. <text> whose digits are split across <tspan>s — each tspan is fed
          separately and the card number is never seen whole. Nothing is
          matched; the number stays visible in the PNG.
     B is a standing width-of-the-instrument limit, not a page shape to be
     enumerated (§5.1). What must NOT happen is B being described to the user
     as a finding about the page: §3.3 fixes the wording as "matched none of
     the five patterns it looks for", never "found nothing to hide".
     The marker <rect> is sized to the glyph band rather than the plate, so
     "colour gone" is a statement about the text being covered. -->
<style>
  html, body { margin: 0; background: #fff; font: 16px/1.5 system-ui, sans-serif; }
  .band { height: 240px; background: rgb(238, 241, 249); }
  svg { display: block; }
  #bottom { height: 152px; background: rgb(0, 136, 255); }
</style>
</head>
<body>
  <div class="band"></div>

  <svg width="1100" height="80" viewBox="0 0 1100 80" xmlns="http://www.w3.org/2000/svg">
    <rect x="30" y="28" width="230" height="20" fill="rgb(255,90,90)"></rect>
    <text x="24" y="48" font-family="system-ui, sans-serif" font-size="30" fill="#300">jane.doe@example.com</text>
  </svg>

  <div class="band"></div>

  <svg width="1100" height="80" viewBox="0 0 1100 80" xmlns="http://www.w3.org/2000/svg">
    <rect x="30" y="28" width="230" height="20" fill="rgb(90,130,255)"></rect>
    <text x="24" y="48" font-family="ui-monospace, monospace" font-size="30" fill="#0b2a6b"><tspan>4242 </tspan><tspan>4242 </tspan><tspan>4242 </tspan><tspan>4242</tspan></text>
  </svg>

  <div class="band"></div>
  <div id="bottom"></div>
</body>
</html>
