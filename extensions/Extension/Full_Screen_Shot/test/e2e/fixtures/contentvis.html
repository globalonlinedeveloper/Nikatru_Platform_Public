<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>claim-e2e — content-visibility:auto sections, one holding PII</title>
<!-- SPEC E14 / §7.1 D — "the inverse failure". Wikipedia, MDN and most modern
     CMS templates ship this.
     An off-screen `content-visibility: auto` subtree is not laid out, so at
     scan time its descendants report a 0x0 rect and are counted unplaced for
     the `degenerate` reason: the clause says "not in the picture" about
     content that BECOMES the picture during the scroll loop.
     §2.3(b) is the answer: re-measure the degenerate set after the last frame
     and before FS_DONE, and re-run the detector on any span that is now
     placed. Without §2.3(b) this page reports `read-no-match`, `pixels:
     "baked"`, with the address plainly in the PNG.
     The secret section sits at index 18 of 24 — roughly 12,000px down — so it
     is well outside Chromium's rendering margin at scan time even after the
     pre-scroll passes have run the length of the document. A first draft put
     it at index 7 and the engine scanned it anyway; that is exactly the kind
     of thing only a real engine will tell you.
     The generator lives in <head> so no body <script> changes what `fed`
     counts; the layout it produces is real either way. -->
<style>
  html, body { margin: 0; background: #fff; font: 17px/1.6 system-ui, sans-serif; }
  #intro { padding: 28px 24px; background: rgb(244, 246, 252); color: #223; }
  section { content-visibility: auto; contain-intrinsic-size: 0 520px; padding: 24px; }
  section:nth-of-type(odd) { background: rgb(236, 240, 250); }
  section:nth-of-type(even) { background: rgb(226, 232, 246); }
  section.secret { background: rgb(160, 110, 255); color: #10002b; }
  .mark { font: 600 20px/1 ui-monospace, monospace; background: rgb(255, 90, 90); color: #300; }
  h2 { margin: 0 0 12px; font-size: 22px; }
  p { margin: 0 0 14px; }
  #bottom { height: 152px; background: rgb(0, 136, 255); }
</style>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var TOPICS = ['Provisioning', 'Rotation', 'Backups', 'Monitoring', 'Capacity', 'Change control',
    'Retention', 'Indexing', 'Sharding', 'Failover', 'Quotas', 'Throttling', 'Auditing',
    'Encryption', 'Peering', 'Caching', 'Compaction', 'Escalation', 'Deprecation',
    'Migration', 'Telemetry', 'Sampling', 'Archival', 'Decommissioning'];
  var BODY = [
    'Requests are queued per region and drained by the scheduler in arrival order. Retries are capped and the backoff is exponential with jitter.',
    'Operators may pin a queue for maintenance; pinned queues drain but accept nothing new until they are released by the duty rota.',
    'Every surface emits the same three counters so dashboards can be built once and reused across teams without a second integration.',
    'Headroom is reviewed monthly against the ninety-fifth percentile rather than the mean, because the mean has never once predicted an outage here.'
  ];
  var host = document.getElementById('sections');
  var frag = document.createDocumentFragment();
  for (var i = 0; i < TOPICS.length; i++) {
    var s = document.createElement('section');
    var h = document.createElement('h2');
    h.textContent = TOPICS[i];
    s.appendChild(h);
    if (TOPICS[i] === 'Escalation') {
      s.className = 'secret';
      /* the PII rides on a tight marker span so "covered / not covered" is
         decidable from the delivered PNG — the section's own purple background
         would survive a block over the text and prove nothing */
      var p1 = document.createElement('p');
      var m = document.createElement('span');
      m.className = 'mark';
      m.textContent = 'jane.doe@example.com';
      p1.appendChild(document.createTextNode('Out-of-hours escalation goes to '));
      p1.appendChild(m);
      var p2 = document.createElement('p');
      p2.textContent = 'This section is off-screen and unlaid-out at scan time, and fully rendered by the time the last frame is grabbed.';
      s.appendChild(p1); s.appendChild(p2);
    } else {
      for (var k = 0; k < 3; k++) {
        var p = document.createElement('p');
        p.textContent = BODY[(i + k) % BODY.length];
        s.appendChild(p);
      }
    }
    frag.appendChild(s);
  }
  host.appendChild(frag);
});
</script>
</head>
<body>
  <div id="intro">Knowledge base index. Sections below use content-visibility:auto, so the browser skips laying them out until they approach the viewport. At scan time their contents have no box at all.</div>
  <div id="sections"></div>
  <div id="bottom"></div>
</body>
</html>
