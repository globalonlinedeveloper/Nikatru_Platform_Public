<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>claim-e2e — inline &lt;style&gt; and &lt;script&gt; are the page's only strings</title>
<!-- SPEC E2 / §4.3. This is escape #3 given its own page: the only text nodes
     in the body belong to a <style> and a <script>. Both are display:none, so
     both have a 0x0 rect and must fail the placement measurement.
     The tell is deliberate: the inline script SOURCE contains an email and a
     Luhn-valid card. If the detector's character count is reading script text
     as "the page's text", `matched` goes above zero on a page a human sees no
     PII on — which is the counter reading source code and calling it content.
     No tag list is being tested here. Nothing in the design is allowed to
     mention <script>; the 0x0 rect is what must do the work. -->
<style>
  html, body { margin: 0; background: #f7f7fb; }
  .band { height: 320px; }
  .a { background: rgb(150, 200, 190); }
  .b { background: rgb(120, 175, 165); }
  #bottom { height: 152px; background: rgb(0, 136, 255); }
</style>
</head>
<body>
  <div class="band a"></div>
  <div class="band b"></div>
  <style>
    /* An inline stylesheet in the body: a real page shape (CMS blocks, email
       templates, AMP). Several hundred characters of source that is not text. */
    .promo-card { border: 1px solid #ccd; border-radius: 8px; padding: 12px 16px; }
    .promo-card__title { font: 600 18px/1.3 system-ui, sans-serif; color: #223; }
    .promo-card__body { font: 400 14px/1.5 system-ui, sans-serif; color: #445; }
    .promo-card--wide { grid-column: span 2; }
    .promo-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
    @media (max-width: 720px) { .promo-grid { grid-template-columns: 1fr; } }
    .promo-card:hover { box-shadow: 0 2px 8px rgba(0, 0, 0, .12); transform: translateY(-1px); }
  </style>
  <div class="band a"></div>
  <script>
    /* Inline application source in the body. If this reaches the detector as
       "page text", the email and the card below will match and the ledger will
       say so — which is the bug, visible as a number instead of as a guess. */
    window.__appConfig = {
      supportEmail: 'support@example.com',
      testCard: '4242 4242 4242 4242',
      billingPhone: '+1 (555) 123-4567',
      retries: 3, timeoutMs: 8000
    };
  </script>
  <div class="band b"></div>
  <div id="bottom"></div>
</body>
</html>
