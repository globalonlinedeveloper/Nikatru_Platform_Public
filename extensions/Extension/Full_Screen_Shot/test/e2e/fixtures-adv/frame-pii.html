<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Embedded statement</title>
<style>
  body { margin: 0; font: 16px/1.5 "Segoe UI", Arial, sans-serif; background: #fff; color: #2a2a2a; }
  .box { padding: 18px 20px; }
  h3 { margin: 0 0 10px; font-size: 17px; color: #1d2b45; }
  .m { display: inline-block; line-height: 1; font-weight: 700; font-family: Consolas, "Courier New", monospace; }
  .m-frame { color: rgb(0, 200, 200); }
  .m-email { color: rgb(255, 90, 90); }
  p { margin: 0 0 12px; }
</style>
</head>
<body>
<div class="box">
  <h3>Embedded account widget</h3>
  <p>Primary contact</p>
  <p><span class="m m-email">rajasekar@nikatru.com</span></p>
  <p>Card ending</p>
  <p><span class="m m-frame">4111 1111 1111 1111</span></p>
  <p>This document is served from the same origin as its host page.</p>
</div>
</body>
</html>
