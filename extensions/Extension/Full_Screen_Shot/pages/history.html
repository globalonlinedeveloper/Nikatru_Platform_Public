<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title data-i18n="historyPageTitle">History — FullShot</title>
<link rel="stylesheet" href="common.css">
<style>
  #grid {
    max-width: 1200px; margin: 0 auto;
    padding: 22px 18px 60px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--line); border-radius: 14px;
    overflow: hidden; box-shadow: var(--shadow);
    display: flex; flex-direction: column;
    position: relative;
  }
  .card.selected { outline: 2px solid var(--accent); }
  /* The thumbnail is a BUTTON that contains an image, not an image with a
     click handler. It used to be the latter: <img> is not focusable, takes no
     Enter or Space, and is announced as an image, so the largest and most
     obvious control on this page was reachable by mouse only. Wrapping it
     costs a reset (buttons bring their own padding, border and font) and buys
     the keyboard, the accessibility tree, and the shared focus ring. */
  .card .thumb {
    display: block; width: 100%; height: 170px; padding: 0;
    border: 0; border-bottom: 1px solid var(--line);
    background: #fff; cursor: pointer;
  }
  .card .thumb img {
    display: block; width: 100%; height: 100%;
    object-fit: cover; object-position: top;
  }
  .card .info { padding: 10px 12px 6px; }
  /* The title is the CAPTURED PAGE's title and the sub-line carries its URL:
     both belong to the user, not to FullShot's chrome, so each takes its own
     direction rather than the UI's. See .fs-user / .fs-ltr in common.css. */
  .card .title {
    font-weight: 600; font-size: 13px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    unicode-bidi: plaintext;
  }
  .card .sub { color: var(--fg2); font-size: 11.5px; margin-top: 2px; unicode-bidi: plaintext; }
  .card a.sub { direction: ltr; unicode-bidi: isolate; }
  /* .card .sub.redactline — THE ACTS LINE, and it is deliberately absent from
     this stylesheet. `redactline` is the same NAME the result page puts on its
     permanent line (see .redactline in result.html), and it exists so that the
     sentence can be found — by a reader of this file, by a test, by whoever
     comes next. It is not a style, and it must not become one: a rule here that
     gave the shortfall arm its own colour, weight or border would be a verdict
     rendered in CSS, shown for exactly the records the deleted design graded as
     bad, and REDACTION-CLAIM-SPEC.md §0.1 forbids that "however it is
     computed". The line inherits .sub and says the whole thing in words. */
  .card .row {
    display: flex; gap: 4px; padding: 6px 8px 10px; flex-wrap: wrap;
  }
  .card .row button { font-size: 12px; padding: 5px 10px; }
  .card input[type="checkbox"] {
    position: absolute; inset-block-start: 10px; inset-inline-start: 10px;
    width: 18px; height: 18px; accent-color: var(--accent);
  }
  /* Elastic, not 220px: at 200% zoom this bar was 253px wider than the page in
     English before a word was translated. */
  #searchBox {
    padding: 7px 12px; border: 1px solid var(--control-line); border-radius: 9px;
    background: var(--bg); color: var(--fg); font: 13px system-ui, sans-serif;
    flex: 1 1 220px; min-width: 120px; max-width: 100%;
  }
  #emptyState { text-align: center; padding: 110px 20px; color: var(--fg2); }
  #emptyState h2 { color: var(--fg); }
</style>
</head>
<body>
<!-- Every user-visible string carries data-i18n (text) or data-i18n-attr (a
     named attribute) and KEEPS its English as the fallback: common.js
     substitutes on load, and a key that does not resolve leaves the English
     standing. Chrome does not substitute __MSG__ inside HTML, which is why the
     key travels in an attribute rather than in the text node. Same shape as
     popup/popup.html — see pages/common.js for the pass itself.
     An icon and its label are two elements, never one text node: the pass
     writes textContent, and a glyph glued to the label would either be
     translated with it or deleted by it. `.btn` is `display: inline-flex;
     gap: 6px`, so the gap does the spacing the old literal space did.
     Not marked, deliberately: the glyphs (⬇ 🗑 ⚙ ◐), which are symbols and
     read the same in every language; alt="" on the decorative brand icon; and
     the ids, classes and href="#", which are code.

     ACCESSIBILITY. Every glyph now sits inside aria-hidden="true", because a
     button's accessible name is its CONTENT: "⬇ Download selected" was
     announced with the arrow's Unicode name in front of the words, and the
     two icon-only buttons were announced as the names of ⚙ and ◐ with their
     title attributes never reached at all (content beats title). The search
     box spends its placeholder key a second time as aria-label — a
     placeholder is not a label, it disappears the moment there is text in the
     field, and it is not exposed as a name by every screen reader. -->
<header class="topbar">
  <a class="brand" href="#"><img src="../icons/icon32.png" width="20" height="20" alt=""><span data-i18n="historyBrand">FullShot · History</span></a>
  <span class="meta" id="countText" role="status" aria-live="polite"></span>
  <span class="spacer"></span>
  <input type="search" id="searchBox" placeholder="Search title or URL…" aria-label="Search title or URL…"
         data-i18n-attr="placeholder:historySearchPlaceholder; aria-label:historySearchPlaceholder">
  <button class="btn" id="selectAllBtn" type="button" data-i18n="historySelectAll">Select all</button>
  <button class="btn" id="dlSelBtn" type="button" disabled><span aria-hidden="true">⬇</span><span id="dlSelLabel" data-i18n="historyDownloadSelected">Download selected</span></button>
  <button class="btn danger" id="delSelBtn" type="button" disabled><span aria-hidden="true">🗑</span><span id="delSelLabel" data-i18n="historyDeleteSelected">Delete selected</span></button>
  <button class="btn icon" id="optionsBtn" type="button" title="Options" aria-label="Options"
          data-i18n-attr="title:popupLinkOptions; aria-label:popupLinkOptions"><span aria-hidden="true">⚙</span></button>
  <button class="btn icon" id="themeBtn" type="button" title="Toggle theme" aria-label="Toggle theme"
          data-i18n-attr="title:popupToggleTheme; aria-label:popupToggleTheme"><span aria-hidden="true">◐</span></button>
</header>

<main>
  <!-- role="list" because #grid is display:grid, and a grid container drops
       the implicit list semantics a browser would otherwise infer. Without it
       a reader is given N unrelated groups instead of "list, 24 items". -->
  <div id="grid" role="list"></div>
  <!-- tabindex="-1" so history.js can park focus here after the last card is
       deleted: not in the tab order, but reachable by script, which is the
       only place left to stand once the button that was focused is gone. -->
  <div id="emptyState" tabindex="-1" hidden>
    <h2 data-i18n="historyEmptyTitle">No screenshots yet</h2>
    <p data-i18n="historyEmptyBody">Captures you take will appear here. Click the FullShot icon in your toolbar to get started.</p>
  </div>
</main>

<!-- Declared here rather than left to fsToast() to create on demand. A live
     region has to be in the document BEFORE the text lands in it; a <div>
     inserted with its message already inside is the one case assistive
     technology is entitled to skip, and "Downloading 3 screenshots" was
     therefore never announced. -->
<div id="fs-toast" role="status" aria-live="polite"></div>

<script src="db.js"></script>
<script src="common.js"></script>
<script src="history.js"></script>
</body>
</html>
