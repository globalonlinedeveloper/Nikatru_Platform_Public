name: nikatru_workspace
description: >-
  Nikatru Cross Platform Apps — monorepo workspace root (Dart pub workspaces +
  Melos 8). Members: the shared packages under packages/ AND the Subly app
  (apps/subly/). P0.8 promoted the spine packages + Subly to workspace members
  so a single `melos run gate` analyzes and tests the whole tree in one
  resolution.
publish_to: none

environment:
  sdk: ^3.9.0

# Workspace members — explicit paths (Dart pub workspaces / Melos 8: no globs).
# Pure-Dart and Flutter packages share ONE resolution; the workspace_gate CI
# lane resolves with `flutter pub get` because the Flutter members require the
# Flutter tool (plain `dart pub get` cannot resolve `sdk: flutter` deps).
workspace:
  - packages/analysis
  - packages/core
  - packages/api_client
  - packages/auth_supabase
  - packages/design_system
  - packages/notifications
  - packages/platform_storage
  - packages/purchases
  - packages/telemetry
  - apps/subly

dev_dependencies:
  melos: ^8.2.2

# ─────────────────────────────────────────────────────────────────────────────
# THE ONE OVERRIDE, AND WHY IT IS NOT A SHRUG
# ─────────────────────────────────────────────────────────────────────────────
# A pub WORKSPACE is a single resolution, so every member's dev tooling has to
# agree with every other member's. `melos 8.2.2` requires `cli_util ^0.5.0`;
# NO PUBLISHED VERSION of `flutter_launcher_icons` accepts anything at or above
# 0.5.0 (measured 2026-08-04 — pub enumerated every version back to 0.9.0 and
# they split between `cli_util ^0.3.5` and `>=0.4.0 <0.5.0`, while `msix
# 3.18.0`'s `image ^4.0.0` rules out the older half). So the icon generator and
# the workspace runner cannot coexist without this line, and the icon generator
# is what stands between this factory and shipping Flutter's logo again.
#
# It is safe HERE and would not be in general, because of how narrowly
# flutter_launcher_icons uses cli_util. VERIFIED BY RUNNING IT rather than by
# reading a changelog: under this override the generator produced all 29 native
# icons for apps/subly, and — the run that actually matters — a freshly stamped
# app #2 went from every icon byte-identical to Flutter's stock to none of them,
# in one command (tooling/ci/assert-launcher-icons.mjs red, then green).
#
# The alternative was `dart pub global activate flutter_launcher_icons`, which
# [pipeline F-8] rejects for exactly the right reason: a globally activated tool
# resolves whatever is newest that day, and nothing in the repo would record
# which version drew the icons that shipped. An override is pinned by
# pubspec.lock and visible in a diff; a global activation is neither.
#
# ⚠️ REVISIT WHEN flutter_launcher_icons WIDENS TO cli_util ^0.5.0, and delete
# this block then — an override nobody needs is an override nobody re-examines.
dependency_overrides:
  cli_util: ^0.5.0

# Melos 7+/8 configuration lives here (melos.yaml no longer exists).
melos:
  scripts:
    analyze:
      run: melos exec --fail-fast -- dart analyze
      description: >-
        Analyze every workspace member. `dart analyze` resolves Flutter types
        from the shared package config; infos stay non-fatal, matching the
        per-lane `flutter analyze --no-fatal-infos` posture.
    test:
      run: melos exec --fail-fast --dir-exists=test --no-flutter -- dart test && melos exec --fail-fast --dir-exists=test --flutter -- flutter test
      description: >-
        Pure-Dart members (core, api_client) run under `dart test`; Flutter
        members (design_system, telemetry, subly) run under `flutter test`.
    gate:
      run: melos run analyze && melos run test
      description: >-
        The unified quality gate — analyze + test across every member. §14's
        definition of green: `melos bootstrap && melos run gate` passes.
