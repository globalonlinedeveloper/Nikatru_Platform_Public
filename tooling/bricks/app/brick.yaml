name: app
description: >-
  Stamps a new NIKATRU Cross Platform App, pre-wired to the shared spine
  (design_system, api_client, core) and telemetry. The input contract is THIS
  FILE's `vars` block — every one of them validated by hooks/pre_gen.dart
  [pipeline S-1]. Proven in CI by stamping a throwaway apps/probe and analyzing.
version: 0.1.0

environment:
  mason: ">=0.1.0 <0.2.0"

# ⚠️ DO NOT "TIDY" THE ODD DIRECTORY NAMES UNDER __brick__/.
# `__brick__/{{#needs_backend}}services{{/needs_backend}}/` is ONE Mustache
# section that mason evaluates on the joined path. Because `/` cannot appear in
# a directory name, it necessarily lands on disk as two nested directories
# (`{{#needs_backend}}services{{` and `needs_backend}}`). That is correct and
# load-bearing: renaming them to a plain `services/` silently makes every
# stamped app claim a Worker + D1 again, reinstating the 10-database ceiling
# problem [ADR 020] exists to fix. CI asserts the contract either way.

vars:
  app_id:
    type: string
    description: Lowercase snake_case app id (also the Dart package name), e.g. lingo
    prompt: App id (lowercase)
  needs_backend:
    type: boolean
    description: >-
      Does this app store USER ROWS server-side? Default NO. A "no" app is
      client-only and talks to the ONE shared platform Worker for config,
      analytics, entitlements and account deletion — it stamps no Worker, no D1
      and no R2 bucket of its own. Say yes ONLY when the app genuinely needs a
      private database, and remember the ceilings: D1 Free allows 10 databases
      per account TOTAL, one of which is platform_db — but the one that BINDS
      FIRST is the 5 GB account-wide storage cap, which across 50 apps is ~100 MB
      each, tighter than the 500 MB per-database limit anyone would think to
      check. (All three re-read from developers.cloudflare.com/d1/platform/limits
      on 2026-07-29 and unchanged: 10 free / 50,000 paid databases, 500 MB free /
      10 GB paid per database, 5 GB free / 1 TB paid per account.)
    prompt: Does this app store user rows server-side? (per-app D1 — say no unless sure)
    default: false
  display_name:
    type: string
    description: Human display name, e.g. "Lingo — Offline Phrasebook"
    prompt: Display name
  subdomain:
    type: string
    description: >-
      Web subdomain, e.g. lingo.nikatru.com. LEAVE IT BLANK and it is derived as
      `<app_id>.nikatru.com` — that is the normal input, and pre_gen refuses any
      value that disagrees with the convention. Derivation happens in
      hooks/pre_gen.dart, which writes the resolved value back into the vars
      mason then hands to the templates; blank used to reach them untouched and
      stamp `"ALLOWED_ORIGINS": "https://"` into the app's own Worker.
    prompt: Web subdomain (blank = derive <app_id>.nikatru.com)
    default: ""
  api_domain:
    type: string
    description: >-
      API host (single-label standard), e.g. api-lingo.nikatru.com. ONLY used
      when needs_backend=true — a client-only app calls the shared platform
      Worker and never has a host of its own, so this value is ignored. Blank is
      the normal input and derives `api-<app_id>.nikatru.com` (see `subdomain`).
    prompt: API domain (blank = derive; ignored unless needs_backend=true)
    default: ""
  seed_hex:
    type: string
    description: Brand seed colour as 6 hex digits without '#', e.g. 1E88E5
    prompt: Brand seed hex (RRGGBB)
    default: "6459F5"
  category:
    type: string
    description: Store category, e.g. travel
    prompt: Category
    default: productivity
  description:
    type: string
    description: One-line differentiation for store listings
    prompt: Differentiation line
    default: ""
