name: app
description: >-
  Stamps a new NIKATRU Cross Platform App, pre-wired to the shared spine
  (design_system, api_client, core) and telemetry. The input contract is THIS
  FILE's `vars` block — every one of them validated by hooks/pre_gen.dart
  [pipeline S-1]. Proven in CI by stamping a throwaway apps/probe and analyzing.
version: 0.1.0

environment:
  mason: ">=0.1.0 <0.2.0"

# ⚠️ DO NOT "TIDY" THE ODD DIRECTORY NAMES UNDER __brick__/.
# `__brick__/{{#needs_backend}}services{{/needs_backend}}/` is ONE Mustache
# section that mason evaluates on the joined path. Because `/` cannot appear in
# a directory name, it necessarily lands on disk as two nested directories
# (`{{#needs_backend}}services{{` and `needs_backend}}`). That is correct and
# load-bearing: renaming them to a plain `services/` silently makes every
# stamped app claim a Worker + D1 again, reinstating the 10-database ceiling
# problem [ADR 020] exists to fix. CI asserts the contract either way.

vars:
  app_id:
    type: string
    description: App id, lowercase letters and digits with a letter first, 2-32 characters (contracts/app-id; also the Dart package name), e.g. lingo
    prompt: App id (lowercase)
  needs_backend:
    type: boolean
    description: >-
      Does this app store USER ROWS server-side? Default NO. A "no" app is
      client-only and talks to the ONE shared platform Worker for config,
      analytics, entitlements and account deletion — it stamps no Worker, no D1
      and no R2 bucket of its own. Say yes ONLY when the app genuinely needs a
      private database. ⏱ THE CEILING ARGUMENT THAT STOOD HERE UNTIL 2026-09-08
      IS DEAD, AND IT IS RECORDED RATHER THAN QUIETLY DROPPED: it read "D1 Free
      allows 10 databases per account TOTAL … the 5 GB account-wide storage cap
      … binds first", re-read from the vendor on 2026-07-29. tooling/ceilings.json
      records the account on Workers Paid since 2026-09-03 — 50,000 databases,
      10 GB each — so nothing about a per-app database is scarce any more, and
      the included D1 allowance is per ACCOUNT, so splitting buys no headroom and
      changes no bill. THE DEFAULT IS STILL NO, for the three reasons that
      outlived the ceiling: BLAST RADIUS (one bad migration in a shared database
      is a portfolio outage), MIGRATION COST (`wrangler d1 migrations apply`
      takes ONE database, and N of them is a loop with no cross-database
      transactionality) and YAGNI. Full correction: tooling/ci/assert-clone-contract.mjs.
    prompt: Does this app store user rows server-side? (per-app D1 — say no unless sure)
    default: false
  display_name:
    type: string
    description: Human display name, e.g. "Lingo — Offline Phrasebook"
    prompt: Display name
  icon_label:
    type: string
    description: >-
      The ICON LABEL — what a home screen, a launcher and a task switcher print
      under the app's mark, e.g. "Phrasebook". It is written into the stamped
      app's `shortName:` and rendered from there into CFBundleDisplayName (iOS +
      macOS), android:label, the .desktop `Name=`, msix_config.display_name and
      the PWA manifest `short_name` by tooling/app-yaml/render.mjs.
      ⚠️ NOT the same thing as this brick's INTERNAL `short_name` var, which is
      the display name up to its subtitle separator and is the STORE TITLE. Two
      different fields with two different readers: a store title is read once in
      a search result with a row to itself, an icon label is read every day under
      a 60-pixel square that truncates it (iOS at about 12-13 glyphs, Android at
      about 11-14). Shipping one string to both is how a launcher ends up showing
      four apps that all read the same six characters and an ellipsis.
      hooks/pre_gen.dart refuses one that is empty, over 15 characters, holds a
      newline, or SHARES NO WORD with `display_name` (a common stem of four
      characters or more counts, so a plural is similar) — Apple QA1892 asks
      that the name on the device and the name in the store be similar, and a
      label with nothing in common with the listing is a rejection risk rather
      than a style choice. tooling/ci/assert-app-naming.mjs holds the same four
      rules over apps/*/app.yaml, so the stamp cannot produce an app the gate
      then refuses.
    prompt: Icon label (<= 15 chars, sharing a word with the display name)
  pages_origin:
    type: string
    description: >-
      REQUIRED. The app's own Cloudflare Pages host, e.g.
      subscriptiontracker-7qg.pages.dev — the origin the apex router fetches the
      app's bytes from. It is ISSUED BY CLOUDFLARE when the Pages project is
      created (a suffix is appended when the bare name is taken, which is why
      `<app_id>.pages.dev` is never a safe guess), so it cannot be derived:
      create the project first with
      `node tooling/web/pages-origin.mjs --apply <app_id>` and pass the host it
      prints. post_gen writes it into app.yaml as both `hosts.web` and
      `hosts.pagesOrigin`, and tooling/app-yaml/render.mjs composes the
      catalogue `origin` from it with no fallback. hooks/pre_gen.dart refuses a
      blank value, a *.nikatru.com host (the pre-[ADR 075] `<app_id>.nikatru.com`
      derivation, which has served nothing since [ADR 080] deleted the wildcard),
      and any host outside *.pages.dev. This var REPLACES `subdomain`
      (O-PRODUCT-RECORD-UNBUILT, 2026-09-27): a spec that still passes
      `subdomain` is refused with "subdomain was renamed to pages_origin".
    prompt: Pages origin (the *.pages.dev host pages-origin.mjs --apply printed)
  api_domain:
    type: string
    description: >-
      API host (single-label standard), e.g. lingo-api.nikatru.com. ONLY used
      when needs_backend=true — a client-only app calls the shared platform
      Worker and never has a host of its own, so this value is ignored. Blank is
      the normal input and derives `<app_id>-api.nikatru.com` in hooks/pre_gen.dart.
      The app id comes FIRST: [ADR 080] section 3 retired [ADR 006]'s
      `api-<app_id>` prefix form on 2026-09-11 so that every host an app owns
      sorts together under its own name.
    prompt: API domain (blank = derive; ignored unless needs_backend=true)
    default: ""
  seed_hex:
    type: string
    description: Brand seed colour as 6 hex digits without '#', e.g. 1E88E5
    prompt: Brand seed hex (RRGGBB)
    default: "6459F5"
  category:
    type: string
    description: Store category, e.g. travel
    prompt: Category
    default: productivity
  description:
    type: string
    description: >-
      The SHORT DESCRIPTION of every store listing this stamp generates, and the
      catalogue tagline. One line, and it MUST NOT BE BLANK — [pipeline 10]D-5
      made the brick generate `apps/<id>/store/<channel>/short-description.txt`
      from this var for all five store channels, so a blank stamps a listing
      that fails its own build. Google Play caps it at 80 characters and
      hooks/pre_gen.dart enforces that from the channel register's SOURCED
      number, never from one written here.
    prompt: Short description (one line, <= 80 chars — the store listing uses it)
  markets:
    type: string
    description: >-
      COMMA-SEPARATED list of the markets this app is offered in, e.g. `in` or
      `in,eu`. [pipeline K-1] A STAMP THAT DECLARES NO MARKET IS REFUSED, and so
      is one naming a market this factory cannot resolve a duty in.
      ⚠️ THE VOCABULARY IS NOT WRITTEN HERE, deliberately. It is the union of the
      `markets` arrays on the rows of tooling/legal/duty-matrix.json, computed by
      hooks/pre_gen.dart at stamp time, so a market becomes declarable only by
      adding the duty row that makes it resolvable — which is the work, not a
      line in a list. A token resolving to ZERO rows is refused BY NAME with the
      resolvable set printed, which is what stops `global` meaning nothing at
      all. A second list of "markets we support" would be the first thing to
      drift, so there is not one.
    prompt: Markets offered in (comma-separated, e.g. in)
  audience:
    type: string
    description: >-
      Who the app is offered to — `general`, the only value. [pipeline K-16]
      [ADR 068] (LOCKED 2026-09-05): no NIKATRU app, extension or site targets
      children, and the audience floor is 18. hooks/pre_gen.dart refuses
      `children` by name, citing that decision, and no register edit can lift
      the refusal (until 2026-10-01 it read the
      `children-surface-before-a-kids-app` row of tooling/legal/duty-matrix.json,
      which is now withdrawn).
      ⚠️ NOTHING IN A REPOSITORY CAN DERIVE AN INTENDED AUDIENCE — the same
      question in apps/subscriptiontracker/store/android-play/content-rating.json says so of
      itself. This value is a human's declaration; what is mechanical is that it
      cannot name an audience a locked decision rules out.
    prompt: Audience (general)
    default: general
  subtitle:
    type: string
    description: >-
      The App Store SUBTITLE, <= 30 characters — a real field on both the iOS
      and macOS listings. It is a spec field of its own rather than a slice of
      `description` because condensing free-length prose to 30 characters either
      truncates mid-word or invents copy, and a store listing is not the place to
      guess. The limit is read from tooling/channel-register.json, where it sits
      beside the Apple page and fetch date it came from.
    prompt: App Store subtitle (<= 30 chars)
