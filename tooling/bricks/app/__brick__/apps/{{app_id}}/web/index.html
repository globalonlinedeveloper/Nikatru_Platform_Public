<!DOCTYPE html>
<html>
<head>
  <!--
    [pipeline S-3] THE STAMPED WEB SHELL.

    Before this existed the catalogue claimed every app "works on web" while the
    template stamped NO platform folder at all — so `flutter build web` failed
    immediately on a fresh stamp, and its error message helpfully suggested
    `flutter create . --platforms web`, the exact hand-repair a stamper exists to
    make unnecessary. Analysis and tests passed throughout, because neither needs
    a platform folder.

    ⚠️ THE SERVICE WORKER HERE IS OURS (web/sw.js, registered by web/sw-register.js
    below), NEVER FLUTTER'S: the build keeps `--pwa-strategy=none`. ⏱ 2026-10-01 —
    this said "THERE IS NO SERVICE WORKER FILE HERE"; [ADR 023]'s 2026-09-30
    amendment added ours: network-first, one cache per build, scope /<app id>/.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="{{description}}">

  <!--
    🔴 WITHOUT THIS LINE EVERY RESPONSIVE DECISION IN THE APP IS DISCARDED BY
    THE BROWSER BEFORE FLUTTER RUNS. A mobile browser with no viewport meta
    assumes the page was written for a desktop, lays it out at ~980 CSS px and
    then scales the whole thing down to fit the screen. So a phone reports
    itself as ~980 logical pixels wide, `windowClassFor` answers `expanded`,
    and the user gets a NavigationRail and 720-px prose columns rendered at
    about a third scale — pinch-to-zoom text on a device the entire compact
    class exists to serve.
    That is the failure mode this whole increment is about, arriving one layer
    below anything a widget test can reach: `setSurfaceSize` sets the logical
    size directly, so every width test in `test/responsive_width_test.dart`
    passes on a build whose real phones are all `expanded`.
    It was absent from the stamp while `apps/subscriptiontracker/web/index.html` — the shell
    this template was derived from — has carried it all along, so this is a
    line lost in the copy rather than a decision anybody made.
    `assert-stamp-properties.mjs` anchors it under `ui-invariants-inherited`.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="{{display_name}}">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>{{display_name}}</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- The offline shell. NOT async, and above the bootstrap: its first-frame
       listener must exist before the engine can fire the event. -->
  <script src="sw-register.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
