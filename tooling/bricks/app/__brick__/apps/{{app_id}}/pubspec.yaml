name: {{app_id.snakeCase()}}
description: "{{{display_name_json}}} — a NIKATRU Cross Platform App."
publish_to: "none"
# 🔴 [pipeline S-4] THIS LINE IS WHAT KEEPS `melos run gate` ALIVE. post_gen adds
# `apps/<id>` to the ROOT `workspace:` list, and Dart's resolver refuses the whole
# workspace — not just this member — when a listed path's pubspec omits
# `resolution: workspace`:
#
#   apps\<id>\pubspec.yaml is included in the workspace from .\pubspec.yaml,
#   but does not have `resolution: workspace`.
#
# That is `dart pub get`/`flutter pub get` exiting 1 AT THE REPO ROOT, so the one
# command that defines green stops resolving for every package at once. Measured
# on the real tree with Dart 3.12.2 by stamping the probe and resolving from the
# root; the same two-file shape reproduces it standalone.
#
# It was invisible for as long as no stamped app was committed: the `app_brick`
# lane resolves INSIDE `apps/probe` (standalone, never consults the root) and
# `workspace_gate` runs on a clean checkout that has no stamp. So the defect was
# scheduled to land on the day app #2 was committed and on no day before it.
# `.github/workflows/ci.yml` now resolves from the repo root after the stamp so
# the real resolver, not only assert-stamp-platforms.mjs, has to accept this.
resolution: workspace
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # Shared spine (path deps — apps/<id> sits two levels above packages/).
  nikatru_core:
    path: ../../packages/core
  nikatru_api_client:
    path: ../../packages/api_client
  nikatru_design_system:
    path: ../../packages/design_system
  nikatru_telemetry:
    path: ../../packages/telemetry
  nikatru_platform_storage:
    path: ../../packages/platform_storage
  # [pipeline C-2] Had ZERO consumers despite 21 passing tests. Wired into the
  # template so every stamped app inherits the seam rather than growing a fork —
  # which is exactly how three NotificationService implementations came to exist.
  # NOTE apps/subly deliberately does NOT get this: it is a frozen legacy
  # rail-prover (cut list item 1) and keeps its own fork, which is also why
  # flutter_local_notifications stays pinned at 17.x for now.
  nikatru_auth_supabase:
    path: ../../packages/auth_supabase
  nikatru_notifications:
    path: ../../packages/notifications
  # [pipeline 5]M-13 THE MONEY RAIL IS INHERITED, NOT REBUILT PER APP. Every
  # stamped app is born able to take a payment, show a price it did not invent,
  # converge on the server's answer and let the user cancel — with zero purchase
  # code of its own. The alternative is the shape this factory already paid for
  # once: a capability that lives in one app and is hand-rebuilt for the second.
  nikatru_purchases:
    path: ../../packages/purchases

  # State (Riverpod 2.x-LTS, non-codegen — locked chassis choice) + routing.
  flutter_riverpod: ^2.5.0
  go_router: ^14.2.0

  # Launch external URLs (support mailto, legal links) — all 6 platforms.
  url_launcher: ^6.3.0


  # Running app version — drives the CFG-1 force-update kill-switch.
  package_info_plus: ^8.0.0

  # Localization — flutter_localizations + intl drive gen-l10n from lib/l10n/*.arb.
  flutter_localizations:
    sdk: flutter
  intl: any

dev_dependencies:
  # [pipeline C-12] resolves the shared ruleset in analysis_options.yaml.
  nikatru_lints:
    path: ../../packages/analysis
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
