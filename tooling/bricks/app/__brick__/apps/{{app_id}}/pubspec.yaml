name: {{app_id.snakeCase()}}
description: "{{{display_name_json}}} — a NIKATRU Cross Platform App."
publish_to: "none"
# 🔴 [pipeline S-4] THIS LINE IS WHAT KEEPS `melos run gate` ALIVE. post_gen adds
# `apps/<id>` to the ROOT `workspace:` list, and Dart's resolver refuses the whole
# workspace — not just this member — when a listed path's pubspec omits
# `resolution: workspace`:
#
#   apps\<id>\pubspec.yaml is included in the workspace from .\pubspec.yaml,
#   but does not have `resolution: workspace`.
#
# That is `dart pub get`/`flutter pub get` exiting 1 AT THE REPO ROOT, so the one
# command that defines green stops resolving for every package at once. Measured
# on the real tree with Dart 3.12.2 by stamping the probe and resolving from the
# root; the same two-file shape reproduces it standalone.
#
# It was invisible for as long as no stamped app was committed: the `app_brick`
# lane resolves INSIDE `apps/probe` (standalone, never consults the root) and
# `workspace_gate` runs on a clean checkout that has no stamp. So the defect was
# scheduled to land on the day app #2 was committed and on no day before it.
# `.github/workflows/ci.yml` now resolves from the repo root after the stamp so
# the real resolver, not only assert-stamp-platforms.mjs, has to accept this.
resolution: workspace
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # Shared spine (path deps — apps/<id> sits two levels above packages/).
  nikatru_core:
    path: ../../packages/core
  nikatru_api_client:
    path: ../../packages/api_client
  nikatru_design_system:
    path: ../../packages/design_system
  nikatru_telemetry:
    path: ../../packages/telemetry
  nikatru_platform_storage:
    path: ../../packages/platform_storage
  # [pipeline C-2] Had ZERO consumers despite 21 passing tests. Wired into the
  # template so every stamped app inherits the seam rather than growing a fork —
  # which is exactly how three NotificationService implementations came to exist.
  # NOTE apps/subly deliberately does NOT get this: it is a frozen legacy
  # rail-prover (cut list item 1) and keeps its own fork, which is also why
  # flutter_local_notifications stays pinned at 17.x for now.
  nikatru_auth_supabase:
    path: ../../packages/auth_supabase
  nikatru_notifications:
    path: ../../packages/notifications
  # [pipeline 5]M-13 THE MONEY RAIL IS INHERITED, NOT REBUILT PER APP. Every
  # stamped app is born able to take a payment, show a price it did not invent,
  # converge on the server's answer and let the user cancel — with zero purchase
  # code of its own. The alternative is the shape this factory already paid for
  # once: a capability that lives in one app and is hand-rebuilt for the second.
  nikatru_purchases:
    path: ../../packages/purchases

  # State (Riverpod 2.x-LTS, non-codegen — locked chassis choice) + routing.
  flutter_riverpod: ^2.5.0
  go_router: ^14.2.0

  # Launch external URLs (support mailto, legal links) — all 6 platforms.
  url_launcher: ^6.3.0


  # Running app version — drives the CFG-1 force-update kill-switch.
  package_info_plus: ^8.0.0

  # Localization — flutter_localizations + intl drive gen-l10n from lib/l10n/*.arb.
  flutter_localizations:
    sdk: flutter
  intl: any

dev_dependencies:
  # [pipeline C-12] resolves the shared ruleset in analysis_options.yaml.
  nikatru_lints:
    path: ../../packages/analysis
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Generates the launcher icon for every NATIVE platform from one source image.
  # See the `flutter_launcher_icons:` block at the bottom of this file for why a
  # stamped app carries it before it has any native platform at all.
  flutter_launcher_icons: ^0.14.4
  # TEST-ONLY. `content-pack-consumed` builds a pack whose `content_hash` is
  # genuinely correct, so the loader's own integrity check runs for real instead
  # of being handed a hash it cannot refuse. A hard-coded digest would be a
  # magic constant that goes stale the moment the fixture's text changes.
  crypto: ^3.0.0

flutter:
  uses-material-design: true
  generate: true

# ─────────────────────────────────────────────────────────────────────────────
# LAUNCHER ICONS — the mechanism, stamped before there is a platform to use it
# ─────────────────────────────────────────────────────────────────────────────
# 🔴 WHY THIS IS HERE WHEN THE BRICK STAMPS NO NATIVE PLATFORM.
# The stamp claims `web` only ([3]S-3 holds that claim and CI builds it). The
# owner adds the rest with `flutter create . --platforms=android,ios,macos,
# windows,linux` AFTER the stamp — and that command writes FLUTTER'S DEFAULT
# LOGO into every one of them.
#
# That is not hypothetical. Measured on apps/subly 2026-08-04: 29 native icon
# files, on four platforms, ALL byte-identical to `flutter create` output, while
# its web icons carried the real brand mark. Nobody chose it; it arrived by
# doing nothing, and it sat there for months because nothing looked.
#
# A defect in the TEMPLATE is not one app with the wrong icon — it is every app
# the factory will ever stamp, born wrong, and store reviewers see it first
# (Google Play rejects the stock Flutter icon outright). So the stamp lays down
# the CONFIG and the SOURCE ART now, and adding platforms becomes one command:
#
#     cd apps/{{app_id}} && dart run flutter_launcher_icons
#
# post_gen.dart prints that as checklist step 1a, and
# tooling/ci/assert-launcher-icons.mjs fails the build if this block stops
# naming art the stamp actually writes.
#
# ── THE ART IS GENERATED, NOT COPIED ────────────────────────────────────────
# hooks/brand_assets.dart derives both files from `app_id` + `seed_hex` — pure
# arithmetic, no model — so [ADR 019]'s NO-IP-PROMPTING rule is obeyed by
# construction, a re-stamp reproduces them byte-for-byte ([3]S-15), and each app
# in the portfolio gets a DIFFERENT mark instead of fifty identical tiles.
# Replace `image_path` with real art whenever there is real art.
#
# ── WEB IS `generate: false`, DELIBERATELY ──────────────────────────────────
# The stamp already wrote the five web assets, and its plain and MASKABLE icons
# are different images: the maskable pair keeps the mark inside the safe zone
# for platforms that crop it. This generator derives all four from one source,
# so turning web on would overwrite the maskable pair with non-maskable art —
# undoing the one platform that was already right.
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"

  android: "ic_launcher"
  # A FLAT COLOUR, not a generated PNG: the seed already lives in this file, and
  # two copies of one fact is how the wrong one ships.
  adaptive_icon_background: "#{{seed_hex}}"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  # 0 because the safe-zone inset is ALREADY in the artwork — brand_assets.dart
  # paints the mark at 52% of the canvas, inside Android's 66.7% guarantee.
  # Leaving the default 16 would shrink it twice.
  adaptive_icon_foreground_inset: 0

  ios: true
  # NOT OPTIONAL. App Store Connect REJECTS an app icon with an alpha channel
  # (ITMS-90717) — the build uploads and then fails validation remotely, with a
  # message that does not mention icons.
  remove_alpha_ios: true

  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"

  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256

  web:
    generate: false

  # LINUX still has no entry HERE, and that is now a statement about this tool
  # rather than about the platform: flutter_launcher_icons has no Linux target,
  # because Flutter's Linux embedder has no icon slot to write into. On Linux the
  # launcher icon is a PACKAGING artefact — a freedesktop `.desktop` entry plus a
  # hicolor icon theme, which every packaging layer (snap, flatpak, deb,
  # AppImage) consumes.
  #
  # Those ARE generated in this repo, from the same `image_path` master above:
  #   node tooling/store/render-linux-icons.mjs --app <app_id>
  # and `assert-launcher-icons.mjs` limb 7 RE-DERIVES them and fails the build on
  # any drift. So the day this app adds `--platforms=…,linux`, one more command
  # brands it — the gap that used to be printed here is closed, not deferred.
