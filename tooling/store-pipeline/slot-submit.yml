name: Slot store submission

# ═══════════════════════════════════════════════════════════════════════════
# 🔴 THE ONE-WAY DOOR. READ THIS BEFORE EDITING ANY LINE OF IT.
#
# Store submission is not a deploy. A deploy can be rolled back; a submission
# fixes facts that cannot be un-fixed:
#   · Google Play binds the UPLOAD CERTIFICATE at the first upload and refuses
#     every later bundle signed by another key.
#   · Firefox AMO fixes the ADD-ON ID at first signing. FullShot's is permanent
#     from that moment, and there is no second attempt.
#   · Snap fixes a GLOBAL name at `snapcraft register`.
#   · Apple and Microsoft bind bundle/package identity at first submission.
# Every step below that could reach a store is therefore treated as one-way and
# gated, and the gates are structural rather than advisory:
# tooling/store-pipeline/assert-slot-pipeline.mjs parses this file on every
# build and FAILS if any of them has been removed.
#
# ── THE FOUR GATES ──────────────────────────────────────────────────────────
#   1. `on: workflow_dispatch` AND NOTHING ELSE. No push, no schedule, no tag.
#      Nothing that happens by itself can reach this file.
#   2. A typed confirmation whose value is DERIVED FROM THE SLOT —
#      `SUBMIT-<store>`. This is why the token is not a constant: a dispatch
#      copy-pasted from one slot repository into another does nothing, because
#      the string names the store it is allowed to submit to.
#   3. `environment:` — GitHub pauses for a named reviewer and records who
#      approved, when the environment is configured.
#      🔴 `environment:` ON ITS OWN FAILS OPEN. Documented GitHub behaviour:
#      "Running a workflow that references an environment that does not exist
#      will create an environment with the referenced name." A typo therefore
#      creates an unprotected environment and runs immediately, and the history
#      then shows a deployment, which reads exactly like an approval. Measured
#      in this repository 2026-08-09: every environment that existed returned
#      `"protection_rules": []`. So gate 3 is covered by gate 4.
#   4. The submission script's own environment check. `submit-play.mjs` PG-5
#      GETs the environment and REFUSES unless a protection rule carries at
#      least one reviewer. Scripts for stores that do not yet have one must
#      grow the same limb before they are pointed at a real account.
#
# ── THE ONE BLOCK A SLOT REPOSITORY EDITS ───────────────────────────────────
# Everything in this file is shared except the marked PER-SLOT block, which
# carries the store credentials this slot's channel needs. It cannot be shared,
# and the honest reason is a platform limit rather than a design choice: GitHub
# Actions has no safe way to name a secret dynamically, so the names have to be
# written down somewhere. They are written down ONCE, inside the markers, and
# assert-slot-pipeline.mjs requires every `secrets.` reference in this file to
# sit inside those markers AND to be a name tooling/channel-register.json
# declares FOR THIS SLOT'S CHANNEL. A slot cannot smuggle in another store's
# credentials, and a name nobody declared fails the build.
#
# ⚠️ NO SECRET VALUE APPEARS IN THIS FILE OR IN ANY FILE OF THIS TEMPLATE. Only
# `${{ secrets.NAME }}` indirections do. The guard scans for the difference.
# ═══════════════════════════════════════════════════════════════════════════

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type SUBMIT-<store> (the store name exactly as catalog/store-matrix.json spells it) to authorise a REAL, IRREVERSIBLE submission. Anything else runs the dry run only.'
        required: true
        # 🔴 THE DEFAULT MUST NEVER BE A CONFIRMING VALUE. A dispatch left at its
        # default is the most likely dispatch there is.
        default: 'dry-run-only'
        type: string

permissions:
  contents: read
  checks: read

jobs:
  # Same shape and same reason as every other gate job in this repository: this
  # workflow runs a release build, and a release build from an ungated commit is
  # the whole subject of the release-provenance guard.
  gate:
    name: Require ci-gate to have passed
    runs-on: ubuntu-24.04
    # 25, not 10, and the number comes from the script rather than the clock:
    # assert-gate-passed.mjs polls for up to its own 1200 s default, so any bound
    # at or under 20 kills it mid-poll and replaces "timed out waiting for
    # ci-gate" with an opaque cancellation.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require ci-gate to have passed for this commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node tooling/ci/assert-gate-passed.mjs ${{ github.sha }}

  slot:
    name: Resolve the slot
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      store: ${{ steps.plan.outputs.store }}
      target: ${{ steps.plan.outputs.target }}
      storeChannel: ${{ steps.plan.outputs.storeChannel }}
      submittable: ${{ steps.plan.outputs.submittable }}
      submissionScript: ${{ steps.plan.outputs.submissionScript }}
      runner: ${{ steps.plan.outputs.runner }}
      flutterVersion: ${{ steps.plan.outputs.flutterVersion }}
      flutterTargets: ${{ steps.plan.outputs.flutterTargets }}
      toolchain: ${{ steps.plan.outputs.toolchain }}
      productState: ${{ steps.plan.outputs.productState }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: The pipeline must still be the pipeline
        run: node tooling/store-pipeline/assert-slot-pipeline.mjs
      # 🔴 `--require-product` IS PRESENT HERE AND ABSENT FROM slot-build.yml's
      # first job, and the asymmetry is the point. A build lane may legitimately
      # find nothing. A SUBMISSION lane that finds nothing and carries on is a
      # lane that would submit whatever happened to be lying in the workspace.
      - name: Which slot is this, and is there anything to submit?
        id: plan
        run: node tooling/store-pipeline/resolve-slot.mjs --github-output --require-product

  # ─────────────────────────────────────────────────────────────────────────
  # THE DRY RUN. Contacts nothing. Runs on every dispatch, including the ones
  # that will never reach the submit job — that is its purpose: to prove the
  # path from source to a store-shaped, correctly-signed artifact still walks,
  # so that submission #2 costs minutes rather than archaeology.
  # ─────────────────────────────────────────────────────────────────────────
  dry-run:
    name: Validate the submission path
    needs: [gate, slot]
    if: needs.slot.outputs.submittable == 'true'
    runs-on: ${{ needs.slot.outputs.runner }}
    # ⬜ NEVER RUN. Re-pin against the first real dispatch.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - if: contains(needs.slot.outputs.toolchain, 'java')
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - if: contains(needs.slot.outputs.toolchain, 'flutter')
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ needs.slot.outputs.flutterVersion }}
      - if: contains(needs.slot.outputs.toolchain, 'flutter')
        name: Resolve the workspace
        run: flutter pub get --enforce-lockfile

      # >>> PER-SLOT BLOCK BEGIN — store credentials and signing material <<<
      # 🔴 THE ONLY LINES IN THIS FILE A SLOT REPOSITORY EDITS. Replace the names
      # below with exactly the names tooling/channel-register.json declares for
      # THIS slot's channel — `signing.ciSecrets.names` plus whatever
      # `ciSecretRegister.nonSigning` declares that this channel's submission
      # script reads. assert-slot-pipeline.mjs checks that set against the
      # register on every build, in both directions, so a name added here that
      # nobody declared FAILS, and a declared name missing here FAILS.
      #
      # ⚠️ An unset repository secret is an EMPTY STRING, never an error. The
      # signing and submission scripts read presence and report absence; they do
      # not silently continue. That is what makes it safe to wire names in
      # before the credentials exist — the day they exist, nothing here changes.
      - name: Prepare this slot's signing material
        env:
          SLOT_SIGNING_SECRET_1: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SLOT_SIGNING_SECRET_2: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SLOT_SIGNING_SECRET_3: ${{ secrets.ANDROID_KEY_ALIAS }}
          SLOT_SIGNING_SECRET_4: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node tooling/store-pipeline/slot-signing.mjs --prepare
      # >>> PER-SLOT BLOCK END <<<

      - name: Build the artifact this store accepts
        env:
          FLUTTER_TARGETS: ${{ needs.slot.outputs.flutterTargets }}
        run: |
          for t in $FLUTTER_TARGETS; do
            echo "== flutter build $t --release"
            flutter build "$t" --release
          done
        working-directory: apps
        shell: bash
      # 🔴 READS THE SIGNATURE OUT OF THE ARTIFACT, NOT OUT OF THE CONFIG. The
      # configuration was correct in this repository for weeks while every .aab
      # CI produced was debug-signed, because no workflow supplied the secrets
      # and the recorded debug fallback fired on every run. Every check stayed
      # green. This is the only step that can contradict a posture claim with
      # what actually happened, and it runs BEFORE the dry run for that reason.
      - name: The artifact must be signed by our key, not a fallback key
        env:
          SLOT_STORE_CHANNEL: ${{ needs.slot.outputs.storeChannel }}
        run: node tooling/store-pipeline/slot-signing.mjs --verify
      # ⚠️ THE SCRIPT PATH COMES FROM THE REGISTER, THROUGH AN ENVIRONMENT
      # VARIABLE, NEVER INTERPOLATED INTO THE SHELL. `${{ … }}` written inside a
      # `run:` block is a template-injection sink.
      - name: Dry-run the submission
        env:
          SUBMISSION_SCRIPT: ${{ needs.slot.outputs.submissionScript }}
        run: |
          if [ -z "$SUBMISSION_SCRIPT" ]; then
            echo "✗ COVERAGE LOST — the register declares no submission script for this slot."
            echo "  A dry run that skips the submission is a dry run of nothing."
            exit 2
          fi
          node "$SUBMISSION_SCRIPT" --dry-run
        shell: bash

  # ═════════════════════════════════════════════════════════════════════════
  # 🔴 THE REAL SUBMISSION. Four gates and a human stand in front of it.
  #
  # `if:` is gate two — the typed, slot-derived confirmation.
  # `environment:` is gate three — the reviewer, whose fail-open behaviour is
  # covered by gate four inside the script.
  # `needs: dry-run` means the path was proven to walk on THIS commit first.
  #
  # 🔴 IT REBUILDS RATHER THAN DOWNLOADING THE DRY RUN'S ARTIFACT, on purpose.
  # The chain that matters — build, read this artifact's signature, submit THIS
  # artifact — has to be unbroken inside one job. Fetching across a job boundary
  # inserts a step at which a different file could arrive, and the thing it
  # would be inserted into is the one action here that has no undo.
  # ═════════════════════════════════════════════════════════════════════════
  submit:
    name: Submit to the store (owner-approved, IRREVERSIBLE)
    needs: [gate, slot, dry-run]
    if: inputs.confirm == format('SUBMIT-{0}', needs.slot.outputs.store)
    environment: store-publish
    runs-on: ${{ needs.slot.outputs.runner }}
    # ⬜ NEVER RUN — nobody has typed the confirmation in any slot.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - if: contains(needs.slot.outputs.toolchain, 'java')
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - if: contains(needs.slot.outputs.toolchain, 'flutter')
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ needs.slot.outputs.flutterVersion }}
      - if: contains(needs.slot.outputs.toolchain, 'flutter')
        name: Resolve the workspace
        run: flutter pub get --enforce-lockfile
      - name: Prepare this slot's signing material
        run: node tooling/store-pipeline/slot-signing.mjs --prepare
      - name: Build the artifact this store accepts
        env:
          FLUTTER_TARGETS: ${{ needs.slot.outputs.flutterTargets }}
        run: |
          for t in $FLUTTER_TARGETS; do
            flutter build "$t" --release
          done
        working-directory: apps
        shell: bash
      # 🔴 LOAD-BEARING AND THE GUARD KNOWS IT. assert-slot-pipeline.mjs finds
      # the job that runs `--submit` and REFUSES if this step is missing or sits
      # after it. Stores bind the signing certificate at the first submission
      # and never accept another; a signature nobody read before that is a
      # one-way door taken blind.
      - name: The artifact must be signed by our key, not a fallback key
        env:
          SLOT_STORE_CHANNEL: ${{ needs.slot.outputs.storeChannel }}
        run: node tooling/store-pipeline/slot-signing.mjs --verify
      - name: Submit
        env:
          SUBMISSION_SCRIPT: ${{ needs.slot.outputs.submissionScript }}
        run: |
          if [ -z "$SUBMISSION_SCRIPT" ]; then
            echo "✗ the register declares no submission script for this slot."
            exit 2
          fi
          node "$SUBMISSION_SCRIPT" --submit
        shell: bash
