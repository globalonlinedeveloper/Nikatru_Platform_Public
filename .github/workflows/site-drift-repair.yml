name: Site drift repair

run-name: "Site drift repair after ${{ github.ref_name }}"

# The measurements, retractions and traps behind this file are in
# docs/ci/site-drift-repair.md. Only `# why:` lines live here, and
# docs/ci/README.md carries the rules every workflow has to obey.

on:
  push:
    # why: the MERGE is what makes the pre-merge tree wrong. sitemap <lastmod> is the
    # page's git date, so the correct value for a page a PR changes is the date that
    # PR merges -- a date that does not exist while the PR is open.
    branches: [main]

concurrency:
  group: site-drift-repair
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  repair:
    name: Regenerate the discovery surface and propose the repair
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # why: `contents: write` pushes the branch and nothing else. There is no
      # `pull-requests: write` here any more: every `gh` call below runs as the
      # RENOVATE_TOKEN actor, because a pull request opened by GITHUB_TOKEN
      # starts no workflows and therefore never reaches a green ci-gate.
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Regenerate the discovery surface
        run: node tooling/sites/generate-discovery.mjs

      - name: Propose the repair, and arm it to merge itself on green
        env:
          # why: GITHUB_TOKEN cannot close this loop. A pull request it opens
          # triggers NO workflow runs, so ci-gate never starts, the required
          # check sits "Expected", and a human has to approve the run and merge.
          # RENOVATE_TOKEN is a real actor, so the pull request's checks RUN.
          GH_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          # why: the branch push stays on the job's own least-privilege token —
          # `checkout` above sets `persist-credentials: false`, so the one
          # command that pushes builds its own remote URL for that command only.
          PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # 🔴 WRITTEN ON BOTH PATHS, so `Preserve the computed repair` below can
          # keep `if-no-files-found: error`. An empty directory would otherwise
          # read the same as a directory this step never reached.
          OUT="${RUNNER_TEMP}/site-drift-repair"
          mkdir -p "$OUT"
          if [ -z "$(git status --porcelain -- sites/)" ]; then
            echo 'The regenerated discovery surface was byte-identical to main. Nothing was proposed.' > "$OUT/NO-DRIFT.txt"
            echo "::notice title=No site drift::The regenerated discovery surface is byte-identical to what main already carries. There is nothing to repair, which is the state this workflow exists to keep main in."
            exit 0
          fi

          echo "The regenerated surface differs from main:"
          git status --porcelain -- sites/

          # ── 🔴 THE SECRET IS CHECKED WHERE IT IS NEEDED, AND ITS ABSENCE IS RED ──
          # Checked AFTER the no-drift exit, deliberately: a missing credential must
          # redden the run that needed it, not every push to main. The repair is
          # written out first so an absent token still leaves the patch behind.
          if [ -z "${GH_TOKEN:-}" ]; then
            git diff -- sites/ > "$OUT/site-drift-repair.diff"
            echo 'RENOVATE_TOKEN was not set, so no pull request was opened. site-drift-repair.diff is the repair.' > "$OUT/NO-TOKEN.txt"
            echo '--- THE COMPUTED REPAIR, IN FULL ---'
            cat "$OUT/site-drift-repair.diff"
            echo '--- END OF THE COMPUTED REPAIR ---'
            echo "::error title=Site drift was repaired but no pull request could be opened::The repository secret RENOVATE_TOKEN is not set, and it is what this workflow opens and auto-merges the repair with. THE REPAIR IS NOT LOST — it is printed above and uploaded as this run's site-drift-repair artifact. REMEDY (owner work): create RENOVATE_TOKEN, a classic PAT with repo scope, at Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          # ── 🔴 THE LOOP HAS A CEILING, AND A SELF-SKIP WOULD BE THE WRONG ONE ──
          # A plain "skip when the pushed commit is a repair commit" is WRONG here:
          # a repair generated on one day and merged on the next legitimately costs
          # ONE further sitemap-only round before the fixed point, and skipping it
          # would leave main red with nothing coming. What is a defect is the THIRD
          # consecutive repair commit still leaving drift — that is a generator that
          # does not converge, and it must go red rather than open pull requests for
          # ever now that they merge themselves.
          REPAIR_SUBJECT='sites: regenerate the discovery surface'
          MAX_REPAIR_CHAIN=2
          chain=0
          while [ "$chain" -lt 8 ]; do
            subject=$(git log -1 --format=%s "HEAD~${chain}" 2>/dev/null) || break
            case "$subject" in
              "${REPAIR_SUBJECT}"*) chain=$((chain + 1)) ;;
              *) break ;;
            esac
          done
          echo "consecutive repair commits at the tip: ${chain}"

          BRANCH="chore/site-drift-${{ github.run_id }}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -A so a file the generator ADDS (a brand-new landing joins the
          # sitemap in the run that creates it) is carried too, not only the
          # modifications. Scoped to sites/ so nothing else can ride along.
          git add -A -- sites/
          git checkout -b "$BRANCH"
          git commit -m "${REPAIR_SUBJECT} after ${GITHUB_SHA}" -m "Written by .github/workflows/site-drift-repair.yml, which runs tooling/sites/generate-discovery.mjs on every push to main. The pull request body says what this closes and what it does not."

          # THE REPAIR IS PUT SOMEWHERE DURABLE BEFORE IT IS PROPOSED. The
          # proposal is the step that can be refused; the patch is not.
          git format-patch -1 --stdout > "$OUT/site-drift-repair.patch"

          if [ "$chain" -ge "$MAX_REPAIR_CHAIN" ]; then
            echo '--- THE COMPUTED REPAIR, IN FULL ---'
            cat "$OUT/site-drift-repair.patch"
            echo '--- END OF THE COMPUTED REPAIR ---'
            echo "::error title=The site drift repair is not converging::${chain} consecutive repair commits are already at the tip of main and regenerating STILL changes sites/. Two rounds is the documented ceiling (a cross-day merge costs exactly one extra sitemap-only round; see docs/ci/site-drift-repair.md). A third means tooling/sites/generate-discovery.mjs is not idempotent against its own output, so NO pull request was opened — an automatically merging repair loop must not run on a generator that does not settle. The patch is printed above and uploaded as this run's site-drift-repair artifact."
            exit 1
          fi

          {
            printf '%s\n\n' 'Rows: none — automated site drift repair (generated sites/ only)'
            printf '%s\n\n' 'The generator `tooling/sites/generate-discovery.mjs` produced a discovery surface that differs from what `main` carries, so `tooling/ci/check-site-integrity.mjs` is failing (or is about to fail) on `main`. This branch is that regeneration, unedited.'
            printf '%s\n\n' '**Why no pre-merge lane could have caught it.** `<lastmod>` is derived from each page git date (`tooling/sites/lastmod.mjs`), so the correct value for a page a PR changes is the date that PR *merges* — a date that does not exist while the PR is open. The `sites` job in `ci.yml` is right about the pre-merge tree every time, and the merge is what makes it wrong. This was hand-repaired in `f67ee2b` (2026-08-25) and again 16 days earlier in `6ea109d`.'
            printf '%s\n\n' '**This pull request merges itself.** Auto-merge (squash) is armed on it by the same step that opened it, so it lands the moment `ci-gate` is green and nothing waits on a human. Branch protection is unchanged: `ci-gate` is still the required check, so a red gate stops this exactly as it stops anything else, and the pull request then sits open for a person to read.'
            printf '%s\n\n' '**HONEST RESIDUAL — this shortens the window, it does not close it.** Cloudflare Git integration deploys `sites/nikatru` on the *merge push*, with no workflow involved and no GitHub check it can read. The stale sitemap is therefore **already live** and stays live until this pull request merges. On 2026-08-25 the equivalent window was 14m49s, with a human watching and acting. What this automation changes is that the repair is drafted, correct and self-merging rather than remembered; a crawler arriving inside the window still sees the stale `<lastmod>`.'
            printf '%s\n\n' 'A zero window would mean pushing straight to protected `main`. That is a branch-protection change and owner work; this workflow does not attempt it.'
            printf '%s\n'   '**Review note.** This diff should be generated bytes and nothing else. If it contains anything that is not a regeneration, do not merge it — say so on the pull request instead.'
          } > "${RUNNER_TEMP}/pr-body.md"
          cp "${RUNNER_TEMP}/pr-body.md" "$OUT/pr-body.md"

          git push "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"

          # ── 🔴 `gh pr create` CAN BE REFUSED, AND A REFUSAL IS NOT A REPAIR ──
          # `set -euo pipefail` alone would end the job on the raw `gh` message:
          # red, but naming a permission the reader must then trace back to a
          # setting. So the exit code is caught, the cause is named, and the exit
          # stays non-zero.
          set +e
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "sites: regenerate the discovery surface (automated drift repair)" \
            --body-file "${RUNNER_TEMP}/pr-body.md" > "$OUT/gh-pr-create.log" 2>&1
          PR_RC=$?
          set -e
          cat "$OUT/gh-pr-create.log"

          if [ "$PR_RC" -ne 0 ]; then
            # The patch, in the log, so a reader who cannot download artifacts
            # still has the repair in front of them.
            echo '--- THE COMPUTED REPAIR, IN FULL ---'
            cat "$OUT/site-drift-repair.patch"
            echo '--- END OF THE COMPUTED REPAIR ---'

            if grep -qiE 'not permitted to create or approve pull requests' "$OUT/gh-pr-create.log"; then
              CAUSE='the repository setting "Allow GitHub Actions to create and approve pull requests" is OFF, so even a PAT-authenticated `gh` inside Actions is refused.'
              REMEDY='REMEDY (owner work): Settings -> Actions -> General -> Workflow permissions -> tick "Allow GitHub Actions to create and approve pull requests". API equivalent: gh api -X PUT "repos/'"${GITHUB_REPOSITORY}"'/actions/permissions/workflow" -F can_approve_pull_request_reviews=true'
            elif grep -qiE 'HTTP 40[13]|Bad credentials|Resource not accessible' "$OUT/gh-pr-create.log"; then
              CAUSE='RENOVATE_TOKEN was rejected — expired, revoked, or no longer carrying repo scope.'
              REMEDY='REMEDY (owner work): reissue the classic PAT with repo scope and update the RENOVATE_TOKEN repository secret. `.github/workflows/renovate.yml` uses the same secret and will be failing too.'
            else
              CAUSE="gh pr create exited ${PR_RC} for a reason this step does not recognise."
              REMEDY='REMEDY: read the gh output above.'
            fi

            echo "::error title=Site drift was repaired but the pull request could not be opened::${CAUSE} THE REPAIR IS NOT LOST — branch ${BRANCH} is pushed, and the patch is both printed above and uploaded as this run's site-drift-repair artifact; open the pull request by hand from ${BRANCH} into main. ${REMEDY}"
            exit 1
          fi

          PR_URL="$(tail -n 1 "$OUT/gh-pr-create.log")"
          echo "opened ${PR_URL}"

          # ── 🔴 ARMING AUTO-MERGE IS THE HALF THAT CLOSES THE LOOP ────────────
          # Without it the pull request is correct, checked and green, and still
          # waits for a hand. `--auto` queues the squash behind ci-gate; branch
          # protection decides whether it ever fires, which is why this needs no
          # change there at all.
          set +e
          gh pr merge "$PR_URL" --auto --squash > "$OUT/gh-pr-merge.log" 2>&1
          MERGE_RC=$?
          set -e
          cat "$OUT/gh-pr-merge.log"

          if [ "$MERGE_RC" -ne 0 ]; then
            if grep -qiE 'auto.?merge is not (allowed|enabled)|Protected branch rules not configured' "$OUT/gh-pr-merge.log"; then
              CAUSE='the repository setting "Allow auto-merge" is OFF.'
              REMEDY='REMEDY (owner work): gh api -X PATCH "repos/'"${GITHUB_REPOSITORY}"'" -F allow_auto_merge=true'
            else
              CAUSE="gh pr merge --auto exited ${MERGE_RC} for a reason this step does not recognise."
              REMEDY='REMEDY: read the gh output above.'
            fi
            echo "::error title=The repair pull request is open but will not merge itself::${CAUSE} ${PR_URL} IS OPEN AND CORRECT — merge it by hand and main goes green. ${REMEDY}"
            exit 1
          fi

          echo "::notice title=Site drift repair proposed and armed::${PR_URL} will squash-merge itself as soon as ci-gate is green. main is red until it does."

      - name: Preserve the computed repair
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site-drift-repair
          path: ${{ runner.temp }}/site-drift-repair/
          if-no-files-found: error

      - name: Site integrity — the repaired tree agrees with git
        run: node tooling/ci/check-site-integrity.mjs . sites/nikatru sites/rajasekarselvam
