name: Renovate

run-name: "Renovate (${{ github.event_name }}) by @${{ github.actor }}"

# The measurements, retractions and traps behind this file are in
# docs/ci/renovate.md. Only `# why:` lines live here, and
# docs/ci/README.md carries the rules every workflow has to obey.

on:
  workflow_dispatch:

  # why: DAILY against a duty declared weekly. GitHub delivers this repository's
  # scheduled runs 10.1% on time, so a weekly slot gives the freshness window one
  # chance; renovate.json's own schedule decides when work actually happens.
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: Renovate the public platform repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Run Renovate
        uses: renovatebot/github-action@39b914146caeff8cd512e61c8992f1d5913af85c
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          # One repository, explicitly (NOT autodiscover). Nikatru_Extensions_Public was
          # merged into this repo as extensions/ on 2026-09-05 (ADR 067 d.1) and deleted on
          # GitHub; naming it made every run exit non-zero (initRepo platform-unknown-error).
          RENOVATE_REPOSITORIES: globalonlinedeveloper/Nikatru_Platform_Public
          RENOVATE_ONBOARDING: 'false'
          # why: 'required', not 'optional'. A repository whose config Renovate rejects must
          # stop being processed loudly rather than be onboarded with defaults.
          RENOVATE_REQUIRE_CONFIG: 'required'
          RENOVATE_GIT_AUTHOR: 'nikatru-renovate <renovate@nikatru.com>'
          LOG_LEVEL: info
