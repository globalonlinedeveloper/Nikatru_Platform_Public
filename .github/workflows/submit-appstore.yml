name: "Store submit: Apple App Store"

run-name: "Store submit: Apple App Store (dry run) by @${{ github.actor }}"

# The measurements, retractions and traps behind this file are in
# docs/ci/submit-appstore.md. Only `# why:` lines live here, and
# docs/ci/README.md carries the rules every workflow has to obey.

on:
  workflow_dispatch:

permissions:
  contents: read
  checks: read

jobs:
  gate:
    name: Require ci-gate to have passed
    runs-on: ubuntu-24.04
    # why: 25, not 10. assert-gate-passed.mjs polls for up to its own 1200 s default,
    # so any bound at or under 20 kills it mid-poll and replaces "timed out waiting
    # for ci-gate" with an opaque cancellation. Byte-identical in all five gate jobs.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require ci-gate to have passed for this commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node tooling/ci/assert-gate-passed.mjs ${{ github.sha }}

  dry-run:
    name: Validate the submission path
    runs-on: macos-26
    timeout-minutes: 30
    needs: gate
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-flutter
      - name: Resolve the workspace
        run: flutter pub get --enforce-lockfile
      # why: the version stamp. This lane only compiles, but an unstamped compile is the
      # shape that shipped `dev` to production D1 from submit-play.yml on 2026-09-22 —
      # assert-app-versioning.mjs holds every release build in every workflow to it.
      - name: Derive the release line from pubspec
        id: ver
        run: node tooling/ci/assert-app-versioning.mjs --emit apps/subscriptiontracker >> "$GITHUB_OUTPUT"
      - name: Toolchain under test
        run: |
          sw_vers
          xcodebuild -version
          uname -m
      # ⏱ RENAMED 2026-09-09. This step was called "unsigned — no distribution
      # certificate exists", and that reason stopped being true today: a
      # DISTRIBUTION certificate and an IOS_APP_STORE profile were issued through
      # the ASC API, and build-platforms.yml now emits a SIGNED .ipa with them.
      # This workflow deliberately does NOT: it ends at a refusal (see
      # tooling/release/submit-appstore.mjs, which refuses --submit by design),
      # so what it needs is a compile proof, not a signed artifact it must not
      # upload. The build stays unsigned because this lane must not submit — not
      # because nothing here could sign.
      - name: Build iOS (unsigned on purpose — this lane must never submit)
        working-directory: apps/subscriptiontracker
        run: >
          flutter build ios --release --no-codesign
          --obfuscate --split-debug-info=build/symbols/ios
          --build-name=${{ steps.ver.outputs.release_line }}.${{ github.run_number }}
          --build-number=${{ github.run_number }}
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }}
          --dart-define=APP_VERSION=${{ steps.ver.outputs.release_line }}.${{ github.run_number }}+${GITHUB_SHA::7}
          --dart-define=RELEASE_CHANNEL=ios-appstore
          --dart-define=REVENUECAT_KEY=${{ secrets.REVENUECAT_PUBLIC_KEY_APPLE }}
          --dart-define=GLITCHTIP_DSN=${{ secrets.GLITCHTIP_DSN }}
      # Same correction as the iOS step above: unsigned BY CHOICE, not for want
      # of a certificate. A Mac Installer Distribution certificate exists too.
      - name: Build macOS (unsigned on purpose — this lane must never submit)
        working-directory: apps/subscriptiontracker
        run: >
          flutter build macos --release
          --obfuscate --split-debug-info=build/symbols/macos
          --build-name=${{ steps.ver.outputs.release_line }}.${{ github.run_number }}
          --build-number=${{ github.run_number }}
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }}
          --dart-define=APP_VERSION=${{ steps.ver.outputs.release_line }}.${{ github.run_number }}+${GITHUB_SHA::7}
          --dart-define=RELEASE_CHANNEL=macos-appstore
          --dart-define=REVENUECAT_KEY=${{ secrets.REVENUECAT_PUBLIC_KEY_APPLE }}
          --dart-define=GLITCHTIP_DSN=${{ secrets.GLITCHTIP_DSN }}
      # ⏱ CORRECTED 2026-09-07 (unit `symbols-everywhere`) — this comment used to
      # end "Retained rather than sent to the crash sink because
      # tooling/versions.json pins ONE glitchtip-cli binary and it is
      # linux-x86_64; this job runs on macOS." The macOS binary of the same
      # release is now pinned by digest as `glitchtip_cli_macos_arm64_sha256`,
      # and the sink upload is two steps below.
      # why: both builds above are obfuscated, so their crash reports are
      # unreadable without these directories, and a rebuild produces DIFFERENT
      # ones. The artifact stays, and stays FIRST: it is what survives the sink
      # losing them.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: symbols-subscriptiontracker-appstore
          path: |
            apps/subscriptiontracker/build/symbols/ios
            apps/subscriptiontracker/build/symbols/macos
          retention-days: 90
          if-no-files-found: error
      # why: `shasum -a 256`, not `sha256sum` — macOS does not ship coreutils'
      # `sha256sum`. Byte-identical otherwise to build-platforms.yml's apple
      # lane, and reading both halves of the pin from tooling/versions.json at
      # run time so a bump cannot advance one without the other.
      - name: Install glitchtip-cli (pinned by version AND by digest)
        run: |
          set -euo pipefail
          ver="$(node -p "require('./tooling/versions.json').glitchtip_cli")"
          sum="$(node -p "require('./tooling/versions.json').glitchtip_cli_macos_arm64_sha256")"
          url="https://gitlab.com/glitchtip/glitchtip-cli/-/jobs/artifacts/v${ver}/raw/artifacts/glitchtip-cli-macos-arm64?job=build-macos-arm64"
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            --output "${RUNNER_TEMP}/glitchtip-cli" "$url"
          printf '%s  %s\n' "$sum" "${RUNNER_TEMP}/glitchtip-cli" | shasum -a 256 --check --strict -
          chmod +x "${RUNNER_TEMP}/glitchtip-cli"
          got="$("${RUNNER_TEMP}/glitchtip-cli" --version)"
          if [ "$got" != "glitchtip-cli ${ver}" ]; then
            echo "::error title=glitchtip-cli::the pinned binary reports \"${got}\", not \"glitchtip-cli ${ver}\""
            exit 1
          fi
          echo "$got"
      # why: TWO directories, one per build — iOS and macOS are two AOT
      # compilations and nothing guarantees they share a mapping. FAILS CLOSED on
      # a missing GLITCHTIP_TOKEN, never skips. Placed AFTER the retention step
      # above and BEFORE the two App Store dry runs below, so neither a GlitchTip
      # outage nor an App Store Connect failure can take the mapping with it.
      - name: Upload the native debug symbols to GlitchTip
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.GLITCHTIP_TOKEN }}
          GLITCHTIP_DSN: ${{ secrets.GLITCHTIP_DSN }}
        run: |
          set -euo pipefail
          for lane in ios macos; do
            node tooling/ops/upload-native-symbols.mjs \
              --cli "${RUNNER_TEMP}/glitchtip-cli" \
              --dir "apps/subscriptiontracker/build/symbols/${lane}" \
              --org nikatru --project subscriptiontracker
          done
      - name: Dry-run the App Store submission (iOS)
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APP_STORE_CONNECT_APP_ID: ${{ secrets.APP_STORE_CONNECT_IOS_APP_ID }}
        # why: --allow-missing-artifact here and NOT on the Windows lane. No distribution
        # certificate exists, so there is no signed .ipa to validate; the Windows dry run
        # builds and packages a real .msix first and must not be given this flag.
        run: node tooling/release/submit-appstore.mjs --dry-run --channel ios-appstore --app subscriptiontracker --allow-missing-artifact
      - name: Dry-run the App Store submission (macOS)
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APP_STORE_CONNECT_APP_ID: ${{ secrets.APP_STORE_CONNECT_MACOS_APP_ID }}
        run: node tooling/release/submit-appstore.mjs --dry-run --channel macos-appstore --app subscriptiontracker --allow-missing-artifact
