name: Symbolication proof

run-name: "Symbolication proof by @${{ github.actor }}"

# The measurements, the source reading and the expected verdict behind this file
# are in docs/ci/symbolication-proof.md. Only `# why:` lines live here, and
# docs/ci/README.md carries the rules every workflow has to obey.

on:
  # why: dispatch ONLY. It sends a real event to the production crash sink and
  # boots an emulator (~25 runner-minutes); it answers one question per GlitchTip
  # release, not one per commit. Row O-GLITCHTIP-FLUTTER-SYMBOLICATION-UNPROVEN.
  workflow_dispatch:

concurrency:
  group: symbolication-proof
  cancel-in-progress: false

permissions:
  contents: read
  checks: read

jobs:
  gate:
    name: Require ci-gate to have passed
    runs-on: ubuntu-24.04
    # why: 25, not 10. assert-gate-passed.mjs polls for up to its own 1200 s default,
    # so any bound at or under 20 kills it mid-poll and replaces "timed out waiting
    # for ci-gate" with an opaque cancellation. Byte-identical in all five gate jobs.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require ci-gate to have passed for this commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node tooling/ci/assert-gate-passed.mjs ${{ github.sha }}

  prove:
    name: An obfuscated Android crash, symbolicated by GlitchTip, against its known line
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: gate
    permissions:
      contents: read
    env:
      PROBE_SOURCE: live_probe/symbolication_crash_probe.dart
      SYMBOLS_DIR: build/symbols/probe-android-x64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # why: FAILS CLOSED. Without the DSN the probe builds a NoOp client and
      # sends nothing; without the token nothing can be uploaded or read back.
      - name: Preflight — the two GlitchTip secrets must be present
        env:
          GLITCHTIP_DSN: ${{ secrets.GLITCHTIP_DSN }}
          GLITCHTIP_TOKEN: ${{ secrets.GLITCHTIP_TOKEN }}
        run: |
          missing=""
          [ -z "$GLITCHTIP_DSN" ] && missing="$missing GLITCHTIP_DSN"
          [ -z "$GLITCHTIP_TOKEN" ] && missing="$missing GLITCHTIP_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error title=Symbolication proof cannot run::Missing secret(s):$missing. This is a failed run, not a skipped one."
            exit 1
          fi

      - uses: ./.github/actions/setup-node

      - uses: ./.github/actions/setup-flutter

      - name: Resolve the workspace
        run: flutter pub get --enforce-lockfile

      - name: The expected crash site, read from the probe source
        working-directory: apps/subscriptiontracker
        run: node ../../tooling/ops/symbolication-proof.mjs expect --source "$PROBE_SOURCE"

      # why: x64 only, because that is what the emulator executes; the flags are
      # the release lanes' flags, so the frame under test is shaped exactly as a
      # shipped build's. No upload key: this APK is debug-signed and ships nowhere.
      - name: Build the crash probe (obfuscated release apk)
        working-directory: apps/subscriptiontracker
        env:
          GLITCHTIP_DSN: ${{ secrets.GLITCHTIP_DSN }}
        run: >
          flutter build apk --release
          --obfuscate --split-debug-info="$SYMBOLS_DIR"
          --target-platform android-x64
          -t "$PROBE_SOURCE"
          --dart-define=GLITCHTIP_DSN="$GLITCHTIP_DSN"

      # why: before any network call, for the reason build-platforms.yml gives:
      # a later failure must not take the only mapping of this build with it.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: symbols-symbolication-probe-android-x64
          path: apps/subscriptiontracker/build/symbols/probe-android-x64
          retention-days: 30
          if-no-files-found: error

      - name: Install glitchtip-cli (pinned by version AND by digest)
        run: |
          set -euo pipefail
          ver="$(node -p "require('./tooling/versions.json').glitchtip_cli")"
          sum="$(node -p "require('./tooling/versions.json').glitchtip_cli_sha256")"
          url="https://gitlab.com/glitchtip/glitchtip-cli/-/jobs/artifacts/v${ver}/raw/artifacts/glitchtip-cli-linux-x86_64?job=build-linux-x86_64"
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            --output "${RUNNER_TEMP}/glitchtip-cli" "$url"
          printf '%s  %s\n' "$sum" "${RUNNER_TEMP}/glitchtip-cli" | sha256sum --check --strict -
          chmod +x "${RUNNER_TEMP}/glitchtip-cli"
          got="$("${RUNNER_TEMP}/glitchtip-cli" --version)"
          if [ "$got" != "glitchtip-cli ${ver}" ]; then
            echo "::error title=glitchtip-cli::the pinned binary reports \"${got}\", not \"glitchtip-cli ${ver}\""
            exit 1
          fi
          echo "$got"

      # why: symbolication happens at INGEST, so the debug files must be stored
      # before the probe's event arrives. The wrapper fails closed on the token.
      - name: Upload the probe's native debug symbols to GlitchTip
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.GLITCHTIP_TOKEN }}
          GLITCHTIP_DSN: ${{ secrets.GLITCHTIP_DSN }}
        run: |
          set -euo pipefail
          gt_org="$(node -p "require('./tooling/ops/glitchtip-project.json').org")"
          gt_project="$(node -p "require('./tooling/ops/glitchtip-project.json').project")"
          node tooling/ops/upload-native-symbols.mjs \
            --cli "${RUNNER_TEMP}/glitchtip-cli" \
            --dir "apps/subscriptiontracker/${SYMBOLS_DIR}" \
            --org "$gt_org" --project "$gt_project"

      # why: a plain script over the runner's preinstalled Android SDK, not
      # reactivecircus/android-emulator-runner: the repository allows only
      # `selected` actions and that one is not on the list. Every wait has a
      # ceiling and every failure prints WHY (the emulator's own log tail).
      #
      # 🔴 ANDROID_AVD_HOME IS PINNED, AND THAT IS THE FIX FOR RUN 35451496350.
      # avdmanager wrote the AVD in one place and the emulator looked in another:
      # the kept emulator.log read "Unknown AVD name [probe] ... there is no file
      # probe.ini in $HOME/.android/avd", the emulator exited at once, and
      # `timeout 300 adb wait-for-device` then waited on a device that no longer
      # existed and died 124 with nothing printed. Both tools honour
      # ANDROID_AVD_HOME, so it is set once for both, and the AVD is listed back
      # from the emulator's side before anything waits on it.
      - name: Boot an emulator, run the probe, capture logcat
        env:
          API_LEVEL: '34'
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            ls -l /dev/kvm || true
            echo "::error title=Emulator::/dev/kvm is not usable by this user; an x86_64 emulator without KVM does not boot inside the ceiling"
            exit 1
          fi
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export ANDROID_AVD_HOME="${RUNNER_TEMP}/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          emu_log="${RUNNER_TEMP}/emulator.log"
          image="system-images;android-${API_LEVEL};google_apis;x86_64"
          why() {
            echo "::error title=Emulator::$1"
            echo "── emulator.log (tail) ──"
            tail -n 60 "$emu_log" 2>/dev/null || echo "(no emulator.log)"
            echo "── AVDs the emulator can see ──"
            "$sdk/emulator/emulator" -list-avds 2>&1 || true
            exit 1
          }
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          timeout 600 "$sdk/cmdline-tools/latest/bin/sdkmanager" --install emulator platform-tools "$image" > /dev/null
          echo no | "$sdk/cmdline-tools/latest/bin/avdmanager" create avd --force -n probe -k "$image" --device pixel_6
          if ! "$sdk/emulator/emulator" -list-avds | grep -qx probe; then
            ls -la "$ANDROID_AVD_HOME" "$HOME/.android/avd" "${XDG_CONFIG_HOME:-$HOME/.config}/.android/avd" 2>&1 || true
            why "avdmanager created no AVD the emulator can see in ANDROID_AVD_HOME=${ANDROID_AVD_HOME}"
          fi
          nohup "$sdk/emulator/emulator" -avd probe -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -accel on > "$emu_log" 2>&1 &
          emu_pid=$!
          adb="$sdk/platform-tools/adb"
          "$adb" start-server
          # One loop for both phases (device visible, then boot_completed), 420 s in
          # all, polling every 5 s, a progress line every 30 s, and the emulator's
          # PID checked on every pass so a dead emulator is named at once.
          deadline=$((SECONDS + 420))
          next_note=$((SECONDS + 30))
          phase="waiting for the device to appear"
          while :; do
            if ! kill -0 "$emu_pid" 2>/dev/null; then
              why "the emulator process exited during: ${phase}"
            fi
            state="$("$adb" get-state 2>/dev/null | tr -d '\r' || true)"
            if [ "$state" = "device" ]; then
              phase="waiting for sys.boot_completed"
              booted="$("$adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
              [ "$booted" = "1" ] && break
            fi
            if [ "$SECONDS" -gt "$deadline" ]; then
              why "not booted within 420 s (last phase: ${phase}; adb state: ${state:-none})"
            fi
            if [ "$SECONDS" -ge "$next_note" ]; then
              echo "… ${SECONDS}s: ${phase} (adb state: ${state:-none})"
              next_note=$((SECONDS + 30))
            fi
            sleep 5
          done
          echo "emulator booted at ${SECONDS}s"
          pkg=com.nikatru.subscriptiontracker
          # Each sub-phase is ASSERTED, in order, and a failure prints the logcat
          # slice that says why (run 35458257697 reached SENT and nothing before
          # it, and the next step could only say "the probe did not run").
          probe_why() {
            "$adb" logcat -d > "${RUNNER_TEMP}/logcat.txt" 2>/dev/null || true
            echo "::error title=Probe::$1"
            echo "── logcat: flutter, crashes, and the app's own pid (tail) ──"
            pid="$("$adb" shell pidof "$pkg" 2>/dev/null | tr -d '\r' || true)"
            grep -E " flutter *:|AndroidRuntime|FATAL|SYMPROBE| Sentry|sentry|${pid:-NO_PID} " "${RUNNER_TEMP}/logcat.txt" | tail -n 120 || true
            exit 1
          }
          timeout 120 "$adb" install -r apps/subscriptiontracker/build/app/outputs/flutter-apk/app-release.apk
          "$adb" shell pm path "$pkg" | grep -q '^package:' || probe_why "INSTALLED: pm has no path for $pkg after install"
          echo "phase ok: installed"
          "$adb" logcat -c
          timeout 120 "$adb" shell am start -W -n "$pkg/.MainActivity"
          # Poll the whole log to a file, never `logcat | grep -q`: under pipefail
          # an early grep exit SIGPIPEs logcat and a match reads as a miss.
          poll() { "$adb" logcat -d -s flutter:I > "${RUNNER_TEMP}/logcat-poll.txt" 2>/dev/null || true; }
          wait_for() {
            local what="$1" needle="$2" ceiling="$3" until_s=$((SECONDS + $3))
            while :; do
              poll
              if grep -qF "$needle" "${RUNNER_TEMP}/logcat-poll.txt"; then
                echo "phase ok: ${what} (${SECONDS}s)"
                return 0
              fi
              if [ -z "$("$adb" shell pidof "$pkg" 2>/dev/null | tr -d '\r' || true)" ]; then
                poll
                grep -qF "$needle" "${RUNNER_TEMP}/logcat-poll.txt" && { echo "phase ok: ${what} (${SECONDS}s)"; return 0; }
                probe_why "${what}: the app process is gone before \"${needle}\" appeared"
              fi
              [ "$SECONDS" -gt "$until_s" ] && probe_why "${what}: \"${needle}\" not in logcat within ${ceiling}s"
              sleep 3
            done
          }
          [ -n "$("$adb" shell pidof "$pkg" 2>/dev/null | tr -d '\r' || true)" ] \
            || probe_why "LAUNCHED: am start returned but no $pkg process is running"
          echo "phase ok: launched"
          wait_for "BEGIN (probe main ran)" "SYMPROBE|BEGIN " 60
          wait_for "TRACE (the throw was caught and printed)" "SYMPROBE|TRACE-END" 60
          wait_for "SENT (captureException returned)" "SYMPROBE|SENT " 120
          # The native transport sends the envelope it was handed asynchronously.
          sleep 20
          "$adb" logcat -d > "${RUNNER_TEMP}/logcat.txt"
          grep -F 'SYMPROBE|' "${RUNNER_TEMP}/logcat.txt"
          # The SDK's own transport lines, and the app's sockets, printed on every
          # run so a send that never lands is diagnosable from this log alone.
          # Release builds log little here (the SDK's debug flag is off, as in
          # every shipped app); what does appear is kept.
          echo "── SDK / network lines from ${pkg} ──"
          app_pid="$(grep -m1 -F 'SYMPROBE|BEGIN ' "${RUNNER_TEMP}/logcat.txt" | awk '{print $3}')"
          grep -E "^[0-9-]+ [0-9:.]+ +${app_pid:-NO_PID} .*(Sentry|sentry|TrafficStats|okhttp|SSL|Unknown[Hh]ost|[Cc]onnect)" \
            "${RUNNER_TEMP}/logcat.txt" | tail -n 40 || echo "(none)"

      - name: Extract the raw trace and this run's marker from logcat
        id: extract
        working-directory: apps/subscriptiontracker
        run: >
          node ../../tooling/ops/symbolication-proof.mjs extract-trace
          --logcat "${RUNNER_TEMP}/logcat.txt" --out "${RUNNER_TEMP}/trace.txt"
          --marker-out "${RUNNER_TEMP}/marker.txt"

      # why: NOT `flutter symbolize`. Flutter 3.47.4's tool pins
      # native_stack_traces 0.6.1, which predates the VM-isolate removal, and the
      # 3.47.4 engine already writes `_kDartSnapshotText` frames with
      # `vm_dso_base: 0`: run 35463786607 died "Cannot locate isolate
      # instructions section in snapshot" on a trace whose header and build_id
      # were intact and matched the symbols file. The decoder version has one
      # home, tooling/versions.json `native_stack_traces`.
      - name: Ground truth — decode the raw trace offline against the build's own symbols
        id: truth
        working-directory: apps/subscriptiontracker
        run: |
          set -euo pipefail
          nst="$(node -p "require('../../tooling/versions.json').native_stack_traces")"
          dart pub global activate native_stack_traces "$nst"
          dart pub global run native_stack_traces:decode translate \
            -d "${SYMBOLS_DIR}/app.android-x64.symbols" \
            -i "${RUNNER_TEMP}/trace.txt" -o "${RUNNER_TEMP}/symbolized.txt"
          cat "${RUNNER_TEMP}/symbolized.txt"

      # why: always(), once the marker exists. The SINK is what the row asks, so a
      # failed ground truth must not hide it; the script reads the sink anyway and
      # exits 1 on either MISMATCH, 2 when the ground truth is UNAVAILABLE (never
      # 0), so the job still fails whenever either half does. Neither is retried.
      - name: Verdict — the GlitchTip frame against the known line
        if: ${{ always() && steps.extract.outcome == 'success' }}
        working-directory: apps/subscriptiontracker
        env:
          GLITCHTIP_TOKEN: ${{ secrets.GLITCHTIP_TOKEN }}
        run: >
          node ../../tooling/ops/symbolication-proof.mjs verdict
          --source "$PROBE_SOURCE"
          --trace "${RUNNER_TEMP}/trace.txt"
          --symbolized "${RUNNER_TEMP}/symbolized.txt"
          --marker "$(cat "${RUNNER_TEMP}/marker.txt")"
          --report "${RUNNER_TEMP}/symbolication-report.json"
          --wait-seconds 300

      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: symbolication-proof-evidence
          path: |
            ${{ runner.temp }}/logcat.txt
            ${{ runner.temp }}/trace.txt
            ${{ runner.temp }}/symbolized.txt
            ${{ runner.temp }}/symbolication-report.json
            ${{ runner.temp }}/marker.txt
            ${{ runner.temp }}/emulator.log
          retention-days: 30
          if-no-files-found: warn

      - name: Stop the emulator
        if: always()
        run: |
          adb="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/platform-tools/adb"
          [ -x "$adb" ] && timeout 30 "$adb" emu kill || true
