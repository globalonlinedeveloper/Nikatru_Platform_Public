name: Lane — workers

# The workers lane of ci.yml, as a callee (ADR 095). It runs ONLY as a call: ci.yml's
# `lane-workers` job calls it with no `if:` on every push to main and every pull
# request, and ci-gate needs that job, so a red job here is a red required check.
# `detect` decides from tooling/ci/lane-map.json whether this change touches the
# lane and reads the Worker set; `worker` runs one leg per Worker only when detect
# says affected=true; `lane-verdict` refuses every skip detect did not license.
# docs/ci/README.md §3 has the lane map.

on:
  workflow_call:

permissions:
  contents: read

# why: no `concurrency:` key. The caller's group governs the run, and a callee group
# equal to the caller's would cancel the call from inside it.

jobs:
  detect:
    # why: fetch-depth 0, so `git diff <base>...<head>` has the merge base. It fails
    # open: a push, a non-PR event, an unmapped path or an unreadable diff all say
    # affected=true (tooling/ci/lane-detect.mjs).
    name: detect (workers)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      affected: ${{ steps.detect.outputs.affected }}
      reason: ${{ steps.detect.outputs.reason }}
      workers: ${{ steps.workers.outputs.workers }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      - id: detect
        name: Does this change touch the workers lane
        run: node tooling/ci/lane-detect.mjs --lane workers
      # why: the matrix comes from the directories under services/, never from this
      # file (tooling/ci/worker-set.mjs). It runs whatever detect said, so the set is
      # read, and refused when empty, on every run. --for-deploy holds each Worker to
      # its tooling/platform-register.json row and its COMMITTED package-lock.json
      # first, so a Worker with no row or no lockfile is red here before any npm ci.
      - id: workers
        name: The Worker set comes from services/, never from this file
        run: |
          set -euo pipefail
          workers="$(node tooling/ci/worker-set.mjs --for-deploy --emit)"
          echo "workers=${workers}" >> "$GITHUB_OUTPUT"

  worker:
    # why: one leg per Worker directory (the detect job's `workers` output), so a
    # Worker added under services/ is typechecked, tested and dry-run deployed with no
    # edit here. fail-fast off: one Worker's red leaves every other leg's verdict.
    name: ${{ matrix.worker }} Worker (typecheck + test + dry-run)
    needs: detect
    if: needs.detect.outputs.affected == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        worker: ${{ fromJSON(needs.detect.outputs.workers) }}
    defaults:
      run:
        working-directory: services/${{ matrix.worker }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npx wrangler deploy --dry-run
      # why: env.sandbox is deployed only by the manual deploy-sandbox.yml, so
      # this is the one place a broken sandbox block fails before a dispatch.
      - run: npx wrangler deploy --env sandbox --dry-run

  lane-verdict:
    # why: the callee's conclusion is what ci-gate sees, and a callee whose work jobs
    # all skipped concludes success. This job needs every other job, runs always(),
    # and is red on failure, cancelled, a detect that did not succeed, or a skip
    # detect did not license (assert-green-means-ran A8 asserts the shape).
    name: lane-verdict
    needs: [detect, worker]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - name: Every need is green, or skipped under detect's affected=false
        env:
          LANE_NEEDS: ${{ toJSON(needs) }}
        run: node tooling/ci/lane-verdict.mjs
