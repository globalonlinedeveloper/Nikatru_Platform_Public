name: Deploy Web

# Builds Subly web with the real Flutter SDK on GitHub's runners, then
# uploads the built site to the EXISTING Cloudflare Pages project "subly"
# via wrangler (Direct Upload) — so subly.nikatru.com stays put.

on:
  push:
    branches: [main]
    paths:
      - 'apps/subly/**'
      - 'packages/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

# Least privilege: this job only needs to read the repo and read ci-gate's
# verdict. It deploys via a Cloudflare token, not GITHUB_TOKEN. [pipeline F-5b]
permissions:
  contents: read
  checks: read
  deployments: write

jobs:
  deploy-web:
    name: Build & deploy Subly web to Cloudflare Pages
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/subly
    steps:
      - uses: actions/checkout@v4

      # MUST be first. This workflow triggers on push to main with no dependency
      # on CI, so without this the deploy and the tests race — and the deploy
      # (~3 min) finishes first (~6 min). Also gates the manual redeploy button,
      # which previously consulted nothing at all. Fails closed. [pipeline F-5b]
      - name: Require ci-gate to have passed for this commit
        working-directory: .
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node tooling/ci/assert-gate-passed.mjs ${{ github.sha }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.7

      - run: flutter pub get --enforce-lockfile

      - name: Build web (release, no service worker)
        run: >
          flutter build web --release --pwa-strategy=none
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }}

      - name: Deploy to Cloudflare Pages (project subly)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/subly
          command: pages deploy build/web --project-name=subly --branch=main

      # "What is live right now?" must be answerable without inference.
      # CLAUDE.md: never assert done/live/working from memory. [pipeline F-5b]
      - name: Record the deployed SHA
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tooling/ci/record-deployment.mjs subly-web https://subly.nikatru.com
