name: Deploy web

# The measurements, retractions and traps behind this file are in
# docs/ci/deploy-web.md. Only `# why:` lines live here, and
# docs/ci/README.md carries the rules every workflow has to obey.

on:
  # why: RUNS ONLY AS ci.yml's `deploy-web` CALL JOB, after ci-gate, on a push to main
  # ([ADR 095] §4). ci-gate is a `needs:` of the call, so a red or skipped gate never
  # starts this file, and there is no push trigger, paths list or dispatch left to
  # start it any other way. WHICH changes publish is deployUnits["<app>-web"] in
  # tooling/ci/lane-map.json, read by plan-deploy.mjs below, graded by
  # assert-deploy-triggers.mjs (build inputs) and assert-deploy-triggers-deploy.mjs
  # (this file, and the import closure).
  workflow_call:
    # why: NAMED, NOT INHERITED. The call passes exactly these, and a name the call
    # forgets fails the run at startup instead of building with an empty define.
    secrets:
      SUPABASE_URL:
        required: true
      SUPABASE_ANON_KEY:
        required: true
      API_BASE_URL:
        required: true
      GLITCHTIP_DSN:
        required: true
      GLITCHTIP_TOKEN:
        required: true
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

permissions:
  contents: read

jobs:
  prepare:
    name: Derive the app set from the pub workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      apps: ${{ steps.workspace.outputs.apps }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # why: DERIVED, NOT LISTED. A hand-written app list here is a second copy of the
      # workspace, and the copy is the one that rots.
      - name: The matrix comes from the workspace, never from this file
        id: workspace
        run: |
          set -euo pipefail
          apps="$(node tooling/ci/assert-release-lane-generic.mjs --emit-apps)"
          echo "apps=${apps}" >> "$GITHUB_OUTPUT"
          echo "Deploying web: ${apps}" >> "$GITHUB_STEP_SUMMARY"

  deploy-web:
    name: Build & deploy web to Cloudflare Pages
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    needs: prepare
    permissions:
      contents: read
      deployments: write
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.prepare.outputs.apps) }}
    concurrency:
      group: deploy-web-${{ matrix.app }}
      # why: FALSE ON MAIN ONLY (REVIEW-guards #5). On main a second push used to
      # cancel an in-flight deploy, possibly mid `wrangler pages deploy`, and the
      # record step does not run on a cancel — docs/ci/deploy-web.md: runs 145/146
      # were concurrency-cancelled and that unrecorded build stayed live. Held by
      # assert-workflow-hardening limb 7.
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # why: the plan below reads ancestry and a diff against the live SHA, which a
          # depth-1 clone does not hold; plan-deploy.mjs exits 1 on a shallow clone.
          fetch-depth: 0

      # why: a superseded SHA never publishes (row O-DEPLOY-IS-NOT-ONE-GATED-LANE, limb 3).
      # The plan reads this app's latest successful Deployment from the ledger, and every
      # later step runs only on deploy == 'true'. An unreadable ledger exits 1: nothing
      # publishes, and the next main push plans again from the last success.
      - name: Plan from the Deployment ledger
        id: plan
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tooling/ci/plan-deploy.mjs ${{ matrix.app }}-web

      - uses: ./.github/actions/setup-flutter
        if: steps.plan.outputs.deploy == 'true'

      - run: flutter pub get --enforce-lockfile
        if: steps.plan.outputs.deploy == 'true'

      - name: Derive the release line from pubspec
        if: steps.plan.outputs.deploy == 'true'
        id: ver
        working-directory: .
        run: node tooling/ci/assert-app-versioning.mjs --emit apps/${{ matrix.app }} >> "$GITHUB_OUTPUT"

      # why: TURNSTILE_SITE_KEY IS A REPOSITORY VARIABLE, NOT A SECRET, AND IT IS
      # HERE BEFORE IT IS NEEDED ON PURPOSE. The site key is public by design —
      # it ships inside the bundle and is meaningless without the secret half,
      # which lives only on the auth box. While `vars.TURNSTILE_SITE_KEY` is
      # unset the define arrives EMPTY, TurnstileGate renders SizedBox.shrink()
      # and the deployed app behaves byte-for-byte as it does today
      # (apps/subscriptiontracker/lib/features/auth/turnstile_gate.dart). Setting the variable
      # is then the whole of the app-side cutover work FOR THIS CHANNEL: no
      # workflow edit inside the Phase 5 window, which is the window that has to
      # carry three acts already. Safe to ship ahead of the cutover because
      # hosted GoTrue IGNORES a captcha token it never asked for — measured, not
      # assumed, by tooling/e2e/captcha_posture.mjs on every E2E run.
      #
      # 🔴 "THIS CHANNEL" IS THE WHOLE QUALIFIER, AND IT IS LOAD-BEARING.
      # Corrected 2026-09-07: the sentence above was written without it and read
      # as a portfolio-wide fact. Measured on this branch —
      #   grep -rn "dart-define=SUPABASE_ANON_KEY" .github/workflows/*.yml
      #     | grep -v "e2e.yml\|deploy-web.yml" | wc -l   ->  12
      # Those twelve are build-platforms.yml:141,153,207,290,302;
      # submit-appstore.yml:56,64; submit-play.yml:84,176; submit-snap.yml:75,196;
      # submit-windows-store.yml:55 — every one a shipping store or desktop
      # artifact carrying the identity defines and NOT this one. TurnstileGate is
      # not platform-gated (no kIsWeb, no conditional import) and Box A enforces
      # Turnstile for every client, not only browsers, so an artifact from any of
      # those lanes built after the cutover cannot authenticate anybody on the
      # four gated screens. It is survivable today only because
      # runbooks/auth-cutover.md:556 records `web` as the ONLY channel with
      # served: true — "and it stops being true at first store release".
      # The durable fix is NOT twelve more define lines: it is declaring the key
      # in apps/subscriptiontracker/lib/core/app_config.dart with an isTurnstileConfigured
      # getter beside isRevenueCatConfigured, so the set
      # assert-store-build-config.mjs:127-158 DERIVES grows a named place and the
      # guard names all twelve lanes itself. That file is the app-shell unit's
      # (scope 1.2) and submit-*.yml is unit 1's, so the edit is not owed here —
      # the residue is, and it is carried in phase3-cutover-blockers.md 8.6 (residue
      # R10). Corrected 2026-09-07: this line said 8.2, which is the empty-sitekey
      # section, not the twelve-lane residue.
      #
      # ⏱ APPENDED 2026-09-16, EVERYTHING ABOVE LEFT AS WRITTEN: it predates
      # [ADR 084] (owner, 2026-09-15, "Store builds skip it"). The twelve store and
      # desktop lanes omit TURNSTILE_SITE_KEY BY DESIGN, not by defect: the key is
      # declared in app_config.dart (AppConfig.isTurnstileConfigured), a non-web
      # build takes CaptchaPosture.notOnThisChannel, and no store lane is owed a
      # define. assert-store-build-config.mjs grades it both ways — W1: every web
      # build passes the key; W2: a store build that passes it is refused.
      # 🔴 THE BASE HREF, RESOLVED FROM THE CATALOGUE AND NOT WRITTEN HERE.
      # [ADR 075] publishes every app at a PATH on the apex, so this build must be
      # compiled for `/<id>/` rather than for `/`. This job is a MATRIX over the
      # workspace app set, so the value cannot be a literal; it comes from the same
      # guard, and the same catalogue row, that the deploy target below comes from,
      # so the address and the base href are one parse and cannot disagree.
      #
      # ⚠️ A WRONG BASE HREF IS SILENT. It does not fail the build and it does not
      # 500: index.html answers 200 and every asset 404s, so the visitor gets a
      # WHITE PAGE. The emitter fails loudly on every "I could not tell" case for
      # exactly that reason.
      - name: Resolve this app's base href from the catalogue
        if: steps.plan.outputs.deploy == 'true'
        id: base
        working-directory: .
        run: node tooling/ci/assert-catalog-reachable.mjs --emit-base-href ${{ matrix.app }} >> "$GITHUB_OUTPUT"

      - name: Build web (release, no service worker)
        if: steps.plan.outputs.deploy == 'true'
        run: >
          flutter build web --release --pwa-strategy=none --source-maps --no-web-resources-cdn
          --base-href ${{ steps.base.outputs.base_href }}
          --build-name=${{ steps.ver.outputs.release_line }}.${{ github.run_number }}
          --build-number=${{ github.run_number }}
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }}
          --dart-define=APP_VERSION=${{ steps.ver.outputs.release_line }}.${{ github.run_number }}+${GITHUB_SHA::7}
          --dart-define=GLITCHTIP_DSN=${{ secrets.GLITCHTIP_DSN }}
          --dart-define=TURNSTILE_SITE_KEY=${{ vars.TURNSTILE_SITE_KEY }}
          --dart-define=APP_ENV=production
          --dart-define=RELEASE_CHANNEL=web

      - uses: ./.github/actions/setup-node
        if: steps.plan.outputs.deploy == 'true'

      # why: fallback fonts come from the app origin, never fonts.gstatic.com; sha256-pinned (docs/ci/deploy-web.md).
      - name: Self-host the engine's fallback fonts, pinned by sha256
        if: steps.plan.outputs.deploy == 'true'
        working-directory: .
        run: node tooling/web/self-host-fallback-fonts.mjs apps/${{ matrix.app }}/build/web

      - name: Install glitchtip-cli (pinned by version AND by digest)
        if: steps.plan.outputs.deploy == 'true'
        working-directory: .
        run: |
          set -euo pipefail
          ver="$(node -p "require('./tooling/versions.json').glitchtip_cli")"
          sum="$(node -p "require('./tooling/versions.json').glitchtip_cli_sha256")"
          # The release asset is a GitLab JOB ARTIFACT, which is a re-runnable
          # address rather than an immutable object — so the version alone is a
          # label, and the digest is what makes it an address. Same reasoning as
          # F-11's 40-character action SHAs. Both halves live in versions.json.
          url="https://gitlab.com/glitchtip/glitchtip-cli/-/jobs/artifacts/v${ver}/raw/artifacts/glitchtip-cli-linux-x86_64?job=build-linux-x86_64"
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            --output "${RUNNER_TEMP}/glitchtip-cli" "$url"
          printf '%s  %s\n' "$sum" "${RUNNER_TEMP}/glitchtip-cli" | sha256sum --check --strict -
          chmod +x "${RUNNER_TEMP}/glitchtip-cli"
          got="$("${RUNNER_TEMP}/glitchtip-cli" --version)"
          if [ "$got" != "glitchtip-cli ${ver}" ]; then
            echo "::error title=glitchtip-cli::the pinned binary reports \"${got}\", not \"glitchtip-cli ${ver}\""
            exit 1
          fi
          echo "$got"

      - name: Inject debug ids into the web bundle
        if: steps.plan.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/glitchtip-cli" sourcemaps inject build/web

      # why: the bundle is BOOTED before it is published, not after. A Pages SPA answers
      # 200 for every missing path, so no post-deploy status code can tell a served
      # build from a served fallback (TRAPS ci-02).
      # why: it boots under its own _headers CSP, and each --connect origin (the build's URL-valued defines) is
      # fetched from the page and answered by the smoke, never sent; hand-passed until row O-WEB-CSP-HAND-LIST-UNSMOKED derives them.
      - name: Launch the built bundle once, before it is published
        if: steps.plan.outputs.deploy == 'true'
        working-directory: .
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          GLITCHTIP_DSN: ${{ secrets.GLITCHTIP_DSN }}
        run: >
          node tooling/smoke/smoke-web-artifact.mjs apps/${{ matrix.app }}/build/web
          --connect "$SUPABASE_URL" --connect "$API_BASE_URL" --connect "$GLITCHTIP_DSN"

      # why: the release is created by a node script, not `glitchtip-cli releases new`: the
      # CLI has no retry, and one 522 from the origin failed run 35831511489. The script
      # sends the CLI's own body through the shared bounded retry (docs/ci/deploy-web.md).
      - name: Create and finalize the GlitchTip release
        if: steps.plan.outputs.deploy == 'true'
        working-directory: .
        env:
          GLITCHTIP_DSN: ${{ secrets.GLITCHTIP_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.GLITCHTIP_TOKEN }}
          APP: ${{ matrix.app }}
          RELEASE_LINE: ${{ steps.ver.outputs.release_line }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          server="$(printf '%s' "$GLITCHTIP_DSN" | sed -E 's#^(https?)://[^@/]+@([^/]+)/.*$#\1://\2#')"
          if ! printf '%s' "$server" | grep -Eq '^https?://[A-Za-z0-9.-]+(:[0-9]+)?$'; then
            echo "::error title=source maps::GLITCHTIP_DSN did not parse into a server origin. Expected https://<key>@<host>/<project id>."
            exit 1
          fi
          # THE RELEASE STRING IS THE SDK'S, RECOMPOSED — and then CHECKED, so
          # this cannot silently drift from the build step above. `main.dart`
          # reports `AppConfig.telemetryRelease` = `<app id>@<APP_VERSION>`, and
          # APP_VERSION is the `--dart-define` two steps up. version.json is
          # Flutter's own record of what it stamped, so comparing against it
          # catches an edit to either line.
          version="${RELEASE_LINE}.${RUN_NUMBER}"
          built="$(node -e "console.log(require('./apps/' + process.env.APP + '/build/web/version.json').version)")"
          if [ "$built" != "$version" ]; then
            echo "::error title=source maps::the built bundle stamps version \"${built}\" but this step composed \"${version}\". The release id the SDK reports and the one the maps are stored under would not match, so no stack trace could be resolved."
            exit 1
          fi
          release="${APP}@${version}+${GITHUB_SHA::7}"
          echo "release=${release}" >> "$GITHUB_ENV"
          echo "sentry_url=${server}" >> "$GITHUB_ENV"
          gt_org="$(node -p "require('./tooling/ops/glitchtip-project.json').org")"
          gt_project="$(node -p "require('./tooling/ops/glitchtip-project.json').project")"
          SENTRY_URL="$server" node tooling/ops/create-glitchtip-release.mjs \
            --release "$release" --org "$gt_org" --project "$gt_project"

      - name: Upload the source maps to GlitchTip
        if: steps.plan.outputs.deploy == 'true'
        working-directory: .
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.GLITCHTIP_TOKEN }}
          APP: ${{ matrix.app }}
        run: |
          set -euo pipefail
          # `release` and `sentry_url` reach here through $GITHUB_ENV, written by
          # the step above. `set -u` is what makes a missing one loud.
          export SENTRY_URL="$sentry_url"
          gt_org="$(node -p "require('./tooling/ops/glitchtip-project.json').org")"
          gt_project="$(node -p "require('./tooling/ops/glitchtip-project.json').project")"
          node tooling/ops/upload-web-sourcemaps.mjs \
            --dir "apps/${APP}/build/web" \
            --release "$release" \
            --org "$gt_org" \
            --project "$gt_project" \
            --dist web \
            --url-prefix '~'

      # why: the maps are uploaded to GlitchTip and then DELETED from the bundle, and the
      # step refuses if any survive. A published .map is the whole source tree served
      # from the CDN, and the SPA fallback makes a missing one indistinguishable from a
      # present one by status code.
      - name: Delete the source maps from the bundle that gets published
        if: steps.plan.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          find build/web -type f -name '*.map' -print -delete
          left="$(find build/web -type f -name '*.map' | wc -l)"
          if [ "$left" -ne 0 ]; then
            echo "::error title=source maps::${left} .map file(s) survived the delete and would be published. Refusing to deploy."
            exit 1
          fi
          echo "0 .map files remain in build/web"

      - name: Ensure the Pages project exists (Direct Upload, idempotent)
        if: steps.plan.outputs.deploy == 'true'
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APP: ${{ matrix.app }}
        # why: wrangler is the locked tooling/wrangler island's binary, installed from its
        # committed lockfile; a run-time registry fetch held the account token over a loose
        # tree. assert-version-consistency holds the island's pin to tooling/versions.json.
        run: |
          set -uo pipefail
          npm ci --ignore-scripts --prefix tooling/wrangler || { echo "::error title=Pages project::the tooling/wrangler island did not install from its lockfile."; exit 1; }
          out="$(tooling/wrangler/node_modules/.bin/wrangler pages project create "$APP" --production-branch=main 2>&1)" && code=0 || code=$?
          printf '%s\n' "$out"
          if [ "$code" -eq 0 ]; then echo "Created Direct Upload Pages project \"$APP\"."; exit 0; fi
          if printf '%s' "$out" | grep -qiE 'already exists|\b8000002\b'; then echo "Pages project \"$APP\" already exists — nothing to create."; exit 0; fi
          echo "::error title=Pages project::could not ensure the Direct Upload Pages project \"$APP\" exists (wrangler exit ${code})."
          exit 1

      - name: Resolve this app's published origin from the catalogue
        if: steps.plan.outputs.deploy == 'true'
        id: target
        working-directory: .
        run: node tooling/ci/assert-catalog-reachable.mjs --emit-url ${{ matrix.app }} >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Pages
        if: steps.plan.outputs.deploy == 'true'
        id: deploy
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: '4.135.0'
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/${{ matrix.app }}
          command: pages deploy build/web --project-name=${{ matrix.app }} --branch=main

      # why: the probe asserts a FIELD from version.json, never a status code -- see the
      # source-map step above for why 200 proves nothing on this host.
      - name: Smoke — the live site serves THIS build
        if: steps.plan.outputs.deploy == 'true'
        working-directory: .
        run: >
          node tooling/ops/post-deploy-smoke.mjs
          --url ${{ steps.target.outputs.site_url }}/version.json
          --field build_number
          --expect ${{ github.run_number }}

      - name: Record the deployed SHA
        if: always() && steps.deploy.outcome == 'success'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tooling/ci/record-deployment.mjs ${{ matrix.app }}-web ${{ steps.target.outputs.site_url }}
