name: Deploy Web

# Builds EVERY app in the pub workspace for web with the real Flutter SDK on
# GitHub's runners, then uploads each built site to its own Cloudflare Pages
# project (Direct Upload) via wrangler.
#
# ── [10]D-2b · THE WEB DELIVERY PATH TAKES ANY APP ID FROM THE SPEC ──────────
# 🔴 UNTIL 2026-08-07 THIS FILE NAMED ONE APP SIX TIMES ON THE EXECUTABLE PATH:
# the `paths:` filter, `defaults.run.working-directory`, `--emit apps/subly`,
# the launch smoke's bundle path, wrangler's `workingDirectory` and
# `--project-name=`, the post-deploy smoke's URL and the deployment record's
# environment. Shipping app #2's web build therefore meant COPYING THIS FILE and
# editing eight lines — the per-app workflow authoring D-2b exists to abolish,
# on the one lane that reaches users.
#
# Every one of those is now a matrix leg over
# `assert-release-lane-generic.mjs --emit-apps` — the same emitter
# `build-platforms.yml` and `e2e.yml` already iterate, and the same emitter that
# GRADES this lane. One function, one file: this lane cannot drift from the
# workspace without the guard's own reading drifting with it. A second pubspec
# reader inlined here would be the copy that quietly stops reading what it
# thinks it reads, which is this repository's most repeated failure.
#
# ⚠️ `${{ matrix.app }}` IS ONLY SAFE BECAUSE `strategy.matrix.app` IS DECLARED
# BELOW. GitHub expands an UNDECLARED matrix context to the EMPTY STRING rather
# than erroring, so a bare `apps/${{ matrix.app }}` with no matrix builds
# `apps/` on every run while reading as fully generic. That exact stand-in is
# what limb A′ of assert-release-lane-generic.mjs checks, and deleting the
# `matrix:` block below is its recorded failing case.

on:
  push:
    branches: [main]
    # 🔴 A PATH FILTER IS A CLAIM ABOUT WHAT CHANGES THE ARTIFACT, and this list
    # named only the SOURCE (2026-08-01 full-corpus review, #30). The build step
    # is `flutter pub get --enforce-lockfile` inside a Melos 8 workspace: the
    # root pubspec.yaml (the `workspace:` list) and the single root pubspec.lock
    # are what decide every dependency version that ends up in build/web. So a
    # dependency bump — including a security patch landing in the lockfile with
    # no source change at all — produced a main commit that built differently
    # and deployed nothing, silently, with CI green. tooling/versions.json is on
    # the list for the same reason one level up: it is the single declaration
    # the Flutter and wrangler pins below are held to.
    #
    # `apps/**` rather than `apps/<id>/**` is [10]D-2b: the filter is the FIRST
    # place a lane names one app, and a filter naming app #1 means app #2 ships
    # only when somebody remembers to edit this line. A path filter is evaluated
    # before any job exists, so it is the one field on the deploy path that
    # cannot be a matrix expression — the generic form is the wildcard.
    #
    # The tooling/ci scripts are here because the steps below EXECUTE them and
    # none of their behaviour is visible in the source tree this filters on:
    # assert-release-lane-generic.mjs --emit-apps produces the MATRIX, so it
    # decides which apps this lane ships at all;
    # assert-app-versioning.mjs --emit produces the release line that becomes
    # --build-name AND the APP_VERSION stamped on every analytics row;
    # assert-gate-passed.mjs decides whether the deploy happens at all;
    # assert-catalog-reachable.mjs --emit-url resolves the app's published
    # origin, which is both what the post-deploy smoke probes and what the
    # deployment record names;
    # record-deployment.mjs writes the marker that answers "what is live". They
    # are listed INDIVIDUALLY rather than as tooling/ci/** on purpose — guard
    # work is frequent and unrelated to this artifact, and a filter that
    # redeploys production on every guard edit is one that gets narrowed back in
    # a hurry.
    #
    # Enforced by tooling/ci/assert-deploy-triggers.mjs, which derives the script
    # list from this file's own steps — so adding a step adds its path or fails
    # the build. A list nobody checks drifts back the moment a new input appears.
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'tooling/versions.json'
      - 'tooling/ci/assert-gate-passed.mjs'
      - 'tooling/ci/assert-app-versioning.mjs'
      - 'tooling/ci/assert-release-lane-generic.mjs'
      - 'tooling/ci/assert-catalog-reachable.mjs'
      - 'tooling/ci/record-deployment.mjs'
      # [pipeline 9]R-13's launch smoke. Listed for the same reason as the ones
      # above — this lane EXECUTES it, and it is the one step that can stop a
      # publish. assert-deploy-triggers.mjs derives its requirement from
      # `tooling/ci/**` only, so this entry is deliberate rather than enforced:
      # a smoke that changed and never ran again would be a gate that quietly
      # stopped gating, which is this repository's most repeated failure.
      - 'tooling/smoke/smoke-web-artifact.mjs'
      # [pipeline 14]O-7's post-deploy smoke, listed for the same reason and
      # subject to the same non-enforcement: it is the step that decides whether
      # this lane goes green. (Until 2026-08-09 it also decided whether the
      # deployment record got written; it no longer does — the record follows
      # the DEPLOY step, see the block on it at the bottom of this file.)
      - 'tooling/ops/post-deploy-smoke.mjs'
      - '.github/workflows/deploy-web.yml'

  # ── ROLLBACK · MANUAL, NAMED BY A HUMAN, NEVER AUTOMATIC — E18 ──────────────
  # 🔴 THE DEFECT: THIS LANE HAD NO WAY BACK, AND NOT EVEN A LINE SAYING SO.
  # Measured 2026-08-21 against the file AS IT STOOD BEFORE THIS BLOCK:
  # `git show HEAD:.github/workflows/deploy-web.yml | grep -c rollback` = 0 — no
  # mechanism and no acknowledgement. Written that way on purpose: the same
  # command over the WORKING file now counts this paragraph, so a bare
  # `grep -c rollback deploy-web.yml` would be a number that stopped
  # reproducing the moment it was written down. Measured the same day, this is also
  # the most-exercised armed lane in the repository: 221 runs, last green
  # 2026-08-21T14:44:40Z (run 32493786624, e2ba7df9, event `push`), and exactly
  # ONE `workflow_dispatch` run in its whole history.
  #
  # LATENT, NOT LIVE — said plainly so nobody reads this as an incident. Nothing
  # is broken today.
  #
  # ⚠️ AND THE MOTIVATING EVIDENCE IS AN ABSENCE, NOT AN INCIDENT — corrected
  # 2026-08-21, because the first draft of this block claimed "both rows in
  # tooling/ops/manual-deploys.json are hand-driven restores that happened
  # outside this lane", and that is false about the file it cites. Read it:
  # row 2 (1.0.144+40c0787) says verbatim "IN-lane deploy whose RUN reads
  # failure", and that file's own `_readme` says the in-lane case "no longer
  # needs an entry". Worse for the argument, NEITHER row is a rollback to an
  # earlier commit — row 1 is a "manual restore of merged main", i.e. the
  # empty-input redeploy button that already existed. So this lane is not being
  # justified by two incidents; it is being justified by the fact that in 221
  # runs there has never been a way back, and the two attested rows are only
  # evidence that going outside the lane costs a hand-written attestation.
  #
  # HOW TO ROLL BACK — the whole procedure:
  #     gh workflow run deploy-web.yml -f rollback_to=<full 40-hex sha>
  # That commit is checked out, re-gated against ITS OWN ci-gate verdict, built,
  # launch-smoked, uploaded, post-deploy-smoked and recorded under its own SHA.
  # Leaving `rollback_to` empty is the redeploy button that already existed and
  # behaves exactly as it did before this input was added.
  #
  # ⚠️ THE TARGET IS TYPED, NEVER DERIVED FROM THE LEDGER — the design, not a
  # shortcut. I read the ledger this session: `gh api
  # deployments?environment=subly-web --paginate` returns 145 rows, and 0 of the
  # last 60 SUCCESSFUL deploy-web runs are absent from it, so the ledger is in
  # good shape. Its one confirmed hole is exactly the shape that would break an
  # automatic reader: 4174c2ab has NO row because run 32054168805
  # (2026-08-17T18:17:07Z) deployed green, smoked green, and then failed on
  # `Record the deployed SHA` — the 503 that record-deployment.mjs's retry loop
  # (`RETRY_ATTEMPTS` / `isRetryable` / `api()`, NAMED RATHER THAN NUMBERED, and
  # the reason is now twice over: the first draft of this sentence cited a LINE
  # RANGE that this same change had already moved, and the correction that
  # replaced it quoted a SHIFT FIGURE that was stale again by the next edit.
  # No number is written here for that reason. The three names are greppable and
  # no insert above them can stale a name, which is the whole point) was written
  # for.
  # That build shipped and served. A "newest ledger row
  # is the last good one" reader would silently skip it and roll back further
  # than the operator meant, on the one day it matters. So the lane refuses to
  # guess and the human names the SHA.
  #
  # ⚠️ WHAT THIS DOES NOT DO — each one a real gap, not a caveat:
  #  · IT NEVER FIRES ON ITS OWN. There is no `failure()` branch in this file and
  #    there must not be: a lane that redeploys the previous build when the new
  #    one fails turns a red deploy into a green-looking one, which is the exact
  #    class this repository keeps deleting.
  #  · It does not revert `main`. The bad commit is still the head of the branch
  #    and the NEXT push to a filtered path redeploys it. Reverting is a separate,
  #    human act; this lane only changes what is served.
  #  · It does not roll back anything else. The Workers (deploy-workers.yml), the
  #    Cloudflare-Git static sites and every store channel are untouched.
  #  · It cannot restore a version NUMBER. `--build-name` below is the OLD
  #    pubspec's release line with THIS run's `run_number`, so the rolled-back
  #    build carries a HIGHER version than the one it replaces — required, since
  #    version_gate.dart compares `major.minor.patch` and Pages needs a new
  #    deployment. A rollback is therefore not invisible to the kill-switch floor.
  #  · 🔴 IT IS NOT PROTECTED FROM THE `concurrency:` BLOCK BELOW. A push to main
  #    landing mid-rollback cancels this leg (`cancel-in-progress: true`, per
  #    `matrix.app`) and deploys the head commit — i.e. the thing being rolled
  #    back. Freeze merges before dispatching; nothing here enforces that.
  #  · 🔴 THE ANALYTICS STAMP NAMES THE COMMIT ROLLED BACK *FROM*. APP_VERSION's
  #    `+sha7` is `${GITHUB_SHA::7}`, the DISPATCHED commit, and it has to be:
  #    check-prod-provenance.mjs joins that stamp against the run's `head_sha`,
  #    which `checkout: ref:` does not move, so stamping the restored commit
  #    turns the daily provenance monitor RED for the whole incident window.
  #    Measured through that guard's own exported resolver — the full working is
  #    on the build step below. The recovery is the run NUMBER, which is unique
  #    to the rollback run and whose log carries the ROLLBACK warning; and the
  #    DEPLOYMENT LEDGER, which does name the restored commit.
  #  · 🔴 THE MATRIX STILL COMES FROM THE HEAD OF MAIN. The `prepare` job below
  #    checks out with no `ref:` and derives the app set from the DISPATCHED
  #    commit, so a rollback to a commit whose workspace held a different set of
  #    apps would run legs for directories the checked-out tree does not contain
  #    (the leg fails on `working-directory`) or skip one it does. Latent at one
  #    app. Fixing it means moving the app set behind the resolver, which is a
  #    change to a job this one does not own the shape of.
  #  · 🔴 THE LEDGER WRITER IS THE ONLY SCRIPT THIS LANE TAKES FROM THE
  #    DISPATCHED COMMIT. EVERY OTHER ONE STILL RUNS THE RESTORED TREE'S COPY.
  #    The `.e18-recorder` checkout below exists because a ledger writer from an
  #    older tree fails SILENTLY and green. The identical shape — an older
  #    commit's copy of a pipeline script deciding a pipeline question — is
  #    still true of every other in-tree script this job runs, all of which keep
  #    `working-directory: .`. Measured 2026-08-22, there are five, named by
  #    step so no insert can stale the reference: "Require ci-gate to have
  #    passed for this commit", "Derive the release line from pubspec", "Launch
  #    the built bundle once, before it is published", "Resolve this app's
  #    published origin from the catalogue", "Smoke — the live site serves THIS
  #    build" — plus the wrangler pin that "Ensure the Pages project exists"
  #    reads out of tooling/versions.json at run time.
  #    NOT FIXED, AND THAT IS A CHOICE — stated per step rather than roundly,
  #    because "their failure direction is LOUD" is true of four of them and not
  #    of the fifth. For the ci-gate check and the two smokes, an older or
  #    missing script refuses, throws, or probes the wrong origin, so the run
  #    goes RED before or instead of writing anything; the catalogue resolver
  #    fails the same way, by handing the post-deploy smoke an origin that does
  #    not serve this build. That is the opposite of the recorder, whose failure
  #    was a silent skip on a GREEN run — which is why the recorder, and only
  #    the recorder, was worth a second checkout. The fifth, "Derive the release
  #    line from pubspec", is not even clearly WRONG from the restored tree: a
  #    rollback's release line SHOULD come from the commit being restored, and
  #    that commit's pubspec is read by that commit's own parser, so the two
  #    halves agree by construction. What is left is a real but quieter gap, and
  #    closing it means moving five gates on the live user lane with nothing in
  #    tooling/ci/test/ able to execute even one of their bodies.
  #    Measured 2026-08-22 against 4174c2ab — the deepest target the ledger
  #    paragraph above names — `git diff 4174c2ab HEAD -- <path>` is EMPTY for
  #    every one of those five scripts AND for tooling/versions.json: six files,
  #    six empty diffs. The file that is NOT byte-identical across that span is
  #    the ledger writer, which is neither an accident nor one of the six — it
  #    is the seventh, it is the one this lane keeps changing, and it is exactly
  #    the one that got a checkout of its own.
  #  · ⚠️ ALMOST NONE OF THIS HAS AN IN-SUITE NEGATIVE HALF, stated exactly
  #    rather than roundly, because the first draft of this bullet said "NO TEST
  #    REACHES ANY OF THIS" and that is too broad by one. (By TWO as of
  #    2026-08-22 — the fourth dash below is the second thing a test holds, and
  #    it was found by sweeping rather than by reading.) Re-measured 2026-08-21
  #    after the last edit of that pass, and re-confirmed 2026-08-22 after the
  #    last edit of this one:
  #    — `grep -rn -- "--sha" tooling/ci/test/` returns 8 hits, ALL of them in
  #      release-durable.test.mjs and all of them release-manifest.mjs's
  #      unrelated `--sha`. No test passes the flag to record-deployment.mjs.
  #      (Still 8 on 2026-08-22, still that one file, and all 8 are
  #      `release-manifest.mjs --write … --sha 93aee1d` or its `cli([...])` form.)
  #    — No test executes a `run:` body from this file, so the resolver's 40-hex
  #      refusal and both `if`s in the capability step ship proven by
  #      scratch mutation only — each set to `if false` ALONE and each re-run
  #      under `bash --noprofile --norc -eo pipefail`, the shell GitHub gives a
  #      `run:` step. The working is on the steps themselves.
  #    — WHAT *IS* COVERED is the record step's CALL TEXT.
  #      tooling/ci/test/deployment-record.test.mjs walks the real
  #      .github/workflows with workflow-scan.mjs's `RECORD_CALL` and requires
  #      every environment to be claimed by tooling/channel-register.json.
  #      DEMONSTRATED, not assumed: replacing `${{ matrix.app }}-web` with
  #      `bogus-env` in the working copy of this file turns that suite red —
  #      EXIT 1, `actual: [ { file: 'deploy-web.yml', environment: 'bogus-env' } ]`
  #      — and the file was restored bytes-identical afterwards. That is why the
  #      capability step spells the path as `rec="…"` and calls it as `"$rec"`.
  #    — AND SO IS THE RECORD STEP'S `if:`, which the first draft of this bullet
  #      did not say. `always() && steps.deploy.outcome == 'success'` is the one
  #      form assert-publish-records.mjs accepts; measured 2026-08-22, weakening
  #      it to a bare `always()` in a scratch mirror turns that guard from
  #      EXIT 0 to EXIT 1, and tooling/ci/test/publish-records.test.mjs runs it
  #      against the real repository and asserts it passes.
  #    A follow-up that OWNS tooling/ci/test/deployment-record.test.mjs must give
  #    the refusals an in-suite negative half; until then this bullet is the
  #    honest statement of their coverage, not a claim that they are tested.
  workflow_dispatch:
    inputs:
      rollback_to:
        description: 'ROLLBACK: the full 40-character lowercase SHA of a commit this lane already deployed. EMPTY = redeploy the head of main.'
        required: false
        default: ''
        type: string

# Least privilege. It deploys via a Cloudflare token, not GITHUB_TOKEN. [pipeline F-5b]
#
# 🔴 SCOPED DOWN 2026-08-07, AND THE REASON IS THE [10]D-2b REFACTOR ITSELF.
# This block used to carry `checks: read` and `deployments: write` too, which was
# correct while this lane was ONE job: workflow-level and job-level were the same
# grant. Splitting it into `prepare` + `deploy-web` silently widened both — a job
# that only emits an app list inherited the right to write GitHub Deployments.
# `zizmor` caught it as `excessive-permissions` (high confidence) on the first CI
# run after the merge, and it is a real finding, not noise: `prepare` runs a node
# script whose input is repository content, on a lane that holds
# CLOUDFLARE_API_TOKEN.
#
# 📌 The generalisable point: SPLITTING A JOB WIDENS EVERY WORKFLOW-LEVEL GRANT,
# and nothing about the diff looks like a permissions change. The grants now sit
# on the job that uses them — `checks: read` for assert-gate-passed, and
# `deployments: write` for record-deployment.mjs — so the next split cannot
# repeat this.
permissions:
  contents: read

jobs:
  # ── which apps does this factory hold? ──────────────────────────────────────
  # [10]D-2b, and identical to `prepare` in build-platforms.yml and e2e.yml on
  # purpose — deliberately reading through the SAME emitter, because
  # assert-release-lane-generic.mjs is the guard that grades all three lanes, so
  # the set they iterate and the set they are graded against cannot diverge.
  #
  # It emits nothing on an empty workspace — it exits 1 — because a matrix of
  # `[]` runs zero legs and REPORTS SUCCESS. On a lane that deploys, that shape
  # is worse than a red build: it is a green tick over a production deploy that
  # never happened, which is the exact absence assert-deploy-triggers.mjs was
  # written against one level up.
  prepare:
    name: Derive the app set from the pub workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      apps: ${{ steps.workspace.outputs.apps }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: The matrix comes from the workspace, never from this file
        id: workspace
        run: |
          set -euo pipefail
          apps="$(node tooling/ci/assert-release-lane-generic.mjs --emit-apps)"
          echo "apps=${apps}" >> "$GITHUB_OUTPUT"
          echo "Deploying web: ${apps}" >> "$GITHUB_STEP_SUMMARY"

  deploy-web:
    name: Build & deploy web to Cloudflare Pages
    runs-on: ubuntu-24.04
    # 35 because this job carries BOTH halves: assert-gate-passed.mjs polls for up
    # to its own 1200 s default before the build starts (a shorter bound would kill
    # the poll and hide why the gate never arrived), and the build+deploy behind it
    # has been observed at 9m03s. 20 + 9 with a little air. [pipeline F-5b]
    timeout-minutes: 35
    needs: prepare
    # The two grants the workflow level no longer makes, held by the only job
    # that uses them: `checks: read` for assert-gate-passed.mjs (it reads
    # ci-gate's verdict) and `deployments: write` for record-deployment.mjs.
    # `contents: read` is restated because naming any permission here replaces
    # the workflow-level set outright rather than adding to it.
    permissions:
      contents: read
      checks: read
      deployments: write
    # `fail-fast: false` because each leg is an independent DELIVERY, not a
    # stage of one: app #2 failing to build is no reason to cancel a deploy of
    # app #1 that has already uploaded and is waiting to be smoked and recorded.
    # With one app in the workspace this changes nothing.
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.prepare.outputs.apps) }}
    # ⚠️ PER-APP, AND IT MOVED FROM THE WORKFLOW LEVEL TO GET THERE. A single
    # workflow-level `group: deploy-web` puts every matrix leg in ONE group with
    # `cancel-in-progress`, so app #2's leg would cancel app #1's mid-upload —
    # a half-published Pages project with a green-ish log. The group has to
    # carry the dimension the matrix iterates, and only a job-level
    # `concurrency:` can read `matrix`.
    concurrency:
      group: deploy-web-${{ matrix.app }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      # ── E18 · ONE ANSWER TO "WHICH COMMIT IS THIS RUN DEPLOYING?" ────────────
      # Every step IN THIS JOB that names a commit — the checkout `ref:`, the
      # ci-gate verdict this run demands, and the SHA written to the deployment
      # ledger — reads THIS output. Three separate `${{ … }}` copies of the same
      # expression is how a rollback ends up building one commit, gating a
      # second and recording a third, and nothing anywhere would go red.
      #
      # ⚠️ "IN THIS JOB" IS THE HONEST SCOPE, AND THE `prepare` JOB IS OUTSIDE IT.
      # `prepare` (above) checks out with no `ref:` and derives the app set from
      # the DISPATCHED commit, so the matrix — and therefore
      # `defaults.run.working-directory: apps/${{ matrix.app }}` — comes from the
      # head of main even on a rollback. See the third bullet of "WHAT THIS DOES
      # NOT DO" at the top of this file; it is latent at one app and it is a gap,
      # not a caveat.
      #
      # On `push` the input does not exist, the shell default takes over and the
      # value is `github.sha` — byte-identical behaviour to before this step. It
      # is the FIRST step because the checkout below consumes it.
      #
      # ⚠️ WHAT HAPPENS IF `id: ref` IS RENAMED, measured 2026-08-21 rather than
      # assumed, because GitHub resolves an unknown step reference to the EMPTY
      # STRING instead of erroring. COUNT RE-TAKEN AFTER THE LAST EDIT OF THIS
      # PASS, AND IT HAS NOW BEEN WRONG TWICE — one draft said "FOUR consumers,
      # not three", the correction that replaced it said "NINE lines", and both
      # were miscounts of the same grep sitting under this same instruction to
      # re-measure. Third time, taken 2026-08-22 after the last edit:
      # `grep -c 'steps\.ref\.outputs' .github/workflows/deploy-web.yml`
      # is the anchor and it prints TEN. Reading it needs care, and here is the
      # whole subtraction. TWO of the ten are PROSE — this paragraph, and the
      # one in the APP_VERSION block below that names the spelling E18 tried and
      # reverted. ONE more is an `echo` that merely NAMES
      # `steps.ref.outputs.recorder_dir` inside an error message. 10 - 2 - 1 = 7,
      # and those SEVEN are expression sites across FIVE steps: the target checkout (`ref:`), the
      # `.e18-recorder` checkout (`if:`), the capability check
      # (`working-directory:` and `RECORDER_DIR`), the ci-gate step, and the
      # record step (`working-directory:` and `--sha`).
      # THREE OF THE FIVE REFUSE AN EMPTY VALUE OUTRIGHT, each verified by
      # running the thing: `assert-gate-passed.mjs` with no argument exits 1 ("no
      # commit SHA given"); `record-deployment.mjs … --sha` with nothing after it
      # exits 1 ("--sha was given with no value"); and the capability check below
      # refuses an empty `RECORDER_DIR` explicitly, which is why that `-z` branch
      # exists at all. Of the remaining two, the `.e18-recorder` checkout simply
      # does not run (`'' == 'true'` is false) — harmless on its own, and the
      # capability check refuses immediately after because `recorder_dir` is
      # empty too; while the target checkout FAILS OPEN, because
      # `actions/checkout` treats an empty `ref:` as its own default and silently
      # checks out the triggering commit. So a rename makes the run RED before
      # the gate rather than shipping the wrong bytes, but nothing points at the
      # rename itself.
      #
      # 🔴 THE 40-HEX CHECK IS LOAD-BEARING, NOT HYGIENE. A branch name or a tag
      # would check out fine and then disagree with what gets recorded, because
      # record-deployment.mjs writes a `ref` that must be a commit; a short SHA
      # checks out fine and records a string no ledger query matches. `github.sha`
      # is always 40 hex, so on the push path this can only ever pass.
      # MEASURED 2026-08-21, `if false; then` in a scratch copy of this body run
      # under `bash --noprofile --norc -eo pipefail` (the shell GitHub actually
      # uses for a `run:` step, where `-e` is already on): `rollback_to=main`
      # goes EXIT 1 intact and EXIT 0 disabled, writing `sha=main` for
      # `actions/checkout` to resolve as a BRANCH. The refusal in
      # record-deployment.mjs catches it too — but only after the bundle has
      # shipped, which is the whole difference this step buys.
      #
      # ⚠️ THE `[ "$target" = "$HEAD_SHA" ]` BELOW IS A SELECTOR, NOT A TRIPWIRE,
      # and is written down as such so nobody counts it as a guard. Both arms are
      # exercised by real inputs (a push takes the first, a rollback the second).
      # Forced to the push arm on a rollback, the capability check refuses and
      # the run stops before the gate; forced to the rollback arm on a push, the
      # record is still correct and the only damage is a needless checkout and a
      # warning that reads "deploys X, NOT X". Neither direction can ship a wrong
      # record, which is the property that matters.
      - name: Resolve the commit this run deploys
        id: ref
        working-directory: .
        env:
          ROLLBACK_TO: ${{ github.event.inputs.rollback_to }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          target="${ROLLBACK_TO:-$HEAD_SHA}"
          if ! printf '%s' "$target" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error title=rollback_to::\"${target}\" is not a full 40-character lowercase commit SHA. A branch, a tag or a short SHA would build one thing and record another."
            exit 1
          fi
          echo "sha=${target}" >> "$GITHUB_OUTPUT"
          if [ "$target" = "$HEAD_SHA" ]; then
            # `rollback` and `recorder_dir` move together and are set in exactly
            # these two places, so the flag and the directory can never disagree.
            # `.` is the checked-out target's own tree — on this branch that IS
            # the dispatched commit, so nothing changes for a push.
            echo "rollback=false" >> "$GITHUB_OUTPUT"
            echo "recorder_dir=." >> "$GITHUB_OUTPUT"
            echo "Deploying the head of this ref: ${target}."
          else
            # The rollback branch: the workspace is about to become the TARGET's
            # tree, so the ledger writer has to come from somewhere else. See the
            # checkout and the capability check below.
            echo "rollback=true" >> "$GITHUB_OUTPUT"
            echo "recorder_dir=.e18-recorder" >> "$GITHUB_OUTPUT"
            echo "::warning title=ROLLBACK::this run deploys ${target}, NOT ${HEAD_SHA}. The branch is unchanged, so the next push to a filtered path redeploys ${HEAD_SHA}."
            echo "**ROLLBACK:** deploying \`${target}\` in place of \`${HEAD_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        # persist-credentials: false — actions/checkout otherwise writes GITHUB_TOKEN
        # into .git/config and LEAVES it there for the whole job. Any later step that
        # packages the workspace (or anything containing .git/) ships the token inside
        # the artifact, and on a PUBLIC repo artifacts are downloadable. Nothing here
        # does git push/tag/commit, so none of these checkouts need the credential.
        # [zizmor artipacked] Verified 2026-07-27: no current artifact path includes
        # .git/ — so this closes a FUTURE mistake, not a live leak.
        with:
          persist-credentials: false
          # E18: the rollback target, or `github.sha` on every push. Without this
          # a dispatched rollback would build the head of main and only the
          # deployment record would carry the old SHA — a ledger entry naming
          # bytes that were never uploaded, which is worse than no rollback.
          ref: ${{ steps.ref.outputs.sha }}

      # ── E18 · THE LEDGER WRITER COMES FROM THE DISPATCHED COMMIT, NEVER FROM
      #          THE ROLLBACK TARGET ───────────────────────────────────────────
      # 🔴 WITHOUT THIS STEP, `--sha` BELOW IS A SILENT NO-OP ON EVERY ROLLBACK
      # TARGET THAT EXISTS IN THIS REPOSITORY. The checkout above replaces the
      # whole workspace with the TARGET's tree, so `node
      # tooling/ci/record-deployment.mjs` runs the TARGET's copy of the recorder —
      # and every commit up to and including e2ba7df predates the flag.
      #
      # MEASURED 2026-08-21, not reasoned. `git show HEAD:tooling/ci/record-deployment.mjs`
      # (plus its one import) into the scratchpad, then, with GITHUB_SHA UNSET so
      # the only possible source of a SHA is the flag:
      #     GITHUB_REPOSITORY=o/r GH_TOKEN=t node tooling/ci/record-deployment.mjs \
      #       subly-web https://x --sha 4174c2ab7b4082b9dd44aef2ca7fcb2c53a68a15
      #     ✗ GITHUB_SHA is not set
      #     EXIT 1
      # The flag is not rejected, it is SKIPPED — the positional loop reads
      # `if (argv[i].startsWith('--')) { i++; continue; }`. With GITHUB_SHA set,
      # as it always is on a runner, that run goes GREEN and files the record
      # against the head of main: the ledger saying the bad commit is live while
      # the good one serves, arriving silently, in the one operation the flag was
      # written for. The identical invocation against the copy in THIS commit
      # prints `⬜ --sha 4174c2ab… OVERRIDES GITHUB_SHA (unset)` and then fails
      # only on the (absent) credential — EXIT 1, 401.
      #
      # So the recorder is a property of the PIPELINE, not of the commit being
      # restored. This puts the dispatched commit's tree beside the target's and
      # the record step runs from there. Only `working-directory:` changes; the
      # command TEXT is byte-identical, which is load-bearing —
      # assert-release-provenance.mjs matches `job.markerCall` with
      # `/node\s+tooling\/ci\/record-deployment\.mjs/`, and
      # workflow-scan.mjs's `RECORD_CALL` reads the environment name off that
      # same literal. A `node .e18-recorder/tooling/…` spelling would make this
      # job stop looking like a job that records at all.
      #
      # It also means the recorder reads THIS commit's tooling/channel-register.json,
      # so `subly-web` resolves against the register the ledger is graded by
      # rather than against whatever the restored tree happened to carry.
      #
      # ROLLBACK ONLY. On `push`, and on a dispatch with `rollback_to` empty, the
      # target IS the dispatched commit — the in-tree copy is already this one,
      # `recorder_dir` stays `.` and this step does not run. The push path keeps
      # exactly the shape it had.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.ref.outputs.rollback == 'true'
        with:
          persist-credentials: false
          # Under $GITHUB_WORKSPACE and dot-prefixed. Nothing that ships reads it:
          # the build runs in `apps/${{ matrix.app }}` and wrangler uploads
          # `apps/${{ matrix.app }}/build/web`, so this directory cannot reach
          # Cloudflare.
          path: .e18-recorder

      # 🔴 FAIL CLOSED BEFORE ANYTHING SHIPS, NOT AFTER. This is the tripwire for
      # the defect above: it asserts that the recorder which WILL run can honour
      # `--sha`, and it runs before the gate, so a run that could not record
      # truthfully never reaches the deploy step. Placing it after the deploy
      # would only convert a silent wrong record into a red run over shipped
      # bytes.
      #
      # ⚠️ CORRECTED 2026-08-21, IN THE SAME PASS THAT WROTE IT — and the first
      # spelling is left named here rather than quietly swapped, because the way
      # it failed is the reason the replacement looks the way it does. It was
      # `grep -qF "flagValue(argv, 'sha')" "$rec"`, and it claimed to grep "for
      # the LIVE EXPRESSION … not for a comment". THAT CLAIM WAS FALSE: the
      # header of record-deployment.mjs quotes the same expression in PROSE.
      # MEASURED — the working copy with the live statement replaced by
      # `shaOverride = null;` and the header untouched still matched `grep -qF`
      # (on the header line), so the step would have printed "ok" over a recorder
      # that cannot honour the flag. A source-TEXT check that reads comments is
      # biased in the HIDING direction, which is the one direction a tripwire may
      # not be.
      #
      # SO IT NOW RUNS THE RECORDER INSTEAD OF READING IT. The probe hands it an
      # invalid `--sha` and demands the refusal sentence back: no comment can
      # produce that sentence, and the only thing that can is the flag being read
      # and judged. THE PROBE CANNOT WRITE ANYTHING — three independent reasons,
      # all run 2026-08-21 against the real tree: the 40-hex refusal returns
      # ahead of the repository, SHA and token checks; the tokens are blanked in
      # the command itself (a `git show HEAD:` recorder, which ignores the flag,
      # stops at `GH_TOKEN / GITHUB_TOKEN is not set`); and even given a valid
      # SHA and a real token, the environment `__e18-capability-probe` is claimed
      # by no row in tooling/channel-register.json, so it exits 1 there —
      # measured, that is the sentence it prints. Every path ends before `fetch`.
      #
      # ⚠️ BOTH `if`s BELOW ARE TRIPWIRES, AND A THIRD ONE WAS DELETED FOR NOT
      # BEING ONE — swept 2026-08-22 by setting each one to `if false` on its own
      # and re-running this body under `bash --noprofile --norc -eo pipefail`
      # (the shell GitHub gives a `run:` step, where `-e` is ALREADY ON) against
      # three recorder trees: the working copy, `git show HEAD:` (predates the
      # flag), and the comment-only copy described above:
      #  · the PROBE-OUTPUT match → `if false`: both broken recorders are then
      #    certified by this very step and the run goes on to deploy and file the
      #    record against GITHUB_SHA. EXIT 1 → EXIT 0. This is the tripwire the
      #    step exists for.
      #  · `[ -z "$RECORDER_DIR" ]` → `if false`: ALSO A TRIPWIRE, on the input
      #    where an empty `working-directory:` leaves the step in the workspace
      #    root. On the PUSH shape that root holds a good recorder, so the probe
      #    is answered and a run with a renamed `id: ref` — whose `--sha` is
      #    therefore empty — sails past this step: EXIT 1 → EXIT 0. (On the
      #    ROLLBACK shape the root holds the TARGET's old recorder and the probe
      #    refuses anyway, so this branch is what makes the refusal happen in
      #    BOTH shapes and name the cause rather than in one.)
      #  · `[ ! -f "$rec" ]` WAS THE THIRD, AND IT IS GONE AS OF 2026-08-22. It
      #    printed a friendlier line when the recorder file was missing and it
      #    could not change the verdict on ANY input: with the file gone node
      #    exits on module resolution, that text is not the refusal sentence, and
      #    the step refuses either way — EXIT 1 intact, EXIT 1 as `if false`,
      #    measured both ways in the same sweep. Nothing in tooling/ci/test/ can
      #    execute this body, so no test could ever have caught it rotting
      #    either. A condition that cannot fail makes a step look guarded twice
      #    when it is guarded once, so it was deleted rather than kept with a
      #    paragraph explaining that it does not count. The `echo "probe exit
      #    ${probe_code}: ${probe}"` line below still prints node's own module
      #    error, so an incident reader loses a sentence and not a fact.
      # (If the whole directory is missing — the recorder checkout not having
      # run — GitHub fails the step on `working-directory` before this body is
      # entered at all, which is also a refusal and also measured.)
      - name: The recorder that will run must honour --sha
        working-directory: ${{ steps.ref.outputs.recorder_dir }}
        env:
          RECORDER_DIR: ${{ steps.ref.outputs.recorder_dir }}
        run: |
          set -uo pipefail
          # 🔴 THE QUOTES ARE LOAD-BEARING AND THIS IS NOT SHELL STYLE.
          # workflow-scan.mjs's RECORD_CALL is
          # /record-deployment\.mjs\s+((?:\$\{\{[^}]*\}\}|[A-Za-z0-9._-])+)/g and
          # it runs over the run body AFTER `#` lines are stripped, so a bare
          # `rec=tooling/ci/record-deployment.mjs` followed by the next statement
          # reads as a call site whose ENVIRONMENT is the next word. Caught by
          # tooling/ci/test/deployment-record.test.mjs going red on
          # `{ environment: 'if', file: 'deploy-web.yml' }` — a real find, not a
          # false alarm: an unclaimed environment is exactly what that test
          # exists to refuse. The closing quote is a non-whitespace character
          # after `.mjs`, so the pattern cannot start here — and the probe below
          # invokes the script only through "$rec", for the same reason.
          rec="tooling/ci/record-deployment.mjs"
          # `id: ref` renamed, or `recorder_dir` never written: GitHub resolves an
          # unknown step output to the EMPTY STRING rather than erroring, and an
          # empty `working-directory:` is not a thing this job can reason about.
          # Refuse here so a rename cannot quietly relocate which copy of the
          # recorder runs.
          if [ -z "$RECORDER_DIR" ]; then
            echo "::error title=E18::steps.ref.outputs.recorder_dir is empty — the resolver step did not write it (renamed \`id: ref\`?), so this job cannot say which copy of the recorder would run."
            exit 1
          fi
          # 🔴 `set +e` IS NOT SHELL STYLE, IT IS THE WHOLE STEP. GitHub runs a
          # `run:` body as `bash --noprofile --norc -eo pipefail {0}`, so `-e` is
          # ALREADY ON and the `set -uo pipefail` above does not clear it. This
          # probe is SUPPOSED to exit non-zero — it is asking a script to refuse —
          # and under `-e` the assignment would kill the shell before `probe`
          # could be read, turning a passing check into a red run with no
          # sentence in the log. Restored immediately after, so nothing that
          # follows runs unguarded. (Command substitution rather than a pipe on
          # purpose: `pipefail` is on, so `node … | grep -q` would carry node's
          # deliberate exit 1 even when grep matched.)
          set +e
          probe=$(GH_TOKEN= GITHUB_TOKEN= node "$rec" __e18-capability-probe --sha not-a-40-hex-sha 2>&1)
          probe_code=$?
          set -e
          echo "probe exit ${probe_code}: ${probe}"
          # `pipefail` is still on here, so a `grep -q` that exits on its first
          # match can SIGPIPE the writer and make the PIPELINE status 141. The
          # `!` would read 141 as "sentence not found" and this step would
          # REFUSE — fail-closed, the only direction a tripwire may fail. It is
          # also not reachable: `$probe` is one bounded sentence, orders of
          # magnitude under the pipe buffer. Measured 2026-08-22 on a good tree,
          # the pipeline exits 0 and the step prints `ok`.
          if ! printf '%s\n' "$probe" | grep -qF 'is not a full 40-character lowercase commit SHA'; then
            echo "::error title=E18::${RECORDER_DIR}/${rec} did not refuse an invalid --sha, so it does not read the flag at all — the record step below would SKIP it and file this deploy against \$GITHUB_SHA. Refusing before anything ships."
            exit 1
          fi
          echo "ok  the recorder at ${RECORDER_DIR}/${rec} refuses a bad --sha, so it reads the flag."

      # MUST be the first step that can let anything ship — nothing above it does
      # (E18's resolver reads an input, the two checkouts fetch source, and the
      # `--sha` capability check RUNS the recorder with a deliberately invalid
      # flag, which can only REFUSE — every path in it ends before `fetch`, for
      # the three independent reasons measured in the block above it). This
      # workflow triggers on push to main with no dependency on CI, so without
      # this the deploy and the tests race — and the deploy (~3 min) finishes
      # first (~6 min). Also gates the manual redeploy button, which previously
      # consulted nothing at all. Fails closed. [pipeline F-5b]
      #
      # E18: the SHA asked about is the one being BUILT, not the one dispatched.
      # A rollback must be held to the ci-gate verdict of the commit it restores;
      # asking about the head of main would let a rollback ride on a gate that
      # graded different bytes — and if the head is red, on a gate that failed.
      - name: Require ci-gate to have passed for this commit
        working-directory: .
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node tooling/ci/assert-gate-passed.mjs ${{ steps.ref.outputs.sha }}

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.44.9

      - run: flutter pub get --enforce-lockfile

      # The version is DERIVED, never typed. `apps/<id>/pubspec.yaml` declares
      # the release line (`major.minor`) — the part a human owns — and this step
      # reads it with the SAME parser the guard uses, so the number that gets
      # built and the number that gets asserted cannot disagree. Before this
      # existed the workflow carried its own copy of "1.0.0", free to drift from
      # pubspec.
      - name: Derive the release line from pubspec
        id: ver
        working-directory: .
        run: node tooling/ci/assert-app-versioning.mjs --emit apps/${{ matrix.app }} >> "$GITHUB_OUTPUT"

      # VERSIONING. `github.run_number` supplies BOTH the patch and the build
      # number, because it is the only monotonic value the lane has. Re-running a
      # run does not bump it, so the same commit rebuilds to the same version.
      #
      # ⚠️ IT IS PER-WORKFLOW-FILE AND SHARED ACROSS MATRIX LEGS. Every app
      # deployed by one run therefore carries the same build number. That is
      # correct for the two things it feeds — the kill-switch floor compares
      # `major.minor.patch` per app against that app's own `min_supported_
      # version`, and version.json is per Pages project — and it is why the
      # post-deploy smoke below can join on it. It also means renaming this FILE
      # restarts the counter at 1 for every app at once; see the note in
      # assert-app-versioning.mjs before ever doing that.
      #
      # Why the PATCH and not just the build number: version_gate.dart:32 splits
      # the running version on `+` and compares only `major.minor.patch` against
      # `min_supported_version`. While the patch was frozen at 0 there was no
      # floor the owner could set that separated an old client from a new one —
      # the CFG-1 force-update kill-switch was inert on the only live channel.
      # --build-number is the same value, and is what Play reads as versionCode;
      # it must strictly increase or a second upload is rejected outright.
      #
      # APP_VERSION is not decoration: it is the `app_version` field on every
      # analytics row and every consent artifact. Without it the build defaults
      # to 'dev', so production data would be indistinguishable from a developer
      # laptop and no regression could ever be attributed to a release. It keeps
      # the short SHA in the build metadata after `+` — a SHA is traceable but
      # NOT ORDERED, so it can identify a build and never rank two of them. Its
      # version core is the same string as --build-name on purpose: the number the
      # store shows and the number the kill-switch compares must be one number.
      #
      # 🔴 THAT SHA STAYS `${GITHUB_SHA::7}` — THE DISPATCHED COMMIT — AND ON A
      # ROLLBACK THAT IS NOT THE COMMIT WHOSE BYTES ARE IN THE BUNDLE. E18 tried
      # the other way (`steps.ref.outputs.…SHORT`, the restored commit) and it
      # was WRONG, measured 2026-08-21 rather than argued: this stamp is not a
      # free-text label, it is joined by tooling/ops/check-prod-provenance.mjs,
      # whose `makeReleasedBuildResolver` matches the `+sha7` against the RUN's
      # `head_sha` — and `head_sha` is the dispatched commit; `checkout: ref:`
      # does not move it. Run through that guard's own export
      # (`export { makeReleasedBuildResolver … }`) on a synthetic run 222 whose
      # `head_sha` is the DISPATCHED commit — e2ba7df stands in for it, that
      # being the head of main when this was measured; the resolver is a pure
      # function of its arguments, so substituting today's head reproduces the
      # same two lines with a different seven characters:
      #     restored-commit stamp  1.0.222+4174c2a -> "run 222 shipped e2ba7df, not 4174c2a"
      #     dispatched      stamp  1.0.222+e2ba7df -> null   (resolves)
      # That reject fires ahead of the deployment-witness rescue, so a correct
      # ledger row does NOT save it. check-prod-provenance.mjs runs from
      # ops-watch.yml on four crons, so the restored-commit spelling would have
      # put the daily provenance monitor RED for the whole incident window, with
      # the only clearing path a hand-written tooling/ops/manual-deploys.json
      # attestation — the exact human cost this lane exists to remove.
      #
      # SO THE TWO QUESTIONS ARE ANSWERED BY TWO DIFFERENT RECORDS, deliberately:
      # this stamp says WHICH RUN produced the bundle a row came from (and the
      # run number beside it is unique to the rollback run, whose log carries the
      # `::warning title=ROLLBACK` and the step summary line), while the
      # DEPLOYMENT LEDGER — `--sha` on the record step at the bottom of this job —
      # says WHICH COMMIT's bytes are on the origin. Named in "WHAT THIS DOES NOT
      # DO" at the top of the file, because it is a real gap: an analytics row
      # from a rolled-back client names the commit it was rolled back FROM, and
      # only the run number leads a reader to the truth.
      #
      # RELEASE_CHANNEL is [pipeline 9]R-10's third limb and it stays COMPILE-TIME
      # on purpose, unlike `update_url` which owner decision #19 moved to runtime.
      # The two look alike and are opposites: an update DESTINATION baked into a
      # binary means shipping an update to change where updates come from, while
      # the CHANNEL is a fact about the binary — the same commit built for `web`
      # and for `windows-store` differs in nothing else, so a runtime value could
      # not tell the two artifacts apart. Every value passed here must resolve to
      # a row id in tooling/channel-register.json; assert-channel-register.mjs
      # fails the build on `webb`, which is the one failure mode a free-text
      # string has. It is the CHANNEL, not the app, so it is a literal here and
      # correctly so: this whole file is the web channel.
      #
      # ⬜ `--pwa-strategy=none` is [ADR 023] (LOCKED 2026-07-31), not an
      # oversight: no service worker, no offline support, and the HTTP cache is
      # therefore the whole update mechanism on this channel — which is why
      # `apps/<id>/web/_headers` exists and why assert-web-cache-policy.mjs
      # asserts it. ADR 023 explicitly REJECTS guarding this flag in CI as
      # over-encoding; this citation is the consequence it did ask for.
      - name: Build web (release, no service worker)
        run: >
          flutter build web --release --pwa-strategy=none
          --build-name=${{ steps.ver.outputs.release_line }}.${{ github.run_number }}
          --build-number=${{ github.run_number }}
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }}
          --dart-define=APP_VERSION=${{ steps.ver.outputs.release_line }}.${{ github.run_number }}+${GITHUB_SHA::7}
          --dart-define=GLITCHTIP_DSN=${{ secrets.GLITCHTIP_DSN }}
          --dart-define=APP_ENV=production
          --dart-define=RELEASE_CHANNEL=web

      # ── [pipeline 9]R-13 · THE ARTIFACT IS STARTED ONCE, BEFORE PUBLICATION ──
      # Every other gate in this repository proves a build COMPLETES and stops
      # there. Until this step existed nothing in the tree had EVER run a built
      # artifact: build-platforms.yml uploads six builds without launching one,
      # ci.yml analyzes and unit-tests a stamped app without starting it, and
      # e2e.yml drives a DEBUG `web-server` target — not the released bundle. So
      # a build producing a non-starting artifact was green everywhere: a wrong
      # `base href`, an asset declared in pubspec and missing from build/web, an
      # exception thrown in main() before the first frame. Each fails at first
      # launch and NOWHERE EARLIER.
      #
      # ⚠️ IT SITS HERE, BETWEEN THE BUILD AND THE DEPLOY, AND THAT PLACEMENT IS
      # THE REQUIREMENT. R-13's subject is the artifact BEFORE publication, where
      # there is nothing to roll back because nothing has shipped; smoking after
      # the deploy is `[14]O-7`'s question, asked of users. Duplicate D-14 was
      # re-confirmed on that distinction, and assert-launch-smoke.mjs fails the
      # build if this step ever moves below the deploy.
      #
      # The signal is `flutter-first-frame`, dispatched by the engine once the
      # first frame has been RASTERIZED — so it is true only after main() ran to
      # completion and runApp produced a frame. Not a zero exit code (headless
      # Chrome exits 0 on a page that rendered nothing) and not a DOM node the
      # engine creates during bootstrap (those exist even when the app's first
      # build throws).
      #
      # No new action and no chromedriver: the script speaks the DevTools
      # Protocol over Node's built-in WebSocket and finds the Chrome the runner
      # image already ships — the same binary e2e.yml drives nightly. `setup-node`
      # is explicit because that WebSocket needs Node >= 22 and the smoke must
      # never fail for the harness's own reasons.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Launch the built bundle once, before it is published
        working-directory: .
        run: node tooling/smoke/smoke-web-artifact.mjs apps/${{ matrix.app }}/build/web

      # ── [10]D-2b limb (b) · THE PAGES PROJECT IS CREATED, NOT ASSUMED ────────
      # 🔴 THE PREVIOUS VERSION OF THIS FILE SAID "uploads the built site to the
      # EXISTING Cloudflare Pages project" — and that word was the whole gap.
      # `wrangler pages deploy --project-name=<id>` against a project that does
      # not exist fails at the API, so app #2's very first deploy died on a
      # console step nothing in this repository named. A delivery path that
      # "takes any app id" has to be able to run TWICE for a NEW id: once to
      # make the target, once to fill it.
      #
      # ⚠️ DIRECT UPLOAD, NEVER GIT-CONNECTED, and this is an architectural cap
      # rather than a preference: Cloudflare allows a limited number of
      # Git-connected Pages projects per repository, and this monorepo already
      # spends them on the static sites. A Git-connected project per app does
      # not reach app #6. `pages project create` with no `--github`/`--gitlab`
      # flag creates exactly a Direct Upload project, which is what the deploy
      # step below uploads into.
      #
      # IDEMPOTENT BY CONSTRUCTION. `create` on an existing project answers with
      # a "already exists" error, which on every run after the first is the
      # CORRECT state and must not fail the job. Any OTHER non-zero exit —
      # a bad token, a quota, an account id typo — still fails, so this is not a
      # `continue-on-error` in disguise: the tolerated case is enumerated and
      # everything else is red.
      #
      # ⚠️ THE APP ID GOES THROUGH `env:`, NOT INTO THE SCRIPT BODY. A
      # `${{ }}` interpolated straight into a `run:` block is the template
      # injection zizmor flags; the value is ours today, and the habit is what
      # survives the day it is not.
      #
      # The wrangler version is READ FROM tooling/versions.json rather than
      # written here. A second literal would be a second thing to drift, and
      # assert-version-consistency.mjs only polices `wranglerVersion:` inputs —
      # an `npx wrangler@<literal>` would sit outside its rules entirely, which
      # is how production ended up on 3.90.0 while the repo declared 4.114.0.
      - name: Ensure the Pages project exists (Direct Upload, idempotent)
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APP: ${{ matrix.app }}
        run: |
          set -uo pipefail
          ver="$(node -p "require('./tooling/versions.json').wrangler")"
          out="$(npx --yes "wrangler@${ver}" pages project create "$APP" --production-branch=main 2>&1)" && code=0 || code=$?
          printf '%s\n' "$out"
          if [ "$code" -eq 0 ]; then echo "Created Direct Upload Pages project \"$APP\"."; exit 0; fi
          if printf '%s' "$out" | grep -qiE 'already exists|8000007'; then echo "Pages project \"$APP\" already exists — nothing to create."; exit 0; fi
          echo "::error title=Pages project::could not ensure the Direct Upload Pages project \"$APP\" exists (wrangler exit ${code})."
          exit 1

      # ── the published origin, RESOLVED from the catalogue ────────────────────
      # `sites/_shared/_data/apps.json` is the stamp's own output ([3]S-7) and is
      # already the SSoT `tooling/monitor-register.json` derives every watched
      # hostname from (`_derivation.appCatalogue`). So it is where "where does
      # app <id> live" is answered, and the emitter is the guard that ASSERTS
      # those URLs answer — assert-catalog-reachable.mjs. Same discipline as the
      # matrix above: the reader that grades the fact and the reader that uses it
      # are one function in one file.
      #
      # It runs BEFORE the deploy on purpose. If the catalogue does not know this
      # app's origin, the run must stop while nothing has shipped — resolving it
      # afterwards would leave a published bundle that cannot be smoked and
      # cannot be recorded, which is precisely the un-probed publish [14]O-7
      # exists to end.
      - name: Resolve this app's published origin from the catalogue
        id: target
        working-directory: .
        run: node tooling/ci/assert-catalog-reachable.mjs --emit-url ${{ matrix.app }} >> "$GITHUB_OUTPUT"

      # `id:` IS LOAD-BEARING, NOT DECORATION. The record step at the bottom of
      # this job keys off `steps.deploy.outcome`, so the bytes reaching
      # Cloudflare is the fact that decides whether a provenance record gets
      # written. Renaming or removing this id silently turns that condition into
      # `steps..outcome == 'success'` — an expression GitHub evaluates to false
      # rather than erroring — so the record would stop being written and the run
      # would still be green. tooling/ci/assert-publish-records.mjs refuses a
      # record step whose `if:` names a step id that this job does not declare.
      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # PINNED 2026-07-28. Without this the action resolves wrangler from the
          # package.json in workingDirectory — and a Flutter app has none, so it
          # installed the version baked into the action's own bundle
          # (3.90.0, live-proven in run 30292045671) while both Workers locked 4.114.0.
          # Must equal tooling/versions.json "wrangler"; assert-version-consistency
          # fails the build if it drifts, or if this line disappears. [pipeline F-2, F-11]
          wranglerVersion: '4.120.0'
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/${{ matrix.app }}
          command: pages deploy build/web --project-name=${{ matrix.app }} --branch=main

      # ── [pipeline 14]O-7 · THE DEPLOY IS NOT TRUSTED UNTIL THE SITE AGREES ──
      # 🔴 BEFORE THIS STEP, THE LAST THING EVERY DEPLOY JOB DID WAS WRITE A
      # CLAIM. `record-deployment.mjs` below records "<app>-web is live at
      # <sha>" — and no workflow in this repository had ever performed a single
      # request against a surface it had just deployed. An upload that went to
      # the wrong project, shipped nothing, or was rolled back by the platform
      # produced a green tick AND a deployment record naming the new SHA.
      #
      # IT STILL RUNS BEFORE THE RECORD, BUT IT NO LONGER GATES IT — AMENDED
      # 2026-08-09. This note used to read "recording first and verifying second
      # would leave a marker asserting a state that was never true", and the
      # ordering is unchanged. What changed is the CONDITION on the record step
      # below: it now keys off the DEPLOY step's outcome, so a smoke that fails
      # after the bytes shipped no longer erases the ledger entry for them. Run
      # 144 (2026-08-08) is why — see the long block on that step. The two
      # questions are genuinely different: this one asks "does the live surface
      # answer with this build YET", the record answers "which bytes are on that
      # origin". A propagation race can make the first false while the second
      # stays true, and the marker that goes missing in that window is the one
      # an incident needs.
      #
      # ⚠️ THE JOIN KEY IS THE RUN NUMBER, NOT THE SHA. `version.json` carries
      # `build_number`; the SHA appears only inside `main.dart.js`. The build
      # step above passes `--build-number=${{ github.run_number }}`, so this
      # asserts against the field that is actually there rather than the one it
      # would be tidier to have.
      #
      # ⚠️ THIS IS NOT A SECOND COPY OF [9]R-13's LAUNCH SMOKE, and the two must
      # not be merged. R-13 serves `build/web` on loopback BEFORE the deploy and
      # requires `flutter-first-frame` — it answers "do these bytes RUN?". This
      # answers "did those bytes REACH PRODUCTION?", over the network, after the
      # upload. Each is green in the exact situation the other catches: a bundle
      # that starts perfectly and was uploaded to the wrong project, and a
      # correct upload of a bundle that throws in `main()`. They compose, and
      # the order — launch smoke, deploy, post-deploy smoke — is the composition.
      - name: Smoke — the live site serves THIS build
        working-directory: .
        run: >
          node tooling/ops/post-deploy-smoke.mjs
          --url ${{ steps.target.outputs.site_url }}/version.json
          --field build_number
          --expect ${{ github.run_number }}

      # "What is live right now?" must be answerable without inference.
      # CLAUDE.md: never assert done/live/working from memory. [pipeline F-5b]
      #
      # `<app>-web` is the channel register's `deploymentEnvironment` template
      # (`{app}-web`) expanded over this leg — the same expansion
      # assert-publish-records.mjs performs to decide which environments a served
      # channel's lane MUST record. The `-web` half is a literal because this
      # file IS the web channel; the `{app}` half never is.
      #
      # ── 🔴 THE RECORD FOLLOWS THE DEPLOY, NOT THE SMOKE (2026-08-09) ─────────
      # MEASURED FAILURE, run 144 (2026-08-08): `Deploy to Cloudflare Pages`
      # SUCCEEDED at 16:08:58Z, the post-deploy smoke above gave up 51 s later
      # while the CDN was still propagating, and this step — on the default
      # `success()` condition every step inherits — was therefore SKIPPED. The
      # bundle was live and served real users (a consent artifact and two events
      # carrying 1.0.144+40c0787 arrived 42 minutes later), and nothing in the
      # ledger said so. Runs 145/146 were concurrency-cancelled, so that
      # unrecorded build stayed live, and the daily provenance monitor correctly
      # reported real people's rows as unattributable. Repairing it took a
      # retroactive attestation (PR #266) — a hand-written entry standing in for
      # a machine record that a five-word condition would have produced.
      #
      # 📌 THE GENERALISABLE POINT: A PROVENANCE RECORD MUST BE CONDITIONED ON
      # THE ACT IT DESCRIBES, NEVER ON A LATER VERDICT ABOUT THAT ACT. This step
      # answers "which bytes are on that origin" — a question the wrangler upload
      # settles by itself. The smoke answers a different question ("do those
      # bytes ANSWER yet") and may be wrong about the first one, because a smoke
      # can fail for reasons that have nothing to do with what was uploaded:
      # propagation, a flaky DNS hop, an edge cache. Making the record wait on it
      # meant every such failure produced the one state this whole ledger exists
      # to abolish — something live that nothing can name.
      #
      # ⚠️ IT DOES NOT SOFTEN THE SMOKE. A failed step still fails the job; an
      # `if: always()` step running afterwards cannot rescue it. So the run is
      # still RED and still demands a human, and the difference is only that the
      # red run now leaves a traceable deploy behind instead of an orphan.
      #
      # ⚠️ IT IS A STRICT WIDENING, WHICH IS WHY IT IS SAFE. The default
      # condition is `success()` — every preceding step green, WHICH INCLUDES
      # `deploy`. So every run that recorded before still records, plus the runs
      # that deployed and then failed later. There is no input on which this
      # records LESS. `steps.deploy.outcome` (not `conclusion`) is the raw result
      # before any `continue-on-error` rewriting; the two are identical here
      # because that step carries none, and `outcome` is the form e2e.yml's purge
      # steps already use.
      #
      # ⚠️ `always()` INCLUDES CANCELLATION, and that is wanted here rather than
      # tolerated. The job-level `concurrency: cancel-in-progress` above means a
      # newer push can cancel this leg mid-run — and runs 145 and 146 were
      # cancelled exactly that way on 2026-08-08 while 144's bundle stayed live.
      # A leg cancelled AFTER its upload succeeded has still published something,
      # so it must still say what. `!cancelled()` would re-open the hole.
      #
      # ── E18 · `--sha` IS WHAT MAKES THE LEDGER SURVIVE A ROLLBACK ────────────
      # record-deployment.mjs defaults to `GITHUB_SHA`, and GITHUB_SHA is the
      # commit the run was DISPATCHED against — it does NOT follow the checkout's
      # `ref:`. So a rollback that shipped the old bundle would have filed a
      # record naming the head of main: the ledger would say the bad commit is
      # live while the good one is serving, and the daily provenance monitor
      # would agree with it. Passing the resolved SHA explicitly makes the record
      # name the bytes that were uploaded. On the push path the two values are
      # identical and the flag changes nothing — record-deployment.mjs prints the
      # override line only when they differ.
      #
      # 🔴 AND THE FLAG IS ONLY WORTH ANYTHING BECAUSE OF `working-directory`
      # BELOW. On a rollback the workspace root holds the TARGET's tree, whose
      # copy of this script predates `--sha` and would SKIP it — measured, see
      # the long block on the `.e18-recorder` checkout near the top of this job.
      # `recorder_dir` is `.` on every push and `.e18-recorder` on a rollback, so
      # the script that runs always understands the flag it is being given, and
      # the step before the gate refuses the run if it does not.
      - name: Record the deployed SHA
        if: always() && steps.deploy.outcome == 'success'
        working-directory: ${{ steps.ref.outputs.recorder_dir }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tooling/ci/record-deployment.mjs ${{ matrix.app }}-web ${{ steps.target.outputs.site_url }} --sha ${{ steps.ref.outputs.sha }}
