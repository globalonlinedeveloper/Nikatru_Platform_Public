name: "Store submit: Microsoft Store"

run-name: "Store submit: Microsoft Store (dry run) by @${{ github.actor }}"

# The measurements, retractions and traps behind this file are in
# docs/ci/submit-windows-store.md. Only `# why:` lines live here, and
# docs/ci/README.md carries the rules every workflow has to obey.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type SUBMIT-TO-MICROSOFT-STORE to run the submission job. Anything else runs the dry run only.'
        required: false
        default: ''
        type: string
      listing_url:
        description: 'The Microsoft Store listing URL this submission will be recorded against, e.g. https://apps.microsoft.com/detail/<product-id>. Required for a real submission; ignored by the dry run.'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  checks: read

jobs:
  gate:
    name: Require ci-gate to have passed
    runs-on: ubuntu-24.04
    # why: 25, not 10. assert-gate-passed.mjs polls for up to its own 1200 s default,
    # so any bound at or under 20 kills it mid-poll and replaces "timed out waiting
    # for ci-gate" with an opaque cancellation. Byte-identical in all five gate jobs.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require ci-gate to have passed for this commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node tooling/ci/assert-gate-passed.mjs ${{ github.sha }}

  dry-run:
    name: Validate the submission path
    runs-on: windows-2025
    timeout-minutes: 20
    needs: gate
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-flutter
      - name: Resolve the workspace
        run: flutter pub get --enforce-lockfile
      # why `shell: bash` and a SHA output: this runner's default shell is pwsh, where
      # `${GITHUB_SHA::7}` is not an expansion. The short SHA is computed once here and read
      # as a step output, the same shape as build-platforms.yml's prepare job.
      - name: Derive the release line from pubspec
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          node tooling/ci/assert-app-versioning.mjs --emit apps/subscriptiontracker >> "$GITHUB_OUTPUT"
          echo "GITHUB_SHA_SHORT=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      # why: O-SUBMIT-LANES-SKIP-PRECONDITION-GATES. A lane green over a name the owner has not HELD
      # or proven free submits one nobody ruled on; limb 3 of assert-publish-steps-guarded.mjs.
      - name: Name clearance holds for windows-store (owner HELD or PROVEN-FREE)
        run: node tooling/ci/assert-name-clearance.mjs --for-submission=windows-store
      # why: the backend defines. Without them AppConfig.isBackendLive stays
      # false, every field is at its PLACEHOLDER, and the packaged .msix is the
      # DEMO build -- mock sign-in, seeded data, no crash sink. Graded by
      # tooling/ci/assert-store-build-config.mjs.
      - name: Build windows
        working-directory: apps/subscriptiontracker
        run: >
          flutter build windows --release
          --obfuscate --split-debug-info=build/symbols/windows
          --build-name=${{ steps.ver.outputs.release_line }}.${{ github.run_number }}
          --build-number=${{ github.run_number }}
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }}
          --dart-define=APP_VERSION=${{ steps.ver.outputs.release_line }}.${{ github.run_number }}+${{ steps.ver.outputs.GITHUB_SHA_SHORT }}
          --dart-define=RELEASE_CHANNEL=windows-store
          --dart-define=GLITCHTIP_DSN=${{ secrets.GLITCHTIP_DSN }}
      # ⏱ MOVED AND CORRECTED 2026-09-07 (unit `symbols-everywhere`) — THIS STEP
      # USED TO BE THE LAST ONE IN THE JOB, behind `dart run msix:create` and the
      # store dry run, and its comment said the symbols were retained rather than
      # sent to the crash sink "because tooling/versions.json pins ONE
      # glitchtip-cli binary and it is linux-x86_64; this job runs on Windows".
      # Both halves are now wrong: the ordering is the one
      # post-audit-obfuscation-and-symbols.md §9.3 reproduced on a real runner
      # (dispatch 34093704881 — a build succeeded WITH the flags, a later step
      # failed, and the symbols artifact was `skipped`), and the Windows binary
      # of the same release is now pinned by digest as
      # `glitchtip_cli_windows_x86_64_sha256`.
      # why: the .msix below wraps an OBFUSCATED build, so its crash reports are
      # unreadable without this directory and a rebuild produces a DIFFERENT one.
      # 7 days matches the dry-run package beside it — this lane ships nothing,
      # and the sink upload below is now the copy that lasts.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: symbols-subscriptiontracker-windows-store-dry-run
          path: apps/subscriptiontracker/build/symbols/windows
          retention-days: 7
          if-no-files-found: error
      # why: pwsh, for the same reason the msstore-cli install below is — this is
      # a Windows runner and `$RUNNER_TEMP` is a backslash path, which MSYS
      # coreutils inside `shell: bash` handle badly. `Invoke-WebRequest` +
      # `Get-FileHash` is exactly the shape used there. Both halves of the pin are
      # read from tooling/versions.json at run time.
      - name: Install glitchtip-cli (pinned by version AND by digest)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = node -p "require('./tooling/versions.json').glitchtip_cli"
          $sum = node -p "require('./tooling/versions.json').glitchtip_cli_windows_x86_64_sha256"
          $url = "https://gitlab.com/glitchtip/glitchtip-cli/-/jobs/artifacts/v$ver/raw/artifacts/glitchtip-cli-windows-x86_64.exe?job=build-windows-x86_64"
          $out = Join-Path $env:RUNNER_TEMP 'glitchtip-cli.exe'
          Invoke-WebRequest -Uri $url -OutFile $out -MaximumRetryCount 3 -RetryIntervalSec 5
          $got = (Get-FileHash -Algorithm SHA256 -Path $out).Hash.ToLower()
          if ($got -ne $sum) {
            Write-Error "glitchtip-cli digest mismatch: the download hashes to $got and tooling/versions.json declares $sum. A version names a release; the sha256 names the BYTES, and the asset is a GitLab JOB ARTIFACT URL, which is re-runnable. This refusal is the mechanism, not a gap in it."
          }
          $reported = & $out --version
          if ($reported -ne "glitchtip-cli $ver") {
            Write-Error "the pinned binary reports '$reported', not 'glitchtip-cli $ver'"
          }
          Write-Host $reported
      # why: FAILS CLOSED on a missing GLITCHTIP_TOKEN, never skips. Placed AFTER
      # the retention step above and BEFORE the MSIX packaging and the store dry
      # run below, so a GlitchTip outage cannot take the mapping with it.
      - name: Upload the native debug symbols to GlitchTip
        shell: pwsh
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.GLITCHTIP_TOKEN }}
          GLITCHTIP_DSN: ${{ secrets.GLITCHTIP_DSN }}
        run: >
          node tooling/ops/upload-native-symbols.mjs
          --cli "${env:RUNNER_TEMP}/glitchtip-cli.exe"
          --dir apps/subscriptiontracker/build/symbols/windows
          --org nikatru --project subscriptiontracker
      - name: Package MSIX (Microsoft Store)
        working-directory: apps/subscriptiontracker
        run: dart run msix:create --version=${{ steps.ver.outputs.release_line }}.${{ github.run_number }}.0
      # why: straight after msix:create, before the dry run touches the package: it must carry the identity the register declares. bash, because pwsh is this runner's default.
      - name: The MSIX carries the identity the register declares
        shell: bash
        run: node tooling/ci/assert-artifact-signed-msix.mjs apps/subscriptiontracker/build/windows/msix/subscriptiontracker.msix
      - name: Dry-run the Microsoft Store submission
        env:
          MS_STORE_TENANT_ID: ${{ secrets.MS_STORE_TENANT_ID }}
          MS_STORE_CLIENT_ID: ${{ secrets.MS_STORE_CLIENT_ID }}
          MS_STORE_CLIENT_SECRET: ${{ secrets.MS_STORE_CLIENT_SECRET }}
          MS_STORE_PRODUCT_ID: ${{ secrets.MS_STORE_PRODUCT_ID }}
          MS_STORE_SELLER_ID: ${{ secrets.MS_STORE_SELLER_ID }}
        # why: NO --allow-missing-artifact. The job builds Windows and packages the MSIX
        # first, so the script validates a package that exists on disk; a dry run that
        # skipped the artifact would report the path healthy having never touched the one
        # output the channel accepts.
        run: node tooling/release/submit-windows-store.mjs --dry-run --app subscriptiontracker
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: subscriptiontracker-windows-store-msix
          path: apps/subscriptiontracker/build/windows/msix/subscriptiontracker.msix
          retention-days: 7
          if-no-files-found: error

  submit:
    name: Submit to the Microsoft Store (owner-approved)
    runs-on: windows-2025
    timeout-minutes: 30
    needs: [gate, dry-run]
    # why: a typed phrase, not a checkbox, and the dispatch default is empty.
    if: inputs.confirm == 'SUBMIT-TO-MICROSOFT-STORE'
    # why: this line is the owner-approval PAUSE (ADR 031 class A), and on its own it
    # FAILS OPEN -- GitHub creates a referenced environment that does not exist, with
    # no protection rules, and runs. tooling/release/submit-windows-store.mjs therefore
    # also reads the environment's protection rules at run time, and
    # assert-release-provenance.mjs fails the build for a lane carrying only one half.
    environment: store-publish
    permissions:
      contents: read
      checks: read
      deployments: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # why: ONLY main SUBMITS, CHECKED BEFORE ANYTHING ELSE RUNS (row
      # O-DEPLOY-IS-NOT-ONE-GATED-LANE, limb 2). `workflow_dispatch` runs on whatever ref
      # the dispatcher picks, and `environment: store-publish` alone fails open (above),
      # so a dispatch from any branch or tag but main exits 1 here. Held FIRST by
      # assert-workflow-hardening limb 10. bash, as every step of this job runs.
      - name: Refuse any ref but main
        shell: bash
        run: node tooling/ci/assert-deploy-ref.mjs --allow main
      - name: A real submission must name the listing it will be recorded against
        shell: bash
        env:
          LISTING_URL: ${{ inputs.listing_url }}
        run: |
          set -euo pipefail
          case "${LISTING_URL}" in
            https://*)
              echo "⬜ [10]D-9 the submission will be recorded against ${LISTING_URL}"
              ;;
            '')
              echo "FAIL the \`listing_url\` dispatch input is EMPTY, and this job is a REAL submission." >&2
              echo "     [10]D-9: a store record whose listing nobody can open says something shipped and" >&2
              echo "     gives no way to look at it. The [10]D-9 recorder refuses a store environment with" >&2
              echo "     no --listing-url, so this run could submit and then be unable to record what it did." >&2
              echo "     Re-dispatch with listing_url set, e.g.  https://apps.microsoft.com/detail/<product-id>" >&2
              exit 1
              ;;
            *)
              echo "FAIL \`listing_url\` is ${LISTING_URL}, which is not an https URL." >&2
              echo "     The ledger row is the ONLY address anybody will have for this submission once the" >&2
              echo "     dashboard is behind an account nobody can open." >&2
              exit 1
              ;;
          esac
      # why: the shape assert-green-means-ran.mjs section B counts -- the branch that
      # discovers the secret is absent ENDS the job. A submission job that finds it
      # cannot authenticate and then reports success is a green tick over a store that
      # received nothing.
      - name: Preflight — every Microsoft Store credential must be present
        shell: bash
        env:
          MS_STORE_TENANT_ID: ${{ secrets.MS_STORE_TENANT_ID }}
          MS_STORE_CLIENT_ID: ${{ secrets.MS_STORE_CLIENT_ID }}
          MS_STORE_CLIENT_SECRET: ${{ secrets.MS_STORE_CLIENT_SECRET }}
          MS_STORE_PRODUCT_ID: ${{ secrets.MS_STORE_PRODUCT_ID }}
          MS_STORE_SELLER_ID: ${{ secrets.MS_STORE_SELLER_ID }}
        run: |
          set -euo pipefail
          missing=''
          if [ -z "$MS_STORE_TENANT_ID" ];     then missing="$missing MS_STORE_TENANT_ID"; fi
          if [ -z "$MS_STORE_CLIENT_ID" ];     then missing="$missing MS_STORE_CLIENT_ID"; fi
          if [ -z "$MS_STORE_CLIENT_SECRET" ]; then missing="$missing MS_STORE_CLIENT_SECRET"; fi
          if [ -z "$MS_STORE_PRODUCT_ID" ];    then missing="$missing MS_STORE_PRODUCT_ID"; fi
          if [ -z "$MS_STORE_SELLER_ID" ];     then missing="$missing MS_STORE_SELLER_ID"; fi
          if [ -n "$missing" ]; then
            echo "::error title=Microsoft Store submission cannot run::these repository secrets are empty:$missing. They come from an Entra application associated with the Partner Center account (Private/runbooks/store-submission-windows.md). This is a FAILED submission, not a skipped one."
            exit 1
          fi
          echo "all five MS_STORE_* secrets present — the submission may proceed."
      - uses: ./.github/actions/setup-flutter
      - name: Resolve the workspace
        run: flutter pub get --enforce-lockfile
      # why `shell: bash` and a SHA output: this runner's default shell is pwsh, where
      # `${GITHUB_SHA::7}` is not an expansion. The short SHA is computed once here and read
      # as a step output, the same shape as build-platforms.yml's prepare job.
      - name: Derive the release line from pubspec
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          node tooling/ci/assert-app-versioning.mjs --emit apps/subscriptiontracker >> "$GITHUB_OUTPUT"
          echo "GITHUB_SHA_SHORT=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      # why: O-SUBMIT-LANES-SKIP-PRECONDITION-GATES. A lane green over a name the owner has not HELD
      # or proven free submits one nobody ruled on; limb 3 of assert-publish-steps-guarded.mjs.
      - name: Name clearance holds for windows-store (owner HELD or PROVEN-FREE)
        run: node tooling/ci/assert-name-clearance.mjs --for-submission=windows-store
      - name: Build windows
        working-directory: apps/subscriptiontracker
        run: >
          flutter build windows --release
          --obfuscate --split-debug-info=build/symbols/windows
          --build-name=${{ steps.ver.outputs.release_line }}.${{ github.run_number }}
          --build-number=${{ github.run_number }}
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }}
          --dart-define=APP_VERSION=${{ steps.ver.outputs.release_line }}.${{ github.run_number }}+${{ steps.ver.outputs.GITHUB_SHA_SHORT }}
          --dart-define=RELEASE_CHANNEL=windows-store
          --dart-define=GLITCHTIP_DSN=${{ secrets.GLITCHTIP_DSN }}
      # ⏱ MOVED AND CORRECTED 2026-09-07 (unit `symbols-everywhere`) — this step
      # was already "BEFORE the submission, not after" and is now earlier still,
      # ahead of `dart run msix:create`: packaging is a step like any other, and
      # GitHub skips the rest of a failed job, so a mapping kept only after the
      # packaging is a mapping the packaging can take with it. Its comment also
      # said the symbols were retained rather than sent to the crash sink
      # "because tooling/versions.json pins ONE glitchtip-cli binary and it is
      # linux-x86_64; this job runs on Windows (O-NATIVE-SYMBOL-UPLOAD-LINUX-ONLY)".
      # The Windows binary of the same release is now pinned by digest as
      # `glitchtip_cli_windows_x86_64_sha256` and the sink upload is two steps
      # below, which is what closes that open row.
      # why: this is the only copy of the mapping for the .msix that is about to
      # reach real users, and a rebuild produces a DIFFERENT one. 90 days, not 7:
      # this package ships.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: symbols-subscriptiontracker-windows-store
          path: apps/subscriptiontracker/build/symbols/windows
          retention-days: 90
          if-no-files-found: error
      # why: pwsh, for the same reason the msstore-cli install below is — this is
      # a Windows runner and `$RUNNER_TEMP` is a backslash path. Both halves of
      # the pin are read from tooling/versions.json at run time, so a bump cannot
      # advance one without the other.
      - name: Install glitchtip-cli (pinned by version AND by digest)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = node -p "require('./tooling/versions.json').glitchtip_cli"
          $sum = node -p "require('./tooling/versions.json').glitchtip_cli_windows_x86_64_sha256"
          $url = "https://gitlab.com/glitchtip/glitchtip-cli/-/jobs/artifacts/v$ver/raw/artifacts/glitchtip-cli-windows-x86_64.exe?job=build-windows-x86_64"
          $out = Join-Path $env:RUNNER_TEMP 'glitchtip-cli.exe'
          Invoke-WebRequest -Uri $url -OutFile $out -MaximumRetryCount 3 -RetryIntervalSec 5
          $got = (Get-FileHash -Algorithm SHA256 -Path $out).Hash.ToLower()
          if ($got -ne $sum) {
            Write-Error "glitchtip-cli digest mismatch: the download hashes to $got and tooling/versions.json declares $sum. A version names a release; the sha256 names the BYTES, and the asset is a GitLab JOB ARTIFACT URL, which is re-runnable. This refusal is the mechanism, not a gap in it."
          }
          $reported = & $out --version
          if ($reported -ne "glitchtip-cli $ver") {
            Write-Error "the pinned binary reports '$reported', not 'glitchtip-cli $ver'"
          }
          Write-Host $reported
      # why: BEFORE the submission, for the same reason the artifact above is.
      # This package reaches real users, so its mapping is the one that will
      # actually be needed. The 90-day artifact above is already written when this
      # runs, so a GlitchTip outage costs the sink copy and nothing else — and it
      # FAILS THE JOB rather than skipping, deliberately: a release that reaches
      # the Microsoft Store with no readable symbols is the state this unit exists
      # to stop. The wrapper names GLITCHTIP_TOKEN when it is absent.
      - name: Upload the native debug symbols to GlitchTip
        shell: pwsh
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.GLITCHTIP_TOKEN }}
          GLITCHTIP_DSN: ${{ secrets.GLITCHTIP_DSN }}
        run: >
          node tooling/ops/upload-native-symbols.mjs
          --cli "${env:RUNNER_TEMP}/glitchtip-cli.exe"
          --dir apps/subscriptiontracker/build/symbols/windows
          --org nikatru --project subscriptiontracker
      - name: Package MSIX (Microsoft Store)
        working-directory: apps/subscriptiontracker
        run: dart run msix:create --version=${{ steps.ver.outputs.release_line }}.${{ github.run_number }}.0
      # why: straight after msix:create, before anything reaches the Store: a package with the wrong identity stops the job here. bash, because pwsh is this runner's default.
      - name: The MSIX carries the identity the register declares
        shell: bash
        run: node tooling/ci/assert-artifact-signed-msix.mjs apps/subscriptiontracker/build/windows/msix/subscriptiontracker.msix
      # why: the Microsoft Store Developer CLI is the transport, for the same reason the
      # Snap lane speaks `snapcraft`: it is Microsoft's own, documented, cross-platform
      # and actively released, and it already holds the two links this repository has no
      # primary source for (the Azure Blob upload of the ZIP, and the full submission
      # body). The version is EXACT -- a range resolves at run time, so the rehearsal and
      # the submission could speak to different tools.
      # ⏱ CORRECTED 2026-09-07 (store-lanes second pass) — THE PIN IS READ FROM
      # tooling/versions.json, NOT WRITTEN HERE. `--version 0.4.2` was a literal in
      # this line and nowhere else, which put it outside the domain of
      # tooling/ci/assert-update-coverage.mjs: that guard quantifies over the KEYS of
      # tooling/versions.json, so a pin written inside a workflow is advanced by
      # nobody and no check in the tree can say so. Same shape as the gitleaks,
      # zizmor, OSV-Scanner and Trivy installs in ci.yml.
      - name: Install the Microsoft Store Developer CLI (exact pin from tooling/versions.json)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = node -p "require('./tooling/versions.json').msstore_cli"
          if (-not ($ver -match '^\d+\.\d+\.\d+$')) {
            Write-Error "tooling/versions.json key msstore_cli is '$ver'; an exact three-part version is required. A range resolves at run time, so the rehearsal and the submission could speak to different tools."
          }
          Write-Host "msstore-cli pin $ver (tooling/versions.json)"
          winget install --exact --id Microsoft.MSStoreCLI --version $ver --accept-source-agreements --accept-package-agreements --disable-interactivity
      # why: CONFIRM is the TYPED word, passed through -- a literal `--confirm` here made the
      # script's own confirm check a tautology. Same shape as submit-play.yml; pwsh reads $env:.
      # why: the first block is the lane gate Play and Snap carry in their scripts (GITHUB_ACTIONS
      # =true and GITHUB_REPOSITORY set), run in the submission's own step; this script has none.
      - name: Submit to the Microsoft Store
        id: submit
        env:
          MS_STORE_TENANT_ID: ${{ secrets.MS_STORE_TENANT_ID }}
          MS_STORE_CLIENT_ID: ${{ secrets.MS_STORE_CLIENT_ID }}
          MS_STORE_CLIENT_SECRET: ${{ secrets.MS_STORE_CLIENT_SECRET }}
          MS_STORE_PRODUCT_ID: ${{ secrets.MS_STORE_PRODUCT_ID }}
          MS_STORE_SELLER_ID: ${{ secrets.MS_STORE_SELLER_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if ($env:GITHUB_ACTIONS -ne 'true' -or [string]::IsNullOrWhiteSpace($env:GITHUB_REPOSITORY)) {
            Write-Error 'FAIL a Microsoft Store submission runs only inside GitHub Actions (GITHUB_ACTIONS=true and GITHUB_REPOSITORY set). The publish gate is the store-publish environment, whose approval exists nowhere else.'
            exit 1
          }
          node tooling/release/submit-windows-store.mjs --submit --app subscriptiontracker --confirm "$env:CONFIRM"
          exit $LASTEXITCODE
      # why: `shell: bash` is load-bearing (2026-09-23). This job runs on windows-2025, whose
      # default shell is pwsh, and under pwsh "$LISTING_URL" is an unset PowerShell VARIABLE,
      # not this step's env entry: the recorder got no --listing-url, exited 1 before any POST,
      # and a real submission was recorded nowhere. The arguments are bash, like Play's and
      # Snap's; deployment-record.test.mjs reads the shell this step RUNS under.
      - name: Record the submission in the [10]D-9 ledger
        if: always() && steps.submit.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          LISTING_URL: ${{ inputs.listing_url }}
        run: node tooling/ci/record-deployment.mjs subscriptiontracker-windows-store --state in_review --listing-url "$LISTING_URL"
