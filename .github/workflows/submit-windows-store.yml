name: "Store submit: Microsoft Store"

run-name: "Store submit: Microsoft Store — ${{ inputs.app }} — ${{ inputs.confirm == 'SUBMIT-TO-MICROSOFT-STORE' && 'SUBMIT' || 'dry run' }} by @${{ github.actor }}"

# The measurements, retractions and traps behind this file are in
# docs/ci/submit-windows-store.md. Only `# why:` lines live here, and
# docs/ci/README.md carries the rules every workflow has to obey.

on:
  workflow_dispatch:
    inputs:
      # why: required with NO default and NO choice list (O-STORE-LANES-HARD-WIRE-ONE-APP):
      # either one is an app id written into this file. The gate job checks it against the
      # workspace set; every other job reads the gate's output, never this input.
      app:
        description: 'The app to submit: one id of the workspace app set (tooling/ci/assert-release-lane-generic.mjs --emit-apps). The gate job refuses any other value.'
        required: true
        type: string
      confirm:
        description: 'Type SUBMIT-TO-MICROSOFT-STORE to run the submission job. Anything else runs the dry run only.'
        required: false
        default: ''
        type: string
      listing_url:
        description: 'The Microsoft Store listing URL this submission will be recorded against, e.g. https://apps.microsoft.com/detail/<product-id>. Required for a real submission; ignored by the dry run.'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  checks: read

jobs:
  gate:
    name: Require ci-gate to have passed
    runs-on: ubuntu-24.04
    # why: 25, not 10. assert-gate-passed.mjs polls for up to its own 1200 s default,
    # so any bound at or under 20 kills it mid-poll and replaces "timed out waiting
    # for ci-gate" with an opaque cancellation. Byte-identical in all five gate jobs.
    timeout-minutes: 25
    outputs:
      app: ${{ steps.app.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require ci-gate to have passed for this commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node tooling/ci/assert-gate-passed.mjs ${{ github.sha }}
      # why: the ONE reader of inputs.app, and only through env: (an input interpolated into
      # run: is a shell injection). --emit-apps --app refuses a value off ^[a-z][a-z0-9-]*$
      # before it reads the set, and one outside the set naming the set; only then is it an output.
      - name: The app input names one app of the workspace
        id: app
        env:
          APP_INPUT: ${{ inputs.app }}
        run: |
          set -euo pipefail
          node tooling/ci/assert-release-lane-generic.mjs --emit-apps --app "$APP_INPUT"
          echo "app=${APP_INPUT}" >> "$GITHUB_OUTPUT"

  dry-run:
    name: Validate the submission path
    runs-on: windows-2025
    timeout-minutes: 20
    needs: gate
    # why: the last step records this run (O-SUBMISSION-LANE-WITHOUT-RECORDER).
    permissions:
      contents: read
      deployments: write
    # why: the submit job ships THIS job's .msix, not a repackaging of a rebuild, and checks
    # it against this sha256 (O-SUBMIT-REBUILDS-WHAT-THE-DRY-RUN-BUILT; docs/ci/submit-windows-store.md).
    outputs:
      artifact: ${{ steps.bytes.outputs.artifact }}
      sha256: ${{ steps.bytes.outputs.sha256 }}
    # why: the gate's checked output, never inputs.app. A bash `run:` reads $APP and a pwsh one
    # (this runner's default) ${env:APP}; the fields no shell expands read the expression itself.
    env:
      APP: ${{ needs.gate.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-flutter
      - name: Resolve the workspace
        run: flutter pub get --enforce-lockfile
      # why `shell: bash` and a SHA output: this runner's default shell is pwsh, where
      # `${GITHUB_SHA::7}` is not an expansion. The short SHA is computed once here and read
      # as a step output, the same shape as build-platforms.yml's prepare job.
      - name: Derive the release line from pubspec
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          node tooling/ci/assert-app-versioning.mjs --emit "apps/${APP}" >> "$GITHUB_OUTPUT"
          echo "GITHUB_SHA_SHORT=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      # why: the backend defines. Without them AppConfig.isBackendLive stays
      # false, every field is at its PLACEHOLDER, and the packaged .msix is the
      # DEMO build -- mock sign-in, seeded data, no crash sink. Graded by
      # tooling/ci/assert-store-build-config.mjs.
      - name: Build windows
        env:
          RELEASE_LINE: ${{ steps.ver.outputs.release_line }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GLITCHTIP_DSN: ${{ secrets.GLITCHTIP_DSN }}
        run: node tooling/ci/flutter-release-build.mjs "${env:APP}" windows windows-store
      # ⏱ MOVED AND CORRECTED 2026-09-07 (unit `symbols-everywhere`) — THIS STEP
      # USED TO BE THE LAST ONE IN THE JOB, behind `dart run msix:create` and the
      # store dry run, and its comment said the symbols were retained rather than
      # sent to the crash sink "because tooling/versions.json pins ONE
      # glitchtip-cli binary and it is linux-x86_64; this job runs on Windows".
      # Both halves are now wrong: the ordering is the one
      # post-audit-obfuscation-and-symbols.md §9.3 reproduced on a real runner
      # (dispatch 34093704881 — a build succeeded WITH the flags, a later step
      # failed, and the symbols artifact was `skipped`), and the Windows binary
      # of the same release is now pinned by digest as
      # `glitchtip_cli_windows_x86_64_sha256`.
      # why: the .msix below wraps an OBFUSCATED build, so its crash reports are
      # unreadable without this directory and a rebuild produces a DIFFERENT one.
      # 7 days matches the dry-run package beside it, and the sink upload below is
      # the copy that lasts. ⏱ 2026-09-25: the submit job now ships this package
      # and re-keeps THIS directory for 90 days as symbols-<app>-windows-store.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: symbols-${{ needs.gate.outputs.app }}-windows-store-dry-run
          path: apps/${{ needs.gate.outputs.app }}/build/symbols/windows
          retention-days: 7
          if-no-files-found: error
      # why: ONE code path on every lane (O-GLITCHTIP-CLI-INSTALLED-BY-HAND): the digest tooling/versions.json
      # pins for this runner's OS, a bounded retry, and the binary's own --version held to the pin.
      - name: Install glitchtip-cli (pinned by version AND by digest)
        shell: pwsh
        run: node tooling/ci/install-pinned-tool.mjs glitchtip-cli --out "$env:RUNNER_TEMP"
      # why: FAILS CLOSED on a missing GLITCHTIP_TOKEN, never skips. Placed AFTER
      # the retention step above and BEFORE the MSIX packaging and the store dry
      # run below, so a GlitchTip outage cannot take the mapping with it. The project is the
      # ONE declaration, tooling/ops/glitchtip-project.json, never the app
      # (assert-glitchtip-project.mjs refuses an app-derived one); read as build-platforms.yml's
      # windows leg reads it.
      - name: Upload the native debug symbols to GlitchTip
        shell: pwsh
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.GLITCHTIP_TOKEN }}
          GLITCHTIP_DSN: ${{ secrets.GLITCHTIP_DSN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $gt = Get-Content -Raw tooling/ops/glitchtip-project.json | ConvertFrom-Json
          node tooling/ops/upload-native-symbols.mjs `
            --cli "${env:RUNNER_TEMP}/glitchtip-cli.exe" `
            --dir "apps/${env:APP}/build/symbols/windows" `
            --org $gt.org --project $gt.project
          if ($LASTEXITCODE -ne 0) { Write-Error "upload-native-symbols exited $LASTEXITCODE" }
      # why: msix writes one name as both the Store title and the Start-menu label; the second line sets the label to app.yaml shortName (O-MSIX-IDENTITY-UNGRADED). bash, so either line failing stops the step.
      - name: Package MSIX (Microsoft Store)
        working-directory: apps/${{ needs.gate.outputs.app }}
        shell: bash
        run: |
          dart run msix:create --version=${{ steps.ver.outputs.release_line }}.${{ github.run_number }}.0
          node ../../tooling/store/msix-visual-name.mjs --app "$APP" "build/windows/msix/${APP}.msix"
      # why: straight after msix:create, before the dry run touches the package: it must carry the identity the register declares. bash, because pwsh is this runner's default.
      - name: The MSIX carries the identity the register declares
        shell: bash
        run: node tooling/ci/assert-artifact-signed-msix.mjs --app "$APP" "apps/${APP}/build/windows/msix/${APP}.msix"
      # why: no MS_STORE_CLIENT_SECRET. It lives in the store-publish environment and this job has none;
      # the submit job checks it straight after its ref check (O-STORE-SECRETS-REACH-THE-DRY-RUN, assert-channel-register §8c).
      # No MS_STORE_PRODUCT_ID either: the Store ID is the app's own record, apps/<app>/app.yaml
      # stores.windows-store.productId, read by the script (O-STORE-RECORDS-ARE-ONE-PER-CHANNEL).
      - name: Dry-run the Microsoft Store submission
        env:
          MS_STORE_TENANT_ID: ${{ secrets.MS_STORE_TENANT_ID }}
          MS_STORE_CLIENT_ID: ${{ secrets.MS_STORE_CLIENT_ID }}
          MS_STORE_SELLER_ID: ${{ secrets.MS_STORE_SELLER_ID }}
        # why: NO --allow-missing-artifact. The job builds Windows and packages the MSIX
        # first, so the script validates a package that exists on disk; a dry run that
        # skipped the artifact would report the path healthy having never touched the one
        # output the channel accepts.
        run: node tooling/release/submit-windows-store.mjs --dry-run --app "${env:APP}"
      # why: O-SUBMIT-DRY-RUN-GATES-BLIND-THE-REHEARSAL (AA-02): the gates below run AFTER the build, the packaging
      # and the store dry run, so a red gate still fails this job and skips submit, but only once the .msix was rehearsed.
      # why: O-SUBMIT-LANES-SKIP-PRECONDITION-GATES. A lane green over a name the owner has not HELD
      # or proven free submits one nobody ruled on; limb 3 of assert-publish-steps-guarded.mjs.
      - name: Name clearance holds for windows-store (owner HELD or PROVEN-FREE)
        run: node tooling/ci/assert-name-clearance.mjs --for-submission=windows-store
      # why: LEAD RULING 2026-09-26 22:00Z (O-APP1-CONSOLE-DECLARATIONS-UNSUBMITTED): the date the owner swore the app's
      # Partner Center declarations (stores.windows-store.declaredOn) gates a REAL submission only. The dry run grades
      # the record and prints NOT YET DECLARED; it never refuses on the date (no --real-submission here). bash: $APP.
      - name: The app's Partner Center declarations are recorded (--for-submission)
        shell: bash
        run: node tooling/ci/assert-sworn-store-files.mjs --for-submission=windows-store --app "$APP"
      # why: C-03. A missing screenshot set was fatal only on Play; Partner Center refuses a listing without one.
      - name: The Microsoft Store screenshot set covers its declared device types
        shell: bash
        run: node tooling/ci/assert-play-device-coverage.mjs --for-submission=windows-store
      # why: O-SUBMIT-LANES-IGNORE-NATIVE-AUTH. A dry run prints what a real submission of a build that cannot
      # sign in would be refused, and never refuses; the submit job passes --real-submission.
      - name: A build that cannot sign in is not committed for certification (windows-store)
        shell: bash
        run: node tooling/ci/assert-channel-register.mjs --for-submission=windows-store
      # why: the hand-off the submit job verifies, and the upload below reads the same
      # output, so the name is written once. Nothing runs between this hash and that
      # upload. bash, because pwsh is this runner's default.
      - name: Hand the submit job this package's name and sha256
        id: bytes
        shell: bash
        env:
          MSIX: apps/${{ needs.gate.outputs.app }}/build/windows/msix/${{ needs.gate.outputs.app }}.msix
        run: |
          set -euo pipefail
          sum="$(sha256sum "$MSIX" | cut -d ' ' -f 1)"
          echo "artifact=${APP}-windows-store-msix" >> "$GITHUB_OUTPUT"
          echo "sha256=${sum}" >> "$GITHUB_OUTPUT"
          echo "${sum}  ${MSIX}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.bytes.outputs.artifact }}
          path: apps/${{ needs.gate.outputs.app }}/build/windows/msix/${{ needs.gate.outputs.app }}.msix
          retention-days: 7
          if-no-files-found: error
      # why: every run of this lane is recorded, and a rehearsal AS one (O-SUBMISSION-LANE-WITHOUT-RECORDER,
      # assert-publish-records rule 3a): --mode dry-run writes "<app>-windows-store-dry-run", which no
      # reader of the production ledger opens. bash: the recorder's arguments are bash (pwsh is the default).
      - name: Record the dry run in the [10]D-9 ledger (mode dry-run)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node tooling/ci/record-deployment.mjs "${APP}-windows-store" --mode dry-run

  submit:
    name: Submit to the Microsoft Store (owner-approved)
    runs-on: windows-2025
    timeout-minutes: 30
    needs: [gate, dry-run]
    # why: a typed phrase, not a checkbox, and the dispatch default is empty.
    if: inputs.confirm == 'SUBMIT-TO-MICROSOFT-STORE'
    # why: this line is the owner-approval PAUSE (ADR 031 class A), and on its own it
    # FAILS OPEN -- GitHub creates a referenced environment that does not exist, with
    # no protection rules, and runs. tooling/release/submit-windows-store.mjs therefore
    # also reads the environment's protection rules at run time, and
    # assert-release-provenance.mjs fails the build for a lane carrying only one half.
    environment: store-publish
    permissions:
      contents: read
      checks: read
      deployments: write
    # why: the same checked output the dry-run job read, so both jobs name one app.
    env:
      APP: ${{ needs.gate.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # why: ONLY main SUBMITS, CHECKED BEFORE ANYTHING ELSE RUNS (row
      # O-DEPLOY-IS-NOT-ONE-GATED-LANE, limb 2). `workflow_dispatch` runs on whatever ref
      # the dispatcher picks, and `environment: store-publish` alone fails open (above),
      # so a dispatch from any branch or tag but main exits 1 here. Held FIRST by
      # assert-workflow-hardening limb 10. bash, as every step of this job runs.
      - name: Refuse any ref but main
        shell: bash
        run: node tooling/ci/assert-deploy-ref.mjs --allow main
      # why: the shape assert-green-means-ran.mjs section B counts -- the branch that
      # discovers the secret is absent ENDS the job. A submission job that finds it
      # cannot authenticate and then reports success is a green tick over a store that
      # received nothing. Straight after the ref check (assert-workflow-hardening limb 10
      # holds that one first), because MS_STORE_CLIENT_SECRET is a store-publish
      # environment secret: this job is the only one that can see it, so no earlier run
      # has checked it, and an absent one ends the run before a build or any upload.
      - name: Preflight — every Microsoft Store credential must be present
        shell: bash
        env:
          MS_STORE_TENANT_ID: ${{ secrets.MS_STORE_TENANT_ID }}
          MS_STORE_CLIENT_ID: ${{ secrets.MS_STORE_CLIENT_ID }}
          MS_STORE_CLIENT_SECRET: ${{ secrets.MS_STORE_CLIENT_SECRET }}
          MS_STORE_SELLER_ID: ${{ secrets.MS_STORE_SELLER_ID }}
        run: |
          set -euo pipefail
          missing=''
          if [ -z "$MS_STORE_TENANT_ID" ];     then missing="$missing MS_STORE_TENANT_ID"; fi
          if [ -z "$MS_STORE_CLIENT_ID" ];     then missing="$missing MS_STORE_CLIENT_ID"; fi
          if [ -z "$MS_STORE_CLIENT_SECRET" ]; then missing="$missing MS_STORE_CLIENT_SECRET"; fi
          if [ -z "$MS_STORE_SELLER_ID" ];     then missing="$missing MS_STORE_SELLER_ID"; fi
          if [ -n "$missing" ]; then
            echo "::error title=Microsoft Store submission cannot run::these secrets are empty in this store-publish job:$missing. MS_STORE_CLIENT_SECRET is a store-publish ENVIRONMENT secret (tooling/channel-register.json scopes it there) and the three ids are repository secrets (the Store ID is the app's own record, stores.windows-store.productId). OWNER STEP for the client secret: GitHub -> Settings -> Environments -> store-publish -> Environment secrets -> add MS_STORE_CLIENT_SECRET. The values come from an Entra application associated with the Partner Center account (Private/runbooks/store-submission-windows.md). This is a FAILED submission, not a skipped one."
            exit 1
          fi
          echo "all four MS_STORE_* secrets present — the submission may proceed."
      - name: A real submission must name the listing it will be recorded against
        shell: bash
        env:
          LISTING_URL: ${{ inputs.listing_url }}
        run: |
          set -euo pipefail
          case "${LISTING_URL}" in
            https://*)
              echo "⬜ [10]D-9 the submission will be recorded against ${LISTING_URL}"
              ;;
            '')
              echo "FAIL the \`listing_url\` dispatch input is EMPTY, and this job is a REAL submission." >&2
              echo "     [10]D-9: a store record whose listing nobody can open says something shipped and" >&2
              echo "     gives no way to look at it. The [10]D-9 recorder refuses a store environment with" >&2
              echo "     no --listing-url, so this run could submit and then be unable to record what it did." >&2
              echo "     Re-dispatch with listing_url set, e.g.  https://apps.microsoft.com/detail/<product-id>" >&2
              exit 1
              ;;
            *)
              echo "FAIL \`listing_url\` is ${LISTING_URL}, which is not an https URL." >&2
              echo "     The ledger row is the ONLY address anybody will have for this submission once the" >&2
              echo "     dashboard is behind an account nobody can open." >&2
              exit 1
              ;;
          esac
      # why: O-SUBMIT-LANES-SKIP-PRECONDITION-GATES. A lane green over a name the owner has not HELD
      # or proven free submits one nobody ruled on; limb 3 of assert-publish-steps-guarded.mjs.
      - name: Name clearance holds for windows-store (owner HELD or PROVEN-FREE)
        run: node tooling/ci/assert-name-clearance.mjs --for-submission=windows-store
      # why: --real-submission (O-APP1-CONSOLE-DECLARATIONS-UNSUBMITTED; LEAD RULING 2026-09-26 22:00Z): this job is the
      # REAL submission, so stores.windows-store.declaredOn must be a date; null refuses here, before the package is taken.
      - name: The app's Partner Center declarations are recorded (--for-submission)
        shell: bash
        run: node tooling/ci/assert-sworn-store-files.mjs --for-submission=windows-store --app "$APP" --real-submission
      # why: C-03. A missing screenshot set was fatal only on Play; Partner Center refuses a listing without one.
      - name: The Microsoft Store screenshot set covers its declared device types
        shell: bash
        run: node tooling/ci/assert-play-device-coverage.mjs --for-submission=windows-store
      # why: O-SUBMIT-LANES-IGNORE-NATIVE-AUTH (C-04). This job commits the package for certification, a public step:
      # refused while the register says the build cannot sign in, before the package is taken.
      - name: A build that cannot sign in is not committed for certification (windows-store)
        shell: bash
        run: node tooling/ci/assert-channel-register.mjs --for-submission=windows-store --real-submission
      # why: THE DRY RUN'S PACKAGE, NOT A REBUILD (O-SUBMIT-REBUILDS-WHAT-THE-DRY-RUN-BUILT):
      # one compile and one msix:create per dispatch. The dry-run job read this package's
      # identity back straight after packaging it, and the sha256 below proves these are those
      # bytes. Retention is 7 days and there is no fallback: an older approval fails here.
      - name: Take the dry-run job's package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.dry-run.outputs.artifact }}
          path: apps/${{ needs.gate.outputs.app }}/build/windows/msix
      # why: the value arrives through env:, never interpolated into run: (zizmor). bash,
      # because pwsh is this runner's default.
      - name: The package is the one the dry-run job hashed (sha256)
        shell: bash
        env:
          EXPECTED_SHA256: ${{ needs.dry-run.outputs.sha256 }}
          MSIX: apps/${{ needs.gate.outputs.app }}/build/windows/msix/${{ needs.gate.outputs.app }}.msix
        run: |
          set -euo pipefail
          if ! printf '%s' "$EXPECTED_SHA256" | grep -Eqx '[0-9a-f]{64}'; then
            echo "FAIL the dry-run job's sha256 output is '${EXPECTED_SHA256}', not 64 hex digits: nothing to check the download against." >&2
            exit 1
          fi
          printf '%s  %s\n' "$EXPECTED_SHA256" "$MSIX" | sha256sum --check --strict -
      # why: the mapping of the package above is the dry-run job's (same build), already in
      # the crash sink from that job. Kept again here for 90 days, not 7, because this
      # package ships; BEFORE the submission, so a failed submission cannot skip it.
      - name: Take the dry-run job's symbols for this package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: symbols-${{ needs.gate.outputs.app }}-windows-store-dry-run
          path: apps/${{ needs.gate.outputs.app }}/build/symbols/windows
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: symbols-${{ needs.gate.outputs.app }}-windows-store
          path: apps/${{ needs.gate.outputs.app }}/build/symbols/windows
          retention-days: 90
          if-no-files-found: error
      # why: the Microsoft Store Developer CLI is the transport, for the same reason the
      # Snap lane speaks `snapcraft`: it is Microsoft's own, documented, cross-platform
      # and actively released, and it already holds the two links this repository has no
      # primary source for (the Azure Blob upload of the ZIP, and the full submission
      # body). The version is EXACT -- a range resolves at run time, so the rehearsal and
      # the submission could speak to different tools.
      # ⏱ CORRECTED 2026-09-07 (store-lanes second pass) — THE PIN IS READ FROM
      # tooling/versions.json, NOT WRITTEN HERE. `--version 0.4.2` was a literal in
      # this line and nowhere else, which put it outside the domain of
      # tooling/ci/assert-update-coverage.mjs: that guard quantifies over the KEYS of
      # tooling/versions.json, so a pin written inside a workflow is advanced by
      # nobody and no check in the tree can say so. Same shape as the gitleaks,
      # zizmor, OSV-Scanner and Trivy installs in ci.yml.
      - name: Install the Microsoft Store Developer CLI (exact pin from tooling/versions.json)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = node -p "require('./tooling/versions.json').msstore_cli"
          if (-not ($ver -match '^\d+\.\d+\.\d+$')) {
            Write-Error "tooling/versions.json key msstore_cli is '$ver'; an exact three-part version is required. A range resolves at run time, so the rehearsal and the submission could speak to different tools."
          }
          Write-Host "msstore-cli pin $ver (tooling/versions.json)"
          winget install --exact --id Microsoft.MSStoreCLI --version $ver --accept-source-agreements --accept-package-agreements --disable-interactivity
      # why: CONFIRM is the TYPED word, passed through -- a literal `--confirm` here made the
      # script's own confirm check a tautology. Same shape as submit-play.yml; pwsh reads $env:.
      # why: the first block is the lane gate Play and Snap carry in their scripts (GITHUB_ACTIONS
      # =true and GITHUB_REPOSITORY set), run in the submission's own step; this script has none.
      - name: Submit to the Microsoft Store
        id: submit
        env:
          MS_STORE_TENANT_ID: ${{ secrets.MS_STORE_TENANT_ID }}
          MS_STORE_CLIENT_ID: ${{ secrets.MS_STORE_CLIENT_ID }}
          MS_STORE_CLIENT_SECRET: ${{ secrets.MS_STORE_CLIENT_SECRET }}
          MS_STORE_SELLER_ID: ${{ secrets.MS_STORE_SELLER_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if ($env:GITHUB_ACTIONS -ne 'true' -or [string]::IsNullOrWhiteSpace($env:GITHUB_REPOSITORY)) {
            Write-Error 'FAIL a Microsoft Store submission runs only inside GitHub Actions (GITHUB_ACTIONS=true and GITHUB_REPOSITORY set). The publish gate is the store-publish environment, whose approval exists nowhere else.'
            exit 1
          }
          node tooling/release/submit-windows-store.mjs --submit --app "${env:APP}" --confirm "$env:CONFIRM"
          exit $LASTEXITCODE
      # why: `shell: bash` is load-bearing (2026-09-23). This job runs on windows-2025, whose
      # default shell is pwsh, and under pwsh "$LISTING_URL" is an unset PowerShell VARIABLE,
      # not this step's env entry: the recorder got no --listing-url, exited 1 before any POST,
      # and a real submission was recorded nowhere. The arguments are bash, like Play's and
      # Snap's; deployment-record.test.mjs reads the shell this step RUNS under.
      - name: Record the submission in the [10]D-9 ledger
        if: always() && steps.submit.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          LISTING_URL: ${{ inputs.listing_url }}
        run: node tooling/ci/record-deployment.mjs "${APP}-windows-store" --state in_review --listing-url "$LISTING_URL" --mode production
