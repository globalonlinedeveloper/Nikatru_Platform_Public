name: Snap Store submission path (dry run)

# [pipeline D-10] limb (i) — "a submission script exists AND RESOLVES TO A STEP
# IN A WORKFLOW, parsed not grepped". This workflow is the step it resolves to.
# tooling/channel-register.json's linux-snap row names this file and this job in
# its `submission` block — and, since 2026-08-09, in its `lane` block too, because
# this is now the job that EMITS the format the row accepts.
#
# 🔴 DISPATCH-ONLY, AND THAT IS THE CORRECT SHAPE WHILE `served: false`.
# The channel is deferred by [ADR 015] until there is revenue — the web build
# already serves Linux users at $0 — and the one owner action it needs
# (OWNER_QUEUE A-6) is claiming the global snap name.
#
# ── WHAT CHANGED ON 2026-08-09, because it changes what a green run here means ─
# ⚠️ THIS JOB USED TO SAY "IT DOES NOT BUILD A .snap, AND THAT IS NOT A SHORTCUT",
# and its own TODO named the condition under which that stopped being true: "There
# is no `snapcraft.yaml` in this repository … When the recipe lands, add the build
# to THIS job and drop `--allow-missing-artifact` from the step below, in the same
# increment." The recipe landed on 2026-08-08 — it is GENERATED by
# tooling/release/generate-snapcraft.mjs rather than committed — so this is that
# increment. The job now compiles the Linux bundle, derives the recipe from it,
# packs a real .snap, and validates THAT rather than validating a listing beside
# an artifact nobody could produce.
#
# `--allow-missing-artifact` is gone with it. Keeping the flag once a .snap exists
# would be the shape submit-play.yml spent months in: a dry run reporting the
# submission path healthy while never touching the one output the channel accepts.
#
# ── WHY `--destructive-mode` AND NOT LXD ────────────────────────────────────
# ✅ `snapcraft pack --destructive-mode` is "Build in the current host" and
# `--use-lxd` is "Build in a LXD container" (https://ubuntu.com/docs/snapcraft/
# stable/reference/commands/pack/, fetched 2026-08-09). The constraint that
# decides between them is the same document's build-environment guidance: "The
# build environment should match the snap base."
#
# The recipe's `base` is DERIVED from the runner build-platforms.yml compiles the
# bundle on — `ubuntu-24.04` → `core24`. This job runs on the same label, so the
# host IS the matching environment and a container would only reproduce it more
# slowly: installing and initialising a daemon, joining a group mid-job, and
# pulling a base image, to arrive at the environment the runner already is.
#
# ⚠️ LXD IS NOT LISTED ON THE ubuntu-24.04 IMAGE and that is an ABSENCE OF
# EVIDENCE, stated as one: actions/runner-images' Ubuntu2404-Readme.md (fetched
# 2026-08-09) enumerates Docker, Podman and Buildah and names no LXD. A README
# omission is not a proof of absence, so this is a reason to prefer the path that
# needs neither, not a claim that `--use-lxd` would fail.
#
# 🔴 THE COUPLING THAT BUYS IS REAL AND IS ENCODED, NOT NOTED. Two workflows now
# name a runner label for one snap: build-platforms.yml decides the `base`, this
# file decides the host that packs against it. Move either alone and the app links
# against libraries it did not build with — a failure with no diagnostic, because
# a snap that mismatches its base installs and then misbehaves at runtime. The
# `--pack-runner` argument below is what compares them, and it fails the job.
#
# ── WHAT ACTUALLY STOPS AN UPLOAD, MEASURED BY RUNNING IT ───────────────
# 🔴 THIS BLOCK SAID "`--submit` REFUSES WITH UNVERIFIED" UNTIL 2026-08-20 AND
# THAT WAS THE WRONG REASON. submit-snap.mjs really does run
# `snapcraft upload <snap> --release=<channel>` (:985) — the verbs are sourced.
# Run on 2026-08-20 with the CI markers set, the actual refusal was:
#
#     FAIL no job in .github/workflows/submit-snap.yml invokes
#          `submit-snap.mjs --submit`.
#
# The refusal was STRUCTURAL, not epistemic: the script requires this workflow to
# declare the job that submits, and none did. Two documents disagreed about this
# — the register's linux-snap row says the script "refuses to guess", this
# header said UNVERIFIED — and NEITHER named the real gate. That is the
# recorded lesson of this repo applied to itself: do not trust a workflow header
# over the script it invokes; run it.
#
# ⚠️ SO ADDING THE `submit` JOB BELOW LIFTS THAT REFUSAL, DELIBERATELY. What
# stops an upload now is the next gate in line and it is a real one: no
# SNAPCRAFT_STORE_CREDENTIALS secret exists, so the job fails naming the missing
# credential. Beyond that sits OWNER_QUEUE A-6, the GLOBAL snap-name claim, which
# is irreversible and is the owner's. Snap auto-updates SILENTLY, so a wrong
# revision does not fail cleanly — it lands on real machines. Hence the typed
# `confirm`, the `store-publish` environment with its required reviewer, and a
# job that rebuilds and re-gates the artifact it is about to send.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type SUBMIT-TO-SNAP-STORE to run the upload job. Anything else runs the dry run only.'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  checks: read

env:
  FLUTTER_VERSION: '3.44.9'

jobs:
  # Same shape and same reason as submit-play.yml's and submit-windows-store.yml's
  # gate jobs: this workflow now runs a `flutter build --release`, and a release
  # build from an ungated commit is [pipeline R-6]'s whole subject.
  # assert-release-provenance.mjs walks the `needs` graph, so gating once here
  # covers the job below.
  #
  # ⚠️ THE COMMENT THAT USED TO SIT HERE ARGUED THE OPPOSITE, and it argued it
  # correctly for the workflow as it then was: "this workflow runs none — there is
  # no snapcraft recipe, so it compiles nothing. Add the gate in the same increment
  # that adds the build." This is that increment.
  gate:
    name: Require ci-gate to have passed
    runs-on: ubuntu-24.04
    # 25, not 10, and the number comes from the script rather than from the clock:
    # assert-gate-passed.mjs POLLS for up to its own 1200 s default (this call
    # leaves `--timeout-seconds` unset), so any bound at or under 20 kills it
    # mid-poll and replaces "timed out waiting for ci-gate" with an opaque
    # cancellation. Kept byte-identical in all five `gate:` jobs. [pipeline F-5b]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require ci-gate to have passed for this commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node tooling/ci/assert-gate-passed.mjs ${{ github.sha }}

  dry-run:
    name: Validate the submission path
    # 🔴 THE LABEL IS LOAD-BEARING, not a default. It has to be the release whose
    # libraries the snap declares — see the `--destructive-mode` note in the header
    # — and the `--pack-runner` argument below is written to match it. Changing one
    # without the other is the failure that step exists to catch.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: gate
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      # ── the Linux toolchain, DERIVED FROM THE OTHER LANE, NEVER RETYPED ──────
      # 🔴 A SECOND `apt-get install -y clang cmake …` LINE HERE WOULD BE THE
      # DUPLICATION [pipeline F-2] AND generate-snapcraft.mjs'S WHOLE PARSER EXIST
      # TO PREVENT. build-platforms.yml's "Linux build deps" step is the single
      # declaration of what a Linux build of this app needs; the recipe's
      # `stage-packages` is already that same list, extracted. So this step asks
      # the same extractor for it. The workflow gaining a package because a build
      # broke then reaches BOTH jobs, or neither — never one.
      #
      # `$deps` is deliberately unquoted in the install: the emitted value is one
      # line of space-separated package names and must SPLIT into arguments.
      # Nothing but that list goes to stdout — the extractor writes its diagnostic
      # to stderr, because a diagnostic on stdout becomes a package name.
      - name: Linux build deps (the same list the Linux build lane installs)
        run: |
          set -euo pipefail
          deps="$(node tooling/release/generate-snapcraft.mjs --emit-build-deps)"
          echo "installing: ${deps}"
          sudo apt-get update
          sudo apt-get install -y ${deps}
      # apps/subly is a pub WORKSPACE member: resolution happens at the repo
      # root, not in the app directory.
      - name: Resolve the workspace
        run: flutter pub get --enforce-lockfile
      # ── [9]R-2 · THE RELEASE LINE, DERIVED, NEVER TYPED ─────────────────────
      # The same step build-platforms.yml and deploy-web.yml run, reading the same
      # pubspec with the same parser the guard uses. The recipe's `version` and the
      # binary's `--build-name` come from this one value: the Snap Store orders
      # revisions by the recipe's version, and a recipe versioned differently from
      # the binary it packages is two release lines wearing one name.
      - name: Derive the release line from pubspec
        id: ver
        run: node tooling/ci/assert-app-versioning.mjs --emit apps/subly >> "$GITHUB_OUTPUT"
      # 🔴 THE DEFINES ARE WHAT MAKE THIS A REAL BUILD RATHER THAN THE DEMO.
      # `AppConfig.isBackendLive` compares each of them against a PLACEHOLDER;
      # left unpassed, the .snap packed below would ship `MockAuthRepository` and
      # `SeedApiClient` — the exact state the Google Play lane was found in on
      # 2026-08-04, with every check green. Graded by
      # tooling/ci/assert-store-build-config.mjs, which derives the required set
      # from `isBackendLive` and the lane from this row's `lane`/`submission`.
      #
      # RELEASE_CHANNEL is `linux-snap` and NOT `linux-appimage`, which is the one
      # place this job differs from build-platforms.yml's Linux build. That build
      # stamps `linux-appimage` because it is a build PROOF that no channel
      # consumes and the register names exactly one direct Linux download channel;
      # this one packs the artifact the Snap Store would take, so the closest true
      # answer here is the exact one. assert-channel-register.mjs §6b resolves the
      # value against a register row, so a typo cannot compile.
      - name: Build linux
        working-directory: apps/subly
        run: >
          flutter build linux --release
          --build-name=${{ steps.ver.outputs.release_line }}.${{ github.run_number }}
          --dart-define=APP_VERSION=${{ steps.ver.outputs.release_line }}.${{ github.run_number }}+${GITHUB_SHA::7}
          --dart-define=RELEASE_CHANNEL=linux-snap
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }}
          --dart-define=GLITCHTIP_DSN=${{ secrets.GLITCHTIP_DSN }}
      # ── the recipe, DERIVED from the bundle just built ───────────────────────
      # The same invocation build-platforms.yml makes, against the bundle this job
      # produced. The recipe is generated and never committed: a committed one is a
      # SECOND COPY of five facts that already have one home each — the snap name,
      # the summary, the description, the licence and the Linux binary identity.
      # `--out` IS the snapcraft project directory; `snap/snapcraft.yaml` is the
      # fixed path inside it, and `snapcraft` is run from there below.
      - name: Generate the snapcraft recipe
        run: >
          node tooling/release/generate-snapcraft.mjs
          --app subly
          --bundle apps/subly/build/linux/x64/release/bundle
          --out "$RUNNER_TEMP/snapcraft-subly"
          --version ${{ steps.ver.outputs.release_line }}.${{ github.run_number }}
      # A GENERATOR THAT HAS STOPPED READING THE TREE STILL WRITES A FILE. Same
      # step build-platforms.yml runs, plus the two questions only a job that is
      # about to PACK can ask: does the `base` match the host packing it, and does
      # `source:` resolve — from the project directory, which is how snapcraft
      # resolves it — to a directory holding this app's binary. Both are cheap here
      # and both are silent everywhere else: a wrong base produces a snap that
      # installs and misbehaves, and a `source` off by one `..` is still relative,
      # still free of host paths, and still points at nothing.
      #
      # ✅ AND, SINCE THE FIRST DISPATCH, THE TWO RULES OF THE SNAP FORMAT ITSELF
      # that no amount of comparing the recipe to this tree could ever have caught:
      # the licence is an SPDX expression snapd accepts or the key is absent, and
      # the launcher resolves inside the snap. Each carries the exact string
      # snapcraft failed with, so the next reader does not have to spend a runner
      # to find out what these limbs are for.
      - name: The generated recipe is complete, still derived, and packable here
        run: >
          node tooling/ci/assert-snapcraft-generable.mjs
          --emitted "$RUNNER_TEMP/snapcraft-subly/snap/snapcraft.yaml"
          --app subly
          --pack-runner ubuntu-24.04
      # ── PACK ────────────────────────────────────────────────────────────────
      # `--destructive-mode` builds on the host; see the header for why that is the
      # right choice on a runner whose release already matches the recipe's base.
      # ✅ `sudo` is not caution: snapcraft's build-environment page (fetched
      # 2026-08-09) states that a core22+ destructive-mode build needs root-level
      # permissions to install packages, snaps and repositories — which is exactly
      # what `stage-packages` makes it do.
      #
      # ✅ THE FIRST DISPATCH (run 31294305898, 2026-08-09) PROVED THE MECHANISM,
      # and this note records it rather than leaving the claim aspirational. It
      # reached snapcraft's own validation, which means: the Flutter build, the
      # recipe generation, `--destructive-mode` on this runner, `plugin: dump`
      # ingesting a `source:` that points OUTSIDE the project directory, and
      # `stage-packages` resolving under snapcraft's own apt handling ALL WORK.
      #
      # 🔴 WHAT IT REJECTED WAS THE RECIPE'S CONTENT, in two ways no check in this
      # repository could have seen, because every check compared the recipe to THE
      # TREE and none knew a rule of the snap FORMAT:
      #   · `cannot validate license "proprietary": unknown license: proprietary`
      #   · `Icon 'com.nikatru.subly' … not found in prime directory`
      # Both are fixed at their source in tooling/release/generate-snapcraft.mjs
      # (the `license:` key is omitted, and the launcher moved to `snap/gui/` with
      # an absolute `${SNAP}/meta/gui/…` icon path), and BOTH ARE NOW ASSERTED by
      # the step above — with the failing input recorded, so re-introducing either
      # reddens before a runner is spent rather than after a full Linux build.
      #
      # 🔴 THE OUTPUT NAME IS SNAPCRAFT'S, AND THE PATH THIS REPO COLLECTS IT AT IS
      # OURS. snapcraft writes `<name>_<version>_<arch>.snap`; submit-snap.mjs
      # validates `apps/<app>/build/linux/snap/<app>.snap`, a convention this
      # repository chose. So the file is MOVED rather than guessed at, and the move
      # refuses unless there is EXACTLY ONE candidate: zero means the pack produced
      # nothing while exiting 0, and two means this step would have to choose which
      # snap the channel submits, silently.
      - name: Install snapcraft
        run: sudo snap install snapcraft --classic
      - name: Pack the snap
        run: |
          set -euo pipefail
          project="${RUNNER_TEMP}/snapcraft-subly"
          collected="${GITHUB_WORKSPACE}/apps/subly/build/linux/snap/subly.snap"
          cd "$project"
          sudo snapcraft pack --destructive-mode
          count="$(find "$project" -maxdepth 1 -type f -name '*.snap' | wc -l)"
          if [ "$count" -ne 1 ]; then
            echo "FAIL snapcraft exited 0 and left ${count} .snap file(s) in ${project}:" >&2
            find "$project" -maxdepth 1 -type f -name '*.snap' >&2
            echo "     Exactly one is required. Zero is a pack that produced nothing while reporting" >&2
            echo "     success; more than one means this step would have to choose which snap the" >&2
            echo "     channel submits, and a chooser with no stated rule picks silently." >&2
            exit 1
          fi
          built="$(find "$project" -maxdepth 1 -type f -name '*.snap')"
          mkdir -p "$(dirname "$collected")"
          sudo mv "$built" "$collected"
          sudo chown "$(id -u):$(id -g)" "$collected"
          ls -l "$collected"
      # The credential does not exist yet — OWNER_QUEUE A-6 — and the script
      # reports its ABSENCE as a printed gap rather than a failure. It is wired
      # now so that the day it exists, nothing about this job changes. `secrets`
      # are empty strings when unset, which is what the presence check reads.
      #
      # ⚠️ NO `--allow-missing-artifact`. The step above produced the artifact, so
      # the script validates a package that exists on disk rather than a listing
      # beside nothing.
      - name: Dry-run the Snap Store submission
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: node tooling/release/submit-snap.mjs --dry-run --app subly
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: subly-linux-snap
          path: apps/subly/build/linux/snap/subly.snap
          retention-days: 7
          if-no-files-found: error

  # 🔴 THE JOB WHOSE ABSENCE WAS THE REFUSAL. Measured 2026-08-20, before this
  # job existed: `GITHUB_ACTIONS=true GITHUB_REPOSITORY=... submit-snap.mjs
  # --submit --app subly --confirm SUBMIT-TO-SNAP-STORE` exited 1 with
  #     FAIL no job in .github/workflows/submit-snap.yml invokes
  #          `submit-snap.mjs --submit`.
  # The script requires this workflow to DECLARE the job that submits. So the
  # implementation at submit-snap.mjs:985 — a real `snapcraft upload
  # <snap> --release=<channel>` — was unreachable, and the header of this file
  # named a different reason for that. Both are corrected together.
  #
  # ⚠️ WHAT STOPS AN UPLOAD NOW, in order:
  #   1. `confirm` must be typed exactly. A dispatch without it runs the dry run.
  #   2. `environment: store-publish` — 1 required reviewer, MEASURED today
  #      via the environments API. (Its `can_admins_bypass` is true, which is why
  #      submit-play.mjs's PG-5 no longer claims an approval it cannot observe.)
  #   3. no SNAPCRAFT_STORE_CREDENTIALS secret exists, so the script fails naming
  #      the missing credential. THIS is the gate that holds today.
  #   4. OWNER_QUEUE A-6, the GLOBAL snap-name claim — irreversible, owner-only,
  #      and deliberately sequenced AFTER this job exists: claiming a global name
  #      for a lane that cannot submit spends a one-way act on nothing.
  #
  # It REBUILDS rather than downloading the dry run's artifact, for the reason
  # submit-play.yml's submit job records: a gate that graded a different artifact
  # from the one being uploaded is "green means ran" with extra steps. Snap
  # auto-updates SILENTLY, so the wrong revision does not fail cleanly — it
  # lands on machines.
  submit:
    name: Upload to the Snap Store (owner-approved)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [gate, dry-run]
    if: inputs.confirm == 'SUBMIT-TO-SNAP-STORE'
    environment: store-publish
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Linux build deps (the same list the Linux build lane installs)
        run: |
          set -euo pipefail
          deps="$(node tooling/release/generate-snapcraft.mjs --emit-build-deps)"
          echo "installing: ${deps}"
          sudo apt-get update
          sudo apt-get install -y ${deps}
      # apps/subly is a pub WORKSPACE member: resolution happens at the repo
      # root, not in the app directory.
      - name: Resolve the workspace
        run: flutter pub get --enforce-lockfile
      # ── [9]R-2 · THE RELEASE LINE, DERIVED, NEVER TYPED ─────────────────────
      # The same step build-platforms.yml and deploy-web.yml run, reading the same
      # pubspec with the same parser the guard uses. The recipe's `version` and the
      # binary's `--build-name` come from this one value: the Snap Store orders
      # revisions by the recipe's version, and a recipe versioned differently from
      # the binary it packages is two release lines wearing one name.
