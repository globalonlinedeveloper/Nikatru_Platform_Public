name: Main health status (posts CI's verdict)
# why: this run is green whenever POSTING worked, whatever CI said, so the title
# carries the verdict it acted on (assert-workflow-hardening.mjs limb 16). The triggering
# run's event is in the title too: a fork PR opened from the fork's own `main` also wakes
# this, and land-gate.mjs posts nothing for it, so a bare "success on <sha>" would claim a
# verdict that was never posted (#1168 review, minor 1). Expressions have no substring,
# hence the full sha.
run-name: "main health: ${{ github.event.workflow_run.conclusion }} on ${{ github.event.workflow_run.head_sha }} (${{ github.event.workflow_run.event }})"

# The rules, the landers that read this status and the owner proposal beside it
# are in docs/ci/main-healthy.md. Only `# why:` lines live here, and
# docs/ci/README.md carries the rules every workflow has to obey.

on:
  # zizmor: ignore[dangerous-triggers]
  # why: this is the ONE event that carries a finished CI run on main, so main's
  # health is published from the run itself and no laptop reads a run listing for
  # it (rv2-pipe-a P-1: a filtered listing served a page 9 days stale). It is safe
  # here: the one expression that reads the triggering event is `run-name:`'s
  # conclusion, head_sha and event (two GitHub enums and a 40-hex sha, display
  # only, never a shell), the checkout is the default branch, and the only code run is
  # tooling/ops/land-gate.mjs from it, which
  # reads the event from GITHUB_EVENT_PATH and posts nothing for a PR run or a
  # fork's `main`.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  # why: one run per CI run. The status is keyed by the run id in its target_url
  # and readers take the NEWEST run's, so two completions never race each other.
  group: main-healthy-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Post main's health on the commit CI ran on
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      # why: the `main-healthy` commit status on the commit CI ran on. Nothing
      # else is written.
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Post the main-healthy status for the CI run that completed
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tooling/ops/land-gate.mjs publish-main-health
