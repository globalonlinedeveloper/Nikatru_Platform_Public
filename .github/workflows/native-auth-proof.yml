name: Native auth proof

run-name: "Native auth proof — ${{ inputs.app }} by @${{ github.actor }}"

# ST-N1g (rows O-BOXA-CAPTCHA-REFUSES-NATIVE-SIGN-IN,
# O-NATIVE-AUTH-CALLBACK-UNBUILT). Each job signs the provisioned throwaway user
# in through the REAL form of a live native build on its own device, against
# PRODUCTION auth as e2e.yml does, and purges the user after. The driver is
# tooling/e2e/native_auth_proof.mjs; the suite is each app's
# integration_test/native_auth_proof_test.dart (the brick stamps it).
# tooling/channel-register.json flips a row's nativeAuth only on a green job
# that ran on that row's own artifact format, citing the run id.

on:
  # why: dispatch ONLY. It spends production auth calls and five runners
  # (an emulator, a simulator, macOS, Windows, Linux) to answer one question
  # per auth change: does each native target sign in without a captcha.
  workflow_dispatch:
    inputs:
      app:
        description: 'The app to prove: one id of the workspace app set (tooling/ci/assert-release-lane-generic.mjs --emit-apps). The gate job refuses any other value.'
        required: true
        type: string
      # why: the lead ruling on #1143 (2026-10-02): the core flow (and the tap
      # after it) went red on all five targets in 36987269922 and is PARKED:
      # `skip` prints that it was skipped and why (row
      # O-E2E-CORE-FLOW-LEGS-PENDING); `run` walks it — the proof of a fix.
      pending_flows:
        description: 'skip (default): the core flow is parked and said. run: walk it.'
        type: choice
        required: false
        default: skip
        options:
          - skip
          - run

concurrency:
  group: native-auth-proof-${{ inputs.app }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    name: The app input names one app of the workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # why: actions: read lists this workflow's own successful runs, to find the commit
    # of this app's last green proof (darwin-inputs.mjs --since-green).
    permissions:
      contents: read
      actions: read
    outputs:
      app: ${{ steps.app.outputs.app }}
      darwin: ${{ steps.darwin.outputs.darwin }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # why: the whole history, so the last green proof's commit can be diffed against this one.
          fetch-depth: 0
      - name: The app input names one app of the workspace
        id: app
        env:
          APP_INPUT: ${{ inputs.app }}
        run: |
          set -euo pipefail
          node tooling/ci/assert-release-lane-generic.mjs --emit-apps --app "$APP_INPUT"
          echo "app=${APP_INPUT}" >> "$GITHUB_OUTPUT"
      # why: the Darwin legs (ios, macos) bill macOS minutes at ×10 and were ~282 of
      # 2026-09's 873 (tooling/ci/assert-runner-budget.mjs MACOS_CEILING_EXCEPTIONS).
      # They run only when a Darwin input — judged by each changed file's kind and
      # text — changed since this app's last green proof; not knowing runs them.
      - name: Did a Darwin input change since this app's last green proof
        id: darwin
        env:
          APP_INPUT: ${{ inputs.app }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node tooling/ci/darwin-inputs.mjs --since-green native-auth-proof.yml --app "$APP_INPUT" > "$RUNNER_TEMP/darwin.txt"
          cat "$RUNNER_TEMP/darwin.txt"
          tail -n 1 "$RUNNER_TEMP/darwin.txt" >> "$GITHUB_OUTPUT"

  # ── ANDROID: an emulator, the app's APK, the callback through adb ──────────
  android:
    name: Android — emulator, form to Home, adb opens the callback
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    # why: the gate's checked output, never inputs.app.
    env:
      APP: ${{ needs.gate.outputs.app }}
      # why: EN-07 (train st-e2e-parity) — the proof OPENS THE APP: the device,
      # the build and the toolchain run on every target. Every target runs the
      # refusal probe first and then signs in with the harness token: the
      # phones' form route needs an attestation no CI device can produce (ADR
      # no.NNN), and the desktops' e-mail sign-in is the system-browser
      # hand-off, which no app screen opens until #1133's PR B lands.
      PROOF_NEEDS_DEVICE: 'true'
      # why: parked flows (the pending_flows input): the core flow and the tap.
      PENDING_FLOWS: ${{ inputs.pending_flows || 'skip' }}
      # why: ONE path per job — the proof step writes it, the purge step reads
      # it (the consent row's install id, or proof that none was written).
      # Relative to the checkout, where both steps run: `runner` is not
      # available to a job-level env (dispatch refused it with HTTP 422).
      E2E_PROOF_LOG: native-auth-proof.log
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-flutter
        if: env.PROOF_NEEDS_DEVICE == 'true'
      - name: flutter pub get
        if: env.PROOF_NEEDS_DEVICE == 'true'
        working-directory: apps/${{ needs.gate.outputs.app }}
        run: flutter pub get --enforce-lockfile
      - name: Resolve this app's databases from its Worker's wrangler file
        id: backend
        run: node tooling/e2e/backend.mjs --app "$APP" --emit-output
      - name: The app's API base, from the composer's rule
        run: node tooling/ci/flutter-release-build.mjs --emit-env API_BASE_URL "$APP" >> "$GITHUB_ENV"

      # why: the raw SDK tools, as symbolication-proof.yml boots its emulator:
      # the repository allows only `selected` actions and
      # reactivecircus/android-emulator-runner is not one. ANDROID_AVD_HOME is
      # pinned for both tools (run 35451496350). The emulator outlives this
      # step; the proof step below drives it.
      - name: Boot an emulator
        if: env.PROOF_NEEDS_DEVICE == 'true'
        env:
          API_LEVEL: '34'
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          # why: `trigger` only QUEUES the event. Run 36533541325 checked before
          # the rule applied, failed, then `ls` in the same branch printed
          # crw-rw-rw-. Settle the queue, then allow the mode a few seconds.
          sudo udevadm settle --timeout=30
          for _ in 1 2 3 4 5; do
            [ -r /dev/kvm ] && [ -w /dev/kvm ] && break
            sleep 2
          done
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            ls -l /dev/kvm || true
            echo "::error title=Emulator::/dev/kvm is not usable by this user; an x86_64 emulator without KVM does not boot inside the ceiling"
            exit 1
          fi
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export ANDROID_AVD_HOME="${RUNNER_TEMP}/avd"
          echo "ANDROID_AVD_HOME=${ANDROID_AVD_HOME}" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_AVD_HOME"
          emu_log="${RUNNER_TEMP}/emulator.log"
          image="system-images;android-${API_LEVEL};google_apis;x86_64"
          why() {
            echo "::error title=Emulator::$1"
            echo "── emulator.log (tail) ──"
            tail -n 60 "$emu_log" 2>/dev/null || echo "(no emulator.log)"
            exit 1
          }
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          timeout 600 "$sdk/cmdline-tools/latest/bin/sdkmanager" --install emulator platform-tools "$image" > /dev/null
          echo no | "$sdk/cmdline-tools/latest/bin/avdmanager" create avd --force -n proof -k "$image" --device pixel_6
          "$sdk/emulator/emulator" -list-avds | grep -qx proof || why "avdmanager created no AVD the emulator can see in ANDROID_AVD_HOME=${ANDROID_AVD_HOME}"
          nohup "$sdk/emulator/emulator" -avd proof -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -accel on > "$emu_log" 2>&1 &
          emu_pid=$!
          echo "$sdk/platform-tools" >> "$GITHUB_PATH"
          adb="$sdk/platform-tools/adb"
          "$adb" start-server
          deadline=$((SECONDS + 420))
          phase="waiting for the device to appear"
          while :; do
            kill -0 "$emu_pid" 2>/dev/null || why "the emulator process exited during: ${phase}"
            state="$("$adb" get-state 2>/dev/null | tr -d '\r' || true)"
            if [ "$state" = "device" ]; then
              phase="waiting for sys.boot_completed"
              [ "$("$adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)" = "1" ] && break
            fi
            [ "$SECONDS" -gt "$deadline" ] && why "not booted within 420 s (last phase: ${phase}; adb state: ${state:-none})"
            sleep 5
          done
          echo "emulator booted at ${SECONDS}s"

      - name: Provision throwaway confirmed user
        id: user
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node tooling/e2e/provision_user.mjs
      - name: The proof — sign in, the gated calls, sign out, the callback
        id: proof
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          E2E_EMAIL: ${{ steps.user.outputs.email }}
          E2E_PASSWORD: ${{ steps.user.outputs.password }}
          E2E_TOKEN_HASH: ${{ steps.user.outputs.token_hash }}
        run: |
          set -euo pipefail
          node tooling/e2e/native_auth_proof.mjs --app "$APP" --target android --log "$E2E_PROOF_LOG" --expect-refusal
          node tooling/e2e/native_auth_proof.mjs --app "$APP" --target android --device emulator-5554 --log "$E2E_PROOF_LOG" --callback --sign-in token --pending-flows "$PENDING_FLOWS" --notification-tap
      - name: Purge the throwaway user
        if: always() && steps.user.outcome != 'skipped'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          E2E_USER_ID: ${{ steps.user.outputs.user_id }}
          E2E_APP_ID: ${{ needs.gate.outputs.app }}
          PLATFORM_D1_DATABASE_ID: ${{ steps.backend.outputs.platform_db }}
          # why: a missing proof log is "no row" only when the proof never ran
          # (tooling/e2e/consent_anon_id.mjs, resolveProofLogConsent).
          E2E_PROOF_RAN: ${{ steps.proof.outcome != 'skipped' }}
        run: node tooling/e2e/purge.mjs

  # ── iOS: a simulator; the app opens its own callback (simctl openurl stops
  # at a system "Open in" sheet a runner cannot answer) ────────────────────
  ios:
    name: iOS — simulator, form to Home, the app opens its own callback
    needs: gate
    # why: a Darwin leg runs only when the gate saw a Darwin input change (or could not tell).
    if: needs.gate.outputs.darwin == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      APP: ${{ needs.gate.outputs.app }}
      # why: EN-07 (train st-e2e-parity) — the proof OPENS THE APP: the device,
      # the build and the toolchain run on every target. Every target runs the
      # refusal probe first and then signs in with the harness token: the
      # phones' form route needs an attestation no CI device can produce (ADR
      # no.NNN), and the desktops' e-mail sign-in is the system-browser
      # hand-off, which no app screen opens until #1133's PR B lands.
      PROOF_NEEDS_DEVICE: 'true'
      # why: parked flows (the pending_flows input): the core flow and the tap.
      PENDING_FLOWS: ${{ inputs.pending_flows || 'skip' }}
      # why: ONE path per job — the proof step writes it, the purge step reads
      # it (the consent row's install id, or proof that none was written).
      # Relative to the checkout, where both steps run: `runner` is not
      # available to a job-level env (dispatch refused it with HTTP 422).
      E2E_PROOF_LOG: native-auth-proof.log
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-flutter
        if: env.PROOF_NEEDS_DEVICE == 'true'
      - name: flutter pub get
        if: env.PROOF_NEEDS_DEVICE == 'true'
        working-directory: apps/${{ needs.gate.outputs.app }}
        run: flutter pub get --enforce-lockfile
      - name: Resolve this app's databases from its Worker's wrangler file
        id: backend
        run: node tooling/e2e/backend.mjs --app "$APP" --emit-output
      - name: The app's API base, from the composer's rule
        run: node tooling/ci/flutter-release-build.mjs --emit-env API_BASE_URL "$APP" >> "$GITHUB_ENV"
      # why: the first available iPhone of the image's iOS runtime; the proof
      # needs a phone, not a particular size class.
      - name: Boot an iPhone simulator
        if: env.PROOF_NEEDS_DEVICE == 'true'
        id: sim
        run: |
          set -euo pipefail
          udid="$(xcrun simctl list devices available -j | node -e 'const d = JSON.parse(require("fs").readFileSync(0, "utf8")).devices; for (const [rt, list] of Object.entries(d)) { if (!/iOS/.test(rt)) continue; const p = list.find((x) => /^iPhone/.test(x.name)); if (p) { console.log(p.udid); process.exit(0); } } process.exit(1);')"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "udid=${udid}" >> "$GITHUB_OUTPUT"
      - name: Provision throwaway confirmed user
        id: user
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node tooling/e2e/provision_user.mjs
      - name: The proof — sign in, the gated calls, sign out, the callback
        id: proof
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          E2E_EMAIL: ${{ steps.user.outputs.email }}
          E2E_PASSWORD: ${{ steps.user.outputs.password }}
          SIM: ${{ steps.sim.outputs.udid }}
          E2E_TOKEN_HASH: ${{ steps.user.outputs.token_hash }}
        run: |
          set -euo pipefail
          node tooling/e2e/native_auth_proof.mjs --app "$APP" --target ios --log "$E2E_PROOF_LOG" --expect-refusal
          node tooling/e2e/native_auth_proof.mjs --app "$APP" --target ios --device "$SIM" --log "$E2E_PROOF_LOG" --callback --sign-in token --pending-flows "$PENDING_FLOWS"
      # why: what the simulator showed 25 s after simctl openurl (the driver's
      # afterOpenDiagnostics). Run 36546306851's callback never reached the app
      # and the job log could not say whether iOS held it behind a prompt.
      - name: The simulator's screen after the callback was opened
        if: always() && steps.proof.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-auth-proof-ios-after-open
          path: ${{ runner.temp }}/nk-proof-ios-after-open.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Purge the throwaway user
        if: always() && steps.user.outcome != 'skipped'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          E2E_USER_ID: ${{ steps.user.outputs.user_id }}
          E2E_APP_ID: ${{ needs.gate.outputs.app }}
          PLATFORM_D1_DATABASE_ID: ${{ steps.backend.outputs.platform_db }}
          # why: a missing proof log is "no row" only when the proof never ran
          # (tooling/e2e/consent_anon_id.mjs, resolveProofLogConsent).
          E2E_PROOF_RAN: ${{ steps.proof.outcome != 'skipped' }}
        run: node tooling/e2e/purge.mjs

  # ── macOS: the .app, the callback through LaunchServices ───────────────────
  macos:
    name: macOS — the .app, form to Home, LaunchServices opens the callback
    needs: gate
    # why: a Darwin leg runs only when the gate saw a Darwin input change (or could not tell).
    if: needs.gate.outputs.darwin == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      APP: ${{ needs.gate.outputs.app }}
      # why: EN-07 (train st-e2e-parity) — the proof OPENS THE APP: the device,
      # the build and the toolchain run on every target. Every target runs the
      # refusal probe first and then signs in with the harness token: the
      # phones' form route needs an attestation no CI device can produce (ADR
      # no.NNN), and the desktops' e-mail sign-in is the system-browser
      # hand-off, which no app screen opens until #1133's PR B lands.
      PROOF_NEEDS_DEVICE: 'true'
      # why: parked flows (the pending_flows input): the core flow and the tap.
      PENDING_FLOWS: ${{ inputs.pending_flows || 'skip' }}
      # why: ONE path per job — the proof step writes it, the purge step reads
      # it (the consent row's install id, or proof that none was written).
      # Relative to the checkout, where both steps run: `runner` is not
      # available to a job-level env (dispatch refused it with HTTP 422).
      E2E_PROOF_LOG: native-auth-proof.log
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-flutter
        if: env.PROOF_NEEDS_DEVICE == 'true'
      - name: Enable the macOS desktop target
        if: env.PROOF_NEEDS_DEVICE == 'true'
        run: flutter config --enable-macos-desktop
      - name: flutter pub get
        if: env.PROOF_NEEDS_DEVICE == 'true'
        working-directory: apps/${{ needs.gate.outputs.app }}
        run: flutter pub get --enforce-lockfile
      - name: Resolve this app's databases from its Worker's wrangler file
        id: backend
        run: node tooling/e2e/backend.mjs --app "$APP" --emit-output
      - name: The app's API base, from the composer's rule
        run: node tooling/ci/flutter-release-build.mjs --emit-env API_BASE_URL "$APP" >> "$GITHUB_ENV"
      - name: Provision throwaway confirmed user
        id: user
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node tooling/e2e/provision_user.mjs
      - name: The proof — sign in, the gated calls, sign out, the callback
        id: proof
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          E2E_EMAIL: ${{ steps.user.outputs.email }}
          E2E_PASSWORD: ${{ steps.user.outputs.password }}
          E2E_TOKEN_HASH: ${{ steps.user.outputs.token_hash }}
        run: |
          set -euo pipefail
          node tooling/e2e/native_auth_proof.mjs --app "$APP" --target macos --log "$E2E_PROOF_LOG" --expect-refusal
          node tooling/e2e/native_auth_proof.mjs --app "$APP" --target macos --device macos --log "$E2E_PROOF_LOG" --callback --sign-in token --pending-flows "$PENDING_FLOWS"
      - name: Purge the throwaway user
        if: always() && steps.user.outcome != 'skipped'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          E2E_USER_ID: ${{ steps.user.outputs.user_id }}
          E2E_APP_ID: ${{ needs.gate.outputs.app }}
          PLATFORM_D1_DATABASE_ID: ${{ steps.backend.outputs.platform_db }}
          # why: a missing proof log is "no row" only when the proof never ran
          # (tooling/e2e/consent_anon_id.mjs, resolveProofLogConsent).
          E2E_PROOF_RAN: ${{ steps.proof.outcome != 'skipped' }}
        run: node tooling/e2e/purge.mjs

  # ── WINDOWS: sign-in only ──────────────────────────────────────────────────
  # why: protocol activation reaches a Windows app only through its installed
  # MSIX, and a runner build is not one. The job proves sign-in and the gated
  # calls; windows-store keeps nativeAuth false until the callback is proven on
  # a machine with the MSIX installed.
  windows:
    name: Windows — form to Home (callback needs the MSIX, proven off-runner)
    needs: gate
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      APP: ${{ needs.gate.outputs.app }}
      # why: EN-07 (train st-e2e-parity) — the proof OPENS THE APP: the device,
      # the build and the toolchain run on every target. Every target runs the
      # refusal probe first and then signs in with the harness token: the
      # phones' form route needs an attestation no CI device can produce (ADR
      # no.NNN), and the desktops' e-mail sign-in is the system-browser
      # hand-off, which no app screen opens until #1133's PR B lands.
      PROOF_NEEDS_DEVICE: 'true'
      # why: parked flows (the pending_flows input): the core flow and the tap.
      PENDING_FLOWS: ${{ inputs.pending_flows || 'skip' }}
      # why: ONE path per job — the proof step writes it, the purge step reads
      # it (the consent row's install id, or proof that none was written).
      # Relative to the checkout, where both steps run: `runner` is not
      # available to a job-level env (dispatch refused it with HTTP 422).
      E2E_PROOF_LOG: native-auth-proof.log
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-flutter
        if: env.PROOF_NEEDS_DEVICE == 'true'
      # why: sentry_flutter's CMake clones sentry-native with its submodules, and
      # crashpad's mini_chromium pack path is 262 characters under this repo's
      # checkout — git refuses it ("Filename too long") unless core.longpaths is
      # on, which killed run 36525783687's build before the app ever launched.
      # build-platforms.yml's "Git may write paths past MAX_PATH" measured it;
      # --global, because CMake's clone is a new repository. Read back so a
      # config that wrote nothing cannot pass.
      - name: Git may write paths past MAX_PATH
        if: env.PROOF_NEEDS_DEVICE == 'true'
        run: |
          git config --global core.longpaths true
          git config --global --get core.longpaths
      - name: Enable the Windows desktop target
        if: env.PROOF_NEEDS_DEVICE == 'true'
        run: flutter config --enable-windows-desktop
      - name: flutter pub get
        if: env.PROOF_NEEDS_DEVICE == 'true'
        working-directory: apps/${{ needs.gate.outputs.app }}
        run: flutter pub get --enforce-lockfile
      - name: Resolve this app's databases from its Worker's wrangler file
        id: backend
        run: node tooling/e2e/backend.mjs --app "$APP" --emit-output
      - name: The app's API base, from the composer's rule
        run: node tooling/ci/flutter-release-build.mjs --emit-env API_BASE_URL "$APP" >> "$GITHUB_ENV"
      - name: Provision throwaway confirmed user
        id: user
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node tooling/e2e/provision_user.mjs
      - name: The proof — sign in, the gated calls, sign out
        id: proof
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          E2E_EMAIL: ${{ steps.user.outputs.email }}
          E2E_PASSWORD: ${{ steps.user.outputs.password }}
          E2E_TOKEN_HASH: ${{ steps.user.outputs.token_hash }}
        run: |
          set -euo pipefail
          node tooling/e2e/native_auth_proof.mjs --app "$APP" --target windows --log "$E2E_PROOF_LOG" --expect-refusal
          node tooling/e2e/native_auth_proof.mjs --app "$APP" --target windows --device windows --log "$E2E_PROOF_LOG" --sign-in token --pending-flows "$PENDING_FLOWS"
      - name: Purge the throwaway user
        if: always() && steps.user.outcome != 'skipped'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          E2E_USER_ID: ${{ steps.user.outputs.user_id }}
          E2E_APP_ID: ${{ needs.gate.outputs.app }}
          PLATFORM_D1_DATABASE_ID: ${{ steps.backend.outputs.platform_db }}
          # why: a missing proof log is "no row" only when the proof never ran
          # (tooling/e2e/consent_anon_id.mjs, resolveProofLogConsent).
          E2E_PROOF_RAN: ${{ steps.proof.outcome != 'skipped' }}
        run: node tooling/e2e/purge.mjs

  # ── LINUX: the bundle under xvfb, the callback through xdg-open ────────────
  linux:
    name: Linux — the bundle under xvfb, form to Home, xdg-open opens the callback
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      APP: ${{ needs.gate.outputs.app }}
      # why: EN-07 (train st-e2e-parity) — the proof OPENS THE APP: the device,
      # the build and the toolchain run on every target. Every target runs the
      # refusal probe first and then signs in with the harness token: the
      # phones' form route needs an attestation no CI device can produce (ADR
      # no.NNN), and the desktops' e-mail sign-in is the system-browser
      # hand-off, which no app screen opens until #1133's PR B lands.
      PROOF_NEEDS_DEVICE: 'true'
      # why: parked flows (the pending_flows input): the core flow and the tap.
      PENDING_FLOWS: ${{ inputs.pending_flows || 'skip' }}
      # why: ONE path per job — the proof step writes it, the purge step reads
      # it (the consent row's install id, or proof that none was written).
      # Relative to the checkout, where both steps run: `runner` is not
      # available to a job-level env (dispatch refused it with HTTP 422).
      E2E_PROOF_LOG: native-auth-proof.log
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-flutter
        if: env.PROOF_NEEDS_DEVICE == 'true'
      # why: build-platforms.yml's Linux list, plus xvfb (a display), and the
      # three a signed-in desktop session needs: gnome-keyring (the Secret
      # Service libsecret stores the session in), desktop-file-utils and
      # xdg-utils (the scheme handler and the open).
      - name: Linux build and session deps
        if: env.PROOF_NEEDS_DEVICE == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libsecret-1-dev libjsoncpp-dev libcurl4-openssl-dev \
            xvfb gnome-keyring dbus-x11 desktop-file-utils xdg-utils
      - name: Enable the Linux desktop target
        if: env.PROOF_NEEDS_DEVICE == 'true'
        run: flutter config --enable-linux-desktop
      - name: flutter pub get
        if: env.PROOF_NEEDS_DEVICE == 'true'
        working-directory: apps/${{ needs.gate.outputs.app }}
        run: flutter pub get --enforce-lockfile
      - name: Resolve this app's databases from its Worker's wrangler file
        id: backend
        run: node tooling/e2e/backend.mjs --app "$APP" --emit-output
      - name: The app's API base, from the composer's rule
        run: node tooling/ci/flutter-release-build.mjs --emit-env API_BASE_URL "$APP" >> "$GITHUB_ENV"
      - name: Provision throwaway confirmed user
        id: user
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node tooling/e2e/provision_user.mjs
      # why: ONE D-Bus session for the keyring, the app and xdg-open, so the
      # second instance xdg-open starts finds the first (GApplication
      # uniqueness rides the session bus) and hands it the URL.
      - name: The proof — sign in, the gated calls, sign out, the callback
        id: proof
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          E2E_EMAIL: ${{ steps.user.outputs.email }}
          E2E_PASSWORD: ${{ steps.user.outputs.password }}
          E2E_TOKEN_HASH: ${{ steps.user.outputs.token_hash }}
        run: |
          set -euo pipefail
          # why: the probe is HTTP only — no display, no keyring — so it runs first, outside the session.
          node tooling/e2e/native_auth_proof.mjs --app "$APP" --target linux --log "$E2E_PROOF_LOG" --expect-refusal
          dbus-run-session -- bash -c '
            set -euo pipefail
            eval "$(printf "" | gnome-keyring-daemon --unlock --components=secrets)"
            export GNOME_KEYRING_CONTROL
            xvfb-run -a -s "-screen 0 1920x1200x24" \
              node tooling/e2e/native_auth_proof.mjs --app "$APP" --target linux --device linux --log "$E2E_PROOF_LOG" --callback --sign-in token --pending-flows "$PENDING_FLOWS"
          '
      - name: Purge the throwaway user
        if: always() && steps.user.outcome != 'skipped'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          E2E_USER_ID: ${{ steps.user.outputs.user_id }}
          E2E_APP_ID: ${{ needs.gate.outputs.app }}
          PLATFORM_D1_DATABASE_ID: ${{ steps.backend.outputs.platform_db }}
          # why: a missing proof log is "no row" only when the proof never ran
          # (tooling/e2e/consent_anon_id.mjs, resolveProofLogConsent).
          E2E_PROOF_RAN: ${{ steps.proof.outcome != 'skipped' }}
        run: node tooling/e2e/purge.mjs
