name: Store screenshots

run-name: "Store screenshots by @${{ github.actor }}"

# The measurements, retractions and traps behind this file are in
# docs/ci/store-screenshots.md. Only `# why:` lines live here, and
# docs/ci/README.md carries the rules every workflow has to obey.

# why: ONE INPUT, NOT ONE WORKFLOW PER STORE. Five listings need the same
# capture pointed at a different register row; five copies of this file is how
# four of them stop getting the next fix. The default is android-play, so a
# dispatch with no input does exactly what this workflow did before the input
# existed. The jobs gate on it rather than sharing a matrix: the Play job drives
# a BROWSER on a web build and the Linux job drives the REAL binary, and the
# steps that differ (chromedriver, the captcha variable, the GTK toolchain, the
# X server) are most of the job.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Which store listing to capture"
        required: false
        default: android-play
        type: choice
        options:
          - android-play
          - linux-snap
          - windows-store
          - macos-appstore
          - ios-appstore

permissions:
  contents: read

jobs:
  capture:
    name: Capture the Play phone and tablet screenshot sets (live)
    if: ${{ inputs.channel == '' || inputs.channel == 'android-play' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # why: FAILS CLOSED on a missing secret rather than skipping. Without all four the
      # app builds in DEMO posture -- every screen carries a "Demo data" banner and the
      # board is twelve third-party trademarks, which is a store filing nobody can ship.
      - name: Preflight — every secret the live capture needs must be present
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          missing=""
          for k in SUPABASE_URL SUPABASE_ANON_KEY API_BASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            eval "v=\$$k"
            [ -z "$v" ] && missing="$missing $k"
          done
          if [ -n "$missing" ]; then
            echo "::error title=Capture cannot run::Missing secret(s):$missing. Without them the app builds in DEMO posture, whose every screen carries a 'Demo data' banner and whose board is twelve third-party trademarks. This is a failed run, not a skipped one."
            exit 1
          fi
          echo "All four secrets present — the build will be LIVE."

      # why: a VARIABLE, not a secret — a Turnstile site key is public, it ships
      # inside the web bundle. Checked in its own step because `vars` and
      # `secrets` fail differently and a joint message would name the wrong one.
      # Run 35488534460 raised `Bad state: TURNSTILE_SITE_KEY is empty in a WEB
      # build with a live backend` (ADR 084) as one of its two exceptions.
      - name: Preflight — the captcha site key the live build needs
        env:
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
        run: |
          if [ -z "$TURNSTILE_SITE_KEY" ]; then
            echo "::error title=Capture cannot run::the repository VARIABLE TURNSTILE_SITE_KEY is unset, so --dart-define=TURNSTILE_SITE_KEY would arrive empty, TurnstileGate.posture would be \`misconfigured\`, and this capture would photograph an app driven through an auth posture the shipping web build does not have. e2e.yml fails closed on the same variable for the same reason. OWNER STEP: Settings → Secrets and variables → Actions → Variables → New repository variable, name TURNSTILE_SITE_KEY, value = the PUBLIC Turnstile sitekey from runbooks/auth-cutover.md section 4 row 5 (a sitekey is public: it ships inside the web bundle; the secret half never leaves the auth box)."
            exit 1
          fi
          echo "TURNSTILE_SITE_KEY is set — the gated screens will render a real widget, as they do in production."

      - uses: ./.github/actions/setup-node

      - uses: ./.github/actions/setup-flutter

      - name: Set up ChromeDriver
        uses: nanasess/setup-chromedriver@e913548694400f275b4070efcd90f47dbbc8914c # v3.0.0

      - name: flutter pub get
        working-directory: apps/subscriptiontracker
        run: flutter pub get --enforce-lockfile

      - name: Provision throwaway confirmed user
        id: user
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node tooling/e2e/provision_user.mjs

      - name: Capture the set
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          # why: same variable deploy-web.yml ships and e2e.yml drives with. The
          # runner refuses a live capture without it; see its `pass()` block.
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          E2E_EMAIL: ${{ steps.user.outputs.email }}
          E2E_PASSWORD: ${{ steps.user.outputs.password }}
          # why: the runner records each drive's consent answer and install id here;
          # the purge step below reads the same path (tooling/e2e/purge.mjs).
          E2E_CONSENT_LEDGER: ${{ runner.temp }}/store-capture-consent.json
        run: |
          set -euo pipefail
          export CHROME_EXECUTABLE="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser)"
          echo "Chrome: $CHROME_EXECUTABLE"
          node tooling/store/capture-play-screenshots.mjs --app subscriptiontracker

      # 🔴 --single-threaded, like the other six steps that start a relaunching
      # guard (#648: ci.yml ×3, build-platforms.yml, submit-play.yml ×2). The
      # guard relaunches ITSELF with the flag, and the relaunching PARENT is not
      # immune to the exit hang (nodejs/node#54918): measured under
      # --stress-concurrent-allocation it hung 4 of 12 elf runs and 4 of 12 stamp
      # runs AFTER the child had printed its whole verdict. With the flag on the
      # command line there is no parent to hang. This step was the last one left,
      # carried as the one declared gap in test/single-threaded-relaunch.test.mjs
      # because the file belonged to another wave on 2026-09-11; that entry goes
      # in the same commit, because a ratchet that outlives its gap is a lie.
      - name: The captured set satisfies the listing-asset guard
        id: listing
        run: node --single-threaded tooling/ci/assert-listing-assets.mjs

      # why: A FAILED RUN THREW ITS PIXELS AWAY, TWICE. Runs 35483690951 and
      # 35488534460 both captured all four phone frames, failed afterwards on an
      # exception, and uploaded nothing — the upload below only runs on success,
      # so `gh api .../artifacts` returns an empty list for both and the frames
      # exist nowhere. The question "did the categories actually land?" was then
      # unanswerable from anything but PNG byte counts in a log.
      #
      # 🔴 A DELIBERATELY DIFFERENT ARTIFACT NAME, AND `if: failure()` NOT
      # `always()`. These bytes did NOT pass the listing-asset guard and must
      # never be mistaken for the set: the name says so, and the success upload
      # below keeps its own name so nothing downstream that looks for
      # `play-screenshots-subscriptiontracker` can ever receive these.
      # if-no-files-found: ignore, because a run that failed BEFORE the drive
      # (a missing secret, no chromedriver) has no frames and must still report
      # its real failure rather than a second one about an empty upload.
      - name: Keep the frames of a FAILED run, for diagnosis only
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FAILED-not-a-listing-set-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            apps/subscriptiontracker/store/android-play/screenshots/
            apps/subscriptiontracker/store/android-play/screenshots-tablet/

      # why: a guard failure names the class and its run median; diagnosing it
      # needs every frame's reading and the class's calibration medians, floor
      # and headroom, from the same instrument on the same bytes
      # (measure-frame-ink.mjs header). Printing that reading here shows from the
      # run's own log whether the screens lost their text or the calibration no
      # longer separates, with no artifact download. Nothing is pasted back: the
      # floor is computed from the committed calibration set on every run.
      # Run 35819066562 (2026-09-23) is why this step exists: #890 dropped the
      # bars on uncapped budget rows, tablet 04-budget fell under its per-frame
      # floor, and the log said so for one frame only. Gated on the listing
      # guard's own outcome, so a run that died before capturing prints nothing
      # misleading.
      - name: Print the ink reading of a FAILED run, for diagnosis only
        if: failure() && steps.listing.outcome == 'failure'
        run: node --single-threaded tooling/store/measure-frame-ink.mjs apps/subscriptiontracker/store/android-play/screenshots apps/subscriptiontracker/store/android-play/screenshots-tablet

      - name: Upload the screenshot set
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: play-screenshots-subscriptiontracker
          path: |
            apps/subscriptiontracker/store/android-play/screenshots/
            apps/subscriptiontracker/store/android-play/screenshots-tablet/
          if-no-files-found: error

      # why: PROPOSED, never pushed. Screenshots are a sworn store filing; a machine may
      # capture them and must not commit them to a protected branch unreviewed. If
      # gh pr create is refused the branch is still pushed and the pixels are still
      # uploaded as an artifact -- docs/ci/store-screenshots.md carries that path.
      - name: Propose the set for human review (pull request)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Both sets, for the same reason as the upload above: the capture
          # produces two device types and a PR proposing one is a PR that leaves
          # the listing one type short — which is exactly the state
          # assert-play-device-coverage.mjs fails the submission lane for.
          SHOTS="apps/subscriptiontracker/store/android-play/screenshots apps/subscriptiontracker/store/android-play/screenshots-tablet"
          BRANCH="chore/play-screenshots-${{ github.run_id }}"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # -f: the listing directory is not gitignored, but being explicit means
          # a future ignore rule cannot silently drop the payload of this PR.
          git add -f $SHOTS
          if git diff --cached --quiet; then
            echo "::notice title=Nothing to propose::The captured set is byte-identical to what is already committed. The listing already carries this exact capture; no pull request is needed."
            exit 0
          fi

          git checkout -b "$BRANCH"
          git commit -F - <<'MSG'
          chore(play): the captured screenshot set, for review

          Captured live by .github/workflows/store-screenshots.yml against a
          build with the real backend defines, so no "Demo data" banner and none
          of the twelve third-party trademarks the demo seed carries.

          CAPTURE.json records the posture; tooling/ci/assert-listing-assets.mjs
          proves size, count, aspect, format and the ABSENCE OF THE DEMO BANNER
          in pixels, and refuses a set whose provenance nobody wrote down.

          What it cannot prove is whether these are the screens worth showing.
          That is the reason this arrives as a pull request: look at the images
          in the diff before merging.
          MSG

          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"

          # ── 🔴 `gh pr create` CAN BE REFUSED, AND A REFUSAL IS NOT A LISTING ─
          # "Allow GitHub Actions to create and approve pull requests"
          # (repository Settings → Actions → General) gates every `gh pr create`
          # run by GITHUB_TOKEN. Measured OFF on 2026-08-26
          # (`can_approve_pull_request_reviews: false`), and this call site had
          # never executed: the one green run (30922349590, 2026-08-04) predates
          # this step, and the two runs since both failed in `Capture the set`
          # and skipped it. This job is the ONLY producer of the Play tablet
          # set, so a silent refusal here is a submission that stays blocked
          # with a green tick over it.
          set +e
          gh pr create \
            --base "${GITHUB_REF_NAME}" \
            --head "$BRANCH" \
            --title "chore(play): the captured screenshot set, for review" \
            --body "Captured by run \`${{ github.run_id }}\`. **Look at the images in the Files changed tab** — the guard proves size, count, format, aspect and that no demo banner is present in the pixels; it cannot judge whether these are the screens worth showing, and Google requires screenshots to demonstrate the actual in-app experience. Merging is the human decision this PR exists to ask for."$'\n\nRows: none — automated store screenshot capture, reviewed by eye' > "${RUNNER_TEMP}/gh-pr-create.log" 2>&1
          PR_RC=$?
          set -e
          cat "${RUNNER_TEMP}/gh-pr-create.log"

          if [ "$PR_RC" -ne 0 ]; then
            if grep -qiF 'not permitted to create or approve pull requests' "${RUNNER_TEMP}/gh-pr-create.log"; then
              CAUSE='the repository setting "Allow GitHub Actions to create and approve pull requests" is OFF.'
              REMEDY='REMEDY (owner work — no workflow can set this for itself): Settings → Actions → General → Workflow permissions → tick "Allow GitHub Actions to create and approve pull requests". API equivalent: gh api -X PUT "repos/'"${GITHUB_REPOSITORY}"'/actions/permissions/workflow" -F can_approve_pull_request_reviews=true'
            else
              CAUSE="gh pr create exited ${PR_RC} for a reason this step does not recognise."
              REMEDY='REMEDY: read the gh output above.'
            fi

            echo "::error title=The screenshot set was captured but the pull request could not be opened::${CAUSE} THE CAPTURE IS NOT LOST — branch ${BRANCH} is pushed and the same pixels are already uploaded as this run's play-screenshots-subscriptiontracker artifact; open the pull request by hand from ${BRANCH} into ${GITHUB_REF_NAME}. ${REMEDY}"
            exit 1
          fi

      # why: always(), because this lane provisions a real confirmed user in PRODUCTION
      # Supabase. A failed run that skipped its own cleanup leaves that account behind.
      - name: Purge the throwaway user
        if: always()
        env:
          E2E_USER_ID: ${{ steps.user.outputs.user_id }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SUBSCRIPTIONTRACKER_D1_DATABASE_ID: 0a36d6a0-c909-40aa-853e-970de3482321
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # why: this capture's consent rows in platform_db. purge.mjs deletes by the
          # install ids in the runner's ledger and by its cap-* APP_VERSION stamp.
          E2E_APP_ID: subscriptiontracker
          E2E_CONSENT_LEDGER: ${{ runner.temp }}/store-capture-consent.json
          PLATFORM_D1_DATABASE_ID: 9d1c5c63-97fe-4f82-bc7d-f3fd22e9b351
        run: node tooling/e2e/purge.mjs

  # ── THE SNAP STORE SET ──────────────────────────────────────────────────────
  # why: THE REAL BINARY, NOT A BROWSER. The Play set is photographed through
  # Chrome because this repository cannot run Android; Linux it CAN run, on the
  # same runner that already builds the Snap. A browser-captured frame of a
  # desktop app would be a screenshot of a different product — different window
  # chrome, different text rendering, different scrollbars — and the Snap Store
  # listing is a sworn filing about the thing the customer installs.
  capture-linux:
    name: Capture the Snap Store desktop screenshot set (live)
    if: ${{ inputs.channel == 'linux-snap' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # why: the same four, failing closed for the same reason as the Play job —
      # without them the app builds in DEMO posture and the frames are a "Demo
      # data" banner over twelve third-party trademarks. TURNSTILE_SITE_KEY is
      # deliberately NOT here: TurnstileGate renders in the WEB build, and this
      # job drives the Linux binary, which signs in without it. Requiring it
      # would refuse a run over a gate this build does not have.
      - name: Preflight — every secret the live capture needs must be present
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          missing=""
          for k in SUPABASE_URL SUPABASE_ANON_KEY API_BASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            eval "v=\$$k"
            [ -z "$v" ] && missing="$missing $k"
          done
          if [ -n "$missing" ]; then
            echo "::error title=Capture cannot run::Missing secret(s):$missing. Without them the app builds in DEMO posture, whose every screen carries a 'Demo data' banner and whose board is twelve third-party trademarks. This is a failed run, not a skipped one."
            exit 1
          fi
          echo "All four secrets present — the build will be LIVE."

      - uses: ./.github/actions/setup-node

      - uses: ./.github/actions/setup-flutter

      # why: byte-for-byte the list build-platforms.yml installs for its Linux
      # build. A capture that builds with a DIFFERENT toolchain than the one
      # that produces the Snap is photographing a different binary. `xvfb` is
      # this job's only addition, and it is below with its geometry.
      - name: Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libsecret-1-dev libjsoncpp-dev libcurl4-openssl-dev \
            xvfb

      - name: Enable the Linux desktop target
        run: flutter config --enable-linux-desktop

      - name: flutter pub get
        working-directory: apps/subscriptiontracker
        run: flutter pub get --enforce-lockfile

      # 🔴 ONE SOURCE FOR THE DIRECTORY, AND A REFUSAL IF THE REGISTER GROWS A
      # SECOND SET. Every path below is derived here rather than typed, because
      # a directory typed into a workflow and declared in the register is two
      # facts that drift. The refusal is the interesting half: the upload and
      # the `git add` below are written for ONE directory, so the day a second
      # device type is declared for this channel, this step says so instead of
      # quietly proposing a pull request that is one set short.
      - name: Where the register says this channel's frames go
        id: reg
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const r = JSON.parse(fs.readFileSync("tooling/channel-register.json", "utf8"));
            const s = r.storeMetadataContract.perChannel["linux-snap"].graphicAssets.screenshots;
            const dirs = [...new Set(Object.values(s.deviceTypeCoverage.sets).map((v) => v.dir))];
            if (dirs.length !== 1) {
              console.error("::error title=This job captures one directory::the register declares " + dirs.length + " distinct set director(ies) for linux-snap (" + dirs.join(", ") + "). The upload and the pull request below are written for one. Extend them in the same change that declares the second set.");
              process.exit(1);
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "dir=apps/subscriptiontracker/store/linux-snap/" + dirs[0] + "\n");
          '

      - name: Provision throwaway confirmed user
        id: user
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node tooling/e2e/provision_user.mjs

      # 🔴 THE X SCREEN IS THE DIMENSION LEVER ON LINUX, and it is not the same
      # lever as the web job's. `--browser-dimension` does not exist for
      # `-d linux`: the frame is whatever the WINDOW is, so the size has to come
      # from the display the window opens on. 1280x800 LOGICAL at GDK_SCALE=2 is
      # 2560x1600 PHYSICAL, which is the size the register's `acceptedSizes`
      # names — so the X screen must be at least that, and a smaller one silently
      # produces a smaller frame. That is why the screen below is 2560x1600 and
      # not the 1920x1080 an earlier draft of this lane proposed: 1920x1080
      # cannot hold the frame, the run would capture at the smaller size, and
      # the guard would refuse it — a loud failure, but one CI run late.
      - name: Capture the set
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          E2E_EMAIL: ${{ steps.user.outputs.email }}
          E2E_PASSWORD: ${{ steps.user.outputs.password }}
          # why: the runner records each drive's consent answer and install id here;
          # the purge step below reads the same path (tooling/e2e/purge.mjs).
          E2E_CONSENT_LEDGER: ${{ runner.temp }}/store-capture-consent.json
          GDK_SCALE: '2'
          GDK_DPI_SCALE: '1'
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 2560x1600x24" \
            node tooling/store/capture-play-screenshots.mjs --app subscriptiontracker --channel linux-snap

      - name: The captured set satisfies the listing-asset guard
        id: listing
        run: node --single-threaded tooling/ci/assert-listing-assets.mjs

      - name: The captured set satisfies the device-coverage guard
        run: node --single-threaded tooling/ci/assert-play-device-coverage.mjs

      # why: the same retraction the Play job carries — two runs captured every
      # frame, failed afterwards, uploaded nothing, and the pixels existed
      # nowhere. A different artifact name and `if: failure()`, so bytes that did
      # NOT pass the guard can never be mistaken for the set.
      - name: Keep the frames of a FAILED run, for diagnosis only
        if: failure() && steps.reg.outputs.dir != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FAILED-not-a-listing-set-${{ github.run_id }}
          if-no-files-found: ignore
          path: ${{ steps.reg.outputs.dir }}/

      # why: the Play job's reason — the ink reading of every frame, from
      # the run's own log. Through env, never `${{ }}` inside `run:`.
      - name: Print the ink reading of a FAILED run, for diagnosis only
        if: failure() && steps.listing.outcome == 'failure'
        env:
          FRAMES_DIR: ${{ steps.reg.outputs.dir }}
        run: node --single-threaded tooling/store/measure-frame-ink.mjs "$FRAMES_DIR"

      - name: Upload the screenshot set
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: snap-screenshots-subscriptiontracker
          path: ${{ steps.reg.outputs.dir }}/
          if-no-files-found: error

      # why: PROPOSED, never pushed — the Play job's reason, unchanged. A store
      # listing is a sworn filing; a machine may capture it and must not commit
      # it to a protected branch unreviewed.
      - name: Propose the set for human review (pull request)
        env:
          GH_TOKEN: ${{ github.token }}
          SHOTS: ${{ steps.reg.outputs.dir }}
        run: |
          set -euo pipefail
          BRANCH="chore/linux-snap-screenshots-${{ github.run_id }}"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f "$SHOTS"
          if git diff --cached --quiet; then
            echo "::notice title=Nothing to propose::The captured set is byte-identical to what is already committed. The listing already carries this exact capture; no pull request is needed."
            exit 0
          fi

          git checkout -b "$BRANCH"
          git commit -F - <<'MSG'
          chore(snap): the captured screenshot set, for review

          Captured live by .github/workflows/store-screenshots.yml against the
          REAL Linux binary with the real backend defines — no "Demo data"
          banner and none of the twelve third-party trademarks the demo seed
          carries.

          CAPTURE.json records the posture; tooling/ci/assert-listing-assets.mjs
          proves size, count, aspect, format and the ABSENCE OF THE DEMO BANNER
          in pixels, and refuses a set whose provenance nobody wrote down.

          What it cannot prove is whether these are the screens worth showing.
          That is the reason this arrives as a pull request: look at the images
          in the diff before merging.
          MSG

          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"

          # The same refusal path the Play job documents: "Allow GitHub Actions
          # to create and approve pull requests" gates every `gh pr create` run
          # by GITHUB_TOKEN, and was measured OFF on 2026-08-26. A silent refusal
          # here is a submission that stays blocked with a green tick over it.
          set +e
          gh pr create \
            --base "${GITHUB_REF_NAME}" \
            --head "$BRANCH" \
            --title "chore(snap): the captured screenshot set, for review" \
            --body "Captured by run \`${{ github.run_id }}\` from the real Linux binary. **Look at the images in the Files changed tab** — the guard proves size, count, format, aspect and that no demo banner is present in the pixels; it cannot judge whether these are the screens worth showing. Merging is the human decision this PR exists to ask for."$'\n\nRows: none — automated store screenshot capture, reviewed by eye' > "${RUNNER_TEMP}/gh-pr-create.log" 2>&1
          PR_RC=$?
          set -e
          cat "${RUNNER_TEMP}/gh-pr-create.log"

          if [ "$PR_RC" -ne 0 ]; then
            if grep -qiF 'not permitted to create or approve pull requests' "${RUNNER_TEMP}/gh-pr-create.log"; then
              CAUSE='the repository setting "Allow GitHub Actions to create and approve pull requests" is OFF.'
              REMEDY='REMEDY (owner work — no workflow can set this for itself): Settings → Actions → General → Workflow permissions → tick "Allow GitHub Actions to create and approve pull requests".'
            else
              CAUSE="gh pr create exited ${PR_RC} for a reason this step does not recognise."
              REMEDY='REMEDY: read the gh output above.'
            fi
            echo "::error title=The screenshot set was captured but the pull request could not be opened::${CAUSE} THE CAPTURE IS NOT LOST — branch ${BRANCH} is pushed and the same pixels are already uploaded as this run's snap-screenshots-subscriptiontracker artifact; open the pull request by hand from ${BRANCH} into ${GITHUB_REF_NAME}. ${REMEDY}"
            exit 1
          fi

      - name: Purge the throwaway user
        if: always()
        env:
          E2E_USER_ID: ${{ steps.user.outputs.user_id }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SUBSCRIPTIONTRACKER_D1_DATABASE_ID: 0a36d6a0-c909-40aa-853e-970de3482321
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # why: this capture's consent rows in platform_db. purge.mjs deletes by the
          # install ids in the runner's ledger and by its cap-* APP_VERSION stamp.
          E2E_APP_ID: subscriptiontracker
          E2E_CONSENT_LEDGER: ${{ runner.temp }}/store-capture-consent.json
          PLATFORM_D1_DATABASE_ID: 9d1c5c63-97fe-4f82-bc7d-f3fd22e9b351
        run: node tooling/e2e/purge.mjs

  # 🔴 ONE JOB FOR BOTH NATIVE DESKTOP STORES, not two copies of the Linux job.
  # Windows and macOS differ from Linux here only in the runner label and the
  # device name; neither needs apt and neither needs an X server. Copying the
  # job would copy the preflight, the provision, the guards, the artifact and
  # the pull-request refusal path three times over, and the third copy is where
  # a fix stops being applied. `runs-on` is the one value that cannot be read
  # from the register — GitHub resolves it before any step runs — so it is
  # written here as an expression AND checked against the register below, which
  # is the only way the two can be kept from drifting silently.
  capture-desktop-native:
    name: Capture the native desktop screenshot set (live)
    if: ${{ inputs.channel == 'windows-store' || inputs.channel == 'macos-appstore' }}
    runs-on: ${{ inputs.channel == 'windows-store' && 'windows-2025' || 'macos-26' }}
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        shell: bash
    # why: NEVER `CHANNEL`. subosito/flutter-action's setup.sh (pinned 1a449444,
    # line 122) reads `if [ -z "${CHANNEL:-}" ]` before its own `stable`
    # argument, so a job-level CHANNEL is inherited by setup-flutter and
    # outranks it. Run 35818957977 (2026-09-23) died on exactly that: "Unable to
    # determine Flutter version for channel: windows-store". The guard is
    # tooling/ci/test/setup-flutter-env.test.mjs.
    env:
      STORE_CHANNEL: ${{ inputs.channel }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # why: the same four secrets and the same closed failure as the other two
      # jobs — without them the app builds in DEMO posture and every frame is a
      # "Demo data" banner over twelve third-party trademarks. TURNSTILE_SITE_KEY
      # is deliberately absent for the same reason the Linux job gives: the gate
      # renders in the WEB build, and this job drives a native binary.
      - name: Preflight — every secret the live capture needs must be present
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          missing=""
          for k in SUPABASE_URL SUPABASE_ANON_KEY API_BASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            eval "v=\$$k"
            [ -z "$v" ] && missing="$missing $k"
          done
          if [ -n "$missing" ]; then
            echo "::error title=Capture cannot run::Missing secret(s):$missing. Without them the app builds in DEMO posture, whose every screen carries a 'Demo data' banner and whose board is twelve third-party trademarks. This is a failed run, not a skipped one."
            exit 1
          fi
          echo "All four secrets present — the build will be LIVE."

      - uses: ./.github/actions/setup-node

      - uses: ./.github/actions/setup-flutter

      # 🔴 THE REGISTER SAYS WHERE, WITH WHAT, AND HOW BIG — and this step
      # refuses the three ways that can drift from the workflow. (1) more than
      # one declared set, because the upload and the `git add` below are written
      # for one directory; (2) a `capture.runner` that is not the label this job
      # actually runs on, which is the drift the `runs-on` expression above
      # cannot prevent by itself; (3) no `capture` limb, or more than one. The
      # frame SIZE is not this step's business: a hosted Windows or macOS
      # desktop is whatever size the image ships, so the runner passes the
      # register geometry to the suite as STORE_CAPTURE_VIEW, the suite imposes
      # it, and the layer shutter refuses a root layer of any other size.
      - name: What the register says this channel captures
        id: reg
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const channel = process.env.STORE_CHANNEL;
            const r = JSON.parse(fs.readFileSync("tooling/channel-register.json", "utf8"));
            const s = r.storeMetadataContract.perChannel[channel].graphicAssets.screenshots;
            const sets = Object.entries(s.deviceTypeCoverage.sets);
            const dirs = [...new Set(sets.map(([, v]) => v.dir))];
            if (dirs.length !== 1) {
              console.error("::error title=This job captures one directory::the register declares " + dirs.length + " distinct set director(ies) for " + channel + " (" + dirs.join(", ") + "). The upload and the pull request below are written for one. Extend them in the same change that declares the second set.");
              process.exit(1);
            }
            const caps = sets.map(([, v]) => v.capture).filter(Boolean);
            if (caps.length !== 1) {
              console.error("::error title=No capture geometry::the register declares " + caps.length + " `capture` limb(s) for " + channel + ". tooling/store/capture-play-screenshots.mjs reads its viewport from that limb, and with none it has nothing to open a window at.");
              process.exit(1);
            }
            const c = caps[0];
            const want = String(c.runner || "");
            const got = String(process.env.RUNNER_LABEL || "");
            if (want !== got) {
              console.error("::error title=The runner and the register disagree::the register names `" + want + "` for " + channel + " and this job is running on `" + got + "`. `runs-on` cannot be read from a file — GitHub resolves it before any step runs — so the expression at the top of this job and the register have to be changed together. One of the two is now wrong.");
              process.exit(1);
            }
            const out = [
              "dir=apps/subscriptiontracker/store/" + channel + "/" + dirs[0],
              "device=" + c.flutterDevice,
            ];
            fs.appendFileSync(process.env.GITHUB_OUTPUT, out.join("\n") + "\n");
            console.log(out.join("\n"));
          '
        env:
          RUNNER_LABEL: ${{ inputs.channel == 'windows-store' && 'windows-2025' || 'macos-26' }}

      # why: the desktop target is off by default in this repository's Flutter
      # config, and the device name IS the target name — `windows`, `macos` —
      # so the register's `flutterDevice` drives both, and a third desktop
      # target needs no edit here.
      - name: Enable the desktop target the register names
        run: flutter config --enable-${{ steps.reg.outputs.device }}-desktop

      - name: flutter pub get
        working-directory: apps/subscriptiontracker
        run: flutter pub get --enforce-lockfile

      - name: Provision throwaway confirmed user
        id: user
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node tooling/e2e/provision_user.mjs

      # why: no chromedriver, no fallback fonts and no --browser-dimension —
      # the runner reads `capture.flutterDevice` from the register, sees a
      # native device, and drives `flutter drive -d <device>` instead. That
      # branch is what tooling/ci/test/store-screenshots-lane.test.mjs pins.
      - name: Capture the set
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          E2E_EMAIL: ${{ steps.user.outputs.email }}
          E2E_PASSWORD: ${{ steps.user.outputs.password }}
          # why: the runner records each drive's consent answer and install id here;
          # the purge step below reads the same path (tooling/e2e/purge.mjs).
          E2E_CONSENT_LEDGER: ${{ runner.temp }}/store-capture-consent.json
        run: node tooling/store/capture-play-screenshots.mjs --app subscriptiontracker --channel "$STORE_CHANNEL"

      - name: The captured set satisfies the listing-asset guard
        id: listing
        run: node --single-threaded tooling/ci/assert-listing-assets.mjs

      - name: The captured set satisfies the device-coverage guard
        run: node --single-threaded tooling/ci/assert-play-device-coverage.mjs

      - name: Keep the frames of a FAILED run, for diagnosis only
        if: failure() && steps.reg.outputs.dir != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FAILED-not-a-listing-set-${{ github.run_id }}
          if-no-files-found: ignore
          path: ${{ steps.reg.outputs.dir }}/

      # why: the Play job's reason — the ink reading of every frame, from
      # the run's own log. Through env, never `${{ }}` inside `run:`.
      - name: Print the ink reading of a FAILED run, for diagnosis only
        if: failure() && steps.listing.outcome == 'failure'
        env:
          FRAMES_DIR: ${{ steps.reg.outputs.dir }}
        run: node --single-threaded tooling/store/measure-frame-ink.mjs "$FRAMES_DIR"

      - name: Upload the screenshot set
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.channel }}-screenshots-subscriptiontracker
          path: ${{ steps.reg.outputs.dir }}/
          if-no-files-found: error

      # why: PROPOSED, never pushed — a store listing is a sworn filing; a
      # machine may photograph it and must not commit it to a protected branch
      # unreviewed.
      - name: Propose the set for human review (pull request)
        env:
          GH_TOKEN: ${{ github.token }}
          SHOTS: ${{ steps.reg.outputs.dir }}
        run: |
          set -euo pipefail
          BRANCH="chore/${STORE_CHANNEL}-screenshots-${{ github.run_id }}"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f "$SHOTS"
          if git diff --cached --quiet; then
            echo "::notice title=Nothing to propose::The captured set is byte-identical to what is already committed. The listing already carries this exact capture; no pull request is needed."
            exit 0
          fi

          git checkout -b "$BRANCH"
          git commit -F - <<MSG
          chore(${STORE_CHANNEL}): the captured screenshot set, for review

          Captured live by .github/workflows/store-screenshots.yml against the
          REAL native desktop binary with the real backend defines — no "Demo
          data" banner and none of the twelve third-party trademarks the demo
          seed carries.

          CAPTURE.json records the posture; tooling/ci/assert-listing-assets.mjs
          proves size, count, aspect, format and the ABSENCE OF THE DEMO BANNER
          in pixels, and refuses a set whose provenance nobody wrote down.

          What it cannot prove is whether these are the screens worth showing.
          That is the reason this arrives as a pull request: look at the images
          in the diff before merging.
          MSG

          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"

          # The same refusal path the other two jobs document: "Allow GitHub
          # Actions to create and approve pull requests" gates every `gh pr
          # create` run by GITHUB_TOKEN, and was measured OFF on 2026-08-26.
          set +e
          gh pr create \
            --base "${GITHUB_REF_NAME}" \
            --head "$BRANCH" \
            --title "chore(${STORE_CHANNEL}): the captured screenshot set, for review" \
            --body "Captured by run \`${{ github.run_id }}\` from the real native desktop binary. **Look at the images in the Files changed tab** — the guard proves size, count, format, aspect and that no demo banner is present in the pixels; it cannot judge whether these are the screens worth showing. Merging is the human decision this PR exists to ask for."$'\n\nRows: none — automated store screenshot capture, reviewed by eye' > "${RUNNER_TEMP}/gh-pr-create.log" 2>&1
          PR_RC=$?
          set -e
          cat "${RUNNER_TEMP}/gh-pr-create.log"

          if [ "$PR_RC" -ne 0 ]; then
            if grep -qiF 'not permitted to create or approve pull requests' "${RUNNER_TEMP}/gh-pr-create.log"; then
              CAUSE='the repository setting "Allow GitHub Actions to create and approve pull requests" is OFF.'
              REMEDY='REMEDY (owner work — no workflow can set this for itself): Settings → Actions → General → Workflow permissions → tick "Allow GitHub Actions to create and approve pull requests".'
            else
              CAUSE="gh pr create exited ${PR_RC} for a reason this step does not recognise."
              REMEDY='REMEDY: read the gh output above.'
            fi
            echo "::error title=The screenshot set was captured but the pull request could not be opened::${CAUSE} THE CAPTURE IS NOT LOST — branch ${BRANCH} is pushed and the same pixels are already uploaded as this run's ${STORE_CHANNEL}-screenshots-subscriptiontracker artifact; open the pull request by hand from ${BRANCH} into ${GITHUB_REF_NAME}. ${REMEDY}"
            exit 1
          fi

      - name: Purge the throwaway user
        if: always()
        env:
          E2E_USER_ID: ${{ steps.user.outputs.user_id }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SUBSCRIPTIONTRACKER_D1_DATABASE_ID: 0a36d6a0-c909-40aa-853e-970de3482321
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # why: this capture's consent rows in platform_db. purge.mjs deletes by the
          # install ids in the runner's ledger and by its cap-* APP_VERSION stamp.
          E2E_APP_ID: subscriptiontracker
          E2E_CONSENT_LEDGER: ${{ runner.temp }}/store-capture-consent.json
          PLATFORM_D1_DATABASE_ID: 9d1c5c63-97fe-4f82-bc7d-f3fd22e9b351
        run: node tooling/e2e/purge.mjs

  # 🔴 ONE JOB, TWO SETS, ONE PULL REQUEST. iOS is the first channel in this
  # contract that captures more than one directory, and the reason the sets are
  # not split across two jobs is the listing itself: App Store Connect grades
  # the iPhone and the iPad sets on the SAME version record, so frames captured
  # from two different builds are two listings wearing one version number. One
  # job, one build, one provisioned user, one pull request to look at.
  capture-ios:
    name: Capture the iOS screenshot sets — iPhone and iPad (live)
    if: ${{ inputs.channel == 'ios-appstore' }}
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # why: the same four, failing closed for the same reason as every other
      # capture job — without them the app builds in DEMO posture and the frames
      # are a "Demo data" banner over twelve third-party trademarks.
      # TURNSTILE_SITE_KEY is deliberately absent: the gate renders in the WEB
      # build, and this job drives a native binary on a simulator.
      - name: Preflight — every secret the live capture needs must be present
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          missing=""
          for k in SUPABASE_URL SUPABASE_ANON_KEY API_BASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            eval "v=\$$k"
            [ -z "$v" ] && missing="$missing $k"
          done
          if [ -n "$missing" ]; then
            echo "::error title=Capture cannot run::Missing secret(s):$missing. Without them the app builds in DEMO posture, whose every screen carries a 'Demo data' banner and whose board is twelve third-party trademarks. This is a failed run, not a skipped one."
            exit 1
          fi
          echo "All four secrets present — the build will be LIVE."

      - uses: ./.github/actions/setup-node

      - uses: ./.github/actions/setup-flutter

      - name: flutter pub get
        working-directory: apps/subscriptiontracker
        run: flutter pub get --enforce-lockfile

      # 🔴 THE REGISTER NAMES THE SIMULATORS AND THE DIRECTORIES, and this step
      # is the only place the workflow learns either. It emits one line per set
      # so the boot loop and the `git add` below are both derived rather than
      # typed: the day a third size class is declared, this job captures it
      # without an edit, which is the opposite of the desktop job's deliberate
      # one-directory refusal — there, a second set means a second listing; here
      # a second set is the normal shape.
      - name: What the register says this channel captures
        id: reg
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const r = JSON.parse(fs.readFileSync("tooling/channel-register.json", "utf8"));
            const s = r.storeMetadataContract.perChannel["ios-appstore"].graphicAssets.screenshots;
            const sets = Object.entries(s.deviceTypeCoverage.sets);
            const bad = sets.filter(([, v]) => !v.capture || !v.capture.flutterDevice);
            if (bad.length) {
              console.error("::error title=No capture geometry::set(s) " + bad.map(([k]) => k).join(", ") + " declare no `capture.flutterDevice`. tooling/store/capture-play-screenshots.mjs reads the device and the viewport from that limb, and with none it has nothing to open.");
              process.exit(1);
            }
            const wrong = sets.filter(([, v]) => v.capture.runner !== "macos-26");
            if (wrong.length) {
              console.error("::error title=The runner and the register disagree::set(s) " + wrong.map(([k]) => k).join(", ") + " name a runner other than `macos-26`, and this job is pinned to macos-26. `runs-on` cannot be read from a file — GitHub resolves it before any step runs — so the two have to be changed together.");
              process.exit(1);
            }
            const dirs = sets.map(([, v]) => "apps/subscriptiontracker/store/ios-appstore/" + v.dir);
            const devices = [...new Set(sets.map(([, v]) => v.capture.flutterDevice))];
            // why `;` and not a newline: a step output is one KEY=VALUE line
            // unless it is written with a heredoc delimiter, and a simulator
            // name contains spaces, so neither a raw newline nor whitespace can
            // separate them. The boot loop below splits on `;`.
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "dirs=" + dirs.join(" ") + "\n");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "devices=" + devices.join(";") + "\n");
            console.log("dirs: " + dirs.join(" "));
            console.log("devices: " + devices.join(" | "));
          '

      # 🔴 A SIMULATOR THAT IS NOT BOOTED IS NOT A FLUTTER DEVICE. `flutter
      # devices` lists RUNNING simulators, so `flutter drive -d "iPad Pro
      # 13-inch (M4)"` against a shut-down one fails with "no devices" — which
      # reads like a broken workflow and is really an unbooted simulator. Boot
      # every device the register names, and say plainly which name was not
      # found: the runner image ships the size classes Xcode ships, and Apple's
      # required classes move with the hardware, so THIS is the step that will
      # go red the year the register's device names age out.
      - name: Boot the simulators the register names
        env:
          DEVICES: ${{ steps.reg.outputs.devices }}
        run: |
          set -uo pipefail
          xcrun simctl list devices available
          rc=0
          while IFS= read -r -d ';' d || [ -n "$d" ]; do
            [ -z "$d" ] && continue
            echo "booting: $d"
            if ! xcrun simctl boot "$d"; then
              echo "::error title=No such simulator::The register names \"$d\" and this runner image has no available simulator by that name. Apple's required screenshot size classes move with the hardware line-up, so either the device name in tooling/channel-register.json has aged out, or this runner image ships a different Xcode. Fix the register (with the size the new class requires, and its source), not this workflow."
              rc=1
            fi
          done <<< "$DEVICES"
          [ "$rc" -eq 0 ] || exit 1
          xcrun simctl list devices booted

      - name: Provision throwaway confirmed user
        id: user
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node tooling/e2e/provision_user.mjs

      # why: one invocation for both sets. The runner iterates the register's
      # sets itself, so the iPhone and the iPad frames come from one build with
      # one signed-in account — which is what makes them one listing.
      - name: Capture both sets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          E2E_EMAIL: ${{ steps.user.outputs.email }}
          E2E_PASSWORD: ${{ steps.user.outputs.password }}
          # why: the runner records each drive's consent answer and install id here;
          # the purge step below reads the same path (tooling/e2e/purge.mjs).
          E2E_CONSENT_LEDGER: ${{ runner.temp }}/store-capture-consent.json
        run: node tooling/store/capture-play-screenshots.mjs --app subscriptiontracker --channel ios-appstore

      - name: The captured sets satisfy the listing-asset guard
        id: listing
        run: node --single-threaded tooling/ci/assert-listing-assets.mjs

      # why: this is the guard that fails if only ONE set was captured. The
      # register declares minDistinctTypes 2 for this channel, so a run that
      # photographed the iPhone and quietly skipped the iPad stops here instead
      # of arriving as a pull request that looks complete.
      - name: The captured sets satisfy the device-coverage guard
        run: node --single-threaded tooling/ci/assert-play-device-coverage.mjs

      - name: Keep the frames of a FAILED run, for diagnosis only
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FAILED-not-a-listing-set-${{ github.run_id }}
          if-no-files-found: ignore
          path: apps/subscriptiontracker/store/ios-appstore/

      # why: the Play job's reason — the ink reading of every frame, from
      # the run's own log.
      - name: Print the ink reading of a FAILED run, for diagnosis only
        if: failure() && steps.listing.outcome == 'failure'
        run: node --single-threaded tooling/store/measure-frame-ink.mjs apps/subscriptiontracker/store/ios-appstore/screenshots apps/subscriptiontracker/store/ios-appstore/screenshots-ipad

      - name: Upload the screenshot sets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-screenshots-subscriptiontracker
          path: |
            apps/subscriptiontracker/store/ios-appstore/screenshots/
            apps/subscriptiontracker/store/ios-appstore/screenshots-ipad/
          if-no-files-found: error

      # why: PROPOSED, never pushed — a store listing is a sworn filing; a
      # machine may photograph it and must not commit it to a protected branch
      # unreviewed.
      - name: Propose the sets for human review (pull request)
        env:
          GH_TOKEN: ${{ github.token }}
          SHOTS: ${{ steps.reg.outputs.dirs }}
        run: |
          set -euo pipefail
          BRANCH="chore/ios-screenshots-${{ github.run_id }}"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for d in $SHOTS; do git add -f "$d"; done
          if git diff --cached --quiet; then
            echo "::notice title=Nothing to propose::The captured sets are byte-identical to what is already committed. The listing already carries this exact capture; no pull request is needed."
            exit 0
          fi

          git checkout -b "$BRANCH"
          git commit -F - <<'MSG'
          chore(ios): the captured screenshot sets, for review

          BOTH size classes — iPhone and iPad — captured live by
          .github/workflows/store-screenshots.yml from ONE build with ONE
          signed-in account, against the real backend defines. No "Demo data"
          banner and none of the twelve third-party trademarks the demo seed
          carries.

          CAPTURE.json records the posture; tooling/ci/assert-listing-assets.mjs
          proves size, count, aspect, format and the ABSENCE OF THE DEMO BANNER
          in pixels, and tooling/ci/assert-play-device-coverage.mjs proves both
          size classes are present — a set short is a rejected upload.

          What neither can prove is whether these are the screens worth showing,
          or whether the iPad frames show a tablet layout rather than a stretched
          phone one. That is the reason this arrives as a pull request: look at
          the images in the diff before merging.
          MSG

          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"

          # The same refusal path the other capture jobs document: "Allow GitHub
          # Actions to create and approve pull requests" gates every `gh pr
          # create` run by GITHUB_TOKEN, and was measured OFF on 2026-08-26.
          set +e
          gh pr create \
            --base "${GITHUB_REF_NAME}" \
            --head "$BRANCH" \
            --title "chore(ios): the captured screenshot sets, for review" \
            --body "Captured by run \`${{ github.run_id }}\` from the real iOS build on the simulators the register names — **both** size classes from one build. **Look at the images in the Files changed tab**, and look hardest at the iPad ones: the guards prove size, count, format and that both sets exist, and cannot judge whether the iPad frames show a tablet layout or a stretched phone one. Merging is the human decision this PR exists to ask for."$'\n\nRows: none — automated store screenshot capture, reviewed by eye' > "${RUNNER_TEMP}/gh-pr-create.log" 2>&1
          PR_RC=$?
          set -e
          cat "${RUNNER_TEMP}/gh-pr-create.log"

          if [ "$PR_RC" -ne 0 ]; then
            if grep -qiF 'not permitted to create or approve pull requests' "${RUNNER_TEMP}/gh-pr-create.log"; then
              CAUSE='the repository setting "Allow GitHub Actions to create and approve pull requests" is OFF.'
              REMEDY='REMEDY (owner work — no workflow can set this for itself): Settings → Actions → General → Workflow permissions → tick "Allow GitHub Actions to create and approve pull requests".'
            else
              CAUSE="gh pr create exited ${PR_RC} for a reason this step does not recognise."
              REMEDY='REMEDY: read the gh output above.'
            fi
            echo "::error title=The screenshot sets were captured but the pull request could not be opened::${CAUSE} THE CAPTURE IS NOT LOST — branch ${BRANCH} is pushed and the same pixels are already uploaded as this run's ios-screenshots-subscriptiontracker artifact; open the pull request by hand from ${BRANCH} into ${GITHUB_REF_NAME}. ${REMEDY}"
            exit 1
          fi

      - name: Purge the throwaway user
        if: always()
        env:
          E2E_USER_ID: ${{ steps.user.outputs.user_id }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SUBSCRIPTIONTRACKER_D1_DATABASE_ID: 0a36d6a0-c909-40aa-853e-970de3482321
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # why: this capture's consent rows in platform_db. purge.mjs deletes by the
          # install ids in the runner's ledger and by its cap-* APP_VERSION stamp.
          E2E_APP_ID: subscriptiontracker
          E2E_CONSENT_LEDGER: ${{ runner.temp }}/store-capture-consent.json
          PLATFORM_D1_DATABASE_ID: 9d1c5c63-97fe-4f82-bc7d-f3fd22e9b351
        run: node tooling/e2e/purge.mjs
