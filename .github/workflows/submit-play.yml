name: "Store submit: Google Play"

run-name: "Store submit: Google Play by @${{ github.actor }}"

# The measurements, retractions and traps behind this file are in
# docs/ci/submit-play.md. Only `# why:` lines live here, and
# docs/ci/README.md carries the rules every workflow has to obey.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type SUBMIT-TO-PLAY to authorise a real upload. Anything else runs the dry run only.'
        required: true
        default: 'dry-run-only'
        type: string
      track:
        description: 'Play track. Leave empty to use the least-public track the API reports for the app. `production` is REFUSED (ADR 031 class A).'
        required: false
        default: ''
        type: string
      release_status:
        description: 'Release status on that track: completed (served to the track''s testers) or draft (uploaded, not served).'
        required: false
        default: 'completed'
        type: choice
        options: [completed, draft]
      listing_url:
        description: 'The Play listing URL this submission will be recorded against, e.g. https://play.google.com/store/apps/details?id=<applicationId>. Required for a real upload; ignored by the dry run.'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  checks: read

jobs:
  gate:
    name: Require ci-gate to have passed
    runs-on: ubuntu-24.04
    # why: 25, not 10. assert-gate-passed.mjs polls for up to its own 1200 s default,
    # so any bound at or under 20 kills it mid-poll and replaces "timed out waiting
    # for ci-gate" with an opaque cancellation. Byte-identical in all five gate jobs.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require ci-gate to have passed for this commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node tooling/ci/assert-gate-passed.mjs ${{ github.sha }}

  dry-run:
    name: Validate the submission path
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: gate
    permissions:
      contents: read
      deployments: read
    # why: the submit job ships THIS job's bundle, not a rebuild of it, and checks it against
    # this sha256 (O-SUBMIT-REBUILDS-WHAT-THE-DRY-RUN-BUILT; docs/ci/submit-play.md).
    outputs:
      artifact: ${{ steps.bytes.outputs.artifact }}
      sha256: ${{ steps.bytes.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: ./.github/actions/setup-flutter
      - name: Resolve the workspace
        run: flutter pub get --enforce-lockfile
      - name: Prepare the Android upload key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node tooling/ci/android-signing.mjs --app subscriptiontracker --channel android-play
      - name: Derive the release line from pubspec
        id: ver
        run: node tooling/ci/assert-app-versioning.mjs --emit apps/subscriptiontracker >> "$GITHUB_OUTPUT"
      # why: O-SUBMIT-LANES-SKIP-PRECONDITION-GATES. A lane green over a name the owner has not HELD
      # or proven free submits one nobody ruled on; limb 3 of assert-publish-steps-guarded.mjs.
      - name: Name clearance holds for android-play (owner HELD or PROVEN-FREE)
        run: node tooling/ci/assert-name-clearance.mjs --for-submission=android-play
      # why: docs/ci/submit-play.md — before step "The versionCode lies above what Play consumed".
      - name: The versionCode lies above what Play consumed
        env:
          RUN_NUMBER: ${{ github.run_number }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          RECORDED="$(node tooling/ci/read-ledger-version-code.mjs subscriptiontracker-android-play)"
          node tooling/ci/assert-app-versioning.mjs --play-floor "$RUN_NUMBER" --app subscriptiontracker --recorded-upload "$RECORDED"
      # why: the three version flags. This is the ONE build of the dispatch: the submit job
      # ships these bytes. Without them
      # AppConfig.appVersion is 'dev' and the versionCode is pubspec's `+1`, which Play has
      # already consumed — docs/ci/submit-play.md §versioning. assert-app-versioning.mjs
      # holds every release build in every workflow to this, found by scan, not by list.
      - name: Build the app bundle
        env:
          RELEASE_LINE: ${{ steps.ver.outputs.release_line }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          REVENUECAT_PUBLIC_KEY_GOOGLE: ${{ secrets.REVENUECAT_PUBLIC_KEY_GOOGLE }}
          GLITCHTIP_DSN: ${{ secrets.GLITCHTIP_DSN }}
        run: node tooling/ci/flutter-release-build.mjs subscriptiontracker appbundle android-play
      # ⏱ MOVED 2026-09-07 (unit `symbols-everywhere`) — THIS STEP USED TO BE THE
      # LAST ONE IN THE JOB, behind the Play dry run. That is the ordering
      # post-audit-obfuscation-and-symbols.md §9.3 reproduced on a real runner:
      # in dispatch 34093704881 a build succeeded WITH the flags, a later step
      # failed, and the symbols artifact was `skipped` — the mapping was written
      # and destroyed with the runner. It now sits immediately after the build,
      # ahead of every assertion and every network call, including the sink
      # upload directly below it.
      # why: the bundle above is obfuscated, so its crash reports are unreadable
      # without this directory, and a rebuild produces a DIFFERENT one. 7 days
      # matches the dry-run bundle it belongs to, and the sink upload below is
      # the copy that lasts. ⏱ 2026-09-25: the submit job now ships this bundle
      # and re-keeps THIS directory for 90 days as symbols-<app>-android-play.
      # tooling/ci/assert-obfuscation-coupled.mjs refuses the build without it.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: symbols-subscriptiontracker-android-play-dry-run
          path: apps/subscriptiontracker/build/symbols/android-aab
          retention-days: 7
          if-no-files-found: error
      # why: ONE code path on every lane (O-GLITCHTIP-CLI-INSTALLED-BY-HAND): the digest tooling/versions.json
      # pins for this runner's OS, a bounded retry, and the binary's own --version held to the pin.
      - name: Install glitchtip-cli (pinned by version AND by digest)
        run: node tooling/ci/install-pinned-tool.mjs glitchtip-cli --out "$RUNNER_TEMP"
      # why: FAILS CLOSED on a missing GLITCHTIP_TOKEN, never skips — the wrapper
      # exits 1 naming the secret, because a symbol upload that quietly skips
      # itself is how a release ships unreadable. Placed AFTER the retention step
      # above and BEFORE every network step below, so a GlitchTip outage cannot
      # take the mapping with it: the artifact is already written when this runs.
      - name: Upload the native debug symbols to GlitchTip
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.GLITCHTIP_TOKEN }}
          GLITCHTIP_DSN: ${{ secrets.GLITCHTIP_DSN }}
        run: >
          node tooling/ops/upload-native-symbols.mjs
          --cli "${RUNNER_TEMP}/glitchtip-cli"
          --dir apps/subscriptiontracker/build/symbols/android-aab
          --org nikatru --project subscriptiontracker
      - name: The .aab must be signed by the upload key, not the debug key
        run: >
          node tooling/ci/assert-artifact-signed.mjs
          apps/subscriptiontracker/build/app/outputs/bundle/release/app-release.aab
      - name: The Play screenshot set spans enough device types
        run: node tooling/ci/assert-play-device-coverage.mjs --for-submission=android-play
      - name: Every native library is aligned for a 16 KB memory page
        run: >
          node --single-threaded tooling/ci/assert-elf-page-alignment.mjs
          apps/subscriptiontracker/build/app/outputs/bundle/release/app-release.aab
      - name: Dry-run the Google Play submission
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_TRACK: ${{ vars.PLAY_TRACK }}
        run: node tooling/release/submit-play.mjs --dry-run --app subscriptiontracker
      # why: the hand-off the submit job verifies. The name carries the posture
      # android-signing.mjs exported, which the submit job cannot recompute, so it
      # travels as an output; the upload below reads the same output, so the name
      # is written once. Nothing runs between this hash and that upload.
      - name: Hand the submit job this bundle's name and sha256
        id: bytes
        env:
          AAB: apps/subscriptiontracker/build/app/outputs/bundle/release/app-release.aab
        run: |
          set -euo pipefail
          sum="$(sha256sum "$AAB" | cut -d ' ' -f 1)"
          echo "artifact=subscriptiontracker-android-play-aab-${ANDROID_SIGNING_POSTURE:?android-signing.mjs exported no posture}" >> "$GITHUB_OUTPUT"
          echo "sha256=${sum}" >> "$GITHUB_OUTPUT"
          echo "${sum}  ${AAB}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.bytes.outputs.artifact }}
          path: apps/subscriptiontracker/build/app/outputs/bundle/release/app-release.aab
          retention-days: 7
          if-no-files-found: error

  submit:
    name: Upload to Google Play (owner-approved)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [gate, dry-run]
    # why: a typed phrase, not a checkbox. This is the only job in the tree that
    # uploads to a public store, and the dispatch default is dry-run-only.
    if: inputs.confirm == 'SUBMIT-TO-PLAY'
    # why: this line is the owner-approval PAUSE (ADR 031 class A), and on its own it
    # FAILS OPEN -- GitHub creates a referenced environment that does not exist, with
    # no protection rules, and runs. So tooling/release/submit-play.mjs also reads the
    # environment's protection rules at run time, and assert-release-provenance.mjs
    # fails the build for a submit lane that has only one of the two halves.
    environment: store-publish
    permissions:
      contents: read
      checks: read
      deployments: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # why: ONLY main SUBMITS, CHECKED BEFORE ANYTHING ELSE RUNS (row
      # O-DEPLOY-IS-NOT-ONE-GATED-LANE, limb 2). `workflow_dispatch` runs on whatever ref
      # the dispatcher picks, and `environment: store-publish` alone fails open (above),
      # so a dispatch from any branch or tag but main exits 1 here. Held FIRST by
      # assert-workflow-hardening limb 10.
      - name: Refuse any ref but main
        run: node tooling/ci/assert-deploy-ref.mjs --allow main
      - name: A real submission must name the listing it will be recorded against
        env:
          LISTING_URL: ${{ inputs.listing_url }}
        run: |
          set -euo pipefail
          case "${LISTING_URL}" in
            https://*)
              echo "⬜ [10]D-9 the submission will be recorded against ${LISTING_URL}"
              ;;
            '')
              echo "FAIL the \`listing_url\` dispatch input is EMPTY, and this job is a REAL upload." >&2
              echo "     [10]D-9: a store record whose listing nobody can open says something shipped and" >&2
              echo "     gives no way to look at it. The [10]D-9 recorder refuses a store environment with" >&2
              echo "     no --listing-url, so this run could upload and then be unable to record what it did." >&2
              echo "     Re-dispatch with listing_url set, e.g." >&2
              echo "       https://play.google.com/store/apps/details?id=<applicationId>" >&2
              exit 1
              ;;
            *)
              echo "FAIL \`listing_url\` is ${LISTING_URL}, which is not an https URL." >&2
              echo "     The ledger row is the ONLY address anybody will have for this submission once the" >&2
              echo "     console is behind an account nobody can open. A value that does not resolve is a" >&2
              echo "     second source of truth, not a record." >&2
              exit 1
              ;;
          esac
      # why: keytool, for the signer check below. No build runs in this job.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      # why: kept with no build to feed: submit-play.mjs --submit reads the four keystore
      # variables and ANDROID_SIGNING_POSTURE this exports, and the signer check below holds
      # that posture to the signature actually on the downloaded bundle.
      - name: Prepare the Android upload key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node tooling/ci/android-signing.mjs --app subscriptiontracker
      # why: O-SUBMIT-LANES-SKIP-PRECONDITION-GATES. A lane green over a name the owner has not HELD
      # or proven free submits one nobody ruled on; limb 3 of assert-publish-steps-guarded.mjs.
      - name: Name clearance holds for android-play (owner HELD or PROVEN-FREE)
        run: node tooling/ci/assert-name-clearance.mjs --for-submission=android-play
      # why: docs/ci/submit-play.md — before step "The versionCode lies above what Play consumed".
      - name: The versionCode lies above what Play consumed
        env:
          RUN_NUMBER: ${{ github.run_number }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          RECORDED="$(node tooling/ci/read-ledger-version-code.mjs subscriptiontracker-android-play)"
          node tooling/ci/assert-app-versioning.mjs --play-floor "$RUN_NUMBER" --app subscriptiontracker --recorded-upload "$RECORDED"
      # why: THE DRY RUN'S BYTES, NOT A REBUILD (O-SUBMIT-REBUILDS-WHAT-THE-DRY-RUN-BUILT):
      # one compile per dispatch. The versionCode is the dry-run job's --build-number,
      # github.run_number, which this job shares. Retention is 7 days and there is no
      # fallback: an approval older than that finds nothing and the job fails.
      - name: Take the dry-run job's bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.dry-run.outputs.artifact }}
          path: apps/subscriptiontracker/build/app/outputs/bundle/release
      # why: the value arrives through env:, never interpolated into run: (zizmor).
      - name: The bundle is the one the dry-run job hashed (sha256)
        env:
          EXPECTED_SHA256: ${{ needs.dry-run.outputs.sha256 }}
          AAB: apps/subscriptiontracker/build/app/outputs/bundle/release/app-release.aab
        run: |
          set -euo pipefail
          if ! printf '%s' "$EXPECTED_SHA256" | grep -Eqx '[0-9a-f]{64}'; then
            echo "FAIL the dry-run job's sha256 output is '${EXPECTED_SHA256}', not 64 hex digits: nothing to check the download against." >&2
            exit 1
          fi
          printf '%s  %s\n' "$EXPECTED_SHA256" "$AAB" | sha256sum --check --strict -
      - name: The .aab must be signed by the upload key, not the debug key
        run: >
          node tooling/ci/assert-artifact-signed.mjs
          apps/subscriptiontracker/build/app/outputs/bundle/release/app-release.aab
      - name: The Play screenshot set spans enough device types
        run: node tooling/ci/assert-play-device-coverage.mjs --for-submission=android-play
      - name: Every native library is aligned for a 16 KB memory page
        run: >
          node --single-threaded tooling/ci/assert-elf-page-alignment.mjs
          apps/subscriptiontracker/build/app/outputs/bundle/release/app-release.aab
      # why: the mapping of the bundle above is the dry-run job's (same build), already in
      # the crash sink from that job. BEFORE the upload, not after: kept again here for
      # 90 days, not 7, because this bundle ships, and a step after a store upload does
      # not run when that upload fails.
      - name: Take the dry-run job's symbols for this bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: symbols-subscriptiontracker-android-play-dry-run
          path: apps/subscriptiontracker/build/symbols/android-aab
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: symbols-subscriptiontracker-android-play
          path: apps/subscriptiontracker/build/symbols/android-aab
          retention-days: 90
          if-no-files-found: error
      - name: Upload to Google Play
        id: upload
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_TRACK: ${{ inputs.track }}
          RELEASE_STATUS: ${{ inputs.release_status }}
          CONFIRM: ${{ inputs.confirm }}
          GITHUB_TOKEN: ${{ github.token }}
        run: >
          node tooling/release/submit-play.mjs --submit --app subscriptiontracker
          --confirm "$CONFIRM" --status "$RELEASE_STATUS"
      # why: read-after-upload on the versionCode, which androidpublisher returns per
      # track and which the upload itself produced. The snap lane deliberately has no
      # equivalent -- no machine-readable join key exists there; docs/ci/submit-snap.md
      # records why, and warns against copying that exemption onto this lane.
      # why the expectation is RUN_NUMBER and not pubspec's `+N`: the dry-run job's build,
      # whose bytes this job uploads, passes
      # `--build-number=${{ github.run_number }}`, which OVERRIDES pubspec. Reading pubspec
      # here would assert `1` — the versionCode runs 4-5 burnt on 2026-09-22 — and go green
      # against the OLD bundle. So the expectation is read from the same expression the
      # build used; keep the two in step when either changes.
      - name: The Play track must carry the bundle this job just uploaded
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          case "${RUN_NUMBER}" in
            ''|*[!0-9]*)
              echo "FAIL github.run_number is '${RUN_NUMBER}', not a positive integer; the versionCode this job" >&2
              echo "     built cannot be known, so the probe refuses to guess." >&2
              exit 1
              ;;
          esac
          VERSION_CODE="${RUN_NUMBER}"
          APPLICATION_ID="$(node --input-type=module -e '
          import { readFileSync } from "node:fs";
          import { readGradleApplicationId } from "./tooling/ci/read-identity.mjs";
          const rel = "apps/subscriptiontracker/android/app/build.gradle.kts";
          const id = readGradleApplicationId(readFileSync(rel, "utf8"), rel);
          if (!id.value) { console.error(id.missing ?? id.lost); process.exit(1); }
          process.stdout.write(id.value);
          ')"
          echo "⬜ [14]O-7 reading the Play track state for ${APPLICATION_ID}, expecting versionCode ${VERSION_CODE}"
          node tooling/ops/post-deploy-smoke.mjs --play-package "${APPLICATION_ID}" --expect "${VERSION_CODE}"
          echo "::notice title=Play versionCode high-water::versionCode ${VERSION_CODE} is consumed. Record it in tooling/channel-register.json android-play.versionCodeHighWater.consumed.subscriptiontracker, and the ledger now holds it: the next dispatch stops until consumed is raised to it"
      - name: Record the submission in the [10]D-9 ledger
        if: always() && steps.upload.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          LISTING_URL: ${{ inputs.listing_url }}
          RUN_NUMBER: ${{ github.run_number }}
        run: node tooling/ci/record-deployment.mjs subscriptiontracker-android-play --state in_review --listing-url "$LISTING_URL" --version-code "$RUN_NUMBER"
