name: "Store submit: Google Play"

run-name: "Store submit: Google Play — ${{ inputs.app }} — ${{ inputs.confirm == 'SUBMIT-TO-PLAY' && 'SUBMIT' || 'dry run' }} by @${{ github.actor }}"

# The measurements, retractions and traps behind this file are in
# docs/ci/submit-play.md. Only `# why:` lines live here, and
# docs/ci/README.md carries the rules every workflow has to obey.

on:
  workflow_dispatch:
    inputs:
      # why: required with NO default and NO choice list (O-STORE-LANES-HARD-WIRE-ONE-APP):
      # either one is an app id written into this file. The gate job checks it against the
      # workspace set; every other job reads the gate's output, never this input.
      app:
        description: 'The app to submit: one id of the workspace app set (tooling/ci/assert-release-lane-generic.mjs --emit-apps). The gate job refuses any other value.'
        required: true
        type: string
      confirm:
        description: 'Type SUBMIT-TO-PLAY to authorise a real upload. Anything else runs the dry run only.'
        required: true
        default: 'dry-run-only'
        type: string
      track:
        description: 'Play track. Leave empty to use the least-public track the API reports for the app. `production` is REFUSED unless release_status is draft (ADR 031 class A: staging is not promoting).'
        required: false
        default: ''
        type: string
      release_status:
        description: 'Release status on that track: completed (served to the track''s testers) or draft (uploaded, not served).'
        required: false
        default: 'completed'
        type: choice
        options: [completed, draft]
      listing_url:
        description: 'The Play listing URL this submission will be recorded against, e.g. https://play.google.com/store/apps/details?id=<applicationId>. Required for a real upload; ignored by the dry run.'
        required: false
        default: ''
        type: string

  # why: a WEEKLY rehearsal, the dry-run job only (review AA-03, O-STORE-DRY-RUNS-HAVE-NO-CADENCE (absent from open.json until the next Private pass records it)): a
  # dispatch-only dry run is graded by nobody between dispatches, and an armed store lane went weeks
  # unrehearsed. The submit job reads github.event_name == 'workflow_dispatch', so a schedule never
  # reaches a store; assert-platform-proof-fresh.mjs --store-lanes grades this run's age.
  schedule:
    - cron: '0 7 * * 2'   # Tuesdays 07:00 UTC

permissions:
  contents: read
  checks: read

jobs:
  gate:
    name: Require ci-gate to have passed
    runs-on: ubuntu-24.04
    # why: 25, not 10. assert-gate-passed.mjs polls for up to its own 1200 s default,
    # so any bound at or under 20 kills it mid-poll and replaces "timed out waiting
    # for ci-gate" with an opaque cancellation. Byte-identical in all five gate jobs.
    timeout-minutes: 25
    outputs:
      app: ${{ steps.app.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require ci-gate to have passed for this commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node tooling/ci/assert-gate-passed.mjs ${{ github.sha }}
      # why: the ONE reader of inputs.app, and only through env: (an input interpolated into
      # run: is a shell injection). --emit-apps --app refuses a value off ^[a-z][a-z0-9-]*$
      # before it reads the set, and one outside the set naming the set; only then is it an output.
      - name: The app input names one app of the workspace
        id: app
        # why: a SCHEDULED run has no input, so its app comes from the workspace set, read from the emitter,
        # never written here. One app is that app; a set of more than one ROTATES, one app a week, and the
        # step names the turn (tooling/ci/scheduled-rehearsal.mjs; review of #1187, finding 5): it never refuses.
        env:
          APP_INPUT: ${{ inputs.app }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = schedule ]; then
            apps="$(node tooling/ci/assert-release-lane-generic.mjs --emit-apps)"
            APP_INPUT="$(node tooling/ci/scheduled-rehearsal.mjs --apps "$apps")"
          fi
          node tooling/ci/assert-release-lane-generic.mjs --emit-apps --app "$APP_INPUT"
          echo "app=${APP_INPUT}" >> "$GITHUB_OUTPUT"

  dry-run:
    name: Validate the submission path
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: gate
    # why: write, not read: the last step records this run (O-SUBMISSION-LANE-WITHOUT-RECORDER);
    # the versionCode step reads the ledger through the same grant.
    permissions:
      contents: read
      deployments: write
    # why: the submit job ships THIS job's bundle, not a rebuild of it, and checks it against
    # this sha256 (O-SUBMIT-REBUILDS-WHAT-THE-DRY-RUN-BUILT; docs/ci/submit-play.md).
    outputs:
      artifact: ${{ steps.bytes.outputs.artifact }}
      sha256: ${{ steps.bytes.outputs.sha256 }}
    # why: the gate's checked output, never inputs.app. run: reads $APP; the fields no
    # shell expands (artifact name and path) read the expression itself.
    env:
      APP: ${{ needs.gate.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: ./.github/actions/setup-flutter
      - name: Resolve the workspace
        run: flutter pub get --enforce-lockfile
      - name: Prepare the Android upload key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node tooling/ci/android-signing.mjs --app "$APP" --channel android-play
      - name: Derive the release line from pubspec
        id: ver
        run: node tooling/ci/assert-app-versioning.mjs --emit "apps/${APP}" >> "$GITHUB_OUTPUT"
      # why: docs/ci/submit-play.md — before step "The versionCode lies above what Play consumed".
      - name: The versionCode lies above what Play consumed
        env:
          RUN_NUMBER: ${{ github.run_number }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          RECORDED="$(node tooling/ci/read-ledger-version-code.mjs "${APP}-android-play")"
          node tooling/ci/assert-app-versioning.mjs --play-floor "$RUN_NUMBER" --app "$APP" --recorded-upload "$RECORDED"
      # why: the refusal path (O-BRICK-SELLS-NOTHING-IN-A-STORE): an app with no billing.mobileIap stops here,
      # exit 1. The builds below read the key from the STATIC named secret this rail's apps declare (app.yaml
      # billing.mobileIap.publicKeySecrets), never a `secrets[...]` index, which would hand this job every
      # repository secret (LEAD RULING W46-R1). assert-channel-register 6b-iii holds the name and --app.
      - name: Resolve the app's store SDK key secret (play-billing)
        id: rc-key
        run: node tooling/ci/store-key-secret.mjs --app "$APP" --rail play-billing >> "$GITHUB_OUTPUT"
      # why: the three version flags. This is the ONE build of the dispatch: the submit job
      # ships these bytes. Without them
      # AppConfig.appVersion is 'dev' and the versionCode is pubspec's `+1`, which Play has
      # already consumed — docs/ci/submit-play.md §versioning. assert-app-versioning.mjs
      # holds every release build in every workflow to this, found by scan, not by list.
      - name: Build the app bundle
        env:
          RELEASE_LINE: ${{ steps.ver.outputs.release_line }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          REVENUECAT_PUBLIC_KEY: ${{ secrets.REVENUECAT_PUBLIC_KEY_GOOGLE }}
          GLITCHTIP_DSN: ${{ secrets.GLITCHTIP_DSN }}
        run: node tooling/ci/flutter-release-build.mjs "$APP" appbundle android-play
      # ⏱ MOVED 2026-09-07 (unit `symbols-everywhere`) — THIS STEP USED TO BE THE
      # LAST ONE IN THE JOB, behind the Play dry run. That is the ordering
      # post-audit-obfuscation-and-symbols.md §9.3 reproduced on a real runner:
      # in dispatch 34093704881 a build succeeded WITH the flags, a later step
      # failed, and the symbols artifact was `skipped` — the mapping was written
      # and destroyed with the runner. It now sits immediately after the build,
      # ahead of every assertion and every network call, including the sink
      # upload directly below it.
      # why: the bundle above is obfuscated, so its crash reports are unreadable
      # without this directory, and a rebuild produces a DIFFERENT one. 7 days
      # matches the dry-run bundle it belongs to, and the sink upload below is
      # the copy that lasts. ⏱ 2026-09-25: the submit job now ships this bundle
      # and re-keeps THIS directory for 90 days as symbols-<app>-android-play.
      # tooling/ci/assert-obfuscation-coupled.mjs refuses the build without it.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: symbols-${{ needs.gate.outputs.app }}-android-play-dry-run
          path: apps/${{ needs.gate.outputs.app }}/build/symbols/android-aab
          retention-days: 7
          if-no-files-found: error
      # why: ONE code path on every lane (O-GLITCHTIP-CLI-INSTALLED-BY-HAND): the digest tooling/versions.json
      # pins for this runner's OS, a bounded retry, and the binary's own --version held to the pin.
      - name: Install glitchtip-cli (pinned by version AND by digest)
        run: node tooling/ci/install-pinned-tool.mjs glitchtip-cli --out "$RUNNER_TEMP"
      # why: FAILS CLOSED on a missing GLITCHTIP_TOKEN, never skips — the wrapper
      # exits 1 naming the secret, because a symbol upload that quietly skips
      # itself is how a release ships unreadable. Placed AFTER the retention step
      # above and BEFORE every network step below, so a GlitchTip outage cannot
      # take the mapping with it: the artifact is already written when this runs.
      # why: the GlitchTip project is the ONE declaration, tooling/ops/glitchtip-project.json,
      # never the app (assert-glitchtip-project.mjs refuses an app-derived one); read as
      # build-platforms.yml reads it.
      - name: Upload the native debug symbols to GlitchTip
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.GLITCHTIP_TOKEN }}
          GLITCHTIP_DSN: ${{ secrets.GLITCHTIP_DSN }}
        run: |
          set -euo pipefail
          gt_org="$(node -p "require('./tooling/ops/glitchtip-project.json').org")"
          gt_project="$(node -p "require('./tooling/ops/glitchtip-project.json').project")"
          node tooling/ops/upload-native-symbols.mjs \
            --cli "${RUNNER_TEMP}/glitchtip-cli" \
            --dir "apps/${APP}/build/symbols/android-aab" \
            --org "$gt_org" --project "$gt_project"
      - name: The .aab must be signed by the upload key, not the debug key
        run: >
          node tooling/ci/assert-artifact-signed.mjs
          "apps/${APP}/build/app/outputs/bundle/release/app-release.aab"
      - name: Every native library is aligned for a 16 KB memory page
        run: >
          node --single-threaded tooling/ci/assert-elf-page-alignment.mjs
          "apps/${APP}/build/app/outputs/bundle/release/app-release.aab"
      # why --touch-store (review AA-17): the rehearsal opens an edit, reads its tracks and DELETES it
      # uncommitted, so it proves the key still authenticates and still sees the app; an absent secret
      # FAILS it. Nothing is committed, so nothing a user or the console sees changes.
      - name: Dry-run the Google Play submission (opens and deletes an uncommitted edit)
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_TRACK: ${{ vars.PLAY_TRACK }}
        run: node tooling/release/submit-play.mjs --dry-run --touch-store --app "$APP"
      # why: O-SUBMIT-DRY-RUN-GATES-BLIND-THE-REHEARSAL (AA-02): the gates below run AFTER the build and the
      # store dry run, so a red gate still fails this job and skips submit, but only once the bundle was rehearsed.
      # why: O-SUBMIT-LANES-SKIP-PRECONDITION-GATES. A lane green over a name the owner has not HELD
      # or proven free submits one nobody ruled on; limb 3 of assert-publish-steps-guarded.mjs.
      - name: Name clearance holds for android-play (owner HELD or PROVEN-FREE)
        run: node tooling/ci/assert-name-clearance.mjs --for-submission=android-play
      # why: O-BRICK-SWORN-FILES-HAVE-NO-PREVIEW-STATE. A declaration still at "sworn": false is the stamped
      # template: submitting it swears to answers nobody gave. Limb 3 of assert-publish-steps-guarded.mjs.
      - name: The app's Play declarations are sworn, not preview (--for-submission)
        run: node tooling/ci/assert-sworn-store-files.mjs --for-submission=android-play --app "$APP"
      # why: a pending mobile IAP declaration (no RevenueCat apps yet) builds keyless and is never submitted:
      # its paywall cannot buy (O-BRICK-SELLS-NOTHING-IN-A-STORE; tooling/ci/submit-preconditions.mjs).
      - name: A pending in-app purchase declaration is not submitted (android-play)
        run: node tooling/ci/assert-app-yaml.mjs --for-submission=android-play --app "$APP"
      - name: The Play screenshot set spans enough device types
        run: node tooling/ci/assert-play-device-coverage.mjs --for-submission=android-play
      # why: O-SUBMIT-LANES-IGNORE-NATIVE-AUTH. A dry run prints what a real submission of a build that cannot
      # sign in would be refused, and never refuses; the submit job passes --real-submission.
      - name: A build that cannot sign in reaches no public track (android-play)
        run: node tooling/ci/assert-channel-register.mjs --for-submission=android-play
      # why: the hand-off the submit job verifies. The name carries the posture
      # android-signing.mjs exported, which the submit job cannot recompute, so it
      # travels as an output; the upload below reads the same output, so the name
      # is written once. Nothing runs between this hash and that upload.
      - name: Hand the submit job this bundle's name and sha256
        id: bytes
        env:
          AAB: apps/${{ needs.gate.outputs.app }}/build/app/outputs/bundle/release/app-release.aab
        run: |
          set -euo pipefail
          sum="$(sha256sum "$AAB" | cut -d ' ' -f 1)"
          echo "artifact=${APP}-android-play-aab-${ANDROID_SIGNING_POSTURE:?android-signing.mjs exported no posture}" >> "$GITHUB_OUTPUT"
          echo "sha256=${sum}" >> "$GITHUB_OUTPUT"
          echo "${sum}  ${AAB}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.bytes.outputs.artifact }}
          path: apps/${{ needs.gate.outputs.app }}/build/app/outputs/bundle/release/app-release.aab
          retention-days: 7
          if-no-files-found: error
      # why: every run of this lane is recorded, and a rehearsal AS one (O-SUBMISSION-LANE-WITHOUT-RECORDER,
      # assert-publish-records rule 3a): --mode dry-run writes "<app>-android-play-dry-run", which no
      # reader of the production ledger opens, and carries no state, listing or versionCode.
      - name: Record the dry run in the [10]D-9 ledger (mode dry-run)
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node tooling/ci/record-deployment.mjs "${APP}-android-play" --mode dry-run

  submit:
    name: Upload to Google Play (owner-approved)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [gate, dry-run]
    # why: a typed phrase, not a checkbox. This is the only job in the tree that
    # uploads to a public store, and the dispatch default is dry-run-only.
    # why the event conjunct: this lane also runs on a schedule, which must never reach the store
    # (assert-publish-steps-guarded limb (a)).
    if: github.event_name == 'workflow_dispatch' && inputs.confirm == 'SUBMIT-TO-PLAY'
    # why: this line is the owner-approval PAUSE (ADR 031 class A), and on its own it
    # FAILS OPEN -- GitHub creates a referenced environment that does not exist, with
    # no protection rules, and runs. So tooling/release/submit-play.mjs also reads the
    # environment's protection rules at run time, and assert-release-provenance.mjs
    # fails the build for a submit lane that has only one of the two halves.
    environment: store-publish
    permissions:
      contents: read
      checks: read
      deployments: write
    # why: the same checked output the dry-run job read, so both jobs name one app.
    env:
      APP: ${{ needs.gate.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # why: ONLY main SUBMITS, CHECKED BEFORE ANYTHING ELSE RUNS (row
      # O-DEPLOY-IS-NOT-ONE-GATED-LANE, limb 2). `workflow_dispatch` runs on whatever ref
      # the dispatcher picks, and `environment: store-publish` alone fails open (above),
      # so a dispatch from any branch or tag but main exits 1 here. Held FIRST by
      # assert-workflow-hardening limb 10.
      - name: Refuse any ref but main
        run: node tooling/ci/assert-deploy-ref.mjs --allow main
      - name: A real submission must name the listing it will be recorded against
        env:
          LISTING_URL: ${{ inputs.listing_url }}
        run: |
          set -euo pipefail
          case "${LISTING_URL}" in
            https://*)
              echo "⬜ [10]D-9 the submission will be recorded against ${LISTING_URL}"
              ;;
            '')
              echo "FAIL the \`listing_url\` dispatch input is EMPTY, and this job is a REAL upload." >&2
              echo "     [10]D-9: a store record whose listing nobody can open says something shipped and" >&2
              echo "     gives no way to look at it. The [10]D-9 recorder refuses a store environment with" >&2
              echo "     no --listing-url, so this run could upload and then be unable to record what it did." >&2
              echo "     Re-dispatch with listing_url set, e.g." >&2
              echo "       https://play.google.com/store/apps/details?id=<applicationId>" >&2
              exit 1
              ;;
            *)
              echo "FAIL \`listing_url\` is ${LISTING_URL}, which is not an https URL." >&2
              echo "     The ledger row is the ONLY address anybody will have for this submission once the" >&2
              echo "     console is behind an account nobody can open. A value that does not resolve is a" >&2
              echo "     second source of truth, not a record." >&2
              exit 1
              ;;
          esac
      # why: keytool, for the signer check below. No build runs in this job.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      # why: kept with no build to feed: submit-play.mjs --submit reads the four keystore
      # variables and ANDROID_SIGNING_POSTURE this exports, and the signer check below holds
      # that posture to the signature actually on the downloaded bundle.
      - name: Prepare the Android upload key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node tooling/ci/android-signing.mjs --app "$APP"
      # why: O-SUBMIT-LANES-SKIP-PRECONDITION-GATES. A lane green over a name the owner has not HELD
      # or proven free submits one nobody ruled on; limb 3 of assert-publish-steps-guarded.mjs.
      - name: Name clearance holds for android-play (owner HELD or PROVEN-FREE)
        run: node tooling/ci/assert-name-clearance.mjs --for-submission=android-play
      # why: O-BRICK-SWORN-FILES-HAVE-NO-PREVIEW-STATE. A declaration still at "sworn": false is the stamped
      # template: submitting it swears to answers nobody gave. Limb 3 of assert-publish-steps-guarded.mjs.
      # --real-submission (O-APP1-CONSOLE-DECLARATIONS-UNSUBMITTED): this job is the REAL submission, so the app's stores.android-play
      # declaredOn must be a date; the dry-run job's same step omits it and only prints the gap.
      - name: The app's Play declarations are sworn, not preview (--for-submission)
        run: node tooling/ci/assert-sworn-store-files.mjs --for-submission=android-play --app "$APP" --real-submission
      # why: a pending mobile IAP declaration (no RevenueCat apps yet) builds keyless and is never submitted:
      # its paywall cannot buy (O-BRICK-SELLS-NOTHING-IN-A-STORE; tooling/ci/submit-preconditions.mjs).
      - name: A pending in-app purchase declaration is not submitted (android-play)
        run: node tooling/ci/assert-app-yaml.mjs --for-submission=android-play --app "$APP"
      # why: O-SUBMIT-LANES-IGNORE-NATIVE-AUTH. Refused while nativeAuth is false on the production track only: the
      # sign-in proof needs an internal-track upload (PLAY_RECOGNIZED). PLAY_TRACK is the expression the upload reads.
      - name: A build that cannot sign in reaches no public track (android-play)
        env:
          PLAY_TRACK: ${{ inputs.track }}
        run: node tooling/ci/assert-channel-register.mjs --for-submission=android-play --real-submission
      # why: docs/ci/submit-play.md — before step "The versionCode lies above what Play consumed".
      - name: The versionCode lies above what Play consumed
        env:
          RUN_NUMBER: ${{ github.run_number }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          RECORDED="$(node tooling/ci/read-ledger-version-code.mjs "${APP}-android-play")"
          node tooling/ci/assert-app-versioning.mjs --play-floor "$RUN_NUMBER" --app "$APP" --recorded-upload "$RECORDED"
      # why: THE DRY RUN'S BYTES, NOT A REBUILD (O-SUBMIT-REBUILDS-WHAT-THE-DRY-RUN-BUILT):
      # one compile per dispatch. The versionCode is the dry-run job's --build-number,
      # github.run_number, which this job shares. Retention is 7 days and there is no
      # fallback: an approval older than that finds nothing and the job fails.
      - name: Take the dry-run job's bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.dry-run.outputs.artifact }}
          path: apps/${{ needs.gate.outputs.app }}/build/app/outputs/bundle/release
      # why: the value arrives through env:, never interpolated into run: (zizmor).
      - name: The bundle is the one the dry-run job hashed (sha256)
        env:
          EXPECTED_SHA256: ${{ needs.dry-run.outputs.sha256 }}
          AAB: apps/${{ needs.gate.outputs.app }}/build/app/outputs/bundle/release/app-release.aab
        run: |
          set -euo pipefail
          if ! printf '%s' "$EXPECTED_SHA256" | grep -Eqx '[0-9a-f]{64}'; then
            echo "FAIL the dry-run job's sha256 output is '${EXPECTED_SHA256}', not 64 hex digits: nothing to check the download against." >&2
            exit 1
          fi
          printf '%s  %s\n' "$EXPECTED_SHA256" "$AAB" | sha256sum --check --strict -
      - name: The .aab must be signed by the upload key, not the debug key
        run: >
          node tooling/ci/assert-artifact-signed.mjs
          "apps/${APP}/build/app/outputs/bundle/release/app-release.aab"
      - name: The Play screenshot set spans enough device types
        run: node tooling/ci/assert-play-device-coverage.mjs --for-submission=android-play
      - name: Every native library is aligned for a 16 KB memory page
        run: >
          node --single-threaded tooling/ci/assert-elf-page-alignment.mjs
          "apps/${APP}/build/app/outputs/bundle/release/app-release.aab"
      # why: the mapping of the bundle above is the dry-run job's (same build), already in
      # the crash sink from that job. BEFORE the upload, not after: kept again here for
      # 90 days, not 7, because this bundle ships, and a step after a store upload does
      # not run when that upload fails.
      - name: Take the dry-run job's symbols for this bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: symbols-${{ needs.gate.outputs.app }}-android-play-dry-run
          path: apps/${{ needs.gate.outputs.app }}/build/symbols/android-aab
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: symbols-${{ needs.gate.outputs.app }}-android-play
          path: apps/${{ needs.gate.outputs.app }}/build/symbols/android-aab
          retention-days: 90
          if-no-files-found: error
      # why: BEFORE the store upload, and the one copy of this build's mapping that outlives the run: a store
      # serves the build for years and the artifact above expires at 90 days (O-STORE-BUILD-SYMBOLS-EXPIRE-AT-90-DAYS (absent from open.json until the next Private pass records it)).
      # Private R2, keyed symbols/<app>/<channel>/<version>+<build>/; the record below carries its sha256.
      # assert-obfuscation-coupled.mjs limb DURABLE holds it before the `--submit` step.
      - name: Copy this build's symbols to the release store (R2), before the upload
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_RELEASE_ACCESS_KEY_ID: ${{ secrets.R2_RELEASE_ACCESS_KEY_ID }}
          R2_RELEASE_SECRET_ACCESS_KEY: ${{ secrets.R2_RELEASE_SECRET_ACCESS_KEY }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          release_line="$(node tooling/ci/assert-app-versioning.mjs --emit "apps/${APP}" | sed -n 's/^release_line=//p')"
          node tooling/ci/r2-durable-copy.mjs --kind symbols --app "$APP" --channel android-play \
            --version "${release_line}.${RUN_NUMBER}" --build "$RUN_NUMBER" \
            --dir "apps/${APP}/build/symbols/android-aab" --out "${RUNNER_TEMP}/symbols-record.json"
      # why: BEFORE the upload — fails at 80% of the store's stated limit, warns at 2× the median the ledger's
      # earlier records carry (tooling/channel-register.json storeSizeLimit; O-ARTIFACT-SIZES-UNRECORDED (absent from open.json until the next Private pass records it)).
      - name: The android-play artifact is within its store's size limit
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          AAB: apps/${{ needs.gate.outputs.app }}/build/app/outputs/bundle/release/app-release.aab
        run: node tooling/ci/assert-artifact-size.mjs --app "$APP" --channel android-play "$AAB"
      - name: Upload to Google Play
        id: upload
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_TRACK: ${{ inputs.track }}
          RELEASE_STATUS: ${{ inputs.release_status }}
          CONFIRM: ${{ inputs.confirm }}
          GITHUB_TOKEN: ${{ github.token }}
        run: >
          node tooling/release/submit-play.mjs --submit --app "$APP"
          --confirm "$CONFIRM" --status "$RELEASE_STATUS"
      # why: read-after-upload on the versionCode, which androidpublisher returns per
      # track and which the upload itself produced. The snap lane deliberately has no
      # equivalent -- no machine-readable join key exists there; docs/ci/submit-snap.md
      # records why, and warns against copying that exemption onto this lane.
      # why the expectation is RUN_NUMBER and not pubspec's `+N`: the dry-run job's build,
      # whose bytes this job uploads, passes
      # `--build-number=${{ github.run_number }}`, which OVERRIDES pubspec. Reading pubspec
      # here would assert `1` — the versionCode runs 4-5 burnt on 2026-09-22 — and go green
      # against the OLD bundle. So the expectation is read from the same expression the
      # build used; keep the two in step when either changes.
      - name: The Play track must carry the bundle this job just uploaded
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          case "${RUN_NUMBER}" in
            ''|*[!0-9]*)
              echo "FAIL github.run_number is '${RUN_NUMBER}', not a positive integer; the versionCode this job" >&2
              echo "     built cannot be known, so the probe refuses to guess." >&2
              exit 1
              ;;
          esac
          VERSION_CODE="${RUN_NUMBER}"
          APPLICATION_ID="$(node --input-type=module -e '
          import { readFileSync } from "node:fs";
          import { readGradleApplicationId } from "./tooling/ci/read-identity.mjs";
          const rel = "apps/" + process.env.APP + "/android/app/build.gradle.kts";
          const id = readGradleApplicationId(readFileSync(rel, "utf8"), rel);
          if (!id.value) { console.error(id.missing ?? id.lost); process.exit(1); }
          process.stdout.write(id.value);
          ')"
          echo "⬜ [14]O-7 reading the Play track state for ${APPLICATION_ID}, expecting versionCode ${VERSION_CODE}"
          node tooling/ops/post-deploy-smoke.mjs --play-package "${APPLICATION_ID}" --expect "${VERSION_CODE}"
          echo "::notice title=Play versionCode high-water::versionCode ${VERSION_CODE} is consumed. Record it in tooling/channel-register.json android-play.versionCodeHighWater.consumed.${APP}, and the ledger now holds it: the next dispatch stops until consumed is raised to it"
      - name: Record the submission in the [10]D-9 ledger
        if: always() && steps.upload.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          LISTING_URL: ${{ inputs.listing_url }}
          RUN_NUMBER: ${{ github.run_number }}
          RELEASE_STATUS: ${{ inputs.release_status }}
          # why: the bytes the store received, named in the record by sha256 and size (O-STORE-SUBMISSION-RECORD-HAS-NO-DIGEST (absent from open.json until the next Private pass records it)).
          AAB: apps/${{ needs.gate.outputs.app }}/build/app/outputs/bundle/release/app-release.aab
        # why: a DRAFT is uploaded and NOT sent for review (#1099 review, finding 1), so it is recorded
        # `draft_staged`, which [10]D-6's cadence does not count; only the owner's console "send for review"
        # makes it in_review. Two LITERAL calls in one unconditional step, so assert-publish-records grades
        # both states and the step cannot be skipped (rule 6).
        run: |
          set -euo pipefail
          if [ "$RELEASE_STATUS" = draft ]; then
            node tooling/ci/record-deployment.mjs "${APP}-android-play" --state draft_staged --listing-url "$LISTING_URL" --version-code "$RUN_NUMBER" --mode production --artifact "$AAB" --build-number "$RUN_NUMBER" --symbols-record "${RUNNER_TEMP}/symbols-record.json"
          else
            node tooling/ci/record-deployment.mjs "${APP}-android-play" --state in_review --listing-url "$LISTING_URL" --version-code "$RUN_NUMBER" --mode production --artifact "$AAB" --build-number "$RUN_NUMBER" --symbols-record "${RUNNER_TEMP}/symbols-record.json"
          fi
