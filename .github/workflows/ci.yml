      # why: O-NEW-APP-IS-NOT-ONE-COMMAND. Every stamp in this job runs the one
      # command, which runs `mason get` first and exits 1 when its post-conditions
      # (regen.mjs --check, tag-owner.mjs --check, gen-app-licence-rows.mjs --check)
      # fail. stamp-app.test.mjs fails on a workflow that stamps with raw mason
      # instead. Since NP12B-R2 the command also runs `flutter pub get` at the repo
      # root and writes the new app's licence rows from that resolution.
      - name: Stamp the default (client-only) app
        run: |
          export PATH="$PATH:$HOME/.pub-cache/bin"
          node tooling/kit/stamp-app.mjs --vars tooling/bricks/app/_probe_vars.json --overwrite
      - name: Stamped app carries ITS brand assets, not Flutter's
        run: |
          SEED=$(node -p "require('./tooling/bricks/app/_probe_vars.json').seed_hex")
          node --single-threaded tooling/ci/assert-stamp-brand-assets.mjs apps/probe --seed "$SEED"
      # why: O-NEW-APP-IS-NOT-ONE-COMMAND, the probe. stamp-app.mjs's own
      # post-condition is regen.mjs --check, which compares only what ORDER lists:
      # drop a generator from ORDER and the stamp stops writing its output AND the
      # check stops comparing it, so the stamp step stays green. This step
      # re-derives the surface WITHOUT reading ORDER, naming each generator in the
      # sites job's form, and any byte it changes is a stamp that left the tree
      # stale. regen-chain.test.mjs holds this list and ORDER equal, both ways.
      # `git add -A` stages the stamp in the runner's throwaway index, so the diff
      # is only what the generators changed; `git reset -q` then puts the index
      # back, so the `git checkout --` reverts below still restore HEAD.
      - name: A stamp leaves the site surface and the tag filter clean
