name: CI

on:
  push:
    # ALL THREE documented branch prefixes, not just feat/. architecture.md §24
    # defines the convention as `feat|fix|chore/<slug>`, but this list watched
    # only `feat/**` — so every fix/ and chore/ branch got NO CI at all and
    # would reach the `--no-ff` merge unverified. The failure was silent in the
    # worst way: `gh run list` simply returns nothing, which is indistinguishable
    # from "queued" until you notice no run ever appears.
    branches: [main, 'feat/**', 'fix/**', 'chore/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# NOTE (2026-07-22): the Dart/Flutter per-package lanes (flutter/app, core, api_client,
# design_system, telemetry) were RETIRED — `workspace_gate` runs `melos run analyze` +
# `melos run test` across every Dart workspace member in ONE resolution, which fully
# covers them (analyze = dart analyze per member, infos non-fatal; test = dart test for
# pure-Dart members + flutter test for Flutter members). The lanes below are the ones
# workspace_gate does NOT cover: the TS Workers, the Node token/site builds, and the
# brick-stamp validation.

# Least privilege. These jobs only read the repo — they publish nothing through
# GITHUB_TOKEN. Without this every job ran at the repository-default scope, which
# on a public repo is a standing hand-out to any compromised action. [pipeline F-11]
permissions:
  contents: read

jobs:
  subly_api:
    name: subly-api Worker (typecheck + dry-run)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/subly-api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        # persist-credentials: false — actions/checkout otherwise writes GITHUB_TOKEN
        # into .git/config and LEAVES it there for the whole job. Any later step that
        # packages the workspace (or anything containing .git/) ships the token inside
        # the artifact, and on a PUBLIC repo artifacts are downloadable. Nothing here
        # does git push/tag/commit, so none of these checkouts need the credential.
        # [zizmor artipacked] Verified 2026-07-27: no current artifact path includes
        # .git/ — so this closes a FUTURE mistake, not a live leak.
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx wrangler deploy --dry-run

  platform:
    name: platform Worker (typecheck + test + dry-run)
    runs-on: ubuntu-24.04
    # Job-level override of the workflow's `contents: read`. assert-platform-proof-
    # fresh.mjs reads build-platforms.yml's run history, which needs `actions: read`
    # — granted HERE rather than workflow-wide so the other lanes keep the smaller
    # scope. [pipeline F-11] is the principle; F-4 is the reason.
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        working-directory: services/platform
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      # FIRST: prove the guards can still FAIL, before trusting anything they say.
      #
      # Every guard below runs against the real repository — which is valid input
      # by definition — so CI only ever exercises their passing path. A guard that
      # silently stops working still prints "ok", and the requirement it enforces
      # silently stops holding while the spec still reads VERIFIED. Both have
      # already happened here: check-migrations' own coverage assertion omits
      # services/subly-api, and assert-gate-passed shipped an off-by-one that made
      # it unable to read its own SHA and blocked both production deploys.
      #
      # These tests feed each guard known-bad input and assert it fails. Verified
      # by mutation: neutering any of the DROP TABLE / RENAME / NOT NULL rules, the
      # CORS required-origin list, the workspace check, or re-introducing the real
      # off-by-one, each turns this step red. [pipeline F-10]
      - name: The guards must be able to fail
        working-directory: ${{ github.workspace }}
        run: node --test "tooling/ci/test/*.test.mjs"
      # …and every guard must HAVE such a test, plus a self-check that its own
      # scan still reaches what it claims. That was a rule people followed and
      # the accounting rotted: the spec said "5 of 6 guards" while the tree held
      # SEVENTEEN. A count nobody computes is a count that drifts. This is F-9's
      # idea — every unit claimed by a lane — applied to the guards themselves.
      # The two guards that scan nothing are exempt BY NAME AND REASON in the
      # script, never by silent omission. [pipeline F-10]
      - name: Every guard is tested and self-checking
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/assert-guard-coverage.mjs
      # Additive-only schema guard. Lives in this lane (no new lane) but scans
      # EVERY migration set in the repo — one shared platform_db means one
      # destructive migration is a portfolio-wide outage. Runs before the build
      # so a banned statement fails fast.
      - name: Schema evolution is additive-only
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/check-migrations.mjs
      # A Worker whose D1 binding still holds the brick's all-zeros placeholder
      # deploys clean and reaches production pointing at nothing — and
      # `wrangler deploy --dry-run` PASSES on it, because a dry run never
      # contacts D1. That is why S-12's original criterion could not fail.
      # Scoped to services/ so the brick template, which contains the
      # placeholder correctly, is out of scope by construction.
      #
      # The second half has teeth today: subly_db and platform_db are each
      # declared in TWO wrangler configs and nothing checked the uuids agreed.
      # A copy-paste slip there does not error — the Worker deploys, runs, and
      # reads and writes the WRONG database. [pipeline S-12]
      - name: D1 bindings are real and consistent across Workers
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/assert-d1-bindings.mjs
      # The CORS allowlist is EXACT, so it fails closed and silently — dropping
      # an origin breaks that surface in the browser with nothing logged server
      # side. This guards the deployed config; cors.test.ts guards the behaviour.
      - name: CORS allowlist still covers every origin in use
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/assert-cors-allowlist.mjs
      # Every deployable unit must be claimed by some lane. The lane list is
      # hand-written and nothing checked it was complete, so a new Worker, site
      # or package was checked by nothing while CI still went green. Coverage is
      # asserted PER TYPE — dart packages via melos membership, everything else
      # by being named in a workflow. [pipeline F-9]
      - name: Every deployable unit is claimed by a lane
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/assert-lane-coverage.mjs
      # A commit must resolve the same dependencies twice. `npm install` takes
      # whatever is newest inside a caret range, so the dry-run that "proved" a
      # Worker deploy and the deploy itself resolved independently, minutes apart
      # — and the winner of that race is what reached production. [pipeline F-8]
      - name: Dependency resolution is reproducible
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/assert-lockfile-discipline.mjs
      # CI's own inputs. A tag is a movable label the action's owner can re-point;
      # a 40-char SHA cannot move. tj-actions/changed-files reached ~23k repos in
      # March 2025 by exactly that route, and e2e.yml runs nightly holding the
      # Supabase service-role key. [pipeline F-11]
      - name: Workflows are SHA-pinned and least-privilege
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/assert-workflow-hardening.mjs
      # A green tick must mean the work RAN. Two ways it did not, both live until
      # 2026-08-01: (A) `ci-gate` — the check assert-gate-passed.mjs polls before
      # every production deploy, and the one branch protection reads — tested
      # only 'failure' and 'cancelled', so a lane carrying a job-level `if:`
      # would report `skipped` and hand both deploys a green verdict over a lane
      # that never ran; the identical fix landed in build-platforms.yml on
      # 2026-07-31 and stopped there. (B) e2e.yml gated all nine real steps on a
      # secret-presence preflight, so a rotated key turned the nightly live proof
      # into a green run that executed one echo — and its `failure()`-gated alert
      # could not fire on it. Both aggregators are NAMED targets here: renaming
      # one is COVERAGE LOST, not a quiet pass. [pipeline F-5a, F-10]
      - name: A green tick means the work ran
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/assert-green-means-ran.mjs
      # The 6-platform claim must be proven AND RECENT. build-platforms.yml ran
      # only on dispatch or a release tag, so the green tick was undated — found
      # eight commits stale, and fresh again only because someone clicked it by
      # hand. A weekly cron is half the fix; this age check is the half that makes
      # it honest, because a cron that quietly stopped looks exactly like a
      # healthy one. Fails closed: no token, an API error or zero green runs are
      # all failures, since "I could not tell" must never read as "it is fine".
      # Cost accepted: ci-gate now depends on one API call, so a GitHub hiccup can
      # fail a build. A re-run fixes that; an undated platform claim does not.
      # [pipeline F-4]
      - name: The 6-platform proof is fresh
        working-directory: ${{ github.workspace }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tooling/ci/assert-platform-proof-fresh.mjs
      # One declaration for every build version. Before this, "3.44.8" appeared in
      # six places and node 24 in eight; wsl-setup.sh carried the comment "keep in
      # lockstep with *.yml", i.e. maintained by hope. The guard compares PARSED
      # values, so it can see the site that drifted. [pipeline F-2]
      - name: Build versions all match versions.json
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/assert-version-consistency.mjs
      # The app's OWN version, distinct from the build-tool versions above. It sat
      # at 1.0.0+1 from the first deploy with nothing able to raise it, which left
      # the CFG-1 force-update kill-switch inert on the only live channel — the
      # gate compares major.minor.patch, and a frozen patch means no reachable
      # floor. [pipeline stage 9]
      - name: The app version is derived and monotonic
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/assert-app-versioning.mjs
      # NINE acceptance criteria across stages 9 and 10 quantified over "the
      # served set" and the served set did not exist — so all nine reported clean
      # over an undefined right-hand side, forever. R-5's own criterion was
      # vacuous in BOTH directions: zero release jobs on one side, one uncontested
      # row on the other, so no mismatch was reachable. The register is now
      # anchored to a set that is already maintained and already public
      # (sites/_shared/_data/apps.json), and `served` is the gate: adding
      # "windows" to an app's platforms array fails here today, because both
      # windows rows exist and neither is served. Also checks the aggregating
      # job's `needs` still lists every job in its workflow — the "never a partial
      # set" half, and the way a newly added platform silently stops being
      # required. Owner-gated gaps PRINT (Apple's unpinned Xcode 26 floor,
      # the undrilled pack key, Flathub still open in OWNER_QUEUE).
      # [pipeline R-5, feeding R-3/R-4/R-6 and D-1/D-4/D-5/D-9/D-10]
      - name: Every claimed channel is a served channel
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/assert-channel-register.mjs
      # The public half of the same question. A store button with nothing behind
      # it is a promise made to a stranger, and it rots into a lie with nobody
      # editing it — four Flathub tells sat on two live sites for seven weeks
      # after [ADR 015] permanently disqualified the channel, and one of them was
      # in the per-app template [12]W-1 generates from, so it was an INSTRUCTION.
      # 🔴 THIS GUARD SCANS RAW TEXT, comments included, and that inversion of the
      # house rule is deliberate: the Flathub tell lived inside the /* */ block a
      # human copies to add an app, so a comment-stripping version would go green
      # on the exact line it exists to catch. Its header says so; do not "fix" it.
      # Affordances BLOCK only when the destination is REAL — a placeholder is
      # scaffolding, not a promise — while a disqualified channel's tells block
      # everywhere, placeholder or not. Platform-count prose PRINTS: site copy is
      # the owner's voice, and a guard that edits marketing gets switched off.
      # [pipeline D-1 limb (ii), D-7 sites half]
      - name: No public surface advertises an unserved or dead channel
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/assert-channel-claims.mjs
      # The third member of the same family, and the one that keeps the LISTING
      # honest rather than the claim. D-5's own criterion ranged over "any app
      # whose apps.json entry claims a store channel" — an antecedent no app can
      # ever satisfy, because post_gen.dart writes platforms: ['web'] as a literal
      # constant. Empty antecedent, vacuously true, forever. So the expected set
      # is computed instead: { kind:"store" rows } × { apps }, a RELATIONSHIP that
      # grows with the register and that nobody can lower by editing a number.
      # Owner-gated gaps PRINT (four store channels have no account and no tree),
      # but a tree that EXISTS must stay complete and stay derived from its spec
      # source — deleting apps/subly/store/windows-store/title.txt, emptying a
      # field, or forking a listing away from apps.json fails the build. Also
      # compares the MSIX package identity the register declares to the one
      # apps/*/pubspec.yaml actually packages with; two copies of an identity is
      # how the wrong one ships, and an MSIX published under the wrong identity
      # cannot be taken back. [pipeline D-5, feeding D-10]
      - name: Every declared store channel has a complete, spec-derived listing
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/assert-store-metadata.mjs
      # [pipeline D-10] limb (i)'s script, exercised on EVERY push rather than
      # only when somebody dispatches submit-windows-store.yml. A release script
      # nobody runs rots exactly like a guard nobody feeds bad input to: it would
      # sit in tooling/release/ satisfying "a submission script exists" while
      # having stopped working, and the first person to find out would be the one
      # submitting. `--allow-missing-artifact` because no .msix exists on an
      # ubuntu runner — that flag makes the script SAY it validated the listing
      # and not the package, which is the difference between a scoped check and a
      # silent one. The full version, with a real .msix, is the windows job in
      # submit-windows-store.yml. Nothing here contacts Microsoft; `--submit`
      # refuses before it does anything at all.
      - name: The Microsoft Store submission path still walks (dry run)
        working-directory: ${{ github.workspace }}
        run: node tooling/release/submit-windows-store.mjs --dry-run --app subly --allow-missing-artifact
      # Both mechanisms this asserts already exist and are VERIFIED (F-5b); what
      # was missing was CALL SITES. R-6's own criterion ranged over "the release
      # lane", which referred to nothing — so the set is derived from what a lane
      # DOES: a `flutter build … --release` step, or a step that hands an artifact
      # to something outside the run. build-platforms.yml failed this on the first
      # run with six release builds, zero gate check and zero marker; it now gates
      # once in a shared `gate` job that all three platform jobs need.
      # ⚠️ COMMENTS ARE STRIPPED HERE — the opposite of assert-channel-claims.mjs,
      # and both are right: there the comment was the payload, here deploy-web.yml
      # explains IN PROSE why it calls both scripts, so a raw match would call a
      # lane gated on the strength of a comment describing the gate.
      # `--dry-run` is not a publish: ci.yml typechecks both Workers with
      # `wrangler deploy --dry-run` and nothing leaves the runner.
      # [pipeline R-6, feeding [10]D-9]
      - name: No release build from an ungated commit, no publish unrecorded
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/assert-release-provenance.mjs
      # A fail-closed seam with no on-switch is a dead feature that reports
      # healthy. Four shipped that way — the analytics rail discarded every event
      # because nothing ever recorded consent, and no test went red because
      # refusing was what they all asserted. Also pins the app's claimed privacy
      # policy version to the published one, so a consent artifact can never name
      # a policy the user was not shown. [pipeline C-6]
      - name: Fail-closed seams have a real on-switch
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/assert-seams-wired.mjs
      # A capability with no declared home is how THREE notification
      # implementations got written — nobody set out to write three, there was
      # just no place to look that would have said one already existed. And a
      # package nobody consumes is not delivered: it costs a pubspec, an
      # analysis_options, a workspace entry, a test harness and a CI surface,
      # forever, for one founder. C-2 shipped its fix at 5f3466b with this guard
      # never written, so the tree was correct and unprotected. Checks the
      # register against the tree in BOTH directions, so it cannot drift into
      # fiction. [pipeline C-1, C-2]
      - name: Every shared capability has one home and a real consumer
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/assert-capability-register.mjs
      # The companion to the step above, and deliberately not folded into it: that
      # guard verifies `consumers` against real pubspecs in both directions, which
      # proves a package was DOWNLOADED and never that a line of it runs. Every
      # capability the stamp declares could resolve, analyze and ship with no call
      # site at all and it would stay green. S-2's own acceptance criterion was
      # written as "for every register entry flagged `brick-wired`" — a flag that
      # exists nowhere in the register, so the set was empty, the check vacuously
      # true, and it would have passed while wiring nothing. The set is derived
      # from `consumers` instead, and the coverage floor is a RELATIONSHIP to the
      # stamp's own pubspec rather than a number somebody can lower.
      # [pipeline S-2]
      - name: A stamped app CALLS every capability it declares
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/assert-stamp-wiring.mjs
      # A fork in the TEMPLATE is not one bad app -- it is every app the factory
      # will ever stamp, born wrong. Proven 2026-07-28: a fork planted there
      # passed all three existing guards. Matches on what a class IMPLEMENTS as
      # well as what it is CALLED, because a renamed fork is still a fork; and
      # distinguishes a fork (a shared version exists) from a homeless sole
      # implementation (C-15's problem, printed not failed). [pipeline C-3, C-9]
      - name: No capability exists twice, in an app or the template
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/assert-no-seam-forks.mjs
      # Shared code that names one app stops being shared: app #2 inherits a rule
      # about a product it is not. Comments are EXEMPT and code is scanned --
      # measured 2026-07-28, all 8 current "Subly" mentions in packages/ are
      # comments, so scanning them would fire 8 false alarms on day one and the
      # guard would be switched off. App names derive from apps/ on disk.
      # [pipeline C-10]
      - name: Shared code carries no app-specific vocabulary
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/assert-no-clone-tells.mjs
      # Checks IMPORTS, not only pubspecs, and that is the whole point. Every
      # package here sets `resolution: workspace`, and pub workspaces share ONE
      # package config -- so a member can import anything any other member
      # depends on, with no dependency of its own. Proven on the real tree
      # 2026-07-28: Flutter imported into pure-Dart core, and core imported into
      # design_system, BOTH with pubspecs untouched, and `dart analyze` exited 0
      # for each (the only complaint is the INFO depend_on_referenced_packages,
      # which this workspace keeps non-fatal on purpose). C-5's original
      # pubspec-only criterion could not have failed. [pipeline C-5]
      - name: Core stays pure, the design system stays domain-free, apps use the seams
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/assert-package-boundaries.mjs
      # A package is EARNED, never named -- a native payload, a licence exposure
      # or a codegen step. A capability name is not a reason: followed loosely,
      # the remaining gap list alone would spawn six more packages, each costing
      # a pubspec, an analysis_options, a workspace entry, a test harness and a
      # CI surface forever, for one founder. Free text was rejected at lock time
      # because a justification nobody can check always passes, so every reason
      # must SUBSTANTIATE itself against the tree -- the cited dependency really
      # declared, the cited build file really present. Measured 2026-07-28: 4 of
      # 8 packages substantiate, 4 are grandfathered with dates. [pipeline C-4]
      - name: Every package is earned, or dated
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/assert-package-earned.mjs
      # SIX checklist parts per vendor, not "behind a seam" alone -- a seam alone
      # LOOKS like portability while a swap still needs a store release. Four
      # parts are checked against the tree and BLOCK; two are judgement and
      # PRINT, because a guard that pretends to check judgement always passes.
      # Surfaces are DERIVED from four sources, and any one alone is blind
      # (all verified 2026-07-28): a MULTILINE dart-define scan (a line-based
      # grep finds 2 of the 11 that exist, and misses UPDATE_URL), the Worker
      # `Env` (REVENUECAT_WEBHOOK_SECRET lives only there, so RevenueCat is
      # otherwise invisible), wrangler `binding` keys AND `ratelimits[].name`
      # (that block keys on `name`, so EVENTS_LIMITER is invisible to a
      # binding-only scan), and `triggers.crons`. Its first run failed on the
      # real tree on exactly what the lock predicted. [pipeline C-8]
      - name: Every vendor satisfies the portability checklist
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/assert-vendor-portability.mjs
      # ONE convention set, inherited everywhere -- the only place in the factory
      # where a single edit reaches 50 apps, and therefore the only place where a
      # silent break costs 50 apps. It was 0 OF 10: every analysis_options.yaml
      # included flutter_lints directly and `nikatru_lints` was inherited by
      # nobody, its one mention of its own include sitting inside a COMMENT. The
      # brick shipped ONE line while apps/subly carried strict-casts and
      # avoid_print, so every stamped app was born with LESS checking than the
      # only app that existed.
      #
      # Checks SEVERITY as well as presence, settled by live spike on a real
      # stamp: inheriting at default severity makes the rules fire as INFO and
      # `flutter analyze --no-fatal-infos` still EXITS 0 -- inheritance working
      # and enforcing nothing. [pipeline C-12]
      - name: One convention set reaches every app, and can fail a build
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/assert-lint-inheritance.mjs
      # DoD §4-E: zero hardcoded user-facing strings. A string baked into a
      # widget cannot be translated, and retrofitting l10n across 50 shipped
      # apps is the expensive path (architecture.md §16) -- so the brick, which
      # every stamped app inherits, is where this is nearly free.
      #
      # A CI guard rather than a custom lint, on two CHECKED facts: custom_lint
      # does NOT run under `dart analyze` (its own docs say so, and it needs
      # `dart run custom_lint`), so it would need its own CI step exactly like
      # this one; and it is a new package that earns none of C-4's three
      # structural reasons, so it would arrive grandfathered.
      #
      # Carries a CANARY: the brick is clean, so enforcement passes over an empty
      # set, which is indistinguishable from matchers that have stopped matching.
      # They are re-proven every run against apps/subly, a tree known to be full
      # of violations and excluded from enforcement because it is frozen.
      # [pipeline C-12]
      - name: No hardcoded user-facing strings in the brick
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/assert-no-hardcoded-strings.mjs
      # G-17 sat on the gap list from the beginning with no owner. Every adapter
      # must publish where it works and degrade rather than crash -- this is what
      # makes the "six platforms" claim honest at the CAPABILITY level, not just
      # the builds-green level F-4 covers. An app that builds on Windows, never
      # fires a reminder, and reports nothing when it dies natively is passing CI
      # and failing the user.
      #
      # Each matrix must cover all six platforms, take the platform as a
      # PARAMETER (a matrix only evaluable on the host leaves five of six rows
      # unreachable from a test), name what it was verified against, and be
      # exercised by its own test. [pipeline C-7]
      - name: Every adapter declares where it works
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/assert-adapter-capabilities.mjs
      # The non-app-specific screen set, DECLARED and checked. "Present" and
      # "reachable" are separate assertions because this repo has shipped the
      # difference three times with everything green: ConsentController.record
      # with zero call sites, PaywallGate with zero consumers, and an
      # account-deletion button whose confirm action was Navigator.pop and
      # nothing else. A screen nothing reaches is not a screen.
      #
      # A `blocked` entry's blocker is itself re-checked, so "blocked by stage 5"
      # cannot outlive stage 5. TODO screens are counted and printed rather than
      # forgotten. [pipeline C-13]
      - name: The inherited screen set is declared, present and reachable
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/assert-screen-set.mjs
      # Repo-side secret scanning. GitHub's push protection only matches KNOWN
      # PROVIDER patterns, and `non_provider_patterns` is off — so the secrets
      # this project actually holds (the rclone crypt password, a pasted PEM, any
      # bespoke token) are exactly the class it cannot see.
      #
      # Version PINNED and the tarball CHECKSUM-VERIFIED before it is unpacked,
      # for the same reason every action is SHA-pinned (F-11) — except here we can
      # check the actual bytes rather than trust a ref.
      #
      # scan-secrets.mjs then SELF-TESTS before it scans: it plants a known secret
      # and asserts the scanner still flags it. A scanner that quietly stopped
      # detecting would otherwise report "clean" forever. [pipeline F-6]
      - name: Install gitleaks (pinned + checksum-verified)
        working-directory: ${{ github.workspace }}
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          set -euo pipefail
          # Into RUNNER_TEMP, never the workspace: a binary sitting in the repo
          # would then be scanned by the very step that follows.
          tarball="${RUNNER_TEMP}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          wget -q -O "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" -C "${RUNNER_TEMP}" gitleaks
          "${RUNNER_TEMP}/gitleaks" version
      - name: Secret scan (self-tests, then scans)
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/scan-secrets.mjs . --gitleaks "${RUNNER_TEMP}/gitleaks"
      # Static analysis of CI's OWN workflows. SHA-pinning closed the movable-tag
      # hole; it says nothing about attacker-controlled text expanded into a
      # `run:` block, a pull_request_target that checks out the PR head, or a
      # permission granted workflow-wide that one job needs. `39-CHASSIS` §4 cut 14
      # keeps exactly two things out of G-47 — SHA-pinning (shipped) and this.
      # Same discipline as gitleaks above: pinned version, bytes checksum-verified
      # rather than a ref trusted, unpacked into RUNNER_TEMP so the binary is not
      # sitting in the tree the next step scans. [pipeline F-11]
      - name: Install zizmor (pinned + checksum-verified)
        working-directory: ${{ github.workspace }}
        env:
          ZIZMOR_VERSION: '1.28.0'
          ZIZMOR_SHA256: 'e87b67160194884e375a46a12c57ccc904f762b53845f254fab7f17d98809c09'
        run: |
          set -euo pipefail
          tarball="${RUNNER_TEMP}/zizmor_${ZIZMOR_VERSION}_linux_x64.tar.gz"
          wget -q -O "$tarball" \
            "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ZIZMOR_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" -C "${RUNNER_TEMP}" zizmor
          "${RUNNER_TEMP}/zizmor" --version
      # Gates on HIGH severity AND HIGH confidence only. Unfiltered this repo
      # returns 77 findings, mostly low-confidence cache-poisoning notes about
      # setup-node's default cache — and a guard that cries wolf 77 times is one
      # somebody switches off. Everything below the gate is PRINTED on every run,
      # so nothing is hidden; it just does not block. Self-tests against a
      # deliberately vulnerable workflow before it trusts a clean result.
      - name: Workflow static analysis (self-tests, then scans)
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/scan-workflows.mjs . --zizmor "${RUNNER_TEMP}/zizmor"
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npx wrangler deploy --dry-run

  tokens:
    name: Site design tokens (build + drift)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/tokens
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      # Guards the file the SITES ACTUALLY SERVE, not a build/ artifact nobody
      # read. Until 2026-07-26 this checked packages/tokens/build/, while
      # sites/_shared/assets/tokens.css was a separate hand-maintained copy —
      # so editing tokens/color.json changed nothing, and CI still passed.
      - name: Site tokens.css must equal a fresh build
        run: git diff --exit-code -- ../../sites/_shared/assets/tokens.css

  site_shared:
    name: Shared site build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: sites/_shared
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build

  app_brick:
    name: App brick (stamp both variants + analyze + validate the clone contract)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.44.8
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      # PINNED. This was `activate mason_cli` with no version, taking whatever was
      # newest on every run — and mason is what STAMPS APPS, so the factory's own
      # product could differ between runs with nothing in the repo to explain it.
      # Version declared in tooling/versions.json. [pipeline F-2]
      - name: Install mason_cli
        run: dart pub global activate mason_cli 0.1.3

      # ── Variant 1: the DEFAULT stamp — client-only (needs_backend=false).
      # This is what almost every app gets, so it is the one that must not rot.
      - name: Stamp the default (client-only) app
        run: |
          export PATH="$PATH:$HOME/.pub-cache/bin"
          # [pipeline S-13] The stamp now REFUSES to overwrite an existing app.
          # CI re-stamps the same throwaway probe on every run, which is exactly
          # the case the refusal is not about, so the escape hatch is set here
          # and ONLY here. It is an env var rather than a flag so that a human
          # cannot pass it by muscle memory.
          export NIKATRU_ALLOW_OVERWRITE=1
          mason get
          mason make app -c tooling/bricks/app/_probe_vars.json -o . --on-conflict overwrite
      # [pipeline S-7a] STAMPED TWICE, ON PURPOSE. post_gen carries two
      # skip-if-already-present branches — one in _appendToAppsJson, one in
      # _registerInWorkspace — and until now CI stamped exactly ONCE, so neither
      # branch had ever executed. That is untested code sitting in the path that
      # protects the public catalogue and the workspace gate from duplicates.
      # Byte-identical after the second stamp is what makes idempotency
      # OBSERVABLE rather than merely asserted in a comment.
      # [pipeline S-14] The brick used to ship Flutter's stock icons, so every
      # stamped app was born with the default icon — DoD §4-G's defect, but in
      # the TEMPLATE, where it lands on all fifty apps at once and store
      # reviewers see it first. post_gen now GENERATES the icons from app_id +
      # seed_hex (no model, so [ADR 019]'s NO-IP-PROMPTING rule is obeyed by
      # construction), and this proves the stamp did it.
      #
      # Compared against the LIVE SDK's stock assets, never pinned hashes: a
      # hash list rots silently when Flutter changes its defaults, and the guard
      # would go on reporting ok while stamping stock icons again. It runs HERE
      # rather than beside the static guards because this is the lane with
      # Flutter on PATH — and it exits COVERAGE LOST rather than skipping if it
      # cannot find the SDK, so "I could not check" never reads as "ok".
      #
      # The seed is read from the probe's own vars file so the assertion cannot
      # drift from the spec it is checking.
      #
      # 🔴 ORDERING IS LOAD-BEARING: this runs BEFORE the SHOW-1 step, which
      # reverts sites/_shared/_data/apps.json to keep the tree clean. The asset
      # set is derived from the app's platform CLAIM, and the claim lives in that
      # file — so after the revert there is nothing to derive from. Placed after
      # it once; the guard exited COVERAGE LOST rather than passing on an empty
      # requirement, which is the whole reason it refuses an empty claim.
      - name: Stamped app carries ITS brand assets, not Flutter's
        run: |
          SEED=$(node -p "require('./tooling/bricks/app/_probe_vars.json').seed_hex")
          node tooling/ci/assert-stamp-brand-assets.mjs apps/probe --seed "$SEED"
      - name: SHOW-1 — probe is in apps.json, and a RE-STAMP changes nothing
        run: |
          export PATH="$PATH:$HOME/.pub-cache/bin"
          export NIKATRU_ALLOW_OVERWRITE=1
          grep -q '"slug": "probe"' sites/_shared/_data/apps.json
          cp sites/_shared/_data/apps.json "$RUNNER_TEMP/apps-after-1.json"
          cp pubspec.yaml "$RUNNER_TEMP/pubspec-after-1.yaml"
          mason make app -c tooling/bricks/app/_probe_vars.json -o . --on-conflict overwrite
          # diff, not `grep -c`: a second `probe` row and a missing one both fail
          # a count check for opposite reasons, and only the diff says which.
          diff -u "$RUNNER_TEMP/apps-after-1.json" sites/_shared/_data/apps.json
          diff -u "$RUNNER_TEMP/pubspec-after-1.yaml" pubspec.yaml
          git checkout -- sites/_shared/_data/apps.json
      # THE CLONE CONTRACT, asserted rather than documented. A default stamp
      # that quietly regains a Worker/D1/R2 is how the portfolio walks back
      # into the 10-database free-tier ceiling. Checks are structural (the
      # config is parsed, not grepped) — see the script header for why.
      - name: Default stamp claims NO Worker, NO D1 and NO R2
        run: node tooling/ci/assert-clone-contract.mjs --client probe
      # 🔴 THE STAMP CAN BE GREEN AND STILL SHIP THE WRONG TEXT. mason renders
      # every DOUBLE stache HTML-escaped (& < > " ' /), so a display name with
      # an apostrophe stamped `Probe&#x27;s` into the Dart appName const, the ARB
      # app title, the PWA install name and the pubspec — output that compiles,
      # analyzes, formats and tests clean while the OS window title is corrupt.
      # And a BLANK `subdomain`/`api_domain` — the input pre_gen documents as
      # normal ("or empty to derive") — was interpolated as nothing, stamping
      # `"https://"` into ALLOWED_ORIGINS and _phApiBase.
      #
      # Both probe vars files now carry `& ' / "` in their free text and leave a
      # derivable host BLANK, and the guard refuses to run (COVERAGE LOST) if a
      # future edit takes either away — an escape-free probe is precisely why
      # this lane could not catch the defect before.
      - name: Stamped text is the spec's, and blank hosts were DERIVED
        run: node tooling/ci/assert-stamp-text-fidelity.mjs --vars tooling/bricks/app/_probe_vars.json
      # A stamped app must be born `dart format`-clean. Every app in the
      # portfolio starts as a copy of this output, so template dirt is dirt in
      # all of them at once — and it makes adding a repo-wide format gate
      # impossible for as long as it lasts. Cheap to hold, expensive to reclaim.
      - name: Stamped app is dart format-clean
        run: dart format --output=none --set-exit-if-changed apps/probe
      # The stamp lane used to assert only that the app COMPILES and its tests
      # pass, so anything merely ABSENT sailed through: themeMode appeared zero
      # times repo-wide, Semantics( zero times, and the account-delete button
      # called Navigator.pop and nothing else. All three were green. The
      # assertions now live in the brick template so every stamped app inherits
      # them for life; this guard stops that file quietly vanishing, because
      # vanishing looks exactly like passing. [pipeline C-16]
      - name: The app spec is one validated input contract
        run: node tooling/ci/assert-input-contract.mjs
      # [pipeline S-3 / S-4] The claim and the proof come from the same place,
      # and the new app joins the workspace that checks it.
      - name: A stamped app claims only platforms it is built for
        run: node tooling/ci/assert-stamp-platforms.mjs
      - name: Stamped app asserts its own chassis properties
        run: node tooling/ci/assert-stamp-properties.mjs
      - name: Analyze + test the stamped app
        working-directory: apps/probe
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test
      # 🔴 [pipeline S-3] THE CLAIM, PROVEN. Until this step existed, every
      # stamped app told the public catalogue it "works on web" while the
      # template stamped no platform folder at all — so `flutter build web`
      # failed immediately on a fresh stamp and nothing ever ran it. Analysis and
      # tests passed throughout, because neither needs a platform folder.
      #
      # NO `flutter create` REPAIR STEP MAY BE ADDED HERE. Needing one is the
      # defect; the stamp must produce a buildable app on its own.
      - name: A fresh stamp really builds for every platform it claims
        working-directory: apps/probe
        run: flutter build web --pwa-strategy=none

      # ── Variant 2: the OPT-IN backend stamp (needs_backend=true). Rarer, but
      # it still has to typecheck and deploy-dry-run.
      - name: Stamp the opt-in backend app
        run: |
          export PATH="$PATH:$HOME/.pub-cache/bin"
          export NIKATRU_ALLOW_OVERWRITE=1
          mason make app -c tooling/bricks/app/_probe_backend_vars.json -o . --on-conflict overwrite
          git checkout -- sites/_shared/_data/apps.json
      - name: Backend stamp has a Worker + APP_DB but still no per-app R2
        run: node tooling/ci/assert-clone-contract.mjs --client probe --backend probeapi
      # The backend probe stamps with BOTH hosts blank, so this is the run that
      # proves the stamped Worker's own ALLOWED_ORIGINS is a real origin rather
      # than the bare `https://` the derive path used to produce — an allowlist
      # matching nothing, which `cors.ts` cannot even fall back from because
      # "https://" is not empty. It fails as a browser CORS error with no
      # server-side trace, so nothing downstream would ever have reported it.
      - name: Backend stamp derived its own web origin and API host
        run: node tooling/ci/assert-stamp-text-fidelity.mjs --vars tooling/bricks/app/_probe_backend_vars.json --service services/probeapi-api
      - name: Stamped backend app is dart format-clean
        run: dart format --output=none --set-exit-if-changed apps/probeapi
      - name: Analyze the stamped backend app
        working-directory: apps/probeapi
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test
      # ⚠️ THE ONE DELIBERATE EXCEPTION to F-8's `npm ci` / `--enforce-lockfile`
      # rule, and it is stated here rather than left to look like an oversight.
      #
      # apps/probe, apps/probeapi and services/probeapi-api are stamped fresh by
      # mason seconds earlier. A freshly stamped app HAS no lockfile, so `npm ci`
      # and `--enforce-lockfile` would both fail by definition. These three
      # installs are a bootstrap, not a reproducible build, and they ship nothing.
      #
      # assert-lockfile-discipline.mjs allows exactly these paths and fails on any
      # other non-reproducible install. If the brick ever ships lockfiles in its
      # template, delete the exception rather than widening it. [pipeline F-8]
      - name: Typecheck + dry-run the stamped service
        working-directory: services/probeapi-api
        run: |
          npm install
          npx tsc --noEmit
          npx wrangler deploy --dry-run

  sites:
    name: Static sites (functions parse + required files)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # sites/nikatru and sites/rajasekarselvam are deployed by CLOUDFLARE's own
      # Git integration on every push to main — no workflow involved, and
      # Cloudflare cannot read a GitHub check. Until this lane existed nothing in
      # the repo so much as parsed them, including a Pages Function holding a live
      # KV binding that stores email signups.
      #
      # Cloudflare still cannot be gated. The protection is indirect: with `main`
      # protected (F-5a), code that cannot pass this lane cannot reach `main`, and
      # therefore cannot reach Cloudflare. [pipeline F-9]
      #
      # The two site paths are ARGUMENTS, not decoration (2026-08-01 review):
      # assert-lane-coverage.mjs now ignores comments, so this run line is the
      # sites' one structural claim to CI coverage — and the script fails if a
      # claimed root is not really among the deploy roots it scans, so the claim
      # cannot drift from the checking.
      - name: Site integrity
        run: node tooling/ci/check-site-integrity.mjs . sites/nikatru sites/rajasekarselvam
      # [pipeline S-7a] apps.json is PUBLIC, so a `live` entry is a promise to a
      # stranger that the link works. Under the wildcard `*.nikatru.com` ([ADR
      # 006]) every name resolves and almost every name fails — measured
      # 2026-07-29, `lingo.nikatru.com` and `zzz-nonexistent-app.nikatru.com`
      # both answer 522 while `subly.nikatru.com` answers 200. So "it resolves"
      # proves nothing and only the RESPONSE counts. `[3]S-7` asserts the stamp
      # WRITES the catalogue; until now nothing asserted anyone could open what
      # it wrote.
      - name: Catalogue advertises no dead app
        run: node tooling/ci/assert-catalog-reachable.mjs

  workspace_gate:
    name: Workspace gate (melos analyze + test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Runs BEFORE melos: the gate below can only report on packages it is told
      # about, so an ungated package must fail here rather than pass silently.
      # [pipeline F-1]
      - name: Assert workspace coverage
        run: node tooling/ci/assert-workspace-coverage.mjs
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.44.8
      - name: Activate melos
        run: dart pub global activate melos 8.2.2
      # Flutter members require the Flutter tool for root workspace resolution
      # (plain `dart pub get` cannot resolve `sdk: flutter` dependencies).
      - name: Resolve the workspace
        run: flutter pub get --enforce-lockfile
      - name: melos run analyze
        run: |
          export PATH="$PATH:$HOME/.pub-cache/bin"
          melos run analyze
      - name: melos run test
        run: |
          export PATH="$PATH:$HOME/.pub-cache/bin"
          melos run test

  # 🔴 THE ROOT OF TRUST. `assert-gate-passed.mjs` reads THIS job's check-run
  # conclusion and nothing else, and deploy-web, deploy-workers and
  # build-platforms all refuse to run until it says success — so whatever this
  # job is willing to call green is, transitively, what reaches production.
  # Branch protection reads the same check.
  #
  # Its contract is asserted structurally by `assert-green-means-ran.mjs` §A,
  # which names BOTH aggregators in the repo (this job and build-platforms'
  # `all_platforms`) as targets: the `needs` list must name every other job in
  # the file, `if: always()` must survive, the three non-green verdicts must
  # each be tested with a real `contains(needs.*.result, …)` expression, the
  # body must exit non-zero, the echo must name every lane, and no lane may
  # carry a job-level `if:`. Renaming or deleting this job is COVERAGE LOST
  # there, not a quiet pass. (assert-channel-register.mjs §6 independently
  # covers `all_platforms` via the channel register's `aggregatingJob` pointer;
  # two guards over one job is redundancy, not a conflict.)
  ci-gate:
    name: ci-gate
    runs-on: ubuntu-24.04
    needs: [subly_api, platform, tokens, site_shared, app_brick, sites, workspace_gate]
    # LOAD-BEARING. Without `always()` this job inherits the default `success()`
    # and would itself report SKIPPED whenever a lane failed — and GitHub counts
    # a skipped required check as SATISFIED, so branch protection would go green
    # over a red tree. The verdict logic below only means anything because this
    # job runs no matter what its lanes did.
    if: always()
    steps:
      - name: Require all lanes green
        run: |
          echo "subly_api=${{ needs.subly_api.result }} platform=${{ needs.platform.result }} tokens=${{ needs.tokens.result }} site_shared=${{ needs.site_shared.result }} app_brick=${{ needs.app_brick.result }} sites=${{ needs.sites.result }} workspace_gate=${{ needs.workspace_gate.result }}"
          # 🔴 'skipped' IS A VERDICT, NOT AN ABSENCE — added 2026-08-01, the
          # same fix build-platforms.yml's aggregator got on 2026-07-31 and this
          # one did not. One added line — a paths filter to shave the ~6-minute
          # app_brick lane, or `if: github.event_name != 'pull_request'` — would
          # otherwise report the lane as `skipped`, neither of the other two
          # clauses would fire, and ci-gate would conclude SUCCESS over a commit
          # whose brick/stamp lane never ran. Both production deploys would then
          # proceed on that verdict. A lane that did not run has not passed.
          #
          # `sites` was also missing from the echo above, so the line a human
          # reads under-reported coverage (6 of 7) even though contains() saw it.
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ] || [ "${{ contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "::error::One or more CI lanes failed, was cancelled, or never ran — see the verdicts above"; exit 1
          fi
          echo "All lanes green"
