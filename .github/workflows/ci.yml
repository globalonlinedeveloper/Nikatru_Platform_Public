name: CI

on:
  push:
    # ALL THREE documented branch prefixes, not just feat/. architecture.md §24
    # defines the convention as `feat|fix|chore/<slug>`, but this list watched
    # only `feat/**` — so every fix/ and chore/ branch got NO CI at all and
    # would reach the `--no-ff` merge unverified. The failure was silent in the
    # worst way: `gh run list` simply returns nothing, which is indistinguishable
    # from "queued" until you notice no run ever appears.
    branches: [main, 'feat/**', 'fix/**', 'chore/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# NOTE (2026-07-22): the Dart/Flutter per-package lanes (flutter/app, core, api_client,
# design_system, telemetry) were RETIRED — `workspace_gate` runs `melos run analyze` +
# `melos run test` across every Dart workspace member in ONE resolution, which fully
# covers them (analyze = dart analyze per member, infos non-fatal; test = dart test for
# pure-Dart members + flutter test for Flutter members). The lanes below are the ones
# workspace_gate does NOT cover: the TS Workers, the Node token/site builds, and the
# brick-stamp validation.

# Least privilege. These jobs only read the repo — they publish nothing through
# GITHUB_TOKEN. Without this every job ran at the repository-default scope, which
# on a public repo is a standing hand-out to any compromised action. [pipeline F-11]
permissions:
  contents: read

jobs:
  subly_api:
    name: subly-api Worker (typecheck + test + dry-run)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/subly-api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        # persist-credentials: false — actions/checkout otherwise writes GITHUB_TOKEN
        # into .git/config and LEAVES it there for the whole job. Any later step that
        # packages the workspace (or anything containing .git/) ships the token inside
        # the artifact, and on a PUBLIC repo artifacts are downloadable. Nothing here
        # does git push/tag/commit, so none of these checkouts need the credential.
        # [zizmor artipacked] Verified 2026-07-27: no current artifact path includes
        # .git/ — so this closes a FUTURE mistake, not a live leak.
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx tsc --noEmit
      # This lane was typecheck + dry-run and NOTHING else, on a Worker with no
      # test directory at all — so every security property it has was enforced by
      # code review. Proven 2026-07-31: deleting `AND user_id = ?` from
      # subscriptions.ts left BOTH steps green, i.e. the whole lane passed on a
      # build where any authenticated user could read any other user's rows.
      # `tsc` cannot see a WHERE clause and `--dry-run` never executes one.
      - run: npm test
      - run: npx wrangler deploy --dry-run

  platform:
    name: platform Worker (typecheck + test + dry-run)
    runs-on: ubuntu-24.04
    # Job-level override of the workflow's `contents: read`. assert-platform-proof-
    # fresh.mjs reads build-platforms.yml's run history, which needs `actions: read`
    # — granted HERE rather than workflow-wide so the other lanes keep the smaller
    # scope. [pipeline F-11] is the principle; F-4 is the reason.
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        working-directory: services/platform
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # 🔴 FULL HISTORY, and it is load-bearing rather than tidy.
          # `assert-policy-archive.mjs` derives "every privacy-policy version that
          # has ever been in force" from `git log -p` over the declaring files —
          # the archive it demands exists precisely because the live page is
          # edited IN PLACE and the superseded bytes survive nowhere else.
          # At the default depth of 1 that walk sees one commit adding the whole
          # file, which is indistinguishable from "there has only ever been one
          # version": the guard would pass forever while checking nothing about
          # the past. It refuses to run on a shallow clone for that reason, so
          # removing this line turns the step RED rather than quietly hollow.
          # [pipeline K-4]
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      # FIRST: prove the guards can still FAIL, before trusting anything they say.
      #
      # Every guard below runs against the real repository — which is valid input
      # by definition — so CI only ever exercises their passing path. A guard that
      # silently stops working still prints "ok", and the requirement it enforces
      # silently stops holding while the spec still reads VERIFIED. Both have
      # already happened here: check-migrations' own coverage assertion omits
      # services/subly-api, and assert-gate-passed shipped an off-by-one that made
      # it unable to read its own SHA and blocked both production deploys.
      #
      # These tests feed each guard known-bad input and assert it fails. Verified
      # by mutation: neutering any of the DROP TABLE / RENAME / NOT NULL rules, the
      # CORS required-origin list, the workspace check, or re-introducing the real
      # off-by-one, each turns this step red. [pipeline F-10]
      - name: The guards must be able to fail
        working-directory: ${{ github.workspace }}
        run: node --test "tooling/ci/test/*.test.mjs"
      # …and every guard must HAVE such a test, plus a self-check that its own
      # scan still reaches what it claims. That was a rule people followed and
      # the accounting rotted: the spec said "5 of 6 guards" while the tree held
      # SEVENTEEN. A count nobody computes is a count that drifts. This is F-9's
      # idea — every unit claimed by a lane — applied to the guards themselves.
      # The two guards that scan nothing are exempt BY NAME AND REASON in the
      # script, never by silent omission. [pipeline F-10]
      #
      # ⚠️ THIS FILE IS PART OF THE CHECK, not just the thing that runs it. Since
      # 2026-08-01 the guard set is pinned by an IDENTITY rather than by a hand-
      # ratcheted floor: every `.mjs` in tooling/ci must be invoked by one of the
      # tracked workflows, and every tooling/ci invocation in a workflow must
      # name a file that is there. So DELETING A GUARD FROM tooling/ci WITHOUT
      # DELETING ITS `run:` LINE HERE FAILS, and adding one needs no number
      # raised anywhere — only this wiring. The three floors it replaced
      # (MIN_GUARDS/MIN_TEST_FILES/MIN_TEST_CASES) collided on three consecutive
      # merges in one day, because they were a shared mutable every parallel
      # branch had to write to.
      - name: Every guard is tested and self-checking
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/assert-guard-coverage.mjs
      # The repository's own legal posture. THREE limbs of deliberately different
      # strength (the guard says which is which): one support address across
      # SECURITY.md, every app's AppConfig and the published contact page; the two
      # posture tokens in NOTICE.md; and NO LICENCE FILE AT THE ROOT.
      #
      # That last one is the only assertion in this whole workflow guarding
      # something IRREVERSIBLE. No-LICENSE is what makes this tree
      # all-rights-reserved, and a licence grant cannot be un-granted — deleting
      # the file later does not retract it from anyone who already cloned, and it
      # stays in the public history. Mutation-proven against a copy of the real
      # tree, 10/10 caught, including `touch LICENSE` and the same grant landing
      # as COPYING. [pipeline K-12]
      - name: The repository states its own legal posture
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/assert-repo-posture.mjs
      # A consent record is worth exactly the bytes it can still point at. The
      # privacy notice is ONE URL edited in place; on 2026-08-01 the version moved
      # from 2026-07-26 to 2026-08-01 with no archive, so every artifact collected
      # before that cited a document nobody could serve. This asserts a snapshot
      # exists for every version that has EVER been in force (derived from real
      # history — `git log -S` provably misses an in-place value change and was
      # measured doing so here), that the current snapshot's text equals the live
      # page's, and that an archived policy is not a second live one.
      # Needs `fetch-depth: 0` above; it refuses a shallow clone. [pipeline K-4]
      - name: Every policy version a user consented to is still retrievable
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/assert-policy-archive.mjs
      # Every EMPHASISED claim on the three published legal pages is paired to
      # what makes it true — and the domain is the <b> spans in the served HTML,
      # so it cannot be shrunk without editing a document a human publishes. The
      # subset that can be checked against code IS checked: the signup record is
      # {email, ts} and nothing else; the IP fingerprint is keyed, not a digest;
      # no advertising SDK appears in any pubspec in the tree; no migration
      # declares a card or bank column.
      #
      # ⚠️ ONLY `code` ROWS CARRY AN ASSERTION. This does not prove the pages
      # true and its own header says so. Four things ARE wrong on those pages
      # today — the crash-report host, the Razorpay/merchant-of-record
      # contradiction, the unnamed seller and the unnamed identity provider —
      # and every one is fixed by publishing copy only the owner can approve
      # (OWNER_QUEUE O-3). They PRINT every run and cannot be silently exempted:
      # each declares the sentence that must still be on the page, and the guard
      # goes RED when that sentence is corrected, demanding the row be retired.
      # [pipeline K-3, K-5]
      - name: Every published legal claim is paired, and the payment path is named
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/assert-policy-claims.mjs
      # Every place data can go — every table any migration creates, every D1 /
      # KV / R2 binding any wrangler config declares, and every KV binding a
      # Pages Function reaches — has exactly one inventory row, and every row has
      # a store. The second direction is what stops the inventory becoming a
      # wish-list: rename a table and the row describing the old name fails.
      #
      # The Pages-Function walk is not decoration: SIGNUPS is bound in the
      # Cloudflare dashboard and appears in no config in this repository, and it
      # holds the only plain email address we store. A wrangler-only walk would
      # have reported full coverage while missing it.
      #
      # ⚠️ Two rows declare retention `undecided` and PRINT every run. An agent
      # picking "90 days" for a real signup list would be inventing a number that
      # then looks authoritative and silently deletes somebody's data.
      # [pipeline K-8]
      - name: Every store that holds data is inventoried and disclosed
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/assert-data-inventory.mjs
      # The duty matrix, checked against itself: every declared requirement has a
      # row and every row names a declared requirement; every tripwire states the
      # condition that makes it bite; a review date in the PAST fails.
      #
      # 🔴 AND THE SOURCE-HOST ALLOWLIST, which is four lines of code and the
      # highest-value rule in the file: a duty's source must be the body that
      # WROTE the rule or the platform that ENFORCES it. A law firm's client
      # alert or a compliance vendor's blog fails the row — roughly thirty dead
      # claims entered this project's corpus from exactly that shape, each
      # reading as authoritative. A row marked COULD-NOT-ESTABLISH may not carry
      # a URL at all: the mark means nobody has read the primary text, and a
      # plausible link beside it is a false citation.
      # Its own step, not the sites lane. [pipeline K-13]
      - name: The per-market duty matrix cannot silently rot
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/assert-legal-tripwires.mjs
      # Rights evidence for everything shipped, in DECLARED mode — what the
      # manifests intend to ship, so it runs here with no Flutter toolchain. The
      # app_brick lane runs the same guard with --bundle against a real build.
      #
      # Every row carries a SOURCE for its licence claim and the guard refuses a
      # row without one. The stage document states Flutter's bundled icon font is
      # CC-BY 4.0; upstream has published under Apache-2.0 since 2016. Both are
      # plausible, one is wrong, and the row says UNVERIFIED rather than picking.
      # CC-BY-NC and CC-BY-SA are refused outright: the first excludes commercial
      # distribution, the second's anti-ETM term is refuted by the Ed25519
      # signature on our content packs. [pipeline K-10, K-11]
      - name: Every shipped asset has rights evidence, and every app shows it
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/assert-licence-register.mjs
      # Additive-only schema guard. Lives in this lane (no new lane) but scans
      # EVERY migration set in the repo — one shared platform_db means one
      # destructive migration is a portfolio-wide outage. Runs before the build
      # so a banned statement fails fast.
      - name: Schema evolution is additive-only
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/check-migrations.mjs
      # …and the ANALYTICS half of that schema is one contract written down in
      # four places that cannot import each other: the migrations, the ingest
      # route, the Dart event object and the Dart wire envelope. E-1's acceptance
      # ("one locked taxonomy and envelope serves every app") could not fail —
      # events.test.ts posts one fixture batch and nothing compared the sets.
      #
      # It also makes the two privacy invariants STRUCTURAL. events.test.ts:141
      # and :663 assert "no ip column" by searching the INSERT *string*, so a
      # migration adding `ip TEXT` to the schema passes both; and
      # check-migrations above reads migrations only and exempts WHERE-filtered
      # statements by design, so a filtered `DELETE FROM consent_artifacts` in
      # route code is invisible to it — measured, not argued: it printed
      # "8 migration file(s) clean" over exactly that mutation.
      # [pipeline 11]E-1, E-2, E-3
      - name: One analytics envelope, and the consent trail stays append-only
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/assert-analytics-contract.mjs
      # …and the money rail's half of that schema is COMPLETE, which the step
      # above cannot ask. check-migrations is a DESTRUCTIVE-CHANGE scanner with
      # no concept of a required column: it passes precisely when nobody has
      # changed anything, so the way to satisfy it is to leave the schema wrong.
      #
      # `entitlements` is the one table in this portfolio whose rows are a
      # stranger's money, and migrations are additive-only — so every column
      # missing when the first payment lands is missing FOREVER for that row.
      # There is no back-fill for a fact the provider only ever sent once, in a
      # notification we had no column to keep. This asserts the column set, the
      # verbatim notification store and its exactly-once index, the attribution
      # tables, and that the revocation-reason enum seeded in SQL is exactly the
      # set services/platform/src/lib/mor/contract.ts can write — a set that
      # lives in two places drifts in one of them, and the drift is invisible
      # until a refund lands. [pipeline 5]M-3, M-2, M-7
      - name: The entitlement contract is complete before the first payment
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/assert-entitlement-contract.mjs
      # ONE verifier stands between a merchant of record and the entitlement
      # table, and the rail reports its own gaps honestly.
      #
      # The write enumeration deliberately spans ALL of services/** AND the brick
      # template, not just the Worker that owns the rail: services/subly-api
      # upserts the SAME shared table behind a bearer secret and is DEPLOYED, so
      # a guard scoped to services/platform would print clean standing right next
      # to it. Every writer must be declared with the gate that protects it.
      #
      # It also carries [5]M-14's two-halves split: it FAILS when a piece of the
      # rail is absent or present-but-UNCALLED, and it PRINTS — never fails — the
      # owner-gated half (OWNER_QUEUE A-1, the Paddle seller account, and the
      # destination secret only the owner can generate). Failing on those would
      # block every CI run on work no agent can do; hiding them would make
      # "finished, waiting on one signup" indistinguishable from "nothing built",
      # which is the exact defect M-14 was rewritten to fix.
      # [pipeline 5]M-1, M-14 · [ADR 004] · [ADR 020]:18
      - name: One verifier stands between a provider and the entitlement table
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/assert-mor-adapters.mjs
      # Sandbox money cannot grant a production unlock — enforced at the CONFIG
      # layer, because the original criterion asked for an input nobody can
      # construct (sandbox and live credentials are disjoint, so a sandbox
      # notification fails the signature check first and asserts nothing the step
      # above does not). Every case here is a value somebody can type into a
      # file: a sandbox money environment in the deployed config, a sandbox base
      # URL or API-key prefix anywhere in it, the destination secret committed as
      # a var in this PUBLIC repository, or a resolver that quietly defaults
      # instead of refusing. [pipeline 5]M-12
      - name: Sandbox money cannot grant a production unlock
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/assert-money-config.mjs
      # A Worker whose D1 binding still holds the brick's all-zeros placeholder
      # deploys clean and reaches production pointing at nothing — and
      # `wrangler deploy --dry-run` PASSES on it, because a dry run never
      # contacts D1. That is why S-12's original criterion could not fail.
      # Scoped to services/ so the brick template, which contains the
      # placeholder correctly, is out of scope by construction.
      #
      # The second half has teeth today: subly_db and platform_db are each
      # declared in TWO wrangler configs and nothing checked the uuids agreed.
      # A copy-paste slip there does not error — the Worker deploys, runs, and
      # reads and writes the WRONG database. [pipeline S-12]
      - name: D1 bindings are real and consistent across Workers
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/assert-d1-bindings.mjs
      # There is ONE platform Worker and ONE platform_db behind the whole
      # portfolio, so its capability set has to be declared somewhere a machine
      # can read — six other stage-4 requirements quantify over "the shared
      # capability set" or "every binding", and an undefined right-hand side
      # rejects nothing. This reconciles the register against the tree in BOTH
      # directions: routes against what index.ts actually mounts (parsed,
      # following app.route() into each sub-router — the header comment there
      # names the routes in prose and a grep would have believed it), clients
      # against real call sites outside the serving Worker, and every binding in
      # every wrangler config in the repo — the brick template included — against
      # a reader that is not the Env type declaration.
      #
      # It had teeth the day it landed: services/subly-api bound EXPORTS ->
      # subly-exports (created 2026-07-17) whose only occurrence in the whole
      # TypeScript tree was its own line in types.ts. assert-clone-contract.mjs
      # could not see it — that guard only ever inspects the throwaway CI probe
      # stamp. [pipeline B-1, B-18, B-13]
      - name: The shared server declares every route and every binding
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/assert-platform-register.mjs
      # …and when that server throws, somebody finds out. Measured at HEAD
      # 2026-08-02: `grep -rn "sentry|glitchtip|toucan" services/` → ZERO HITS,
      # while the Flutter app's crashes had been reaching GlitchTip since July.
      # Both Workers' onError logged and returned 500, and on Free
      # `console.error` goes to `wrangler tail` — a LIVE STREAM with no
      # searchable history — so an unhandled error on the SHARED Worker was
      # invisible the moment it happened and the only person who knew was the
      # user who got the 500.
      #
      # This guard is the STRUCTURE (handler → sink → deploy vars, per job). The
      # BEHAVIOUR — the envelope shape, its release id, its privacy invariants,
      # its fail-open paths — is asserted by services/*/test/error-sink.test.ts
      # driving the real onError through the real app. A source scan can say the
      # wire is connected and can never say what travels down it.
      # [pipeline 11]E-8
      - name: A Worker's unhandled error reaches a sink, not just the log
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/assert-worker-error-sink.mjs
      # Every free-tier ceiling recorded ONCE with the URL it was read from and
      # the date it was read, and every hard cap in the Worker source derives
      # from one. B-6's original criterion was "a ceilings file exists", which an
      # EMPTY file satisfies — so the criterion is inverted: a number in the
      # source with no ceiling behind it is the failure.
      #
      # It had teeth the day it landed: MAX_EVENTS_PER_BATCH = 100 sat in the
      # ingest route naming no ceiling, at DOUBLE D1's documented Free limit of
      # 50 queries per Worker invocation, on the shared database every app in the
      # portfolio depends on. A limit with no `source` is reported, never
      # enforced — an invented ceiling fires on CORRECT input. [pipeline B-6, B-7]
      - name: Every hard cap derives from a sourced free-tier ceiling
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/assert-ceiling-budget.mjs
      # The CORS allowlist is EXACT, so it fails closed and silently — dropping
      # an origin breaks that surface in the browser with nothing logged server
      # side. This guards the deployed config; cors.test.ts guards the behaviour.
      - name: CORS allowlist still covers every origin in use
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/assert-cors-allowlist.mjs
      # Every deployable unit must be claimed by some lane. The lane list is
      # hand-written and nothing checked it was complete, so a new Worker, site
      # or package was checked by nothing while CI still went green. Coverage is
      # asserted PER TYPE — dart packages via melos membership, everything else
      # by being named in a workflow. [pipeline F-9]
      - name: Every deployable unit is claimed by a lane
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/assert-lane-coverage.mjs
      # …and every deployable HOSTNAME is claimed by a monitor. Same shape, other
      # axis. The deployed hostname set is DERIVED from the tree (Worker custom
      # domains + the app catalogue + each site's own canonical URL), so adding a
      # route acquires a monitoring obligation on merge rather than when somebody
      # remembers tooling/monitor-register.json exists.
      #
      # Measured against the live GlitchTip API 2026-08-01 and 2026-08-02: six
      # monitors, five hostnames, and TWO deployed custom domains that nothing
      # watches — platform.nikatru.com (the whole analytics + consent rail) and
      # config.nikatru.com (the pre-consent launch fetch). Creating a monitor is
      # an action on the owner's GlitchTip instance rather than a repo change, so
      # that gap PRINTS on every run instead of failing the build; what fails is
      # a deployed hostname nobody DECLARED. The live reconcile is
      # tooling/ops/verify-monitors.mjs, run by hand until GLITCHTIP_TOKEN is a
      # repository secret — a CI limb that needed a network token would either be
      # skipped (and a skipped check reports ok) or would make every build depend
      # on the Oracle box, which is the very SPOF E-9b is about. [pipeline 11]E-9
      - name: Every deployed hostname is declared, and its monitor gap is visible
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/assert-monitor-coverage.mjs
      # …and every FAILURE the factory can suffer has a named detector, response
      # and cadence. Stage 14 audited its own twenty-one acceptance criteria and
      # found EIGHTEEN that could not fail, all for one reason: they quantified
      # over an operations register that did not exist, so `ls tooling/ops`
      # returned "No such file or directory" and eighteen criteria ranged over
      # the empty set and reported clean. This is the right-hand side, and this
      # step is what stops it drifting away from the tree it describes: every
      # workflow must carry a duty row and every duty row a live anchor, BOTH
      # DIRECTIONS, plus every named reader having to exist. Hostnames are NOT
      # here — they are the monitor register's above, delegated and checked.
      # [pipeline 14]O-1
      - name: Every failure has a detector, a response and a cadence
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/assert-ops-register.mjs
      # …and every PINNED INPUT is still REACHED by the update mechanism.
      #
      # 🔴 NOT "is Renovate enabled". That question was the drafted acceptance and
      # it is satisfied by `extends: config:recommended` — so it read GREEN
      # throughout the weeks when all five customManagers were written with a
      # REGEX where a GLOB was expected, matched nothing, and proposed no update
      # for any toolchain pin. A configuration check cannot see that; only
      # applying each pattern to real paths and each matchString to the real file
      # can, which is what this guard does, offline and on every push.
      #
      # Its first run found `wrangler` — the tool that publishes production,
      # already caught once a full major version behind and holding the account
      # API token — declared in versions.json and advanced by nobody. Every pin
      # now resolves to a manager or to a written exemption living beside it in
      # versions.json, so removing a pin puts its excuse in the same diff.
      #
      # DELIBERATELY OFFLINE: the "did a proposal actually arrive" half is the
      # Dependency Dashboard issue, which a human reads. A per-push gate that
      # needed a network token would fail closed on every fork. What rots
      # silently between those reads is the CONFIGURATION. [pipeline 14]O-9
      - name: Every pinned input is reached by a live update manager
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/assert-update-coverage.mjs
      # …and every STORE the portfolio holds has a declared retention rule. The
      # drafted acceptance said "for every store WITH a rule, no row is older
      # than that rule" — which excluded the one store it was written about, the
      # signup KV that holds an email address with no expiry. So the domain is
      # enumerated from wrangler bindings and migrations rather than from the
      # register, in both directions: a rule whose store is gone is COVERAGE
      # LOST, because otherwise deleting a binding is how you make this pass.
      # It caught five real stores the money rail added while stage 14 sat
      # unmerged. [pipeline 14]O-17
      - name: Every store the portfolio holds has a declared retention rule
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/assert-retention-coverage.mjs
      # …and the claim is worth what the lane's TRIGGER is worth. deploy-web.yml
      # filtered on `apps/subly/**` + `packages/**` only, so a dependency bump —
      # a transitive patch landing in the root pubspec.lock with no source change
      # — built differently on main and deployed nothing at all. The failure is
      # an absence: no run, no error, the old bytes still served and the
      # deployment marker still naming the previous SHA. [pipeline F-9]
      - name: Path-filtered deploys list every build input
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/assert-deploy-triggers.mjs
      # A commit must resolve the same dependencies twice. `npm install` takes
      # whatever is newest inside a caret range, so the dry-run that "proved" a
      # Worker deploy and the deploy itself resolved independently, minutes apart
