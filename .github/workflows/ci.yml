name: CI

on:
  push:
    # ALL THREE documented branch prefixes, not just feat/. architecture.md §24
    # defines the convention as `feat|fix|chore/<slug>`, but this list watched
    # only `feat/**` — so every fix/ and chore/ branch got NO CI at all and
    # would reach the `--no-ff` merge unverified. The failure was silent in the
    # worst way: `gh run list` simply returns nothing, which is indistinguishable
    # from "queued" until you notice no run ever appears.
    branches: [main, 'feat/**', 'fix/**', 'chore/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# NOTE (2026-07-22): the Dart/Flutter per-package lanes (flutter/app, core, api_client,
# design_system, telemetry) were RETIRED — `workspace_gate` runs `melos run analyze` +
# `melos run test` across every Dart workspace member in ONE resolution, which fully
# covers them (analyze = dart analyze per member, infos non-fatal; test = dart test for
# pure-Dart members + flutter test for Flutter members). The lanes below are the ones
# workspace_gate does NOT cover: the TS Workers, the Node token/site builds, and the
# brick-stamp validation.

# Least privilege. These jobs only read the repo — they publish nothing through
# GITHUB_TOKEN. Without this every job ran at the repository-default scope, which
# on a public repo is a standing hand-out to any compromised action. [pipeline F-11]
permissions:
  contents: read

jobs:
  subly_api:
    name: subly-api Worker (typecheck + dry-run)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/subly-api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx wrangler deploy --dry-run

  platform:
    name: platform Worker (typecheck + test + dry-run)
    runs-on: ubuntu-24.04
    # Job-level override of the workflow's `contents: read`. assert-platform-proof-
    # fresh.mjs reads build-platforms.yml's run history, which needs `actions: read`
    # — granted HERE rather than workflow-wide so the other lanes keep the smaller
    # scope. [pipeline F-11] is the principle; F-4 is the reason.
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        working-directory: services/platform
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      # FIRST: prove the guards can still FAIL, before trusting anything they say.
      #
      # Every guard below runs against the real repository — which is valid input
      # by definition — so CI only ever exercises their passing path. A guard that
      # silently stops working still prints "ok", and the requirement it enforces
      # silently stops holding while the spec still reads VERIFIED. Both have
      # already happened here: check-migrations' own coverage assertion omits
      # services/subly-api, and assert-gate-passed shipped an off-by-one that made
      # it unable to read its own SHA and blocked both production deploys.
      #
      # These tests feed each guard known-bad input and assert it fails. Verified
      # by mutation: neutering any of the DROP TABLE / RENAME / NOT NULL rules, the
      # CORS required-origin list, the workspace check, or re-introducing the real
      # off-by-one, each turns this step red. [pipeline F-10]
      - name: The guards must be able to fail
        working-directory: ${{ github.workspace }}
        run: node --test "tooling/ci/test/*.test.mjs"
      # Additive-only schema guard. Lives in this lane (no new lane) but scans
      # EVERY migration set in the repo — one shared platform_db means one
      # destructive migration is a portfolio-wide outage. Runs before the build
      # so a banned statement fails fast.
      - name: Schema evolution is additive-only
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/check-migrations.mjs
      # The CORS allowlist is EXACT, so it fails closed and silently — dropping
      # an origin breaks that surface in the browser with nothing logged server
      # side. This guards the deployed config; cors.test.ts guards the behaviour.
      - name: CORS allowlist still covers every origin in use
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/assert-cors-allowlist.mjs
      # Every deployable unit must be claimed by some lane. The lane list is
      # hand-written and nothing checked it was complete, so a new Worker, site
      # or package was checked by nothing while CI still went green. Coverage is
      # asserted PER TYPE — dart packages via melos membership, everything else
      # by being named in a workflow. [pipeline F-9]
      - name: Every deployable unit is claimed by a lane
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/assert-lane-coverage.mjs
      # A commit must resolve the same dependencies twice. `npm install` takes
      # whatever is newest inside a caret range, so the dry-run that "proved" a
      # Worker deploy and the deploy itself resolved independently, minutes apart
      # — and the winner of that race is what reached production. [pipeline F-8]
      - name: Dependency resolution is reproducible
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/assert-lockfile-discipline.mjs
      # CI's own inputs. A tag is a movable label the action's owner can re-point;
      # a 40-char SHA cannot move. tj-actions/changed-files reached ~23k repos in
      # March 2025 by exactly that route, and e2e.yml runs nightly holding the
      # Supabase service-role key. [pipeline F-11]
      - name: Workflows are SHA-pinned and least-privilege
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/assert-workflow-hardening.mjs
      # The 6-platform claim must be proven AND RECENT. build-platforms.yml ran
      # only on dispatch or a release tag, so the green tick was undated — found
      # eight commits stale, and fresh again only because someone clicked it by
      # hand. A weekly cron is half the fix; this age check is the half that makes
      # it honest, because a cron that quietly stopped looks exactly like a
      # healthy one. Fails closed: no token, an API error or zero green runs are
      # all failures, since "I could not tell" must never read as "it is fine".
      # Cost accepted: ci-gate now depends on one API call, so a GitHub hiccup can
      # fail a build. A re-run fixes that; an undated platform claim does not.
      # [pipeline F-4]
      - name: The 6-platform proof is fresh
        working-directory: ${{ github.workspace }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tooling/ci/assert-platform-proof-fresh.mjs
      # One declaration for every build version. Before this, "3.44.7" appeared in
      # six places and node 24 in eight; wsl-setup.sh carried the comment "keep in
      # lockstep with *.yml", i.e. maintained by hope. The guard compares PARSED
      # values, so it can see the site that drifted. [pipeline F-2]
      - name: Build versions all match versions.json
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/assert-version-consistency.mjs
      # The app's OWN version, distinct from the build-tool versions above. It sat
      # at 1.0.0+1 from the first deploy with nothing able to raise it, which left
      # the CFG-1 force-update kill-switch inert on the only live channel — the
      # gate compares major.minor.patch, and a frozen patch means no reachable
      # floor. [pipeline stage 9]
      - name: The app version is derived and monotonic
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/assert-app-versioning.mjs
      # A fail-closed seam with no on-switch is a dead feature that reports
      # healthy. Four shipped that way — the analytics rail discarded every event
      # because nothing ever recorded consent, and no test went red because
      # refusing was what they all asserted. Also pins the app's claimed privacy
      # policy version to the published one, so a consent artifact can never name
      # a policy the user was not shown. [pipeline C-6]
      - name: Fail-closed seams have a real on-switch
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/assert-seams-wired.mjs
      # Repo-side secret scanning. GitHub's push protection only matches KNOWN
      # PROVIDER patterns, and `non_provider_patterns` is off — so the secrets
      # this project actually holds (the rclone crypt password, a pasted PEM, any
      # bespoke token) are exactly the class it cannot see.
      #
      # Version PINNED and the tarball CHECKSUM-VERIFIED before it is unpacked,
      # for the same reason every action is SHA-pinned (F-11) — except here we can
      # check the actual bytes rather than trust a ref.
      #
      # scan-secrets.mjs then SELF-TESTS before it scans: it plants a known secret
      # and asserts the scanner still flags it. A scanner that quietly stopped
      # detecting would otherwise report "clean" forever. [pipeline F-6]
      - name: Install gitleaks (pinned + checksum-verified)
        working-directory: ${{ github.workspace }}
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          set -euo pipefail
          # Into RUNNER_TEMP, never the workspace: a binary sitting in the repo
          # would then be scanned by the very step that follows.
          tarball="${RUNNER_TEMP}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          wget -q -O "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" -C "${RUNNER_TEMP}" gitleaks
          "${RUNNER_TEMP}/gitleaks" version
      - name: Secret scan (self-tests, then scans)
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/scan-secrets.mjs . --gitleaks "${RUNNER_TEMP}/gitleaks"
      # Static analysis of CI's OWN workflows. SHA-pinning closed the movable-tag
      # hole; it says nothing about attacker-controlled text expanded into a
      # `run:` block, a pull_request_target that checks out the PR head, or a
      # permission granted workflow-wide that one job needs. `39-CHASSIS` §4 cut 14
      # keeps exactly two things out of G-47 — SHA-pinning (shipped) and this.
      # Same discipline as gitleaks above: pinned version, bytes checksum-verified
      # rather than a ref trusted, unpacked into RUNNER_TEMP so the binary is not
      # sitting in the tree the next step scans. [pipeline F-11]
      - name: Install zizmor (pinned + checksum-verified)
        working-directory: ${{ github.workspace }}
        env:
          ZIZMOR_VERSION: '1.28.0'
          ZIZMOR_SHA256: 'e87b67160194884e375a46a12c57ccc904f762b53845f254fab7f17d98809c09'
        run: |
          set -euo pipefail
          tarball="${RUNNER_TEMP}/zizmor_${ZIZMOR_VERSION}_linux_x64.tar.gz"
          wget -q -O "$tarball" \
            "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ZIZMOR_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" -C "${RUNNER_TEMP}" zizmor
          "${RUNNER_TEMP}/zizmor" --version
      # Gates on HIGH severity AND HIGH confidence only. Unfiltered this repo
      # returns 77 findings, mostly low-confidence cache-poisoning notes about
      # setup-node's default cache — and a guard that cries wolf 77 times is one
      # somebody switches off. Everything below the gate is PRINTED on every run,
      # so nothing is hidden; it just does not block. Self-tests against a
      # deliberately vulnerable workflow before it trusts a clean result.
      - name: Workflow static analysis (self-tests, then scans)
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/scan-workflows.mjs . --zizmor "${RUNNER_TEMP}/zizmor"
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npx wrangler deploy --dry-run

  tokens:
    name: Site design tokens (build + drift)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/tokens
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      # Guards the file the SITES ACTUALLY SERVE, not a build/ artifact nobody
      # read. Until 2026-07-26 this checked packages/tokens/build/, while
      # sites/_shared/assets/tokens.css was a separate hand-maintained copy —
      # so editing tokens/color.json changed nothing, and CI still passed.
      - name: Site tokens.css must equal a fresh build
        run: git diff --exit-code -- ../../sites/_shared/assets/tokens.css

  site_shared:
    name: Shared site build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: sites/_shared
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build

  app_brick:
    name: App brick (stamp both variants + analyze + validate the clone contract)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.44.7
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      # PINNED. This was `activate mason_cli` with no version, taking whatever was
      # newest on every run — and mason is what STAMPS APPS, so the factory's own
      # product could differ between runs with nothing in the repo to explain it.
      # Version declared in tooling/versions.json. [pipeline F-2]
      - name: Install mason_cli
        run: dart pub global activate mason_cli 0.1.3

      # ── Variant 1: the DEFAULT stamp — client-only (needs_backend=false).
      # This is what almost every app gets, so it is the one that must not rot.
      - name: Stamp the default (client-only) app
        run: |
          export PATH="$PATH:$HOME/.pub-cache/bin"
          mason get
          mason make app -c tooling/bricks/app/_probe_vars.json -o . --on-conflict overwrite
      - name: SHOW-1 — post_gen appended probe to apps.json (then revert)
        run: |
          grep -q '"slug": "probe"' sites/_shared/_data/apps.json
          git checkout -- sites/_shared/_data/apps.json
      # THE CLONE CONTRACT, asserted rather than documented. A default stamp
      # that quietly regains a Worker/D1/R2 is how the portfolio walks back
      # into the 10-database free-tier ceiling. Checks are structural (the
      # config is parsed, not grepped) — see the script header for why.
      - name: Default stamp claims NO Worker, NO D1 and NO R2
        run: node tooling/ci/assert-clone-contract.mjs --client probe
      # A stamped app must be born `dart format`-clean. Every app in the
      # portfolio starts as a copy of this output, so template dirt is dirt in
      # all of them at once — and it makes adding a repo-wide format gate
      # impossible for as long as it lasts. Cheap to hold, expensive to reclaim.
      - name: Stamped app is dart format-clean
        run: dart format --output=none --set-exit-if-changed apps/probe
      # The stamp lane used to assert only that the app COMPILES and its tests
      # pass, so anything merely ABSENT sailed through: themeMode appeared zero
      # times repo-wide, Semantics( zero times, and the account-delete button
      # called Navigator.pop and nothing else. All three were green. The
      # assertions now live in the brick template so every stamped app inherits
      # them for life; this guard stops that file quietly vanishing, because
      # vanishing looks exactly like passing. [pipeline C-16]
      - name: Stamped app asserts its own chassis properties
        run: node tooling/ci/assert-stamp-properties.mjs
      - name: Analyze + test the stamped app
        working-directory: apps/probe
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test

      # ── Variant 2: the OPT-IN backend stamp (needs_backend=true). Rarer, but
      # it still has to typecheck and deploy-dry-run.
      - name: Stamp the opt-in backend app
        run: |
          export PATH="$PATH:$HOME/.pub-cache/bin"
          mason make app -c tooling/bricks/app/_probe_backend_vars.json -o . --on-conflict overwrite
          git checkout -- sites/_shared/_data/apps.json
      - name: Backend stamp has a Worker + APP_DB but still no per-app R2
        run: node tooling/ci/assert-clone-contract.mjs --client probe --backend probeapi
      - name: Stamped backend app is dart format-clean
        run: dart format --output=none --set-exit-if-changed apps/probeapi
      - name: Analyze the stamped backend app
        working-directory: apps/probeapi
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test
      # ⚠️ THE ONE DELIBERATE EXCEPTION to F-8's `npm ci` / `--enforce-lockfile`
      # rule, and it is stated here rather than left to look like an oversight.
      #
      # apps/probe, apps/probeapi and services/probeapi-api are stamped fresh by
      # mason seconds earlier. A freshly stamped app HAS no lockfile, so `npm ci`
      # and `--enforce-lockfile` would both fail by definition. These three
      # installs are a bootstrap, not a reproducible build, and they ship nothing.
      #
      # assert-lockfile-discipline.mjs allows exactly these paths and fails on any
      # other non-reproducible install. If the brick ever ships lockfiles in its
      # template, delete the exception rather than widening it. [pipeline F-8]
      - name: Typecheck + dry-run the stamped service
        working-directory: services/probeapi-api
        run: |
          npm install
          npx tsc --noEmit
          npx wrangler deploy --dry-run

  sites:
    name: Static sites (functions parse + required files)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # sites/nikatru and sites/rajasekarselvam are deployed by CLOUDFLARE's own
      # Git integration on every push to main — no workflow involved, and
      # Cloudflare cannot read a GitHub check. Until this lane existed nothing in
      # the repo so much as parsed them, including a Pages Function holding a live
      # KV binding that stores email signups.
      #
      # Cloudflare still cannot be gated. The protection is indirect: with `main`
      # protected (F-5a), code that cannot pass this lane cannot reach `main`, and
      # therefore cannot reach Cloudflare. [pipeline F-9]
      - name: Site integrity
        run: node tooling/ci/check-site-integrity.mjs

  workspace_gate:
    name: Workspace gate (melos analyze + test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Runs BEFORE melos: the gate below can only report on packages it is told
      # about, so an ungated package must fail here rather than pass silently.
      # [pipeline F-1]
      - name: Assert workspace coverage
        run: node tooling/ci/assert-workspace-coverage.mjs
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.44.7
      - name: Activate melos
        run: dart pub global activate melos 8.2.2
      # Flutter members require the Flutter tool for root workspace resolution
      # (plain `dart pub get` cannot resolve `sdk: flutter` dependencies).
      - name: Resolve the workspace
        run: flutter pub get --enforce-lockfile
      - name: melos run analyze
        run: |
          export PATH="$PATH:$HOME/.pub-cache/bin"
          melos run analyze
      - name: melos run test
        run: |
          export PATH="$PATH:$HOME/.pub-cache/bin"
          melos run test

  ci-gate:
    name: ci-gate
    runs-on: ubuntu-24.04
    needs: [subly_api, platform, tokens, site_shared, app_brick, sites, workspace_gate]
    if: always()
    steps:
      - name: Require all lanes green
        run: |
          echo "subly_api=${{ needs.subly_api.result }} platform=${{ needs.platform.result }} tokens=${{ needs.tokens.result }} site_shared=${{ needs.site_shared.result }} app_brick=${{ needs.app_brick.result }} workspace_gate=${{ needs.workspace_gate.result }}"
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::One or more CI lanes failed"; exit 1
          fi
          echo "All lanes green"
