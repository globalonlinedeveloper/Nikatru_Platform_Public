  guards-store:
    name: Guards — store, release and versioning
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      - name: Build versions all match versions.json
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-version-consistency.mjs
      - name: Every pin in versions.json carries its reason, and every retire condition is read at the flutter pin
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-versions.mjs
      - name: Every Renovate bump reaches every copy the version guard reads
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-renovate-reach.mjs
      - name: The app version is derived and monotonic
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-app-versioning.mjs
      - name: Every claimed channel is a served channel
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-channel-register.mjs
      - name: Every store in the platform manifest has a channel row, and every store channel has a store
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-store-bijection.mjs
      # why: assert-channel-claims.mjs scans sites/nikatru/sitemap.xml, which is generated in
      # the job and never committed since D3b.
      - name: Generate the discovery surface (the sitemap is never committed)
        if: ${{ !cancelled() }}
        run: node tooling/sites/generate-discovery.mjs
      - name: No public surface advertises an unserved or dead channel
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-channel-claims.mjs
      - name: Every declared store channel has a complete, spec-derived listing
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-store-metadata.mjs
      - name: The app declaration is valid and everything rendered from it is fresh
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-app-yaml.mjs
      - name: Both of an app's names are shippable — the store title and the icon label
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-app-naming.mjs
      # why: OFFLINE. It reads apps/<app>/name-clearance.json and never dials out —
      # the networked probe that WRITES that record takes ~14 s and is a routine, not
      # a gate. docs/name-clearance.md carries the measurement and the split.
      - name: Every declared app name carries a current, non-blocked clearance record
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-name-clearance.mjs
      - name: Every Linux store channel can produce a complete snapcraft recipe
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-snapcraft-generable.mjs
      - name: The Play listing graphics exist, are the sourced size, and say where they came from
        if: ${{ !cancelled() }}
        run: node --single-threaded tooling/ci/assert-listing-assets.mjs
      - name: The Play screenshot set spans enough device types
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-play-device-coverage.mjs
      # why a reader of its own and not a row in assert-listing-assets: that guard
      # grades a LISTING, a set of frames the register names outright. This one
      # grades a RELATION — one file per auto-renewable subscription — and derives
      # the expected filenames from the paywall offerings, so a new subscription
      # term creates the obligation without anyone editing a guard. A version
      # cannot be submitted while a product it references sits in "Missing
      # Metadata", and this is the cheapest place to find that out.
      - name: Every auto-renewable subscription has an App Store review screenshot
        if: ${{ !cancelled() }}
        run: node --single-threaded tooling/ci/assert-iap-review-screenshots.mjs
      - name: The Data safety and content-rating declarations still describe the code
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-play-declarations.mjs
      - name: The sworn store declarations have not regressed toward the stamp
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-sworn-store-files.mjs
      # why: O-STORE-AUDIENCE-GUARDED-BY-CONSISTENCY-ONLY — [ADR 068]'s adult posture is
      # pinned per store channel, and the Windows IARC answers equal the Play ones.
      - name: Every store channel declares the adult audience, and Windows answers IARC as Play does
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-store-audience.mjs
      - name: The advertising declarations still describe the shipped tree
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-ads-declarations.mjs
      - name: No release build from an ungated commit, no publish unrecorded
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-release-provenance.mjs
      - name: No release lane finishes with the artifact stuck inside the run
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-release-durable.mjs
      # why: THE ONLY PLACE THIS GUARD CAN RUN ON MAIN. It grades a staged release
      # directory, and no such directory exists outside a release run — so on every
      # other commit it would never execute, and a guard nobody has seen run is a
      # guard nobody knows works. `--self-test` builds real release directories in
      # os.tmpdir(), breaks one thing in each, and requires the guard to name it.
      - name: The release-record guard can still fail (mutation matrix)
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-release-json.mjs --self-test
      - name: Nothing is compiled into an artifact that was not declared shippable
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-no-secret-defines.mjs
      - name: Obfuscation and symbol retention are one increment or neither
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-obfuscation-coupled.mjs
      # why: the apps.gov.in §11 runtime signature check — its pins are the register's and it runs at boot (O-APPS-GOV-IN-VAPT-CHECKLIST).
      - name: Every Android channel's build compiles in its pinned signer and checks it at boot
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-runtime-signer-check.mjs
      - name: No shipped client overrides TLS certificate trust
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-no-tls-pinning.mjs
      - name: The web channel declares a cache policy a deploy can be seen through
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-web-cache-policy.mjs . sites/nikatru sites/rajasekarselvam
      - name: Release lanes cover every app, and no guard hides a lane
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-release-lane-generic.mjs
      - name: Nothing is published without being launched once
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-launch-smoke.mjs
      - name: One app_id derives every store identity, on every platform
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-store-identity.mjs
      # why: THE TREE HALF OF O-STAMP-APPLE-PROVISIONING-MANUAL. Runner.entitlements
      # is derived from tooling/apple-provisioning.json; the live-profile half needs
      # the ASC key and is `node tooling/ops/provision-apple.mjs --app <slug>`.
      - name: Every iOS entitlements file is derived from its declared Apple capabilities
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-apple-entitlements.mjs
      - name: No live resource carries a retired name [ADR 079]
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-retired-names.mjs
      - name: No customer-visible surface names a retired product [ADR 074]
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-retired-names-visible.mjs
      - name: Every NIKATRU hostname is the apex or one label deep [ADR 080]
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-hostname-depth.mjs
      - name: No submission endangers the store identity
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-submission-safety.mjs
      - name: No publishing lane finishes without a [10]D-9 record
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-publish-records.mjs
      - name: The Android module pins the API level Google Play requires
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-android-target-sdk.mjs
      - name: No store artifact is the demo build
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-store-build-config.mjs
      - name: An app that pulls flutter_inappwebview carries its native build waivers
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-inappwebview-waivers.mjs
      # why: [ADR 067] decision 1's fourth artefact. Appended at the END of this
      # job on purpose — an insertion shifts every `ci.yml:NNNN` citation below
      # it, and the private corpus holds ~1,647 of them, so a new step goes where
      # it moves the fewest.
      - name: The store vocabulary has one home, and every word in it is used
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-store-vocabulary.mjs
      # why: the apps.gov.in media is DERIVED from the Play set; a PR that re-captures the Play set must re-derive it
      # in the same PR, not at the next build-platforms run — docs/ci/build-platforms.md §apps-gov-in.
      - name: The apps.gov.in listing media is still the derivation of the Play set
        if: ${{ !cancelled() }}
        run: node --single-threaded tooling/ci/assert-apps-gov-in-media.mjs
      # why: O-APP-ID-FORM-UNVALIDATED (a). Appended at the END of this job, like
      # the store vocabulary step, so it shifts as few `ci.yml:NNNN` citations as it can.
      - name: The app id has one rule, and the Worker, the callers and the schemas agree with it
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-app-id-contract.mjs
      # why: O-CAPTURE-LEAVES-DERIVED-SETS-STALE. Every set declaring derivedFrom was derived from the
      # source files in this tree; store-screenshots.yml runs the same guard before its pull request opens.
      # Appended at the END of this job, like the two steps above, to shift the fewest ci.yml citations.
      - name: Every derived listing set was derived from the files in this tree
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-derived-sets.mjs
      # why: rv2-security-003. A job holding a signing secret (tooling/channel-register.json) downloads nothing
      # it has not checked against a pinned sha256: the Flutter archive, every curl/wget, the Gradle distribution.
      # Appended at the END of this job, like the steps above, to shift the fewest ci.yml citations.
      - name: Every build input a signing job downloads is checked against a pinned sha256 first
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-signing-inputs-pinned.mjs

