  site-tokens:
    # why: the job id stays `site-tokens` even though the lane now covers three
    # runtimes rather than the sites alone. ci-gate's `needs:` list names it, and
    # tooling/ci/assert-green-means-ran.mjs asserts that list by name — renaming
    # a job id here is a two-file change with a required-check consequence, and
    # the name below is where the widened scope is said out loud instead.
    name: Design tokens (build + drift, all three outputs)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/tokens
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - run: npm ci
      # why: ALL THREE outputs are deleted, not just the CSS. The delete is what
      # makes this a re-derivation rather than a comparison — an output left in
      # place is checked only for "the build did not change it", which a build
      # that never wrote the file also satisfies. Source is
      # contracts/tokens/dtcg/ ([ADR 067] decision 1); the three outputs are the
      # CSS the sites reference, Dart constants for the Flutter apps, and a JSON
      # table the build-free extension subtree can read.
      - name: Delete all three artifacts so the build has to produce them
        run: |
          rm -f ../../sites/_shared/assets/tokens.css
          rm -f ../design_system/lib/src/tokens/brand_tokens.dart
          rm -f ../../extensions/core/tokens.json
      - run: npm run build
      - name: The build actually wrote all three artifacts
        run: |
          test -s ../../sites/_shared/assets/tokens.css
          test -s ../design_system/lib/src/tokens/brand_tokens.dart
          test -s ../../extensions/core/tokens.json
      # why: ONE PATH PER LINE — and no backslash continuations either.
      # assert-green-means-ran.mjs pairs every path a drift step diffs with an
      # "rm -f" of that same path earlier in the same job, and its matcher
      # captures ONE path per match. Three paths on a single line therefore
      # pair only the FIRST with a deletion; the other two are diffed and never
      # required to have been deleted at all. Measured 2026-09-05 on this file,
      # one mutation at a time: with all three on one line, removing the
      # "rm -f" of brand_tokens.dart or of extensions/core/tokens.json left the
      # guard at exit 0, while removing the tokens.css one gave exit 1 — two of
      # the three outputs could silently lose their delete-before-diff. Split
      # one-per-line, removing any of the three gives exit 1 naming that file.
      # A backslash continuation is the OTHER wrong answer: the matcher then
      # reads the continuation character itself as the path, which is how the
      # first draft failed with 'job "site-tokens" diffs [backslash] against
      # HEAD, but no earlier step deletes it first'.
      # ⚠️ And the drift-lane phrase is deliberately NOT quoted anywhere in this
      # comment: green-means-ran.test.mjs counts its occurrences across every
      # workflow file to derive how many drift checks the guard must report, and
      # it counts comment text too — a comment quoting the phrase inflates that
      # count by one and reddens a test about something else entirely.
      - name: All three outputs must equal a fresh build
        run: |
          git diff --exit-code -- ../../sites/_shared/assets/tokens.css
          git diff --exit-code -- ../design_system/lib/src/tokens/brand_tokens.dart
          git diff --exit-code -- ../../extensions/core/tokens.json

  ff-site-tokens:
    # why: FF-2 — starts only once `site-tokens` has concluded red, so it keeps its failure. docs/ci/README.md §2.1
