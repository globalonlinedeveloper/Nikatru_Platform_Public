        run: node tooling/sites/generate-discovery.mjs
      - name: No public surface advertises an unserved or dead channel
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-channel-claims.mjs
      - name: Every declared store channel has a complete, spec-derived listing
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-store-metadata.mjs
      - name: The app declaration is valid and everything rendered from it is fresh
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-app-yaml.mjs
      - name: Both of an app's names are shippable — the store title and the icon label
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-app-naming.mjs
      # why: OFFLINE. It reads apps/<app>/name-clearance.json and never dials out —
      # the networked probe that WRITES that record takes ~14 s and is a routine, not
      # a gate. docs/name-clearance.md carries the measurement and the split.
      - name: Every declared app name carries a current, non-blocked clearance record
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-name-clearance.mjs
      - name: Every Linux store channel can produce a complete snapcraft recipe
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-snapcraft-generable.mjs
      - name: The Play listing graphics exist, are the sourced size, and say where they came from
        if: ${{ !cancelled() }}
        run: node --single-threaded tooling/ci/assert-listing-assets.mjs
      - name: The Play screenshot set spans enough device types
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-play-device-coverage.mjs
      # why a reader of its own and not a row in assert-listing-assets: that guard
      # grades a LISTING, a set of frames the register names outright. This one
      # grades a RELATION — one file per auto-renewable subscription — and derives
      # the expected filenames from the paywall offerings, so a new subscription
      # term creates the obligation without anyone editing a guard. A version
      # cannot be submitted while a product it references sits in "Missing
      # Metadata", and this is the cheapest place to find that out.
      - name: Every auto-renewable subscription has an App Store review screenshot
        if: ${{ !cancelled() }}
        run: node --single-threaded tooling/ci/assert-iap-review-screenshots.mjs
      - name: The Data safety and content-rating declarations still describe the code
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-play-declarations.mjs
      - name: The sworn store declarations have not regressed toward the stamp
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-sworn-store-files.mjs
      # why: O-STORE-AUDIENCE-GUARDED-BY-CONSISTENCY-ONLY — [ADR 068]'s adult posture is
      # pinned per store channel, and the Windows IARC answers equal the Play ones.
      - name: Every store channel declares the adult audience, and Windows answers IARC as Play does
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-store-audience.mjs
      - name: The advertising declarations still describe the shipped tree
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-ads-declarations.mjs
      - name: No release build from an ungated commit, no publish unrecorded
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-release-provenance.mjs
      - name: No release lane finishes with the artifact stuck inside the run
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-release-durable.mjs
