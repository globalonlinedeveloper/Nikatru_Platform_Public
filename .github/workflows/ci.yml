name: CI

run-name: "CI on ${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.number) || github.ref_name }} by @${{ github.actor }}"

# The lane map, the shard boundaries and every rule this file has to obey are in
# docs/ci/README.md. Only `# why:` lines live here.

on:
  # why: main only. A branch-prefix list cannot cover branches nobody has named
  # yet, and `pull_request:` (unfiltered) already covers every branch that opens
  # a PR — so a commit on a PR branch used to run CI twice.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # why: FALSE ON MAIN ONLY. Every push to main resolves to one group, so `true`
  # lets a later push kill the run the deploy gate is waiting on, and a cancelled
  # run notifies nobody. PR events resolve to refs/pull/N/merge and do cancel.
  # tooling/ops/safe-rerun.mjs reads this key by name.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  worker-subscriptiontracker-api:
    name: subscriptiontracker-api Worker (typecheck + test + dry-run)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/subscriptiontracker-api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npx wrangler deploy --dry-run

  worker-platform:
    # why: this job was 1,818 of ci.yml's 2,696 lines and ran 105 guards behind a
    # name that described four steps. It is now only those four steps; the guards
    # are the guard-* shards below.
    name: platform Worker (typecheck + test + dry-run)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/platform
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npx wrangler deploy --dry-run

  guard-meta:
    # why: the guards' own mutation suite measured 199s of the old job's 263s —
    # three times longer than running the 108 guards it tests. On its own job it
    # no longer sits in front of them. It is NOT change-filtered: several suites
    # here read the real tree (safe-rerun against .github/workflows, ops-register
    # against tooling/ops), so "only prose changed" does not imply "this cannot
    # go red", and a filter that is wrong about that is a green tick over nothing.
    name: Guards — the guards can still fail
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      issues: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      - name: The guards must be able to fail
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GLITCHTIP_TOKEN: ${{ secrets.GLITCHTIP_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node --test --test-reporter=spec  --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination="${{ runner.temp }}/guard-tests.junit.xml" "tooling/ci/test/*.test.mjs"
      # The per-suite EXECUTED counts are the only Linux measurement of what ran.
      # tooling/scripts/refresh-executed-floor.mjs reads this artifact from a green
      # main run to raise tooling/ci/test/executed-floor.json; nothing local writes it.
      - name: Keep the executed counts for the executed-floor refresh
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: guard-tests-junit
          path: ${{ runner.temp }}/guard-tests.junit.xml
          if-no-files-found: error
          retention-days: 30
      - name: Every guard is tested and self-checking
        run: node tooling/ci/assert-guard-coverage.mjs
      # 🔴 THE RATCHET IS STATE, AND UNTIL TODAY NOTHING IN CI READ IT BACK.
      # assert-guard-coverage.mjs WRITES tooling/ci/test/coverage-manifest.json on
      # every run — that is how the floor rises, and every rise is printed. In CI
      # that write went to a runner's disk and was thrown away with it, so a
      # branch could ship a manifest LOWER than its own tree and the floor would
      # be quietly lowered by the merge; the next branch would then ratchet up
      # from the lower number and nobody would ever see the step down. The guard
      # exits 0 either way, because rewriting the ratchet is its job, not a
      # finding. This step is the read-back: the file the guard just wrote must
      # be the file that was committed. It is deterministic — measured by running
      # the guard twice on a clean tree, no diff either time — so a red here means
      # the manifest was not regenerated, never that the run was unlucky.
      # tooling/enforcement-index.json is deliberately NOT included: it already
      # has its own comparison two steps down.
      - name: The ratchet the guard just wrote is the ratchet that was committed
        run: |
          set -euo pipefail
          if ! git diff --quiet -- tooling/ci/test/coverage-manifest.json; then
            echo "::error title=coverage-manifest.json was not regenerated::assert-guard-coverage.mjs rewrote the ratchet during this run, so the committed file is stale. Run \`node tooling/ci/assert-guard-coverage.mjs\` locally and commit the result. A manifest lower than the tree LOWERS the floor at merge, and nothing after that can see the step down."
            git --no-pager diff -- tooling/ci/test/coverage-manifest.json
            exit 1
          fi
          echo "ok  coverage-manifest.json is byte-identical to what this run derived"
      - name: The recorded floor must not exceed what actually ran
        run: node tooling/ci/assert-case-count-honest.mjs --junit "${{ runner.temp }}/guard-tests.junit.xml" --executed-floor tooling/ci/test/executed-floor.json
      - name: Guard tree walks cannot leave the tree
        run: node tooling/ci/assert-walks-bounded.mjs
      - name: A local script reads a workflow through workflow-scan, or refuses when blind
        run: node tooling/ci/assert-workflow-readers.mjs
      - name: No new test case is declared inside a loop, and the loop baseline only shrinks
        run: node tooling/ci/assert-no-loop-cases.mjs
      - name: A new mechanism claim arrives with its test or a recorded demotion, and the claim backlog only shrinks
        run: node tooling/ci/assert-mechanism-claims.mjs
      - name: An extension README's ungraded-fixture table says what the fixture-coverage baseline says
        run: node tooling/ci/assert-ungraded-baseline-doc.mjs
      - name: The enforcement index is what the tree says
        run: node tooling/ci/assert-enforcement-index.mjs
      - name: Every line of the app template is accounted for
        run: node tooling/ci/assert-chassis-ledger.mjs
      - name: Guards refuse an empty subject
        run: node tooling/ci/assert-guards-refuse-empty.mjs
      - name: No dead tracked files
        run: node tooling/scripts/assert-no-dead-files.mjs

  guards-platform:
    name: Guards — platform, data and ops
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      issues: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      - name: No Worker schedules itself with a Durable Object alarm
        run: node tooling/ci/assert-no-do-alarms.mjs
      - name: Schema evolution is additive-only
        run: node tooling/ci/check-migrations.mjs
      - name: D1 bindings are real and consistent across Workers
        run: node tooling/ci/assert-d1-bindings.mjs
      - name: A D1 location hint is latency, never residency
        run: node tooling/ci/assert-d1-location-hint.mjs
      - name: A Hyperdrive configuration is capped, and the caps fit the origin
        run: node tooling/ci/assert-hyperdrive-cap.mjs
      - name: The shared server declares every route and every binding
        run: node tooling/ci/assert-platform-register.mjs
      - name: The served app set is data, and onboarding needs no Worker edit
        run: node tooling/ci/assert-config-registry.mjs
      - name: A Worker's unhandled error reaches a sink, not just the log
        run: node tooling/ci/assert-worker-error-sink.mjs
      - name: No Worker test mixes a pinned clock with the wall clock
        run: node tooling/ci/assert-test-clock-mix.mjs
      - name: Every hard cap derives from a sourced free-tier ceiling
        run: node tooling/ci/assert-ceiling-budget.mjs
      - name: CORS allowlist is derived from the app catalogue
        run: node tooling/ci/assert-cors-allowlist.mjs
      # Since [ADR 075] every app shares one origin, so `Origin` can no longer tell
      # one app's caller from another's. This is the guard that keeps the CORS
      # middleware the ONLY place that reads it.
      - name: Origin decides CORS headers and nothing else
        run: node tooling/ci/assert-no-origin-authz.mjs
      # The app's public address is a path on the apex, and the route table, the
      # catalogue and the base href all say the same thing.
      - name: An app is published at a path on the apex, never on a subdomain
        run: node tooling/ci/assert-app-address-shape.mjs
      # One AASA and one assetlinks.json now serve every app on the shared apex, so a
      # hand-written entry for one app breaks deep linking for all of them. Today both
      # files are ABSENT and the guard asserts that absence as a measured pair.
      - name: The origin-wide association files are generated, or absent for a reason
        run: node tooling/ci/assert-well-known-shape.mjs
      - name: Every deployable unit is claimed by a lane
        run: node tooling/ci/assert-lane-coverage.mjs
      - name: Every deployed hostname is declared, and its monitor gap is visible
        run: node tooling/ci/assert-monitor-coverage.mjs
      # OFFLINE by design — no --live, no token. ci.yml's standing objection to a
      # CI limb depending on the GlitchTip box stands; what this asserts is that
      # the workflows agree with EACH OTHER and spell the project out, which is
      # the half that was false on 2026-09-09 and is knowable from the tree.
      - name: One GlitchTip project, spelled out, at every call site
        run: node tooling/ci/assert-glitchtip-project.mjs
      # OFFLINE by design — no --live, no token, for the same standing reason as
      # the step above. What the offline limbs assert is knowable from the tree:
      # the SDK's default-PII flag is off, no client or Worker source names an
      # IP-bearing field or reads a client-IP header, and the free-text IPv4/IPv6
      # rules are both declared AND applied. The live half — spoofed headers
      # through the public edge and the event read back — is a laptop/runbook
      # step (`--live`), never merge-blocking, because it depends on the
      # GlitchTip box. Owner ruling 2026-09-15, register O-CRASH-EVENT-IP-DROP.
      - name: No crash event carries an IP address, truncated or not
        run: node tooling/ci/assert-glitchtip-no-ip.mjs
      - name: Every failure has a detector, a response and a cadence
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GLITCHTIP_TOKEN: ${{ secrets.GLITCHTIP_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tooling/ci/assert-ops-register.mjs
      - name: Every alerting firing has a recorded disposition
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tooling/ci/assert-alert-disposition.mjs
      - name: No workflow or register names a repository that no longer exists
        run: node tooling/ci/assert-no-dead-repo-names.mjs
      - name: Every pinned input is reached by a live update manager
        run: node tooling/ci/assert-update-coverage.mjs
      - name: Every store the portfolio holds has a declared retention rule
        run: node tooling/ci/assert-retention-coverage.mjs
      - name: The events rollup stays lossless and the sweep stays fail-closed
        run: node tooling/ci/assert-rollup-lossless.mjs
      - name: Path-filtered deploys list every build input
        run: node tooling/ci/assert-deploy-triggers.mjs
      - name: Dependency resolution is reproducible
        run: node tooling/ci/assert-lockfile-discipline.mjs
      - name: Workflows are SHA-pinned and least-privilege
        run: node tooling/ci/assert-workflow-hardening.mjs
      - name: Every job is bounded once, at a number somebody chose
        run: node tooling/ci/assert-workflow-timeouts.mjs
      - name: A green tick means the work ran
        run: node tooling/ci/assert-green-means-ran.mjs
      - name: Every deploy trigger can reach a deploy job
        run: node tooling/ci/assert-deploy-triggers-deploy.mjs
      - name: The 6-platform proof is fresh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tooling/ci/assert-platform-proof-fresh.mjs
      - name: The nightly golden-path proof is fresh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tooling/ci/assert-e2e-proof-fresh.mjs
      - name: The nightly exercised the legs it claims
        run: node tooling/ci/assert-e2e-legs.mjs
      - name: Every statement sent to D1 is one D1 will run
        run: node tooling/ci/assert-d1-sql-inventory.mjs
      - name: Every shared table declares how its rows are attributed
        run: node tooling/ci/assert-prod-provenance.mjs
      - name: No provider reads a provider that already watches it
        run: node tooling/ci/assert-provider-graph-acyclic.mjs
      - name: Selection records resolve (N-9)
        run: node tooling/scripts/check-selection-record.mjs
      # ⏱ WIRED 2026-09-08, the day after it landed. check-agent-docs.mjs arrived
      # in 9b4cd308 with no workflow, no hook, no enforcement-index row and no
      # test, and all five of its limbs are warnings until promoteOn 2026-09-22 —
      # so without this step that date would have arrived on a guard that had
      # never executed in CI, and the first thing it ever did in a build would be
      # to fail one. It exits 0 on a warn-limb finding by design and 2 on
      # COVERAGE LOST, so a step that goes red here is a real finding or a real
      # refusal, never a warning. It reads the git INDEX, which is why this job's
      # checkout uses fetch-depth: 0.
      - name: The instruction docs stay inside their caps (warn until 2026-09-22)
        run: node tooling/scripts/check-agent-docs.mjs
      # START-HERE.md is GENERATED and has TWO guards, because they catch
      # different things. This one fails on a HAND EDIT: the card is the first
      # thing a cold session reads, and a card somebody typed into can say
      # anything. check-agent-docs limb A-SIZE is the other, and it fails on a
      # card that grew legitimately, through the generator, past 4 KiB.
      - name: START-HERE.md is what the tree generates
        run: node tooling/scripts/gen-start-here.mjs --check

  guards-legal:
    name: Guards — privacy, legal and money
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      - name: An Apple privacy manifest that exists is one the build copies
        run: node tooling/ci/assert-privacy-manifest.mjs
      - name: The repository states its own legal posture
        run: node tooling/ci/assert-repo-posture.mjs
      - name: Every policy version a user consented to is still retrievable
        run: node tooling/ci/assert-policy-archive.mjs
      - name: Every published legal claim is paired, and the payment path is named
        run: node tooling/ci/assert-policy-claims.mjs
      - name: Every live sink declares what it holds, and no page denies it
        run: node tooling/ci/assert-sink-disclosure.mjs
      - name: Every store that holds data is inventoried and disclosed
        run: node tooling/ci/assert-data-inventory.mjs
      - name: The per-market duty matrix cannot silently rot
        run: node tooling/ci/assert-legal-tripwires.mjs
      - name: Every shipped asset has rights evidence, and every app shows it
        run: node tooling/ci/assert-licence-register.mjs
      - name: One analytics envelope, and the consent trail stays append-only
        run: node tooling/ci/assert-analytics-contract.mjs
      - name: The entitlement contract is complete before the first payment
        run: node tooling/ci/assert-entitlement-contract.mjs
      - name: ONE reader of the entitlement tables, mounted by every Worker
        run: node tooling/ci/assert-one-entitlement-reader.mjs
      - name: No writer can strand a NULL in a money-schema key column
        run: node tooling/ci/assert-no-null-entitlement-key.mjs
      - name: One verifier stands between a provider and the entitlement table
        run: node tooling/ci/assert-mor-adapters.mjs
      - name: Sandbox money cannot grant a production unlock
        run: node tooling/ci/assert-money-config.mjs
      - name: A stored notification replayed in any order reaches the same entitlement
        run: node tooling/ops/money-dry-run.mjs
      - name: The bundle's coming-soon gate is derived, and it moves in both directions
        run: node tooling/ci/assert-bundle-availability.mjs
      - name: No store surface promises a bundle that cannot be bought
        run: node tooling/ci/assert-no-store-bundle-copy.mjs
      - name: No bundle entitlement exists without a verified receipt
        run: node tooling/ci/assert-bundle-provenance.mjs
      - name: Every app with accounts ships a deletion control
        run: node tooling/ci/assert-deletion-control.mjs
      - name: Account deletion reaches every user-owned table, never via a shared secret
        run: node tooling/ci/assert-erasure-reach.mjs
      - name: Fail-closed seams have a real on-switch
        run: node tooling/ci/assert-seams-wired.mjs
      - name: Analytics consent can be WITHDRAWN, not only given
        run: node tooling/ci/assert-consent-withdrawal-surface.mjs
      - name: Every captcha-gated auth call carries a token
        run: node tooling/ci/assert-captcha-gated-call-sites.mjs
      - name: No sign-up consent box is born ticked, and the terms tick blocks
        run: node tooling/ci/assert-signup-consent-shape.mjs
      - name: Every shared capability has one home and a real consumer
        run: node tooling/ci/assert-capability-register.mjs
      - name: The Supabase auth email templates stay restorable
        run: node tooling/ci/assert-supabase-templates.mjs
      - name: One record of how mail is sent, and no document contradicts it
        run: node tooling/ci/assert-mail-transport-claims.mjs
      - name: The purchase path is whole, bounded, declared and cancellable
        run: node tooling/ci/assert-purchase-path.mjs
      - name: No price is typed into app code
        run: node tooling/ci/assert-no-price-literals.mjs
      - name: The money funnel is wired, and the pseudonymity firewall holds
        run: node tooling/ci/assert-pseudonymity-firewall.mjs
      - name: A legal document published twice says the same thing in both places
        run: node tooling/ci/assert-legal-text-parity.mjs

  guards-store:
    name: Guards — store, release and versioning
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      - name: Build versions all match versions.json
        run: node tooling/ci/assert-version-consistency.mjs
      - name: Every Renovate bump reaches every copy the version guard reads
        run: node tooling/ci/assert-renovate-reach.mjs
      - name: The app version is derived and monotonic
        run: node tooling/ci/assert-app-versioning.mjs
      - name: Every claimed channel is a served channel
        run: node tooling/ci/assert-channel-register.mjs
      - name: Every store in the platform manifest has a channel row, and every store channel has a store
        run: node tooling/ci/assert-store-bijection.mjs
      - name: No public surface advertises an unserved or dead channel
        run: node tooling/ci/assert-channel-claims.mjs
      - name: Every declared store channel has a complete, spec-derived listing
        run: node tooling/ci/assert-store-metadata.mjs
      - name: The app declaration is valid and everything rendered from it is fresh
        run: node tooling/ci/assert-app-yaml.mjs
      - name: Both of an app's names are shippable — the store title and the icon label
        run: node tooling/ci/assert-app-naming.mjs
      # why: OFFLINE. It reads apps/<app>/name-clearance.json and never dials out —
      # the networked probe that WRITES that record takes ~14 s and is a routine, not
      # a gate. docs/name-clearance.md carries the measurement and the split.
      - name: Every declared app name carries a current, non-blocked clearance record
        run: node tooling/ci/assert-name-clearance.mjs
      - name: Every Linux store channel can produce a complete snapcraft recipe
        run: node tooling/ci/assert-snapcraft-generable.mjs
      - name: The Play listing graphics exist, are the sourced size, and say where they came from
        run: node --single-threaded tooling/ci/assert-listing-assets.mjs
      - name: The Play screenshot set spans enough device types
        run: node tooling/ci/assert-play-device-coverage.mjs
      - name: The Data safety and content-rating declarations still describe the code
        run: node tooling/ci/assert-play-declarations.mjs
      - name: The sworn store declarations have not regressed toward the stamp
        run: node tooling/ci/assert-sworn-store-files.mjs
      - name: The advertising declarations still describe the shipped tree
        run: node tooling/ci/assert-ads-declarations.mjs
      - name: The Microsoft Store submission path still walks (dry run)
        run: node tooling/release/submit-windows-store.mjs --dry-run --app subscriptiontracker --allow-missing-artifact
      - name: The App Store submission path still walks — iOS (dry run)
        run: node tooling/release/submit-appstore.mjs --dry-run --channel ios-appstore --app subscriptiontracker --allow-missing-artifact
      - name: The App Store submission path still walks — macOS (dry run)
        run: node tooling/release/submit-appstore.mjs --dry-run --channel macos-appstore --app subscriptiontracker --allow-missing-artifact
      - name: The Snap Store submission path still walks (dry run)
        run: node tooling/release/submit-snap.mjs --dry-run --app subscriptiontracker --allow-missing-artifact
      - name: The Google Play submission path still walks (dry run)
        run: node tooling/release/submit-play.mjs --dry-run --app subscriptiontracker --allow-missing-artifact
      - name: No release build from an ungated commit, no publish unrecorded
        run: node tooling/ci/assert-release-provenance.mjs
      - name: No release lane finishes with the artifact stuck inside the run
        run: node tooling/ci/assert-release-durable.mjs
      - name: Nothing is compiled into an artifact that was not declared shippable
        run: node tooling/ci/assert-no-secret-defines.mjs
      - name: Obfuscation and symbol retention are one increment or neither
        run: node tooling/ci/assert-obfuscation-coupled.mjs
      - name: No shipped client overrides TLS certificate trust
        run: node tooling/ci/assert-no-tls-pinning.mjs
      - name: The web channel declares a cache policy a deploy can be seen through
        run: node tooling/ci/assert-web-cache-policy.mjs . sites/nikatru sites/rajasekarselvam
      - name: Release lanes cover every app, and no guard hides a lane
        run: node tooling/ci/assert-release-lane-generic.mjs
      - name: Nothing is published without being launched once
        run: node tooling/ci/assert-launch-smoke.mjs
      - name: One app_id derives every store identity, on every platform
        run: node tooling/ci/assert-store-identity.mjs
      # why: THE TREE HALF OF O-STAMP-APPLE-PROVISIONING-MANUAL. Runner.entitlements
      # is derived from tooling/apple-provisioning.json; the live-profile half needs
      # the ASC key and is `node tooling/ops/provision-apple.mjs --app <slug>`.
      - name: Every iOS entitlements file is derived from its declared Apple capabilities
        run: node tooling/ci/assert-apple-entitlements.mjs
      - name: No live resource carries a retired name [ADR 079]
        run: node tooling/ci/assert-retired-names.mjs
      - name: Every NIKATRU hostname is the apex or one label deep [ADR 080]
        run: node tooling/ci/assert-hostname-depth.mjs
      - name: No submission endangers the store identity
        run: node tooling/ci/assert-submission-safety.mjs
      - name: No publishing lane finishes without a [10]D-9 record
        run: node tooling/ci/assert-publish-records.mjs
      - name: The Android module pins the API level Google Play requires
        run: node tooling/ci/assert-android-target-sdk.mjs
      - name: No store artifact is the demo build
        run: node tooling/ci/assert-store-build-config.mjs
      - name: An app that pulls flutter_inappwebview carries its native build waivers
        run: node tooling/ci/assert-inappwebview-waivers.mjs
      # why: [ADR 067] decision 1's fourth artefact. Appended at the END of this
      # job on purpose — an insertion shifts every `ci.yml:NNNN` citation below
      # it, and the private corpus holds ~1,647 of them, so a new step goes where
      # it moves the fewest.
      - name: The store vocabulary has one home, and every word in it is used
        run: node tooling/ci/assert-store-vocabulary.mjs

  guards-chassis:
    name: Guards — chassis, app surface and packages
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      - name: No desktop app shows users a package id where its company name belongs
        run: node tooling/ci/assert-desktop-runner-identity.mjs
      - name: A stamped app CALLS every capability it declares
        run: node tooling/ci/assert-stamp-wiring.mjs
      - name: No capability exists twice, in an app or the template
        run: node tooling/ci/assert-no-seam-forks.mjs
      - name: Every shared package the template delegates to is adopted by every app
        run: node tooling/ci/assert-chassis-parity.mjs
      - name: Shared code carries no app-specific vocabulary
        run: node tooling/ci/assert-no-clone-tells.mjs
      - name: Core stays pure, the design system stays domain-free, apps use the seams
        run: node tooling/ci/assert-package-boundaries.mjs
      - name: Every package is earned, or dated
        run: node tooling/ci/assert-package-earned.mjs
      - name: Every vendor satisfies the portability checklist
        run: node tooling/ci/assert-vendor-portability.mjs
      - name: One convention set reaches every app, and can fail a build
        run: node tooling/ci/assert-lint-inheritance.mjs
      - name: No app has hollowed out the gates it inherited
        run: node tooling/ci/assert-no-gate-weakening.mjs
      - name: No hardcoded user-facing strings in the brick
        run: node tooling/ci/assert-no-hardcoded-strings.mjs
      - name: Every adapter declares where it works
        run: node tooling/ci/assert-adapter-capabilities.mjs
      - name: The inherited screen set is declared, present and reachable
        run: node tooling/ci/assert-screen-set.mjs
      - name: Every reachable surface has a width measurement, and every measurement a surface
        run: node tooling/ci/assert-responsive-coverage.mjs
      - name: Every reachable surface has an accessibility sweep, and every sweep a surface
        run: node tooling/ci/assert-a11y-coverage.mjs
      - name: A first-run gate is found by its CONTROL, never by its widget type
        run: node tooling/ci/assert-modal-detection.mjs
      - name: Every rollout read is an observed rollout
        run: node tooling/ci/assert-flag-exposure.mjs
      - name: Every app carries a done-record, and its DoD items really run
        run: node tooling/ci/assert-app-dod.mjs
      # why HERE and not in guard-meta: this is the STATIC half of the Dart
      # mutation harness — it resolves every done-record row to a real test
      # declaration and compares each proof against a content hash of the code it
      # probed. It costs milliseconds, needs no Flutter, and unlike
      # assert-app-dod.mjs above it does NOT hold apps/subscriptiontracker exempt,
      # so it is the only thing in CI that grades that app's fourteen rows.
      # The EXECUTED half (--execute, which applies each mutation and requires the
      # named test to go red) is deliberately not wired into any push job: it was
      # measured at 90–140 minutes for a full sweep against a 25-minute cap. The
      # guard's own header carries the measurement and the argument.
      - name: Every mutation proof still addresses the code it was run against
        run: node tooling/ci/assert-mutation-proofs.mjs

  security-scan:
    # why: split out so a leaked credential is not reported as "the platform
    # Worker lane failed". Both tools are pinned binaries with a checksum, never
    # the vendor action — gitleaks-action v2+ is a commercial licence for org
    # accounts (09-selfhost-build-release.md §4.2).
    name: Security — secret and workflow scanners
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      # 🔴 SET HERE, NOT IN A JOB-LEVEL `env:`. The `runner` context does not
      # exist while job-level `env:` is evaluated — only github, needs, strategy,
      # matrix, vars, inputs and secrets do — so `PINNED_TOOL_CACHE: ${{
      # runner.temp }}/…` made GitHub reject this whole file. An invalid workflow
      # file does not fail a job: it produces a run with NO jobs at all, so
      # `ci-gate` never reported and the PR sat BLOCKED with nothing to re-run.
      # `RUNNER_TEMP` is a plain environment variable inside a step, which is
      # why the same value is written to $GITHUB_ENV instead.
      - name: Point the pinned-tool installer at the cache directory
        run: echo "PINNED_TOOL_CACHE=${RUNNER_TEMP}/pinned-tool-cache" >> "$GITHUB_ENV"
      # 🔴 A CHECKSUM-VERIFIED CACHE, NOT A TRUSTED ONE. An Actions cache entry is
      # writable from any branch, so a restored entry is untrusted input:
      # install-pinned-tool.mjs compares its sha256 against the digest in
      # tooling/versions.json before using it, and downloads anyway when it does
      # not match. What the cache buys is that the four scanners cost no network
      # at all on a re-run — which is exactly the situation the 2026-09-12 red
      # left main in (wget exit 4, gitleaks never installed, ci-gate not green,
      # deploy-web refused). The key carries the digest of versions.json, so
      # advancing any pin is a different cache.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/pinned-tool-cache
          key: pinned-tools-${{ runner.os }}-${{ hashFiles('tooling/versions.json') }}
      # 🔴 THE VERSION AND THE DIGEST ARE READ FROM tooling/versions.json, NOT
      # WRITTEN HERE. Until 2026-09-06 all four scanners below carried their pin
      # as an `env:` literal in this job and nowhere else, which put them outside
      # BOTH mechanisms this repository has for a pinned input: F-2's single
      # declaration, and [pipeline 14]O-9's update coverage. A pin inside a
      # workflow is invisible to tooling/ci/assert-update-coverage.mjs, so these
      # four were advanced by nobody and no guard could say so — the exact state
      # `wrangler` was in until 2026-08-02, with one thing that makes it worse: a
      # stale test framework goes red, and a stale SCANNER goes quiet.
      # The `node -p` idiom is deploy-web.yml's, already used for glitchtip_cli
      # and wrangler, so nothing in THIS FILE is a literal any more.
      #
      # 🔴 CORRECTED 2026-09-06, SAME DAY. This comment previously went on to say
      # "Nothing here is a literal, so assert-version-consistency.mjs correctly
      # carries no rule for these keys — a drift rule whose scan has no target is
      # an assertion that cannot fail." The first half is true of this file and
      # the conclusion was false of the tree: `git grep -n VALIDATED_AGAINST`
      # finds tooling/ci/scan-secrets.mjs declaring `const VALIDATED_AGAINST =
      # '8.30.1'`, a second live copy of the `gitleaks` value in executable code.
      # It was dormant while nothing advanced either copy; giving `gitleaks` a
      # Renovate customManager is what made it drift-able by machine. There is
      # now a `gitleaks (scan-secrets VALIDATED_AGAINST)` rule in
      # assert-version-consistency.mjs, with scan-secrets.mjs as a REQUIRED
      # target. The other three keys have no second literal — measured, see
      # $scanners_comment in tooling/versions.json for the command.
      # 🔴 BOUNDED RETRY, THEN THE VERIFIED CACHE — the four steps below were
      # `wget -q -O`, which retries NOTHING. On 2026-09-12 the gitleaks line
      # failed with exit 4 (network) on a push to main; the scanner never ran, so
      # ci-gate recorded main as not green and deploy-web REFUSED. A single re-run
      # fixed it. Every other pinned download in this repository already used
      # `curl … --retry 3 --retry-all-errors`; these four scanners, the ones that
      # gate a deploy, were the exception. The URL, the archive kind and the
      # member are now DATA in tooling/ci/install-pinned-tool.mjs, and the
      # behaviour has tests (a failed attempt then a good one, a bound that
      # binds, a cache entry whose bytes are wrong) that no `run:` block can have.
      - name: Install gitleaks (version and digest from tooling/versions.json)
        run: |
          set -euo pipefail
          node tooling/ci/install-pinned-tool.mjs gitleaks --out "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/gitleaks" version
      - name: Secret scan (self-tests, then scans)
        run: node tooling/ci/scan-secrets.mjs . --gitleaks "${RUNNER_TEMP}/gitleaks"
      # ⚠️ THE ASSET NAME CARRIES NO VERSION — `zizmor-x86_64-unknown-linux-gnu.tar.gz`
      # is the same string at every release, and only the `/v${ver}/` path segment
      # differs. So on this lane the digest is not a second opinion about the
      # bytes, it is the only thing that distinguishes one release's bytes from
      # another's.
      - name: Install zizmor (version and digest from tooling/versions.json)
        run: |
          set -euo pipefail
          node tooling/ci/install-pinned-tool.mjs zizmor --out "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/zizmor" --version
      - name: Workflow static analysis (self-tests, then scans)
        run: node tooling/ci/scan-workflows.mjs . --zizmor "${RUNNER_TEMP}/zizmor"

      # ⚠️ A BARE BINARY, NOT A TARBALL — downloaded and `chmod +x`'d directly, so
      # the digest is the ONLY integrity check standing between the download and
      # an executable that then walks the whole workspace.
      - name: Install OSV-Scanner (version and digest from tooling/versions.json)
        run: |
          set -euo pipefail
          node tooling/ci/install-pinned-tool.mjs osv-scanner --out "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/osv-scanner" --version
      - name: Known-vulnerable dependencies, INCLUDING the Dart ones
        # why: the only scanner in this stack that reads pubspec.lock. Play
        # Console flags vulnerable SDK versions and can block updates, so this is
        # one of the two scanners here with a store consequence. Findings that
        # are acknowledged rather than fixed are DATED in osv-scanner.toml at the
        # repo root, which this reads by its own default name.
        run: |
          set -euo pipefail
          # why: --config is EXPLICIT. Without it v2 resolves a config per
          # lockfile DIRECTORY, so a root file loads, prints "unused ignores"
          # and ignores nothing for packages/tokens/package-lock.json.
          # Measured: run 33960900452.
          "${RUNNER_TEMP}/osv-scanner" scan source -r --config osv-scanner.toml .
      - name: Install Trivy (version and digest from tooling/versions.json)
        run: |
          set -euo pipefail
          node tooling/ci/install-pinned-tool.mjs trivy --out "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/trivy" --version
      - name: Vulnerabilities and misconfigurations in the filesystem
        # why: HIGH and CRITICAL only, and only what has a fix. A gate that goes
        # red on something nobody can act on gets switched off, and a switched-off
        # gate is worse than no gate at all.
        env:
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/trivy" fs --scanners vuln,misconfig --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress .

  site-tokens:
    # why: the job id stays `site-tokens` even though the lane now covers three
    # runtimes rather than the sites alone. ci-gate's `needs:` list names it, and
    # tooling/ci/assert-green-means-ran.mjs asserts that list by name — renaming
    # a job id here is a two-file change with a required-check consequence, and
    # the name below is where the widened scope is said out loud instead.
    name: Design tokens (build + drift, all three outputs)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/tokens
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - run: npm ci
      # why: ALL THREE outputs are deleted, not just the CSS. The delete is what
      # makes this a re-derivation rather than a comparison — an output left in
      # place is checked only for "the build did not change it", which a build
      # that never wrote the file also satisfies. Source is
      # contracts/tokens/dtcg/ ([ADR 067] decision 1); the three outputs are the
      # CSS the sites reference, Dart constants for the Flutter apps, and a JSON
      # table the build-free extension subtree can read.
      - name: Delete all three artifacts so the build has to produce them
        run: |
          rm -f ../../sites/_shared/assets/tokens.css
          rm -f ../design_system/lib/src/tokens/brand_tokens.dart
          rm -f ../../extensions/core/tokens.json
      - run: npm run build
      - name: The build actually wrote all three artifacts
        run: |
          test -s ../../sites/_shared/assets/tokens.css
          test -s ../design_system/lib/src/tokens/brand_tokens.dart
          test -s ../../extensions/core/tokens.json
      # why: ONE PATH PER LINE — and no backslash continuations either.
      # assert-green-means-ran.mjs pairs every path a drift step diffs with an
      # "rm -f" of that same path earlier in the same job, and its matcher
      # captures ONE path per match. Three paths on a single line therefore
      # pair only the FIRST with a deletion; the other two are diffed and never
      # required to have been deleted at all. Measured 2026-09-05 on this file,
      # one mutation at a time: with all three on one line, removing the
      # "rm -f" of brand_tokens.dart or of extensions/core/tokens.json left the
      # guard at exit 0, while removing the tokens.css one gave exit 1 — two of
      # the three outputs could silently lose their delete-before-diff. Split
      # one-per-line, removing any of the three gives exit 1 naming that file.
      # A backslash continuation is the OTHER wrong answer: the matcher then
      # reads the continuation character itself as the path, which is how the
      # first draft failed with 'job "site-tokens" diffs [backslash] against
      # HEAD, but no earlier step deletes it first'.
      # ⚠️ And the drift-lane phrase is deliberately NOT quoted anywhere in this
      # comment: green-means-ran.test.mjs counts its occurrences across every
      # workflow file to derive how many drift checks the guard must report, and
      # it counts comment text too — a comment quoting the phrase inflates that
      # count by one and reddens a test about something else entirely.
      - name: All three outputs must equal a fresh build
        run: |
          git diff --exit-code -- ../../sites/_shared/assets/tokens.css
          git diff --exit-code -- ../design_system/lib/src/tokens/brand_tokens.dart
          git diff --exit-code -- ../../extensions/core/tokens.json

  site-shared:
    name: Shared site build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sites/_shared
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - run: npm ci
      - run: npm run build && test -s _site/index.html  # eleventy exits 0 on "Wrote 0 files"


  content-gate:
    name: Content pipeline (recipe -> pack -> sign -> gate)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - name: The pipeline's own tests
        run: node --test "tooling/content_pipeline/test/*.test.mjs"
      - name: The pipeline builds and signs the example pack, through the CLI
        run: |
          node tooling/content_pipeline/cli.mjs validate --recipe tooling/content_pipeline/examples/lingo-phrases/recipe.json
          node tooling/content_pipeline/cli.mjs build --recipe tooling/content_pipeline/examples/lingo-phrases/recipe.json --out "$RUNNER_TEMP/pack" --test-key
      - name: A recipe is a validated input contract, and the shards agree
        run: node tooling/ci/assert-recipe-contract.mjs
      - name: No pack ships a licence family nobody cleared
        run: node tooling/ci/assert-content-licences.mjs
      - name: The pipeline reproduces the frozen pack, and the signature binds the bytes
        run: node tooling/ci/assert-pack-roundtrip.mjs
      - name: A pack is inert data in only the locked formats
        run: node tooling/ci/assert-pack-inert.mjs
      - name: Every produced item has an IP-clean, logged prompt
        run: node tooling/ci/assert-prompt-provenance.mjs
      - name: The human sample is deterministic, covered and checklisted
        run: node tooling/ci/assert-review-gate.mjs
      - name: Publish is a gate, and an undrilled signing key cannot sign
        run: node tooling/ci/assert-publish-gate.mjs

  app-brick:
    name: App brick (stamp both variants + analyze + validate the clone contract)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-flutter
      - uses: ./.github/actions/setup-node
      - name: Install mason_cli
        run: dart pub global activate mason_cli 0.1.4

      - name: No shipped app carries Flutter's default launcher icon
        run: |
          flutter --version
          node --single-threaded tooling/ci/assert-launcher-icons.mjs

      - name: Stamp the default (client-only) app
        run: |
          export PATH="$PATH:$HOME/.pub-cache/bin"
          export NIKATRU_ALLOW_OVERWRITE=1
          mason get
          mason make app -c tooling/bricks/app/_probe_vars.json -o . --on-conflict overwrite
      - name: Stamped app carries ITS brand assets, not Flutter's
        run: |
          SEED=$(node -p "require('./tooling/bricks/app/_probe_vars.json').seed_hex")
          node --single-threaded tooling/ci/assert-stamp-brand-assets.mjs apps/probe --seed "$SEED"
      - name: Stamped text is the spec's, its release id is its own, and blank hosts were DERIVED
        run: node tooling/ci/assert-stamp-text-fidelity.mjs --vars tooling/bricks/app/_probe_vars.json
      - name: A freshly stamped app carries a COMPLETE, spec-derived store listing
        run: node tooling/ci/assert-store-metadata.mjs
      - name: SHOW-1 — probe is in the catalogue, and a RE-STAMP changes nothing
        run: |
          export PATH="$PATH:$HOME/.pub-cache/bin"
          export NIKATRU_ALLOW_OVERWRITE=1
          grep -q '"slug": "probe"' catalog/apps.json
          cp catalog/apps.json "$RUNNER_TEMP/apps-after-1.json"
          cp pubspec.yaml "$RUNNER_TEMP/pubspec-after-1.yaml"
          mason make app -c tooling/bricks/app/_probe_vars.json -o . --on-conflict overwrite
          diff -u "$RUNNER_TEMP/apps-after-1.json" catalog/apps.json
          diff -u "$RUNNER_TEMP/pubspec-after-1.yaml" pubspec.yaml
          git checkout -- catalog/apps.json sites/_shared/_data/apps.json
      - name: Default stamp claims NO Worker, NO D1 and NO R2
        run: node tooling/ci/assert-clone-contract.mjs --client probe
      - name: Stamped app is dart format-clean
        run: dart format --output=none --set-exit-if-changed apps/probe
      - name: Stamp the opt-in backend app
        run: |
          export PATH="$PATH:$HOME/.pub-cache/bin"
          export NIKATRU_ALLOW_OVERWRITE=1
          mason make app -c tooling/bricks/app/_probe_backend_vars.json -o . --on-conflict overwrite
      - name: Stamped backend app is dart format-clean
        run: dart format --output=none --set-exit-if-changed apps/probeapi
      # why: A STAMPED WORKER MUST BE TESTABLE ON DAY ONE, and until 2026-09-12 it
      # was not: the template shipped no vitest, no `test` script and no test
      # directory, so the first thing an owner could not do with a fresh backend was
      # run its tests. This step is what makes that claim checkable rather than
      # declared - it installs the stamped Worker and runs the suite it inherits,
      # which is the chassis's own (services/_shared/test/**) plus the wiring test
      # the template owns. A failure here means a fresh stamp is born broken.
      - name: A stamped Worker typechecks and passes the suite it inherits
        working-directory: services/probeapi-api
        run: |
          npm install --no-audit --no-fund
          npx tsc --noEmit
          npm test
      - name: The app spec is one validated input contract
        run: node tooling/ci/assert-input-contract.mjs
      - name: A stamped app claims only platforms it is built for
        run: node tooling/ci/assert-stamp-platforms.mjs
      - name: Stamped app asserts its own chassis properties
        run: node tooling/ci/assert-stamp-properties.mjs
      - name: The stamped app carries a done-record, and its DoD items really run
        run: node tooling/ci/assert-app-dod.mjs . --require-stamped
      - name: Analyze + test the stamped app
        working-directory: apps/probe
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test
      - name: A fresh stamp really builds for web
        working-directory: apps/probe
        run: flutter build web --pwa-strategy=none --no-web-resources-cdn
      # 🔴 A STAMPED APP MUST SATISFY THE DEPLOY'S FONTS STEP ON THE DAY IT IS
      # STAMPED. deploy-web.yml builds every app with --no-web-resources-cdn and
      # then runs tooling/web/self-host-fallback-fonts.mjs, which REFUSES a bundle
      # whose flutter_bootstrap.js does not pass fontFallbackBaseUrl. The template
      # carried no web/flutter_bootstrap.js until 2026-09-12, so Flutter generated
      # a default one and the next stamped app's FIRST deploy would have stopped
      # there — after the app existed, was published in the catalogue and was
      # expected to be live. Nothing in the tree noticed, because the node test
      # that checks apps/*/web runs on an unstamped checkout.
      # `--check` is the same grading with the network half removed, so this lane
      # cannot be turned red by a font CDN having a bad minute.
      - name: A fresh stamp satisfies the deploy's self-hosted fallback fonts step
        run: node tooling/web/self-host-fallback-fonts.mjs --check apps/probe/build/web
      - name: Every asset the build actually shipped has a licence row
        run: node tooling/ci/assert-licence-register.mjs . --bundle apps/probe/build/web/assets

      - name: Backend stamp has a Worker + APP_DB but still no per-app R2
        run: node tooling/ci/assert-clone-contract.mjs --client probe --backend probeapi
      - name: The provisioner's config surgery still targets APP_DB, not the shared binding
        run: node tooling/scripts/provision-backend.mjs probeapi --self-check
      - name: Backend stamp derived its own web origin, API host and release id
        run: node tooling/ci/assert-stamp-text-fidelity.mjs --vars tooling/bricks/app/_probe_backend_vars.json --service services/probeapi-api
      - name: Revert the catalogue — both probes are throwaway
        run: git checkout -- catalog/apps.json sites/_shared/_data/apps.json
      - name: Analyze the stamped backend app
        working-directory: apps/probeapi
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test
      - name: The WHOLE workspace still resolves from the root with stamped apps on it
        run: flutter pub get
      - name: Revert the root pubspec + lockfile — both probes are throwaway
        run: git checkout -- pubspec.yaml pubspec.lock
      - name: Typecheck + dry-run the stamped service
        working-directory: services/probeapi-api
        run: |
          npm install
          npx tsc --noEmit
          npx wrangler deploy --dry-run

  sites:
    name: Static sites (functions parse + required files)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Site integrity
        run: node tooling/ci/check-site-integrity.mjs . sites/nikatru sites/rajasekarselvam
      - name: The published catalogue satisfies its contract
        run: node tooling/ci/assert-catalog-contract.mjs
      - name: Delete the feed so the generator has to produce it
        run: rm -f sites/_shared/_data/apps.json
      - run: node tooling/sites/generate-apps-data.mjs
      - name: The generator actually wrote the feed
        run: test -s sites/_shared/_data/apps.json
      - name: Site feed must equal a fresh generation from the catalogue
        run: git diff --exit-code -- sites/_shared/_data/apps.json
      - name: Catalogue advertises no dead app
        run: node tooling/ci/assert-catalog-reachable.mjs
      - name: The published render payload satisfies its contract
        run: node tooling/ci/assert-render-payload.mjs
      - name: Delete the payload so the publisher has to produce it
        run: rm -f catalog/apps-landing.json
      - run: node tooling/sites/generate-landing-payload.mjs
      - name: The publisher actually wrote the payload
        run: test -s catalog/apps-landing.json
      - name: Render payload must equal a fresh publish from the rail config
        run: git diff --exit-code -- catalog/apps-landing.json
      - name: Discovery surfaces match the registry that generated them
        run: node tooling/ci/assert-discovery-surface.mjs
      - name: Every inline palette copy still matches the token source
        run: node tooling/ci/assert-palette-consistent.mjs
      - name: No page claims a store channel the catalogue has not published to
        run: node tooling/ci/assert-availability.mjs
      - name: The store matrix registry is internally consistent (tree limbs run locally)
        run: node tooling/ci/assert-store-matrix.mjs --registry-only

  workspace-gate:
    name: Workspace gate (melos analyze + test)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Assert workspace coverage
        run: node tooling/ci/assert-workspace-coverage.mjs
      - uses: ./.github/actions/setup-flutter
      - name: Activate melos
        run: dart pub global activate melos 8.7.0
      - name: Resolve the workspace
        run: flutter pub get --enforce-lockfile
      # why: the chassis strings are gen-l10n output over
      # packages/design_system/lib/src/l10n/chassis_*.arb ([ADR 067] decision 2),
      # and the triplet is GITIGNORED — the same rule apps/*/lib/l10n follows,
      # for the reason .gitignore records: gen-l10n emits blanket
      # `ignore_for_file: type=lint` headers and assert-no-gate-weakening walks
      # `git ls-files`, so committing them was measured at FAIL, 5 problem(s).
      #
      # 🔴 `git diff` CANNOT BE THIS GATE, AND SHIPPING IT AS ONE WAS THE DEFECT.
      # The first version of this step ran a plain tracked-byte diff over
      # `packages/design_system/lib` and called that the drift check. (Spelled out
      # rather than quoted, deliberately: `green-means-ran.test.mjs` DERIVES how many
      # drift lanes exist by counting that exact command string across every workflow
      # file, so a comment quoting it invents a lane the guard cannot find — measured,
      # CI red at 8 counted against 7 reported.) The triplet is
      # UNTRACKED, so `git diff` cannot see it: measured by writing `BROKEN
      # GENERATOR OUTPUT` over all three files and running the step verbatim —
      # EXIT 0, with `git status --ignored=matching` showing all three as `!!`. A
      # gate whose only demonstrated property is that it passes is worse than no
      # gate, because the next reader stops looking.
      #
      # What replaces it compares the BUILD PRODUCT to itself across a rebuild:
      # hash what `flutter pub get` produced from the committed .arb files, delete
      # it, regenerate, hash again. That has a failing input — flip one byte of one
      # generated file, or change one .arb value without the arb being what the
      # generator reads, and the hashes differ — and it still asserts the three
      # things that can go silently wrong: the generator runs, it produces every
      # file, and what it produces is what the workspace resolved.
      - name: Record what the workspace resolved for the chassis localisations
        run: |
          set -euo pipefail
          # Missing files fail HERE, under `set -e`, rather than being hashed as
          # an empty set — "pub get produced nothing" and "the rebuild matched"
          # must not share an exit code.
          sha256sum packages/design_system/lib/src/l10n/chassis_localizations.dart \
                    packages/design_system/lib/src/l10n/chassis_localizations_en.dart \
                    packages/design_system/lib/src/l10n/chassis_localizations_ta.dart \
            > "$RUNNER_TEMP/chassis-l10n-before.sha256"
      - name: Delete the generated chassis localisations so gen-l10n has to produce them
        run: rm -f packages/design_system/lib/src/l10n/chassis_localizations*.dart
      - name: chassis l10n regenerates from the arb, byte for byte
        run: |
          set -euo pipefail
          (cd packages/design_system && flutter gen-l10n)
          for f in chassis_localizations.dart chassis_localizations_en.dart chassis_localizations_ta.dart; do
            test -s "packages/design_system/lib/src/l10n/$f"
          done
          # The half with a failing input: `sha256sum -c` fails on a file that
          # came back different and on a file that did not come back at all.
          sha256sum -c "$RUNNER_TEMP/chassis-l10n-before.sha256"
          # Tamil parity, from gen-l10n's own diagnostic. The ENFORCEMENT half is
          # packages/design_system/test/chassis_l10n_parity_test.dart, which names
          # the keys; this is the cheap early read of the same fact.
          test "$(cat packages/design_system/chassis-l10n-untranslated.json)" = '{}'
      # why: this one is about TRACKED bytes and says so. `flutter gen-l10n`
      # REWRITES `packages/design_system/analysis_options.yaml` as a side effect,
      # adding an `analyzer: exclude: build/**` block — measured on the runner, run
      # 34028952850 — which is why the path is `lib` and not the package root. Its
      # failing input is a generator pointed at a tracked source file: set
      # `output-localization-file: chassis_l10n_x.dart` and gen-l10n overwrites the
      # hand-written extension, which this step catches and the hash check above
      # does not. It is NOT the generated-output drift check; that is the step
      # above.
      - name: gen-l10n overwrote no TRACKED source file under the package
        run: git diff --exit-code -- packages/design_system/lib
      - name: The shipping app is dart format-clean
        run: dart format --output=none --set-exit-if-changed apps/subscriptiontracker
      - name: The Apple privacy manifests still describe the binaries that ship
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/assert-apple-privacy-manifest.mjs
      - name: melos run analyze
        run: |
          export PATH="$PATH:$HOME/.pub-cache/bin"
          melos run analyze
      - name: melos run test
        run: |
          export PATH="$PATH:$HOME/.pub-cache/bin"
          melos run test
      - name: Web arm in a real browser (dart test -p chrome)
        working-directory: packages/core
        run: |
          set -euo pipefail
          export CHROME_EXECUTABLE="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser)"
          echo "Chrome: $CHROME_EXECUTABLE"
          dart test -p chrome


  ci-gate:
    # why: the ONE required status check on main. It must need every other job in
    # this file and must treat skipped as not-green — a skipped required check
    # satisfies branch protection, which is how a lane goes dark under a tick.
    # tooling/ci/assert-green-means-ran.mjs asserts all of that by name.
    name: ci-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs:
      - worker-subscriptiontracker-api
      - worker-platform
      - guard-meta
      - guards-platform
      - guards-legal
      - guards-store
      - guards-chassis
      - security-scan
      - site-tokens
      - site-shared
      - content-gate
      - app-brick
      - sites
      - workspace-gate
    if: always()
    steps:
      - name: Require all lanes green
        run: |
          echo "worker-subscriptiontracker-api=${{ needs.worker-subscriptiontracker-api.result }}"
          echo "worker-platform=${{ needs.worker-platform.result }}"
          echo "guard-meta=${{ needs.guard-meta.result }}"
          echo "guards-platform=${{ needs.guards-platform.result }}"
          echo "guards-legal=${{ needs.guards-legal.result }}"
          echo "guards-store=${{ needs.guards-store.result }}"
          echo "guards-chassis=${{ needs.guards-chassis.result }}"
          echo "security-scan=${{ needs.security-scan.result }}"
          echo "site-tokens=${{ needs.site-tokens.result }}"
          echo "site-shared=${{ needs.site-shared.result }}"
          echo "content-gate=${{ needs.content-gate.result }}"
          echo "app-brick=${{ needs.app-brick.result }}"
          echo "sites=${{ needs.sites.result }}"
          echo "workspace-gate=${{ needs.workspace-gate.result }}"
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ] || [ "${{ contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "::error::One or more CI lanes failed, was cancelled, or never ran — see the verdicts above"; exit 1
          fi
          echo "All lanes green"
