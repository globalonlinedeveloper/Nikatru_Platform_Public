      - name: RED CONTROL — the probe's generated licence row removed, the bundle walk and the generator both refuse the file
        run: |
          echo "import { readFileSync, writeFileSync } from 'node:fs'; import { spawnSync } from 'node:child_process'; const reg = 'tooling/legal/asset-register.json'; const file = 'packages/purchases_flutter/assets/web/purchases_js_hybrid_mappings.js'; const green = readFileSync(reg, 'utf8'); const j = JSON.parse(green); const kept = j.appScopedAssets.filter((r) => !(r.scope === 'app:probe' && r.bundlePath === file)); if (kept.length !== j.appScopedAssets.length - 1) { console.log('::error::the register carries no app:probe row for ' + file + '; the stamp did not write it'); process.exit(1); } j.appScopedAssets = kept; writeFileSync(reg, JSON.stringify(j, null, 2) + String.fromCharCode(10)); const cmds = [['tooling/ci/assert-licence-register.mjs', '.', '--bundle', 'apps/probe/build/web/assets', '--app', 'probe'], ['tooling/ci/gen-app-licence-rows.mjs', '--check', '--app', 'probe']]; let bad = 0; for (const c of cmds) { const r = spawnSync(process.execPath, c, { encoding: 'utf8' }); const out = (r.stdout || '') + (r.stderr || ''); console.log(out); console.log(c[0] + ' exit with the row removed: ' + r.status); if (r.status !== 1 || !out.includes(file)) { console.log('::error::' + c[0] + ' exited ' + r.status + ' with the row removed; the red control requires exactly 1, naming ' + file); bad += 1; } } writeFileSync(reg, green); for (const c of cmds) { const r = spawnSync(process.execPath, c, { encoding: 'utf8' }); console.log(c[0] + ' exit restored: ' + r.status); if (r.status !== 0) { console.log((r.stdout || '') + (r.stderr || '')); console.log('::error::restored, ' + c[0] + ' exited ' + r.status); bad += 1; } } if (bad > 0) process.exit(1);" > "$RUNNER_TEMP/licence-row-red.mjs"
          node "$RUNNER_TEMP/licence-row-red.mjs"

      - name: Backend stamp has a Worker + APP_DB but still no per-app R2
        run: node tooling/ci/assert-clone-contract.mjs --client probe --backend probeapi
      - name: The provisioner's config surgery still targets APP_DB, not the shared binding
        run: node tooling/scripts/provision-backend.mjs probeapi --self-check
      - name: Backend stamp derived its own web origin, API host and release id
        run: node tooling/ci/assert-stamp-text-fidelity.mjs --vars tooling/bricks/app/_probe_backend_vars.json --service services/probeapi-api
      - name: Revert the catalogue — both probes are throwaway
        run: git checkout -- catalog/apps.json sites/_shared/_data/apps.json
      - name: Analyze the stamped backend app
        working-directory: apps/probeapi
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test
      - name: The WHOLE workspace still resolves from the root with stamped apps on it
        run: flutter pub get
      # why: O-BRICK-SWORN-FILES-HAVE-NO-PREVIEW-STATE. Here, not beside the sworn step above: limb 4
      # reads app #1's .flutter-plugins-dependencies, which only the resolve just above writes. The log
      # must count app #1 sworn and both web-only probes preview, each owing no Apple-native manifest.
      - name: The stamped probes' Apple audits are graded as preview, app #1's as sworn
        run: node tooling/ci/assert-apple-privacy-manifest.mjs
      - name: Revert the root pubspec + lockfile — both probes are throwaway
        run: git checkout -- pubspec.yaml pubspec.lock
      - name: Typecheck + dry-run the stamped service
        working-directory: services/probeapi-api
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit
          npx wrangler deploy --dry-run

