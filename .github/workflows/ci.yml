        env:
          GH_TOKEN: ${{ github.token }}
          RED_JOB: site-shared
        run: |
          echo "::notice title=FF-2 fail-fast::job '${RED_JOB}' is red and keeps its failure; '${GITHUB_JOB}' cancels the rest of run ${GITHUB_RUN_ID} (attempt ${GITHUB_RUN_ATTEMPT}), so every other job reads cancelled."
          gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" || true


  content-gate:
    name: Content pipeline (recipe -> pack -> sign -> gate)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - name: The pipeline's own tests
        run: node --import ./tooling/scripts/spawn-ceiling.mjs --test-timeout=600000 --test "tooling/content_pipeline/test/*.test.mjs"
      - name: The pipeline builds and signs the example pack, through the CLI
        run: |
          node tooling/content_pipeline/cli.mjs validate --recipe tooling/content_pipeline/examples/lingo-phrases/recipe.json
          node tooling/content_pipeline/cli.mjs build --recipe tooling/content_pipeline/examples/lingo-phrases/recipe.json --out "$RUNNER_TEMP/pack" --test-key
      - name: A recipe is a validated input contract, and the shards agree
        run: node tooling/ci/assert-recipe-contract.mjs
      - name: No pack ships a licence family nobody cleared
        run: node tooling/ci/assert-content-licences.mjs
      - name: The pipeline reproduces the frozen pack, and the signature binds the bytes
        run: node tooling/ci/assert-pack-roundtrip.mjs
      - name: A pack is inert data in only the locked formats
        run: node tooling/ci/assert-pack-inert.mjs
      - name: Every produced item has an IP-clean, logged prompt
        run: node tooling/ci/assert-prompt-provenance.mjs
      - name: The human sample is deterministic, covered and checklisted
        run: node tooling/ci/assert-review-gate.mjs
      - name: Publish is a gate, and an undrilled signing key cannot sign
        run: node tooling/ci/assert-publish-gate.mjs

  ff-content-gate:
    # why: FF-2 — starts only once `content-gate` has concluded red, so it keeps its failure. docs/ci/README.md §2.1
    name: fail-fast · content-gate
    needs: content-gate
    if: failure() && needs.content-gate.result == 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: content-gate is red, so the rest of this run is cancelled (FF-2)
        env:
          GH_TOKEN: ${{ github.token }}
          RED_JOB: content-gate
        run: |
          echo "::notice title=FF-2 fail-fast::job '${RED_JOB}' is red and keeps its failure; '${GITHUB_JOB}' cancels the rest of run ${GITHUB_RUN_ID} (attempt ${GITHUB_RUN_ATTEMPT}), so every other job reads cancelled."
          gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" || true

  sites:
    name: Static sites (functions parse + required files)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # why: sites/nikatru/sitemap.xml is generated in the job, never committed (D3b); every
      # reader below grades the bytes this writes. Needs the full history above (lastmod).
      - name: Generate the discovery surface (the sitemap is never committed)
        run: node tooling/sites/generate-discovery.mjs
      - name: Site integrity
        run: node tooling/ci/check-site-integrity.mjs . sites/nikatru sites/rajasekarselvam
      - name: The published catalogue satisfies its contract
        run: node tooling/ci/assert-catalog-contract.mjs
      - name: Delete the feed so the generator has to produce it
        run: rm -f sites/_shared/_data/apps.json
      - run: node tooling/sites/generate-apps-data.mjs
      - name: The generator actually wrote the feed
        run: test -s sites/_shared/_data/apps.json
      - name: Site feed must equal a fresh generation from the catalogue
        run: git diff --exit-code -- sites/_shared/_data/apps.json
      - name: Catalogue advertises no dead app
        run: node tooling/ci/assert-catalog-reachable.mjs
      - name: The published render payload satisfies its contract
        run: node tooling/ci/assert-render-payload.mjs
      - name: Delete the payload so the publisher has to produce it
        run: rm -f catalog/apps-landing.json
      - run: node tooling/sites/generate-landing-payload.mjs
      - name: The publisher actually wrote the payload
        run: test -s catalog/apps-landing.json
      - name: Render payload must equal a fresh publish from the rail config
        run: git diff --exit-code -- catalog/apps-landing.json
      # why: the whole site generator chain in its one order, compare-only. It ran post-merge
      # in site-drift-repair.yml until D3b retired that lane; here it runs before the merge.
      - name: The site generator chain is current (compare only)
        run: node tooling/sites/regen.mjs --check
      - name: Discovery surfaces match the registry that generated them
        run: node tooling/ci/assert-discovery-surface.mjs
      - name: The apex site's Pages bindings agree with its README, its Functions and its deploy job
        run: node tooling/ci/assert-site-bindings.mjs
      - name: Every inline palette copy still matches the token source
        run: node tooling/ci/assert-palette-consistent.mjs
      - name: No page claims a store channel the catalogue has not published to
        run: node tooling/ci/assert-availability.mjs

  ff-sites:
    # why: FF-2 — starts only once `sites` has concluded red, so it keeps its failure. docs/ci/README.md §2.1
    name: fail-fast · sites
    needs: sites
    if: failure() && needs.sites.result == 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: sites is red, so the rest of this run is cancelled (FF-2)
        env:
          GH_TOKEN: ${{ github.token }}
          RED_JOB: sites
        run: |
          echo "::notice title=FF-2 fail-fast::job '${RED_JOB}' is red and keeps its failure; '${GITHUB_JOB}' cancels the rest of run ${GITHUB_RUN_ID} (attempt ${GITHUB_RUN_ATTEMPT}), so every other job reads cancelled."
          gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" || true

  # why: the extensions CI lane, as ONE constituent of ci-gate. extensions-ci.yml runs
  # only as a call, and its jobs report inside this run; this job's result is red when
  # any of them is. No `if:` (green-means-ran A6), and no `timeout-minutes` — GitHub
  # rejects one on a call; every callee job bounds itself (workflow-hardening limb 4).
  # docs/ci/extensions-ci.md.
  extensions:
    name: extensions
    uses: ./.github/workflows/extensions-ci.yml
    # why: `actions: write` is the ceiling the callee's jobs run under, and each of its gate
    # jobs has an FF-2 follow-up job (`ff-<job>`), which needs it to cancel this run.
    permissions:
      contents: read
      actions: write


  ci-gate:
    # why: the ONE required status check on main. It must need every other job in
    # this file and must treat skipped as not-green — a skipped required check
    # satisfies branch protection, which is how a lane goes dark under a tick.
    # tooling/ci/assert-green-means-ran.mjs asserts all of that by name.
    name: ci-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs:
      - lane-workers
      - lane-apps
      - lane-brick
      - guard-meta
      - guard-tests
      - guard-tests-floor
      - guards-platform
      - guards-legal
      - guards-store
      - guards-chassis
      - security-scan
      - site-tokens
      - site-shared
      - content-gate
      - sites
      - extensions
    if: always()
    steps:
      - name: Require all lanes green
        run: |
          echo "lane-workers=${{ needs.lane-workers.result }}"
          echo "lane-apps=${{ needs.lane-apps.result }}"
          echo "lane-brick=${{ needs.lane-brick.result }}"
          echo "guard-meta=${{ needs.guard-meta.result }}"
          echo "guard-tests=${{ needs.guard-tests.result }}"
          echo "guard-tests-floor=${{ needs.guard-tests-floor.result }}"
          echo "guards-platform=${{ needs.guards-platform.result }}"
          echo "guards-legal=${{ needs.guards-legal.result }}"
          echo "guards-store=${{ needs.guards-store.result }}"
          echo "guards-chassis=${{ needs.guards-chassis.result }}"
          echo "security-scan=${{ needs.security-scan.result }}"
          echo "site-tokens=${{ needs.site-tokens.result }}"
          echo "site-shared=${{ needs.site-shared.result }}"
          echo "content-gate=${{ needs.content-gate.result }}"
          echo "sites=${{ needs.sites.result }}"
          echo "extensions=${{ needs.extensions.result }}"
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ] || [ "${{ contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "::error::One or more CI lanes failed, was cancelled, or never ran — see the verdicts above"; exit 1
          fi
          echo "All lanes green"

  # why: THE DEPLOYS RUN AFTER THE GATE, IN THIS RUN ([ADR 095] §4). Each needs ci-gate,
  # so a red, cancelled or skipped gate never starts one; the `if:` is the post-gate
  # predicate byte for byte (assert-green-means-ran A9), so a PR run never deploys.
  # Neither is a constituent of ci-gate — the gate needing a deploy back is a cycle.
  # No `timeout-minutes`: GitHub rejects one on a call; every callee job bounds itself.
  # The callees have no trigger of their own; each job's plan step decides whether
  # its unit publishes (tooling/ci/lane-map.json deployUnits). docs/ci/deploy-web.md,
  # docs/ci/deploy-workers.md.
  #
  # why: THE API DEPLOYS BEFORE THE WEB, ON THE SAME COMMIT (lead ruling on #1075,
  # review finding 11). A web build that ships a new request shape - the
  # Idempotency-Key a keyed create sends, which a browser preflight refuses until
  # the Worker allowing it is live - must not reach users before its API. So
  # deploy-web needs deploy-workers: it starts only after that job SUCCEEDED
  # (migrations applied, Workers deployed or planned as unchanged), and a failed
  # Worker deploy leaves the web on the build that matches the live API.
  # tooling/ci/test/workflow-scan.test.mjs reads this edge off the real file.
  #
  # why: PLATFORM_DB MIGRATES BEFORE BOTH (row O-APP-WORKERS-DEPLOY-BEFORE-THE-MIGRATION,
  # PB-03). Every app Worker, the platform Worker and the apex site's Function bind
  # platform_db, and its migrations used to run in deploy-workers' platform job, AFTER
  # every app Worker had gone live. platform-db-migrate applies them once, first; both
  # deploys need it, so a failed migration publishes nothing that reads platform_db.
  # assert-deploy-triggers-deploy.mjs limb 5 holds every PLATFORM_DB deploy behind it.
  platform-db-migrate:
    name: platform-db-migrate
    needs: [ci-gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/migrate-platform-db.yml
    permissions:
      contents: read
      deployments: read
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-web:
    name: deploy-web
    needs: [ci-gate, platform-db-migrate, deploy-workers]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-web.yml
    permissions:
      contents: read
      deployments: write
    secrets:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      GLITCHTIP_DSN: ${{ secrets.GLITCHTIP_DSN }}
      GLITCHTIP_TOKEN: ${{ secrets.GLITCHTIP_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUBSCRIBE_RATE_LIMIT_SALT: ${{ secrets.SUBSCRIBE_RATE_LIMIT_SALT }}

  deploy-workers:
    name: deploy-workers
    needs: [ci-gate, platform-db-migrate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-workers.yml
    permissions:
      contents: read
      deployments: write
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GLITCHTIP_DSN: ${{ secrets.GLITCHTIP_DSN }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
