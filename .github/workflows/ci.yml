name: CI

run-name: "CI on ${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.number) || github.ref_name }} by @${{ github.actor }}"

# The lane map, the shard boundaries and every rule this file has to obey are in
# docs/ci/README.md. Only `# why:` lines live here.

on:
  # why: main only; `pull_request:` (unfiltered) covers every branch that opens a PR.
  push:
    branches: [main]
  # why: land.yml merges with GITHUB_TOKEN, whose push starts no run, so it dispatches this on main (POST_GATE_IF).
  workflow_dispatch:
  pull_request:
    # why: `edited` so that fixing a PR body re-runs assert-pr-rows (guard-meta).
    # The other three are GitHub's defaults, listed because `types:` replaces them.
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ci-${{ github.ref }}
  # why: FALSE ON MAIN ONLY. Every push to main resolves to one group, so `true`
  # lets a later push kill the run the deploy gate is waiting on, and a cancelled
  # run notifies nobody. PR events resolve to refs/pull/N/merge and do cancel.
  # tooling/ops/safe-rerun.mjs reads this key by name.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # why: the workers lane, as ONE constituent of ci-gate (ADR 095). lane-workers.yml runs
  # only as a call; its detect job reads tooling/ci/lane-map.json and its lane-verdict job
  # refuses a skip detect did not license. No `if:` (green-means-ran A6), and no
  # `timeout-minutes` — GitHub rejects one on a call; every callee job bounds itself.
  lane-workers:
    name: lane-workers
    uses: ./.github/workflows/lane-workers.yml
    # why: `actions: write` is the ceiling the callee's jobs run under, and each of its gate
    # jobs has an FF-2 follow-up job (`ff-<job>`), which needs it to cancel this run.
    permissions:
      contents: read
      actions: write

  guard-tests:
    # why: the guards' own mutation suite, ONE step of guard-meta until 2026-10-01
    # and the longest thing on every run: 737 s median over 32 runs, 2,072
    # test-case-seconds 3 wide (Private research/session-2026-10-01/ci-speed).
    # Split across the matrix by measured duration; every shard plans ALL shards
    # and refuses a plan that is not a partition, and guard-tests-floor proves
    # from the junits that the shards ran the suite exactly once. NOT
    # change-filtered: several suites read the real tree (safe-rerun against
    # .github/workflows, ops-register against tooling/ops), so "only prose changed"
    # does not imply "this cannot go red".
    name: Guards — the guards can still fail (shard ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      issues: read
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      # why: the file list is written beside the junit, so guard-tests-floor grades
      # what each shard was GIVEN against what its junit says it RAN.
      # why: NO CLOUDFLARE TOKEN HERE (rv2-security-001). This step runs every test file the PR
      # carries, so it is PR-controlled code; the suites read Cloudflare only through fixtures.
      # assert-channel-register limb 8d refuses a deploy or publish secret in any job a PR can run.
      - name: The guards must be able to fail
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GLITCHTIP_TOKEN: ${{ secrets.GLITCHTIP_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/guard-tests"
          node tooling/ci/guard-test-shards.mjs --plan --shards 4 --shard ${{ matrix.shard }} --out "${{ runner.temp }}/guard-tests/files.txt" > /dev/null
          node --import "$SPAWN_CEILING" --test-timeout=600000 --test --test-reporter=spec  --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination="${{ runner.temp }}/guard-tests/guard-tests.junit.xml" $(cat "${{ runner.temp }}/guard-tests/files.txt")
      - name: Keep this shard's file list and junit for guard-tests-floor
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: guard-tests-junit-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/guard-tests/
          if-no-files-found: error
          retention-days: 7

  ff-guard-tests:
    # why: FF-2 — starts only once `guard-tests` has concluded red, so it keeps its failure. docs/ci/README.md §2.1
    name: fail-fast · guard-tests
    needs: guard-tests
    if: failure() && needs.guard-tests.result == 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: guard-tests is red, so the rest of this run is cancelled (FF-2)
        env:
          GH_TOKEN: ${{ github.token }}
          RED_JOB: guard-tests
        run: |
          echo "::notice title=FF-2 fail-fast::job '${RED_JOB}' is red and keeps its failure; '${GITHUB_JOB}' cancels the rest of run ${GITHUB_RUN_ID} (attempt ${GITHUB_RUN_ATTEMPT}), so every other job reads cancelled."
          gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" || true

  guard-tests-floor:
    # why: the one place that sees every shard. It needs guard-tests (a true data
    # dependency: the junits), so guard-meta's own checks no longer wait on the suite.
    name: Guards — every shard ran, and ran at least the floor
    needs: guard-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: guard-tests-junit-shard-*
          path: ${{ runner.temp }}/guard-tests-shards
      - name: The shards ran the whole suite exactly once (guard-test-shards --merge)
        run: node tooling/ci/guard-test-shards.mjs --merge --shards 4 --dir "${{ runner.temp }}/guard-tests-shards" --out "${{ runner.temp }}/guard-tests.junit.xml"
      # The per-suite EXECUTED counts are the only Linux measurement of what ran.
      # tooling/scripts/refresh-executed-floor.mjs reads this artifact from a green
      # main run to raise tooling/ci/test/executed-floor.json; nothing local writes it.
      - name: Keep the executed counts for the executed-floor refresh
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: guard-tests-junit
          path: ${{ runner.temp }}/guard-tests.junit.xml
          if-no-files-found: error
          retention-days: 30
      - name: The recorded floor must not exceed what actually ran
        run: node tooling/ci/assert-case-count-honest.mjs --junit "${{ runner.temp }}/guard-tests.junit.xml" --executed-floor tooling/ci/test/executed-floor.json

  ff-guard-tests-floor:
    # why: FF-2 — starts only once `guard-tests-floor` has concluded red, so it keeps its failure. docs/ci/README.md §2.1
    name: fail-fast · guard-tests-floor
    needs: guard-tests-floor
    if: failure() && needs.guard-tests-floor.result == 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: guard-tests-floor is red, so the rest of this run is cancelled (FF-2)
        env:
          GH_TOKEN: ${{ github.token }}
          RED_JOB: guard-tests-floor
        run: |
          echo "::notice title=FF-2 fail-fast::job '${RED_JOB}' is red and keeps its failure; '${GITHUB_JOB}' cancels the rest of run ${GITHUB_RUN_ID} (attempt ${GITHUB_RUN_ATTEMPT}), so every other job reads cancelled."
          gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" || true

  guard-meta:
    # why: the checks ABOUT the guards — coverage, the ratchet, the enforcement
    # index, the lane map, the PR's rows. The suite that proves each guard can fail
    # is guard-tests, sharded beside this job rather than in front of it.
    name: Guards — the guards can still fail
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      - name: Every guard is tested and self-checking
        run: node tooling/ci/assert-guard-coverage.mjs
      # 🔴 THE RATCHET IS STATE, AND UNTIL TODAY NOTHING IN CI READ IT BACK.
      # assert-guard-coverage.mjs WRITES tooling/ci/test/coverage-manifest.json on
      # every run — that is how the floor rises, and every rise is printed. In CI
      # that write went to a runner's disk and was thrown away with it, so a
      # branch could ship a manifest LOWER than its own tree and the floor would
      # be quietly lowered by the merge; the next branch would then ratchet up
      # from the lower number and nobody would ever see the step down. The guard
      # exits 0 either way, because rewriting the ratchet is its job, not a
      # finding. This step is the read-back: the file the guard just wrote must
      # be the file that was committed. It is deterministic — measured by running
      # the guard twice on a clean tree, no diff either time — so a red here means
      # the manifest was not regenerated, never that the run was unlucky.
      # tooling/enforcement-index.json is deliberately NOT included: it already
      # has its own comparison two steps down.
      - name: The ratchet the guard just wrote is the ratchet that was committed
        run: |
          set -euo pipefail
          if ! git diff --quiet -- tooling/ci/test/coverage-manifest.json; then
            echo "::error title=coverage-manifest.json was not regenerated::assert-guard-coverage.mjs rewrote the ratchet during this run, so the committed file is stale. Run \`node tooling/ci/assert-guard-coverage.mjs\` locally and commit the result. A manifest lower than the tree LOWERS the floor at merge, and nothing after that can see the step down."
            git --no-pager diff -- tooling/ci/test/coverage-manifest.json
            exit 1
          fi
          echo "ok  coverage-manifest.json is byte-identical to what this run derived"
      - name: Guard tree walks cannot leave the tree
        run: node tooling/ci/assert-walks-bounded.mjs
      - name: A local script reads a workflow through workflow-scan, or refuses when blind
        run: node tooling/ci/assert-workflow-readers.mjs
      - name: No new test case is declared inside a loop, and the loop baseline only shrinks
        run: node tooling/ci/assert-no-loop-cases.mjs
      - name: A new mechanism claim arrives with its test or a recorded demotion, and the claim backlog only shrinks
        run: node tooling/ci/assert-mechanism-claims.mjs
      - name: An extension README's ungraded-fixture table says what the fixture-coverage baseline says
        run: node tooling/ci/assert-ungraded-baseline-doc.mjs
      - name: The enforcement index is what the tree says
        run: node tooling/ci/assert-enforcement-index.mjs
      - name: Every line of the app template is accounted for
        run: node tooling/ci/assert-chassis-ledger.mjs
      - name: Guards refuse an empty subject
        run: node tooling/ci/assert-guards-refuse-empty.mjs
      - name: No dead tracked files
        run: node tooling/scripts/assert-no-dead-files.mjs
      - name: Every tracked path is placed in the lane map, and every lane glob matches a file
        run: node tooling/ci/lane-detect.mjs --check
      # why: a STEP-level `if:`, never a job-level one: ci-gate aggregates this job,
      # and a job skipped on push would read as not-green (assert-green-means-ran A6).
      # The body is untrusted input, so it arrives through env: and never inside run:.
      # BASE_SHA's history is read for the grandfather rule, which fetch-depth: 0 above provides.
      - name: A pull request names the rows it moves, or says why none
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_CREATED_AT: ${{ github.event.pull_request.created_at }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node tooling/ci/assert-pr-rows.mjs
      - name: The CI docs match the workflows (gen-ci-map --check)
        run: node tooling/ci/gen-ci-map.mjs --check
      - name: The release runbook's arming lines match the register (channel-arming --check)
        run: node tooling/ci/channel-arming.mjs --check

  ff-guard-meta:
    # why: FF-2 — starts only once `guard-meta` has concluded red, so it keeps its failure. docs/ci/README.md §2.1
    name: fail-fast · guard-meta
    needs: guard-meta
    if: failure() && needs.guard-meta.result == 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: guard-meta is red, so the rest of this run is cancelled (FF-2)
        env:
          GH_TOKEN: ${{ github.token }}
          RED_JOB: guard-meta
        run: |
          echo "::notice title=FF-2 fail-fast::job '${RED_JOB}' is red and keeps its failure; '${GITHUB_JOB}' cancels the rest of run ${GITHUB_RUN_ID} (attempt ${GITHUB_RUN_ATTEMPT}), so every other job reads cancelled."
          gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" || true

  guards-platform:
    name: Guards — platform, data and ops
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # why: security-events: read is for assert-alert-disposition.mjs limb C, which reads
    # the open and dismissed code-scanning alerts (GET .../code-scanning/alerts).
    permissions:
      contents: read
      issues: read
      security-events: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      # ⏱ 2026-09-26 · A GUARD THAT PRINTS ITS VERDICT AND NEVER EXITS MUST NOT EAT
      # THIS JOB. check-agent-docs.mjs printed `ok  no new finding.`, the line
      # before its process.exit(0), and then never ended: runs 36229452526 (PR #979)
      # and 36232580493 (main) were cancelled at this job's 15 minutes, and
      # 36233164494 was still stuck at 316 s when a newer push superseded it. Each
      # time the runner then killed an orphan `(MainThread)`: node, alive after its
      # own exit. In the other 59 completed runs the step took 0-1 s. That is
      # nodejs/node#54918, the class tooling/ci/single-threaded-relaunch.mjs records
      # (a background compile waiting on a GC that the exiting main thread will
      # never run), so the fix is the one that class already uses: `node
      # --single-threaded` on every step here whose script spawns git synchronously
      # and then exits, which is the shape that hung, plus
      # assert-platform-proof-fresh.mjs, which spawns git and exits through
      # `exitCode` (a natural exit deadlocks too; same file). Each flagged step also
      # carries a `timeout-minutes` of its own: 3 x its slowest green run over those
      # 62 runs, rounded up to a whole minute, never under 2, and never under the
      # guard's own read ceiling. A hang the flag does not prevent then fails ONE
      # step, by name, in minutes. The job's 15 is still the job's one bound.
      - name: No Worker schedules itself with a Durable Object alarm
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        run: node --single-threaded tooling/ci/assert-no-do-alarms.mjs
      - name: Schema evolution is additive-only
        run: node tooling/ci/check-migrations.mjs
      - name: D1 bindings are real and consistent across Workers
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-d1-bindings.mjs
      - name: A D1 location hint is latency, never residency
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-d1-location-hint.mjs
      - name: A Hyperdrive configuration is capped, and the caps fit the origin
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-hyperdrive-cap.mjs
      - name: The shared server declares every route and every binding
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-platform-register.mjs
      - name: The served app set is data, and onboarding needs no Worker edit
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-config-registry.mjs
      - name: A Worker's unhandled error reaches a sink, not just the log
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-worker-error-sink.mjs
      - name: No Worker test mixes a pinned clock with the wall clock
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-test-clock-mix.mjs
      - name: Every hard cap derives from a sourced free-tier ceiling
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-ceiling-budget.mjs
      - name: CORS allowlist is derived from the app catalogue
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-cors-allowlist.mjs
      # The allowlist above is about ORIGINS. This one is about METHODS, and it is
      # the same defect twice: services/platform answered preflights without PUT
      # while `PUT /v1/account/apple-token` was live, and
      # services/subscriptiontracker-api had already done it with `PUT /v1/budget`.
      # Both Workers' cors tests were green, because both asserted a hand-typed
      # method list. services/_shared/test/preflight.ts derives the list from the
      # routes; this is what makes importing it the only way to pass.
      - name: Every browser-serving Worker runs the shared preflight test
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-preflight-test-coverage.mjs
      # Since [ADR 075] every app shares one origin, so `Origin` can no longer tell
      # one app's caller from another's. This is the guard that keeps the CORS
      # middleware the ONLY place that reads it.
      - name: Origin decides CORS headers and nothing else
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-no-origin-authz.mjs
      # The app's public address is a path on the apex, and the route table, the
      # catalogue and the base href all say the same thing.
      - name: An app is published at a path on the apex, never on a subdomain
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-app-address-shape.mjs
      # One AASA and one assetlinks.json now serve every app on the shared apex, so a
      # hand-written entry for one app breaks deep linking for all of them. Today both
      # files are ABSENT and the guard asserts that absence as a measured pair.
      - name: The origin-wide association files are generated, or absent for a reason
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-well-known-shape.mjs
      - name: Every deployable unit is claimed by a lane
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-lane-coverage.mjs
      - name: Every deployed hostname is declared, and its monitor gap is visible
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-monitor-coverage.mjs
      # OFFLINE by design — no --live, no token. ci.yml's standing objection to a
      # CI limb depending on the GlitchTip box stands; what this asserts is that
      # the workflows agree with EACH OTHER and spell the project out, which is
      # the half that was false on 2026-09-09 and is knowable from the tree.
      - name: One GlitchTip project, spelled out, at every call site
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-glitchtip-project.mjs
      # OFFLINE by design — no --live, no token, for the same standing reason as
      # the step above. What the offline limbs assert is knowable from the tree:
      # the SDK's default-PII flag is off, no client or Worker source names an
      # IP-bearing field or reads a client-IP header, and the free-text IPv4/IPv6
      # rules are both declared AND applied. The live half — spoofed headers
      # through the public edge and the event read back — is a laptop/runbook
      # step (`--live`), never merge-blocking, because it depends on the
      # GlitchTip box. Owner ruling 2026-09-15, register O-CRASH-EVENT-IP-DROP.
      - name: No crash event carries an IP address, truncated or not
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-glitchtip-no-ip.mjs
      # Slowest green 49 s (median 37), so 3 minutes.
      # why: NO CLOUDFLARE TOKEN AT ALL (#1095 review, findings 1-2; limb 8d). A PR runs this
      # job, and even CLOUDFLARE_READ_TOKEN is account-scoped D1 READ, i.e. every production
      # user row (`productionData: read`). The Cloudflare rows therefore read `unreadable` here
      # by policy, inside `_maxUnreadable`, and are read on schedule by ops-watch.yml's
      # `assert-ops-register` step, which holds the token (READ || API: the API half's
      # repositoryFallback ends 2026-11-30, assert-channel-register 8c).
      - name: Every failure has a detector, a response and a cadence
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GLITCHTIP_TOKEN: ${{ secrets.GLITCHTIP_TOKEN }}
        run: node --single-threaded tooling/ci/assert-ops-register.mjs
      # ⏱ 2026-09-28 · ops watch 36416498456: `reminder_mail` was declared at a
      # cloud draft's sandbox commit, which owed a slot hours before the job
      # reached main. Offline (git only, no D1), and it needs this job's
      # fetch-depth: 0 — a shallow clone is COVERAGE LOST, exit 2. 2 s on the
      # first run (36418425091), so 2 minutes.
      - name: Every watched-since instant owes no slot before its job reached main
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        run: node --single-threaded tooling/ops/check-heartbeats.mjs --declared-vs-main
      # Limb C (2026-09-30) makes CodeQL a declared source: every open code-scanning
      # alert is fixed in code or has an entry in tooling/ci/codeql-dispositions.json.
      # It spawns git synchronously (a fixed-in-tree claim is read at the analysed
      # commit) and then exits, the shape that hung, so --single-threaded and a bound
      # of its own: 3 reads on the shared bounded plan, well under 3 minutes.
      - name: Every alerting firing has a recorded disposition
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node --single-threaded tooling/ci/assert-alert-disposition.mjs
      # 2026-10-01: spawns `git ls-files` synchronously and exits, the shape that
      # hung, so --single-threaded and a bound of its own (a static read, ~1 s).
      - name: A credential goes only to its pinned issuer
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        run: node --single-threaded tooling/ci/assert-credential-origin.mjs
      - name: No workflow or register names a repository that no longer exists
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-no-dead-repo-names.mjs
      - name: No tracked text cites a line of a generated file, or asks for a hand edit to one
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        run: node --single-threaded tooling/ci/assert-no-generated-line-cites.mjs
      - name: Every pinned input is reached by a live update manager
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-update-coverage.mjs
      - name: Every store the portfolio holds has a declared retention rule, and every owned D1 is backed up, fanned out to and bound
        if: ${{ !cancelled() }}
        run: rc=0; node tooling/ci/assert-retention-coverage.mjs || rc=1; node tooling/ci/assert-d1-fanout.mjs || rc=1; node tooling/scripts/render-platform-app-block.mjs --check || rc=1; exit $rc
      - name: The events rollup stays lossless and the sweep stays fail-closed
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-rollup-lossless.mjs
      - name: Path-filtered deploys list every build input
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-deploy-triggers.mjs
      - name: Dependency resolution is reproducible
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        run: node --single-threaded tooling/ci/assert-lockfile-discipline.mjs
      - name: Workflows are SHA-pinned and least-privilege
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        run: node --single-threaded tooling/ci/assert-workflow-hardening.mjs
      - name: Every job is bounded once, at a number somebody chose
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-workflow-timeouts.mjs
      - name: A red gate job cancels its run, and no deploy job ever does (FF-1)
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-failfast-coverage.mjs
      - name: A green tick means the work ran
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-green-means-ran.mjs
      - name: Every deploy trigger can reach a deploy job
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-deploy-triggers-deploy.mjs
      # Slowest green 17 s, but its run-history read (a page, then a cross-read)
      # may spend READ_WALL_CEILING_MS on each (55 s, tooling/ops/bounded-retry.mjs)
      # before it answers COVERAGE LOST itself, so 3 minutes, not 2.
      - name: The 6-platform proof is fresh
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node --single-threaded tooling/ci/assert-platform-proof-fresh.mjs
      # why: NO CLOUDFLARE TOKEN (#1095 review, finding 2; limb 8d): a PR runs this job, and a D1
      # read token reads every production row. The OUTCOME record is graded here; the D1 TIMER
      # row is read on schedule by ops-watch.yml's heartbeats job. The flag is a standing policy,
      # printed on every run, not a dated deferral.
      - name: The nightly golden-path proof is fresh
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tooling/ci/assert-e2e-proof-fresh.mjs --timer-read-by-ops-watch
      - name: The nightly exercised the legs it claims
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-e2e-legs.mjs
      - name: Every statement sent to D1 is one D1 will run
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-d1-sql-inventory.mjs
      - name: Every shared table declares how its rows are attributed
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-prod-provenance.mjs
      - name: Every live drive stamps a resolvable APP_VERSION and hands its purge the consent settings
        if: ${{ !cancelled() }}
        run: node --single-threaded tooling/ci/assert-live-writer-provenance.mjs
      - name: No provider reads a provider that already watches it
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-provider-graph-acyclic.mjs
      - name: Selection records resolve (N-9)
        run: node tooling/scripts/check-selection-record.mjs
      # ⏱ WIRED 2026-09-08, the day after it landed. check-agent-docs.mjs arrived
      # in 9b4cd308 with no workflow, no hook, no enforcement-index row and no
      # test, and all five of its limbs are warnings until promoteOn 2026-09-22 —
      # so without this step that date would have arrived on a guard that had
      # never executed in CI, and the first thing it ever did in a build would be
      # to fail one. It exits 0 on a warn-limb finding by design and 2 on
      # COVERAGE LOST, so a step that goes red here is a real finding or a real
      # refusal, never a warning. It reads the git INDEX, which is why this job's
      # checkout uses fetch-depth: 0.
      # ⏱ 2026-09-26 · This is the step that hung after its verdict (see the block at
      # the top of this job): --single-threaded, and bounded at 2 minutes.
      - name: The instruction docs stay inside their caps
        timeout-minutes: 2
        run: node --single-threaded tooling/scripts/check-agent-docs.mjs
      # START-HERE.md is GENERATED and has TWO guards, because they catch
      # different things. This one fails on a HAND EDIT: the card is the first
      # thing a cold session reads, and a card somebody typed into can say
      # anything. check-agent-docs limb A-SIZE is the other, and it fails on a
      # card that grew legitimately, through the generator, past 4 KiB.
      - name: START-HERE.md is what the tree generates
        timeout-minutes: 2
        run: node --single-threaded tooling/scripts/gen-start-here.mjs --check

