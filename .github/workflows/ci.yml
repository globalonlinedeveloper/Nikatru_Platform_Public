  guards-chassis:
    name: Guards — chassis, app surface and packages
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      - name: No desktop app shows users a package id where its company name belongs
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-desktop-runner-identity.mjs
      - name: A stamped app CALLS every capability it declares
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-stamp-wiring.mjs
      - name: No capability exists twice, in an app or the template
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-no-seam-forks.mjs
      - name: Every shared package the template delegates to is adopted by every app
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-chassis-parity.mjs --require-history
      - name: Shared code carries no app-specific vocabulary
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-no-clone-tells.mjs
      - name: Core stays pure, the design system stays domain-free, apps use the seams
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-package-boundaries.mjs
      - name: Every package is earned, or dated
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-package-earned.mjs
      - name: Every vendor satisfies the portability checklist
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-vendor-portability.mjs
      - name: Every port earns the level it claims, and every vendor is placed
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-ports.mjs
      - name: Every secret a Worker reads is a row of tooling/worker-secrets.json
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-worker-secrets-declared.mjs
      - name: One convention set reaches every app, and can fail a build
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-lint-inheritance.mjs
      - name: No app has hollowed out the gates it inherited
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-no-gate-weakening.mjs
      - name: No hardcoded user-facing strings in the brick
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-no-hardcoded-strings.mjs
      - name: The stop-a-charge copy never claims we cancel or names a debit time
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-stop-copy.mjs
      - name: Every adapter declares where it works
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-adapter-capabilities.mjs
      - name: The inherited screen set is declared, present and reachable
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-screen-set.mjs
      # why its own step when assert-screen-set above already imports it: that
      # import only asks "has it shipped?" to judge a blocker, and a `present`
      # row never asks again. This step holds the callback itself — every native
      # target registers com.nikatru.<id>://auth-callback, the allow list admits
      # every flow, every link-sending call passes its redirect — on every push.
      - name: Every native target registers the app's auth callback, and every link-sending call passes its redirect
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-auth-callbacks.mjs
      - name: Every reachable surface has a width measurement, and every measurement a surface
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-responsive-coverage.mjs
      - name: Every reachable surface has an accessibility sweep, and every sweep a surface
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-a11y-coverage.mjs
      # why beside the sweep accounting above: that guard counts which SURFACES
      # carry a sweep; this one holds three rules over every PRIMITIVE in every
      # tree — a tap target takes the keyboard, a password field autofills, and
      # every stamped web app turns its screen-reader tree on. A sweep walks the
      # router and never reaches a modal sheet; a static read reaches every file.
      - name: Every tap target takes the keyboard, every password field autofills, every web app has a screen-reader tree
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-a11y-primitives.mjs
      - name: A first-run gate is found by its CONTROL, never by its widget type
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-modal-detection.mjs
      - name: Every rollout read is an observed rollout
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-flag-exposure.mjs
      - name: Every app carries a done-record, and its DoD items really run
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-app-dod.mjs
      # why HERE and not in guard-meta: this is the STATIC half of the Dart
      # mutation harness — it resolves every done-record row to a real test
      # declaration and compares each proof against a content hash of the code it
      # probed. It costs milliseconds, needs no Flutter, and unlike
      # assert-app-dod.mjs above it does NOT hold apps/subscriptiontracker exempt,
      # so it is the only thing in CI that grades that app's fourteen rows.
      # The EXECUTED half (--execute, which applies each mutation and requires the
      # named test to go red) is deliberately not wired into any push job: it was
      # measured at 90–140 minutes for a full sweep against a 25-minute cap. The
      # guard's own header carries the measurement and the argument.
      - name: Every mutation proof still addresses the code it was run against
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-mutation-proofs.mjs

  ff-guards-chassis:
    # why: FF-2 — starts only once `guards-chassis` has concluded red, so it keeps its failure. docs/ci/README.md §2.1
    name: fail-fast · guards-chassis
    needs: guards-chassis
    if: failure() && needs.guards-chassis.result == 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: guards-chassis is red, so the rest of this run is cancelled (FF-2)
        env:
          GH_TOKEN: ${{ github.token }}
          RED_JOB: guards-chassis
        run: |
          echo "::notice title=FF-2 fail-fast::job '${RED_JOB}' is red and keeps its failure; '${GITHUB_JOB}' cancels the rest of run ${GITHUB_RUN_ID} (attempt ${GITHUB_RUN_ATTEMPT}), so every other job reads cancelled."
          gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" || true

  security-scan:
    # why: split out so a leaked credential is not reported as "the platform
    # Worker lane failed". Both tools are pinned binaries with a checksum, never
    # the vendor action — gitleaks-action v2+ is a commercial licence for org
    # accounts (09-selfhost-build-release.md §4.2).
    name: Security — secret and workflow scanners
    runs-on: ubuntu-24.04
    timeout-minutes: 25 # why: the scanners (~1 min) plus the CodeQL PR rule's 12-minute step bound, with headroom
    # why: security-events: read is for assert-codeql-pr-no-new-high.mjs, which reads this
    # PR's CodeQL analysis and its alerts (GET .../code-scanning/analyses and /alerts).
    permissions:
      contents: read
      security-events: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      # 🔴 SET HERE, NOT IN A JOB-LEVEL `env:`. The `runner` context does not
      # exist while job-level `env:` is evaluated — only github, needs, strategy,
      # matrix, vars, inputs and secrets do — so `PINNED_TOOL_CACHE: ${{
      # runner.temp }}/…` made GitHub reject this whole file. An invalid workflow
      # file does not fail a job: it produces a run with NO jobs at all, so
      # `ci-gate` never reported and the PR sat BLOCKED with nothing to re-run.
      # `RUNNER_TEMP` is a plain environment variable inside a step, which is
      # why the same value is written to $GITHUB_ENV instead.
      - name: Point the pinned-tool installer at the cache directory
        run: echo "PINNED_TOOL_CACHE=${RUNNER_TEMP}/pinned-tool-cache" >> "$GITHUB_ENV"
      # 🔴 A CHECKSUM-VERIFIED CACHE, NOT A TRUSTED ONE. An Actions cache entry is
      # writable from any branch, so a restored entry is untrusted input:
      # install-pinned-tool.mjs compares its sha256 against the digest in
      # tooling/versions.json before using it, and downloads anyway when it does
      # not match. What the cache buys is that the four scanners cost no network
      # at all on a re-run — which is exactly the situation the 2026-09-12 red
      # left main in (wget exit 4, gitleaks never installed, ci-gate not green,
      # deploy-web refused). The key carries the digest of versions.json, so
      # advancing any pin is a different cache.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pinned-tool-cache
          key: pinned-tools-${{ runner.os }}-${{ hashFiles('tooling/versions.json') }}
      # 🔴 THE VERSION AND THE DIGEST ARE READ FROM tooling/versions.json, NOT
      # WRITTEN HERE. Until 2026-09-06 all four scanners below carried their pin
      # as an `env:` literal in this job and nowhere else, which put them outside
      # BOTH mechanisms this repository has for a pinned input: F-2's single
      # declaration, and [pipeline 14]O-9's update coverage. A pin inside a
      # workflow is invisible to tooling/ci/assert-update-coverage.mjs, so these
      # four were advanced by nobody and no guard could say so — the exact state
      # `wrangler` was in until 2026-08-02, with one thing that makes it worse: a
      # stale test framework goes red, and a stale SCANNER goes quiet.
      # The `node -p` idiom is deploy-web.yml's, already used for glitchtip_cli
      # and wrangler, so nothing in THIS FILE is a literal any more.
      #
      # 🔴 CORRECTED 2026-09-06, SAME DAY. This comment previously went on to say
      # "Nothing here is a literal, so assert-version-consistency.mjs correctly
      # carries no rule for these keys — a drift rule whose scan has no target is
      # an assertion that cannot fail." The first half is true of this file and
      # the conclusion was false of the tree: `git grep -n VALIDATED_AGAINST`
      # finds tooling/ci/scan-secrets.mjs declaring `const VALIDATED_AGAINST =
      # '8.30.1'`, a second live copy of the `gitleaks` value in executable code.
      # It was dormant while nothing advanced either copy; giving `gitleaks` a
      # Renovate customManager is what made it drift-able by machine. There is
      # now a `gitleaks (scan-secrets VALIDATED_AGAINST)` rule in
      # assert-version-consistency.mjs, with scan-secrets.mjs as a REQUIRED
      # target. The other three keys have no second literal — measured, see
      # $scanners_comment in tooling/versions.json for the command.
      # 🔴 BOUNDED RETRY, THEN THE VERIFIED CACHE — the four steps below were
      # `wget -q -O`, which retries NOTHING. On 2026-09-12 the gitleaks line
      # failed with exit 4 (network) on a push to main; the scanner never ran, so
      # ci-gate recorded main as not green and deploy-web REFUSED. A single re-run
      # fixed it. Every other pinned download in this repository already used
      # `curl … --retry 3 --retry-all-errors`; these four scanners, the ones that
      # gate a deploy, were the exception. The URL, the archive kind and the
      # member are now DATA in tooling/ci/install-pinned-tool.mjs, and the
      # behaviour has tests (a failed attempt then a good one, a bound that
      # binds, a cache entry whose bytes are wrong) that no `run:` block can have.
      - name: Install gitleaks (version and digest from tooling/versions.json)
        run: |
          set -euo pipefail
          node tooling/ci/install-pinned-tool.mjs gitleaks --out "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/gitleaks" version
      # 🔴 THE RANGE IS THE CHANGE'S COMMITS, NOT ONLY ITS TREE. Until 2026-09-29
      # this step scanned the working tree alone (`--no-git`), so a key added in
      # one commit of a PR and removed in the next passed CI and stayed in the
      # pushed history. [rv2 A-1] A PR scans merge-base(base, head)..head; a push
      # to main scans before..after, and a before that is not an ancestor of after
      # (a force-push) is COVERAGE LOST, exit 2 — never a pass. The values reach
      # the shell through `env:`, never `${{ }}` inside `run:` (zizmor's
      # template-injection rule). fetch-depth: 0 above is what puts both ends in
      # the clone.
      - name: Secret scan (self-tests, then the tree, then the change's commits)
        env:
          SCAN_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          SCAN_HEAD: ${{ github.event.pull_request.head.sha || github.event.after }}
          SCAN_KIND: ${{ github.event_name == 'pull_request' && 'pr' || 'push' }}
        run: >-
          node tooling/ci/scan-secrets.mjs . --gitleaks "${RUNNER_TEMP}/gitleaks"
          --range "${SCAN_BASE}..${SCAN_HEAD}" --range-kind "${SCAN_KIND}"
      # ⚠️ THE ASSET NAME CARRIES NO VERSION — `zizmor-x86_64-unknown-linux-gnu.tar.gz`
      # is the same string at every release, and only the `/v${ver}/` path segment
      # differs. So on this lane the digest is not a second opinion about the
      # bytes, it is the only thing that distinguishes one release's bytes from
      # another's.
      - name: Install zizmor (version and digest from tooling/versions.json)
        run: |
          set -euo pipefail
          node tooling/ci/install-pinned-tool.mjs zizmor --out "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/zizmor" --version
      - name: Workflow static analysis (self-tests, then scans)
        run: node tooling/ci/scan-workflows.mjs . --zizmor "${RUNNER_TEMP}/zizmor"

      # ⚠️ A BARE BINARY, NOT A TARBALL — downloaded and `chmod +x`'d directly, so
      # the digest is the ONLY integrity check standing between the download and
      # an executable that then walks the whole workspace.
      - name: Install OSV-Scanner (version and digest from tooling/versions.json)
        run: |
          set -euo pipefail
          node tooling/ci/install-pinned-tool.mjs osv-scanner --out "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/osv-scanner" --version
      - name: Known-vulnerable dependencies, INCLUDING the Dart ones (canary, floor, then the tree)
        # why: the only scanner in this stack that reads pubspec.lock. Play
        # Console flags vulnerable SDK versions and can block updates, so this is
        # one of the two scanners here with a store consequence. Findings that
        # are acknowledged rather than fixed are DATED in osv-scanner.toml at the
        # repo root, which the script passes with an explicit --config.
        # why: [rv2-security-018] the script proves OSV still flags a canary
        # lockfile per tracked format and reads every `git ls-files` lockfile
        # (exit 2 otherwise) before a clean result is believed; ops-watch.yml's
        # dependency-advisories job runs the same script over main daily.
        run: node tooling/ci/scan-dependencies.mjs --osv "${RUNNER_TEMP}/osv-scanner"
      - name: Install Trivy (version and digest from tooling/versions.json)
        run: |
          set -euo pipefail
          node tooling/ci/install-pinned-tool.mjs trivy --out "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/trivy" --version
      - name: Vulnerabilities in the filesystem (a second opinion on production dependencies)
        # why: HIGH and CRITICAL only, and only what has a fix. A gate that goes
        # red on something nobody can act on gets switched off, and a switched-off
        # gate is worse than no gate at all.
        # why: vuln only — the misconfig scanner logged `Detected config files
        # num=0` (run 36553219885), a limb with no subject [rv2-security-018].
        # Trivy suppresses dev dependencies (4 of 12 lockfiles reported), so the
        # canary and the lockfile floor live on OSV in the step above.
        env:
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/trivy" fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress .
      # The named, reviewed rule codeql.yml's header asks for: CodeQL stays an alert
      # sink, and THIS step fails the gate when the PR's own analysis adds ANY alert
      # that is high or critical, or that the PR's own tooling/ci/codeql-dispositions.json
      # does not answer (every severity since 2026-09-30). It sees only alerts on the
      # PR's changed lines (the analysis is diff-informed); the rest is caught on main
      # by the limb C step at the end of codeql.yml's `analyze` job. LAST, so the scanners above have run while
      # CodeQL (136-212 s over 8 PR runs, 2026-09-30) finishes; it polls for up to 10
      # minutes, and an analysis that never appears is COVERAGE LOST (exit 2), never a pass.
      - name: This pull request adds no CodeQL alert its own dispositions do not answer
        if: ${{ !cancelled() }}
        timeout-minutes: 12
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tooling/ci/assert-codeql-pr-no-new-high.mjs

  ff-security-scan:
    # why: FF-2 — starts only once `security-scan` has concluded red, so it keeps its failure. docs/ci/README.md §2.1
    name: fail-fast · security-scan
    needs: security-scan
    if: failure() && needs.security-scan.result == 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: security-scan is red, so the rest of this run is cancelled (FF-2)
        env:
          GH_TOKEN: ${{ github.token }}
          RED_JOB: security-scan
        run: |
          echo "::notice title=FF-2 fail-fast::job '${RED_JOB}' is red and keeps its failure; '${GITHUB_JOB}' cancels the rest of run ${GITHUB_RUN_ID} (attempt ${GITHUB_RUN_ATTEMPT}), so every other job reads cancelled."
          gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" || true

  site-tokens:
    # why: the job id stays `site-tokens` even though the lane now covers three
    # runtimes rather than the sites alone. ci-gate's `needs:` list names it, and
    # tooling/ci/assert-green-means-ran.mjs asserts that list by name — renaming
    # a job id here is a two-file change with a required-check consequence, and
    # the name below is where the widened scope is said out loud instead.
    name: Design tokens (build + drift, all three outputs)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/tokens
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - run: npm ci
      # why: ALL THREE outputs are deleted, not just the CSS. The delete is what
      # makes this a re-derivation rather than a comparison — an output left in
      # place is checked only for "the build did not change it", which a build
      # that never wrote the file also satisfies. Source is
      # contracts/tokens/dtcg/ ([ADR 067] decision 1); the three outputs are the
      # CSS the sites reference, Dart constants for the Flutter apps, and a JSON
      # table the build-free extension subtree can read.
      - name: Delete all three artifacts so the build has to produce them
        run: |
          rm -f ../../sites/_shared/assets/tokens.css
          rm -f ../design_system/lib/src/tokens/brand_tokens.dart
          rm -f ../../extensions/core/tokens.json
      - run: npm run build
      - name: The build actually wrote all three artifacts
        run: |
          test -s ../../sites/_shared/assets/tokens.css
          test -s ../design_system/lib/src/tokens/brand_tokens.dart
          test -s ../../extensions/core/tokens.json
      # why: ONE PATH PER LINE — and no backslash continuations either.
      # assert-green-means-ran.mjs pairs every path a drift step diffs with an
      # "rm -f" of that same path earlier in the same job, and its matcher
      # captures ONE path per match. Three paths on a single line therefore
      # pair only the FIRST with a deletion; the other two are diffed and never
      # required to have been deleted at all. Measured 2026-09-05 on this file,
      # one mutation at a time: with all three on one line, removing the
      # "rm -f" of brand_tokens.dart or of extensions/core/tokens.json left the
      # guard at exit 0, while removing the tokens.css one gave exit 1 — two of
      # the three outputs could silently lose their delete-before-diff. Split
      # one-per-line, removing any of the three gives exit 1 naming that file.
      # A backslash continuation is the OTHER wrong answer: the matcher then
      # reads the continuation character itself as the path, which is how the
      # first draft failed with 'job "site-tokens" diffs [backslash] against
      # HEAD, but no earlier step deletes it first'.
      # ⚠️ And the drift-lane phrase is deliberately NOT quoted anywhere in this
      # comment: green-means-ran.test.mjs counts its occurrences across every
      # workflow file to derive how many drift checks the guard must report, and
      # it counts comment text too — a comment quoting the phrase inflates that
      # count by one and reddens a test about something else entirely.
      - name: All three outputs must equal a fresh build
        run: |
          git diff --exit-code -- ../../sites/_shared/assets/tokens.css
          git diff --exit-code -- ../design_system/lib/src/tokens/brand_tokens.dart
          git diff --exit-code -- ../../extensions/core/tokens.json

  ff-site-tokens:
    # why: FF-2 — starts only once `site-tokens` has concluded red, so it keeps its failure. docs/ci/README.md §2.1
    name: fail-fast · site-tokens
    needs: site-tokens
    if: failure() && needs.site-tokens.result == 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: site-tokens is red, so the rest of this run is cancelled (FF-2)
        env:
          GH_TOKEN: ${{ github.token }}
          RED_JOB: site-tokens
        run: |
          echo "::notice title=FF-2 fail-fast::job '${RED_JOB}' is red and keeps its failure; '${GITHUB_JOB}' cancels the rest of run ${GITHUB_RUN_ID} (attempt ${GITHUB_RUN_ATTEMPT}), so every other job reads cancelled."
          gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" || true

  site-shared:
    name: Shared site build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: sites/_shared
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - run: npm ci
      - run: npm run build && test -s _site/index.html  # eleventy exits 0 on "Wrote 0 files"

  ff-site-shared:
    # why: FF-2 — starts only once `site-shared` has concluded red, so it keeps its failure. docs/ci/README.md §2.1
    name: fail-fast · site-shared
    needs: site-shared
    if: failure() && needs.site-shared.result == 'failure'
