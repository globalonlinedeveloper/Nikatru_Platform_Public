name: CI

run-name: "CI on ${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.number) || github.ref_name }} by @${{ github.actor }}"

# The lane map, the shard boundaries and every rule this file has to obey are in
# docs/ci/README.md. Only `# why:` lines live here.

on:
  # why: main only. A branch-prefix list cannot cover branches nobody has named
  # yet, and `pull_request:` (unfiltered) already covers every branch that opens
  # a PR — so a commit on a PR branch used to run CI twice.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # why: FALSE ON MAIN ONLY. Every push to main resolves to one group, so `true`
  # lets a later push kill the run the deploy gate is waiting on, and a cancelled
  # run notifies nobody. PR events resolve to refs/pull/N/merge and do cancel.
  # tooling/ops/safe-rerun.mjs reads this key by name.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  worker-subly-api:
    name: subly-api Worker (typecheck + test + dry-run)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/subly-api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npx wrangler deploy --dry-run

  worker-platform:
    # why: this job was 1,818 of ci.yml's 2,696 lines and ran 105 guards behind a
    # name that described four steps. It is now only those four steps; the guards
    # are the guard-* shards below.
    name: platform Worker (typecheck + test + dry-run)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/platform
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npx wrangler deploy --dry-run

  guard-meta:
    # why: the guards' own mutation suite measured 199s of the old job's 263s —
    # three times longer than running the 108 guards it tests. On its own job it
    # no longer sits in front of them. It is NOT change-filtered: several suites
    # here read the real tree (safe-rerun against .github/workflows, ops-register
    # against tooling/ops), so "only prose changed" does not imply "this cannot
    # go red", and a filter that is wrong about that is a green tick over nothing.
    name: Guards — the guards can still fail
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      issues: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      - name: The guards must be able to fail
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GLITCHTIP_TOKEN: ${{ secrets.GLITCHTIP_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node --test --test-reporter=spec  --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination="${{ runner.temp }}/guard-tests.junit.xml" "tooling/ci/test/*.test.mjs"
      - name: Every guard is tested and self-checking
        run: node tooling/ci/assert-guard-coverage.mjs
      - name: The recorded floor must not exceed what actually ran
        run: node tooling/ci/assert-case-count-honest.mjs --junit "${{ runner.temp }}/guard-tests.junit.xml"
      - name: Guard tree walks cannot leave the tree
        run: node tooling/ci/assert-walks-bounded.mjs
      - name: The enforcement index is what the tree says
        run: node tooling/ci/assert-enforcement-index.mjs
      - name: Every line of the app template is accounted for
        run: node tooling/ci/assert-chassis-ledger.mjs
      - name: Guards refuse an empty subject
        run: node tooling/ci/assert-guards-refuse-empty.mjs
      - name: No dead tracked files
        run: node tooling/scripts/assert-no-dead-files.mjs

  guards-platform:
    name: Guards — platform, data and ops
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      issues: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      - name: No Worker schedules itself with a Durable Object alarm
        run: node tooling/ci/assert-no-do-alarms.mjs
      - name: Schema evolution is additive-only
        run: node tooling/ci/check-migrations.mjs
      - name: D1 bindings are real and consistent across Workers
        run: node tooling/ci/assert-d1-bindings.mjs
      - name: The shared server declares every route and every binding
        run: node tooling/ci/assert-platform-register.mjs
      - name: The served app set is data, and onboarding needs no Worker edit
        run: node tooling/ci/assert-config-registry.mjs
      - name: A Worker's unhandled error reaches a sink, not just the log
        run: node tooling/ci/assert-worker-error-sink.mjs
      - name: Every hard cap derives from a sourced free-tier ceiling
        run: node tooling/ci/assert-ceiling-budget.mjs
      - name: CORS allowlist is derived from the app catalogue
        run: node tooling/ci/assert-cors-allowlist.mjs
      - name: Every deployable unit is claimed by a lane
        run: node tooling/ci/assert-lane-coverage.mjs
      - name: Every deployed hostname is declared, and its monitor gap is visible
        run: node tooling/ci/assert-monitor-coverage.mjs
      - name: Every failure has a detector, a response and a cadence
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GLITCHTIP_TOKEN: ${{ secrets.GLITCHTIP_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tooling/ci/assert-ops-register.mjs
      - name: Every alerting firing has a recorded disposition
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tooling/ci/assert-alert-disposition.mjs
      - name: Every pinned input is reached by a live update manager
        run: node tooling/ci/assert-update-coverage.mjs
      - name: Every store the portfolio holds has a declared retention rule
        run: node tooling/ci/assert-retention-coverage.mjs
      - name: The events rollup stays lossless and the sweep stays fail-closed
        run: node tooling/ci/assert-rollup-lossless.mjs
      - name: Path-filtered deploys list every build input
        run: node tooling/ci/assert-deploy-triggers.mjs
      - name: Dependency resolution is reproducible
        run: node tooling/ci/assert-lockfile-discipline.mjs
      - name: Workflows are SHA-pinned and least-privilege
        run: node tooling/ci/assert-workflow-hardening.mjs
      - name: A green tick means the work ran
        run: node tooling/ci/assert-green-means-ran.mjs
      - name: Every deploy trigger can reach a deploy job
        run: node tooling/ci/assert-deploy-triggers-deploy.mjs
      - name: The 6-platform proof is fresh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tooling/ci/assert-platform-proof-fresh.mjs
      - name: The nightly golden-path proof is fresh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tooling/ci/assert-e2e-proof-fresh.mjs
      - name: The nightly exercised the legs it claims
        run: node tooling/ci/assert-e2e-legs.mjs
      - name: Every statement sent to D1 is one D1 will run
        run: node tooling/ci/assert-d1-sql-inventory.mjs
      - name: Every shared table declares how its rows are attributed
        run: node tooling/ci/assert-prod-provenance.mjs
      - name: No provider reads a provider that already watches it
        run: node tooling/ci/assert-provider-graph-acyclic.mjs
      - name: Selection records resolve (N-9)
        run: node tooling/scripts/check-selection-record.mjs

  guards-legal:
    name: Guards — privacy, legal and money
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      - name: An Apple privacy manifest that exists is one the build copies
        run: node tooling/ci/assert-privacy-manifest.mjs
      - name: The repository states its own legal posture
        run: node tooling/ci/assert-repo-posture.mjs
      - name: Every policy version a user consented to is still retrievable
        run: node tooling/ci/assert-policy-archive.mjs
      - name: Every published legal claim is paired, and the payment path is named
        run: node tooling/ci/assert-policy-claims.mjs
      - name: Every live sink declares what it holds, and no page denies it
        run: node tooling/ci/assert-sink-disclosure.mjs
      - name: Every store that holds data is inventoried and disclosed
        run: node tooling/ci/assert-data-inventory.mjs
      - name: The per-market duty matrix cannot silently rot
        run: node tooling/ci/assert-legal-tripwires.mjs
      - name: Every shipped asset has rights evidence, and every app shows it
        run: node tooling/ci/assert-licence-register.mjs
      - name: One analytics envelope, and the consent trail stays append-only
        run: node tooling/ci/assert-analytics-contract.mjs
      - name: The entitlement contract is complete before the first payment
        run: node tooling/ci/assert-entitlement-contract.mjs
      - name: One verifier stands between a provider and the entitlement table
        run: node tooling/ci/assert-mor-adapters.mjs
      - name: Sandbox money cannot grant a production unlock
        run: node tooling/ci/assert-money-config.mjs
      - name: Every app with accounts ships a deletion control
        run: node tooling/ci/assert-deletion-control.mjs
      - name: Account deletion reaches every user-owned table, never via a shared secret
        run: node tooling/ci/assert-erasure-reach.mjs
      - name: Fail-closed seams have a real on-switch
        run: node tooling/ci/assert-seams-wired.mjs
      - name: Analytics consent can be WITHDRAWN, not only given
        run: node tooling/ci/assert-consent-withdrawal-surface.mjs
      - name: Every captcha-gated auth call carries a token
        run: node tooling/ci/assert-captcha-gated-call-sites.mjs
      - name: No sign-up consent box is born ticked, and the terms tick blocks
        run: node tooling/ci/assert-signup-consent-shape.mjs
      - name: Every shared capability has one home and a real consumer
        run: node tooling/ci/assert-capability-register.mjs
      - name: The Supabase auth email templates stay restorable
        run: node tooling/ci/assert-supabase-templates.mjs
      - name: One record of how mail is sent, and no document contradicts it
        run: node tooling/ci/assert-mail-transport-claims.mjs
      - name: The purchase path is whole, bounded, declared and cancellable
        run: node tooling/ci/assert-purchase-path.mjs
      - name: No price is typed into app code
        run: node tooling/ci/assert-no-price-literals.mjs
      - name: The money funnel is wired, and the pseudonymity firewall holds
        run: node tooling/ci/assert-pseudonymity-firewall.mjs
      - name: A legal document published twice says the same thing in both places
        run: node tooling/ci/assert-legal-text-parity.mjs

  guards-store:
    name: Guards — store, release and versioning
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      - name: Build versions all match versions.json
        run: node tooling/ci/assert-version-consistency.mjs
      - name: The app version is derived and monotonic
        run: node tooling/ci/assert-app-versioning.mjs
      - name: Every claimed channel is a served channel
        run: node tooling/ci/assert-channel-register.mjs
      - name: No public surface advertises an unserved or dead channel
        run: node tooling/ci/assert-channel-claims.mjs
      - name: Every declared store channel has a complete, spec-derived listing
        run: node tooling/ci/assert-store-metadata.mjs
      - name: Every Linux store channel can produce a complete snapcraft recipe
        run: node tooling/ci/assert-snapcraft-generable.mjs
      - name: The Play listing graphics exist, are the sourced size, and say where they came from
        run: node tooling/ci/assert-listing-assets.mjs
      - name: The Play screenshot set spans enough device types
        run: node tooling/ci/assert-play-device-coverage.mjs
      - name: The Data safety and content-rating declarations still describe the code
        run: node tooling/ci/assert-play-declarations.mjs
      - name: The sworn store declarations have not regressed toward the stamp
        run: node tooling/ci/assert-sworn-store-files.mjs
      - name: The advertising declarations still describe the shipped tree
        run: node tooling/ci/assert-ads-declarations.mjs
      - name: The Microsoft Store submission path still walks (dry run)
        run: node tooling/release/submit-windows-store.mjs --dry-run --app subly --allow-missing-artifact
      - name: The App Store submission path still walks — iOS (dry run)
        run: node tooling/release/submit-appstore.mjs --dry-run --channel ios-appstore --app subly --allow-missing-artifact
      - name: The App Store submission path still walks — macOS (dry run)
        run: node tooling/release/submit-appstore.mjs --dry-run --channel macos-appstore --app subly --allow-missing-artifact
      - name: The Snap Store submission path still walks (dry run)
        run: node tooling/release/submit-snap.mjs --dry-run --app subly --allow-missing-artifact
      - name: The Google Play submission path still walks (dry run)
        run: node tooling/release/submit-play.mjs --dry-run --app subly --allow-missing-artifact
      - name: No release build from an ungated commit, no publish unrecorded
        run: node tooling/ci/assert-release-provenance.mjs
      - name: No release lane finishes with the artifact stuck inside the run
        run: node tooling/ci/assert-release-durable.mjs
      - name: Nothing is compiled into an artifact that was not declared shippable
        run: node tooling/ci/assert-no-secret-defines.mjs
      - name: Obfuscation and symbol retention are one increment or neither
        run: node tooling/ci/assert-obfuscation-coupled.mjs
      - name: No shipped client overrides TLS certificate trust
        run: node tooling/ci/assert-no-tls-pinning.mjs
      - name: The web channel declares a cache policy a deploy can be seen through
        run: node tooling/ci/assert-web-cache-policy.mjs . sites/nikatru sites/rajasekarselvam
      - name: Release lanes cover every app, and no guard hides a lane
        run: node tooling/ci/assert-release-lane-generic.mjs
      - name: Nothing is published without being launched once
        run: node tooling/ci/assert-launch-smoke.mjs
      - name: One app_id derives every store identity, on every platform
        run: node tooling/ci/assert-store-identity.mjs
      - name: No submission endangers the store identity
        run: node tooling/ci/assert-submission-safety.mjs
      - name: No publishing lane finishes without a [10]D-9 record
        run: node tooling/ci/assert-publish-records.mjs
      - name: The Android module pins the API level Google Play requires
        run: node tooling/ci/assert-android-target-sdk.mjs
      - name: No store artifact is the demo build
        run: node tooling/ci/assert-store-build-config.mjs

  guards-chassis:
    name: Guards — chassis, app surface and packages
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      - name: No desktop app shows users a package id where its company name belongs
        run: node tooling/ci/assert-desktop-runner-identity.mjs
      - name: A stamped app CALLS every capability it declares
        run: node tooling/ci/assert-stamp-wiring.mjs
      - name: No capability exists twice, in an app or the template
        run: node tooling/ci/assert-no-seam-forks.mjs
      - name: Shared code carries no app-specific vocabulary
        run: node tooling/ci/assert-no-clone-tells.mjs
      - name: Core stays pure, the design system stays domain-free, apps use the seams
        run: node tooling/ci/assert-package-boundaries.mjs
      - name: Every package is earned, or dated
        run: node tooling/ci/assert-package-earned.mjs
      - name: Every vendor satisfies the portability checklist
        run: node tooling/ci/assert-vendor-portability.mjs
      - name: One convention set reaches every app, and can fail a build
        run: node tooling/ci/assert-lint-inheritance.mjs
      - name: No app has hollowed out the gates it inherited
        run: node tooling/ci/assert-no-gate-weakening.mjs
      - name: No hardcoded user-facing strings in the brick
        run: node tooling/ci/assert-no-hardcoded-strings.mjs
      - name: Every adapter declares where it works
        run: node tooling/ci/assert-adapter-capabilities.mjs
      - name: The inherited screen set is declared, present and reachable
        run: node tooling/ci/assert-screen-set.mjs
      - name: Every reachable surface has a width measurement, and every measurement a surface
        run: node tooling/ci/assert-responsive-coverage.mjs
      - name: Every reachable surface has an accessibility sweep, and every sweep a surface
        run: node tooling/ci/assert-a11y-coverage.mjs
      - name: A first-run gate is found by its CONTROL, never by its widget type
        run: node tooling/ci/assert-modal-detection.mjs
      - name: Every rollout read is an observed rollout
        run: node tooling/ci/assert-flag-exposure.mjs
      - name: Every app carries a done-record, and its DoD items really run
        run: node tooling/ci/assert-app-dod.mjs

  security-scan:
    # why: split out so a leaked credential is not reported as "the platform
    # Worker lane failed". Both tools are pinned binaries with a checksum, never
    # the vendor action — gitleaks-action v2+ is a commercial licence for org
    # accounts (09-selfhost-build-release.md §4.2).
    name: Security — secret and workflow scanners
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      - name: Install gitleaks (pinned + checksum-verified)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          tarball="${RUNNER_TEMP}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          wget -q -O "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" -C "${RUNNER_TEMP}" gitleaks
          "${RUNNER_TEMP}/gitleaks" version
      - name: Secret scan (self-tests, then scans)
        run: node tooling/ci/scan-secrets.mjs . --gitleaks "${RUNNER_TEMP}/gitleaks"
      - name: Install zizmor (pinned + checksum-verified)
        env:
          ZIZMOR_VERSION: 1.28.0
          ZIZMOR_SHA256: e87b67160194884e375a46a12c57ccc904f762b53845f254fab7f17d98809c09
        run: |
          set -euo pipefail
          tarball="${RUNNER_TEMP}/zizmor_${ZIZMOR_VERSION}_linux_x64.tar.gz"
          wget -q -O "$tarball" \
            "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ZIZMOR_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" -C "${RUNNER_TEMP}" zizmor
          "${RUNNER_TEMP}/zizmor" --version
      - name: Workflow static analysis (self-tests, then scans)
        run: node tooling/ci/scan-workflows.mjs . --zizmor "${RUNNER_TEMP}/zizmor"

      - name: Install OSV-Scanner (pinned + checksum-verified)
        env:
          OSV_VERSION: '2.5.1'
          OSV_SHA256: 'f9f25499a2c8cc367b3af45df2ea7eeca7fbccceab9c35079968f4b3652194be'
        run: |
          set -euo pipefail
          bin="${RUNNER_TEMP}/osv-scanner"
          wget -q -O "$bin" \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  ${bin}" | sha256sum -c -
          chmod +x "$bin"
          "$bin" --version
      - name: Known-vulnerable dependencies, INCLUDING the Dart ones
        # why: the only scanner in this stack that reads pubspec.lock. Play
        # Console flags vulnerable SDK versions and can block updates, so this is
        # one of the two scanners here with a store consequence. Findings that
        # are acknowledged rather than fixed are DATED in osv-scanner.toml at the
        # repo root, which this reads by its own default name.
        run: |
          set -euo pipefail
          # why: --config is EXPLICIT. Without it v2 resolves a config per
          # lockfile DIRECTORY, so a root file loads, prints "unused ignores"
          # and ignores nothing for packages/tokens/package-lock.json.
          # Measured: run 33960900452.
          "${RUNNER_TEMP}/osv-scanner" scan source -r --config osv-scanner.toml .
      - name: Install Trivy (pinned + checksum-verified)
        env:
          TRIVY_VERSION: '0.74.0'
          TRIVY_SHA256: '2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a'
        run: |
          set -euo pipefail
          tarball="${RUNNER_TEMP}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          wget -q -O "$tarball" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" -C "${RUNNER_TEMP}" trivy
          "${RUNNER_TEMP}/trivy" --version
      - name: Vulnerabilities and misconfigurations in the filesystem
        # why: HIGH and CRITICAL only, and only what has a fix. A gate that goes
        # red on something nobody can act on gets switched off, and a switched-off
        # gate is worse than no gate at all.
        env:
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/trivy" fs --scanners vuln,misconfig --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress .

  site-tokens:
    name: Site design tokens (build + drift)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/tokens
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - run: npm ci
      - name: Delete the artifact so the build has to produce it
        run: rm -f ../../sites/_shared/assets/tokens.css
      - run: npm run build
      - name: The build actually wrote the artifact
        run: test -s ../../sites/_shared/assets/tokens.css
      - name: Site tokens.css must equal a fresh build
        run: git diff --exit-code -- ../../sites/_shared/assets/tokens.css

  site-shared:
    name: Shared site build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sites/_shared
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - run: npm ci
      - run: npm run build && test -s _site/index.html  # eleventy exits 0 on "Wrote 0 files"


  content-gate:
    name: Content pipeline (recipe -> pack -> sign -> gate)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - name: The pipeline's own tests
        run: node --test "tooling/content_pipeline/test/*.test.mjs"
      - name: The pipeline builds and signs the example pack, through the CLI
        run: |
          node tooling/content_pipeline/cli.mjs validate --recipe tooling/content_pipeline/examples/lingo-phrases/recipe.json
          node tooling/content_pipeline/cli.mjs build --recipe tooling/content_pipeline/examples/lingo-phrases/recipe.json --out "$RUNNER_TEMP/pack" --test-key
      - name: A recipe is a validated input contract, and the shards agree
        run: node tooling/ci/assert-recipe-contract.mjs
      - name: No pack ships a licence family nobody cleared
        run: node tooling/ci/assert-content-licences.mjs
      - name: The pipeline reproduces the frozen pack, and the signature binds the bytes
        run: node tooling/ci/assert-pack-roundtrip.mjs
      - name: A pack is inert data in only the locked formats
        run: node tooling/ci/assert-pack-inert.mjs
      - name: Every produced item has an IP-clean, logged prompt
        run: node tooling/ci/assert-prompt-provenance.mjs
      - name: The human sample is deterministic, covered and checklisted
        run: node tooling/ci/assert-review-gate.mjs
      - name: Publish is a gate, and an undrilled signing key cannot sign
        run: node tooling/ci/assert-publish-gate.mjs

  app-brick:
    name: App brick (stamp both variants + analyze + validate the clone contract)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-flutter
      - uses: ./.github/actions/setup-node
      - name: Install mason_cli
        run: dart pub global activate mason_cli 0.1.3

      - name: No shipped app carries Flutter's default launcher icon
        run: |
          flutter --version
          node tooling/ci/assert-launcher-icons.mjs

      - name: Stamp the default (client-only) app
        run: |
          export PATH="$PATH:$HOME/.pub-cache/bin"
          export NIKATRU_ALLOW_OVERWRITE=1
          mason get
          mason make app -c tooling/bricks/app/_probe_vars.json -o . --on-conflict overwrite
      - name: Stamped app carries ITS brand assets, not Flutter's
        run: |
          SEED=$(node -p "require('./tooling/bricks/app/_probe_vars.json').seed_hex")
          node tooling/ci/assert-stamp-brand-assets.mjs apps/probe --seed "$SEED"
      - name: Stamped text is the spec's, its release id is its own, and blank hosts were DERIVED
        run: node tooling/ci/assert-stamp-text-fidelity.mjs --vars tooling/bricks/app/_probe_vars.json
      - name: A freshly stamped app carries a COMPLETE, spec-derived store listing
        run: node tooling/ci/assert-store-metadata.mjs
      - name: SHOW-1 — probe is in the catalogue, and a RE-STAMP changes nothing
        run: |
          export PATH="$PATH:$HOME/.pub-cache/bin"
          export NIKATRU_ALLOW_OVERWRITE=1
          grep -q '"slug": "probe"' catalog/apps.json
          cp catalog/apps.json "$RUNNER_TEMP/apps-after-1.json"
          cp pubspec.yaml "$RUNNER_TEMP/pubspec-after-1.yaml"
          mason make app -c tooling/bricks/app/_probe_vars.json -o . --on-conflict overwrite
          diff -u "$RUNNER_TEMP/apps-after-1.json" catalog/apps.json
          diff -u "$RUNNER_TEMP/pubspec-after-1.yaml" pubspec.yaml
          git checkout -- catalog/apps.json sites/_shared/_data/apps.json
      - name: Default stamp claims NO Worker, NO D1 and NO R2
        run: node tooling/ci/assert-clone-contract.mjs --client probe
      - name: Stamped app is dart format-clean
        run: dart format --output=none --set-exit-if-changed apps/probe
      - name: Stamp the opt-in backend app
        run: |
          export PATH="$PATH:$HOME/.pub-cache/bin"
          export NIKATRU_ALLOW_OVERWRITE=1
          mason make app -c tooling/bricks/app/_probe_backend_vars.json -o . --on-conflict overwrite
      - name: Stamped backend app is dart format-clean
        run: dart format --output=none --set-exit-if-changed apps/probeapi
      - name: The app spec is one validated input contract
        run: node tooling/ci/assert-input-contract.mjs
      - name: A stamped app claims only platforms it is built for
        run: node tooling/ci/assert-stamp-platforms.mjs
      - name: Stamped app asserts its own chassis properties
        run: node tooling/ci/assert-stamp-properties.mjs
      - name: The stamped app carries a done-record, and its DoD items really run
        run: node tooling/ci/assert-app-dod.mjs . --require-stamped
      - name: Analyze + test the stamped app
        working-directory: apps/probe
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test
      - name: A fresh stamp really builds for web
        working-directory: apps/probe
        run: flutter build web --pwa-strategy=none
      - name: Every asset the build actually shipped has a licence row
        run: node tooling/ci/assert-licence-register.mjs . --bundle apps/probe/build/web/assets

      - name: Backend stamp has a Worker + APP_DB but still no per-app R2
        run: node tooling/ci/assert-clone-contract.mjs --client probe --backend probeapi
      - name: The provisioner's config surgery still targets APP_DB, not the shared binding
        run: node tooling/scripts/provision-backend.mjs probeapi --self-check
      - name: Backend stamp derived its own web origin, API host and release id
        run: node tooling/ci/assert-stamp-text-fidelity.mjs --vars tooling/bricks/app/_probe_backend_vars.json --service services/probeapi-api
      - name: Revert the catalogue — both probes are throwaway
        run: git checkout -- catalog/apps.json sites/_shared/_data/apps.json
      - name: Analyze the stamped backend app
        working-directory: apps/probeapi
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test
      - name: The WHOLE workspace still resolves from the root with stamped apps on it
        run: flutter pub get
      - name: Revert the root pubspec + lockfile — both probes are throwaway
        run: git checkout -- pubspec.yaml pubspec.lock
      - name: Typecheck + dry-run the stamped service
        working-directory: services/probeapi-api
        run: |
          npm install
          npx tsc --noEmit
          npx wrangler deploy --dry-run

  sites:
    name: Static sites (functions parse + required files)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Site integrity
        run: node tooling/ci/check-site-integrity.mjs . sites/nikatru sites/rajasekarselvam
      - name: The published catalogue satisfies its contract
        run: node tooling/ci/assert-catalog-contract.mjs
      - name: Delete the feed so the generator has to produce it
        run: rm -f sites/_shared/_data/apps.json
      - run: node tooling/sites/generate-apps-data.mjs
      - name: The generator actually wrote the feed
        run: test -s sites/_shared/_data/apps.json
      - name: Site feed must equal a fresh generation from the catalogue
        run: git diff --exit-code -- sites/_shared/_data/apps.json
      - name: Catalogue advertises no dead app
        run: node tooling/ci/assert-catalog-reachable.mjs
      - name: The published render payload satisfies its contract
        run: node tooling/ci/assert-render-payload.mjs
      - name: Delete the payload so the publisher has to produce it
        run: rm -f catalog/apps-landing.json
      - run: node tooling/sites/generate-landing-payload.mjs
      - name: The publisher actually wrote the payload
        run: test -s catalog/apps-landing.json
      - name: Render payload must equal a fresh publish from the rail config
        run: git diff --exit-code -- catalog/apps-landing.json
      - name: Discovery surfaces match the registry that generated them
        run: node tooling/ci/assert-discovery-surface.mjs
      - name: Every inline palette copy still matches the token source
        run: node tooling/ci/assert-palette-consistent.mjs
      - name: The store matrix registry is internally consistent (tree limbs run locally)
        run: node tooling/ci/assert-store-matrix.mjs --registry-only

  workspace-gate:
    name: Workspace gate (melos analyze + test)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Assert workspace coverage
        run: node tooling/ci/assert-workspace-coverage.mjs
      - uses: ./.github/actions/setup-flutter
      - name: Activate melos
        run: dart pub global activate melos 8.2.2
      - name: Resolve the workspace
        run: flutter pub get --enforce-lockfile
      - name: The shipping app is dart format-clean
        run: dart format --output=none --set-exit-if-changed apps/subly
      - name: The Apple privacy manifests still describe the binaries that ship
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/assert-apple-privacy-manifest.mjs
      - name: melos run analyze
        run: |
          export PATH="$PATH:$HOME/.pub-cache/bin"
          melos run analyze
      - name: melos run test
        run: |
          export PATH="$PATH:$HOME/.pub-cache/bin"
          melos run test
      - name: Web arm in a real browser (dart test -p chrome)
        working-directory: packages/core
        run: |
          set -euo pipefail
          export CHROME_EXECUTABLE="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser)"
          echo "Chrome: $CHROME_EXECUTABLE"
          dart test -p chrome


  ci-gate:
    # why: the ONE required status check on main. It must need every other job in
    # this file and must treat skipped as not-green — a skipped required check
    # satisfies branch protection, which is how a lane goes dark under a tick.
    # tooling/ci/assert-green-means-ran.mjs asserts all of that by name.
    name: ci-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs:
      - worker-subly-api
      - worker-platform
      - guard-meta
      - guards-platform
      - guards-legal
      - guards-store
      - guards-chassis
      - security-scan
      - site-tokens
      - site-shared
      - content-gate
      - app-brick
      - sites
      - workspace-gate
    if: always()
    steps:
      - name: Require all lanes green
        run: |
          echo "worker-subly-api=${{ needs.worker-subly-api.result }}"
          echo "worker-platform=${{ needs.worker-platform.result }}"
          echo "guard-meta=${{ needs.guard-meta.result }}"
          echo "guards-platform=${{ needs.guards-platform.result }}"
          echo "guards-legal=${{ needs.guards-legal.result }}"
          echo "guards-store=${{ needs.guards-store.result }}"
          echo "guards-chassis=${{ needs.guards-chassis.result }}"
          echo "security-scan=${{ needs.security-scan.result }}"
          echo "site-tokens=${{ needs.site-tokens.result }}"
          echo "site-shared=${{ needs.site-shared.result }}"
          echo "content-gate=${{ needs.content-gate.result }}"
          echo "app-brick=${{ needs.app-brick.result }}"
          echo "sites=${{ needs.sites.result }}"
          echo "workspace-gate=${{ needs.workspace-gate.result }}"
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ] || [ "${{ contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "::error::One or more CI lanes failed, was cancelled, or never ran — see the verdicts above"; exit 1
          fi
          echo "All lanes green"
