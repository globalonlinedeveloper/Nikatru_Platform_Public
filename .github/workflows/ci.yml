name: CI

on:
  push:
    # ALL THREE documented branch prefixes, not just feat/. architecture.md §24
    # defines the convention as `feat|fix|chore/<slug>`, but this list watched
    # only `feat/**` — so every fix/ and chore/ branch got NO CI at all and
    # would reach the `--no-ff` merge unverified. The failure was silent in the
    # worst way: `gh run list` simply returns nothing, which is indistinguishable
    # from "queued" until you notice no run ever appears.
    branches: [main, 'feat/**', 'fix/**', 'chore/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}  # FALSE ON MAIN ONLY. Every push to main resolves to the same group, so the 10:03 run was killed by the 10:08 push and a cancelled run notifies nobody and blocks nothing (deploy-web.yml:476, runs 145/146). PR events resolve to refs/pull/N/merge, and a plain false would queue every superseded feature-branch push. — RETRACTION 2026-08-25: the text that stood here read 'NOT REDDENABLE BY ANY FIXTURE, and said so rather than hidden: a grep for `concurrency` and for `cancel-in-progress` over tooling/ci/*.mjs and tooling/scripts/*.mjs returned ZERO hits on 2026-08-25, so nothing in this tree asserts a concurrency policy and no mutant of this line can be caught by a guard'. THAT IS FALSE and is withdrawn. The grep was literally true only because its domain was wrong — non-recursive, and one directory short. Re-measured this round: `grep -rniE "concurrency|cancel-in-progress" tooling/ci/ tooling/scripts/` -> 25 hits, every one in the safe-rerun test file under tooling/ci/test/. THE GUARD THAT READS THIS LINE IS safe-rerun.mjs, under tooling/ops/: its :221-282 parses every workflow's top-level `concurrency:`, and :333-344 `namedLaneProblem()` is pointed BY NAME at '.github/workflows/ci.yml' and asserts this very key. safe-rerun.test.mjs:351, under tooling/ci/test/, drives it against the REAL .github/workflows directory ('namedLaneProblem is null on the REAL tree — ci.yml is still the subject'), and that suite is executed by this workflow at ci.yml:160. MEASURED BY MUTATION 2026-08-25, against a copy of .github/workflows in a scratch directory: as written -> parse {group:'ci-${{ github.ref }}', cancelInProgress:true, cancelIsExpression:true}, namedLaneProblem null, suite 41 pass / 0 fail exit 0; this line replaced by a bare `cancel-in-progress: false` -> namedLaneProblem returns 'COVERAGE LOST — .github/workflows/ci.yml declares a group but `cancel-in-progress` is not true, so this tool would now allow every re-run on it.' A `false` MUTANT IS THEREFORE CAUGHT, by a fixture that was already in the tree. ⚠️ THE HALF THAT IS STILL TRUE, STATED AS IT IS RATHER THAN SOFTENED: NO FIXTURE HERE CATCHES AN EXPRESSION MUTANT. safe-rerun.mjs:280 collapses any `${{ ... }}` value to cancelling (`cancelIsExpression ? true : ...`), so `${{ github.ref == 'refs/heads/main' }}`, a typo'd ref literal (`refs/head/main`), a misspelled context path (`github.refx`) AND the original bare `true` each leave namedLaneProblem null — all four mutated and run this round. WE DID NOT BUILD A FIXTURE THAT DISTINGUISHES THEM; the gap is recorded, not closed. THE SOURCE MUTATION FOR THOSE FOUR IS THEREFORE THIS LINE ITSELF: put `true` back and every push to main can again kill the run in flight, and nothing here goes red. SEMANTIC DIRECTION — a different question from what a guard catches — was proven by rendering the scalar under github.ref = refs/heads/main -> false, refs/heads/feat/<slug> -> true, refs/pull/N/merge -> true, with each of the three wrong-expression mutants flipping main back to true. ⚠️ THE .mjs PATHS ABOVE ARE WRITTEN SPLIT (basename + 'under <dir>/') ON PURPOSE, NOT AS A STYLE: assert-guard-coverage.mjs matches /tooling\/([A-Za-z0-9._\/-]+\.mjs)/ over this file with only whole-line `#` comments stripped, so a trailing comment naming `tooling/ci/test/<x>.test.mjs` is read as a NESTED GUARD INVOCATION and turns that guard RED. Measured: writing them joined here produced '✗ COVERAGE LOST — 2 workflow step(s) invoke a tooling/ci path this FLAT scan cannot audit', exit 1; split, exit 0. See duty.workflow.ci.yml in tooling/ops/register.json for the measured cadence this was sized against.

# NOTE (2026-07-22): the Dart/Flutter per-package lanes (flutter/app, core, api_client,
# design_system, telemetry) were RETIRED — `workspace_gate` runs `melos run analyze` +
# `melos run test` across every Dart workspace member in ONE resolution, which fully
# covers them (analyze = dart analyze per member, infos non-fatal; test = dart test for
# pure-Dart members + flutter test for Flutter members). The lanes below are the ones
# workspace_gate does NOT cover: the TS Workers, the Node token/site builds, and the
# brick-stamp validation.

# Least privilege. These jobs only read the repo — they publish nothing through
# GITHUB_TOKEN. Without this every job ran at the repository-default scope, which
# on a public repo is a standing hand-out to any compromised action. [pipeline F-11]
permissions:
  contents: read

jobs:
  subly_api:
    name: subly-api Worker (typecheck + test + dry-run)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/subly-api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        # persist-credentials: false — actions/checkout otherwise writes GITHUB_TOKEN
        # into .git/config and LEAVES it there for the whole job. Any later step that
        # packages the workspace (or anything containing .git/) ships the token inside
        # the artifact, and on a PUBLIC repo artifacts are downloadable. Nothing here
        # does git push/tag/commit, so none of these checkouts need the credential.
        # [zizmor artipacked] Verified 2026-07-27: no current artifact path includes
        # .git/ — so this closes a FUTURE mistake, not a live leak.
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx tsc --noEmit
      # This lane was typecheck + dry-run and NOTHING else, on a Worker with no
      # test directory at all — so every security property it has was enforced by
      # code review. Proven 2026-07-31: deleting `AND user_id = ?` from
      # subscriptions.ts left BOTH steps green, i.e. the whole lane passed on a
      # build where any authenticated user could read any other user's rows.
      # `tsc` cannot see a WHERE clause and `--dry-run` never executes one.
      - run: npm test
      - run: npx wrangler deploy --dry-run

  platform:
    name: platform Worker (typecheck + test + dry-run)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Job-level override of the workflow's `contents: read`. assert-platform-proof-
    # fresh.mjs reads build-platforms.yml's run history, which needs `actions: read`
    # — granted HERE rather than workflow-wide so the other lanes keep the smaller
    # scope. [pipeline F-11] is the principle; F-4 is the reason.
    permissions:
      contents: read
      actions: read
      # [pipeline 14]O-3 — the record-query limb reads the Renovate Dependency
      # Dashboard issue as `duty.renovate`'s record. Without this the reader
      # reports `unreadable` and queries nothing, which is honest but is not the
      # requirement. Read-only, and scoped to this job for the same reason
      # `actions: read` is.
      issues: read
    defaults:
      run:
        working-directory: services/platform
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # 🔴 FULL HISTORY, and it is load-bearing rather than tidy.
          # `assert-policy-archive.mjs` derives "every privacy-policy version that
          # has ever been in force" from `git log -p` over the declaring files —
          # the archive it demands exists precisely because the live page is
          # edited IN PLACE and the superseded bytes survive nowhere else.
          # At the default depth of 1 that walk sees one commit adding the whole
          # file, which is indistinguishable from "there has only ever been one
          # version": the guard would pass forever while checking nothing about
          # the past. It refuses to run on a shallow clone for that reason, so
          # removing this line turns the step RED rather than quietly hollow.
          # [pipeline K-4]
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      # FIRST: prove the guards can still FAIL, before trusting anything they say.
      #
      # Every guard below runs against the real repository — which is valid input
      # by definition — so CI only ever exercises their passing path. A guard that
      # silently stops working still prints "ok", and the requirement it enforces
      # silently stops holding while the spec still reads VERIFIED. Both have
      # already happened here: check-migrations' own coverage assertion omits
      # services/subly-api, and assert-gate-passed shipped an off-by-one that made
      # it unable to read its own SHA and blocked both production deploys.
      #
      # These tests feed each guard known-bad input and assert it fails. Verified
      # by mutation: neutering any of the DROP TABLE / RENAME / NOT NULL rules, the
      # CORS required-origin list, the workspace check, or re-introducing the real
      # off-by-one, each turns this step red. [pipeline F-10]
      #
      # ⚠️ TWO REPORTERS, AND BOTH ARE LOAD-BEARING — do not simplify this back to
      # a bare `node --test`. `spec` → stdout is what a human reads when this step
      # goes red, and it must survive; `junit` → a file is the only INDEPENDENT
      # measure of what the suite ran, because node records the FILE of every test
      # case in it. The next step compares that against the recorded floor.
      # Dropping the spec reporter leaves a failed run unreadable; dropping the
      # junit one makes the next step COVERAGE LOST, never quietly green.
      - name: The guards must be able to fail
        working-directory: ${{ github.workspace }}
        # 🔴 THIS STEP HAD NO `env:` AT ALL UNTIL 2026-09-02, AND THAT WAS THE BUG.
        # `ops-register.test.mjs`'s end-to-end case spawns the real
        # assert-ops-register.mjs against the real register, inheriting THIS
        # step's environment — so it ran with no credentials of any kind, every
        # [14]O-3 reader went dark, and the unreadable count hit the ceiling.
        # That ceiling exists to detect precisely this ("FAILS the moment the
        # last query goes dark — which is what a lost GITHUB_TOKEN in ci.yml
        # looks like"), so the guard was working and the environment was wrong.
        # THE FIX IS THE TOKENS, NEVER A HIGHER CEILING — see
        # `_recordReaders._maxUnreadableWhy` in tooling/ops/register.json.
        #
        # ⚠️ AND THIS DOES NOT MAKE THE MERGE QUEUE DEPEND ON EITHER BOX. Every
        # reader fails to `unreadable`, which PRINTS; only breaching the ceiling
        # fails. A GlitchTip or Cloudflare outage therefore costs one line of
        # output. That is the condition under which the standing objection below
        # ("would make every build depend on the Oracle box, which is the very
        # SPOF E-9b is about") is answered rather than ignored.
        #
        # Every token-sensitive test in tooling/ci/test/ sets or deletes the
        # variable it cares about explicitly, so arming these here changes no
        # other case — checked across the suite before landing, not assumed.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GLITCHTIP_TOKEN: ${{ secrets.GLITCHTIP_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # ⚠️ `>-` AND NOT `|`, DELIBERATELY. A folded scalar joins these lines
        # with SPACES into ONE logical run line — the shape this step had before,
        # and the shape the shared workflow parser reads. A `|` block is joined
        # with ` ; ` instead, which would split this single command into segments
        # and leave the test glob sitting in a segment that runs no `node`, which
        # is exactly the shape the guard-coverage flat scan reports on.
        run: >-
          node --test
          --test-reporter=spec  --test-reporter-destination=stdout
          --test-reporter=junit --test-reporter-destination="${{ runner.temp }}/guard-tests.junit.xml"
          "tooling/ci/test/*.test.mjs"
      # …and every guard must HAVE such a test, plus a self-check that its own
      # scan still reaches what it claims. That was a rule people followed and
      # the accounting rotted: the spec said "5 of 6 guards" while the tree held
      # SEVENTEEN. A count nobody computes is a count that drifts. This is F-9's
      # idea — every unit claimed by a lane — applied to the guards themselves.
      # The two guards that scan nothing are exempt BY NAME AND REASON in the
      # script, never by silent omission. [pipeline F-10]
      #
      # ⚠️ THIS FILE IS PART OF THE CHECK, not just the thing that runs it. Since
      # 2026-08-01 the guard set is pinned by an IDENTITY rather than by a hand-
      # ratcheted floor: every `.mjs` in tooling/ci must be invoked by one of the
      # tracked workflows, and every tooling/ci invocation in a workflow must
      # name a file that is there. So DELETING A GUARD FROM tooling/ci WITHOUT
      # DELETING ITS `run:` LINE HERE FAILS, and adding one needs no number
      # raised anywhere — only this wiring. The three floors it replaced
      # (MIN_GUARDS/MIN_TEST_FILES/MIN_TEST_CASES) collided on three consecutive
      # merges in one day, because they were a shared mutable every parallel
      # branch had to write to.
      - name: Every guard is tested and self-checking
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/assert-guard-coverage.mjs
      # …and the ratchet floor that step maintains must not claim MORE coverage
      # than the suite can possibly run.
      #
      # 🔴 tooling/ci/test/coverage-manifest.json recorded 431 for guards.test.mjs,
      # a file that runs 398 tests, and it stood for as long as it stood because
      # THE NUMBER HAD NO INDEPENDENT ARBITER: the floor is produced by countCases
      # in assert-guard-coverage.mjs, and the only thing that ever checked the
      # floor was countCases again. A HOLLOW file was always caught — the ratchet
      # fails on a DROP — but an INFLATED one never was, and inflation is the
      # direction that matters: a floor is a promise that this much coverage
      # exists, and 57 of the cases it promised were `test('…')` spelled inside
      # fixture STRING LITERALS that nothing runs.
      #
      # This step is the arbiter, and it reads node's OWN report of what it ran —
      # the junit file the test step above wrote — never a second count of the
      # same declarations. `floor <= executed`, `<=` and not `==`: countCases
      # counts LINE-ANCHORED declarations, so a case generated inside a loop runs
      # without being declared (guards.test.mjs: 383 declared, 398 run).
      #
      # ⚠️ IT RUNS AFTER assert-guard-coverage.mjs ON PURPOSE, NOT BEFORE. That
      # guard REWRITES the manifest in-runner when a count rises, so running the
      # arbiter afterwards checks the floor AS RAISED BY THIS VERY RUN. Before it,
      # an inflated rise computed here would read as green and only be caught the
      # next time somebody committed the rewritten manifest — one whole run late,
      # which for a ratchet means permanently. [pipeline F-10]
      - name: The recorded floor must not exceed what actually ran
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/assert-case-count-honest.mjs --junit "${{ runner.temp }}/guard-tests.junit.xml"
      # No guard enumerates a directory itself. Reproduced on main 2026-08-02:
      # with agent worktrees present under .claude/worktrees/, five guards walked
      # into NESTED FULL COPIES of this repository and read their files as the
      # tree's own — assert-ops-register exited 1 with sixteen problems. CI
      # creates no worktrees, so THIS JOB WAS GREEN THROUGHOUT and only a
      # developer machine was red, which is the shape that teaches people to stop
      # believing a guard. Every listing now goes through tooling/ci/tree-walk.mjs
      # and this step proves that helper still refuses, against a real nested
      # checkout it builds in a temp directory on every run.
      - name: Guard tree walks cannot leave the tree
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/assert-walks-bounded.mjs
      - name: The enforcement index is what the tree says
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/assert-enforcement-index.mjs
      - name: An Apple privacy manifest that exists is one the build copies
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/assert-privacy-manifest.mjs
      # [13]T-10 forbids TWO things — "never a per-app cron AND never Durable
      # Object Alarms" — and only the cron half was ever built (S-6's limb in
      # assert-clone-contract.mjs). `rg -i alarm tooling/ci/*.mjs` found nothing
      # but the words "false alarms" in unrelated guards: there was no DO-alarm
      # check anywhere in this repo.
      #
      # 🔴 THE UNGUARDED HALF WAS THE ONE THE GUARDED HALF PUSHED WORK TOWARD. A
      # Durable Object Alarm is the documented Cloudflare answer to "I need
      # scheduled work and cannot have a cron trigger", so every time the cron
      # limb fires it is a signpost to the path nothing watched — and unlike a
      # cron, an alarm needs NO config change at all to start firing.
      #
      # It also fixes the enumeration T-10's acceptance actually asks for: this
      # globs the whole tree for wrangler configs rather than listing services/,
      # so a Worker config at the repo root, under sites/ or under apps/ is seen.
      # Parsed, never grepped, and cross-checked against `git ls-files` so a
      # config the repo tracks and the scan never opened is COVERAGE LOST.
      # Mutation-proven against the REAL tree: a Durable Object planted in
      # services/subly-api/src/index.ts turns this red on 4 rules while
      # `tsc --noEmit` stays clean, so the catch is this guard and not the
      # compiler.
      - name: No Worker schedules itself with a Durable Object alarm
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/assert-no-do-alarms.mjs
      # The repository's own legal posture. THREE limbs of deliberately different
      # strength (the guard says which is which): one support address across
      # SECURITY.md, every app's AppConfig and the published contact page; the two
      # posture tokens in NOTICE.md; and NO LICENCE FILE AT THE ROOT.
      #
      # That last one is the only assertion in this whole workflow guarding
      # something IRREVERSIBLE. No-LICENSE is what makes this tree
      # all-rights-reserved, and a licence grant cannot be un-granted — deleting
      # the file later does not retract it from anyone who already cloned, and it
      # stays in the public history. Mutation-proven against a copy of the real
      # tree, 10/10 caught, including `touch LICENSE` and the same grant landing
      # as COPYING. [pipeline K-12]
      - name: The repository states its own legal posture
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/assert-repo-posture.mjs
      # A consent record is worth exactly the bytes it can still point at. The
      # privacy notice is ONE URL edited in place; on 2026-08-01 the version moved
      # from 2026-07-26 to 2026-08-01 with no archive, so every artifact collected
      # before that cited a document nobody could serve. This asserts a snapshot
      # exists for every version that has EVER been in force (derived from real
      # history — `git log -S` provably misses an in-place value change and was
      # measured doing so here), that the current snapshot's text equals the live
      # page's, and that an archived policy is not a second live one.
      # Needs `fetch-depth: 0` above; it refuses a shallow clone. [pipeline K-4]
      - name: Every policy version a user consented to is still retrievable
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/assert-policy-archive.mjs
      # Every EMPHASISED claim on the three published legal pages is paired to
      # what makes it true — and the domain is the <b> spans in the served HTML,
      # so it cannot be shrunk without editing a document a human publishes. The
      # subset that can be checked against code IS checked: the signup record is
      # {email, ts} and nothing else; the IP fingerprint is keyed, not a digest;
      # no advertising SDK appears in any pubspec in the tree; no migration
      # declares a card or bank column.
      #
      # ⚠️ ONLY `code` ROWS CARRY AN ASSERTION. This does not prove the pages
      # true and its own header says so. Four things ARE wrong on those pages
      # today — the crash-report host, the Razorpay/merchant-of-record
      # contradiction, the unnamed seller and the unnamed identity provider —
      # and every one is fixed by publishing copy only the owner can approve
      # (OWNER_QUEUE O-3). They PRINT every run and cannot be silently exempted:
      # each declares the sentence that must still be on the page, and the guard
      # goes RED when that sentence is corrected, demanding the row be retired.
      # [pipeline K-3, K-5]
      - name: Every published legal claim is paired, and the payment path is named
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/assert-policy-claims.mjs
      # …and the limb the step ABOVE structurally could not have: it compares
      # published text to REPO text, so it proves the site says what the register
      # says and nothing more. On 2026-08-05 privacy.html said "We do not collect
      # or store your IP address" while the self-hosted GlitchTip on the Oracle
      # box stored `user.ip_address` — all 39 claim rows matched, and the only
      # personal-data store outside Cloudflare appears in NO inventory here, so
      # it was invisible by construction rather than overlooked.
      #
      # This scopes every published "we do not collect / do not store X" against
      # the union of what every LIVE infrastructure provider DECLARES it receives
      # and retains. A denial that intersects the union fails, naming the claim
      # and the provider; a denial that resolves to no category fails until
      # somebody classifies it, so a new promise cannot be published unscoped.
      #
      # 🔴 IT IS A GATE ON THE DECLARATION AND A MONITOR-SHAPED GAP FOR THE SINK,
      # and the guard's header says so rather than implying more reach than it
      # has. Nothing push-gated can read a Django setting on an Oracle VM whose
      # compose file lives at /opt/glitchtip. Reconfigure the sink without
      # editing the register and this stays green — only a probe against the live
      # GlitchTip API closes that, and the `transits` declarations that are the
      # one way to silence the check PRINT on every run for exactly that reason.
      # [pipeline K-5]
      - name: Every live sink declares what it holds, and no page denies it
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/assert-sink-disclosure.mjs
      # Every place data can go — every table any migration creates, every D1 /
      # KV / R2 binding any wrangler config declares, and every KV binding a
      # Pages Function reaches — has exactly one inventory row, and every row has
      # a store. The second direction is what stops the inventory becoming a
      # wish-list: rename a table and the row describing the old name fails.
      #
      # The Pages-Function walk is not decoration: SIGNUPS is bound in the
      # Cloudflare dashboard and appears in no config in this repository, and it
      # holds the only plain email address we store. A wrangler-only walk would
      # have reported full coverage while missing it.
      #
      # ⚠️ Two rows declare retention `undecided` and PRINT every run. An agent
      # picking "90 days" for a real signup list would be inventing a number that
      # then looks authoritative and silently deletes somebody's data.
      # [pipeline K-8]
      - name: Every store that holds data is inventoried and disclosed
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/assert-data-inventory.mjs
      # The duty matrix, checked against itself: every declared requirement has a
      # row and every row names a declared requirement; every tripwire states the
      # condition that makes it bite; a review date in the PAST fails.
      #
      # 🔴 AND THE SOURCE-HOST ALLOWLIST, which is four lines of code and the
      # highest-value rule in the file: a duty's source must be the body that
      # WROTE the rule or the platform that ENFORCES it. A law firm's client
      # alert or a compliance vendor's blog fails the row — roughly thirty dead
      # claims entered this project's corpus from exactly that shape, each
      # reading as authoritative. A row marked COULD-NOT-ESTABLISH may not carry
      # a URL at all: the mark means nobody has read the primary text, and a
      # plausible link beside it is a false citation.
      # Its own step, not the sites lane. [pipeline K-13]
      - name: The per-market duty matrix cannot silently rot
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/assert-legal-tripwires.mjs
      # Rights evidence for everything shipped, in DECLARED mode — what the
      # manifests intend to ship, so it runs here with no Flutter toolchain. The
      # app_brick lane runs the same guard with --bundle against a real build.
      #
      # Every row carries a SOURCE for its licence claim and the guard refuses a
      # row without one. The stage document states Flutter's bundled icon font is
      # CC-BY 4.0; upstream has published under Apache-2.0 since 2016. Both are
      # plausible, one is wrong, and the row says UNVERIFIED rather than picking.
      # CC-BY-NC and CC-BY-SA are refused outright: the first excludes commercial
      # distribution, the second's anti-ETM term is refuted by the Ed25519
      # signature on our content packs. [pipeline K-10, K-11]
      - name: Every shipped asset has rights evidence, and every app shows it
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/assert-licence-register.mjs
      # Additive-only schema guard. Lives in this lane (no new lane) but scans
      # EVERY migration set in the repo — one shared platform_db means one
      # destructive migration is a portfolio-wide outage. Runs before the build
      # so a banned statement fails fast.
      - name: Schema evolution is additive-only
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/check-migrations.mjs
      # …and the ANALYTICS half of that schema is one contract written down in
      # four places that cannot import each other: the migrations, the ingest
      # route, the Dart event object and the Dart wire envelope. E-1's acceptance
      # ("one locked taxonomy and envelope serves every app") could not fail —
      # events.test.ts posts one fixture batch and nothing compared the sets.
      #
      # It also makes the two privacy invariants STRUCTURAL. events.test.ts:141
      # and :663 assert "no ip column" by searching the INSERT *string*, so a
      # migration adding `ip TEXT` to the schema passes both; and
      # check-migrations above reads migrations only and exempts WHERE-filtered
      # statements by design, so a filtered `DELETE FROM consent_artifacts` in
      # route code is invisible to it — measured, not argued: it printed
      # "8 migration file(s) clean" over exactly that mutation.
      # [pipeline 11]E-1, E-2, E-3
      - name: One analytics envelope, and the consent trail stays append-only
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/assert-analytics-contract.mjs
      # …and the money rail's half of that schema is COMPLETE, which the step
