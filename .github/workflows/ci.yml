name: CI

# ─────────────────────────────────────────────────────────────────────────────
# Every gate here is one command — `node scripts/<name>.mjs`, or a tool's own
# `node Extension/<Tool>/publish/<name>.node.js`, identical on a runner and in
# PowerShell — EXCEPT the inline shell blocks, of which there are EIGHT.
# Two greps, both measured 2026-08-22, and they deliberately disagree by one:
#   grep -cE '^ *run: \|$'           .github/workflows/ci.yml   ->  8
#   grep -cE '^        shell: bash$' .github/workflows/ci.yml   ->  7
# The one in the gap is the step named "Show the matrix", which carries no
# `shell:` key at all, so the anchored form cannot list it. That is an exclusion,
# not an oversight, and the reason is in this sentence rather than 600 lines
# below it: the rule above is about GATES, and that step has no failure path —
# it echoes the tool list and emits a `::notice::`. If you want the exception
# set, use the first grep; if you want the gates among them, use the second.
# ⚠️ This header used to say "EXCEPT the 7 inline blocks `grep -cE "^        shell:
# bash$"` finds", which handed a reader a command returning 7 of 8 and left the
# reconciliation in a comment near the `selftest` job.
#
# This workflow therefore REQUIRES these scripts in scripts/:
#
#   discover.mjs        globs */*/tool.json -> the CI matrix (diff-aware);
#                       must emit TOOL IDS (`fullshot`), not directories —
#                       the id is the stable public handle, the directory is not
#   secret-scan.mjs     credential shapes, whole tree
#   lint.mjs            node --check on every shipped .js/.mjs
#   policy-check.mjs    privacy / permission / store-limit gates
#   check-core-sync.mjs  <tool>/vendor/core matches core/
#   check-version.mjs   manifest version == top CHANGELOG entry
#   run-tests.mjs       runs exactly the commands in tool.json "tests"
#   pack.mjs            allowlist -> deterministic zip, per target
#   verify-refs.mjs     reference integrity + leak check, ON THE ZIP
#   sha256.mjs          hash one file (used by the determinism check)
#
# SOME OF THEM ARE NOT WRITTEN YET, AND THIS FILE DOES NOT PRETEND OTHERWISE.
# The `gate-inventory` job below reads the set of scripts actually called out of
# these workflow files and prints PRESENT / ABSENT for each, every run. It is
# derived rather than listed, so it cannot drift the way this comment can, and
# it is the answer to "which of these gates is real today" — not the prose here.
#
# A missing script FAILS its job. Do not "fix" that with an `if [ -f "$gate" ]`
# guard: a workflow that skips its own absent gates is a green build that
# checks nothing, which is strictly worse than a red one that names what is
# missing. The inventory job exists so that the red says which, in one place,
# instead of eight `Cannot find module` errors scattered across a matrix.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default, stated explicitly rather than inherited. No job in this
# workflow writes to the repository; the release workflow is the only writer.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  gate-inventory:
    name: Gate inventory (which gates exist)
    runs-on: ubuntu-latest
    # Deliberately NOT a `needs:` of anything. A gate that exists must still run
    # and prove itself on this push even while another one is unwritten; making
    # every job wait on a complete toolchain would mean the day one script lands
    # nothing else has been exercised in weeks.
    steps:
      - uses: actions/checkout@v7
      - name: Every gate script these workflows call must exist
        shell: bash
        run: |
          set -euo pipefail  # 🔴 FIXED 2026-08-22, AND THE HOLE WAS PRE-EXISTING AT HEAD — IT WAS NOT INTRODUCED BY THE CHANGE THIS COMMENT SHIPS IN. GitHub runs an explicit `shell: bash` as `bash --noprofile --norc -eo pipefail {0}`, so `-e` IS ALREADY ON when this body starts. This line used to read `set -uo pipefail`, which added `-u` and removed nothing — and under `-e` a command whose failure this step means to REPORT kills the shell first, so the report is dead code on the runner. `-e` is spelled out here so the flag a reader sees is the flag that is running, and every reported command below carries its own `||`. Here the reported command is the `called=` grep: with no match it exits 1, pipefail propagates that, and `-e` killed the step before the `::error::` that says THIS CHECK'S OWN PATTERN IS BROKEN could print. MEASURED 2026-08-22, this exact body against an empty .github/workflows: runner flags EXIT 1 and 0 bytes; bare `bash` EXIT 1 and the 168-byte explanation. (Trailing comment rather than a line of its own: 23 `ci.yml:NNN` citations in six other files land in the band below and every line added here moves all of them.)
          # DERIVED, NOT LISTED. The set is read out of the workflow files, so it
          # is exactly what will be invoked — .mjs gates and the .node.js self-test
          # alike. A hand-written list would be a second copy of the same fact, and
          # the copy is the one that rots, toward looking healthier than the repo is.
          # 🔴 THE SECOND ALTERNATIVE WAS ADDED 2026-08-20 AND IT CLOSED A REAL
          # BLIND SPOT. The pattern was anchored on `scripts/` alone, so a gate
          # living in a TOOL's publish/ directory could never appear in this
          # inventory — which is how publish/verify-firefox-package.node.js sat
          # in no workflow at all, unnoticed, while being the repo's most
          # detailed AMO gate.
          #
          # ⚠️ IT IS DELIBERATELY NARROW RATHER THAN A GENERAL PATH MATCH.
          # Measured that day: loosening it to any `<something>/publish/*.node.js`
          # also matches PROSE — a comment three jobs below mentions
          # `publish/package.node.js`, a tool-relative path that does not resolve
          # from the repo root, so the inventory would have reported ABSENT and
          # failed the build over a sentence. Requiring the full
          # `Extension/<Tool>/publish/` prefix cannot match that, and was
          # verified to produce a byte-identical list on the current workflows.
          called=$(grep -rhoE '(scripts|Extension/[A-Za-z0-9_]+/publish)/[A-Za-z0-9][A-Za-z0-9._/-]*\.(mjs|node\.js)' .github/workflows | sort -u) || true  # `|| true` is what lets a no-match reach the `::error::` below instead of ending the step — see the `set -euo` line at the top of this body.
          if [ -z "$called" ]; then
            echo "::error::this check found no gate-script call in .github/workflows at all — its own pattern is broken, and it was about to report a clean inventory over an empty set."
            exit 1
          fi
          missing=0
          total=0
          while IFS= read -r s; do
            total=$((total + 1))
            if [ -f "$s" ]; then
              printf 'PRESENT  %s\n' "$s"
            else
              printf 'ABSENT   %s\n' "$s"
              missing=$((missing + 1))
            fi
          done <<< "$called"
          echo
          echo "$((total - missing)) of $total gate script(s) present."
          if [ "$missing" -gt 0 ]; then
            echo "::error::$missing gate script(s) listed above as ABSENT are called by a workflow in this repository and do not exist. Until they land, the jobs that call them fail — that is the intended state, not a misconfiguration. What must never happen is those gates being skipped, because a skipped gate and a passing gate look identical on the checks list."
            exit 1
          fi

      # ── ONE REF PER ACTION, ACROSS EVERY WORKFLOW FILE ─────────────────────
      # 🔴 A PARTIAL BUMP IS INVISIBLE AND SELF-PERPETUATING, AND THIS REPOSITORY
      # HAD ONE FOR MONTHS. 584ba1a ("ci: bump actions/setup-node from 4 to 7
      # (#1)") rewrote eight of the nine setup-node refs in ci.yml and missed the
      # ninth, in the `templates parse` job at the bottom of this file. Measured
      # 2026-08-25 at a564962, before the fix: 13 checkout@v7, 10 setup-node@v7,
      # 1 setup-node@v4, 3 upload-artifact@v7. Nothing was ever going to catch
      # it — Dependabot already considers setup-node current at 7, so it will not
      # open a second PR, and every other signal (a green CI, a clean diff) reads
      # the same whether the tree is uniform or not. The stale ref runs a
      # different Node-provisioning action on one job than on the other nine,
      # which is precisely the kind of difference that shows up as one job
      # behaving oddly and gets blamed on the job.
      #
      # THIS GRADES REF STRINGS, WHICH IS THE RIGHT UNIT HERE AND ONLY HERE.
      # ⚠️ It would report a 40-hex SHA and the tag it points at as a SPLIT,
      # because it cannot resolve either. That is deliberate and it is not an
      # invitation to convert this repo to SHA pins: dependabot.yml's own comment
      # says CI "uses first-party actions only ... referenced by major tag — which
      # is exactly what Dependabot can keep current", so the float is the written
      # policy and SHA-pinning it would silently retire the updater.
      #
      # ⚠️ WHAT THIS INPUT CLASS CANNOT EXPRESS: an action invoked from a file
      # OUTSIDE .github/workflows — a composite action under .github/actions/, or
      # a workflow kept elsewhere. Measured 2026-08-25, `find .github -maxdepth 2
      # -type d` returns .github, .github/ISSUE_TEMPLATE and .github/workflows
      # only, so there is nothing outside the sweep today; the day there is, this
      # step will keep reporting ONE REF over a tree that has two.
      - name: Every action is referenced at ONE ref across all workflows
        shell: bash
        run: |
          set -euo pipefail
          # DERIVED, NOT LISTED — the same rule the gate inventory above follows,
          # and the domain is the literal command rather than a description of it.
          # It is ANCHORED AT THE LINE START so it reads STEPS, not PROSE: a
          # comment that mentions an action ref starts with '#', so it cannot
          # match — and this file discusses action refs at length, the block
          # directly above included. MEASURED 2026-08-25 on the delivered tree:
          # the anchored and the unanchored form of this pattern both return 28
          # matches, so today they agree and the anchoring looks like fussiness.
          # Plant ONE ordinary comment line that quotes a setup-node ref at the
          # older major — the way a correction note in this file naturally would —
          # and the unanchored form climbs to 29 and this step goes RED over a
          # SENTENCE, reporting that action as SPLIT across two refs, while the
          # anchored form stays at 28 and EXIT 0. Both numbers were taken that
          # way rather than asserted. It is the same trap the `shell: bash` count
          # in the selftest job's comments already pays for once: a count that
          # its own explanation moves. ⚠️ WHICH IS WHY NO SUCH LITERAL IS WRITTEN
          # HERE — spelling the example out in full would have made this
          # paragraph the 29th match and falsified its own first sentence.
          all=$(grep -rhoE '^[[:space:]]*-?[[:space:]]*uses:[[:space:]]*[A-Za-z0-9][A-Za-z0-9._-]*/[A-Za-z0-9._/-]+@[A-Za-z0-9._-]+' .github/workflows \
                  | sed -E 's/^.*uses:[[:space:]]*//') || true   # `|| true` so a no-match reaches the required-coverage limb below instead of ending the step under `-e`.
          # REQUIRED COVERAGE. Zero refs is a RED, never a clean pass: a sweep
          # that stops matching and a tree that invokes no action are the same
          # two lines of output, and only one of them is a real state.
          if [ -z "$all" ]; then
            echo "::error::this check found no anchored 'uses: <action>@<ref>' line under .github/workflows at all — its own pattern is broken, and it was about to report a uniform inventory over an empty set."
            exit 1
          fi
          # PRINTED RATHER THAN ASSUMED, the same way the gate inventory prints
          # PRESENT/ABSENT: the counts are the evidence that the sweep saw the
          # tree, and they are what makes a future partial bump legible in the log
          # before it is legible in a diff.
          echo "action refs under .github/workflows, as invoked:"
          printf '%s\n' "$all" | sort | uniq -c | sed 's/^ */  /'
          echo
          split=0
          actions=0
          while IFS= read -r row; do
            [ -n "$row" ] || continue
            n=${row%% *}
            rest=${row#* }
            a=${rest%% *}
            refs=${rest#* }
            actions=$((actions + 1))
            if [ "$n" -eq 1 ]; then
              printf 'ONE REF  %-26s %s\n' "$a" "$refs"
            else
              printf 'SPLIT    %-26s %s\n' "$a" "$refs"
              echo "::error::$a is invoked at $n different refs ($refs) across .github/workflows. A partial bump is how this happens, and the leftover ref is the one nothing will ever revisit — the updater already believes the action is current."
              split=$((split + 1))
            fi
          done <<< "$(printf '%s\n' "$all" | sort -u \
                        | awk -F'@' '{n[$1]++; r[$1]=r[$1] (r[$1]=="" ? "" : " ") $2} END {for (a in n) printf "%d %s %s\n", n[a], a, r[a]}' \
                        | sort -k2,2)"
          echo
          echo "$actions distinct action(s) invoked; $split of them at more than one ref."
          if [ "$split" -gt 0 ]; then
            echo "::error::$split action(s) above are invoked at more than one ref. Pick one ref per action and use it everywhere; do NOT resolve the disagreement by pinning a SHA, because dependabot.yml is configured against major tags."
            exit 1
          fi

  discover:
    name: Discover affected tools
    runs-on: ubuntu-latest
    outputs:
      tools: ${{ steps.set.outputs.tools }}
      count: ${{ steps.set.outputs.count }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with: { node-version: '${{ env.NODE_VERSION }}' }

      # The matrix below is derived, never listed. The failure mode of a derived
      # matrix is the opposite of a hardcoded one: instead of tool #2 silently
      # getting no CI, EVERY tool silently gets no CI when discovery breaks and
      # the array comes back empty.
      #
      # So this is discovery's negative test — and it is a CROSS-CHECK, not a
      # floor. Plain `find` counts the tool.json files; `discover.mjs --all` says
      # how many tools it can see; a DISAGREEMENT fails the build. That catches
      # the broken glob, which is the failure this exists for, without also
      # failing on the one state that is real rather than broken: a repo whose
      # tools have not been onboarded to tool.json yet. discover.mjs documents
      # that state and exits 0 over it, and a guard that contradicts its own gate
      # teaches people to distrust both.
      - name: Cross-check discovery against the filesystem
        shell: bash
        run: |
          set -euo pipefail  # 🔴 FIXED 2026-08-22, same pre-existing hole as the gate-inventory job's `set` line above and the same fix. GitHub runs an explicit `shell: bash` as `bash --noprofile --norc -eo pipefail {0}`, so `-e` IS ALREADY ON when this body starts. This line used to read `set -uo pipefail`, which added `-u` and removed nothing — and under `-e` a command whose failure this step means to REPORT kills the shell first, so the report is dead code on the runner. `-e` is spelled out here so the flag a reader sees is the flag that is running, and every reported command below carries its own `||`. Here the reported command is `discover.mjs --all`: a bare `code=$?` after it was unreachable as anything but 0, so `::error::discover.mjs exited N` never printed. MEASURED 2026-08-22 on this exact body with discover.mjs stubbed to `process.exit(3)`: runner flags EXIT 3, 20 bytes, no `::error::`; bare `bash` EXIT 1, 120 bytes, the diagnosis present.
          # templates/ carries a tool.json too — it is the thing a tool is stamped
          # FROM, not a tool: it does not ship, and it has no id a reporter could
          # name. (_skeleton/ was its location before the move recorded in
          # MIGRATION.md; the exclusion is kept because new-tool.mjs deliberately
          # keeps that path as a fallback.) private/ is gitignored and absent on a runner;
          # it is excluded anyway so this reads the same on the owner's machine.
          # toolinfo.mjs excludes the same directories, which is what makes the
          # two counts comparable at all.
          found=$(find . -mindepth 3 -maxdepth 3 -name tool.json \
                    -not -path './.git/*' -not -path './templates/*' \
                    -not -path './_skeleton/*' -not -path './private/*' \
                    -not -path './node_modules/*')
          n_find=$(printf '%s' "$found" | grep -c . || true)
          echo "tool.json on disk: $n_find"
          [ -n "$found" ] && printf '%s\n' "$found" | sed 's|^\./||'

          out="$RUNNER_TEMP/discover-all.txt"
          : > "$out"
          code=0  # ← initialised, and `|| code=$?` below rather than a bare `code=$?`; see this body's `set -euo` line.
          node scripts/discover.mjs --all --out "$out" || code=$?
          if [ "$code" -ne 0 ]; then
            echo "::error::discover.mjs exited $code — the matrix cannot be trusted, so nothing below it can be either."
            exit 1
          fi
          ids=$(sed -n 's/^tools=//p' "$out" | tail -1)
          if [ -z "$ids" ]; then
            echo "::error::discover.mjs exited 0 but wrote no tools= line to --out. Its output contract changed, and every count derived from it below would be a guess."
            exit 1
          fi
          n_disc=$(node -p 'JSON.parse(process.argv[1]).length' "$ids")
          echo "discover.mjs --all sees: $n_disc  $ids"

          if [ "$n_find" -ne "$n_disc" ]; then
            echo "::error::discovery disagrees with the filesystem — $n_find tool.json file(s) on disk, $n_disc tool(s) seen by discover.mjs. One of the two is wrong, and the expensive version of being wrong is the low one: a tool that gets no CI looks exactly like a tool that passed."
            exit 1
          fi
          if [ "$n_find" -eq 0 ]; then
            echo "::notice::no tool has been onboarded to tool.json yet. That is a real state, not a search failure — the per-tool jobs below have nothing to grade, and say so rather than reporting a green run over an empty set."
          fi

      # Issue forms cannot be generated, so their dropdowns are the one place a
      # new tool has to be added by hand — exactly the kind of step that gets
      # forgotten. Checked here so it fails in the PR that adds the tool.
      - name: Issue templates list every tool id
        shell: bash
        run: |
          set -euo pipefail  # 🔴 FIXED 2026-08-22, same pre-existing hole again. GitHub runs an explicit `shell: bash` as `bash --noprofile --norc -eo pipefail {0}`, so `-e` IS ALREADY ON when this body starts. This line used to read `set -uo pipefail`, which added `-u` and removed nothing — and under `-e` a command whose failure this step means to REPORT kills the shell first, so the report is dead code on the runner. `-e` is spelled out here so the flag a reader sees is the flag that is running, and every reported command below carries its own `||`. Here the reported command is the per-file `node -p` that reads the id: a tool.json that does not PARSE made node exit 1, and the capture then killed the whole loop — no `::error file=`, no dropdown check for any later tool, and no `graded against N tool id(s)` accounting.
          fail=0
          checked=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            id=$(node -p "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).id || ''" "$f") || id=''  # `|| id=''` keeps an unparseable tool.json inside the loop; the message below covers both states because from here they are one state: no usable id.
            if [ -z "$id" ]; then
              echo "::error file=$f::tool.json has no \"id\", or could not be parsed at all — the id is the stable public handle every tag, zip and matrix entry is built from."
              fail=1
              continue
            fi
            checked=$((checked + 1))
            for t in .github/ISSUE_TEMPLATE/bad-page.yml .github/ISSUE_TEMPLATE/bug.yml; do
              if ! grep -qF -- "($id)" "$t"; then
                echo "::error file=$t::tool id '$id' is missing from the extension dropdown — a reporter cannot name this tool"
                fail=1
              fi
            done
          done < <(find . -mindepth 3 -maxdepth 3 -name tool.json \
                     -not -path './.git/*' -not -path './templates/*' \
                     -not -path './_skeleton/*' -not -path './private/*' \
                     -not -path './node_modules/*')
          # Coverage, printed rather than assumed: with no tools this check cannot
          # fail, and an assertion that cannot fail inflates apparent coverage.
          # The cross-check above is what decides whether zero is legitimate.
          echo "issue-template dropdowns graded against $checked tool id(s)."
          exit $fail

      # discover.mjs diffs against the base ref and widens to ALL tools when
      # core/ or scripts/ changed, or when the base is unknown (the first push,
      # where github.event.before is all-zeros).
      - id: set
        name: Build the matrix
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/discover.mjs --base "$BASE_SHA" --out "$GITHUB_OUTPUT"

      - name: Show the matrix
        env:
          TOOLS: ${{ steps.set.outputs.tools }}
          COUNT: ${{ steps.set.outputs.count }}
        run: |
          echo "affected tools ($COUNT): $TOOLS"
          if [ "$COUNT" = "0" ]; then
            echo "::notice::no tool was affected by this change — the per-tool jobs below are skipped on purpose, not by accident."
          fi

  secrets-scan:
    name: Secret scan (full tree)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - run: node scripts/secret-scan.mjs .

  catalogue:
    # The catalogue is a PUBLISHED INTERFACE, not an internal file: the storefront
    # (Nikatru_Storefront_Public - repointed 2026-08-19) fetches catalog/extensions.json over https and byte-
    # compares its vendored copy against it. So the bytes here are somebody else's
    # build input, and a hand-edit is their red build, not our merge conflict.
    name: catalogue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '${{ env.NODE_VERSION }}' }
      # Delete-first. An `up to date` over a file nobody regenerated is the
      # vacuous pass: --check would compare the committed bytes against a
      # generator that was never asked to run.
      - name: Delete the catalogue so the publisher has to produce it
        run: rm -f catalog/extensions.json
      - run: node scripts/publish-catalog.mjs
      - name: The publisher actually wrote it
        run: test -s catalog/extensions.json
      - name: Catalogue must equal a fresh publish from the tool.json files
        run: git diff --exit-code -- catalog/extensions.json
      # Two different questions, and neither implies the other: the lane above
      # asks whether these bytes are what tool.json derives; this one asks whether
      # what they DESCRIBE is sound. `--check` cannot see an empty catalogue and
      # this cannot see a stale one.
      - name: The catalogue describes something real
        run: node scripts/check-catalog.mjs

  core:
    name: core sims
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '${{ env.NODE_VERSION }}' }

      # core/ is vendored into tools, so a regression in it is N outages at
      # once — hence the admission rule that every core module ships a Node sim
      # in core/test/. If core/ does not exist yet this says so and stops; if it
      # exists and ships no sims, that is a FAILURE, not a pass.
      #
      # core.json records this exact hazard in its own `gaps` list: "a CI job
      # that loops over core/test/*.node.js runs zero files and reports success".
      # This step is that sentence encoded. While core/test/ is empty the job is
      # red on purpose, and the fix is sims — not a softer guard.
      - name: Lint + run core sims
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d core ]; then
            echo "::notice::core/ does not exist in this tree — there is no shared runtime to check yet."
            exit 0
          fi
          node scripts/lint.mjs core
          shopt -s nullglob
          sims=(core/test/*.node.js)
          if [ ${#sims[@]} -eq 0 ]; then
            echo "::error::core/ exists but core/test/ holds no sims. Every core module ships with one, because core has N consumers and a regression there is N outages. core.json's own gaps list names this; it is a known gap, not a surprise, and it is red until the sims exist."
            exit 1
          fi
          for f in "${sims[@]}"; do echo "── $f"; node "$f"; done

  gates:
    name: gates · ${{ matrix.tool }}
    needs: discover
    if: needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tool: ${{ fromJSON(needs.discover.outputs.tools) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - name: Syntax check every shipped script
        run: node scripts/lint.mjs ${{ matrix.tool }}
      - name: Privacy / permission / store-limit policy
        run: node scripts/policy-check.mjs ${{ matrix.tool }}
      - name: Vendored core matches core/
        run: node scripts/check-core-sync.mjs ${{ matrix.tool }}
      - name: Version agreement (manifest ↔ CHANGELOG)
        run: node scripts/check-version.mjs ${{ matrix.tool }}
      # ── THE STORE GATE ON THE BUILT PACKAGE, NOT ON THE SOURCE ─────────────
      # policy-check above compares publish/manifest.firefox.json's gecko.id to
      # publish/identity.json and passes — correctly. What nothing asked until
      # 2026-08-20 is what is inside a package that was BUILT. Measured that day:
      # six -firefox.zip in Extension/Full_Screen_Shot/publish/ carry
      # `fullshot@REPLACE-WITH-YOUR-DOMAIN.example` while the source carries
      # `fullshot@nikatru.com`. The placeholder PASSES AMO validation, and
      # Mozilla's docs say a guid "cannot be restored and will forever be
      # unusable for submission" — so the failure is an ACCEPTED upload that
      # permanently misnames the add-on, not a rejected one somebody retries.
      #
      # ⚠️ THIS STEP GRADES ZERO PACKAGES IN CI AND SAYS SO IN ITS OUTPUT.
      # Extension/Full_Screen_Shot/.gitignore ignores `*.zip`, so a runner's
      # checkout contains none. It is here for the run AFTER `package` builds
      # them locally and for the honest zero — the gate prints the count on every
      # run precisely so "0 packages, clean" cannot be misread as "12 clean".
      # Its real enforcement surface is a developer machine; that is stated in
      # the script's header rather than left to be discovered.
      - name: The BUILT store packages carry the right add-on identity
        run: node scripts/check-store-packages.mjs ${{ matrix.tool }}
      # ── THE STORE AXIS ─────────────────────────────────────────────────────
      # 🔴 TWO BUILDS, THREE STORES. `targets` is the build axis and has two
      # entries; the chromium zip ships to Chrome AND Edge byte-identical, as
      # two separate listings with different limits, different assets and
      # different permanent ids. This grades the LISTING side: one directory per
      # store, declared in tool.json, with the store vocabulary derived from
      # scripts/schema/tool.schema.json so it cannot drift into a fourth list.
      #
      # It also holds the `target` field, which is what makes the shared
      # chromium build a DECLARATION rather than a coincidence — three store
      # rows cannot become three builds without `targets` gaining a third entry
      # in the open.
      #
      # Nothing is `served` yet, so a missing listing directory PRINTS. What is
      # owner-gated is CREATING a listing, not KEEPING one: an emptied field
      # fails at any served state.
      - name: One listing per store, and the store axis has not drifted
        run: node scripts/check-store-metadata.mjs ${{ matrix.tool }}
      # ── THE TOOL'S OWN AMO SUBMISSION GATE ─────────────────────────────────
      # 🔴 UNTIL 2026-08-20 THIS RAN IN NO WORKFLOW AT ALL. It is the most
      # detailed AMO gate in the repository — gecko id, the data-collection
      # declaration, the Firefox background fallback, Chrome-only keys, manifest
      # drift, and the packaged zip — and it was reachable only by a human who
      # remembered to type it. It was also, by then, grading the WRONG DOCUMENT:
      # publish/manifest.firefox.json became an RFC 7386 merge patch on
      # 2026-08-18 and the script still read it as a whole manifest, producing
      # 22 failures of which 19 were the misreading. Both are fixed; this is the
      # wiring half.
      #
      # ⚠️ NAMED EXPLICITLY, NOT DISCOVERED. The path is a literal so the
      # `gate-inventory` job above can see it — that job derives its set from
      # the workflow text, and a gate it cannot see is a gate that can vanish
      # without anything failing. The `if:` is per-tool because this gate is
      # tool-local by design: templates/tool ships a copy to every new tool, so
      # a second tool adds a second line here rather than inheriting this one.
      # Only tools with a `targets.firefox` need it at all.
      - name: The tool's own AMO submission gate (FullShot)
        if: matrix.tool == 'fullshot'
        run: node Extension/Full_Screen_Shot/publish/verify-firefox-package.node.js

  sims:
    name: sims · ${{ matrix.tool }} · node ${{ matrix.node }}
    needs: [discover, gates]
    if: needs.discover.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix:
        tool: ${{ fromJSON(needs.discover.outputs.tools) }}
        node: ['22', '24']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '${{ matrix.node }}' }

      # Runs exactly the commands in tool.json "tests". No npm install, ever —
      # the sims load the real shipped source on bare Node.
      - name: Run tool sims
        run: node scripts/run-tests.mjs ${{ matrix.tool }}

      - name: Upload pixel-sim output on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pixels-${{ matrix.tool }}-node${{ matrix.node }}
          path: |
            **/test/pixel-sim/out/**
          retention-days: 7
          if-no-files-found: ignore

  package:
    name: package · ${{ matrix.tool }} · ${{ matrix.target }} · ${{ matrix.os }}
    needs: [discover, sims]
    if: needs.discover.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix:
        tool: ${{ fromJSON(needs.discover.outputs.tools) }}
        target: [chromium, firefox]
        os: [ubuntu-latest, windows-latest]   # windows leg catches path/CRLF/casing bugs
    runs-on: ${{ matrix.os }}
    # The two targets are fixed here rather than read from tool.json, which is
    # the one place in this workflow where the coupling surface is not tool.json.
    # It is honest about the cost: a tool that cannot build a firefox package
    # FAILS this leg rather than skipping it — and if it ever does fail, that is
    # a finding, not a known state. The right fix would be the overlay, never a
    # matrix that quietly stops building Firefox.
    #
    # ⚠️ CORRECTED 2026-08-22, NOT DELETED — the sentence that stood here from
    # before the conversion read: "Worth knowing today — FullShot's tool.json
    # declares targets.firefox.overlay = null, because publish/
    # manifest.firefox.json is still a full second manifest rather than the RFC
    # 7386 merge patch pack.mjs expects. Until that conversion lands, the firefox
    # leg is red for a reason the tree already declares." Both halves measured
    # FALSE on 2026-08-22: tool.json declares `"firefox": { "overlay":
    # "publish/manifest.firefox.json" }`, and `node scripts/pack.mjs fullshot
    # --target firefox --out <dir> --release` EXITS 0, printing that the overlay
    # was applied as a merge patch with gecko.id fullshot@nikatru.com and 85
    # entries. The conversion landed 2026-08-18 and is recorded ABOVE in this
    # same file, in the `gates` job's AMO block — the paragraph beginning
    # `publish/manifest.firefox.json became an RFC 7386 merge patch on` — so the
    # file disagreed with itself, and the stale half was the one telling the next
    # reader that a green leg is expected-red. That is precisely how a real red
    # gets waved through.
    # ⚠️ CORRECTED 2026-08-22, SAME DAY — the sentence above said "recorded thirty
    # lines ABOVE, in this same file, by the `gates` job". MEASURED 2026-08-22 on
    # the delivered file: that record sat at ci.yml:369 and this comment at :442,
    # so 73 lines, not thirty. A distance in lines is exactly the kind of number
    # nothing recomputes, so it is replaced by a SENTENCE a reader can search for
    # rather than by a corrected count that the next insert would rot again.
    # ⬜ AND THE POINTER IS ITSELF A HIT, WHICH IS WORTH SAYING OUT LOUD BECAUSE
    # IT IS THE SAME TRAP ONE STEP DOWN. MEASURED 2026-08-22 after this paragraph
    # was written: grepping the quoted sentence above returns 2 hits — the record
    # and this reference to it — and `grep -c 2026-08-18` returns 3 rather than
    # the 1 it returned before. Quoting a target is what makes an anchor
    # searchable AND what makes it non-unique; the reader wants the FIRST hit, in
    # the `gates` job. That is still strictly better than a line count, which
    # drifts silently instead of announcing itself in the count.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '${{ env.NODE_VERSION }}' }

      - name: Build package
        run: node scripts/pack.mjs ${{ matrix.tool }} --target ${{ matrix.target }} --out dist

      # THE gate. Every manifest / HTML / importScripts / executeScript
      # reference must resolve, case-exactly, to an entry INSIDE the zip. This
      # is the check that caught a missing background.js before it shipped — an
      # extension that could not have loaded at all.
      - name: Reference integrity (inside the zip)
        run: node scripts/verify-refs.mjs --zip dist/${{ matrix.tool }}-${{ matrix.target }}.zip --strict

      - name: Leak check (no test/, docs, node_modules, zips, secrets)
        run: node scripts/verify-refs.mjs --zip dist/${{ matrix.tool }}-${{ matrix.target }}.zip --leaks

      # A reproducible zip is what turns "no network calls" from a claim into
      # something a reviewer can verify: rebuild from the tag, compare hashes.
      - name: Determinism check (zip is byte-reproducible)
        shell: bash
        run: |
          set -euo pipefail
          node scripts/pack.mjs ${{ matrix.tool }} --target ${{ matrix.target }} --out dist2
          a=$(node scripts/sha256.mjs dist/${{ matrix.tool }}-${{ matrix.target }}.zip)
          b=$(node scripts/sha256.mjs dist2/${{ matrix.tool }}-${{ matrix.target }}.zip)
          echo "$a"; echo "$b"
          [ "$a" = "$b" ] || { echo "::error::zip is not reproducible"; exit 1; }

      # ── THE STORE-IDENTITY GATE, ON THE ZIP THIS JOB JUST BUILT ────────────
      # 🔴 THIS IS THE ONE PLACE IN CI WHERE THE SUBJECT REALLY EXISTS. Store
      # packages are gitignored, so the same guard in the `gates` job grades zero
      # of them and says so; here `dist/` holds a package that was built four
      # steps ago, so the check is about bytes rather than about a source file
      # that describes them.
      #
      # It reads gecko.id out of the BUILT manifest and refuses the placeholder
      # and any id that disagrees with publish/identity.json. pack.mjs already
      # refuses to WRITE such a package (:478); this refuses to have written one,
      # which is the half that survives somebody running a different packer —
      # and publish/package.node.js, the tool-local packer, is exactly that, and
      # is what produced the six stale zips this guard was written for.
      #
      # It runs on BOTH targets on purpose: the chromium leg asserts the package
      # carries no Firefox-only key, and the same bytes go to Chrome AND Edge.
      - name: The built package carries the right store identity
        run: node scripts/check-store-packages.mjs ${{ matrix.tool }} --dir dist

      # ── THE AMO GATE AGAIN, THIS TIME WITH A PACKAGE UNDER IT ──────────────
      # The `gates` job runs this same script BARE, and measured 2026-08-22 that
      # run EXITS 0 printing `SOURCE PASSES — NO PACKAGE WAS GRADED`: zips are
      # gitignored, so on a fresh checkout its package limb opens nothing. Here
      # dist/ holds a Firefox zip built five steps ago, and pointing the gate at
      # it adds seven assertions the source limb cannot make — reads as a zip,
      # contains manifest.json, packaged manifest === the merged Firefox
      # manifest, contains background.js, packaged background.js guards
      # importScripts, no test/dev/scratch files.
      #
      # ⚠️ THIS IS THE PR-TIME TWIN OF release.yml's step, AND THAT PAIRING IS
      # THE POINT. The script exits 0 with no package, so both steps have to
      # assert `ALL PASS` rather than trust the exit code. A tripwire that runs
      # only when a tag fires has never been observed to work at the moment it
      # first matters, and a tag cannot be re-run — so the same logic runs on
      # every PR here, where being wrong is free.
      - name: The tool's own AMO submission gate, on the built zip (FullShot)
        if: matrix.tool == 'fullshot' && matrix.target == 'firefox' && matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          # 🔴 `-euo`, NOT `-uo`. GitHub runs an explicit `shell: bash` as
          # `bash --noprofile --norc -eo pipefail {0}`, so `-e` is ALREADY ON
          # when this body starts and `set -uo pipefail` only added `-u`. Under
          # `-e` the capture below aborted the shell the instant the gate
          # failed, so `code` was unreachable as anything but 0 and the
          # `printf '%s\n' "$out"` that shows WHY never ran. Measured 2026-08-22
          # on this exact body against a corrupt dist/fullshot-firefox.zip:
          # `bash --noprofile --norc -eo pipefail <body>` exited 1 having
          # printed 0 bytes, while a bare `bash <body>` printed 3976. A step
          # that fails silently is a check whose diagnostics do not exist. `-e`
          # is now written where a reader sees it, and the one command whose
          # exit code this step REPORTS carries `|| code=$?`. Re-measured after
          # the fix, same corrupt zip, RUNNER flags: EXIT 1 and 3976 bytes — the
          # log the bare shell used to be needed for. Against the real zip the
          # same body is EXIT 0 and 4242 bytes ending `ALL PASS`, so the step
          # still discriminates rather than having been turned green.
          set -euo pipefail
          zip="dist/${{ matrix.tool }}-${{ matrix.target }}.zip"
          if [ ! -f "$zip" ]; then
            echo "::error::$zip does not exist, though the pack step above reported success — so this gate would have graded the source tree and exited 0 while inspecting no package at all."
            exit 1
          fi
          code=0
          out=$(node Extension/Full_Screen_Shot/publish/verify-firefox-package.node.js --zip "$zip" 2>&1) || code=$?
          printf '%s\n' "$out"
          if [ "$code" -ne 0 ]; then exit "$code"; fi
          if ! printf '%s\n' "$out" | grep -q '^ALL PASS$'; then
            echo "::error::the AMO gate exited 0 but never printed ALL PASS. Its only other exit-0 path is 'SOURCE PASSES — NO PACKAGE WAS GRADED', i.e. it graded the source tree and opened no zip. An empty subject must not print the same verdict as a verified one."
            exit 1
          fi

      - name: web-ext lint (Firefox only)
        if: matrix.target == 'firefox' && matrix.os == 'ubuntu-latest'
        run: npx --yes web-ext@8 lint --source-dir dist/unpacked-firefox --warnings-as-errors

      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          name: ${{ matrix.tool }}-${{ matrix.target }}
          path: dist/*.zip
          retention-days: 14
          if-no-files-found: error

  # Appended here rather than beside gate-inventory, where it belongs by
  # meaning, for one reason: inserting a job above shifts every `ci.yml:NNN`
  # citation below it, and this repository cites this file by line in prose that
  # nothing recomputes. Job order has no effect on execution.
  selftest:
    name: Gate self-test (do the gates bite?)
    runs-on: ubuntu-latest
    # Like gate-inventory, deliberately NOT a `needs:` of anything, and not a
    # step inside `gates`: this grades the GATES, not a tool. It has to run on a
    # push that touches no tool at all — a scripts/-only change is exactly the
    # push where a gate is most likely to have quietly stopped checking, and it
    # is also the push where `gates` is skipped for having nothing to grade.
    #
    # It is one of the calls in these workflows that is NOT
    # `node scripts/<name>.mjs`, which is why the inventory pattern above spells
    # the extension out: a gate the inventory cannot see is a gate nobody
    # notices the absence of.
    #
    # ⚠️ CORRECTED 2026-08-22 — this line used to say "the ONE call", and that
    # stopped being true on 2026-08-20, when the AMO gate in the `gates` job
    # became the first `node Extension/<Tool>/publish/...` call. It is now one of
    # three such calls (that one, and the two `--zip` runs in `package` here and
    # in release.yml). The claim was never load-bearing, which is exactly why it
    # went stale unnoticed while the sentence it explains stayed correct.
    #
    # The SAME correction was made to this file's header on the same day, and it
    # is recorded here rather than there for a mechanical reason worth knowing:
    # core/CHANGELOG.md, core/README.md, core/core.json, scripts/pack.mjs,
    # scripts/run-tests.mjs and scripts/sha256.mjs cite this file by line number
    # (23 citations, all at ci.yml:254-364), so ANY line added near the top
    # invalidates every one of them. The header was therefore rewritten in place
    # at exactly its old line count; what it used to say, in full, was: "Every
    # gate here is a `node scripts/<name>.mjs` call and nothing else, so the
    # identical command runs on a runner and in PowerShell on the owner's
    # machine. That is the whole design: CI is a scheduler, the scripts are the
    # gates." Measured 2026-08-22, "and nothing else" was false three times over.
    # ⬜ Those 23 citations are ALREADY stale — pack.mjs:16 cites ci.yml:364 for
    # the web-ext lint step, which is nowhere near :364 — but they live in files
    # this change does not own, and correcting them is a separate pass.
    #
    # ✅ THAT SEPARATE PASS RAN ON 2026-08-22, AND THE CONSTRAINT ABOVE IS NOW
    # LIFTED. Every `ci.yml:NNN` and `release.yml:NNN` pointer in those six files
    # was replaced with a searchable anchor — a `- name:` step title, or the
    # distinctive line of the body being described. Measured after that pass:
    # `grep -rnoIE "(ci|release)\.yml:[0-9]+" --exclude-dir=.git .` returns hits
    # only inside CORRECTION RECORDS that quote what the old pointer used to say,
    # in scripts/pack.mjs, core/CHANGELOG.md and this file. Not one live citation
    # into either workflow is addressed by line any more, so ADDING LINES NEAR
    # THE TOP OF THIS FILE NO LONGER INVALIDATES ANYTHING, and the header above
    # was rewritten longer rather than squeezed to its old line count. One of the
    # eight was stale in substance as well as position — pack.mjs described a
    # `release.yml` invocation of `pack.mjs --target chromium --release` with no
    # `--out`, which release.yml does not make; that form survives only inside
    # the release-notes text as a reproduce-it-yourself command. A pointer nobody
    # can follow hides a claim nobody can check.
    #
    # ⚠️ CORRECTED 2026-08-22, NOT DELETED — the two lines above read: "Those 23
    # citations are ALREADY stale by roughly ninety lines — pack.mjs cites
    # ci.yml:364 for the web-ext lint step, which now sits at :495". BOTH numbers
    # were false on the day they were typed, inside the paragraph whose whole
    # subject is line-number rot. The one anchor that cannot rot is HEAD, so use
    # it: `git show HEAD:.github/workflows/ci.yml | grep -n 'web-ext@8 lint'` →
    # 485, MEASURED 2026-08-22. The citation says :364. So it was already 121
    # lines short AT HEAD, before this round added a line — and every working-tree
    # number quoted for it since has been larger and shorter-lived than that.
    # No current-file number is written here on purpose: `grep -n 'web-ext@8
    # lint' .github/workflows/ci.yml` answers for whatever day it is run on, and
    # a number in prose is the thing nothing recomputes. Which is the same lesson
    # as the block above, arriving one paragraph later than it should.
    #
    # ⚠️ CORRECTED 2026-08-22 (second pass) — THE HEADER WAS REWRITTEN AGAIN, AND
    # THE VERSION THIS NOTE DESCRIBES ABOVE IS ITSELF SUPERSEDED. What it said,
    # in full, was: "Every gate here is one command — `node scripts/<name>.mjs`,
    # or a tool's own `node Extension/<Tool>/publish/<name>.node.js` — so the
    # identical command runs on a runner and in PowerShell on the owner's
    # machine. CI is only a scheduler." That corrected a stale claim into a fresh
    # one: MEASURED 2026-08-22, `grep -c 'shell: bash' .github/workflows/ci.yml`
    # is 7 — ⚠️ AND IT IS 16 TODAY, for exactly the reason the ⬜ paragraph two
    # blocks down predicted: the unanchored form counts this file's own prose,
    # and the prose about it has since grown. Read that paragraph before
    # believing this number; the anchored form is the one that means anything.
    # Those seven are multi-line inline blocks that no PowerShell runs
    # and that no `node scripts/<name>.mjs` describes — plus one more `run: |`
    # with no `shell:` at all. Correcting a stale sentence into an inaccurate one
    # is worse than leaving it, because the correction buys it another year of
    # trust. The header now states the rule AND that it has exceptions, and names
    # the grep that lists them rather than line numbers that rot. It was again
    # rewritten at exactly its old line count, for the reason two paragraphs up.
    # Collapsing those seven blocks into scripts/ is the real fix and is open.
    #
    # ⬜ THE GREP IN THE HEADER IS ANCHORED — `grep -cE "^        shell: bash$"`,
    # not `grep -c 'shell: bash'` — AND THAT IS NOT FUSSINESS. The unanchored form
    # was written into the header first, and it counts this file's PROSE as well
    # as its steps: measured 2026-08-22, it returned 7 before this correction was
    # written and more than that afterwards, because the correction itself says
    # `shell: bash` several times over. The anchored form returns 7 either way,
    # and did again on 2026-08-22 after the header rewrite two paragraphs of
    # prose later — while the unanchored form had by then climbed to 16. A
    # count that its own explanation moves is this round's lesson in miniature,
    # and it was caught only because every number here was re-taken after the
    # last edit instead of at the moment it was first written.
    #
    # The suite mutates a throwaway tree under os.tmpdir() and points each gate
    # at it with --repo-root, so it writes nothing into the checkout.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - name: Every gate must be proven to fail on a real mutation
        run: node scripts/test/selftest.node.js

  # Appended for the same reason `selftest` above is appended, and stated again
  # so the next person does not "tidy" it upward: inserting a job higher in this
  # file shifts every `ci.yml:NNN` citation below it, and this repository cites
  # this file by line in prose that nothing recomputes. Job order has no effect
  # on execution.
  templates:
    name: templates parse (the tree every future tool is stamped from)
    runs-on: ubuntu-latest
    # Deliberately NOT a `needs:` of anything, and deliberately outside the
    # per-tool matrix: templates/ is not a tool. It is the thing a tool is
    # stamped FROM, it ships nothing, and it has no id — which is exactly why
    # nothing was reading it.
    #
    # 🔴 EVERY SCRIPT IN HERE RAN IN NO WORKFLOW AND WAS PARSED BY NO GATE, and
    # the exclusion was FOURFOLD — every layer of it correct on its own terms,
    # and the four together adding up to nobody looking:
    #   · scripts/discover.mjs lists `templates/` among its excluded prefixes,
    #     so the CI matrix never names it;
    #   · both `find` sweeps in this file — the discovery cross-check and the
    #     issue-template check — pass `-not -path './templates/*'`;
    #   · e2e.yml puts `templates` in its SKIP list;
    #   · scripts/test/selftest.node.js only WRITES a synthetic templates/tool
    #     into os.tmpdir() to test new-tool.mjs's precedence rule. It never
    #     executes, or reads, the real files.
    #
    # ⚠️ THIS IS A FLOOR, NOT A FIX, AND SAYING SO IS THE POINT. Measured
    # 2026-08-22 by hand before this job existed: checked=20 failed=0 — every
    # file parses today. What is being closed is a COVERAGE gap, not an outage,
    # and the day it goes red is the day it has earned its place. It matters
    # because new-tool.mjs stamps this tree into every future tool: a break here
    # is invisible until tool #2 fails on its first day, and is then attributed
    # to the new tool rather than to the skeleton.
    #
    # ⚠️ `new-tool.mjs` IS WRITTEN WITHOUT ITS `scripts/` PREFIX HERE AND BELOW,
    # ON PURPOSE — the same convention the discovery cross-check above already
    # follows. The `gate-inventory` job derives its set by grepping this file's
    # TEXT, so a prose mention of `scripts/<name>.mjs` enters the inventory as
    # though a workflow called it. Measured 2026-08-22: writing it with the
    # prefix took the inventory from 17 entries to 18, adding a script no
    # workflow invokes. It is PRESENT today, so nothing goes red — but the day
    # that file is renamed the build would fail over a comment, which is exactly
    # the failure the inventory's own header says it was kept narrow to avoid.
    #
    # ⚠️ NOT `node scripts/lint.mjs templates`, WHICH WAS TRIED FIRST: measured
    # 2026-08-22, that EXITS 2 with 'CANNOT RUN — no tool named "templates"'.
    # lint.mjs takes a tool id, a Category/Tool_Dir, "core", "scripts", or
    # nothing at all, and templates/ is none of those. Teaching lint.mjs a
    # `templates` target is the better long-term home for this check — it would
    # inherit the REQUIRED_COVERAGE machinery instead of restating it — but that
    # is an edit to scripts/lint.mjs, and until it lands an unparsed skeleton is
    # a worse outcome than an inline loop.
    steps:
      - uses: actions/checkout@v7
      # ⚠️ THIS LINE READ `@v4` UNTIL 2026-08-25, AND IT WAS THE LAST ONE THAT
      # DID. 584ba1a ("ci: bump actions/setup-node from 4 to 7 (#1)") converted
      # eight of the nine refs in this file and left this one behind. Measured
      # 2026-08-25: `git show 584ba1a^:.github/workflows/ci.yml | grep -oE
      # 'setup-node@v[0-9]+' | sort | uniq -c` -> 9 v4; the same command at
      # 584ba1a -> 1 v4 and 8 v7; and it was still 1 v4 / 8 v7 at a564962.
      # The straggler was SELF-PERPETUATING: Dependabot already considers
      # setup-node current at 7, so it will never open a second PR to finish the
      # job, and nothing else was looking. What is looking now is the
      # "Every action is referenced at ONE ref" step in the `gate-inventory` job
      # at the top of this file — the durable half, because fixing one ref
      # without it just resets the clock until the next partial bump.
      - uses: actions/setup-node@v7
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - name: Every script under templates/ must parse
        shell: bash
        run: |
          # 🔴 `-e` IS ALREADY ON BEFORE THIS LINE, AND THAT ONCE MADE THIS WHOLE
          # LOOP POINTLESS. GitHub runs a `run:` step as `bash --noprofile --norc -eo
          # pipefail {0}`, so writing `set -uo pipefail` added `-u` and removed nothing.
          # Under `-e` the `out=$(node --check ...)` capture below killed the shell on
          # the FIRST unparseable file: no `PARSE` line, no node error, no accounting,
          # no `::error::` — the step went red having printed only the OK lines before
          # it. Measured 2026-08-22 on this exact body, two syntax errors planted in a
          # scratch copy of templates/: under the runner's flags the output stops dead
          # one file before the first break — no PARSE block, no accounting, no
          # `::error::`; under a bare `bash` BOTH PARSE blocks print and the step
          # reports `18 of 20 file(s) under templates/ parse.` Those two structural
          # facts are the measurement and they re-derive on any rebuild of the fixture.
          # ⚠️ AMENDED 2026-08-22, later pass: this sentence used to pin the two
          # outputs at 241 and 1825 bytes. The second does not reproduce — an
          # independent rebuild of the same fixture measured 1916 — because the
          # difference is node's per-file error text, which carries the scratch path
          # and moves with the node version. The fixture was never recorded, so
          # neither figure is re-derivable by a reader and both are gone. Plant two
          # syntax errors of your own and compare the two shells; the shape is the
          # finding, not the byte count. Enumerating EVERY broken file
          # in one run is the only reason this is a loop rather than one lint call, so
          # the flag was the whole feature. `-e` is now spelled out where a reader can
          # see it, and every command whose failure this step REPORTS carries its own
          # `||` so the report survives the failure.
          set -euo pipefail
          # DERIVED, NOT LISTED — the same rule the gate inventory at the top of
          # this file follows. A hand-typed list of paths only ever covers the
          # files somebody remembered to add, and the next script added is
          # precisely the one that gets stamped into a tool having never been
          # parsed. The domain is stated in one place, here, and printed below.
          # `|| true` because a MISSING templates/ makes find exit 1, and under `-e`
          # that killed the step before the required-coverage limb below could name
          # the reason. An empty sweep and a vanished directory must both reach it.
          files=$(find templates -type f \
                    \( -name '*.mjs' -o -name '*.cjs' -o -name '*.js' \) \
                    -not -path '*/node_modules/*' | sort) || true
          # REQUIRED COVERAGE. An empty sweep is the failure this whole family
          # keeps paying for: a `find` that stops matching prints nothing and a
          # loop over nothing exits 0, so "20 files parsed" and "the directory
          # was renamed" look identical on the checks list. Zero is a RED here.
          if [ -z "$files" ]; then
            echo "::error::found no .js/.mjs/.cjs under templates/ at all. Either the skeleton moved and this job is now grading an empty set, or its own find expression is broken — and both of those report as a clean pass unless something like this line stops them."
            exit 1
          fi
          failed=0
          checked=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            checked=$((checked + 1))
            # 🔴 The exit code is captured on its own line, never interpolated
            # beside a command substitution: `printf "%s EXIT %s" "$(basename
            # "$f")" "$?"` runs the substitution FIRST, so $? is basename's
            # status and reads 0 over every failure.
            # ⚠️ THAT IS ONE TRAP; THE FLAGS ARE A SECOND, AND THIS LINE HAD IT.
            # Same family — a failing thing reporting success — one level over:
            # there the trap is EXPANSION ORDER, here it is `-e`, which aborts
            # the shell on a failing substitution in an assignment. Without the
            # `|| code=$?`, `code` was only ever reachable as 0 on the runner
            # and the `else` limb below could not be taken.
            code=0
            out=$(node --check "$f" 2>&1) || code=$?
            if [ "$code" -eq 0 ]; then
              printf 'OK    %s\n' "$f"
            else
              printf 'PARSE %s\n' "$f"
              printf '%s\n' "$out"
              failed=$((failed + 1))
            fi
          done <<< "$files"
          echo
          echo "$((checked - failed)) of $checked file(s) under templates/ parse."
          if [ "$failed" -gt 0 ]; then
            echo "::error::$failed file(s) above do not parse. new-tool.mjs copies this tree into every new tool, so a syntax error here is not one broken file — it is one broken file per tool created from today onward, discovered by whoever creates the next one."
            exit 1
          fi

  # ═════════════════════════════════════════════════════════════════════════
  # THE ONE CHECK NAME BRANCH PROTECTION CAN REQUIRE.
  #
  # 🔴 THE NAME IS THE DELIVERABLE, AND IT IS `ci-required`. A required status
  # check is configured by its STRING. Three of the jobs above name themselves
  # from the matrix — `gates · <tool>`, `sims · <tool> · node <n>`,
  # `package · <tool> · <target> · <os>` — so their check names are a function
  # of what discovery selected on that push, and there is no stable string to
  # type into a protection rule for them. Measured 2026-08-25 at a564962:
  # `grep -cE '^    name:.*matrix\.' .github/workflows/ci.yml` -> 3, and
  # `grep -rn 'required check|required status|branch protection' --include=*.md
  # --include=*.yml .` -> no matches, i.e. nothing in the repository has ever
  # written down what to require. This job is the answer: one job, one fixed
  # name, and it waits on all of them.
  #
  # 🔴 AND HERE IS THE TRAP IT EXISTS TO AVOID, WHICH IS ALSO THE OBVIOUS WAY TO
  # WRITE IT. The three matrix jobs carry `if: needs.discover.outputs.count !=
  # '0'`, so on a push that touches no tool they SKIP — and GitHub counts a
  # SKIPPED required check as SATISFIED. The zero path is reachable and exits 0:
  # measured 2026-08-25, `node scripts/discover.mjs --base HEAD --out <file>`
  # prints "selected: NONE (0 file(s) changed and none of them are inside a tool
  # directory ...)", exits 0, and writes `tools=[]` / `count=0`. So requiring
  # those names directly would be a rule that is satisfied by nothing running.
  # The aggregator would recreate that defect EXACTLY if it were written as
  # `result == 'success' || result == 'skipped'`, because 'skipped' is not one
  # outcome: it is "nothing to do" and "an upstream job died and took me with
  # it" wearing the same word. 'skipped' is therefore LICENSED here — allowed
  # only when discover itself SUCCEEDED and reported count == '0' — and RED in
  # every other circumstance. 'failure' and 'cancelled' are always RED, and an
  # outcome nobody enumerated is RED rather than ignored.
  #
  # ⚠️ NOT A BEHAVIOUR CHANGE TO THE ZERO PATH. The `Show the matrix` step in
  # `discover` prints "::notice::no tool was affected by this change — the
  # per-tool jobs below are skipped on purpose, not by accident", and that stays
  # a notice. Turning a zero matrix into a build failure is an owner decision,
  # not a side effect of adding a required check; this job agrees with that
  # notice rather than overriding it.
  #
  # ⚠️ WHAT THIS CANNOT EXPRESS: jobs in the OTHER workflow files. e2e.yml and
  # release.yml publish their own check names and are not aggregated here — this
  # job's structural check below reads THIS file only, and says so in its own
  # output rather than leaving the reader to assume repo-wide coverage.
  ci-required:
    name: ci-required
    needs: [gate-inventory, discover, secrets-scan, catalogue, core, gates, sims, package, selftest, templates]
    if: always()
    runs-on: ubuntu-latest
    env:
      # Read into the environment rather than into the shell body, so the body
      # below is a plain bash program: the SAME function grades the built-in
      # cases and this run's real outcomes. A rule that is only ever executed by
      # GitHub's expression engine cannot be exercised before it is relied on.
      DISCOVER_COUNT: ${{ needs.discover.outputs.count }}
      R_GATE_INVENTORY: ${{ needs.gate-inventory.result }}
      R_DISCOVER: ${{ needs.discover.result }}
      R_SECRETS_SCAN: ${{ needs.secrets-scan.result }}
      R_CATALOGUE: ${{ needs.catalogue.result }}
      R_CORE: ${{ needs.core.result }}
      R_GATES: ${{ needs.gates.result }}
      R_SIMS: ${{ needs.sims.result }}
      R_PACKAGE: ${{ needs.package.result }}
      R_SELFTEST: ${{ needs.selftest.result }}
      R_TEMPLATES: ${{ needs.templates.result }}
    steps:
      - uses: actions/checkout@v7
      - name: Every job in this workflow is accounted for, and every outcome is graded
        shell: bash
        run: |
          set -euo pipefail

          # ── THE RULE, ONCE ──────────────────────────────────────────────────
          # verdict <count> <discover-result> <job=result>...
          # One line per job on stdout; returns 0 for GREEN, 1 for RED.
          verdict() {
            local count="$1"; shift
            local dres="$1"; shift
            local rc=0 pair job res
            for pair in "$@"; do
              job=${pair%%=*}
              res=${pair#*=}
              case "$res" in
                success)
                  printf '  ok   %-14s %s\n' "$job" "$res"
                  ;;
                skipped)
                  # 🔴 THE WHOLE POINT OF THIS JOB IS THIS BRANCH. `skipped` is
                  # NOT a synonym for success; it is licensed only by the one
                  # input that makes "nothing ran" the correct outcome.
                  if [ "$dres" = 'success' ] && [ "$count" = '0' ]; then
                    printf '  ok   %-14s %s  (licensed: discover succeeded and selected 0 tools)\n' "$job" "$res"
                  else
                    printf '  RED  %-14s %s  (UNLICENSED: discover=%s count=%s)\n' "$job" "$res" "$dres" "${count:-<empty>}"
                    rc=1
                  fi
                  ;;
                failure|cancelled)
                  printf '  RED  %-14s %s\n' "$job" "$res"
                  rc=1
                  ;;
                *)
                  printf '  RED  %-14s %s  (outcome is not in the allowed set)\n' "$job" "$res"
                  rc=1
                  ;;
              esac
            done
            return "$rc"
          }

          # ── WHO IS GRADED, DERIVED FROM THE PAIRS BELOW, NOT FROM PROSE ─────
          pairs=(
            "gate-inventory=$R_GATE_INVENTORY"
            "discover=$R_DISCOVER"
            "secrets-scan=$R_SECRETS_SCAN"
            "catalogue=$R_CATALOGUE"
            "core=$R_CORE"
            "gates=$R_GATES"
            "sims=$R_SIMS"
            "package=$R_PACKAGE"
            "selftest=$R_SELFTEST"
            "templates=$R_TEMPLATES"
          )

          # ── STRUCTURAL: NO JOB MAY ESCAPE THIS AGGREGATOR ───────────────────
          # An aggregated required check is only as good as its `needs:` list,
          # and that list is hand-written — so the next job added to this file
          # would be outside the required check while looking exactly like part
          # of it. This reads the job ids back out of the file and refuses a
          # disagreement. The domain is this file only; e2e.yml and release.yml
          # are separate check names, stated here and in the output below rather
          # than left to be assumed.
          declared=$(awk '/^jobs:/{f=1;next} f && /^  [A-Za-z0-9_-]+:/{sub(/:.*/,"",$1); print $1}' .github/workflows/ci.yml \
                       | grep -v '^ci-required$' | sort) || true
          required=$(printf '%s\n' "${pairs[@]}" | sed 's/=.*//' | sort)
          if [ -z "$declared" ]; then
            echo "::error::found no job ids in .github/workflows/ci.yml at all — this step's own awk is broken, and it was about to certify that every job is aggregated over an empty set."
            exit 1
          fi
          if [ "$declared" != "$required" ]; then
            echo "jobs declared in ci.yml (excluding ci-required itself):"
            printf '%s\n' "$declared" | sed 's/^/  /'
            echo "jobs this aggregator waits on:"
            printf '%s\n' "$required" | sed 's/^/  /'
            echo "::error::the two lists above disagree. A job outside this aggregator's needs list is a job branch protection does not require — it shows on the checks page and blocks nothing. Add it to needs: and to the pairs list in this step."
            exit 1
          fi
          echo "$(printf '%s\n' "$required" | grep -c .) job(s) declared in ci.yml, and this aggregator waits on every one of them (e2e.yml and release.yml are separate check names and are NOT aggregated here)."
          echo

          # ── THE RULE IS EXERCISED BEFORE IT IS TRUSTED ──────────────────────
          # 🔴 THESE CASES ARE THE REDDENABILITY HARNESS, AND THEY RUN ON EVERY
          # PUSH. Cases 2 and 3 are the same job outcomes under different
          # discovery inputs and they must disagree; a fixture that only ever
          # supplied count=='1' could not express the skip case at all, and the
          # defect this job exists to prevent lives exactly there.
          # MEASURED 2026-08-25, by mutating the rule above and re-running these
          # same cases: licensing 'skipped' unconditionally (the `success ||
          # skipped` defect) flips cases 3 and 6 to GREEN — NOT 7, which stays
          # RED because discover's own 'failure' reds it independently of the
          # skip rule — and adding 'failure' to the success arm flips 4 and 8.
          # Two cases per mutation, and the step exits 1 rather than grading the
          # run, which is what makes this harness a pin and not a decoration.
          ALL_OK='gate-inventory=success discover=success secrets-scan=success catalogue=success core=success gates=success sims=success package=success selftest=success templates=success'
          ZERO_MATRIX="${ALL_OK/gates=success/gates=skipped}"
          ZERO_MATRIX="${ZERO_MATRIX/sims=success/sims=skipped}"
          ZERO_MATRIX="${ZERO_MATRIX/package=success/package=skipped}"
          cases=0
          bad=0
          expect() {
            local want="$1" label="$2" count="$3" dres="$4"; shift 4
            local got=GREEN
            verdict "$count" "$dres" "$@" >/dev/null 2>&1 || got=RED
            cases=$((cases + 1))
            if [ "$got" = "$want" ]; then
              printf '  ok    %-64s -> %s\n' "$label" "$got"
            else
              printf '  FAIL  %-64s -> %s, expected %s\n' "$label" "$got" "$want"
              bad=$((bad + 1))
            fi
          }
          echo "built-in cases for the rule above:"
          expect GREEN '1. every job succeeded, one tool selected'                  '1' 'success' $ALL_OK
          expect GREEN '2. zero matrix: the three per-tool lanes skipped'           '0' 'success' $ZERO_MATRIX
          expect RED   '3. THE DEFECT: same lanes skipped, but a tool WAS selected' '1' 'success' $ZERO_MATRIX
          expect RED   '4. a per-tool lane failed'                                  '1' 'success' ${ALL_OK/sims=success/sims=failure}
          expect RED   '5. a per-tool lane was cancelled'                           '1' 'success' ${ALL_OK/package=success/package=cancelled}
          expect RED   '6. lanes skipped, count output empty (contract broke)'      ''  'success' $ZERO_MATRIX
          expect RED   '7. discover failed and the lanes skipped in its wake'       ''  'failure' ${ZERO_MATRIX/discover=success/discover=failure}
          expect RED   '8. a non-matrix job failed under a legitimate zero matrix'  '0' 'success' ${ZERO_MATRIX/core=success/core=failure}
          expect RED   '9. an outcome nobody enumerated'                            '1' 'success' ${ALL_OK/core=success/core=neutral}
          if [ "$bad" -ne 0 ]; then
            echo "::error::$bad of $cases built-in case(s) above disagree with the rule this job is about to apply. The rule was weakened or the cases were; either way this run's verdict would mean nothing."
            exit 1
          fi
          echo "$cases of $cases built-in case(s) agree with the rule."
          echo

          # ── AND NOW, THIS RUN ───────────────────────────────────────────────
          echo "discover: result=$R_DISCOVER count=${DISCOVER_COUNT:-<empty>}"
          code=0
          verdict "${DISCOVER_COUNT:-}" "$R_DISCOVER" "${pairs[@]}" || code=$?   # `|| code=$?` and not a bare `code=$?`: `-e` is already on, and a bare capture would abort the step before the table above could be read.
          if [ "$code" -ne 0 ]; then
            echo "::error::at least one job above is RED. This is the check to require in branch protection, under the name 'ci-required', and it is red because the tree is — a skipped lane is only licensed by a discover run that succeeded and selected zero tools."
            exit 1
          fi
          echo "ci-required: ${#pairs[@]} job(s) accounted for, every outcome in the allowed set."
