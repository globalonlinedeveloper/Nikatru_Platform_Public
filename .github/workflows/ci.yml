      # #236 fixed app_test.dart and left store_screenshots_test.dart carrying
      # the same line for 18 days, invisible because that lane does not run on
      # push. So this is a rule over every .dart file under test/ and
      # integration_test/ in BOTH roots, and not a fourth per-file correction.
      # It does not make a fourth outage impossible and does not claim to: it
      # makes these two shapes, in those directories, unwritable without
      # somebody reading a failure first. The guard's header lists what it
      # cannot see, including a poll helper hoisted outside those directories.
      #
      # What the three share is not a TYPE, it is a SITE: the finder was the
      # DETECTOR of a dismissal, and a widget type is the wrong key for that
      # question because the type is an implementation detail of the prompt
      # while the CONTROL is its contract. `find.text('No thanks')` survived a
      # showDialog route becoming an inline scrim; `find.byType(Dialog)` did
      # not. `find.byType` itself stays legal -- 155 of the corpus's 329 sites
      # are assertions, and the first thing a type-based rule would redden is
      # the fix for this very bug.
      #
      # Scans BOTH roots (the app suites and the brick that stamps every future
      # app; the brick has no Dart suite runner, so a static read is the only
      # reading it ever gets) and refuses when a root goes missing rather than
      # scanning a smaller corpus in silence. Carries its recorded failing case
      # and the shipped correction as canaries, re-classified on every run.
      # [pipeline F-10] [ADR 037 P2.6/P2.6a]
      - name: A first-run gate is found by its CONTROL, never by its widget type
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/assert-modal-detection.mjs
      # ── THE CLIENT MONEY RAIL ([pipeline 5]M-6/M-8/M-9/M-10/M-15) ───────────
      # Every limb here replaces an acceptance criterion that COULD NOT FAIL:
      # M-15 was satisfied by six rows of `false` (a rail dead everywhere
      # degrades perfectly), M-9's "cancel steps <= purchase steps" was
      # VACUOUSLY TRUE at `0 <= 0` on an app with no purchase flow, M-8's
      # "within the declared bound" passes at 365 days, and M-6's "a checkout is
      # launched" is satisfied by a widget test of the poller on an app that
      # cannot open one. The guard's header names each replacement beside its
      # limb.
      - name: The purchase path is whole, bounded, declared and cancellable
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/assert-purchase-path.mjs
      # [pipeline 5]M-11. The price the buyer READS is derived from the amount
      # the rail CHARGES, so the two cannot disagree. The defect this is named
      # after — `$2.99` compiled into a binary five days after the owner decided
      # $4.99 — was invisible to every existing guard, because
      # assert-no-hardcoded-strings.mjs then excluded apps/subly — the evidence
      # file itself (exclusion retired at P4 L0, #231). This one never had one.
      - name: No price is typed into app code
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/assert-no-price-literals.mjs
      # [pipeline 5]M-16 + [ADR 020]:21. The four money events have real callers,
      # resolved BY SYMBOL (analytics_funnel.dart is scheduled to MOVE under
      # [2]C-3, and a path-hardcoded guard passes trivially the day it does) —
      # and nothing anywhere pairs the paying id with the pseudonymous one.
      # That mapping is a ONE-WAY DOOR: made once, it reclassifies the whole
      # analytics store as personal data under DPDP, for every app, forever.
      - name: The money funnel is wired, and the pseudonymity firewall holds
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/assert-pseudonymity-firewall.mjs
      # …and a ROLLOUT is measurable at all. `resolveFlag` has shipped since CFG
      # G-14 and `grep -rn variant_exposed` matched NOTHING, in any language:
      # the client decided on/off locally and told nobody, so the treatment
      # group could only be re-derived from a rollout percentage — and percents
      # are not versioned, so the moment one is ramped the past is gone.
      #
      # The chassis now hands out core.ObservedFeatureFlags, which emits
      # variant_exposed{flag, variant, bucket} once per flag per session with
      # the bucket from the SAME flagBucket the decision used. This guard fails
      # on a raw reader escaping and PRINTS the `.isOn(` call-site count on
      # every run — it is 0 today, which is exactly when the rule is free to
      # enforce and exactly when a silent assertion would be dishonest.
      # [pipeline 11]E-12
      - name: Every rollout read is an observed rollout
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/assert-flag-exposure.mjs
      # [pipeline N-1 · N-3] The DoD register's own integrity, on a checkout with
      # no stamp: every non-`human` item resolves to a `run:` step on a NON-COMMENT
      # line, in a workflow whose `on:` includes push, whose job is in ci-gate's
      # `needs:`. File presence is not enforcement — the drafted criterion said
      # "present in tooling/ci/ OR ci.yml", which a guard nobody runs satisfies and
      # which a COMMENT in this very file satisfies too.
      #
      # Its domain here is the brick template's own seeded `dod.json` — a real
      # subject with tracked test files, tracked implementations and real git
      # history, so the feature-row and mutation-staleness clauses run on every
      # push even before a stamp exists. The `app_brick` lane runs it again with
      # `--require-stamped` against the freshly stamped `apps/probe`.
      #
      # 🔴 This lane's `fetch-depth: 0` (above, for assert-policy-archive) is
      # load-bearing here too: the staleness clause needs real history and refuses
      # a shallow clone rather than reading every file as changed today.
      - name: Every app carries a done-record, and its DoD items really run
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/assert-app-dod.mjs
      # [pipeline 6]N-9 — this existed and was wired into NOTHING, so the
      # `selection.sha256` half of the acceptance was enforced by nobody. It
      # PRINTS rather than fails on an empty set, because the requirement is
      # "no app ENTERS the factory without passing the gates" — apps/subly
      # predates them and is exempt, so nothing having entered is the
      # requirement SATISFIED, not unverified. Its two floors still exit 1:
      # a stale EXEMPT name, and a directory under apps/ the workspace omits.
      - name: Selection records resolve (N-9)
        working-directory: ${{ github.workspace }}
        run: node tooling/scripts/check-selection-record.mjs
      # Every tracked path is reached by something, or waived by a dated row in
      # the guard's own table. Wired HERE and deliberately not into
      # .githooks/pre-push: its manifest is the git index and its bodies are the
      # working tree, so on a dirty tree it can report work-in-progress as dead —
      # measured, and the cry-wolf failure that gets a hook bypassed within a week.
      # A CI checkout STARTS clean; it does not stay clean by construction, because
      # earlier steps in this job write to the tree. So the guard PRINTS whether the
      # tree was clean when it ran, and a dirty run is visible in the log rather
      # than silently changing the answer. That disclosure is the mitigation here,
      # not an assumption that drift is always zero.
      # Probes every executable in tooling/ci + tooling/scripts against a tree with
      # no subject in it, and requires a refusal. Wired here rather than left inert:
      # assert-guard-coverage (below) correctly refuses a guard in tooling/ci that
      # no workflow runs, and it caught this one the moment it became tracked —
      # an untracked file is invisible to a `git ls-files` domain, so a local run
      # could not have shown it.
      - name: Guards refuse an empty subject
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/assert-guards-refuse-empty.mjs

      - name: No dead tracked files
        working-directory: ${{ github.workspace }}
        run: node tooling/scripts/assert-no-dead-files.mjs
      # Repo-side secret scanning. GitHub's push protection only matches KNOWN
      # PROVIDER patterns, and `non_provider_patterns` is off — so the secrets
      # this project actually holds (the rclone crypt password, a pasted PEM, any
      # bespoke token) are exactly the class it cannot see.
      #
      # Version PINNED and the tarball CHECKSUM-VERIFIED before it is unpacked,
      # for the same reason every action is SHA-pinned (F-11) — except here we can
      # check the actual bytes rather than trust a ref.
      #
      # scan-secrets.mjs then SELF-TESTS before it scans: it plants a known secret
      # and asserts the scanner still flags it. A scanner that quietly stopped
      # detecting would otherwise report "clean" forever. [pipeline F-6]
      - name: Install gitleaks (pinned + checksum-verified)
        working-directory: ${{ github.workspace }}
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          set -euo pipefail
          # Into RUNNER_TEMP, never the workspace: a binary sitting in the repo
          # would then be scanned by the very step that follows.
          tarball="${RUNNER_TEMP}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          wget -q -O "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" -C "${RUNNER_TEMP}" gitleaks
          "${RUNNER_TEMP}/gitleaks" version
      - name: Secret scan (self-tests, then scans)
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/scan-secrets.mjs . --gitleaks "${RUNNER_TEMP}/gitleaks"
      # Static analysis of CI's OWN workflows. SHA-pinning closed the movable-tag
      # hole; it says nothing about attacker-controlled text expanded into a
      # `run:` block, a pull_request_target that checks out the PR head, or a
      # permission granted workflow-wide that one job needs. `39-CHASSIS` §4 cut 14
      # keeps exactly two things out of G-47 — SHA-pinning (shipped) and this.
      # Same discipline as gitleaks above: pinned version, bytes checksum-verified
      # rather than a ref trusted, unpacked into RUNNER_TEMP so the binary is not
      # sitting in the tree the next step scans. [pipeline F-11]
      - name: Install zizmor (pinned + checksum-verified)
        working-directory: ${{ github.workspace }}
        env:
          ZIZMOR_VERSION: '1.28.0'
          ZIZMOR_SHA256: 'e87b67160194884e375a46a12c57ccc904f762b53845f254fab7f17d98809c09'
        run: |
          set -euo pipefail
          tarball="${RUNNER_TEMP}/zizmor_${ZIZMOR_VERSION}_linux_x64.tar.gz"
          wget -q -O "$tarball" \
            "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ZIZMOR_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" -C "${RUNNER_TEMP}" zizmor
          "${RUNNER_TEMP}/zizmor" --version
      # Gates on HIGH severity AND HIGH confidence only. Unfiltered this repo
      # returns 77 findings, mostly low-confidence cache-poisoning notes about
      # setup-node's default cache — and a guard that cries wolf 77 times is one
      # somebody switches off. Everything below the gate is PRINTED on every run,
      # so nothing is hidden; it just does not block. Self-tests against a
      # deliberately vulnerable workflow before it trusts a clean result.
      - name: Workflow static analysis (self-tests, then scans)
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/scan-workflows.mjs . --zizmor "${RUNNER_TEMP}/zizmor"
      # A provider CYCLE is DEBUG-ONLY, which is the whole reason it needs a
      # static guard rather than a test. Riverpod's `ref.read` runs an assert that
      # walks the target's watch/listen ancestors and throws
      # CircularDependencyError when it finds the reader -- so `--release` strips
      # it and deletes accounts fine, while every debug run and the whole
      # `flutter drive` E2E throws. #258 was exactly that: the delete button threw
      # before a request was ever formed, and Cloudflare's zone analytics recorded
      # ZERO /v1/account requests for the leg -- not even a preflight -- while
      # production looked healthy for four days.
      # This checks the CLASS, not that instance: for every `R --read--> T`, R must
      # not already be a watch/listen ancestor of T, across every apps/*/lib and the
      # brick template whose providers.dart all fifty planned apps are born from.
      # The same anti-pattern was still live at apps/subly/lib/state/providers.dart
      # :1450 after #258 shipped, one `ref.read` away from closing a second loop.
      # Comments AND string literals are stripped first (text-reductions.mjs): the
      # real providers.dart spells the cycle out in PROSE, so a raw-text scan
      # reports the FIXED tree as broken -- the r2_buckets shape.
      # ⚠️ Green means no CLOSED cycle, NOT that the two-hop watch tear-off is
      # impossible; it prints the graph size it reached on every run.
      - name: No provider reads a provider that already watches it
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/assert-provider-graph-acyclic.mjs
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npx wrangler deploy --dry-run

  tokens:
    name: Site design tokens (build + drift)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/tokens
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: npm ci
      # 🔴 THE ARTIFACT IS DELETED FIRST, AND THAT IS THE WHOLE POINT. A bare
      # `git diff --exit-code` after a build cannot tell "the generator produced
      # identical bytes" from "the generator produced NOTHING and the checked-out
      # copy is what you are diffing" — both are an empty diff. Corpus triage
      # 2026-08-01 (#27) proved it on the real tree: emptying `platforms` in
      # style-dictionary.config.mjs makes `npm run build` emit zero files, and
      # this lane still went green. Removing the file first means the build has
      # to write it back, so the same diff that detects drift now also detects a
      # build that did nothing. Enforced structurally by
      # tooling/ci/assert-green-means-ran.mjs §C.
      - name: Delete the artifact so the build has to produce it
        run: rm -f ../../sites/_shared/assets/tokens.css
      - run: npm run build
      - name: The build actually wrote the artifact
        run: test -s ../../sites/_shared/assets/tokens.css
      # Guards the file the SITES ACTUALLY SERVE, not a build/ artifact nobody
      # read. Until 2026-07-26 this checked packages/tokens/build/, while
      # sites/_shared/assets/tokens.css was a separate hand-maintained copy —
      # so editing tokens/color.json changed nothing, and CI still passed.
      - name: Site tokens.css must equal a fresh build
        run: git diff --exit-code -- ../../sites/_shared/assets/tokens.css

  site_shared:
    name: Shared site build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sites/_shared
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build && test -s _site/index.html  # eleventy exits 0 on "Wrote 0 files"

  # ── THE CONTENT LANE ([pipeline 7], the producer half of the pack rail) ─────
  # A lane of its own rather than more steps in `platform`, for the reason F-9
  # exists: `tooling/content_pipeline` is a deployable unit, and until this job
  # existed nothing claimed it. assert-lane-coverage.mjs now scans `tooling/` as a
  # root, so deleting this job turns that guard RED naming the package — which is
  # the negative test this lane was built with, run against the real tree.
  #
  # The consumer half (loader, Ed25519 verifier, pinned k1) is Dart and is covered
  # by workspace_gate; packages/core/test/content_pack_fixture_test.dart loads the
  # SAME committed pack these guards produce, through the real ContentPackLoader.
  # Two lanes, one artifact, and neither alone is the proof.
  content_gate:
    name: Content pipeline (recipe -> pack -> sign -> gate)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      # The pipeline's own suite first: the guards below IMPORT its modules, so a
      # broken emitter would otherwise surface as a confusing guard failure rather
      # than as the unit failure it is.
      - name: The pipeline's own tests
        run: node --test "tooling/content_pipeline/test/*.test.mjs"
      # 🔴 THE REAL CLI, on the real recipe, exactly as an operator would run it.
      # A pipeline only ever exercised through its exported functions rots at the
      # argument layer — which is where assert-licence-register.mjs's own
      # off-by-one lived, and it made nine mutation runs report NOT CAUGHT.
      # --test-key signs as `test-k1`, which pack_verifier.dart does NOT pin, so
      # nothing CI can sign is a pack any shipped binary would accept.
      - name: The pipeline builds and signs the example pack, through the CLI
        run: |
          node tooling/content_pipeline/cli.mjs validate --recipe tooling/content_pipeline/examples/lingo-phrases/recipe.json
          node tooling/content_pipeline/cli.mjs build --recipe tooling/content_pipeline/examples/lingo-phrases/recipe.json --out "$RUNNER_TEMP/pack" --test-key
      # [pipeline 7]P-1 + P-8. The required-field set is recipe.schema.json's
      # `required[]`, and every entry is proven to refuse by DELETING it from the
      # committed recipe — no fixture to remember, no count to ratchet. Also the
      # three locale relationships, including the one the client cannot rescue: a
      # shard missing a key renders as the base language, silently.
      - name: A recipe is a validated input contract, and the shards agree
        run: node tooling/ci/assert-recipe-contract.mjs
      # [pipeline 7]P-5 / G-36. The register is in tooling/legal/ and NOT under
      # Private/, which is gitignored — a guard pointed there reads nothing and
      # reports a clean tree over an empty domain. Uncleared rows for families
      # nothing consumes PRINT; a recipe declaring an uncleared family FAILS.
      - name: No pack ships a licence family nobody cleared
        run: node tooling/ci/assert-content-licences.mjs
      # [pipeline 7]P-9 + P-6 + P-11. The pack is REBUILT from the recipe and
      # compared byte for byte with the frozen fixture, signature included —
      # Ed25519 is deterministic and the test key is derived, so any drift in the
      # emitter or the canonical serialiser is red here. This is what catches a
      # signer that signs a re-serialisation: such a pack verifies perfectly on
      # the machine that made it and fails on every installed app.
      - name: The pipeline reproduces the frozen pack, and the signature binds the bytes
        run: node tooling/ci/assert-pack-roundtrip.mjs
      # [pipeline 7]P-7 + P-14. Member whitelist over the WHOLE pack (the original
      # scope let its own worked example — a root-level .js — walk past), and
      # magic bytes rather than extensions. AVIF's absence from the allowlist IS
      # the 2026-07-29 cut; video stays dormant (39-CHASSIS §4 cut 8).
      - name: A pack is inert data in only the locked formats
        run: node tooling/ci/assert-pack-inert.mjs
      # [pipeline 7]P-2. PARSED, never grepped — the ban list contains the strings
      # it bans, so a raw-text scan flags the guard itself and every honest
      # refusal note. The relationship is count(prompts) == count(items), because
      # the failure mode is NOT LOGGING and the original criterion rewarded it.
      - name: Every produced item has an IP-clean, logged prompt
        run: node tooling/ci/assert-prompt-provenance.mjs
      # [pipeline 7]P-4. A review.jsonl with ONE passing verdict over the right
      # content hash satisfies all three original criteria, so the sample is
      # RE-DERIVED from the pack's content hash and the named human checklist —
      # reverse-image-search, text-in-pixels, G3 do-no-harm — is a real list with
      # a per-item verdict. It existed in no file before this.
      - name: The human sample is deterministic, covered and checklisted
        run: node tooling/ci/assert-review-gate.mjs
      # [pipeline 7]P-13 + P-10. Five gates, five recorded failing cases, and a
      # content-hash binding on all five — an artifact naming a different pack is
      # what a re-run leaves behind. The publish TARGET is [4]B-18's and does not
      # exist; a gate is about refusing, and refusing needs no destination. The
      # undrilled production key PRINTS (owner work) while the sign step's refusal
      # is proven to still fire on every run.
      - name: Publish is a gate, and an undrilled signing key cannot sign
        run: node tooling/ci/assert-publish-gate.mjs

  app_brick:
    name: App brick (stamp both variants + analyze + validate the clone contract)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # 🔴 FULL HISTORY, and it is load-bearing rather than tidy — the same
          # reasoning the `platform` lane already carries for assert-policy-archive.
          # `assert-app-dod.mjs` expires each feature row's MUTATION RECORD against
          # the last commit that touched the implementation it probed, which is what
          # turns "proven once in a terminal" into a state. At the default depth of 1
          # there is exactly ONE commit, dated at checkout time, so `git log -1 --
          # <file>` returns that date for every file in the tree: every mutation
          # record would read as stale and every human-review row as freshly signed.
          # The guard refuses a shallow clone with COVERAGE LOST rather than
          # softening to a print, so removing this line turns the lane RED rather
          # than quietly hollow. [pipeline N-5]
          fetch-depth: 0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      # PINNED. This was `activate mason_cli` with no version, taking whatever was
      # newest on every run — and mason is what STAMPS APPS, so the factory's own
      # product could differ between runs with nothing in the repo to explain it.
      # Version declared in tooling/versions.json. [pipeline F-2]
      - name: Install mason_cli
        run: dart pub global activate mason_cli 0.1.3

      # 🔴 NO SHIPPED APP CARRIES FLUTTER'S LAUNCHER ICON. Measured on the real
      # tree 2026-08-04: apps/subly's Android, iOS, macOS and Windows icons were
      # ALL byte-identical to `flutter create` output — 29 files — while its web
      # icons carried the brand mark and nikatru/logo/logo-usage.md recorded that
      # the refresh had been "rolled out across the app". Five of six platforms
      # were wrong and one document said they were right. Google Play rejects the
      # stock Flutter icon outright, and it is the first thing any reviewer sees.
      #
      # It is a FACTORY defect, not an app defect: the brick stamps no native
      # platform folders, so the owner adds them with `flutter create .
      # --platforms=…` — the very command that writes those icons. Limb 6 checks
      # the brick still carries the generator config and the art it names, so
      # app #2 cannot be born the same way. Proven end to end by stamping a
      # probe, adding all five platforms (guard RED) and running the ONE command
      # the stamp's checklist prints (guard GREEN).
      #
      # RUNS HERE, not beside the static guards in `platform`, because it needs
      # the SDK: stock bytes come from the LIVE Flutter install rather than
      # pinned hashes, which cannot go stale. `flutter --version` is not
      # decoration — it bootstraps `flutter_tools/.dart_tool/package_config.json`,
      # which is how the guard locates the `flutter_template_images` overlay. The
      # SDK's own `.img.tmpl` files are ZERO-BYTE placeholders, and without the
      # overlay iOS, macOS and Windows compare against empty buffers and can
      # never match — the guard exits COVERAGE LOST rather than printing a
      # healthy count, which is exactly how that hole was found.
      #
      # BEFORE the stamps on purpose: its subject is the committed tree and the
      # brick template, so it must not depend on what a stamp happens to leave
      # behind.
      - name: No shipped app carries Flutter's default launcher icon
        run: |
          flutter --version
          node tooling/ci/assert-launcher-icons.mjs

      # ── Variant 1: the DEFAULT stamp — client-only (needs_backend=false).
      # This is what almost every app gets, so it is the one that must not rot.
      - name: Stamp the default (client-only) app
        run: |
          export PATH="$PATH:$HOME/.pub-cache/bin"
          # [pipeline S-13] The stamp now REFUSES to overwrite an existing app.
          # CI re-stamps the same throwaway probe on every run, which is exactly
          # the case the refusal is not about, so the escape hatch is set here
          # and ONLY here. It is an env var rather than a flag so that a human
          # cannot pass it by muscle memory.
          export NIKATRU_ALLOW_OVERWRITE=1
          mason get
          mason make app -c tooling/bricks/app/_probe_vars.json -o . --on-conflict overwrite
      # [pipeline S-7a] STAMPED TWICE, ON PURPOSE. post_gen carries two
      # skip-if-already-present branches — one in _appendToAppsJson, one in
      # _registerInWorkspace — and until now CI stamped exactly ONCE, so neither
      # branch had ever executed. That is untested code sitting in the path that
      # protects the public catalogue and the workspace gate from duplicates.
      # Byte-identical after the second stamp is what makes idempotency
      # OBSERVABLE rather than merely asserted in a comment.
      # [pipeline S-14] The brick used to ship Flutter's stock icons, so every
      # stamped app was born with the default icon — DoD §4-G's defect, but in
      # the TEMPLATE, where it lands on all fifty apps at once and store
      # reviewers see it first. post_gen now GENERATES the icons from app_id +
      # seed_hex (no model, so [ADR 019]'s NO-IP-PROMPTING rule is obeyed by
      # construction), and this proves the stamp did it.
      #
      # Compared against the LIVE SDK's stock assets, never pinned hashes: a
      # hash list rots silently when Flutter changes its defaults, and the guard
      # would go on reporting ok while stamping stock icons again. It runs HERE
      # rather than beside the static guards because this is the lane with
      # Flutter on PATH — and it exits COVERAGE LOST rather than skipping if it
      # cannot find the SDK, so "I could not check" never reads as "ok".
      #
      # The seed is read from the probe's own vars file so the assertion cannot
      # drift from the spec it is checking.
      #
      # 🔴 ORDERING IS LOAD-BEARING: this runs BEFORE the SHOW-1 step, which
      # reverts sites/_shared/_data/apps.json to keep the tree clean. The asset
      # set is derived from the app's platform CLAIM, and the claim lives in that
      # file — so after the revert there is nothing to derive from. Placed after
      # it once; the guard exited COVERAGE LOST rather than passing on an empty
      # requirement, which is the whole reason it refuses an empty claim.
      - name: Stamped app carries ITS brand assets, not Flutter's
        run: |
          SEED=$(node -p "require('./tooling/bricks/app/_probe_vars.json').seed_hex")
          node tooling/ci/assert-stamp-brand-assets.mjs apps/probe --seed "$SEED"
      # 🔴 THE STAMP CAN BE GREEN AND STILL SHIP THE WRONG TEXT. mason renders
      # every DOUBLE stache HTML-escaped (& < > " ' /), so a display name with
      # an apostrophe stamped `Probe&#x27;s` into the Dart appName const, the ARB
      # app title, the PWA install name and the pubspec — output that compiles,
      # analyzes, formats and tests clean while the OS window title is corrupt.
      # And a BLANK `subdomain`/`api_domain` — the input pre_gen documents as
      # normal ("or empty to derive") — was interpolated as nothing, stamping
      # `"https://"` into ALLOWED_ORIGINS and _phApiBase.
      #
      # Both probe vars files now carry `& ' / "` in their free text, leave a
      # derivable host BLANK, and name the app with a hyphen inside a word; the
      # guard refuses to run (COVERAGE LOST) if a future edit takes any of the
      # three away — an escape-free probe is precisely why this lane could not
      # catch the defect before.
      #
      # 🔴 ORDERING IS LOAD-BEARING, same shape as the brand-asset step above:
      # this guard reads the catalogue ROW the stamp just appended, and the
      # SHOW-1 step below reverts sites/_shared/_data/apps.json to keep the tree
      # clean. Run after it and there is no row left to read — the guard exits
      # COVERAGE LOST rather than passing, so the order enforces itself.
      - name: Stamped text is the spec's, its release id is its own, and blank hosts were DERIVED
        run: node tooling/ci/assert-stamp-text-fidelity.mjs --vars tooling/bricks/app/_probe_vars.json
      # 🔴 [pipeline 10]D-5 — THE RENDERED LISTING, not the template. The
      # `platform` lane runs this same guard on a clean checkout, where its
      # subjects are apps/subly's hand-made tree and the BRICK's templates. Only
      # here does a real mason render exist to check, and only here does the
      # freshly stamped app carry a catalogue row for the derived fields to be
      # compared against — so this is where "stamp an app and its listing is
      # complete, derived and within every sourced store limit" is actually
      # observed rather than inferred from the templates.
      #
      # Measured locally 2026-08-06 before this step existed: a stamp produced
      # 5 complete trees, 40 derived fields agreeing with their sources and both
      # Play graphics at 1024x500 (no alpha) and 512x512 (with alpha) — and it
      # found a real integration defect on the first run, that a stamped app
      # carried a windows-store tree with no `msix_config:` and would have
      # packaged under `com.flutter.<name>`.
      #
      # 🔴 ORDERING IS LOAD-BEARING, same shape as the two steps above: this
      # reads the catalogue ROW the stamp appended, and the SHOW-1 step below
      # reverts sites/_shared/_data/apps.json. Run it after that revert and the
      # stamped app is no longer in the expected set — the guard would pass by
      # having nothing new to check, which is this requirement's original defect.
      - name: A freshly stamped app carries a COMPLETE, spec-derived store listing
        run: node tooling/ci/assert-store-metadata.mjs
      # 🔴 SUBJECT MOVED 2026-08-17 — the stamp now appends to catalog/apps.json,
      # the PUBLISHED catalogue, and sites/_shared/_data/apps.json is GENERATED
      # from it. Every line below reads the catalogue, because that is what the
      # stamp writes. Reading the generated file here would have made this step
      # an assertion that cannot fail: the probe row would never appear in it,
      # and a `diff` of a file the stamp never touches is trivially empty.
      - name: SHOW-1 — probe is in the catalogue, and a RE-STAMP changes nothing
        run: |
          export PATH="$PATH:$HOME/.pub-cache/bin"
          export NIKATRU_ALLOW_OVERWRITE=1
          grep -q '"slug": "probe"' catalog/apps.json
          cp catalog/apps.json "$RUNNER_TEMP/apps-after-1.json"
          cp pubspec.yaml "$RUNNER_TEMP/pubspec-after-1.yaml"
          mason make app -c tooling/bricks/app/_probe_vars.json -o . --on-conflict overwrite
          # diff, not `grep -c`: a second `probe` row and a missing one both fail
          # a count check for opposite reasons, and only the diff says which.
          diff -u "$RUNNER_TEMP/apps-after-1.json" catalog/apps.json
          diff -u "$RUNNER_TEMP/pubspec-after-1.yaml" pubspec.yaml
          # BOTH files: the catalogue the stamp wrote, and the site feed derived
          # from it. Reverting one leaves the other carrying the throwaway probe.
          git checkout -- catalog/apps.json sites/_shared/_data/apps.json
      # THE CLONE CONTRACT, asserted rather than documented. A default stamp
      # that quietly regains a Worker/D1/R2 is how the portfolio walks back
      # into the 10-database free-tier ceiling. Checks are structural (the
      # config is parsed, not grepped) — see the script header for why.
      - name: Default stamp claims NO Worker, NO D1 and NO R2
        run: node tooling/ci/assert-clone-contract.mjs --client probe
      # A stamped app must be born `dart format`-clean. Every app in the
      # portfolio starts as a copy of this output, so template dirt is dirt in
      # all of them at once — and it makes adding a repo-wide format gate
      # impossible for as long as it lasts. Cheap to hold, expensive to reclaim.
      - name: Stamped app is dart format-clean
        run: dart format --output=none --set-exit-if-changed apps/probe
      # 🔴 THE BACKEND STAMP AND ITS FORMAT GATE WERE MOVED HERE 2026-08-28, AND THE
      # REASON IS THAT THE TWO FORMAT GATES WERE MUTUALLY UNSATISFIABLE WHERE THEY SAT.
      # `dart format` chooses its style from the LANGUAGE VERSION it can resolve. Both
      # gates stamp from the SAME brick templates, but the probeapi gate used to run
      # AFTER `Analyze + test the stamped app`, whose `flutter pub get` creates package
      # resolution — so the two gates judged the same source under DIFFERENT styles.
      # PROVEN by CI on 0a80460, one run, one commit, one template set:
      #     step 13  Stamped app is dart format-clean          (probe)     success
      #     step 26  Stamped backend app is dart format-clean  (probeapi)  failure
      # and before that commit the pair failed the other way round. No template content
      # can satisfy both; editing the brick only chose which gate went red.
      # Invisible under Flutter 3.44.9; dart_style 3.1.x (Dart 3.13.1) made it bite.
      # ⚠️ NEITHER GATE IS WEAKENED. Both still assert that a stamped app is BORN
      # format-clean, and both now judge in the same unresolved state — the state the
      # probe gate has always passed under. What changed is only WHEN probeapi is
      # stamped and checked, not WHAT is checked.
      # 📌 The alternative — running both AFTER `pub get`, at the declared language
      # version 3.5 — is the more principled fix and is deliberately NOT taken here: it
      # needs the brick reformatted to that style (~18 files) and is its own change.
      # ── Variant 2: the OPT-IN backend stamp (needs_backend=true). Rarer, but
      # it still has to typecheck and deploy-dry-run.
      - name: Stamp the opt-in backend app
        run: |
          export PATH="$PATH:$HOME/.pub-cache/bin"
          export NIKATRU_ALLOW_OVERWRITE=1
          mason make app -c tooling/bricks/app/_probe_backend_vars.json -o . --on-conflict overwrite
      - name: Stamped backend app is dart format-clean
        run: dart format --output=none --set-exit-if-changed apps/probeapi
      # The stamp lane used to assert only that the app COMPILES and its tests
      # pass, so anything merely ABSENT sailed through: themeMode appeared zero
      # times repo-wide, Semantics( zero times, and the account-delete button
      # called Navigator.pop and nothing else. All three were green. The
      # assertions now live in the brick template so every stamped app inherits
      # them for life; this guard stops that file quietly vanishing, because
      # vanishing looks exactly like passing. [pipeline C-16]
      - name: The app spec is one validated input contract
        run: node tooling/ci/assert-input-contract.mjs
      # [pipeline S-3 / S-4] The claim and the proof come from the same place,
      # and the new app joins the workspace that checks it.
      - name: A stamped app claims only platforms it is built for
        run: node tooling/ci/assert-stamp-platforms.mjs
      - name: Stamped app asserts its own chassis properties
        run: node tooling/ci/assert-stamp-properties.mjs
      # 🔴 [pipeline N-2] THE ONE MOVE THAT MAKES STAGE 6 ABLE TO FAIL AT ALL, and
      # it has to run HERE — after the stamp and before any revert.
      #
      # The done-record guard enumerates the root pubspec's `workspace:` list and
      # exempts `apps/subly` by name (39-CHASSIS §4 cut 1 freezes it). `apps/` holds
      # exactly one app, so on a clean checkout that domain is EMPTY and seven
      # stage-6 requirements are vacuously true — `assert-app-dod.mjs` would print
      # ok having examined nothing. It refuses to: an empty non-exempt set is
      # COVERAGE LOST.
      #
      # This lane has already stamped `apps/probe` and post_gen has already appended
      # it to the workspace block, so right here there IS a real, non-exempt,
      # freshly stamped app to quantify over — on every single push, without waiting
      # for app #2 (which the owner sequenced last). The probe is the domain.
      #
      # ORDERING, both sides of it: after `Stamp the default (client-only) app`
      # because the app must exist, and before `Revert the root pubspec` at the end
      # of the lane because that is what takes the domain away again.
      #
      # `--require-stamped` is what makes this invocation different from the
      # static one: outside this lane the guard's domain is the brick template
      # alone and it says so; here a stamp has just run, so ZERO non-exempt apps
      # means the stamp or the workspace registration regressed, and it is
      # COVERAGE LOST rather than a quieter pass over the template.
      - name: The stamped app carries a done-record, and its DoD items really run
        run: node tooling/ci/assert-app-dod.mjs . --require-stamped
      - name: Analyze + test the stamped app
        working-directory: apps/probe
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test
      # 🔴 [pipeline S-3] THE CLAIM, PROVEN. Until this step existed, every
      # stamped app told the public catalogue it "works on web" while the
      # template stamped no platform folder at all — so `flutter build web`
      # failed immediately on a fresh stamp and nothing ever ran it. Analysis and
      # tests passed throughout, because neither needs a platform folder.
      #
      # NO `flutter create` REPAIR STEP MAY BE ADDED HERE. Needing one is the
      # defect; the stamp must produce a buildable app on its own.
      - name: A fresh stamp really builds for web
        working-directory: apps/probe
        run: flutter build web --pwa-strategy=none
      # [pipeline K-10] The STRONGER half of the licence register: the guards
      # lane runs this in DECLARED mode (what the manifests intend to ship);
      # here, against a bundle that actually exists, it enumerates what the
      # build really emitted. That is where intent and output can be seen to
      # differ — a font the toolchain injects, an asset a transitive package
      # brings with it. A store can ask for evidence of rights to any of it
      # without warning, and the answer has to be a file rather than a search.
      # A step, not a reorder: this lane is stage 3's.
      - name: Every asset the build actually shipped has a licence row
        run: node tooling/ci/assert-licence-register.mjs . --bundle apps/probe/build/web/assets

      - name: Backend stamp has a Worker + APP_DB but still no per-app R2
        run: node tooling/ci/assert-clone-contract.mjs --client probe --backend probeapi
      # [pipeline S-12r] (absent from origins.lock.json by construction — S-12r is a residual of S-12, raised by Private/plans/03-stamper-plan.md after the pipeline harvest was frozen) EXERCISE THE PROVISIONER. Same reasoning the four
      # release scripts above already carry — "a release script nobody runs rots
      # exactly like a guard nobody feeds bad input to" — applied to the one
      # command the stamp's own checklist tells the owner to run. Nothing ran
      # provision-backend.mjs and nothing tested it: `grep -rn provision-backend
      # .github/` returned zero.
      #
      # `--self-check` and NOT `--dry`: --dry needs CLOUDFLARE_API_TOKEN, runs
      # `npm install` and calls `wrangler d1 info` before it stops, so on a fork
      # PR it would fail for want of a secret rather than for a defect. This mode
      # stops above the credential gate — no token, no install, no network, no
      # writes — and proves the half most likely to rot silently: that the
      # config surgery still targets APP_DB and still leaves the SHARED
      # PLATFORM_DB binding alone. Verified structurally, by re-parsing the
      # patched config, never by re-grepping it.
      - name: The provisioner's config surgery still targets APP_DB, not the shared binding
        run: node tooling/scripts/provision-backend.mjs probeapi --self-check
      # The backend probe stamps with BOTH hosts blank, so this is the run that
      # proves the stamped Worker's own ALLOWED_ORIGINS is a real origin rather
      # than the bare `https://` the derive path used to produce — an allowlist
      # matching nothing, which `cors.ts` cannot even fall back from because
      # "https://" is not empty. It fails as a browser CORS error with no
      # server-side trace, so nothing downstream would ever have reported it.
      #
      # It is ALSO the run that proves the telemetry release id is per-app: a
      # release literal is right for at most one app, and this is the second one.
      # The catalogue revert therefore moved OUT of the stamp step above and into
      # its own step below — this guard reads the row the stamp just appended.
      - name: Backend stamp derived its own web origin, API host and release id
        run: node tooling/ci/assert-stamp-text-fidelity.mjs --vars tooling/bricks/app/_probe_backend_vars.json --service services/probeapi-api
      - name: Revert the catalogue — both probes are throwaway
        run: git checkout -- catalog/apps.json sites/_shared/_data/apps.json
      - name: Analyze the stamped backend app
        working-directory: apps/probeapi
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test
      # 🔴 [pipeline S-4] RESOLVE FROM THE REPO ROOT, WITH THE STAMPS ON THE LIST.
      # This step exists because the defect it catches was INVISIBLE TO THIS LANE
      # BY CONSTRUCTION. Every `flutter pub get` above runs INSIDE `apps/<probe>`,
      # which resolves standalone and never consults the root; `workspace_gate`
      # runs on a clean checkout that has no stamp. So a stamped app could be
      # added to the root `workspace:` list while omitting `resolution: workspace`
      # — which makes Dart refuse THE WHOLE WORKSPACE, every package at once —
      # and both lanes stayed green. It would have surfaced on the day app #2 was
      # committed, as `melos run gate` failing to resolve for the entire repo.
      #
      # There is no `working-directory` on purpose: the root IS the subject.
      # Both probes are on the list by now, so this is literally the app-#2
      # scenario — two stamped apps plus apps/subly plus the eight packages in one
      # resolution. assert-stamp-platforms.mjs asserts the same property
      # statically; this is the half that makes the REAL RESOLVER agree, because a
      # guard's own correctness must not be the only thing standing between this
      # repo and a dead gate.
      #
      # The revert mirrors the SHOW-1 step above: both probes are throwaway, and
      # the resolve rewrites pubspec.lock as well as leaving the two `apps/` lines
      # in the root pubspec.
      - name: The WHOLE workspace still resolves from the root with stamped apps on it
        run: flutter pub get
      - name: Revert the root pubspec + lockfile — both probes are throwaway
        run: git checkout -- pubspec.yaml pubspec.lock
      # ⚠️ THE ONE DELIBERATE EXCEPTION to F-8's `npm ci` / `--enforce-lockfile`
      # rule, and it is stated here rather than left to look like an oversight.
      #
      # apps/probe, apps/probeapi and services/probeapi-api are stamped fresh by
      # mason seconds earlier. A freshly stamped app HAS no lockfile, so `npm ci`
      # and `--enforce-lockfile` would both fail by definition. These three
      # installs are a bootstrap, not a reproducible build, and they ship nothing.
      #
      # assert-lockfile-discipline.mjs allows exactly these paths and fails on any
      # other non-reproducible install. If the brick ever ships lockfiles in its
      # template, delete the exception rather than widening it. [pipeline F-8]
      - name: Typecheck + dry-run the stamped service
        working-directory: services/probeapi-api
        run: |
          npm install
          npx tsc --noEmit
          npx wrangler deploy --dry-run

  sites:
    name: Static sites (functions parse + required files)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # [pipeline 12]W-3a — the sitemap's `lastmod` is now derived from a
          # per-file `git log`, so a shallow clone cannot answer the question.
          # WITHOUT this the guard exits 1 with COVERAGE LOST rather than
          # passing on an unanswerable one — verified against a real
          # `git clone --depth 1`.
          fetch-depth: 0
      # sites/nikatru and sites/rajasekarselvam are deployed by CLOUDFLARE's own
      # Git integration on every push to main — no workflow involved, and
      # Cloudflare cannot read a GitHub check. Until this lane existed nothing in
      # the repo so much as parsed them, including a Pages Function holding a live
      # KV binding that stores email signups.
      #
      # Cloudflare still cannot be gated. The protection is indirect: with `main`
      # protected (F-5a), code that cannot pass this lane cannot reach `main`, and
      # therefore cannot reach Cloudflare. [pipeline F-9]
      #
      # The two site paths are ARGUMENTS, not decoration (2026-08-01 review):
      # assert-lane-coverage.mjs now ignores comments, so this run line is the
      # sites' one structural claim to CI coverage — and the script fails if a
      # claimed root is not really among the deploy roots it scans, so the claim
      # cannot drift from the checking.
      - name: Site integrity
        run: node tooling/ci/check-site-integrity.mjs . sites/nikatru sites/rajasekarselvam
      - name: The published catalogue satisfies its contract
        run: node tooling/ci/assert-catalog-contract.mjs
      - name: Delete the feed so the generator has to produce it
        run: rm -f sites/_shared/_data/apps.json
      - run: node tooling/sites/generate-apps-data.mjs
      - name: The generator actually wrote the feed
        run: test -s sites/_shared/_data/apps.json
      - name: Site feed must equal a fresh generation from the catalogue
        run: git diff --exit-code -- sites/_shared/_data/apps.json
      # [pipeline S-7a] apps.json is PUBLIC, so a `live` entry is a promise to a
      # stranger that the link works. Under the wildcard `*.nikatru.com` ([ADR
      # 006]) every name resolves and almost every name fails — measured
      # 2026-07-29, `lingo.nikatru.com` and `zzz-nonexistent-app.nikatru.com`
      # both answer 522 while `subly.nikatru.com` answers 200. So "it resolves"
      # proves nothing and only the RESPONSE counts. `[3]S-7` asserts the stamp
      # WRITES the catalogue; until now nothing asserted anyone could open what
      # it wrote.
      - name: Catalogue advertises no dead app
        run: node tooling/ci/assert-catalog-reachable.mjs
      # [pipeline 12]W-1. The per-app landing's About / What-you-get / Pricing
      # blocks render from services/platform/src/app-config-data.json (THE one
      # place a price lives) plus the store lede — none of it in the catalogue.
      # This publishes the PROJECTION the renderer already computes ("$4.99",
      # never 499). It is its OWN file because every catalogue FIELD passes
      # through to the feed: folding these in moved the feed 235 -> 370 bytes.
      - name: The published render payload satisfies its contract
        run: node tooling/ci/assert-render-payload.mjs
      # Delete-first, exactly as the feed lane above and for the same reason: an
      # empty diff over a publisher that emitted nothing is the vacuous pass that
      # section C of tooling/ci/assert-green-means-ran.mjs exists to refuse.
      - name: Delete the payload so the publisher has to produce it
        run: rm -f catalog/apps-landing.json
      - run: node tooling/sites/generate-landing-payload.mjs
      - name: The publisher actually wrote the payload
        run: test -s catalog/apps-landing.json
      - name: Render payload must equal a fresh publish from the rail config
        run: git diff --exit-code -- catalog/apps-landing.json
      # [pipeline 12]W-1/W-2/W-9. The per-app landings and the /apps/ hub are
      # GENERATED from sites/_shared/_data/apps.json and COMMITTED, because
      # Cloudflare's Git integration deploys this tree with no build step — a
      # generator whose output lived only in a CI job would emit bytes nobody
      # serves, which is the sites/_shared/_site/** mistake that made an
      # apps.json write look "consumed" for a month.
      #
      # So this step re-runs the generator over the committed registry and
      # DIFFS. A hand-edited landing, a deleted sitemap <url> block, or a
      # registry change nobody regenerated for each go red naming their own file.
      # It deliberately does NOT re-assert the canonical/sitemap relationship
      # (check-site-integrity.mjs owns that) or catalogue reachability (the step
      # above owns that): one fault producing three messages is how a fix chases
      # the wrong one.
      - name: Discovery surfaces match the registry that generated them
        run: node tooling/ci/assert-discovery-surface.mjs
      - name: Every inline palette copy still matches the token source
        run: node tooling/ci/assert-palette-consistent.mjs
      # catalog/store-matrix.json is the primary key of the store matrix, so it
      # joins the other catalogue guards in this job.
      #
      # 🔴 `--registry-only` IS LOAD-BEARING AND IS NOT A WAIVER. This guard's
      # full subject is THIRTY DIRECTORIES under Projects/, outside this
      # repository; a CI checkout holds one repo and never the matrix, so the
      # anchor is genuinely unreachable here. Without the flag the guard REFUSES
      # (exit 2) rather than passing over an absent tree — refusal is its default,
      # and "the tree is not in this checkout" and "the path is wrong" are
      # deliberately not answered by the same test. With the flag it checks the
      # registry's internal consistency — the naming rule, the repo-name collision
      # class that already bit this tree, the state vocabulary, the counts, the
      # backing cross-references — and PRINTS, in capitals, the number of disk
      # assertions it did not make.
      #
      # The flag polices itself: passing it anywhere the tree IS reachable exits 2
      # rather than suppressing the disk limbs, so the day this job can see the
      # matrix, this line fails loudly instead of going quiet. The tree limbs are
      # run by hand, without the flag, from a checkout that sits in the tree.
      #
      # Placed at the END of this job on purpose: every `ci.yml:NNNN` citation in
      # the private corpus below an insertion point shifts, so the insertion is put
      # where it moves the fewest of them.
      - name: The store matrix registry is internally consistent (tree limbs run locally)
        run: node tooling/ci/assert-store-matrix.mjs --registry-only

  workspace_gate:
    name: Workspace gate (melos analyze + test)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Runs BEFORE melos: the gate below can only report on packages it is told
      # about, so an ungated package must fail here rather than pass silently.
      # [pipeline F-1]
      - name: Assert workspace coverage
        run: node tooling/ci/assert-workspace-coverage.mjs
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.2
      - name: Activate melos
        run: dart pub global activate melos 8.2.2
      # Flutter members require the Flutter tool for root workspace resolution
      # (plain `dart pub get` cannot resolve `sdk: flutter` dependencies).
      - name: Resolve the workspace
        run: flutter pub get --enforce-lockfile
      # THE APPLE HALF OF THE SAME QUESTION, AND IT ARRIVED SEVEN WEEKS AFTER THE
      # PLAY HALF. `PrivacyInfo.xcprivacy` is a sworn declaration about what the
      # code does, exactly like the two Play artefacts above — and it is the one
      # enforced at UPLOAD rather than at review: "Starting May 1, 2024, apps that
      # don't describe their use of required reason API in their privacy manifest
      # file aren't accepted by App Store Connect." A wrong answer here does not
      # cost a review cycle, it costs an upload round-trip — and no store console
      # watches a repository, which is the same reason the step above exists.
      #
      # 🔴 G-49 SAT ON STAGE 8'S CUT LIST WITH A PAIRED TRIPWIRE, AND THE TRIPWIRE
      # FIRED ON 2026-08-31. The cut was consistent ONLY while Apple enrolment was
      # deferred (Private/requirements/not-built.json, stage 10, [10]D-4:
      # "registering the account without moving G-49 is how that pairing breaks
      # silently"). Enrolment completed, so the cut expired. What the corpus had
      # recorded for weeks was the RULE and never the ANSWER — nikatru/vendors/
      # apple.md said in as many words that the exact list of Required Reason APIs
      # this app touches was "UNVERIFIED — never audited".
      # apps/subly/store/ios-appstore/privacy-manifest.json is that audit: ONE file
      # for BOTH Apple channels, because two copies of one identity is how the
      # wrong one ships. This step re-derives both .xcprivacy files from it and
      # compares them, in the same direction as every other store artefact here —
      # the repository is authoritative and Xcode is a copy of it.
      #
      # 🔴 THE ANSWER IS AN EMPTY `NSPrivacyAccessedAPITypes`, AND AN EMPTY ARRAY
      # IS A CLAIM RATHER THAN A DEFAULT. Apple asks a BINARY why IT uses an API,
      # and the app target's own sources — read in full, three files on iOS and
      # two on macOS, all stock — reach none. Every category this app genuinely
      # depends on is declared by the binary that uses it: FileTimestamp and
      # SystemBootTime by the Flutter engine, UserDefaults by
      # flutter_local_notifications (CA92.1) and shared_preferences_foundation
      # (1C8F.1). Repeating those here would cost nothing at upload and would be a
      # FALSE SWORN STATEMENT about code this target does not contain — and it
      # would destroy the file's only real property, that a NEW required-reason
      # call has to change it. The eleven NSPrivacyCollectedDataTypes rows are
      # DERIVED from android-play/data-safety.json rather than written twice, so a
      # Play row cannot flip without this file moving: the same relation limb (E)
      # of the step above already holds between Data safety and content rating.
      #
      # ⚠️ IT PRINTS WHAT IT CANNOT SEE, BECAUSE A GREEN GUARD HERE IS NOT A
      # COMPLETE AUDIT. The COCOAPODS CLOSURE: `Sentry/HybridSDK 8.58.4` is the
      # only vendored native SDK in the bundle and this audit ran on Windows, so
      # its own manifest and signature were NEVER READ — believed is not read, and
      # build-platforms.yml's macOS lane is the place that could settle it from a
      # real Pods/ checkout. The BUILT BUNDLE: Apple assembles its aggregate
      # privacy report from what is actually EMBEDDED, and no compiled .app has
      # been inspected here on any platform. And U-1: sentry_flutter's Dart FFI
      # binding registers the `systemUptime` selector (NSProcessInfo — which IS
      # SystemBootTime, 35F9.1) inside App.framework, the one binary in a Flutter
      # build that can carry no manifest at all because no target owns it.
      # Whether Apple's scanner attributes a dynamic objc_msgSend to it is not
      # knowable outside App Store Connect, so it is NOT declared: a rejected
      # upload is cheap, immediate and unambiguous, and a false sworn declaration
      # is a policy problem that survives.
      #
      # 🔴 WHY THIS STEP IS IN workspace_gate AND NOT IN platform, WHERE IT WAS
      # FIRST WIRED. It landed beside assert-play-declarations in the `platform`
      # job, which is where the other sworn-declaration guards live, and it went
      # RED on the very first CI run of the PR that added it — correctly.
      # Limb 4 derives the plugin set from apps/<app>/.flutter-plugins-dependencies,
      # which is what the Apple build ACTUALLY links and therefore the only
      # derivation of it that cannot go stale. That file is GENERATED and
      # GITIGNORED (apps/subly/.gitignore:30), so it exists on a developer machine
      # that has run `flutter pub get` and does NOT exist in a job that never runs
      # one. `platform` is a Worker lane with no Flutter in it at all, so the guard
      # found no subject and took its COVERAGE LOST path — a refusal, not a false
      # green, which is the behaviour it was written for.
      # ⚠️ tooling/scripts/preflight.mjs CANNOT CATCH THIS CLASS, and its own header
      # already says why: it runs on a machine where the generated file is present.
      # A guard whose subject is gitignored is green locally and red in CI BY
      # CONSTRUCTION. The fix is placement, never a weaker limb — deriving the
      # plugin set from pubspec.yaml instead would answer a different question and
      # let a new plugin ship unaudited.
      # It sits immediately after `flutter pub get --enforce-lockfile` for that
      # reason, and workspace_gate is in ci-gate's `needs`, so the guard still gates
      # every push exactly as it did before the move.
      - name: The Apple privacy manifests still describe the binaries that ship
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/assert-apple-privacy-manifest.mjs
      - name: melos run analyze
        run: |
          export PATH="$PATH:$HOME/.pub-cache/bin"
          melos run analyze
      - name: melos run test
        run: |
          export PATH="$PATH:$HOME/.pub-cache/bin"
          melos run test
      # [pipeline K-15] The web arm of the GPC seam is the one arm the lane
      # above cannot reach: on the VM `navigator` does not exist, so the
      # conditional import resolves to the io arm and the GPC-on cases run
      # against a hand-written double. dart2js in a real Chrome is the ONLY
      # place the truthy-string trap in privacy_signal_web.dart is observable.
      - name: Web arm in a real browser (dart test -p chrome)
        working-directory: packages/core
        run: |
          set -euo pipefail
          export CHROME_EXECUTABLE="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser)"
          echo "Chrome: $CHROME_EXECUTABLE"
          dart test -p chrome

  # 🔴 THE ROOT OF TRUST. `assert-gate-passed.mjs` reads THIS job's check-run
  # conclusion and nothing else, and deploy-web, deploy-workers and
  # build-platforms all refuse to run until it says success — so whatever this
  # job is willing to call green is, transitively, what reaches production.
  # Branch protection reads the same check.
  #
  # Its contract is asserted structurally by `assert-green-means-ran.mjs` §A,
  # which names BOTH aggregators in the repo (this job and build-platforms'
  # `all_platforms`) as targets: the `needs` list must name every other job in
  # the file, `if: always()` must survive, the three non-green verdicts must
  # each be tested with a real `contains(needs.*.result, …)` expression, the
  # body must exit non-zero, the echo must name every lane, and no lane may
  # carry a job-level `if:`. Renaming or deleting this job is COVERAGE LOST
  # there, not a quiet pass. (assert-channel-register.mjs §6 independently
  # covers `all_platforms` via the channel register's `aggregatingJob` pointer;
  # two guards over one job is redundancy, not a conflict.)
  ci-gate:
    name: ci-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [subly_api, platform, tokens, site_shared, content_gate, app_brick, sites, workspace_gate]
    # LOAD-BEARING. Without `always()` this job inherits the default `success()`
    # and would itself report SKIPPED whenever a lane failed — and GitHub counts
    # a skipped required check as SATISFIED, so branch protection would go green
    # over a red tree. The verdict logic below only means anything because this
    # job runs no matter what its lanes did.
    if: always()
    steps:
      - name: Require all lanes green
        run: |
          echo "subly_api=${{ needs.subly_api.result }} platform=${{ needs.platform.result }} tokens=${{ needs.tokens.result }} site_shared=${{ needs.site_shared.result }} content_gate=${{ needs.content_gate.result }} app_brick=${{ needs.app_brick.result }} sites=${{ needs.sites.result }} workspace_gate=${{ needs.workspace_gate.result }}"
          # 🔴 'skipped' IS A VERDICT, NOT AN ABSENCE — added 2026-08-01, the
          # same fix build-platforms.yml's aggregator got on 2026-07-31 and this
          # one did not. One added line — a paths filter to shave the ~6-minute
          # app_brick lane, or `if: github.event_name != 'pull_request'` — would
          # otherwise report the lane as `skipped`, neither of the other two
          # clauses would fire, and ci-gate would conclude SUCCESS over a commit
          # whose brick/stamp lane never ran. Both production deploys would then
          # proceed on that verdict. A lane that did not run has not passed.
          #
          # `sites` was also missing from the echo above, so the line a human
          # reads under-reported coverage (6 of 7) even though contains() saw it.
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ] || [ "${{ contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "::error::One or more CI lanes failed, was cancelled, or never ran — see the verdicts above"; exit 1
          fi
          echo "All lanes green"
