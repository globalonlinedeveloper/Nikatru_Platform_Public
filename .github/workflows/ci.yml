        run: node tooling/ci/assert-no-gate-weakening.mjs
      - name: No hardcoded user-facing strings in the brick
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-no-hardcoded-strings.mjs
      - name: The stop-a-charge copy never claims we cancel or names a debit time
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-stop-copy.mjs
      - name: Every adapter declares where it works
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-adapter-capabilities.mjs
      - name: The inherited screen set is declared, present and reachable
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-screen-set.mjs
      # why its own step when assert-screen-set above already imports it: that
      # import only asks "has it shipped?" to judge a blocker, and a `present`
      # row never asks again. This step holds the callback itself — every native
      # target registers com.nikatru.<id>://auth-callback, the allow list admits
      # every flow, every link-sending call passes its redirect — on every push.
      - name: Every native target registers the app's auth callback, and every link-sending call passes its redirect
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-auth-callbacks.mjs
      - name: Every reachable surface has a width measurement, and every measurement a surface
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-responsive-coverage.mjs
      - name: Every reachable surface has an accessibility sweep, and every sweep a surface
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-a11y-coverage.mjs
      # why beside the sweep accounting above: that guard counts which SURFACES
      # carry a sweep; this one holds three rules over every PRIMITIVE in every
      # tree — a tap target takes the keyboard, a password field autofills, and
      # every stamped web app turns its screen-reader tree on. A sweep walks the
      # router and never reaches a modal sheet; a static read reaches every file.
      - name: Every tap target takes the keyboard, every password field autofills, every web app has a screen-reader tree
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-a11y-primitives.mjs
      - name: A first-run gate is found by its CONTROL, never by its widget type
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-modal-detection.mjs
      - name: Every rollout read is an observed rollout
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-flag-exposure.mjs
      - name: Every app carries a done-record, and its DoD items really run
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-app-dod.mjs
      # why HERE and not in guard-meta: this is the STATIC half of the Dart
      # mutation harness — it resolves every done-record row to a real test
      # declaration and compares each proof against a content hash of the code it
      # probed. It costs milliseconds, needs no Flutter, and unlike
      # assert-app-dod.mjs above it does NOT hold apps/subscriptiontracker exempt,
      # so it is the only thing in CI that grades that app's fourteen rows.
      # The EXECUTED half (--execute, which applies each mutation and requires the
      # named test to go red) is deliberately not wired into any push job: it was
      # measured at 90–140 minutes for a full sweep against a 25-minute cap. The
      # guard's own header carries the measurement and the argument.
      - name: Every mutation proof still addresses the code it was run against
        if: ${{ !cancelled() }}
        run: node tooling/ci/assert-mutation-proofs.mjs

  ff-guards-chassis:
