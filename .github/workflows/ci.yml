name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# NOTE (2026-07-22): the Dart/Flutter per-package lanes (flutter/app, core, api_client,
# design_system, telemetry) were RETIRED — `workspace_gate` runs `melos run analyze` +
# `melos run test` across every Dart workspace member in ONE resolution, which fully
# covers them (analyze = dart analyze per member, infos non-fatal; test = dart test for
# pure-Dart members + flutter test for Flutter members). The lanes below are the ones
# workspace_gate does NOT cover: the TS Workers, the Node token/site builds, and the
# brick-stamp validation.

jobs:
  subly_api:
    name: subly-api Worker (typecheck + dry-run)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/subly-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npx tsc --noEmit
      - run: npx wrangler deploy --dry-run

  platform:
    name: platform Worker (typecheck + test + dry-run)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Additive-only schema guard. Lives in this lane (no new lane) but scans
      # EVERY migration set in the repo — one shared platform_db means one
      # destructive migration is a portfolio-wide outage. Runs before the build
      # so a banned statement fails fast.
      - name: Schema evolution is additive-only
        working-directory: ${{ github.workspace }}
        run: node tooling/ci/check-migrations.mjs
      - run: npm install
      - run: npx tsc --noEmit
      - run: npm test
      - run: npx wrangler deploy --dry-run

  tokens:
    name: Design tokens (build + drift)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/tokens
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - name: Committed token outputs must equal a fresh build
        run: git diff --exit-code -- build

  site_shared:
    name: Shared site build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sites/_shared
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run build

  app_brick:
    name: App brick (stamp both variants + analyze + validate the clone contract)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install mason_cli
        run: dart pub global activate mason_cli

      # ── Variant 1: the DEFAULT stamp — client-only (needs_backend=false).
      # This is what almost every app gets, so it is the one that must not rot.
      - name: Stamp the default (client-only) app
        run: |
          export PATH="$PATH:$HOME/.pub-cache/bin"
          mason get
          mason make app -c tooling/bricks/app/_probe_vars.json -o . --on-conflict overwrite
      - name: SHOW-1 — post_gen appended probe to apps.json (then revert)
        run: |
          grep -q '"slug": "probe"' sites/_shared/_data/apps.json
          git checkout -- sites/_shared/_data/apps.json
      # THE CLONE CONTRACT, asserted rather than documented. A default stamp
      # that quietly regains a Worker/D1/R2 is how the portfolio walks back
      # into the 10-database free-tier ceiling. Checks are structural (the
      # config is parsed, not grepped) — see the script header for why.
      - name: Default stamp claims NO Worker, NO D1 and NO R2
        run: node tooling/ci/assert-clone-contract.mjs --client probe
      - name: Analyze + test the stamped app
        working-directory: apps/probe
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test

      # ── Variant 2: the OPT-IN backend stamp (needs_backend=true). Rarer, but
      # it still has to typecheck and deploy-dry-run.
      - name: Stamp the opt-in backend app
        run: |
          export PATH="$PATH:$HOME/.pub-cache/bin"
          mason make app -c tooling/bricks/app/_probe_backend_vars.json -o . --on-conflict overwrite
          git checkout -- sites/_shared/_data/apps.json
      - name: Backend stamp has a Worker + APP_DB but still no per-app R2
        run: node tooling/ci/assert-clone-contract.mjs --client probe --backend probeapi
      - name: Analyze the stamped backend app
        working-directory: apps/probeapi
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test
      - name: Typecheck + dry-run the stamped service
        working-directory: services/probeapi-api
        run: |
          npm install
          npx tsc --noEmit
          npx wrangler deploy --dry-run

  workspace_gate:
    name: Workspace gate (melos analyze + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.7
      - name: Activate melos
        run: dart pub global activate melos 8.2.2
      # Flutter members require the Flutter tool for root workspace resolution
      # (plain `dart pub get` cannot resolve `sdk: flutter` dependencies).
      - name: Resolve the workspace
        run: flutter pub get
      - name: melos run analyze
        run: |
          export PATH="$PATH:$HOME/.pub-cache/bin"
          melos run analyze
      - name: melos run test
        run: |
          export PATH="$PATH:$HOME/.pub-cache/bin"
          melos run test

  ci-gate:
    name: ci-gate
    runs-on: ubuntu-latest
    needs: [subly_api, platform, tokens, site_shared, app_brick, workspace_gate]
    if: always()
    steps:
      - name: Require all lanes green
        run: |
          echo "subly_api=${{ needs.subly_api.result }} platform=${{ needs.platform.result }} tokens=${{ needs.tokens.result }} site_shared=${{ needs.site_shared.result }} app_brick=${{ needs.app_brick.result }} workspace_gate=${{ needs.workspace_gate.result }}"
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::One or more CI lanes failed"; exit 1
          fi
          echo "All lanes green"
