name: E2E live

run-name: "E2E live against ${{ inputs.auth_target || 'production' }} secrets (${{ github.event_name }})"

# The measurements, retractions and traps behind this file are in
# docs/ci/e2e.md. Only `# why:` lines live here, and
# docs/ci/README.md carries the rules every workflow has to obey.

on:
  workflow_dispatch:
    inputs:
      # why: ONE SUITE, TWO AUTH TARGETS, AND THE NIGHTLY NEVER MOVES. The
      # cutover's blocker was that the live suite could only ever be run against
      # the auth project it was already pointed at, so "does this still pass on
      # Box A" could only be answered inside the cutover window itself. This
      # input answers it on demand, from the same code, before the window.
      # `production` stays the default and the schedule below carries no input
      # at all, so the unattended proof keeps grading production.
      # ⏱ 2026-09-25 — the input names a SECRET SET, not a stack. What the run
      # expects (captcha posture, and whether the Workers trust its issuer) is
      # derived from the chosen SUPABASE_URL and tooling/platform-register.json
      # in the step "Derive what this run expects"; see docs/ci/e2e.md.
      auth_target:
        description: 'Which secret set to run against: production (SUPABASE_*) or selfhosted (SELFHOSTED_SUPABASE_*, Box C).'
        type: choice
        required: false
        default: production
        options:
          - production
          - selfhosted
  # why: 03:17, computed rather than chosen -- including the wrap past midnight,
  # which a sorted list of slots never shows. This lane runs against LIVE Supabase,
  # the live Worker and live D1, so a red night may mean production is broken.
  schedule:
    - cron: '17 3 * * *' # 03:17 UTC nightly

permissions:
  contents: read

jobs:
  prepare:
    name: Derive the app set from the pub workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      apps: ${{ steps.workspace.outputs.apps }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # why: DERIVED, NOT LISTED. A hand-written app list here is a second copy of the
      # workspace, and the copy is the one that rots toward looking healthier.
      - name: The matrix comes from the workspace, never from this file
        id: workspace
        run: |
          set -euo pipefail
          apps="$(node tooling/ci/assert-release-lane-generic.mjs --emit-apps)"
          echo "apps=${apps}" >> "$GITHUB_OUTPUT"
          echo "Driving: ${apps}" >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: Flutter integration_test (live Supabase + D1)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.prepare.outputs.apps) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # why: THE TARGET IS VALIDATED IN ITS OWN STEP, FOR THE SAME REASON THE
      # SITEKEY CHECK IS — AND THIS ONE WAS LEARNED THE EXPENSIVE WAY.
      #
      # `auth_target` is a `type: choice` with exactly the two options declared
      # above, and the `schedule` trigger sends no input at all, so
      # `${{ inputs.auth_target || 'production' }}` can only ever be `production`
      # or `selfhosted`: this refusal is UNREACHABLE today. That is precisely why it may
      # not live inside the secrets preflight. assert-green-means-ran.mjs
      # section B1 asks whether a step that reads a secret and branches on its
      # emptiness contains ANY `exit <n>` (:378-385) — it cannot tell WHICH
      # branch exits. While this arm sat in step `pre`, deleting the REACHABLE
      # missing-secret refusal left this unreachable `exit 1` standing and the
      # guard stayed GREEN. Measured 2026-09-07 against head f045baf9, on a copy
      # of .github/workflows/ with that one edit applied:
      # `node tooling/ci/assert-green-means-ran.mjs <root>` EXIT 0, still
      # printing "1 secret-presence check(s) fail closed"; the identical deletion
      # on origin/main (c6f80ed4), whose step held one `exit`, gave EXIT 1.
      # Hoisted here, step `pre` holds exactly ONE `exit` again and it is the one
      # that protects the live suite.
      - name: Preflight — auth_target must be one of the declared options
        env:
          TARGET: ${{ inputs.auth_target || 'production' }}
        run: |
          set -uo pipefail
          if [ "$TARGET" != 'production' ] && [ "$TARGET" != 'selfhosted' ]; then
            echo "::error title=E2E cannot run::auth_target \"$TARGET\" is not one of production, selfhosted."
            exit 1
          fi
          echo "auth_target=${TARGET} is one of the two declared options."

      # why: A REHEARSAL IS NOT PRODUCTION HEALTH, AND ON main NOTHING CAN TELL
      # THE DIFFERENCE. `tooling/ops/register.json`'s `duty.workflow.e2e.yml` grades
      # the NEWEST run of this workflow on main, and its own text says what that
      # means: "Treat as production until proven otherwise." An `auth_target=boxa`
      # run was the opposite of that claim — it drove a stack the deployed Workers
      # DELIBERATELY refused (one issuer, and it was not Box A), so its failure
      # said nothing about whether production works.
      # ⏱ 2026-09-25 — the targets are now `production` and `selfhosted`, and ANY
      # target but `production` is refused on main: a `selfhosted` run reads a
      # secret set production does not, whatever the Workers trust that day.
      #
      # 🔴 MEASURED 2026-09-12, AND IT COST TWO DEPLOYS. Run 34668296014
      # (auth_target=boxa, on main) failed at 02:43:21Z. assert-ops-register.mjs on the
      # next push read `duty.workflow.e2e.yml — RED SINCE 2026-09-12T02:43:21Z`, that
      # verdict is ENFORCING on push (INV1), so `ci-gate` went red on 0d3e61a8 — and
      # `Deploy web` and `Deploy workers` both refused at their
      # "Require ci-gate to have passed for this commit" step. Nothing was wrong with
      # the deployed system; a rehearsal had been mistaken for it. The hosted control
      # run on the same commit (34668924212) passed 11 minutes later.
      #
      # ⏱ THE FIX IS THE REF, NOT A WEAKER GUARD. The duty query already narrows
      # by `headBranch: main`, so a rehearsal dispatched on ANY other branch is invisible
      # to it while staying fully visible to the person who asked for it. Nothing here
      # is excluded, ignored, or graded more kindly: a HOSTED failure on main still
      # blocks every deploy, exactly as before. Refusing at the ref is also the only
      # shape that cannot drift — there is no list of exempt runs to maintain, and no
      # way to mark a production failure as a rehearsal after the fact.
      - name: Preflight — a rehearsal target may not run on the default branch
        env:
          TARGET: ${{ inputs.auth_target || 'production' }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -uo pipefail
          if [ "$TARGET" != 'production' ] && [ "$REF_NAME" = 'main' ]; then
            echo "::error title=E2E cannot run::auth_target=${TARGET} is a REHEARSAL on a secret set production does not read, and this dispatch is on main. duty.workflow.e2e.yml grades the newest e2e run on main as PRODUCTION health, so a rehearsal failure here turns ci-gate red and every deploy refuses to ship (measured 2026-09-12: run 34668296014 blocked Deploy web and Deploy workers on 0d3e61a8). Dispatch it on a branch at the same commit instead:  git push origin main:rehearse-${TARGET}  &&  gh workflow run e2e.yml --ref rehearse-${TARGET} -f auth_target=${TARGET}"
            exit 1
          fi
          echo "auth_target=${TARGET} on ref ${REF_NAME}: allowed."

      # why: THE TARGET IS NAMED HERE, AND EVERY INPUT THE RUN NEEDS IS CHECKED
      # HERE, AND IT FAILS CLOSED. Each of the three secrets for the chosen set
      # is checked for emptiness BY NAME, and a missing one ENDS the job naming
      # the secret — never a skip, never a fallback. This step does NOT hand the
      # values on, and since 2026-09-25 it writes nothing to $GITHUB_ENV: the
      # target NAME reaches no consumer. What the run expects is written by the
      # step "Derive what this run expects" below. See the block above "Provision
      # throwaway confirmed user" for how the resolved values reach the steps
      # that consume them.
      #
      # 🔴 NO COMMENT MAY SIT INSIDE THE `env:` BLOCK BELOW. assert-green-means-ran.mjs
      # reads a step's env line by line and STOPS at the first line that is not
      # `NAME: value` (:187-188), so one `#` between two bindings hides every
      # binding under it — and with the secret bindings hidden the guard cannot
      # see this preflight at all and exits 2, COVERAGE LOST. Measured on this
      # branch, with a `# why:` inside the block: EXIT 2, "e2e.yml contains no
      # secret-presence check this scan can see". That is the guard working, and
      # it is the reason every `# why:` for a binding lives above its step.
      - name: Preflight — the chosen auth target's secrets must be present
        id: pre
        env:
          TARGET: ${{ inputs.auth_target || 'production' }}
          HOSTED_URL: ${{ secrets.SUPABASE_URL }}
          HOSTED_ANON: ${{ secrets.SUPABASE_ANON_KEY }}
          HOSTED_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SELFHOSTED_URL: ${{ secrets.SELFHOSTED_SUPABASE_URL }}
          SELFHOSTED_ANON: ${{ secrets.SELFHOSTED_SUPABASE_ANON_KEY }}
          SELFHOSTED_KEY: ${{ secrets.SELFHOSTED_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -uo pipefail
          missing=''
          # why: the emptiness of each SECRET is tested BY NAME, not through a
          # shell alias for it. assert-green-means-ran.mjs section B recognises a
          # secret-presence check by finding `-z "$VAR"` for a var this step's
          # `env:` bound to `secrets.*` — indirecting through `key="$HOSTED_KEY"`
          # first makes the preflight invisible to it, and an invisible preflight
          # is how e2e.yml green-skipped its own body once already.
          # 🔴 ONE `exit` IN THIS STEP, AND IT IS THE MISSING-SECRET ONE. The
          # unknown-target arm lives in its own step above; see its `# why:` for
          # the two-tree measurement that forced the split. There is no `else`
          # here that ends the job, so section B1's "does this step exit?" can
          # only ever be answered by the refusal below.
          if [ "$TARGET" = 'selfhosted' ]; then
            prefix=SELFHOSTED_SUPABASE
            if [ -z "$SELFHOSTED_URL" ];  then missing="${missing} SELFHOSTED_SUPABASE_URL"; fi
            if [ -z "$SELFHOSTED_ANON" ]; then missing="${missing} SELFHOSTED_SUPABASE_ANON_KEY"; fi
            if [ -z "$SELFHOSTED_KEY" ];  then missing="${missing} SELFHOSTED_SUPABASE_SERVICE_ROLE_KEY"; fi
          else
            prefix=SUPABASE
            if [ -z "$HOSTED_URL" ];  then missing="${missing} SUPABASE_URL"; fi
            if [ -z "$HOSTED_ANON" ]; then missing="${missing} SUPABASE_ANON_KEY"; fi
            if [ -z "$HOSTED_KEY" ];  then missing="${missing} SUPABASE_SERVICE_ROLE_KEY"; fi
          fi
          if [ -n "$missing" ]; then
            echo "::error title=E2E cannot run::auth_target=${TARGET} needs${missing}, and it is not set. The end-to-end proof did NOT run — this is a failed run, not a skipped one. Add or re-add the secret in Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "auth_target=${TARGET}: ${prefix}_URL, ${prefix}_ANON_KEY and ${prefix}_SERVICE_ROLE_KEY are all present — running the live suite."
          echo "Auth target: **${TARGET}** (${prefix}_*)" >> "$GITHUB_STEP_SUMMARY"

      # why: A SECOND PREFLIGHT, AND THE SEPARATION IS DELIBERATE — IT IS NOT
      # TIDINESS AND IT IS NOT A SECOND CLASS OF CHECK.
      #
      # The sitekey is a repository VARIABLE, public by design: it ships inside
      # the web bundle and is meaningless without the secret half, which never
      # leaves Box A. It still has to be present, for the same reason the three
      # secrets do: an empty `vars.TURNSTILE_SITE_KEY` makes TurnstileGate render
      # SizedBox.shrink(), so the suite signs in with NO captcha token and goes
      # green — and that green says nothing about the stack this lane exists to
      # rehearse, because Box A ENFORCES Turnstile on signup,
      # token?grant_type=password, recover, otp, magiclink and resend (runbook
      # §4.7). Run 34068306612 was exactly that run: green, define empty, and the
      # phase-3 brief refuses it as acceptance (scope §7.4.9).
      #
      # 🔴 WHY IT IS NOT A LIMB OF THE SECRETS PREFLIGHT. assert-green-means-ran.mjs
      # section B1 asks whether a step that reads a SECRET and branches on its
      # emptiness contains ANY `exit <n>` — it cannot tell which branch exits. An
      # extra refusal inside that one step therefore makes its own mutation case
      # (green-means-ran.test.mjs "a secret-presence preflight that does not exit
      # non-zero fails") pass while the secret refusal is gone: measured on this
      # branch, EXIT 0 where the case expects 1.
      #
      # 🔄 CORRECTED 2026-09-07 (second review pass). Splitting the SITEKEY out
      # was necessary and not sufficient: the unknown-`auth_target` arm was still
      # sitting in the secrets preflight as a second, UNREACHABLE `exit 1`, and
      # it kept the guard green over the deletion of the reachable one. It now
      # has its own step too — see the first `# why:` in this job. B1's
      # coarseness is real and is still not edited around here (that guard
      # belongs to the store-lanes unit, scope §5 forbiddenPaths); it is carried
      # as residue R12 in phase3-cutover-blockers.md §8.8, measured in §8.2.
      - name: Preflight — the Turnstile sitekey must be present
        env:
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
        run: |
          set -uo pipefail
          if [ -z "$TURNSTILE_SITE_KEY" ]; then
            echo "::error title=E2E cannot run::the repository VARIABLE TURNSTILE_SITE_KEY is unset, so --dart-define=TURNSTILE_SITE_KEY would arrive empty, TurnstileGate would render nothing, and this run would prove the suite passes WITHOUT the captcha gate. OWNER STEP: Settings → Secrets and variables → Actions → Variables → New repository variable, name TURNSTILE_SITE_KEY, value = the PUBLIC Turnstile sitekey from runbooks/auth-cutover.md section 4 row 5 (a sitekey is public: it ships inside the web bundle; the secret half never leaves Box A). It is a variable, not a secret, and it can be unset again in seconds."
            exit 1
          fi
          echo "TURNSTILE_SITE_KEY is set — the gated screens will render a real widget."

      - name: Stamp this run's build identity (APP_VERSION)
        run: |
          set -euo pipefail
          echo "E2E_APP_VERSION=e2e-${{ github.run_number }}-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "This run stamps app_version=e2e-${{ github.run_number }}-${GITHUB_SHA::7} on every row it writes."

      - uses: ./.github/actions/setup-node

      # why: WHAT THE RUN EXPECTS IS DERIVED FROM FACTS, NOT FROM THE TARGET NAME.
      # Two facts, written to $GITHUB_ENV for every later step:
      #   E2E_STACK          hosted when the chosen SUPABASE_URL is a
      #                      `https://<ref>.supabase.co` origin, else selfhosted —
      #                      the captcha posture to expect;
      #   E2E_WORKERS_TRUST  yes when that origin IS tooling/platform-register.json
      #                      vars.SUPABASE_URL at this sha (the one issuer the
      #                      Workers trust, held equal to all three wrangler
      #                      configs by assert-platform-register LIMB 5), else no —
      #                      everything behind the Worker.
      # The Phase 5 cutover rotates the repo secrets (C6) BEFORE the switch
      # commit moves vars.SUPABASE_URL (C7); a target name could not say what the
      # run in between expects, and these two facts do, with no edit here inside
      # the window. The logic is tooling/e2e/auth_target_expectation.mjs
      # `deriveExpectation`, unit-tested in tooling/ci/test/e2e-verify-target.test.mjs;
      # the URL is a masked secret and only the two words are printed. An
      # underivable run exits 2 and writes nothing, so every consumer refuses too.
      - name: Derive what this run expects (stack and Workers trust)
        env:
          SUPABASE_URL: ${{ (inputs.auth_target || 'production') == 'selfhosted' && secrets.SELFHOSTED_SUPABASE_URL || (inputs.auth_target || 'production') == 'production' && secrets.SUPABASE_URL || '' }}
        run: node tooling/e2e/derive_expectation.mjs
      # why: THE DATABASES COME FROM THE APP ID, AND THIS FILE NAMES NEITHER.
      # tooling/e2e/backend.mjs reads services/<matrix.app>-api/wrangler.jsonc
      # (bindings APP_DB and PLATFORM_DB) and exits 1, naming the file and the
      # binding, when one is missing or when two apps bind the same APP_DB.
      # verify_row, verify_purged and purge resolve the app database themselves
      # from E2E_APP_ID. Only the platform database is handed on, as a step
      # output, because PLATFORM_D1_DATABASE_ID is purge.mjs's SWITCH ("this
      # invocation handles consent"): a step either sets it or leaves it unset.
      # It runs before the first provisioning step, so a refusal here has
      # written nothing to production. Row O-E2E-LANE-WIRED-TO-ONE-APP.
      - name: Resolve this app's databases from its Worker's wrangler file
        id: backend
        env:
          E2E_APP_ID: ${{ matrix.app }}
        run: node tooling/e2e/backend.mjs --app "$E2E_APP_ID" --emit-output

      - uses: ./.github/actions/setup-flutter

      - name: Set up ChromeDriver
        uses: nanasess/setup-chromedriver@e913548694400f275b4070efcd90f47dbbc8914c # v3.0.0

      - name: flutter pub get
        working-directory: apps/${{ matrix.app }}
        run: flutter pub get --enforce-lockfile

      # why: THE RESOLVED VALUES ARE BOUND PER STEP, AND CROSS-CONTAMINATION IS
      # IMPOSSIBLE BY CONSTRUCTION. Two things had to be true at once here.
      #
      # (a) NOTHING JOB-WIDE. A `SUPABASE_SERVICE_ROLE_KEY` written to
      #     $GITHUB_ENV is inherited by EVERY later step in the job, including
      #     the third-party actions this job runs (setup-chromedriver,
      #     upload-artifact). That key is the one that BYPASSES THE TURNSTILE
      #     GATE — tooling/channel-register.json says so in its own row — and it
      #     is why the harness, never the browser, is the only thing that holds
      #     it. On origin/main it was bound per step at five places; it is bound
      #     per step again here, at the eight steps that actually consume it.
      #
      # (b) NO SILENT FALLBACK. A plain `A && B || C` ternary cannot carry the
      #     target axis: an EMPTY SELFHOSTED_* secret is falsey, so the ternary
      #     hands back the PRODUCTION value and the run grades production while
      #     its own name says "selfhosted". The three-armed form below cannot do
      #     that — the second arm tests `== 'production'` rather than being a
      #     bare else, so a selfhosted run with an empty SELFHOSTED_* secret
      #     resolves to the EMPTY STRING and the step dies on its own `need()`
      #     (or, in the derivation step, on exit 2), never on the wrong stack. The
      #     preflight above still fails first, and with the secret's NAME in the
      #     error; this shape is what makes that message the only way through
      #     rather than the only thing standing in the way.
      - name: Provision throwaway confirmed user
        id: user
        env:
          SUPABASE_URL: ${{ (inputs.auth_target || 'production') == 'selfhosted' && secrets.SELFHOSTED_SUPABASE_URL || (inputs.auth_target || 'production') == 'production' && secrets.SUPABASE_URL || '' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ (inputs.auth_target || 'production') == 'selfhosted' && secrets.SELFHOSTED_SUPABASE_SERVICE_ROLE_KEY || (inputs.auth_target || 'production') == 'production' && secrets.SUPABASE_SERVICE_ROLE_KEY || '' }}
        run: node tooling/e2e/provision_user.mjs

      - name: Provision the throwaway user the delete leg destroys
        id: delete_user
        env:
          SUPABASE_URL: ${{ (inputs.auth_target || 'production') == 'selfhosted' && secrets.SELFHOSTED_SUPABASE_URL || (inputs.auth_target || 'production') == 'production' && secrets.SUPABASE_URL || '' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ (inputs.auth_target || 'production') == 'selfhosted' && secrets.SELFHOSTED_SUPABASE_SERVICE_ROLE_KEY || (inputs.auth_target || 'production') == 'production' && secrets.SUPABASE_SERVICE_ROLE_KEY || '' }}
        run: node tooling/e2e/provision_user.mjs

      # why: THE ANSWER TO runbook §4.6's "expected, NOT YET MEASURED", taken on
      # every run rather than once. Shipping TURNSTILE_SITE_KEY to the web build
      # ahead of the cutover is safe only if a hosted GoTrue IGNORES a captcha
      # token it never asked for; on the self-hosted GoTrue the same request must
      # be REFUSED. Both are positive expectations, and the script asserts the
      # one that belongs to this run's E2E_STACK, so neither half can rot unobserved.
      - name: Measure the target's captcha posture (ignores it, or enforces it)
        env:
          SUPABASE_URL: ${{ (inputs.auth_target || 'production') == 'selfhosted' && secrets.SELFHOSTED_SUPABASE_URL || (inputs.auth_target || 'production') == 'production' && secrets.SUPABASE_URL || '' }}
          SUPABASE_ANON_KEY: ${{ (inputs.auth_target || 'production') == 'selfhosted' && secrets.SELFHOSTED_SUPABASE_ANON_KEY || (inputs.auth_target || 'production') == 'production' && secrets.SUPABASE_ANON_KEY || '' }}
        run: node tooling/e2e/captcha_posture.mjs

      # why: apps/<app>/web/flutter_bootstrap.js sets `fontFallbackBaseUrl:
      # "fallback-fonts/"` — a RELATIVE path — and the `-d web-server` dev server
      # answers an unmatched request from `<cwd>/web/…`, i.e. with index.html
      # (HTTP 200, text/html) rather than a 404. CanvasKit therefore got HTML
      # where Roboto should have been and drew NO Latin glyph, while the bundled
      # MaterialIcons asset kept rendering — which is why every e2e screenshot
      # between #567 and today is iconography on blank rows. deploy-web.yml
      # self-hosts the same fonts for production and the Play capture stages them
      # through this very script; the nightly drive was the one lane that staged
      # nothing.
      #
      # Safe across the whole matrix: stageFallbackFonts returns `skipped` for an
      # app whose bootstrap sets no relative fontFallbackBaseUrl
      # (capture-fallback-fonts.mjs bootstrapPosture/`needsStaging`), so an app
      # that does not need the fonts pays nothing and fails nothing.
      #
      # Row O-NIGHTLY-E2E-DRIVES-A-GLYPHLESS-APP. The class guard that keeps any
      # future `-d web-server` drive from losing this step again is
      # tooling/ci/test/web-drive-stages-fonts.test.mjs.
      - name: Stage the fallback fonts the bootstrap points at
        run: node tooling/store/capture-fallback-fonts.mjs --stage apps/${{ matrix.app }}

      - name: Run integration tests (headless Chrome)
        id: drive
        working-directory: apps/${{ matrix.app }}
        env:
          SUPABASE_URL: ${{ (inputs.auth_target || 'production') == 'selfhosted' && secrets.SELFHOSTED_SUPABASE_URL || (inputs.auth_target || 'production') == 'production' && secrets.SUPABASE_URL || '' }}
          SUPABASE_ANON_KEY: ${{ (inputs.auth_target || 'production') == 'selfhosted' && secrets.SELFHOSTED_SUPABASE_ANON_KEY || (inputs.auth_target || 'production') == 'production' && secrets.SUPABASE_ANON_KEY || '' }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          # why: a repository VARIABLE, not a secret. The Turnstile SITE key is
          # public by design — it ships inside the web bundle and is meaningless
          # without the secret half, which lives only on Box A. It can never
          # arrive here empty: the preflight refuses the run when it is unset,
          # because a suite that signs in with no captcha token proves nothing
          # about the stack this lane exists to rehearse.
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          E2E_EMAIL: ${{ steps.user.outputs.email }}
          E2E_PASSWORD: ${{ steps.user.outputs.password }}
          E2E_DELETE_EMAIL: ${{ steps.delete_user.outputs.email }}
          E2E_DELETE_PASSWORD: ${{ steps.delete_user.outputs.password }}
          E2E_TOKEN_HASH: ${{ steps.user.outputs.token_hash }}
          E2E_DELETE_TOKEN_HASH: ${{ steps.delete_user.outputs.token_hash }}
        run: |
          set -euo pipefail
          export CHROME_EXECUTABLE="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser)"
          echo "Chrome: $CHROME_EXECUTABLE"
          chromedriver --port=4444 &
          CHROMEDRIVER_PID=$!
          sleep 3
          # tee'd, not just printed: the step below turns the assertion into a
          # GitHub annotation, and `pipefail` (set above) keeps flutter's exit
          # code as the pipeline's, so teeing cannot mask a failure.
          # 🔴 `--web-port=3000` IS LOAD-BEARING, NOT TIDINESS. [pipeline N-6 leg 6]
          #
          # `flutter drive -d web-server` otherwise serves the app on
          # http://localhost:<RANDOM port>, and every Worker call the suite makes
          # is therefore cross-origin. subscriptiontracker-api.nikatru.com tolerates that: its CORS
          # middleware carries an explicit localhost-any-port exception
          # (services/subscriptiontracker-api/src/middleware/cors.ts:38) added as the INC13 fix,
          # which is why legs 1-2 have always passed.
          #
          # The SHARED platform Worker deliberately does NOT carry that exception
          # — the same file says so in as many words: "It is a PER-APP trade: the
          # shared platform Worker deliberately does not carry it." Its allowlist
          # is exact origins only (services/platform/wrangler.jsonc:48), and the
          # one localhost entry there is the FIXED port 3000.
          #
          # Leg 6 is the first golden-path leg that calls the platform Worker
          # from the browser (`DELETE /v1/account` — the erasure entry point), so
          # it is the first thing a random port breaks. Measured 2026-08-09
          # against the deployed Worker:
          #   Origin: http://localhost:42389 -> preflight 204, NO allow-origin
          #   Origin: http://localhost:3000  -> preflight 204, allow-origin echoed,
          #                                     allow-methods GET, POST, DELETE, OPTIONS
          # The browser blocked the real request, the app never saw a status, and
          # the outcome resolved to `unknown` — "we cannot tell how much of it was
          # removed" — which is exactly what run 31290922922 printed on screen.
          #
          # Pinning the port makes the suite serve from an origin production
          # ALREADY allows, so nothing about the platform Worker's posture
          # changes. `localhost` and not `127.0.0.1`: only the former is on the
          # list (measured — 127.0.0.1:3000 gets no allow-origin), and
          # `--web-hostname` already defaults to localhost.
          #
          # 🔴 `--browser-dimension` IS THE SIZE LEVER; `--window-size` NEVER WAS.
          # From this suite's first commit (c478ef35, 2026-07-18) until
          # 2026-09-23 the drive passed `--web-browser-flag=--window-size=430,932`,
          # and flutter drive then resized the window to its own
          # `--browser-dimension` default, 1600x1024, over it. Every frame was
          # 1600x881, the desktop layout; E2E live run 35824787614 read that off
          # screenshots/00-consent.png. `WxH@dpr` is the form the store capture
          # already uses (tooling/store/capture-play-screenshots.mjs). It sets
          # the viewport exactly, 430x932 at DPR 1, which is a phone layout and
          # the size tooling/e2e-leg-register.json framesCarryText was measured at.
          flutter drive \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/app_test.dart \
            -d web-server --web-port=3000 --browser-name=chrome \
            --web-browser-flag=--headless=new \
            --web-browser-flag=--disable-gpu \
            --web-browser-flag=--no-sandbox \
            --web-browser-flag=--disable-dev-shm-usage \
            --browser-dimension=430x932@1 \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=APP_VERSION="$E2E_APP_VERSION" \
            --dart-define=E2E_EMAIL="$E2E_EMAIL" \
            --dart-define=E2E_PASSWORD="$E2E_PASSWORD" \
            --dart-define=E2E_DELETE_EMAIL="$E2E_DELETE_EMAIL" \
            --dart-define=E2E_TOKEN_HASH="$E2E_TOKEN_HASH" \
            --dart-define=E2E_DELETE_TOKEN_HASH="$E2E_DELETE_TOKEN_HASH" \
            --dart-define=TURNSTILE_SITE_KEY="$TURNSTILE_SITE_KEY" \
            --dart-define=E2E_EXPECT_CAPTCHA_GATE="$E2E_EXPECT_CAPTCHA_GATE" \
            --dart-define=E2E_EXPECT_WORKERS_TRUST="$E2E_WORKERS_TRUST" \
            --dart-define=E2E_DELETE_PASSWORD="$E2E_DELETE_PASSWORD" 2>&1 | tee "${RUNNER_TEMP}/drive.log"
          kill "$CHROMEDRIVER_PID" || true

      - name: Surface the failing assertion
        if: failure() && steps.drive.outcome == 'failure'
        run: |
          set -uo pipefail
          log="${RUNNER_TEMP}/drive.log"
          if [ ! -s "$log" ]; then
            echo "::error title=E2E failed before the suite ran::flutter drive produced no output — the failure is above this step (build, chromedriver or dart-define)."
            exit 0
          fi
          # One line per failing test, plus the first assertion line under it.
          # `Failure in method:` is flutter_driver's own heading for the decoded
          # blob, so this reads the human-readable half, not the JSON.
          grep -E '^(Failure in method:|Expected:|  Actual:|   Which:)' "$log" \
            | head -40 > "${RUNNER_TEMP}/why.txt" || true
          if [ ! -s "${RUNNER_TEMP}/why.txt" ]; then
            echo "::error title=E2E failed::The suite failed but no assertion heading was found in the driver output — open the 'Run integration tests' log and the e2e-screenshots artifact."
            exit 0
          fi
          while IFS= read -r line; do
            case "$line" in
              'Failure in method:'*) echo "::error title=E2E test failed::${line}" ;;
              *) echo "::error::${line}" ;;
            esac
          done < "${RUNNER_TEMP}/why.txt"
          {
            echo '### Nightly E2E — failing assertions'
            echo ''
            echo '```'
            cat "${RUNNER_TEMP}/why.txt"
            echo '```'
            echo ''
            echo 'Screenshots up to the failure are in the `e2e-screenshots` artifact on this run.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the row landed in live D1
        env:
          E2E_USER_ID: ${{ steps.user.outputs.user_id }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          E2E_APP_ID: ${{ matrix.app }}
        run: node tooling/e2e/verify_row.mjs

      # why: THE ONE-ISSUER FACT, ASSERTED IN BOTH DIRECTIONS RATHER THAN SKIPPED.
      # The Workers trust exactly one issuer (runbook Phase 5), the register's
      # vars.SUPABASE_URL, so a JWT from any other issuer must be REFUSED by the
      # deployed Worker — and one from that issuer must be accepted. Which of the
      # two this run expects is E2E_WORKERS_TRUST. Running this on every target
      # means the refusal is exercised code, not a comment, and the day it flips
      # the run says so instead of a golden-path leg going red for a reason
      # nobody can read off the screenshot.
      - name: The Workers trust exactly one issuer (positive, both targets)
        env:
          SUPABASE_URL: ${{ (inputs.auth_target || 'production') == 'selfhosted' && secrets.SELFHOSTED_SUPABASE_URL || (inputs.auth_target || 'production') == 'production' && secrets.SUPABASE_URL || '' }}
          SUPABASE_ANON_KEY: ${{ (inputs.auth_target || 'production') == 'selfhosted' && secrets.SELFHOSTED_SUPABASE_ANON_KEY || (inputs.auth_target || 'production') == 'production' && secrets.SUPABASE_ANON_KEY || '' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ (inputs.auth_target || 'production') == 'selfhosted' && secrets.SELFHOSTED_SUPABASE_SERVICE_ROLE_KEY || (inputs.auth_target || 'production') == 'production' && secrets.SUPABASE_SERVICE_ROLE_KEY || '' }}
          E2E_EMAIL: ${{ steps.user.outputs.email }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: node tooling/e2e/assert_one_issuer.mjs

      - name: Verify the in-app deletion really purged (leg 6)
        env:
          SUPABASE_URL: ${{ (inputs.auth_target || 'production') == 'selfhosted' && secrets.SELFHOSTED_SUPABASE_URL || (inputs.auth_target || 'production') == 'production' && secrets.SUPABASE_URL || '' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ (inputs.auth_target || 'production') == 'selfhosted' && secrets.SELFHOSTED_SUPABASE_SERVICE_ROLE_KEY || (inputs.auth_target || 'production') == 'production' && secrets.SUPABASE_SERVICE_ROLE_KEY || '' }}
          E2E_DELETE_USER_ID: ${{ steps.delete_user.outputs.user_id }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          E2E_APP_ID: ${{ matrix.app }}
        run: node tooling/e2e/verify_purged.mjs

      - name: Verify the consent artifact landed in platform_db
        env:
          E2E_APP_ID: ${{ matrix.app }}
          E2E_RESPONSE_DATA: apps/${{ matrix.app }}/build/integration_response_data.json
          E2E_DRIVE_LOG: ${{ runner.temp }}/drive.log
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PLATFORM_D1_DATABASE_ID: ${{ steps.backend.outputs.platform_db }}
        run: node tooling/e2e/verify_consent.mjs

      # why: THE STAGING STEP ABOVE PROVES THE FONTS WERE PLACED. THIS PROVES
      # THEY WERE DRAWN. A `-d web-server` drive whose fallback fonts never
      # arrived exits 0 — the dev server answers the missing `fallback-fonts/…`
      # request with index.html, HTTP 200, text/html, never a 404 — so CanvasKit
      # renders the bundled MaterialIcons and no Latin glyph, and every other
      # check in this job stays green over an artifact of blank rows. That is
      # what the store listing shipped from #567 to #854.
      #
      # The verdict is on the RUN, the unit the defect has: missing fonts are
      # missing from every page at once. Per frame, the ink the 9x9 glyph
      # filter removes; the run's median must reach
      # tooling/e2e-leg-register.json framesCarryText.minMedianRemovedInk,
      # measured 2026-09-23 on real served and glyphless frames at the
      # --browser-dimension above. A per-frame self-ratio did not separate at DPR 1
      # (the table is in that block's `_why`). Frames of another width are
      # exit 2: change the window size and re-measure the block together.
      #
      # It runs BEFORE the upload and the upload is `always()`, so a glyphless
      # run is red HERE and its frames are still attached to the run for
      # somebody to open. Gated on the drive succeeding: a drive that failed
      # wrote a partial set, and grading that would report the wrong defect.
      #
      # Row O-NIGHTLY-E2E-DRIVES-A-GLYPHLESS-APP. Exit 2 from this step is
      # COVERAGE LOST — no frames at all — and is not a pass.
      #
      # 🔴 --single-threaded, like every step that starts a relaunching guard:
      # the pixel loop can deadlock this process at exit (nodejs/node#54918;
      # CI run 36192015901 killed it at 120 s where the same pages took 3 s).
      - name: The captured frames carry drawn text
        if: steps.drive.outcome == 'success'
        run: node --single-threaded tooling/e2e/assert-frames-carry-text.mjs apps/${{ matrix.app }}/screenshots

      - name: Upload per-page screenshots
        if: always() && steps.user.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-screenshots-${{ matrix.app }}
          path: apps/${{ matrix.app }}/screenshots/
          if-no-files-found: warn

      # why: always(), because this lane writes into PRODUCTION Supabase and live D1. A
      # failed run that skipped its own cleanup leaves the rows behind.
      - name: Purge test data (always — keep prod pristine)
        if: always() && steps.user.outcome != 'skipped'
        env:
          SUPABASE_URL: ${{ (inputs.auth_target || 'production') == 'selfhosted' && secrets.SELFHOSTED_SUPABASE_URL || (inputs.auth_target || 'production') == 'production' && secrets.SUPABASE_URL || '' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ (inputs.auth_target || 'production') == 'selfhosted' && secrets.SELFHOSTED_SUPABASE_SERVICE_ROLE_KEY || (inputs.auth_target || 'production') == 'production' && secrets.SUPABASE_SERVICE_ROLE_KEY || '' }}
          E2E_USER_ID: ${{ steps.user.outputs.user_id }}
          E2E_APP_ID: ${{ matrix.app }}
          E2E_RESPONSE_DATA: apps/${{ matrix.app }}/build/integration_response_data.json
          E2E_DRIVE_LOG: ${{ runner.temp }}/drive.log
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PLATFORM_D1_DATABASE_ID: ${{ steps.backend.outputs.platform_db }}
        run: node tooling/e2e/purge.mjs

      - name: Purge the delete-leg user too (already gone on a green run)
        if: always() && steps.delete_user.outcome != 'skipped'
        env:
          SUPABASE_URL: ${{ (inputs.auth_target || 'production') == 'selfhosted' && secrets.SELFHOSTED_SUPABASE_URL || (inputs.auth_target || 'production') == 'production' && secrets.SUPABASE_URL || '' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ (inputs.auth_target || 'production') == 'selfhosted' && secrets.SELFHOSTED_SUPABASE_SERVICE_ROLE_KEY || (inputs.auth_target || 'production') == 'production' && secrets.SUPABASE_SERVICE_ROLE_KEY || '' }}
          E2E_USER_ID: ${{ steps.delete_user.outputs.user_id }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          E2E_APP_ID: ${{ matrix.app }}
        run: node tooling/e2e/purge.mjs

  alert:
    name: Open or refresh the nightly-failure issue
    needs: e2e
    # why: schedule only. A dispatched red is somebody already watching; an unattended
    # red is the one nobody sees. The issue is REUSED and never auto-closed --
    # closing it is the acknowledgement that a human looked.
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: File the failure against one durable issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TITLE: 'Nightly E2E (live) is failing against production'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          note="Failed: [run ${GITHUB_RUN_ID}, attempt ${GITHUB_RUN_ATTEMPT}](${RUN_URL}) at $(date -u '+%Y-%m-%d %H:%M UTC')."

          # Quoted heredoc on purpose — the body is markdown full of backticks,
          # and an unquoted one would execute them as commands. The body lines
          # below sit at the block scalar's own indent, which YAML strips, so the
          # heredoc terminator really is at column 0 by the time bash sees it.
          body="${RUNNER_TEMP}/e2e-alert.md"
          { printf '%s\n\n' "$note"; cat <<'BODY'
          The nightly **E2E (live)** run is red. It runs unattended at 03:17 UTC against
          LIVE Supabase auth, the live Cloudflare Worker and live D1 — so a failure may
          mean the deployed Subly app is broken for real users, not merely that a test
          is flaky. Treat it as production until proven otherwise.

          **This issue is reused.** Every later nightly failure is added here as a
          comment instead of opening a new issue, and it is not closed automatically.
          It stays open until a human closes it; closing it *is* the acknowledgement
          that someone looked.

          Where to start:
          - the red **annotations at the top of the run page** — the `Surface the failing
            assertion` step lifts the failing test name and its `Expected/Actual` out of
            the driver's one-line JSON blob, so the actual assertion is readable without
            opening the log
          - the failing step in the run linked above
          - the `e2e-screenshots` artifact attached to that run — one screenshot per page
          - whether `Purge test data` still ran (it is `if: always()`), or a throwaway
            user and its D1 rows are now stranded in production
          - re-run via **Actions → E2E (live) → Run workflow** to tell a real regression
            apart from a flake

          Filed automatically by the `alert` job in `.github/workflows/e2e.yml`.
          BODY
          } > "$body"

          # Looked up through the LIST api, not the search index: search lags
          # behind writes, and a lookup that misses opens a duplicate.
          existing="$(gh issue list --state open --limit 200 --json number,title \
            --jq '[.[] | select(.title == env.TITLE) | .number] | first // empty')"

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still red. ${note}"
            url="${GITHUB_SERVER_URL}/${GH_REPO}/issues/${existing}"
            echo "::warning title=Nightly E2E still failing::commented on the already-open issue #${existing}"
          else
            url="$(gh issue create --title "$TITLE" --body-file "$body")"
            echo "::error title=Nightly E2E failed::opened ${url}"
          fi

          echo "Nightly E2E failure tracked at ${url}" >> "$GITHUB_STEP_SUMMARY"
