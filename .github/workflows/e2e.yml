bsolute rather than a defect. THE COVERAGE HOLE IS UNCHANGED BY THE WIRING ABOVE: giveup-verify.mjs went from quarantined to wired on 2026-08-26 and reads fixtures-giveup and fixtures, not one fixtures-adv shape, so the eight named above are still eight. ALSO REPAIRED 2026-08-26, and it is not an assertion change: this suite hard-coded PORT 8913 with no override and shares that port with claim-reduction.mjs, so an orphan of its own earlier run left it unrunnable until somebody found and killed a process. It now reads PORT from the environment, the way giveup-verify.mjs and v3acts-probe.mjs already did. claim-lib.mjs does NOT hard-code it - serve(dir, port) takes the port as an argument - so nothing outside this unit had to change, and the counts above were re-measured after the change and did not move." }
            ];
            /* APPENDED 2026-08-26 — THE ASYMMETRY NAMED IN THE COMMENT ABOVE IS
               CLOSED, BELOW, and that paragraph is left standing word for word
               as the record of the day it was open and of what it cost. The
