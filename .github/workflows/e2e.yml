            const here = process.env.SUITE_DIR || "";
            const files = fs.readdirSync(".").filter(f => f.endsWith(".mjs")).sort();
            const src = new Map(files.map(f => [f, fs.readFileSync(f, "utf8")]));
            const libs = files.filter(g => files.some(f => f !== g && src.get(f).includes("./" + g)));
