              while (i < s.length) {
                if (s[i] === "/" && s[i + 1] === "*") { const e = s.indexOf("*/", i + 2); i = e < 0 ? s.length : e + 2; o += " "; continue; }
                if (s[i] === "/" && s[i + 1] === "/" && s[i - 1] !== ":") { const e = s.indexOf("\n", i); i = e < 0 ? s.length : e; o += " "; continue; }
