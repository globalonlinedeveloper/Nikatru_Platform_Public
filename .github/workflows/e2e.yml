name: E2E

# Playwright downloads a browser and drives a real extension, so this is slow
# and it never blocks a PR by default. It runs weekly, on demand, or on a PR
# the moment someone adds the `run-e2e` label.
#
# Unlike ci.yml this needs no scripts/ gate: a suite is a `node <name>.mjs` in a
# tool's own test/e2e directory, which is how they already run locally.
#
# ⚠️ THAT SENTENCE READ "each suite is `node run.mjs`" UNTIL 2026-08-25, AND THE
# SINGULAR WAS THE WHOLE DEFECT IN ONE LINE. run.mjs is one entrypoint of TEN in
# Extension/Full_Screen_Shot/test/e2e; the other nine had never executed in this
# workflow, so a green E2E tick spoke for a tenth of the directory it named. The
# `Run every suite` step below derives the set rather than naming it — and it is
# the comment on that step, not this paragraph, that carries which suites are
# wired, which are quarantined and why.

on:
  schedule: [{ cron: '17 4 * * 1' }]          # Mondays 04:17 UTC
  pull_request:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    name: Discover e2e suites
    if: github.event_name != 'pull_request' || github.event.label.name == 'run-e2e'
    runs-on: ubuntu-latest
    outputs:
      suites: ${{ steps.set.outputs.suites }}
      count: ${{ steps.set.outputs.count }}
    steps:
      - uses: actions/checkout@v7

      # Derived, not listed — the same rule as the CI matrix. A tool joins the
      # e2e run by having test/e2e/package.json, not by being named here.
      - id: set
        name: Find every <Category>/<Tool>/test/e2e suite
        run: |
          node -e '
            const fs = require("fs"), path = require("path");
            // templates/ is what a tool is stamped from, not a tool. (_skeleton/ was
            // its pre-move location — see MIGRATION.md — kept as new-tool.mjs fallback.)
            const SKIP = new Set(["templates", "_skeleton", "node_modules"]);
            const dirs = p => fs.readdirSync(p, { withFileTypes: true })
                                .filter(d => d.isDirectory() && !d.name.startsWith(".") && !SKIP.has(d.name))
                                .map(d => d.name);
            const out = [];
            for (const cat of dirs("."))
              for (const tool of dirs(cat))
                if (fs.existsSync(path.join(cat, tool, "test", "e2e", "package.json")))
                  out.push({ dir: `${cat}/${tool}`, slug: `${cat}-${tool}` });
            fs.appendFileSync(process.env.GITHUB_OUTPUT,
              `suites=${JSON.stringify(out)}\ncount=${out.length}\n`);
            console.log(`${out.length} e2e suite(s): ${out.map(o => o.dir).join(", ") || "(none)"}`);
          '

      # An empty matrix is a skipped job, and a skipped job looks exactly like a
      # passing one on the checks list. At least one tool ships an e2e suite
      # today, so zero means discovery broke — or the suites were deleted, in
      # which case delete this workflow too rather than leaving it green.
      - name: A run that found nothing is not a pass
        if: steps.set.outputs.count == '0'
        run: |
          echo "::error::no <Category>/<Tool>/test/e2e/package.json found — this workflow would have run nothing and reported success."
          exit 1

  e2e:
    name: e2e · ${{ matrix.suite.dir }}
    needs: discover
    # `result == 'success'` is stated rather than left implicit: on a PR without
    # the label the discover job is skipped, its outputs are empty strings, and
    # `'' != '0'` is TRUE — a condition that reads as "there is work" at the
    # exact moment there is none, and fromJSON('') would then error inside the
    # matrix rather than in a step anyone can read.
    if: needs.discover.result == 'success' && needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    # 45 until 2026-08-25, when it was sized for ONE suite. The five wired
    # suites total 685s (11m25s) on the author machine — run.mjs 122s,
    # claim-reduction 79s, reduction-corpus 451s, batch-artifact 15s,
    # v3acts-probe 18s — so 75 leaves a two-core runner room to be three times
    # slower and still finish, dependency install included. It is the BACKSTOP
    # and not the hang detector: the per-suite cap inside the run step below is
    # the finer instrument, and it names the suite that hung.
    #
    # 2026-08-26 — SIX wired suites, not five: giveup-verify.mjs came off the
    # quarantine list below after three green re-measurements, and it is 113s
    # on the same machine. The total is 798s (13m18s).
    #
    # 🔴 READ THE HEADROOM ON THE BASIS THE SENTENCE ABOVE USES — DEPENDENCY
    # INSTALL INCLUDED. That is where its "three times" came from: 75 min
    # against 685s is 6.6x raw, and roughly half the budget is reserved for
    # npm ci and the Chromium download, which leaves the ~3x it quotes.
    # Against 798s the same arithmetic is 5.6x raw and about 2.8x once install
    # is reserved the same way. SO THE HEADROOM WENT DOWN — three times slower
    # to 2.8 times slower — because the suite total went UP. An earlier version
    # of this paragraph printed 5.6 here, which is 75*60/798 with install
    # EXCLUDED: the method changed mid-comment, in the looser direction, and
    # the printed figure rose while the thing it measures fell. A ratio here is
    # meaningless without its basis beside it, so: 2.8x, INSTALL INCLUDED.
    # The number below is unchanged deliberately — raising a backstop is how a
    # hang stops being a NAMED per-suite failure and becomes an unreadable job
    # timeout instead — but 2.8x is the figure to re-measure against when the
    # seventh suite is wired, not 5.6x.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.discover.outputs.suites) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.suite.dir }}/test/e2e/package-lock.json

      - name: Install e2e dependencies
        working-directory: ${{ matrix.suite.dir }}/test/e2e
        run: npm ci

      - name: Install Chromium
        working-directory: ${{ matrix.suite.dir }}/test/e2e
        run: npx playwright install --with-deps chromium

      # The runner loads the extension straight from the tool directory — no
      # build step, which is also the repo's law for the extensions themselves.
      #
      # 🔴 `run: node run.mjs` WAS THIS ENTIRE STEP UNTIL 2026-08-25, AND THAT IS
      # WHY A GREEN E2E TICK PROVED LESS THAN ANY READER WOULD TAKE IT FOR.
      # Measured that day in Extension/Full_Screen_Shot/test/e2e: twelve `.mjs`
      # files — two libraries and TEN runnable entrypoints, of which NINE had
      # never executed in this workflow once. It is the same disease the `A run
      # that found nothing is not a pass` step above exists to prevent, one
      # level down: not a job that ran nothing, but a job that ran a tenth of
      # the directory it names and reported success for all of it.
      #
      # DERIVED, NOT LISTED — the rule the discover job already follows. A
      # sibling `.mjs` is a LIBRARY when another file in the same directory
      # imports it by relative path (today claim-lib.mjs and png.mjs, and no
      # others) and a SUITE otherwise. Ten names typed here would recreate the
      # defect the day an eleventh landed, silently, which is exactly how this
      # one was made. The classifier prints what it decided on every run, and
      # the package.json cross-check exists because a classifier that swallows a
      # real suite fails in the one direction nobody looks.
      #
      # ONE STEP RATHER THAN A SECOND MATRIX DIMENSION, on purpose. The suites
      # bind fixed localhost ports (8907 · 8911 · 8913 twice · 8915 · 8917 ·
      # 8921 · 8127 · 8131 · 8145 — two of them collide, so the set was never
      # safe to run concurrently on one machine anyway) and they all write into
      # the single `out/` directory the upload step below collects. Ten legs
      # would mean ten partial `out/`s under one artifact name, and ten Chromium
      # downloads for suites measured at fifteen seconds to seven and a half
      # minutes each.
      #
      # 2026-08-26 — the "8913 twice" above is still true of the DEFAULTS, and
      # that pair is claim-reduction.mjs and adversarial-claim.mjs. The second
      # of them now reads `PORT` from the environment (giveup-verify.mjs and
      # v3acts-probe.mjs already did), so the collision — and an orphaned
      # listener from a killed run, which is the same symptom — is escapable
      # without editing a suite. claim-reduction.mjs still hard-codes it.
      #
      # EVERY SUITE RUNS EVEN AFTER ONE FAILS, AND THE JOB STILL GOES RED. The
      # step collects failures and exits non-zero at the end. That is the
      # opposite of `continue-on-error`: stopping at the first red would hide
      # the state of the others behind whichever one broke first, and
      # `continue-on-error` would hide all of them behind a green tick.
      #
      # ⚠️ EXPECT THE FIRST RUNS OF THIS STEP TO BE RED, AND READ THE RED BEFORE
      # BLAMING THE STEP. Measured 2026-08-25 on the author machine: run alone
      # TWICE, before and after, reduction-corpus.mjs is 1196 pass / 0 fail and
      # exit 0 both times (451s on the first, which is the timed one) — that is
      # the control, and it is why the sentence below is a claim about the
      # SEQUENCE rather than about the suite; run THIRD in this
      # step, on the same tree the same afternoon, it is 612 pass / 25 fail in
      # 301s — and EIGHTEEN of those twenty-five are one assertion repeated on
      # eighteen fixtures, `A0 requested records the setting that was actually
      # on`, answering false; the other seven are the counters that follow from
      # it. Nothing about redaction changed between the two: the suite asks
      # for `redactPII: true` as soon as the service worker appears, and
      # background.js's `chrome.runtime.onInstalled` handler writes the whole
      # DEFAULTS object (in which redactPII is false) on `install`. Whichever
      # write lands second wins, so a busier machine silently captures with
      # redaction OFF and every claim-lib suite grades a pass that never ran.
      # The repair belongs in test/e2e/claim-lib.mjs — its `setSettings` should
      # read the patch back and not return until it has stuck — and NOT here: a
      # sleep in this step, or a retry around a failing suite, would convert a
      # race that CI has just exposed back into a green tick. A two-core runner
      # is the slow machine this favours.
      - name: Run every suite in test/e2e (derived, not listed)
        working-directory: ${{ matrix.suite.dir }}/test/e2e
        env:
          SUITE_DIR: ${{ matrix.suite.dir }}
        run: |
          node -e '
            const fs = require("fs"), cp = require("child_process");
            /* QUARANTINE — the only file names typed anywhere in this step, and
               each one carries the MEASUREMENT that put it here and the date it
               was taken. It is not a skip list to reach for when something is
               inconvenient: an entry is a suite measured RED, with its exit
               code, and a red suite is neither wired (a permanently red weekly
               job teaches everyone to stop reading the tick) nor silenced —
               every entry prints a ::warning:: on EVERY run, and an entry
               naming a file this directory no longer has FAILS the job, so the
               note cannot outlive its subject. Emptying this list is the goal.
               Adding to it without an exit code beside the name is not what it
               is for, and neither is editing a suite until it goes quiet.

               🟢 RETIRED FROM THIS LIST, 2026-08-26 — giveup-verify.mjs, now
               WIRED. THE ENTRY IS RETIRED IN WRITING RATHER THAN DELETED IN
               SILENCE, and it is reproduced below VERBATIM as it stood in the
               array on 6ee4c73 — the original dated sentence, byte for byte,
               and not a summary of it. A paraphrase of a measurement is not
               the measurement: it drops the evidence the finding rested on
               and it leaves a later reader nothing to check the correction
               AGAINST. Append beneath, never rewrite above — which is what the
               redaction-claim.mjs and adversarial-claim.mjs entries in the
               array below already do, in place, twice.

               ── VERBATIM, AS COMMITTED AT 6ee4c73 ──
              { dir: "Extension/Full_Screen_Shot", file: "giveup-verify.mjs",
                why: "2026-08-25, exit 1, 107 pass 5 fail. NOT a stale suite and NOT quiet: on iframe-door it reports 1 readable-but-unentered frame while matchedComplete stays true and the payload prints (whole count), with an address, a phone and a card still legible in the delivered PNG; on defercap the payload says (PARTIAL count) while the screen says a whole-count sentence. That is the spec 2.1.1 rule - anywhere the pipeline gives up on something, that fact is recorded, carried and reaches the surface - failing in the direction of a person believing more was covered than was. Left unwired because it is red today, NOT because the finding is doubted. Somebody who owns the source has to answer it; this note is here so the answer is not postponed by silence." },
               ── END VERBATIM ──

               APPENDED 2026-08-26 - the sentence above stood when it was
               written and is left standing; this block says only what changed
               and when. RE-MEASURED THREE TIMES on current main (6ee4c73),
               alone, nothing else driving a browser: EXIT 0, 112 pass / 0 fail
               / 3 note on every run, 113s on the third (the timed one). Both
               shapes that reddened it - iframe-door and defercap - pass by
               name now. So the suite is WIRED rather than quarantined, and it
               is absent from the array below for that reason and no other.
               The record is what is restored here; the un-quarantining stands.

               THE ASYMMETRY THAT MAKES THIS COMMENT NECESSARY: the stale-entry
               check below fails the job when a note outlives its FILE, and
               nothing at all catches a note that outlives its MEASUREMENT. A
               green re-measurement therefore has to be recorded in writing, or
               wiring a suite is indistinguishable from quietly dropping a
               skip. That gap is NAMED here and is deliberately NOT closed
               here - closing it needs a new guard clause and a decision about
               what makes a measurement stale.

               THE 3 THAT REMAIN ARE NOTE, NOT FAIL, and NOTE is not graded.
               Two verdict-shaped STRINGS survive FS_ENVELOPE_VERDICT, which
               closes the acts block by allowlist and booleans by shape but
               grades no string in a scope section 5 leaves open. The two are
               NOT the same case: redaction.kinds.assessment="clean" sits
               INSIDE the redaction block, in kinds, which is not an
               ALLOWLISTED SCOPE (the suite labels it exactly so - a summary
               string in kinds, which is not an allowlisted scope), and only
               notes[0] is outside the redaction block. The third note is a
               canvas-pii reference line. None of the three is a red. */
            const QUARANTINE = [
              { dir: "Extension/Full_Screen_Shot", file: "privacy-verify.mjs",
                why: "2026-08-25, exit 1, 297 pass 1 fail - canvas-pii check B2, stray=27 of 27. The 27 pixels are not a block the ledger missed: the canvas-pii fixture paints its canvas text with a fillStyle ONE STEP off the block literal (rgb 16,16,16 against a block of rgb 17,17,17), and the antialiasing ramp from that ink to white passes exactly through the block colour - which B2 counts by exact equality, on purpose, because PNG is lossless. test/e2e/README.md already states the rule the fixture breaks (no text colour may sit within tolerance of the block colour). The repair belongs to the FIXTURE, not to the suite and not to the product, and the suite wires the day it lands. Untested on Linux, where the ramp will produce a different count." },
              { dir: "Extension/Full_Screen_Shot", file: "review-keyboard.mjs",
                why: "2026-08-25, exit 1. Grades the CURRENT record shape and is the only tier that presses real keys, so this is a live disagreement rather than a retired suite. On review-tall.html the capture comes back 1280x3708 with acts matched=null painted=0 ledger=partial and ZERO marks, on a fixture that carries an example.com address and a Luhn-valid card; P0 wants at least 2 marks past the 3136px tiling floor, so P1, P2 and the whole focus-trap block cascade off it and the run ends in a TimeoutError on the review zoom control. Cause NOT established from this side - either the pass really paints nothing on a capture that tall, or the record is read before it finishes. Compare privacy-verify on sr-only, which reports ledger=present matched=3 on a short page." },
              { dir: "Extension/Full_Screen_Shot", file: "redaction-claim.mjs",
                why: "2026-08-25, exit 1, 151 pass 199 fail 30 open. RE-MEASURED 2026-08-26 on the same tree, alone, nothing else driving a browser: exit 1, 151 pass 199 fail 30 open - not one number moved. Retired, not broken: every failure reads redaction.state, redaction.pixels or the scan and bake ledgers, and REDACTION-CLAIM-SPEC.md 2.2 (Removed - do not leave the old field beside the new one) deletes all four. The product line it grades renders correctly in the same run. It cannot be repaired into green, only replaced: the sections every check cites (2.6, 3.7, 5.4, 6.1, 7.1, E8, E13) are sections of the PRE-REDUCTION REDACTION-CLAIM-SPEC.md, which was rewritten in place, and not one of them is in the file today - so there is nothing left to grade AGAINST. Replacing it is already done - reduction-corpus.mjs grades this identical fixture directory (test/e2e/fixtures, all 17 shapes) against the current spec, is wired, and is green. APPENDED 2026-08-26 - the sentence above stood when it was written and is left standing, but its LAST CLAUSE IS WRONG BY MEASUREMENT and the correction goes here. all 17 shapes is not what reduction-corpus.mjs grades. Parsed from the registration table of every .mjs in the directory rather than grepped for filenames: this suite registers 17 fixtures/ shapes, reduction-corpus.mjs registers 13 of them, and the 4 it does not reach are before-content, clipped-ancestor, input-values and svg-text. before-content is covered by batch-artifact.mjs, which is wired. THE OTHER THREE - clipped-ancestor, input-values, svg-text - appear in NO other suite in this directory, wired or quarantined, so retiring this file would orphan them outright. Retiring it therefore does not cost nothing: it costs those three shapes, and the cost is recorded here so nobody derives it a fourth time. A second number in the same family: claim-reduction.mjs overlaps by 5 of the 17, not 8 - its corpus is 8 shapes, but 3 of those are fixtures-adv. ON THE SPEC SECTIONS the sentence above is right about the list it names and understates the rest: of the 35 distinct section numbers this suite cites, 27 have no heading in REDACTION-CLAIM-SPEC.md today, and E1 through E16 are all gone because the current spec carries no E-numbered list at all. The 8 numbers that do still resolve (2.1, 2.2, 2.3, 3, 3.2, 3.3, 3.4, 3.5) are numbers REUSED FOR DIFFERENT CONTENT rather than sections that stayed put - 3.3 is The marks today, and it is the clause that retired the rule adversarial-claim U9 grades." },
              { dir: "Extension/Full_Screen_Shot", file: "adversarial-claim.mjs",
                why: "2026-08-25, exit 1. RE-MEASURED 2026-08-26, the number the entry never carried: exit 1, 102 pass 65 fail 3 open, 0 ESCAPES, 11 fixtures. The same retired record shape and the same spec 2.2 row as redaction-claim.mjs - 44 of the 65 failures are four universals repeated over the 11 fixtures (U2 state inside the closed set, U5 and U6 the scan and bake ledger sums, U7 the state sentence on a permanent surface), all reading fields 2.2 deleted. U9 (no rectangle geometry travels on the record) fails BECAUSE the spec amended that absolute: 3.3 now persists redaction.marks for verified-opaque blocks on purpose, so the check is grading a rule that was deliberately retired. Its own log shows the product answering correctly (Redaction on. 3 matched, 3 painted, 3 confirmed opaque in this image.) while the suite reads undefined off fields that no longer exist. CORRECTION to the note this replaces, which said it was superseded in coverage: only its ASSERTIONS are. it runs test/e2e/fixtures-adv, a DIFFERENT corpus - thirteen shapes in the directory, eleven of them in this suite - and reduction-corpus.mjs reaches five of the thirteen (details-closed, object-door, split-token, wrapped-token, mixed-owntext), claim-reduction.mjs three of those same five. canvas-combo, cv-tabs, frame-pii, honest-article, honest-pii, late-frame, late-swap and shadow-closed-frame are graded by NO wired suite today, and frame-pii is not in this suite either, so it has never had one. That is a live coverage hole and retiring this entry would close it by assertion rather than by test. AND TWO OF THE 65 ARE NOT RECORD-SHAPE AT ALL - they are read off the delivered PNG and they survive the retirement, so somebody who owns content/capture.js has to answer them: on cv-tabs the image comes back with the VISIBLE panel marker at 0 rows and 33 rows of block colour, on details-closed 23 rows of block colour with the PII marker at 0. Both are an opaque block painted at coordinates taken from a subtree the renderer never drew (a collapsed details, an inactive content-visibility tab panel), landing on rendered text that held no PII, while marks x43 y334 w189 h23 and kinds email 1 point a reader at a rect that never held the email. Under the reduced design that is not a false coverage claim - the acts 1/1/1 are all true - so it is not what reddens this suite and it must not be graded by re-arming it; it is a capture-fidelity defect and it needs an owner of that file. APPENDED 2026-08-26 - the sentences above stood when they were written and are left standing; this block says what changed and when. NUMBERS: re-measured twice back to back on 6ee4c73, port 8913 confirmed free before each, exit 1, 106 pass 61 fail 3 open, 0 ESCAPES, 11 fixtures, both times. The 102/65/3 above was taken before PR #23; four checks that failed then pass now. THE CAPTURE-FIDELITY LIMB IS ANSWERED AND THAT PARAGRAPH IS NOW HISTORY: clause 3b in content/capture.js (commit 5121633, merged as 6ee4c73) gives measure() a liveness test, and the same two fixtures now come back details-closed block rows 0 with marks empty and kinds empty, cv-tabs block rows 10 with the VISIBLE panel phone marker at 10 - the residue of 10 is subpixel antialiasing on the fixture tab-button labels, which is fixtures-adv breaking the tolerance rule test/e2e/README.md states, not the product. So this entry no longer asks anyone to answer that; it has been answered. WHAT DID NOT MOVE is the record-shape limb. 61 failures still read fields 2.2 deleted, and U9 still fails on exactly ONE fixture of the eleven - honest-pii, the only shape in this corpus with a verified-opaque block - because 3.3 REQUIRES precisely the geometry U9 forbids: its ledger is marks x24 y165 w189 h23, x132 y253 w145 h23, x175 y392 w171 h23 beside acts matched 3 painted 3 verifiedOpaque 3. On the other ten fixtures nothing is verified opaque, no marks are persisted, and U9 passes - which is the cleanest available proof that U9 grades a retired absolute rather than a defect. THE COVERAGE HOLE IS UNCHANGED BY THE WIRING ABOVE: giveup-verify.mjs went from quarantined to wired on 2026-08-26 and reads fixtures-giveup and fixtures, not one fixtures-adv shape, so the eight named above are still eight. ALSO REPAIRED 2026-08-26, and it is not an assertion change: this suite hard-coded PORT 8913 with no override and shares that port with claim-reduction.mjs, so an orphan of its own earlier run left it unrunnable until somebody found and killed a process. It now reads PORT from the environment, the way giveup-verify.mjs and v3acts-probe.mjs already did. claim-lib.mjs does NOT hard-code it - serve(dir, port) takes the port as an argument - so nothing outside this unit had to change, and the counts above were re-measured after the change and did not move." }
            ];
            /* APPENDED 2026-08-26 — THE ASYMMETRY NAMED IN THE COMMENT ABOVE IS
               CLOSED, BELOW, and that paragraph is left standing word for word
               as the record of the day it was open and of what it cost. The
               guard is the quarantine audit at the end of this step. The
               argument for what STALE was taken to mean, the three designs that
               were rejected and why, and the list of what the choice CANNOT
               catch, are written there beside the code rather than here. */
            const here = process.env.SUITE_DIR || "";
            const files = fs.readdirSync(".").filter(f => f.endsWith(".mjs")).sort();
            const src = new Map(files.map(f => [f, fs.readFileSync(f, "utf8")]));
            const libs = files.filter(g => files.some(f => f !== g && src.get(f).includes("./" + g)));
            const all = files.filter(f => !libs.includes(f));
            console.log(`${files.length} .mjs file(s) in ${here}/test/e2e: ${all.length} suite(s) [${all.join(" ")}], ${libs.length} librar(y/ies) [${libs.join(" ") || "none"}]`);
            /* package.json is an INDEPENDENT statement of what is runnable here.
               If the library rule ate something it names, say so and stop. */
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const named = [...new Set(Object.values(pkg.scripts || {})
              .flatMap(c => [...String(c).matchAll(/node\s+([A-Za-z0-9._-]+\.mjs)/g)].map(m => m[1])))];
            const lost = named.filter(n => !all.includes(n));
            if (lost.length) {
              console.log(`::error::package.json runs ${lost.join(", ")}, which this step did not classify as a suite. Either the file is gone or the library rule swallowed it; either way it must not go unrun.`);
              process.exit(1);
            }
            /* Every quarantine filter from here down is keyed on SUITE_DIR, so
               an empty SUITE_DIR does not mean there is nothing quarantined, it
               means this step cannot tell WHAT is quarantined and would sail
               past the whole list reporting ok. Coverage lost is not a pass. */
            if (!here) {
              console.log(`::error::SUITE_DIR is empty, so no quarantine entry can be matched to this directory. Every quarantine check below would have scanned nothing and reported success.`);
              process.exit(1);
            }
            const mine = QUARANTINE.filter(q => q.dir === here);
            const stale = mine.filter(q => !all.includes(q.file));
            if (stale.length) {
              console.log(`::error::the quarantine names ${stale.map(q => q.file).join(", ")}, which is not a suite in ${here}/test/e2e any more. Delete the entry along with the file, or fix the name — a quarantine note that outlives its subject is how a skip becomes permanent.`);
              process.exit(1);
            }
            /* An entry is a MEASUREMENT, and the comment on the array has said
               in prose since the list existed that adding to it without an exit
               code beside the name is not what it is for. From here down that
               sentence is executable. The LAST date and the LAST exit code in an
               entry are the claim being made TODAY, because this list is
               append-only by law: a re-measurement is appended beneath the
               sentence it corrects and never written over it, so the newest
               number in the string is the live one and the older ones are the
               record of how it got there. */
            const claimOf = q => {
              const dates = [...q.why.matchAll(/\b20\d\d-\d\d-\d\d\b/g)].map(m => m[0]);
              const exits = [...q.why.matchAll(/\bexit\s+(\d+)\b/g)].map(m => Number(m[1]));
              return { date: dates[dates.length - 1], exit: exits[exits.length - 1] };
            };
            const unmeasured = mine.filter(q => claimOf(q).date === undefined || claimOf(q).exit === undefined);
            if (unmeasured.length) {
              console.log(`::error::the quarantine entr(y/ies) for ${unmeasured.map(q => q.file).join(", ")} carry no measurement. A date and an exit code have to be IN the note: without them there is nothing for the audit below to check the note against, and the entry is an opinion with a filename on it rather than a finding.`);
              process.exit(1);
            }
            const notRed = mine.filter(q => claimOf(q).exit === 0);
            if (notRed.length) {
              console.log(`::error::the quarantine entr(y/ies) for ${notRed.map(q => q.file).join(", ")} record exit 0. This list holds suites measured RED; an entry recording a GREEN measurement is a skip with a date on it. Wire the suite and retire the entry in writing.`);
              process.exit(1);
            }
            /* Every entry still prints on every run. The wording moved from NOT
               RUN to NOT GRADED on 2026-08-26, because the audit at the end of
               this step now RE-RUNS these suites. It never GRADES them — a
               quarantined suite that is still red is a warning and nothing
               more — so the tick this job puts on the checks list means exactly
               what it meant before. */
            for (const q of mine) {
              const c = claimOf(q);
              console.log(`::warning::NOT GRADED — ${q.file} (recorded ${c.date}, exit ${c.exit}; re-run below, verdict only): ${q.why}`);
            }
            const suites = all.filter(f => !mine.some(q => q.file === f));
            /* Zero suites is not a pass. A step that runs nothing exits 0, and
               on the checks list that is indistinguishable from every suite
               passing — the same argument as the discover job above. */
            if (!suites.length) {
              console.log(`::error::every .mjs in ${here}/test/e2e is a library or quarantined — this step was about to run nothing and report success.`);
              process.exit(1);
            }
            /* THE AUDIT AT THE END SPENDS ONLY WHAT THE WIRED SUITES DID NOT.
               Half of the 75-minute job backstop is reserved for npm ci and the
               Chromium download — that is the basis the timeout comment on this
               job states, and it is used here in that form and not in a looser
               one — which leaves this step about 37 minutes of its own. 35 is
               taken, so the clock kept here always expires BEFORE the job
               backstop and the log ends in a named budget line instead of an
               unreadable job timeout. The wired loop below is never cut short by
               it: the deadline is read only after that loop has finished, so the
               headroom the wired suites might need on a slow runner is not
               touched, the 2.8x figure the comment above quotes is unchanged,
               and a run that leaves nothing over audits nothing and says so. */
            const STEP_BUDGET_MS = 35 * 60 * 1000;
            const AUDIT_FLOOR_MS = 2 * 60 * 1000;
            const DEADLINE = Date.now() + STEP_BUDGET_MS;
            const failed = [];
            for (const s of suites) {
              const t = Date.now();
              console.log(`::group::node ${s}`);
              /* A per-suite cap, so a hung suite is a NAMED failure instead of
                 a job timeout that says only that the step ran out of wall
                 clock. Twenty minutes against a slowest suite measured at 451s
                 on the author machine: room for a much slower runner before the
                 cap, rather than the suite, is the thing that bites. */
              const r = cp.spawnSync(process.execPath, [s], { stdio: "inherit", timeout: 20 * 60 * 1000 });
              console.log("::endgroup::");
              const code = r.error ? 1 : (r.status === null ? 1 : r.status);
              const extra = r.error ? ` (${r.error.message})` : (r.signal ? ` (signal ${r.signal})` : "");
              /* `e2e-suite` prefixes the line because the suites print their
                 own PASS/FAIL at column 0 as well (run.mjs does), and a log a
                 person greps has to distinguish one assertion from a verdict
                 on a whole suite. */
              console.log(`e2e-suite ${code === 0 ? "PASS" : "FAIL"}  ${s}  exit=${code}${extra}  ${Math.round((Date.now() - t) / 1000)}s`);
              if (code !== 0) failed.push(`${s} exit ${code}${extra}`);
            }
            if (failed.length) {
              console.log(`::error::${failed.length} of ${suites.length} e2e suite(s) failed: ${failed.join("; ")}`);
            }
            /* ── QUARANTINE AUDIT — ADDED 2026-08-26 ───────────────────────────
               THE GAP THIS CLOSES is the one the comment on the array names in
               its own words: the stale-entry check above fails the job when a
               note outlives its FILE, and until today nothing at all caught a
               note that outlived its MEASUREMENT. Two of those had just been
               found BY HAND, which is the only way they could be found.
               giveup-verify.mjs sat on the list as failing and re-measured
               GREEN — 112 pass, 0 fail, 3 note — and had been green for some
               time with nobody the wiser. adversarial-claim.mjs recorded 102
               pass 65 fail 3 open and measured 106 / 61 / 3 the next day. A
               stale quarantine is worse than no quarantine, because it reads as
               a considered decision and it is read by people who were not there.

               WHAT STALE IS TAKEN TO MEAN HERE, and the whole check follows from
               this one sentence: an entry ASSERTS THAT A SUITE IS RED, and it is
               stale when that assertion is no longer true. So the audit re-runs
               each quarantined suite and grades the NOTE — red against green,
               and nothing finer than that.

               WHY NOT AN AGE CEILING, which is the obvious design and which this
               corpus already runs deliberately in assert-platform-proof-fresh.
               It is refuted by the very evidence that motivated this check: BOTH
               drifts above happened in ONE DAY, measured 2026-08-25 and
               different on 2026-08-26. No ceiling that is not absurd catches a
               one-day drift, so an age rule would have printed green through
               both of the two cases it exists for. It reddens on the calendar,
               and the calendar is not the thing that moved.

               WHY NOT RE-AFFIRMATION BY HAND — a human touching the date when
               the numbers move. That is precisely the discipline already in
               force here, and it is the discipline that failed twice in one day.
               A rule that is cheaper to satisfy by editing a date than by taking
               a measurement is not a rule.

               WHY THE NUMBERS ARE NOT COMPARED, ONLY THE VERDICT. Re-running and
               diffing the COUNTS is the strongest-sounding option and it is
               unavailable here, on a basis this file already carries the proof
               of: the recorded counts were taken on the author machine, alone,
               with nothing else driving a browser, and the paragraph above this
               step records reduction-corpus.mjs at 1196 pass 0 fail run alone
               against 612 pass 25 fail run third in this same step, on the same
               tree, the same afternoon. A CI count set beside an author-machine
               count differs for reasons that have nothing to do with staleness,
               so a count comparison would redden on the RUNNER while calling it
               a stale note — a figure quoted without its basis, which is the
               exact mistake the timeout comment on this job spends a paragraph
               on. Counts stay a human duty and this check does not pretend
               otherwise.

               WHY RUNNING A KNOWN-RED SUITE IN CI IS SAFE HERE: it is
               non-blocking in the only direction that matters. A quarantined
               suite that is still red produces a ::warning:: and CANNOT fail the
               job, so nothing currently red is made to pass and no permanently
               red weekly job is created — which is the reason the array gives
               for not wiring these, and that reason still holds unchanged. The
               job goes red on exactly one event: a suite exits 0 while the entry
               beside it says it is red. That is not bad news about a suite, it
               is good news about a suite and bad news about the note, and it is
               the event nobody was watching for.

               A RUN THAT DID NOT COMPLETE PROVES NOTHING AND MAY NOT CORROBORATE.
               A suite killed by the budget exits non-zero, which is what a
               still-red suite also looks like; counting that as agreement would
               let a suite that has quietly gone green keep its entry forever, on
               evidence that is really only evidence about the clock. Killed runs
               are UNVERIFIED and are reported by name.

               WHAT THIS CANNOT CATCH, written down so nobody has to derive it a
               second time. (1) Count drift while the verdict holds — the second
               case above, 102/65/3 to 106/61/3, would still sit here unnoticed,
               for the basis reason given above. (2) A note whose PROSE reasoning
               has been overtaken while its red is still real: adversarial-claim
               U9 grades a retired absolute, and the suite is red either way, so
               this audit would report STANDS on it. (3) An entry naming a `dir`
               that no longer has a test/e2e suite at all — no matrix leg is
               created for it, so no leg matches it, and it is invisible to the
               per-directory checks here exactly as it is invisible to the
               stale-entry check above. (4) Anything whatsoever on a run where
               the wired suites use the whole budget, which is why that case says
               COVERAGE LOST and never ok. */
            const audited = { stands: [], contradicted: [], unverified: [] };
            if (!mine.length) {
              console.log(`::notice::quarantine audit: ${here}/test/e2e has NO quarantine entries, so this audit checked NOTHING. That is the goal state for the list and it is printed rather than passed over in silence, because a check that reached nothing must not be able to certify anything.`);
            }
            for (const q of mine) {
              const c = claimOf(q);
              const left = DEADLINE - Date.now();
              if (left < AUDIT_FLOOR_MS) {
                audited.unverified.push(`${q.file} (budget spent before it started, ${Math.round(left / 1000)}s left)`);
                console.log(`e2e-quarantine UNVERIFIED  ${q.file}  not started`);
                continue;
              }
              const qt = Date.now();
              console.log(`::group::quarantine audit — node ${q.file} (recorded ${c.date}, exit ${c.exit})`);
              const qr = cp.spawnSync(process.execPath, [q.file], { stdio: "inherit", timeout: Math.min(left, 20 * 60 * 1000) });
              console.log("::endgroup::");
              const qs = Math.round((Date.now() - qt) / 1000);
              if (qr.error || qr.status === null) {
                audited.unverified.push(`${q.file} (run did not complete: ${qr.error ? qr.error.message : "signal " + qr.signal})`);
                console.log(`e2e-quarantine UNVERIFIED  ${q.file}  ${qs}s`);
              } else if (qr.status === 0) {
                audited.contradicted.push(`${q.file} (recorded exit ${c.exit} on ${c.date}, exited 0 here)`);
                console.log(`e2e-quarantine CONTRADICTED  ${q.file}  recorded=${c.exit} observed=0  ${qs}s`);
              } else {
                audited.stands.push(q.file);
                console.log(`e2e-quarantine STANDS  ${q.file}  recorded=${c.exit} observed=${qr.status}  ${qs}s`);
              }
            }
            if (audited.unverified.length) {
              console.log(`::warning::quarantine audit COVERAGE LOST — ${audited.unverified.length} of ${mine.length} entr(y/ies) in ${here} were NOT verified on this run: ${audited.unverified.join("; ")}. Those notes are unchecked, and unchecked is not confirmed.`);
            }
            if (audited.contradicted.length) {
              console.log(`::error::the quarantine is out of date: ${audited.contradicted.join("; ")}. An entry here is a MEASUREMENT saying the suite is red, and this one just passed. Re-measure it, then either wire the suite and retire the entry IN WRITING beneath the original sentence, or append the number that keeps it here. Editing the sentence above it is not one of the options.`);
            }
            if (failed.length || audited.contradicted.length) process.exit(1);
            console.log(`${suites.length} e2e suite(s) ran, all green${mine.length ? ` — and ${mine.length} quarantined suite(s) were re-run but NOT graded: ${audited.stands.length} still red as recorded, ${audited.unverified.length} unverified` : ` — the quarantine list for ${here} is empty, which is the goal`}`);
          '

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-out-${{ matrix.suite.slug }}
          path: ${{ matrix.suite.dir }}/test/e2e/out/**
          retention-days: 7
          if-no-files-found: ignore
