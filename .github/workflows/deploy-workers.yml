name: Deploy workers

run-name: "Deploy workers from ${{ github.ref_name }} (${{ github.event_name }})"

# Everything this file does, and every rule it has to obey, is in
# docs/ci/deploy-workers.md. Only `# why:` lines live here.

on:
  push:
    branches: [main]
    paths:
      - 'services/subscriptiontracker-api/**'
      - 'services/platform/**'
      # why: services/_shared is a BUILD INPUT of both Workers and lives outside
      # both service directories — the incident-#155 shape if it went unnamed.
      - 'services/_shared/**'
      # why: src/config.ts imports catalog/apps.json and esbuild INLINES it, so
      # the app set the live Worker serves is decided at build time. Named as
      # the exact file, not catalog/**, for the same reason as below.
      - 'catalog/apps.json'
      # why: contracts/entitlement is a build input of the platform Worker;
      # scoped to *.js/*.json so a README edit cannot redeploy production.
      - 'contracts/entitlement/*.js'
      - 'contracts/entitlement/*.json'
      # why: src/lib/bundle/availability.ts imports these three and esbuild
      # INLINES them, so the bundle set, the extension set and the channel
      # map the live Worker serves are all decided at build time. Named as
      # exact files, not catalog/** or tooling/**, for the same reason
      # catalog/apps.json is: a broad glob would redeploy production on an
      # unrelated edit.
      - 'catalog/bundles.json'
      - 'extensions/catalog/extensions.json'
      - 'tooling/channel-register.json'
      - '.github/workflows/deploy-workers.yml'
  workflow_dispatch:

concurrency:
  group: deploy-workers
  cancel-in-progress: false

# why: least privilege, and `deployments: write` sits on the two jobs that
# record a deployment marker rather than on every job. [pipeline F-11]
permissions:
  contents: read
  checks: read

jobs:
  detect:
    name: Detect changed services
    runs-on: ubuntu-24.04
    # why: 25 because the gate check polls for up to assert-gate-passed.mjs's own
    # 1200 s default; this job's longest recorded run is 20m06s. [pipeline F-5b]
    timeout-minutes: 25
    outputs:
      subscriptiontracker_api: ${{ steps.decide.outputs.subscriptiontracker_api }}
      platform: ${{ steps.decide.outputs.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        # why: persist-credentials: false — checkout otherwise leaves
        # GITHUB_TOKEN in .git/config for the whole job. [zizmor artipacked]
        with:
          persist-credentials: false

      # why: the gate lives in `detect`, so it blocks BOTH deploy jobs and runs
      # before `d1 migrations apply --remote`, which is irreversible.
      - name: Require ci-gate to have passed for this commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node tooling/ci/assert-gate-passed.mjs ${{ github.sha }}

      # why: EVERY trigger path must be claimed by a filter, and every filter
      # must claim this workflow file and everything its service imports from
      # outside its own directory. #155 is what the omission costs.
      # tooling/ci/assert-deploy-triggers-deploy.mjs fails the build on both.
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        if: github.event_name == 'push'
        with:
          filters: |
            subscriptiontracker_api:
              - 'services/subscriptiontracker-api/**'
              - 'services/_shared/**'
              # why: since 2026-09-15 src/routes/webhooks.ts imports the RevenueCat
              # event vocabulary from contracts/entitlement/contract.js, which
              # esbuild inlines — the comment under `platform` below predates it.
              - 'contracts/entitlement/*.js'
              - '.github/workflows/deploy-workers.yml'
            platform:
              - 'services/platform/**'
              - 'services/_shared/**'
              # why: the inlined app catalogue — see the trigger list. subscriptiontracker-api
              # does not read it.
              - 'catalog/apps.json'
              # why: subscriptiontracker-api deliberately does NOT claim contracts/entitlement
              # — it imports nothing from contracts/ and restates its own money
              # environment in src/lib/money.ts.
              - 'contracts/entitlement/*.js'
              - 'contracts/entitlement/*.json'
              # why: the three inlined bundle inputs — see the trigger list.
              # subscriptiontracker-api reads none of them.
              - 'catalog/bundles.json'
              - 'extensions/catalog/extensions.json'
              - 'tooling/channel-register.json'
              - '.github/workflows/deploy-workers.yml'
      - id: decide
        # why: manual dispatch has no diff to filter on → deploy both.
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "subscriptiontracker_api=true"  >> "$GITHUB_OUTPUT"
            echo "platform=true"   >> "$GITHUB_OUTPUT"
          else
            echo "subscriptiontracker_api=${{ steps.filter.outputs.subscriptiontracker_api }}" >> "$GITHUB_OUTPUT"
            echo "platform=${{ steps.filter.outputs.platform }}"   >> "$GITHUB_OUTPUT"
          fi

  subscriptiontracker-api:
    name: Deploy subscriptiontracker-api
    needs: detect
    if: needs.detect.outputs.subscriptiontracker_api == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # why: job-level, so `detect` does not inherit write access it never uses.
    permissions:
      contents: read
      checks: read
      deployments: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - run: npm ci
        working-directory: services/subscriptiontracker-api
      # why: MIGRATIONS BEFORE DEPLOY. The schema standard is additive-only, so
      # new columns are harmless to code that predates them; deploying code that
      # reads a column the database lacks is an outage. Expand, then deploy.
      - name: Apply APP_DB migrations (before deploy)
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: '4.129.0'   # why: package.json says ^4.0.0, which floats. [F-2]
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: services/subscriptiontracker-api
          command: d1 migrations apply APP_DB --remote
      # why: [pipeline K-7] a statement's legality is a property of the ENGINE.
      # D1's authorizer refused the erasure routes' `pragma_table_info` join at
      # runtime while every static check stayed green. Blocking, and exit 2
      # ("could not look") blocks too.
      - name: The deployed SQL is SQL live D1 will run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tooling/ops/check-d1-accepts-live-sql.mjs
      # why: `id: deploy` is the only step whose success means "this is what
      # subscriptiontracker-api.nikatru.com is running"; the record step below is conditioned on it.
      # why: the two `--var`s are supplied at DEPLOY time — GLITCHTIP_DSN is a
      # write-only ingest key, and RELEASE is the SHA, not API_VERSION.
      - uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        id: deploy
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: '4.129.0'   # why: package.json says ^4.0.0, which floats. [F-2]
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: services/subscriptiontracker-api
          command: deploy --var GLITCHTIP_DSN:${{ secrets.GLITCHTIP_DSN }} --var RELEASE:${{ github.sha }}
      # why: `build` is a separate field from `version` on /v1/health — `version`
      # is the literal "v1" and a smoke joined to it would pass forever.
      # `--require-ok` is a separate conjunct: deployed-and-unwell is not good.
      - name: Smoke — the live Worker answers at THIS commit
        run: >
          node tooling/ops/post-deploy-smoke.mjs
          --url https://subscriptiontracker-api.nikatru.com/v1/health
          --field build --expect ${{ github.sha }} --require-ok

      # why: conditioned on the DEPLOY, not on the smoke. A provenance record
      # must be conditioned on the act it describes, never on a later verdict
      # about that act (deploy-web.yml run 144). The smoke still fails the job.
      - name: Record the deployed SHA
        if: always() && steps.deploy.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tooling/ci/record-deployment.mjs subscriptiontracker-api https://subscriptiontracker-api.nikatru.com

  platform:
    name: Deploy platform
    needs: detect
    if: needs.detect.outputs.platform == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # why: job-level, so `detect` does not inherit write access it never uses.
    permissions:
      contents: read
      checks: read
      deployments: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - run: npm ci
        working-directory: services/platform
      # why: MIGRATIONS BEFORE DEPLOY — see the subscriptiontracker-api job. platform is the
      # SOLE applier of platform_db migrations.
      - name: Apply PLATFORM_DB migrations (before deploy)
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: '4.129.0'   # why: package.json says ^4.0.0, which floats. [F-2]
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: services/platform
          command: d1 migrations apply PLATFORM_DB --remote
      # why: [pipeline K-7] see the subscriptiontracker-api job. This Worker binds subscriptiontracker_db as
      # well as platform_db, so the check executes against both — a route reads
      # the databases it reads, not the ones its Worker binds.
      - name: The deployed SQL is SQL live D1 will run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tooling/ops/check-d1-accepts-live-sql.mjs
      # why: ONE deploy per job, and it carries the vars. A second, unqualified
      # `wrangler deploy` (the action's default command) wiped both --vars off
      # the live Worker for two days — run 30891499182. Secrets upload BEFORE
      # the command, so do not copy this shape to a Worker that does not exist
      # yet: a new Worker needs one deploy before its first secret.
      - uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        id: deploy
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: '4.129.0'   # why: package.json says ^4.0.0, which floats. [F-2]
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: services/platform
          secrets: |
            SUPABASE_ANON_KEY
          command: deploy --var GLITCHTIP_DSN:${{ secrets.GLITCHTIP_DSN }} --var RELEASE:${{ github.sha }}
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      # why: see the identical step in the subscriptiontracker-api job. Until this line
      # nothing ever asked this Worker whether it had actually come up.
      - name: Smoke — the live Worker answers at THIS commit
        run: >
          node tooling/ops/post-deploy-smoke.mjs
          --url https://platform.nikatru.com/v1/health
          --field build --expect ${{ github.sha }} --require-ok

      # why: conditioned on the DEPLOY, not on the smoke — see the subscriptiontracker-api
      # job. "Which sha is live on platform" is the first question of every
      # incident, and it must not be lost because a health probe was red.
      - name: Record the deployed SHA
        if: always() && steps.deploy.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tooling/ci/record-deployment.mjs platform https://platform.nikatru.com
