name: Deploy workers

# Everything this file does, and every rule it has to obey, is in
# docs/ci/deploy-workers.md. Only `# why:` lines live here.

on:
  # why: RUNS ONLY AS ci.yml's `deploy-workers` CALL JOB, after ci-gate, on a push to
  # main ([ADR 095] §4). ci-gate is a `needs:` of the call, so it has passed before
  # `d1 migrations apply --remote`, which is irreversible, can start. So has ci.yml's
  # `platform-db-migrate` (migrate-platform-db.yml): platform_db is migrated BEFORE any
  # job here deploys a Worker that reads it (row O-APP-WORKERS-DEPLOY-BEFORE-THE-MIGRATION).
  # There is no
  # push trigger, paths list, dispatch or detect job: each job's plan step decides
  # from its own unit in tooling/ci/lane-map.json deployUnits, and
  # tooling/ci/assert-deploy-triggers-deploy.mjs grades those units (this file, and
  # everything each service imports from outside its own directory — #155).
  workflow_call:
    # why: NAMED, NOT INHERITED — a name the call forgets fails at startup.
    secrets:
      # why: NOT required (rv2-security-001). Every job here that reads it is bound to
      # `production`, and GitHub resolves a production ENVIRONMENT secret of this name ahead of
      # the value passed in. Once the owner moves the token out of repository scope the caller
      # passes an empty string, and the environment copy is what deploys.
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      GLITCHTIP_DSN:
        required: true
      SUPABASE_ANON_KEY:
        required: true

concurrency:
  group: deploy-workers
  cancel-in-progress: false

# why: least privilege, and `deployments: write` sits on the two jobs that
# record a deployment marker rather than on every job. [pipeline F-11]
permissions:
  contents: read

jobs:
  # why: THE MATRIX IS READ, NEVER WRITTEN HERE (row O-SERVICE-KIT-UNBUILT). One leg per
  # `appWorkers` row of tooling/platform-register.json whose services/<dir> exists,
  # printed by tooling/ci/worker-set.mjs after it has held EVERY Worker to its row, its
  # committed lockfile and its `dsnSecret`. The serving Worker (platform) is split off
  # by its register row, not by its name, and deploys in its own job below.
  workers:
    name: The app Worker set comes from the register
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      workers: ${{ steps.set.outputs.workers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The matrix comes from worker-set.mjs, never from this file
        id: set
        run: |
          set -euo pipefail
          workers="$(node tooling/ci/worker-set.mjs --for-deploy --json --app-workers)"
          if [ "$workers" = "[]" ]; then
            echo "::error::worker-set.mjs names no app Worker, and a matrix over none fails: the register holds no appWorkers row with a services/ directory."
            exit 1
          fi
          echo "workers=${workers}" >> "$GITHUB_OUTPUT"

  # why: EVERY APP WORKER, ONE LEG EACH, IN THE SAFETY ORDER (row O-SERVICE-KIT-UNBUILT):
  # plan → npm ci → migrations (only when the row's Worker migrates a D1) → the live-SQL
  # check → the ONE deploy, which carries the vars (a new Worker is created by it) →
  # smoke → record. assert-deploy-triggers-deploy.mjs grades that order
  # for every entry worker-set.mjs prints. fail-fast off: one Worker's red leaves every
  # other leg's deploy, and fails this job, so the platform job below does not start.
  app-worker:
    name: Deploy ${{ matrix.worker.worker }}
    needs: workers
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # why: THE ENVIRONMENT, AND WHY IT IS NOT THE REFUSAL (row O-DEPLOY-IS-NOT-ONE-GATED-LANE,
    # limb 2). GitHub pauses on and records the environment a job names, but a name nobody
    # created is created on first use with no protection rules and no branch policy, so
    # this line alone fails open. The first step after checkout is the refusal until
    # `production` allows main only. Held by assert-workflow-hardening limb 10.
    environment: production
    # why: job-level, so a job that records nothing never holds write access.
    permissions:
      contents: read
      deployments: write
    strategy:
      fail-fast: false
      matrix:
        # why: ONE dimension whose values are worker-set.mjs's entries ({worker, dir,
        # migrations, smokeUrl, origin, dsnSecret}), so every key a step reads is
        # `matrix.worker.<field>` of a dimension declared right here (limb A′ of
        # assert-release-lane-generic.mjs reads the declaration).
        worker: ${{ fromJSON(needs.workers.outputs.workers) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # why: the plan reads ancestry and a diff against the live SHA, which a
          # depth-1 clone does not hold; plan-deploy.mjs exits 1 on a shallow clone.
          fetch-depth: 0
      # why: ONLY main PUBLISHES, CHECKED BEFORE ANYTHING ELSE RUNS (row
      # O-DEPLOY-IS-NOT-ONE-GATED-LANE, limb 2) — so before the irreversible migrations,
      # too. A called workflow sees its caller's event and ref, and ci.yml calls this file
      # from `on: push: branches: [main]` alone, so `--allow main` is that trigger read
      # back. Any other ref exits 1 here. Held FIRST by assert-workflow-hardening limb 10.
      - name: Refuse any ref but main
        run: node tooling/ci/assert-deploy-ref.mjs --allow main
      # why: a superseded SHA never publishes (row O-DEPLOY-IS-NOT-ONE-GATED-LANE,
      # limb 3), and a commit that touches none of this Worker's deployUnits globs
      # does not publish it. The unit is the Worker's own ledger environment, its
      # name. Runs BEFORE the irreversible migrations: every later step runs only on
      # deploy == 'true'. An unreadable ledger exits 1 and nothing publishes.
      - name: Plan from the Deployment ledger
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tooling/ci/plan-deploy.mjs ${{ matrix.worker.worker }}
      # why: THE CRASH SINK IS PER WORKER. The deploy below passes the secret this
      # Worker's register row names (`dsnSecret`), and a called workflow reads only the
      # secrets its call delivers: one this job was not handed reads as EMPTY, and a
      # Worker deployed with an empty GLITCHTIP_DSN reports its crashes nowhere while
      # its smoke stays green. So an empty one stops the leg here, before the
      # irreversible migrations.
      # why: zizmor's overprovisioned-secrets, IGNORED HERE AND ON THE DEPLOY'S
      # `secrets[...]` BELOW. An indexed read hands the runner every secret the
      # workflow can see, and in this callee that is ONLY the names declared under
      # `on.workflow_call.secrets` and passed by name: assert-worker-error-sink limb 5
      # fails a `secrets: inherit` call (lead ruling Q1). One secret per register row
      # needs the index; a literal name per app is the per-app edit E-a2 removes.
      - name: The crash-sink secret this Worker's row names reached this job
        if: steps.plan.outputs.deploy == 'true'
        env:
          DSN_SECRET: ${{ matrix.worker.dsnSecret }}
          DSN: ${{ secrets[matrix.worker.dsnSecret] }}  # zizmor: ignore[overprovisioned-secrets]
        run: |
          if [ -z "$DSN" ]; then
            echo "::error::the secret ${DSN_SECRET} (tooling/platform-register.json dsnSecret) is empty in this job: it is unset, or ci.yml's deploy-workers call does not deliver it. Nothing was deployed."
            exit 1
          fi
      - uses: ./.github/actions/setup-node
        if: steps.plan.outputs.deploy == 'true'
      - run: npm ci
        if: steps.plan.outputs.deploy == 'true'
        working-directory: ${{ matrix.worker.dir }}
      # why: MIGRATIONS BEFORE DEPLOY. The schema standard is additive-only, so
      # new columns are harmless to code that predates them; deploying code that
      # reads a column the database lacks is an outage. Expand, then deploy. Only
      # when the Worker's own config migrates a D1 (worker-set.mjs `migrations`).
      - name: Apply the Worker's D1 migrations (before deploy)
        if: steps.plan.outputs.deploy == 'true' && matrix.worker.migrations
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: '4.143.0'   # why: package.json says ^4.0.0, which floats. [F-2]
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ matrix.worker.dir }}
          command: d1 migrations apply ${{ matrix.worker.migrations }} --remote
      # why: [pipeline K-7] a statement's legality is a property of the ENGINE.
      # D1's authorizer refused the erasure routes' `pragma_table_info` join at
      # runtime while every static check stayed green. Blocking, and exit 2
      # ("could not look") blocks too.
      - name: The deployed SQL is SQL live D1 will run
        if: steps.plan.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tooling/ops/check-d1-accepts-live-sql.mjs
      # why: `id: deploy` is the only step whose success means "this is what the
      # Worker is running"; the record step below is conditioned on it.
      # why: the two `--var`s are supplied at DEPLOY time — GLITCHTIP_DSN is a
      # write-only ingest key, and RELEASE is the SHA, not API_VERSION.
      # why: THIS IS THE LEG'S ONE DEPLOY. A second, unqualified deploy wiped both
      # --vars off the live platform Worker for two days (#155, run 30891499182).
      # A Worker that does not exist yet is created by this deploy itself, and a
      # secret it needs rides this same version as `--secrets-file` (#981; the
      # action's `secrets:` input is refused by assert-workflow-hardening limb 13).
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        if: steps.plan.outputs.deploy == 'true'
        id: deploy
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: '4.143.0'   # why: package.json says ^4.0.0, which floats. [F-2]
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ matrix.worker.dir }}
          command: deploy --var GLITCHTIP_DSN:${{ secrets[matrix.worker.dsnSecret] }} --var RELEASE:${{ github.sha }}  # zizmor: ignore[overprovisioned-secrets]
      # why: `build` is a separate field from `version` on /v1/health — `version`
      # is the literal "v1" and a smoke joined to it would pass forever.
      # `--require-ok` is a separate conjunct: deployed-and-unwell is not good.
      - name: Smoke — the live Worker answers at THIS commit
        if: steps.plan.outputs.deploy == 'true'
        run: >
          node tooling/ops/post-deploy-smoke.mjs
          --url ${{ matrix.worker.smokeUrl }}
          --field build --expect ${{ github.sha }} --require-ok

      # why: conditioned on the DEPLOY, not on the smoke. A provenance record
      # must be conditioned on the act it describes, never on a later verdict
      # about that act (deploy-web.yml run 144). The smoke still fails the job.
      - name: Record the deployed SHA
        if: always() && steps.deploy.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          # why: the deploy's own output, which names the Worker version rollback.yml
          # re-promotes (row O-DEPLOY-IS-NOT-ONE-GATED-LANE, limb 4). The recorder reads
          # one line of it and prints none of it: wrangler lists the Worker's vars.
          DEPLOY_OUTPUT: ${{ steps.deploy.outputs.command-output }}
        run: node tooling/ci/record-deployment.mjs ${{ matrix.worker.worker }} ${{ matrix.worker.origin }} --wrangler-output-env DEPLOY_OUTPUT

  # why: THE PLATFORM DEPLOYS AFTER EVERY APP LEG (row O-SERVICE-KIT-UNBUILT). It holds a
  # service binding to each app's `ERASURE_<APP>` Worker, and a service binding to a
  # Worker that does not exist fails the platform deploy, so an app's first deploy
  # must come first. `needs: app-worker` also means a failed app leg stops it: it never
  # deploys over a half-done set. No job-level `if:` — this is a post-gate callee, and
  # a skipped job there would read as green (assert-green-means-ran A9).
  platform:
    name: Deploy platform
    needs: [workers, app-worker]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # why: see the app-worker job — alone, this line fails open.
    environment: production
    # why: job-level — see the app-worker job.
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # why: see the app-worker job — the plan needs full history.
          fetch-depth: 0
      # why: the ref check, FIRST, exactly as in the app-worker job.
      - name: Refuse any ref but main
        run: node tooling/ci/assert-deploy-ref.mjs --allow main
      # why: the plan, exactly as in the app-worker job, for this Worker's
      # own ledger environment and deployUnits globs.
      - name: Plan from the Deployment ledger
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tooling/ci/plan-deploy.mjs platform
      - uses: ./.github/actions/setup-node
        if: steps.plan.outputs.deploy == 'true'
      - run: npm ci
        if: steps.plan.outputs.deploy == 'true'
        working-directory: services/platform
      # why: NO PLATFORM_DB MIGRATION HERE ANY MORE (PB-03). It ran here, after every app
      # Worker had gone live on a platform_db without its schema; ci.yml's
      # platform-db-migrate (migrate-platform-db.yml) applies it once, before this whole
      # file, on the same commit and the same plan.
      # why: [pipeline K-7] see the app-worker job. This Worker binds each app's
      # database as well as platform_db, so the check executes against every one — a
      # route reads the databases it reads, not the ones its Worker binds.
      - name: The deployed SQL is SQL live D1 will run
        if: steps.plan.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tooling/ops/check-d1-accepts-live-sql.mjs
      # why: the secret is written for the deploy below to carry. Read from the
      # env by NAME, never echoed; an unset or empty value exits 1 here, because
      # the file would upload it as empty. 0600, under $RUNNER_TEMP.
      - name: Write this version's secrets file
        if: steps.plan.outputs.deploy == 'true'
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          node -e '
            const names = ["SUPABASE_ANON_KEY"];
            const empty = names.filter((n) => !process.env[n]);
            if (empty.length) {
              console.error(`${empty.join(", ")} is unset or empty; refusing to upload a version without it.`);
              process.exit(1);
            }
            const body = JSON.stringify(Object.fromEntries(names.map((n) => [n, process.env[n]])));
            require("node:fs").writeFileSync(process.argv[1], body, { mode: 0o600, flag: "wx" });
          ' "$RUNNER_TEMP/platform-secrets.json"
      # why: ONE deploy per job, and it carries the vars. A second, unqualified
      # `wrangler deploy` (the action's default command) wiped both --vars off
      # the live Worker for two days — run 30891499182. The secret rides the
      # same deploy, as `--secrets-file`. The action's `secrets:` input edited
      # secrets BEFORE the command, and Cloudflare refuses that edit while the
      # newest version is not the deployed one, i.e. after every rollback: main
      # run 36224483330. Held by assert-workflow-hardening limb 13.
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        if: steps.plan.outputs.deploy == 'true'
        id: deploy
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: '4.143.0'   # why: package.json says ^4.0.0, which floats. [F-2]
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: services/platform
          command: deploy --var GLITCHTIP_DSN:${{ secrets.GLITCHTIP_DSN }} --var RELEASE:${{ github.sha }} --secrets-file ${{ runner.temp }}/platform-secrets.json
      # why: the file holds a live secret, so it goes however the job ended.
      - name: Delete this version's secrets file
        if: always()
        run: rm -f "$RUNNER_TEMP/platform-secrets.json"

      # why: see the identical step in the app-worker job. Until this line
      # nothing ever asked this Worker whether it had actually come up.
      - name: Smoke — the live Worker answers at THIS commit
        if: steps.plan.outputs.deploy == 'true'
        run: >
          node tooling/ops/post-deploy-smoke.mjs
          --url https://platform.nikatru.com/v1/health
          --field build --expect ${{ github.sha }} --require-ok

      # why: conditioned on the DEPLOY, not on the smoke — see the app-worker
      # job. "Which sha is live on platform" is the first question of every
      # incident, and it must not be lost because a health probe was red.
      - name: Record the deployed SHA
        if: always() && steps.deploy.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          # why: the Worker version — see the app-worker job.
          DEPLOY_OUTPUT: ${{ steps.deploy.outputs.command-output }}
        run: node tooling/ci/record-deployment.mjs platform https://platform.nikatru.com --wrangler-output-env DEPLOY_OUTPUT

  edge-shield:
    # why: LEAD RULINGS SHIELD-R1..R3, row O-BOXES-UNSHIELDED-FROM-SPIKES. The edge
    # in front of Box C's auth and Box B's crash intake (services/edge-shield). It
    # binds two ZONE routes on deploy, so a deploy is what puts it in path, and the
    # smoke below is what proves it got there. No migrations and no secret; its one
    # var is RELEASE, which it echoes as its header. Then the zone's per-IP credential rule
    # (tooling/edge-ratelimit-rule.json) is applied, because SHIELD-R3 moved the
    # per-IP limit out of the Worker and into Cloudflare's own rule.
    # docs/ci/deploy-workers.md has the section.
    name: Deploy edge-shield
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # why: see the app-worker job — alone, this line fails open.
    environment: production
    # why: job-level — see the app-worker job.
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # why: see the app-worker job — the plan needs full history.
          fetch-depth: 0
      # why: the ref check, FIRST, exactly as in the app-worker job.
      - name: Refuse any ref but main
        run: node tooling/ci/assert-deploy-ref.mjs --allow main
      # why: the plan, exactly as in the app-worker job, for this Worker's
      # own ledger environment and deployUnits globs.
      - name: Plan from the Deployment ledger
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tooling/ci/plan-deploy.mjs edge-shield
      - uses: ./.github/actions/setup-node
        if: steps.plan.outputs.deploy == 'true'
      - run: npm ci
        if: steps.plan.outputs.deploy == 'true'
        working-directory: services/edge-shield
      # why: ONE deploy, the action's command stated rather than defaulted — see the
      # platform job for what a second, unqualified deploy once cost. The one var is
      # RELEASE, the SHA the Worker echoes as x-nikatru-shield (row
      # O-EDGE-SHIELD-SMOKE-NOT-JOINED-TO-SHA); it has no secret.
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        if: steps.plan.outputs.deploy == 'true'
        id: deploy
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: '4.143.0'   # why: package.json says ^4.0.0, which floats. [F-2]
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: services/edge-shield
          command: deploy --var RELEASE:${{ github.sha }}
      # why: THE SMOKE IS "IS THIS COMMIT IN PATH", because the shield has no health
      # route of its own and must not grow one on either box's host. The probe
      # ops-watch runs, joined to this commit: both routes answer with
      # x-nikatru-shield: <this SHA>, or this job is red — a shield in path at an
      # older commit is red too. Exit 2 (a probe never answered) is red as well.
      - name: Smoke — this commit's shield is in path on both routes
        if: steps.plan.outputs.deploy == 'true'
        run: node tooling/ops/check-edge-shield.mjs --settle --expect-release ${{ github.sha }}
      # why: LEAD RULING SHIELD-R3 — the per-IP limit on the credential paths is the
      # nikatru.com zone's rate-limiting rule, declared in tooling/edge-ratelimit-rule.json
      # and written HERE, never by hand. One PUT of the http_ratelimit phase (all or
      # nothing), then a re-read that must equal the file: 0 applied · 1 the zone still
      # differs · 2 could not write (a token without Zone WAF Edit is a 403 here, red
      # where it happened, and leaves the live rule as it was). After the smoke, so a
      # shield that is not in path is the first red, not this one.
      - name: Apply the zone's per-IP credential rule (tooling/edge-ratelimit-rule.json)
        if: steps.plan.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node tooling/ops/edge-ratelimit-rule.mjs --apply

      # why: conditioned on the DEPLOY, not on the smoke — see the app-worker job.
      - name: Record the deployed SHA
        if: always() && steps.deploy.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          # why: the Worker version — see the app-worker job.
          DEPLOY_OUTPUT: ${{ steps.deploy.outputs.command-output }}
        run: node tooling/ci/record-deployment.mjs edge-shield https://auth-api.nikatru.com --wrangler-output-env DEPLOY_OUTPUT
