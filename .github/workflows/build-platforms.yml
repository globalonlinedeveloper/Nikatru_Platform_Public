name: Build apps

run-name: "Build apps on ${{ github.ref_name }} (${{ github.event_name }}) by @${{ github.actor }}"

# The measurements, retractions and traps behind this file are in
# docs/ci/build-platforms.md. Only `# why:` lines live here, and
# docs/ci/README.md carries the rules every workflow has to obey.

on:
  workflow_dispatch:
  push:
    tags:
      # why: GENERATED by tooling/ci/tag-owner.mjs --write from the product registers. Never hand-edit.
      - 'subscriptiontracker-v*'
  # why: TWO weekly slots against a duty declared weekly. The freshness window is
  # cadence x 1.5 and GitHub delivers this repository's scheduled runs 10.1% on
  # time, so one slot a week is one chance; the margin is given to the evidence.
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
    - cron: '0 6 * * 4'   # Thursdays 06:00 UTC

permissions:
  contents: read
  checks: read

jobs:
  gate:
    name: Require ci-gate to have passed
    runs-on: ubuntu-24.04
    # why: 25, not 10. assert-gate-passed.mjs polls for up to its own 1200 s default,
    # so any bound at or under 20 kills it mid-poll and replaces "timed out waiting
    # for ci-gate" with an opaque cancellation. Byte-identical in all five gate jobs.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require ci-gate to have passed for this commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node tooling/ci/assert-gate-passed.mjs ${{ github.sha }}

  prepare:
    name: Derive the app set from the pub workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: gate
    outputs:
      apps: ${{ steps.workspace.outputs.apps }}
      GITHUB_SHA_SHORT: ${{ steps.workspace.outputs.GITHUB_SHA_SHORT }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # why: a dispatch on a tag ref never passes the tag filter, so ownership is
      # re-asked here. A refusing STEP, not a job `if:`: all_platforms reads a
      # skipped job as not green.
      - name: This lane owns the tag
        if: github.ref_type == 'tag'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: node tooling/ci/tag-owner.mjs --lane .github/workflows/build-platforms.yml --tag "$REF_NAME"
      - name: The tag must name the version the app declares
        if: github.ref_type == 'tag'
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: node tooling/ci/assert-app-versioning.mjs --tag "$REF_NAME" --ref-type "$REF_TYPE"
      # why: DERIVED, NOT LISTED. A hand-written app list here is a second copy of the
      # workspace, and the copy is the one that rots.
      # why: on a tag ref the matrix is the one app the tag names, so a tag builds and
      # stages only its own app; every other run builds the whole workspace.
      - name: The matrix comes from the workspace, never from this file
        id: workspace
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = "tag" ]; then
            apps="$(node tooling/ci/assert-release-lane-generic.mjs --emit-apps --tag "$REF_NAME")"
          else
            apps="$(node tooling/ci/assert-release-lane-generic.mjs --emit-apps)"
          fi
          echo "apps=${apps}" >> "$GITHUB_OUTPUT"
          echo "GITHUB_SHA_SHORT=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "Building: ${apps}" >> "$GITHUB_STEP_SUMMARY"

  linux_web_android:
    name: Linux + Web + Android
    runs-on: ubuntu-24.04
    # why 45: a fourth Android build (apps.gov.in) since 2026-09-22 — docs/ci/build-platforms.md §apps-gov-in.
    timeout-minutes: 45
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.prepare.outputs.apps) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: ./.github/actions/setup-flutter
      - name: Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libsecret-1-dev libjsoncpp-dev libcurl4-openssl-dev
      - name: Resolve the workspace
        run: flutter pub get --enforce-lockfile
      - name: Derive the release line from pubspec
        id: ver
        run: node tooling/ci/assert-app-versioning.mjs --emit apps/${{ matrix.app }} >> "$GITHUB_OUTPUT"
      - name: Build web
        working-directory: apps/${{ matrix.app }}
        run: >
          flutter build web --release
          --build-name=${{ steps.ver.outputs.release_line }}.${{ github.run_number }}
          --dart-define=APP_VERSION=${{ steps.ver.outputs.release_line }}.${{ github.run_number }}+${{ needs.prepare.outputs.GITHUB_SHA_SHORT }}
          --dart-define=RELEASE_CHANNEL=web
          --dart-define=GLITCHTIP_DSN=${{ secrets.GLITCHTIP_DSN }}
      # why: --obfuscate and --split-debug-info are ONE flag, and the directory
      # they write is the ONLY thing that turns a crash report from this build
      # back into source. A rebuild produces a DIFFERENT mapping, so it leaves
      # this runner or it is gone. Both destinations are wired below and
      # tooling/ci/assert-obfuscation-coupled.mjs refuses the pair being split.
      # Web is absent from this deliberately: Flutter does not support
      # obfuscation on web at all, and deploy-web.yml carries web's own
      # --source-maps path. docs/ci/build-platforms.md §obfuscation.
      - name: Build linux
        working-directory: apps/${{ matrix.app }}
        run: >
          flutter build linux --release
          --obfuscate --split-debug-info=build/symbols/linux
          --build-name=${{ steps.ver.outputs.release_line }}.${{ github.run_number }}
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }}
          --dart-define=APP_VERSION=${{ steps.ver.outputs.release_line }}.${{ github.run_number }}+${{ needs.prepare.outputs.GITHUB_SHA_SHORT }}
          --dart-define=RELEASE_CHANNEL=linux-appimage
          --dart-define=GLITCHTIP_DSN=${{ secrets.GLITCHTIP_DSN }}
      - name: Prepare the AppImage signing key
        env:
          APPIMAGE_SIGNING_KEY_B64: ${{ secrets.APPIMAGE_SIGNING_KEY_B64 }}
        run: node tooling/ci/appimage-signing.mjs --app ${{ matrix.app }}
      - name: Generate the snapcraft recipe
        run: >
          node tooling/release/generate-snapcraft.mjs
          --app ${{ matrix.app }}
          --bundle apps/${{ matrix.app }}/build/linux/x64/release/bundle
          --out "$RUNNER_TEMP/snapcraft-${{ matrix.app }}"
          --version ${{ steps.ver.outputs.release_line }}.${{ github.run_number }}
      - name: The generated recipe is complete and still derived from the tree
        run: >
          node tooling/ci/assert-snapcraft-generable.mjs
          --emitted "$RUNNER_TEMP/snapcraft-${{ matrix.app }}/snap/snapcraft.yaml"
          --app ${{ matrix.app }}
      - name: Prepare the Android upload key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node tooling/ci/android-signing.mjs --app ${{ matrix.app }}
      # why: these three Android builds also run on every PR as ci.yml android-artifacts; built-artifact-pr-lane.test.mjs holds the copies equal.
      - name: Build android (apk — sideloadable build proof)
        working-directory: apps/${{ matrix.app }}
        run: >
          flutter build apk --release
          --obfuscate --split-debug-info=build/symbols/android-apk
          --build-name=${{ steps.ver.outputs.release_line }}.${{ github.run_number }}
          --build-number=${{ github.run_number }}
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }}
          --dart-define=APP_VERSION=${{ steps.ver.outputs.release_line }}.${{ github.run_number }}+${{ needs.prepare.outputs.GITHUB_SHA_SHORT }}
          --dart-define=RELEASE_CHANNEL=android-play
          --dart-define=REVENUECAT_KEY=${{ secrets.REVENUECAT_PUBLIC_KEY_GOOGLE }}
          --dart-define=GLITCHTIP_DSN=${{ secrets.GLITCHTIP_DSN }}
      - name: Build android (aab — the Google Play artifact)
        id: build_aab
        working-directory: apps/${{ matrix.app }}
        run: >
          flutter build appbundle --release
          --obfuscate --split-debug-info=build/symbols/android-aab
          --build-name=${{ steps.ver.outputs.release_line }}.${{ github.run_number }}
          --build-number=${{ github.run_number }}
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }}
          --dart-define=APP_VERSION=${{ steps.ver.outputs.release_line }}.${{ github.run_number }}+${{ needs.prepare.outputs.GITHUB_SHA_SHORT }}
          --dart-define=RELEASE_CHANNEL=android-play
          --dart-define=REVENUECAT_KEY=${{ secrets.REVENUECAT_PUBLIC_KEY_GOOGLE }}
          --dart-define=GLITCHTIP_DSN=${{ secrets.GLITCHTIP_DSN }}
      # why: release.json reads each file's channel from its build's stamp, never from its extension; assert-release-json.mjs --static pairs --channel with the define of --build-step — docs/ci/build-platforms.md §channel-stamps.
      - name: Stamp the .aab with the channel its build compiled in
        run: >
          node tooling/ci/stamp-channel.mjs --channel android-play --build-step build_aab
          apps/${{ matrix.app }}/build/app/outputs/bundle/release/*.aab
      # why: apps.gov.in's .apk is self-signed with its OWN key, which never reaches $GITHUB_ENV (the Play key stays there) — docs/ci/build-platforms.md §apps-gov-in.
      - name: Prepare the apps.gov.in signing key (its own key, never the upload key)
        id: agi_key
        env:
          APP: ${{ matrix.app }}
          APPSGOVIN_KEYSTORE_BASE64: ${{ secrets.APPSGOVIN_KEYSTORE_BASE64 }}
          APPSGOVIN_KEYSTORE_PASSWORD: ${{ secrets.APPSGOVIN_KEYSTORE_PASSWORD }}
          APPSGOVIN_KEY_ALIAS: ${{ secrets.APPSGOVIN_KEY_ALIAS }}
          APPSGOVIN_KEY_PASSWORD: ${{ secrets.APPSGOVIN_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          scratch="${RUNNER_TEMP}/apps-gov-in-signing.env"
          : > "$scratch"
          env -u GITHUB_REF -u GITHUB_WORKFLOW_REF -u GITHUB_ENV \
            ANDROID_KEYSTORE_BASE64="$APPSGOVIN_KEYSTORE_BASE64" \
            ANDROID_KEYSTORE_PASSWORD="$APPSGOVIN_KEYSTORE_PASSWORD" \
            ANDROID_KEY_ALIAS="$APPSGOVIN_KEY_ALIAS" \
            ANDROID_KEY_PASSWORD="$APPSGOVIN_KEY_PASSWORD" \
            node tooling/ci/android-signing.mjs --app "$APP" \
              --out "${RUNNER_TEMP}/apps-gov-in-key" --github-env "$scratch"
          posture="$(sed -n 's/^ANDROID_SIGNING_POSTURE=//p' "$scratch")"
          keystore="$(sed -n 's/^ANDROID_KEYSTORE_PATH=//p' "$scratch")"
          rm -f "$scratch"
          case "$posture" in
            release-signed)
              if [ -z "$keystore" ]; then
                echo "::error title=apps.gov.in key::posture release-signed but no ANDROID_KEYSTORE_PATH was exported"
                exit 1
              fi
              echo "posture=release" >> "$GITHUB_OUTPUT" ;;
            debug-signed-build-proof)
              echo "### apps.gov.in signing: THE APPSGOVIN_* SECRETS ARE NOT SET. THE .apk BELOW IS DEBUG-SIGNED AND NAMED NOT-FOR-UPLOAD." >> "$GITHUB_STEP_SUMMARY"
              echo "posture=debug" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error title=apps.gov.in key::android-signing.mjs exported no posture (got \"${posture}\")"
              exit 1 ;;
          esac
          echo "keystore_path=${keystore}" >> "$GITHUB_OUTPUT"
      # why: Flutter writes every .apk to one path, so the Play .apk is set aside and put back — §apps-gov-in.
      - name: Set the Play .apk aside (Flutter writes every .apk to one path)
        working-directory: apps/${{ matrix.app }}
        run: |
          set -euo pipefail
          rm -rf build/android-play-apk-aside
          mkdir -p build/android-play-apk-aside
          mv build/app/outputs/flutter-apk/app-release.apk build/android-play-apk-aside/
          if [ -f build/app/outputs/flutter-apk/app-release.apk.sha1 ]; then mv build/app/outputs/flutter-apk/app-release.apk.sha1 build/android-play-apk-aside/; fi
      # why: a step's env beats $GITHUB_ENV, so the apps.gov.in key signs THIS build only; RELEASE_CHANNEL=apps-gov-in sells nothing — §apps-gov-in.
      - name: Build android (apk — apps.gov.in, its own key, sells nothing)
        id: build_apk_agi
        working-directory: apps/${{ matrix.app }}
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.agi_key.outputs.keystore_path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.APPSGOVIN_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.APPSGOVIN_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.APPSGOVIN_KEY_PASSWORD }}
        run: >
          flutter build apk --release
          --obfuscate --split-debug-info=build/symbols/android-apk-apps-gov-in
          --build-name=${{ steps.ver.outputs.release_line }}.${{ github.run_number }}
          --build-number=${{ github.run_number }}
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }}
          --dart-define=APP_VERSION=${{ steps.ver.outputs.release_line }}.${{ github.run_number }}+${{ needs.prepare.outputs.GITHUB_SHA_SHORT }}
          --dart-define=RELEASE_CHANNEL=apps-gov-in
          --dart-define=GLITCHTIP_DSN=${{ secrets.GLITCHTIP_DSN }}
      - name: Take the apps.gov.in .apk out, and put the Play .apk back
        id: agi_apk
        working-directory: apps/${{ matrix.app }}
        env:
          APP: ${{ matrix.app }}
          BUILD_NAME: ${{ steps.ver.outputs.release_line }}.${{ github.run_number }}
        run: |
          set -euo pipefail
          file="${APP}-apps-gov-in-${BUILD_NAME}.apk"
          mkdir -p build/apps-gov-in
          mv build/app/outputs/flutter-apk/app-release.apk "build/apps-gov-in/${file}"
          rm -f build/app/outputs/flutter-apk/app-release.apk.sha1
          mv build/android-play-apk-aside/* build/app/outputs/flutter-apk/
          rmdir build/android-play-apk-aside
          if cmp -s build/app/outputs/flutter-apk/app-release.apk "build/apps-gov-in/${file}"; then
            echo "::error title=apps.gov.in apk::the restored Play .apk is byte-identical to the apps.gov.in one"
            exit 1
          fi
          echo "apk=apps/${APP}/build/apps-gov-in/${file}" >> "$GITHUB_OUTPUT"
      # why: stamped under its final name, after the Play .apk went back — docs/ci/build-platforms.md §channel-stamps.
      - name: Stamp the apps.gov.in .apk with the channel its build compiled in
        env:
          APK: ${{ steps.agi_apk.outputs.apk }}
        run: node tooling/ci/stamp-channel.mjs --channel apps-gov-in --build-step build_apk_agi "$APK"
      # ⏱ MOVED 2026-09-07 (fix pass) — THIS STEP USED TO BE THE LAST ONE IN THE
      # JOB, and that lost the mapping it exists to keep. This unit states the
      # rule in the store lanes ("BEFORE the upload, not after -- a step placed
      # after a store upload does not run when that upload fails, which is
      # exactly when the build still exists and the symbols still can be kept")
      # and applied the inverse here. Proof, not theory: in dispatch run
      # 34093704881, `Build linux` succeeded WITH the flags, a later step failed,
      # and this artifact was `skipped` -- the obfuscated build's only mapping
      # was written and then destroyed with the runner. It now sits immediately
      # after the last `flutter build` of the job, ahead of every assertion and
      # every network call, so nothing downstream can take the symbols with it.
      # why: the crash sink is where the symbols are READ, and this artifact is
      # what survives the sink losing them. Named `symbols-*` on purpose: the
      # `release` job downloads `<app>-*` and publishes it, and an obfuscation
      # mapping attached to a public GitHub Release un-obfuscates the build for
      # everyone. 90 days matches the installable artifacts beside it.
      # why `!cancelled()`: a failed apps.gov.in step above must not cost the Play mappings — §apps-gov-in.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: symbols-${{ matrix.app }}-linux-android
          path: |
            apps/${{ matrix.app }}/build/symbols/linux
            apps/${{ matrix.app }}/build/symbols/android-apk
            apps/${{ matrix.app }}/build/symbols/android-aab
            apps/${{ matrix.app }}/build/symbols/android-apk-apps-gov-in
          retention-days: 90
          if-no-files-found: error
      - name: The .aab must be signed by the upload key, not the debug key
        run: >
          node tooling/ci/assert-artifact-signed.mjs
          apps/${{ matrix.app }}/build/app/outputs/bundle/release/app-release.aab
      - name: Every artifact this lane claims exists, and is not empty
        run: >
          node tooling/ci/assert-artifact-shape.mjs
          --app ${{ matrix.app }} --platform linux_web_android
      - name: Every native library is aligned for a 16 KB memory page
        run: >
          node --single-threaded tooling/ci/assert-elf-page-alignment.mjs
          apps/${{ matrix.app }}/build/app/outputs/bundle/release/app-release.aab
      # why: apps.gov.in runs MobSF over the built .apk, and the merged manifest
      # exists only inside it. docs/ci/build-platforms.md §vapt.
      - name: The built .apk passes the static apps.gov.in VAPT items
        run: >
          node tooling/ci/assert-android-vapt-manifest.mjs
          apps/${{ matrix.app }}/build/app/outputs/flutter-apk/app-release.apk
          --app ${{ matrix.app }}
      # why: pinned by version AND by digest, byte-identical to deploy-web.yml's
      # step. The release asset is a GitLab JOB ARTIFACT, which is a re-runnable
      # address rather than an immutable object — so the version alone is a
      # label, and the digest is what makes it an address. Both halves live in
      # tooling/versions.json.
      - name: Install glitchtip-cli (pinned by version AND by digest)
        run: |
          set -euo pipefail
          ver="$(node -p "require('./tooling/versions.json').glitchtip_cli")"
          sum="$(node -p "require('./tooling/versions.json').glitchtip_cli_sha256")"
          url="https://gitlab.com/glitchtip/glitchtip-cli/-/jobs/artifacts/v${ver}/raw/artifacts/glitchtip-cli-linux-x86_64?job=build-linux-x86_64"
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            --output "${RUNNER_TEMP}/glitchtip-cli" "$url"
          printf '%s  %s\n' "$sum" "${RUNNER_TEMP}/glitchtip-cli" | sha256sum --check --strict -
          chmod +x "${RUNNER_TEMP}/glitchtip-cli"
          got="$("${RUNNER_TEMP}/glitchtip-cli" --version)"
          if [ "$got" != "glitchtip-cli ${ver}" ]; then
            echo "::error title=glitchtip-cli::the pinned binary reports \"${got}\", not \"glitchtip-cli ${ver}\""
            exit 1
          fi
          echo "$got"
      # why: FAILS CLOSED on a missing GLITCHTIP_TOKEN, never skips. The wrapper
      # exists because `debug-files upload` exits 0 over an empty directory, over
      # failed chunks and over an assembly that never completed — its header
      # names all three and the source lines they were read from.
      #
      # 🔴 THE ORG AND PROJECT ARE READ FROM A FILE, NOT SPELT HERE. This read
      # `--project "$APP"` until 2026-09-09 — a name that lives on a REMOTE
      # SERVER, derived from this repository's own directory name. The two are
      # not the same fact: renaming apps/<slug> is a commit, renaming a GlitchTip
      # project is a PUT against the instance, and on 2026-09-09 the first
      # happened without the second — every symbol upload POSTed to
      # /projects/nikatru/subscriptiontracker/ and took a 404 from an instance
      # that still held the retired slug.
      #
      # ⏱ AND THE FIRST REPAIR WAS WRONG TOO, WHICH IS WHY IT IS WRITTEN DOWN.
      # It spelled the project out at each call site, and
      # assert-release-lane-generic.mjs refused that on deploy-web.yml:
      # [pipeline 10]D-2b abolishes per-app workflow authoring, and an app id
      # typed into a graded lane's `run` is exactly that. The value now lives in
      # tooling/ops/glitchtip-project.json and every lane reads it at run time —
      # D-2b's own remedy ("a file the lane READS at run time"), applied to a
      # value that is not per-app at all: one crash sink for the portfolio.
      # tooling/ci/assert-glitchtip-project.mjs holds every call site to that one
      # declaration and refuses an app-derived one;
      # docs/ci/build-platforms.md §glitchtip-project carries the measurement.
      - name: Upload the native debug symbols to GlitchTip
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.GLITCHTIP_TOKEN }}
          GLITCHTIP_DSN: ${{ secrets.GLITCHTIP_DSN }}
          APP: ${{ matrix.app }}
        run: |
          set -euo pipefail
          gt_org="$(node -p "require('./tooling/ops/glitchtip-project.json').org")"
          gt_project="$(node -p "require('./tooling/ops/glitchtip-project.json').project")"
          for lane in linux android-apk android-aab android-apk-apps-gov-in; do
            node tooling/ops/upload-native-symbols.mjs \
              --cli "${RUNNER_TEMP}/glitchtip-cli" \
              --dir "apps/${APP}/build/symbols/${lane}" \
              --org "$gt_org" --project "$gt_project"
          done
      # why: the Play .apk is a build proof, never a release file — `ci-proof-*` is outside the release job's `<app>-*` download (O-RELEASE-RECORD-GUESSES-CHANNEL-FROM-EXTENSION).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-proof-android-play-apk-${{ matrix.app }}
          path: apps/${{ matrix.app }}/build/app/outputs/flutter-apk/*.apk
          retention-days: 90
          if-no-files-found: error
      # why `store-`: the .aab is store-only, so it stays outside the release job's `<app>-*` download — docs/ci/build-platforms.md §store-only.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: store-${{ matrix.app }}-android-aab-${{ env.ANDROID_SIGNING_POSTURE }}
          path: |
            apps/${{ matrix.app }}/build/app/outputs/bundle/release/*.aab
            apps/${{ matrix.app }}/build/app/outputs/bundle/release/*.aab.channel.json
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.app }}-linux-web-android-${{ env.ANDROID_SIGNING_POSTURE }}
          path: |
            apps/${{ matrix.app }}/build/linux/x64/release/bundle
          retention-days: 90
          if-no-files-found: error
      # why last in the job: an apps.gov.in finding must not cost the Play artifacts or symbols — §apps-gov-in.
      - name: The apps.gov.in .apk passes the static apps.gov.in VAPT items
        run: >
          node tooling/ci/assert-android-vapt-manifest.mjs
          ${{ steps.agi_apk.outputs.apk }}
          --app ${{ matrix.app }}
      # why: the listing media is derived from the Play set, never hand-edited — §apps-gov-in.
      - name: The apps.gov.in listing media is still the derivation of the Play set
        run: node --single-threaded tooling/ci/assert-apps-gov-in-media.mjs
      # why: the artifact is named from the signer this reads, against the pin — §apps-gov-in.
      - name: The apps.gov.in .apk — its signer against the pin, its minSdk against the form
        id: agi_verify
        run: >
          node tooling/ci/assert-apps-gov-in-apk.mjs
          --apk ${{ steps.agi_apk.outputs.apk }}
          --app ${{ matrix.app }}
          --posture ${{ steps.agi_key.outputs.posture }}
      # why its own artifact: `apps-gov-in-*` never matches the release job's `<app>-*` download; its second download takes this only under the UPLOADABLE name.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.agi_verify.outputs.artifact_name }}
          path: |
            ${{ steps.agi_apk.outputs.apk }}
            ${{ steps.agi_apk.outputs.apk }}.channel.json
          retention-days: 90
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-2025
    timeout-minutes: 30
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.prepare.outputs.apps) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-flutter
      # why: MAX_PATH, and on this lane it binds GIT ONLY — measured, not assumed.
      # `flutter build windows` has CMake FetchContent clone sentry-native, which
      # recurses into external/crashpad -> third_party/mini_chromium, and GIT writes
      #   D:/a/<repo>/<repo>/apps/<app>/build/windows/x64/_deps/sentry-native-src/
      #     .git/modules/external/crashpad/modules/third_party/mini_chromium/
      #     mini_chromium/objects/pack/pack-<40hex>.keep
      # 262 characters for `subscriptiontracker`, 248 for the retired `subly`, against
      # a 260 ceiling. So the slug rename — and nothing else in it — crossed the line:
      # run 34351523027 on main, job 102465811905, 2026-09-09:
      #   "fatal: cannot write keep file '...': Filename too long".
      # 🔴 THE OS REGISTRY SWITCH IS NOT THE FIX, and that is a measurement rather than
      # an argument. On a Windows 11 host whose
      # HKLM/SYSTEM/CurrentControlSet/Control/FileSystem/LongPathsEnabled reads 1,
      # `git -c core.longpaths=false clone` into a 270-character pack path still exits
      # 128 with "Filename too long"; the identical clone with core.longpaths=true exits
      # 0 and leaves a checked-out tree. Git for Windows does its own MAX_PATH handling
      # and consults THIS setting, so LongPathsEnabled on the image would not have saved
      # this build, and its absence is not what broke it.
      # ⬜ AND IT IS SIZED RATHER THAN SPRAYED. The longest path this build touches that
      # git does NOT create is 254 characters —
      #   .../sentry-native-src/external/breakpad/src/processor/testdata/symbols/
      #   microdump/breakpad_unittests/<32hex>/breakpad_unittests.sym
      # — still under the ceiling. So MSBuild, CMake and the Node tooling need nothing
      # here, and moving the checkout to a shorter root would be a larger change than
      # the defect. --global, because CMake clones sentry-native into a NEW repository
      # and this repository's own config cannot reach that one.
      # ⚠️ The value is READ BACK on the next line: a `git config` that silently wrote
      # nothing would leave this step green over a build that then fails the same way.
      - name: Git may write paths past MAX_PATH
        run: |
          git config --global core.longpaths true
          git config --global --get core.longpaths
      - name: Resolve the workspace
        run: flutter pub get --enforce-lockfile
      - name: Derive the release line from pubspec
        id: ver
        shell: bash
        run: node tooling/ci/assert-app-versioning.mjs --emit apps/${{ matrix.app }} >> "$GITHUB_OUTPUT"
      - name: Build windows
        id: build_windows
        working-directory: apps/${{ matrix.app }}
        run: >
          flutter build windows --release
          --obfuscate --split-debug-info=build/symbols/windows
          --build-name=${{ steps.ver.outputs.release_line }}.${{ github.run_number }}
          --build-number=${{ github.run_number }}
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }}
          --dart-define=APP_VERSION=${{ steps.ver.outputs.release_line }}.${{ github.run_number }}+${{ needs.prepare.outputs.GITHUB_SHA_SHORT }}
          --dart-define=RELEASE_CHANNEL=windows-store
          --dart-define=GLITCHTIP_DSN=${{ secrets.GLITCHTIP_DSN }}
      # ⏱ MOVED 2026-09-07 (fix pass) — THIS STEP USED TO BE THE LAST ONE IN THE
      # JOB, and that lost the mapping it exists to keep. This unit states the
      # rule in the store lanes ("BEFORE the upload, not after -- a step placed
      # after a store upload does not run when that upload fails, which is
      # exactly when the build still exists and the symbols still can be kept")
      # and applied the inverse here. Proof, not theory: in dispatch run
      # 34093704881, `Build linux` succeeded WITH the flags, a later step failed,
      # and this artifact was `skipped` -- the obfuscated build's only mapping
      # was written and then destroyed with the runner. It now sits immediately
      # after the last `flutter build` of the job, ahead of every assertion and
      # every network call, so nothing downstream can take the symbols with it.
      # ⏱ CORRECTED 2026-09-07 (unit `symbols-everywhere`) — the note that stood
      # here said this lane retains but does NOT upload, "because
      # tooling/versions.json pins ONE glitchtip-cli binary and it is
      # linux-x86_64. Arming this runner would mean a second pinned binary and a
      # second digest". That was true and the second pin now exists:
      # `glitchtip_cli_windows_x86_64_sha256`, the digest of the WINDOWS artifact
      # of the same release, measured by downloading it with the linux one as a
      # control. The sink upload is two steps below.
      # why: the crash sink is where the symbols are READ, and this artifact is
      # what survives the sink losing them — so it stays, and it stays FIRST.
      # Named `symbols-*` on purpose: the `release` job downloads `<app>-*` and
      # publishes it, and an obfuscation mapping attached to a public GitHub
      # Release un-obfuscates the build for everyone.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: symbols-${{ matrix.app }}-windows
          path: |
            apps/${{ matrix.app }}/build/symbols/windows
          retention-days: 90
          if-no-files-found: error
      - name: Package MSIX (Microsoft Store)
        working-directory: apps/${{ matrix.app }}
        run: dart run msix:create --version=${{ steps.ver.outputs.release_line }}.${{ github.run_number }}.0
      # why: straight after msix:create, before the stamp or any upload uses the package — assert-channel-register §10 limb (iv).
      - name: The MSIX carries the identity the register declares
        shell: bash
        run: >
          node tooling/ci/assert-artifact-signed-msix.mjs
          apps/${{ matrix.app }}/build/windows/msix/${{ matrix.app }}.msix
      # why: bash, because pwsh hands a glob to node unexpanded; the .msix is what `build_windows` compiled — docs/ci/build-platforms.md §channel-stamps.
      - name: Stamp the .msix with the channel its build compiled in
        shell: bash
        run: >
          node tooling/ci/stamp-channel.mjs --channel windows-store --build-step build_windows
          apps/${{ matrix.app }}/build/windows/msix/*.msix
      # why: the artifact is preserved BEFORE the identity check that can reject it. A
      # refusal must leave the evidence behind, not delete it.
      # ⏱ 2026-09-24: now AFTER the read-back, which must follow msix:create directly; `if: always()` still keeps the .msix it refuses.
      - name: Keep the .msix even if what follows refuses it
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: store-${{ matrix.app }}-windows-msix-diagnostic
          path: |
            apps/${{ matrix.app }}/build/windows/msix/*.msix
            apps/${{ matrix.app }}/build/windows/msix/*.msix.channel.json
          retention-days: 14
          if-no-files-found: warn
      - name: Every artifact this lane claims exists, and is not empty
        run: >
          node tooling/ci/assert-artifact-shape.mjs
          --app ${{ matrix.app }} --platform windows
      # why: pwsh rather than the linux lane's bash, and that is not a style
      # choice — `$RUNNER_TEMP` on a Windows runner is a backslash path, and
      # handing one to MSYS coreutils inside `shell: bash` is the class of bug
      # this repository has already paid for. `Invoke-WebRequest` + `Get-FileHash`
      # is the idiom submit-windows-store.yml's msstore-cli install already uses.
      # The pin is read from tooling/versions.json at run time, both halves, the
      # same way the linux lane reads its two.
      - name: Install glitchtip-cli (pinned by version AND by digest)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = node -p "require('./tooling/versions.json').glitchtip_cli"
          $sum = node -p "require('./tooling/versions.json').glitchtip_cli_windows_x86_64_sha256"
          $url = "https://gitlab.com/glitchtip/glitchtip-cli/-/jobs/artifacts/v$ver/raw/artifacts/glitchtip-cli-windows-x86_64.exe?job=build-windows-x86_64"
          $out = Join-Path $env:RUNNER_TEMP 'glitchtip-cli.exe'
          Invoke-WebRequest -Uri $url -OutFile $out -MaximumRetryCount 3 -RetryIntervalSec 5
          $got = (Get-FileHash -Algorithm SHA256 -Path $out).Hash.ToLower()
          if ($got -ne $sum) {
            Write-Error "glitchtip-cli digest mismatch: the download hashes to $got and tooling/versions.json declares $sum. A version names a release; the sha256 names the BYTES, and the asset is a GitLab JOB ARTIFACT URL, which is re-runnable. This refusal is the mechanism, not a gap in it."
          }
          $reported = & $out --version
          if ($reported -ne "glitchtip-cli $ver") {
            Write-Error "the pinned binary reports '$reported', not 'glitchtip-cli $ver'"
          }
          Write-Host $reported
      # why: FAILS CLOSED on a missing GLITCHTIP_TOKEN, never skips.
      # The wrapper exists because `debug-files upload` exits 0 over an empty
      # directory, over failed chunks and over an assembly that never completed —
      # its header names all three and the source lines they were read from.
      #
      # ⏱ MOVED 2026-09-09 — THIS PAIR USED TO SIT BEFORE `Package MSIX` AND
      # BEFORE EVERY ASSERTION IN THIS LANE, and the note here said so as if it
      # were a virtue: "BEFORE the MSIX packaging and every assertion below, so a
      # GlitchTip outage cannot take the mapping with it". The mapping is already
      # safe — `upload-artifact` above retains it for 90 days and runs first, and
      # that step is what the argument actually rested on. What the old position
      # bought instead was this: a TELEMETRY SINK sitting between an artifact and
      # its own verification. Measured, not supposed: today's apple lane took a
      # 404 from this upload (the GlitchTip project was still keyed to the old
      # slug) and GitHub skipped every step after it — so the .pkg was never
      # packaged and no signature was ever read. A monitoring outage decided
      # whether a shippable artifact was PROVEN signed. It cannot again: the
      # linux lane already ordered it this way, and both other lanes now match.
      - name: Upload the native debug symbols to GlitchTip
        shell: pwsh
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.GLITCHTIP_TOKEN }}
          GLITCHTIP_DSN: ${{ secrets.GLITCHTIP_DSN }}
          APP: ${{ matrix.app }}
        run: |
          $ErrorActionPreference = 'Stop'
          $gt = Get-Content -Raw tooling/ops/glitchtip-project.json | ConvertFrom-Json
          node tooling/ops/upload-native-symbols.mjs `
            --cli "${env:RUNNER_TEMP}/glitchtip-cli.exe" `
            --dir "apps/${env:APP}/build/symbols/windows" `
            --org $gt.org --project $gt.project
          if ($LASTEXITCODE -ne 0) { Write-Error "upload-native-symbols exited $LASTEXITCODE" }
      # why `store-`: the runner and the .msix are store-only under C-WINDOWS-STORE-ONLY — docs/ci/build-platforms.md §store-only.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: store-${{ matrix.app }}-windows
          path: |
            apps/${{ matrix.app }}/build/windows/x64/runner/Release
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: store-${{ matrix.app }}-windows-msix
          path: |
            apps/${{ matrix.app }}/build/windows/msix/*.msix
            apps/${{ matrix.app }}/build/windows/msix/*.msix.channel.json
          retention-days: 90
          if-no-files-found: error

  apple:
    name: macOS + iOS
    runs-on: macos-26
    timeout-minutes: 30
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.prepare.outputs.apps) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-flutter
      - name: Resolve the workspace
        run: flutter pub get --enforce-lockfile
      - name: Derive the release line from pubspec
        id: ver
        run: node tooling/ci/assert-app-versioning.mjs --emit apps/${{ matrix.app }} >> "$GITHUB_OUTPUT"
      - name: Toolchain under test
        run: |
          sw_vers
          xcodebuild -version
          flutter --version
      - name: The Xcode floor is met, not just declared
        run: node tooling/ci/assert-xcode-floor.mjs
      - name: Patch the SDK for flutter/flutter#188060 (macOS AOT abort)
        run: python3 tooling/ci/patch-flutter-macos-aot.py "$FLUTTER_ROOT"
      - name: Prepare the Apple distribution identity
        env:
          APPLE_DIST_CERT_P12_BASE64: ${{ secrets.APPLE_DIST_CERT_P12_BASE64 }}
          APPLE_DIST_CERT_PASSWORD: ${{ secrets.APPLE_DIST_CERT_PASSWORD }}
          APPLE_PROVISIONING_PROFILES_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILES_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_INSTALLER_CERT_P12_BASE64: ${{ secrets.APPLE_INSTALLER_CERT_P12_BASE64 }}
        run: node tooling/ci/apple-signing.mjs --app ${{ matrix.app }}
      # why: the Flutter templates ship AUTOMATIC signing with an empty team, and
      # automatic signing asks Apple for a profile at build time — the one thing
      # `apple-signing.mjs` refuses on purpose (see the box on exportOptionsPlist).
      # The settings are appended to the RUNNER's copy of the two Release
      # xcconfigs rather than committed, because `APPLE_TEAM_ID` is a repository
      # secret and a tracked xcconfig would publish it. `.xcconfig` is `KEY = value`
      # per line; appending is additive and the last assignment wins.
      #
      # 🔴 GUARDED BY THE POSTURE, NOT BY `if: always()`. On an unsigned build
      # proof there is no identity and these settings must NOT be written — a
      # project told to sign manually with an identity that is not there fails at
      # codesign instead of producing the unsigned proof the lane exists for.
      - name: Point the Xcode projects at the imported identity
        if: env.APPLE_SIGNING_POSTURE == 'release-signed'
        working-directory: apps/${{ matrix.app }}
        run: |
          set -euo pipefail
          # 🔴 THE `[sdk=iphoneos*]` FORM IS NOT OPTIONAL, AND OMITTING IT IS A
          # SILENT AD-HOC BUILD. The Flutter iOS template sets
          # `CODE_SIGN_IDENTITY[sdk=iphoneos*] = "iPhone Developer"` in the
          # .pbxproj, and a CONDITIONAL build setting outranks the unqualified
          # one wherever it is defined — so a plain `CODE_SIGN_IDENTITY` here is
          # simply not consulted for a device build. Both spellings are written.
          {
            echo ""
            echo "CODE_SIGN_STYLE = Manual"
            echo "DEVELOPMENT_TEAM = ${APPLE_TEAM_ID}"
            echo "CODE_SIGN_IDENTITY = ${APPLE_DIST_IDENTITY}"
            echo "CODE_SIGN_IDENTITY[sdk=iphoneos*] = ${APPLE_DIST_IDENTITY}"
            echo "PROVISIONING_PROFILE_SPECIFIER = ${APPLE_IOS_PROFILE_NAME}"
          } >> ios/Flutter/Release.xcconfig
          {
            echo ""
            echo "CODE_SIGN_STYLE = Manual"
            echo "DEVELOPMENT_TEAM = ${APPLE_TEAM_ID}"
            echo "CODE_SIGN_IDENTITY = ${APPLE_DIST_IDENTITY}"
            echo "PROVISIONING_PROFILE_SPECIFIER = ${APPLE_MACOS_PROFILE_NAME}"
          } >> macos/Runner/Configs/Release.xcconfig
          echo "::group::the appended iOS settings"
          tail -5 ios/Flutter/Release.xcconfig
          echo "::endgroup::"
      # why: `codesign` and `productbuild` search the keychain SEARCH LIST, and
      # `apple-signing.mjs` already put the per-run keychain on it. Xcode runs its
      # own child processes, so the list is the only thing that reliably reaches
      # them; nothing here re-points it, this step only proves it is still true
      # before eight minutes of compiling depend on it.
      - name: The signing identity is reachable from this shell
        if: env.APPLE_SIGNING_POSTURE == 'release-signed'
        run: |
          set -euo pipefail
          security list-keychains -d user
          security find-identity -v "$APPLE_KEYCHAIN_PATH"
      - name: Build macos
        id: build_macos
        working-directory: apps/${{ matrix.app }}
        run: >
          flutter build macos --release
          --obfuscate --split-debug-info=build/symbols/macos
          --build-name=${{ steps.ver.outputs.release_line }}.${{ github.run_number }}
          --build-number=${{ github.run_number }}
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }}
          --dart-define=APP_VERSION=${{ steps.ver.outputs.release_line }}.${{ github.run_number }}+${{ needs.prepare.outputs.GITHUB_SHA_SHORT }}
          --dart-define=RELEASE_CHANNEL=macos-appstore
          --dart-define=REVENUECAT_KEY=${{ secrets.REVENUECAT_PUBLIC_KEY_APPLE }}
          --dart-define=GLITCHTIP_DSN=${{ secrets.GLITCHTIP_DSN }}
      - name: The macOS bundle is signed by the identity this lane intended
        run: >
          node tooling/ci/assert-artifact-signed-apple.mjs
          apps/${{ matrix.app }}/build/macos/Build/Products/Release/*.app
      # why: App Store review reads these keys from the bundle, not the repo; an INFOPLIST_KEY_* setting can override the rendered source plist.
      - name: The macOS bundle carries the Info.plist keys app.yaml renders
        run: >
          node tooling/ci/assert-built-info-plist.mjs --app ${{ matrix.app }}
          apps/${{ matrix.app }}/build/macos/Build/Products/Release/*.app
      # ⏱ CHANGED 2026-09-09 — THIS WAS `flutter build ios --release --no-codesign`
      # FROM THE FIRST COMMIT OF THIS LANE, AND THAT COMMAND CANNOT EMIT AN .ipa.
      # It produced `build/ios/iphoneos/Runner.app` and nothing else, so the
      # ios-appstore row's declared `.ipa` had no filler and every green run of
      # this job proved only that the iOS modules compile. `flutter build ipa`
      # runs `xcodebuild archive` and then `-exportArchive` against the
      # ExportOptions.plist `apple-signing.mjs` wrote — same obfuscation flags,
      # same split-debug-info directory, so the symbols sink below is unchanged
      # and `assert-obfuscation-coupled.mjs` sees the same coupling it did before.
      #
      # `--export-options-plist` is passed ONLY on a signed lane. Without an
      # identity `flutter build ipa` cannot export, so the unsigned build proof
      # keeps the old command — the two branches below are the same build with
      # and without a signature, not two different postures bolted together.
      - name: Build ios (signed archive + export)
        id: build_ipa
        if: env.APPLE_SIGNING_POSTURE == 'release-signed'
        working-directory: apps/${{ matrix.app }}
        run: >
          flutter build ipa --release
          --export-options-plist "$APPLE_EXPORT_OPTIONS_PLIST"
          --obfuscate --split-debug-info=build/symbols/ios
          --build-name=${{ steps.ver.outputs.release_line }}.${{ github.run_number }}
          --build-number=${{ github.run_number }}
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }}
          --dart-define=APP_VERSION=${{ steps.ver.outputs.release_line }}.${{ github.run_number }}+${{ needs.prepare.outputs.GITHUB_SHA_SHORT }}
          --dart-define=RELEASE_CHANNEL=ios-appstore
          --dart-define=REVENUECAT_KEY=${{ secrets.REVENUECAT_PUBLIC_KEY_APPLE }}
          --dart-define=GLITCHTIP_DSN=${{ secrets.GLITCHTIP_DSN }}
      # why: the unsigned proof below makes no .ipa, so only the signed posture stamps one — docs/ci/build-platforms.md §channel-stamps.
      - name: Stamp the .ipa with the channel its build compiled in
        if: env.APPLE_SIGNING_POSTURE == 'release-signed'
        run: >
          node tooling/ci/stamp-channel.mjs --channel ios-appstore --build-step build_ipa
          apps/${{ matrix.app }}/build/ios/ipa/*.ipa
      - name: The .ipa carries the Info.plist keys app.yaml renders
        if: env.APPLE_SIGNING_POSTURE == 'release-signed'
        run: >
          node tooling/ci/assert-built-info-plist.mjs --app ${{ matrix.app }}
          apps/${{ matrix.app }}/build/ios/ipa/*.ipa
      - name: Build ios (no codesign — unsigned build proof)
        if: env.APPLE_SIGNING_POSTURE != 'release-signed'
        working-directory: apps/${{ matrix.app }}
        run: >
          flutter build ios --release --no-codesign
          --obfuscate --split-debug-info=build/symbols/ios
          --build-name=${{ steps.ver.outputs.release_line }}.${{ github.run_number }}
          --build-number=${{ github.run_number }}
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }}
          --dart-define=APP_VERSION=${{ steps.ver.outputs.release_line }}.${{ github.run_number }}+${{ needs.prepare.outputs.GITHUB_SHA_SHORT }}
          --dart-define=RELEASE_CHANNEL=ios-appstore
          --dart-define=REVENUECAT_KEY=${{ secrets.REVENUECAT_PUBLIC_KEY_APPLE }}
          --dart-define=GLITCHTIP_DSN=${{ secrets.GLITCHTIP_DSN }}
      # ⏱ MOVED 2026-09-07 (fix pass) — THIS STEP USED TO BE THE LAST ONE IN THE
      # JOB, and that lost the mapping it exists to keep. This unit states the
      # rule in the store lanes ("BEFORE the upload, not after -- a step placed
      # after a store upload does not run when that upload fails, which is
      # exactly when the build still exists and the symbols still can be kept")
      # and applied the inverse here. Proof, not theory: in dispatch run
      # 34093704881, `Build linux` succeeded WITH the flags, a later step failed,
      # and this artifact was `skipped` -- the obfuscated build's only mapping
      # was written and then destroyed with the runner. It now sits immediately
      # after the last `flutter build` of the job, ahead of every assertion and
      # every network call, so nothing downstream can take the symbols with it.
      # ⏱ CORRECTED 2026-09-07 (unit `symbols-everywhere`) — the note that stood
      # here said "same reason as the windows lane — one pinned glitchtip-cli
      # binary, and it is linux-x86_64", so these two mappings reached no sink.
      # The pin now exists: `glitchtip_cli_macos_arm64_sha256`, the digest of the
