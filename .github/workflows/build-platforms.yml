      # today; it existed only as printed plan text in apple-signing.mjs, and the
      # macos-appstore row's `*.pkg` glob had nothing to match. A Mac App Store
      # submission is a .pkg, never a .app, so the row declared a format the
      # pipeline could not produce.
      #
      # 🔴 TWO CERTIFICATES, AND THEY ARE NOT INTERCHANGEABLE. The .app inside is
      # signed by the Apple Distribution identity (the `Build macos` step above,
      # via the xcconfig). The PACKAGE is signed by "3rd Party Mac Developer
      # Installer", which is a different certificate and cannot sign code, just as
      # the distribution one cannot sign a package. Using the wrong one produces a
      # .pkg that builds and is refused at upload.
      #
      # `--component <app> /Applications` is the only mode productbuild(1) permits
      # for Mac App Store submission: "When creating product archives for
      # submission to the Mac App Store, use only the --component mode."
      - name: Package the macOS .pkg (Mac App Store)
        if: env.APPLE_SIGNING_POSTURE == 'release-signed'
        working-directory: apps/${{ matrix.app }}
        run: |
          set -euo pipefail
          app="$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' | head -1)"
          if [ -z "$app" ]; then
            echo "::error title=pkg::no .app in build/macos/Build/Products/Release to package"
            exit 1
          fi
          mkdir -p build/macos/pkg
          out="build/macos/pkg/${{ matrix.app }}.pkg"
          productbuild --component "$app" /Applications \
            --sign "$APPLE_INSTALLER_IDENTITY" \
            --keychain "$APPLE_KEYCHAIN_PATH" \
            "$out"
          ls -l "$out"
      # why: the .pkg wraps the .app `build_macos` compiled — docs/ci/build-platforms.md §channel-stamps.
      - name: Stamp the .pkg with the channel its build compiled in
        if: env.APPLE_SIGNING_POSTURE == 'release-signed'
        run: >
          node tooling/ci/stamp-channel.mjs --channel macos-appstore --build-step build_macos
          apps/${{ matrix.app }}/build/macos/pkg/*.pkg
      # ⏱ ADDED 2026-09-09. THIS STEP EXISTS BECAUSE EVERY STEP ABOVE CAN EXIT 0
      # WHILE PRODUCING AN UNSIGNED OR EMPTY ARTIFACT, which is the failure this
      # repository keeps hitting. Nothing below trusts an exit code: each check
      # reads the SIGNATURE back out of the bytes that will be uploaded.
      #
      # An .ipa is a ZIP — `codesign` cannot read one, so it is unzipped and the
      # payload bundle is what gets verified. The embedded profile is decoded with
      # `security cms -D` and its bundle id compared to the one the register
      # declares; a build signed by the right key against the wrong profile is
      # accepted by codesign and refused at upload, so the profile is checked
      # separately from the signature. `set -o pipefail` is why `grep -q` failing
      # is fatal here rather than merely quiet.
      - name: PROVE the .ipa and .pkg are real and signed
        if: env.APPLE_SIGNING_POSTURE == 'release-signed'
        working-directory: apps/${{ matrix.app }}
        run: |
          set -euo pipefail
          ipa="$(find build/ios/ipa -maxdepth 1 -name '*.ipa' | head -1)"
          [ -n "$ipa" ] || { echo "::error title=ipa::no .ipa was produced"; exit 1; }
          [ -s "$ipa" ] || { echo "::error title=ipa::the .ipa is empty"; exit 1; }
          echo "ipa: $ipa ($(stat -f%z "$ipa") bytes)"

          rm -rf "$RUNNER_TEMP/ipa-check" && mkdir -p "$RUNNER_TEMP/ipa-check"
          unzip -q "$ipa" -d "$RUNNER_TEMP/ipa-check"
          payload="$(find "$RUNNER_TEMP/ipa-check/Payload" -maxdepth 1 -name '*.app' | head -1)"
          [ -n "$payload" ] || { echo "::error title=ipa::the .ipa has no Payload/*.app"; exit 1; }

          echo "::group::codesign -dv --verbose=4 (the .ipa payload)"
          codesign -dv --verbose=4 "$payload" 2>&1 | tee "$RUNNER_TEMP/ipa-codesign.txt"
          echo "::endgroup::"
          grep -q "^Authority=${APPLE_DIST_IDENTITY}$" "$RUNNER_TEMP/ipa-codesign.txt" \
            || { echo "::error title=ipa::the payload's leaf Authority is not \"${APPLE_DIST_IDENTITY}\""; exit 1; }
          grep -q "^TeamIdentifier=${APPLE_TEAM_ID}$" "$RUNNER_TEMP/ipa-codesign.txt" \
            || { echo "::error title=ipa::the payload carries no TeamIdentifier=${APPLE_TEAM_ID}"; exit 1; }
          codesign --verify --strict "$payload"

          [ -f "$payload/embedded.mobileprovision" ] \
            || { echo "::error title=ipa::the payload has no embedded.mobileprovision"; exit 1; }
          security cms -D -i "$payload/embedded.mobileprovision" > "$RUNNER_TEMP/embedded.plist"
          echo "::group::the embedded provisioning profile"
          /usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/embedded.plist"
          /usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/embedded.plist"
          /usr/libexec/PlistBuddy -c 'Print :ExpirationDate' "$RUNNER_TEMP/embedded.plist"
          echo "::endgroup::"
          appid="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/embedded.plist")"
          # why: DERIVED, NOT SPELT. `matrix.app` is the slug and architecture
          # §24 defines the identity as `com.nikatru.<slug>` - the same rule
          # assert-store-identity.mjs:63 enforces across gradle, pbxproj and
          # xcconfig. Writing the id out here would either assert an id the app
          # has stopped building under, or be rewritten by the next rename and
          # stop being an independent statement about the PROFILE.
          #
          # ⚠️ A BUNDLE ID CHANGE NEEDS A NEW PROFILE FROM THE APPLE ACCOUNT.
          # A provisioning profile is issued against one App ID, so this check
          # fails - correctly and loudly - from the moment the slug moves until
          # a profile for the new id is issued and the secret replaced. That is
          # account-side work, not a repo edit.
          want="${APPLE_TEAM_ID}.com.nikatru.${{ matrix.app }}"
          [ "$appid" = "$want" ] \
            || { echo "::error title=ipa::embedded profile is for \"$appid\", not \"$want\""; exit 1; }

          # why: EVERY ENTITLEMENT THE APP DECLARES MUST BE IN THE SIGNATURE AND IN
          # THE EMBEDDED PROFILE. A key the app declares but the profile lacks is a
          # distribution rejection; a key the profile carries but the signature
          # lost is a capability that silently answers "not entitled" on device
          # ([ADR 082] §5: Declared Age Range then throws and the age gate reads no
          # signal). Derived from the app's own ios/Runner/Runner.entitlements, so
          # an app that declares nothing asserts nothing here.
          ent="ios/Runner/Runner.entitlements"
          if [ -f "$ent" ]; then
            codesign -d --entitlements - --xml "$payload" > "$RUNNER_TEMP/ipa-entitlements.plist"
            keys="$(/usr/libexec/PlistBuddy -c 'Print' "$ent" | sed -n 's/^    \([^ ]*\) = .*$/\1/p')"
            [ -n "$keys" ] || { echo "::error title=ipa::$ent declares no key this step could read"; exit 1; }
            echo "::group::declared entitlements, in the signature and the embedded profile"
            for key in $keys; do
              signed="$(/usr/libexec/PlistBuddy -c "Print :$key" "$RUNNER_TEMP/ipa-entitlements.plist" 2>/dev/null)" \
                || { echo "::error title=ipa::the signed app lacks declared entitlement $key"; exit 1; }
              profiled="$(/usr/libexec/PlistBuddy -c "Print :Entitlements:$key" "$RUNNER_TEMP/embedded.plist" 2>/dev/null)" \
                || { echo "::error title=ipa::the embedded profile lacks declared entitlement $key"; exit 1; }
              echo "$key signature=$signed profile=$profiled"
            done
            echo "::endgroup::"
          fi

          pkg="build/macos/pkg/${{ matrix.app }}.pkg"
          [ -s "$pkg" ] || { echo "::error title=pkg::the .pkg is missing or empty"; exit 1; }
          echo "pkg: $pkg ($(stat -f%z "$pkg") bytes)"
          echo "::group::pkgutil --check-signature"
          pkgutil --check-signature "$pkg" 2>&1 | tee "$RUNNER_TEMP/pkg-sig.txt"
          echo "::endgroup::"
          grep -q "signed by a developer certificate issued by Apple" "$RUNNER_TEMP/pkg-sig.txt" \
            || { echo "::error title=pkg::pkgutil does not report an Apple-issued signature"; exit 1; }
          grep -qF "$APPLE_INSTALLER_IDENTITY" "$RUNNER_TEMP/pkg-sig.txt" \
            || { echo "::error title=pkg::the .pkg is not signed by \"$APPLE_INSTALLER_IDENTITY\""; exit 1; }

          echo "::group::codesign -dv --verbose=4 (the .app the .pkg wraps)"
          codesign -dv --verbose=4 build/macos/Build/Products/Release/*.app 2>&1
          echo "::endgroup::"
      - name: The iOS bundle is signed by the identity this lane intended
        if: env.APPLE_SIGNING_POSTURE != 'release-signed'
        run: >
          node tooling/ci/assert-artifact-signed-apple.mjs
          apps/${{ matrix.app }}/build/ios/iphoneos/*.app
      - name: The iOS bundle carries the Info.plist keys app.yaml renders
        if: env.APPLE_SIGNING_POSTURE != 'release-signed'
        run: >
          node tooling/ci/assert-built-info-plist.mjs --app ${{ matrix.app }}
          apps/${{ matrix.app }}/build/ios/iphoneos/*.app
      - name: Every artifact this lane claims exists, and is not empty
        run: >
          node tooling/ci/assert-artifact-shape.mjs
          --app ${{ matrix.app }} --platform apple
      # why: `shasum -a 256`, not `sha256sum` — macOS ships the Perl `shasum` and
      # does NOT ship coreutils' `sha256sum`, so the linux lane's line would fail
      # here for a reason that has nothing to do with the digest. `--check
      # --strict` is the same refusal either way.
      - name: Install glitchtip-cli (pinned by version AND by digest)
        run: |
          set -euo pipefail
          ver="$(node -p "require('./tooling/versions.json').glitchtip_cli")"
          sum="$(node -p "require('./tooling/versions.json').glitchtip_cli_macos_arm64_sha256")"
          url="https://gitlab.com/glitchtip/glitchtip-cli/-/jobs/artifacts/v${ver}/raw/artifacts/glitchtip-cli-macos-arm64?job=build-macos-arm64"
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            --output "${RUNNER_TEMP}/glitchtip-cli" "$url"
          printf '%s  %s\n' "$sum" "${RUNNER_TEMP}/glitchtip-cli" | shasum -a 256 --check --strict -
          chmod +x "${RUNNER_TEMP}/glitchtip-cli"
          got="$("${RUNNER_TEMP}/glitchtip-cli" --version)"
          if [ "$got" != "glitchtip-cli ${ver}" ]; then
            echo "::error title=glitchtip-cli::the pinned binary reports \"${got}\", not \"glitchtip-cli ${ver}\""
            exit 1
          fi
          echo "$got"
      # why: TWO directories, one per build, uploaded separately — macOS and iOS
      # are two AOT compilations and nothing guarantees they share a mapping.
      # FAILS CLOSED on a missing GLITCHTIP_TOKEN, never skips.
      #
      # ⏱ MOVED 2026-09-09 — THIS IS THE STEP THAT HID THE DEFECT. It stood
      # BEFORE `Package the macOS .pkg` and before `PROVE the .ipa and .pkg are
      # real and signed`, and on 2026-09-09 it returned 404 because the GlitchTip
      # project was still named for the retired slug. GitHub skipped everything
      # after it, so no .pkg was produced and no signature was ever read back —
      # the two steps whose entire purpose is to refuse an unsigned artifact were
      # decided by a telemetry sink. The symbols themselves were never at risk:
      # `upload-artifact` above keeps both mappings for 90 days and still runs
      # immediately after the last `flutter build`, ahead of everything. Only the
      # NETWORK CALL moved, and it now runs last in the lane, after the proofs.
      - name: Upload the native debug symbols to GlitchTip
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.GLITCHTIP_TOKEN }}
          GLITCHTIP_DSN: ${{ secrets.GLITCHTIP_DSN }}
          APP: ${{ matrix.app }}
        run: |
          set -euo pipefail
          gt_org="$(node -p "require('./tooling/ops/glitchtip-project.json').org")"
          gt_project="$(node -p "require('./tooling/ops/glitchtip-project.json').project")"
          for lane in macos ios; do
            node tooling/ops/upload-native-symbols.mjs \
              --cli "${RUNNER_TEMP}/glitchtip-cli" \
              --dir "apps/${APP}/build/symbols/${lane}" \
              --org "$gt_org" --project "$gt_project"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.app }}-macos
          path: apps/${{ matrix.app }}/build/macos/Build/Products/Release
          retention-days: 90
          if-no-files-found: error
      # why: a SEPARATE artifact from the .app above, and named for the posture
      # for the same reason the iOS one is — the .pkg is the submittable format
      # and the .app is the build proof, and an artifact list that cannot tell
      # them apart is how an unsigned proof gets mistaken for a release.
      # why `store-` on the .pkg and the .ipa: both are store-only, outside the release job's `<app>-*` download — docs/ci/build-platforms.md §store-only.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: env.APPLE_SIGNING_POSTURE == 'release-signed'
        with:
          name: store-${{ matrix.app }}-macos-pkg
          path: |
            apps/${{ matrix.app }}/build/macos/pkg/*.pkg
            apps/${{ matrix.app }}/build/macos/pkg/*.pkg.channel.json
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: env.APPLE_SIGNING_POSTURE == 'release-signed'
        with:
          name: store-${{ matrix.app }}-ios-${{ env.APPLE_SIGNING_POSTURE }}
          path: |
            apps/${{ matrix.app }}/build/ios/ipa/*.ipa
            apps/${{ matrix.app }}/build/ios/ipa/*.ipa.channel.json
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: env.APPLE_SIGNING_POSTURE != 'release-signed'
        with:
          name: ${{ matrix.app }}-ios-${{ env.APPLE_SIGNING_POSTURE }}
          path: apps/${{ matrix.app }}/build/ios/iphoneos
          retention-days: 90
          if-no-files-found: error

  all_platforms:
    name: all-platforms
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # why: this aggregate treats 'skipped' as not-green as well as failure and
    # cancelled. A job-level if: on any platform job would otherwise let it print
    # "All 6 platforms built" over a platform that never built.
    needs: [gate, prepare, linux_web_android, windows, apple, release]
    if: always()
    steps:
      - name: Require every platform green
        run: |
          echo "gate=${{ needs.gate.result }} prepare=${{ needs.prepare.result }} linux_web_android=${{ needs.linux_web_android.result }} windows=${{ needs.windows.result }} apple=${{ needs.apple.result }} release=${{ needs.release.result }}"
          # 'skipped' added by review 2026-07-31: a job-level `if:` on any
          # platform job would otherwise let this print "All 6 platforms built"
          # over a platform that never built.
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ] || [ "${{ contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "::error::One or more platform builds failed"; exit 1
          fi
          echo "All 6 platforms built"

  release:
    name: Durable release artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs:
      - gate
      - prepare
      - linux_web_android
      - windows
      - apple
    permissions:
      contents: write
      deployments: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.prepare.outputs.apps) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: downloads
          pattern: ${{ matrix.app }}-*
      # why: the apps.gov.in .apk reaches the release ONLY under the one name the owner may upload
      # (assert-apps-gov-in-apk.mjs uploadableArtifactName; assert-release-json.mjs limb 10 holds this
      # line to it), so a NOT-FOR-UPLOAD .apk is never downloaded. An exact `pattern:` and not `name:`:
      # download-artifact v4.3.0 throws "Artifact '…' not found" for a missing `name:`, and until the
      # owner's pin is set (O-APPS-GOV-IN-SIGNING-KEY) no run uploads this name. A pattern with no
      # match downloads nothing and the step passes; the next step says why in one line.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: downloads
          pattern: apps-gov-in-${{ matrix.app }}-apk
      # why: an absent uploadable .apk is the owner's open pin, not a build defect: one line, no .apk staged, exit 0.
      - name: The uploadable apps.gov.in .apk, or one line naming the null pin
        env:
          AGI_DIR: downloads/apps-gov-in-${{ matrix.app }}-apk
        run: |
          set -euo pipefail
          pin="$(node -p "require('./tooling/channel-register.json').channels.find((c) => c.id === 'apps-gov-in').signing.signingCertificate.sha256")"
          if [ -d "$AGI_DIR" ]; then
            echo "uploadable apps.gov.in apk downloaded into ${AGI_DIR}; --stage takes it with its stamp"
          elif [ "$pin" = "null" ]; then
            echo "no uploadable apps.gov.in apk: signingCertificate.sha256 is null"
          else
            echo "::error title=apps.gov.in apk::signingCertificate.sha256 is ${pin} and this run uploaded no $(basename "$AGI_DIR") artifact"
            exit 1
          fi
      - name: Stage the installers and archive the rest
        env:
          APP: ${{ matrix.app }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
          else
            TAG="${APP}-untagged-$(git rev-parse --short HEAD)"
          fi
          echo "RELEASE_TAG=${TAG}" >> "$GITHUB_ENV"
          # AUTHORITATIVE, and it sits here rather than after `--stage` because
          # this is the last moment the installers still carry their build names:
          # `--stage` renames every one of them after $TAG. `set -euo pipefail`
          # above is what makes a non-zero exit fail the job.
          # UNCONDITIONAL on purpose — on a non-tag run $TAG is the
          # `<app>-untagged-<sha>` value synthesised above, which the guard treats
          # as a no-op ONLY with --ref-type branch (a pushed tag in that shape is
          # refused), so every dispatch and every scheduled run still exercises
          # the parse and proves the code loads. Gating this on
          # `ref_type == 'tag'` would leave it dead until the first real release.
          node tooling/ci/assert-app-versioning.mjs --tag "$TAG" --ref-type "$REF_TYPE" --app "apps/$APP"
          mkdir -p dist
          # Each installer's build stamp goes to stamps/, never to dist/ (flat, and
          # published whole); the next step reads each file's channel from there.
          node tooling/ci/release-manifest.mjs --stage downloads --out dist --stamps stamps --app "$APP" --tag "$TAG" --ref-type "$REF_TYPE"
          # --stage has already refused any store-only file under downloads/, so
          # nothing this loop archives is one (docs/ci/build-platforms.md §store-only).
          for d in downloads/*/; do
            [ -d "$d" ] || continue
            n="$(basename "$d")"
            if [ -z "$(find "$d" -type f -print -quit)" ]; then
              echo "skip  ${n} — every file in it was staged as an installer"
              continue
            fi
            tar -czf "dist/${TAG}-${n}.tar.gz" -C "$d" .
            echo "archived  ${TAG}-${n}.tar.gz"
          done
      # why: BEFORE the manifest, never after. SHA256SUMS has to NAME release.json
      # or the one file that describes the release is the one file nobody can
      # verify — and `sha256sum -c` would still print ok, because it only checks
      # what it lists. assert-release-durable.mjs limb 2 holds this order so a
      # later edit cannot quietly swap the two steps.
      # UNCONDITIONAL, for the same reason the versioning guard three steps up is:
      # on a non-tag run $RELEASE_TAG is the `<app>-untagged-<sha>` sentinel, which
      # the schema and the guard both accept, so every dispatch and every scheduled
      # run exercises this. Gating it on `ref_type == 'tag'` would leave it dead
      # until the first real release, which is the failure this record exists for.
      - name: Describe the release, versioned per artefact
        env:
          APP: ${{ matrix.app }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASES_BASE: ${{ github.server_url }}/${{ github.repository }}/releases/tag
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          # $RELEASE_TAG comes from $GITHUB_ENV two steps up; composing the notes
          # URL here rather than in `env:` keeps the one declaration of the tag.
          NOTES_URL="${RELEASES_BASE}/${RELEASE_TAG}"
          # The SAME emitter the build jobs read, run again here rather than passed
          # between jobs: a release line carried through a job output is a second
          # copy of pubspec.yaml's number, and the copy is what drifts.
          RELEASE_LINE="$(node tooling/ci/assert-app-versioning.mjs --emit "apps/${APP}" | sed -n 's/^release_line=//p')"
          # 🔴 THE ARTEFACTS DO NOT CARRY THE TAG'S NUMBER. The build jobs build
          # with `--build-name=<release line>.<run number>`, so the bytes say
          # 1.0.<run> while the tag says 1.0.0. The record states what was BUILT;
          # the guard requires only that major.minor agree with the tag.
          # ⚠️ `$?` IS NOT READ AFTER A PIPE ANYWHERE IN THIS STEP — `set -euo
          # pipefail` on line 1 is what makes a failing substitution fail the job.
          # 🔴 NO --min-supported HERE. The release line is MAJOR.MINOR ("1.0"), and
          # passing it as the floor is what failed run 35829208001's grade step:
          # `#/minSupported: "1.0" does not match ^[0-9]+\.[0-9]+\.[0-9]+$`. The
          # emitter reads the app surface's floor from the file the platform Worker
          # enforces force-update from, services/platform/src/app-config-data.json
          # (apps.<app>.min_supported_version[<channel>], else [default], else defaults), and REFUSES the flag on
          # this surface, so a second, typed copy of that number cannot come back.
          RELEASED_AT="$(TZ=UTC git show -s --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ "$GITHUB_SHA")"
          node tooling/ci/release-manifest.mjs --emit-release-json dist \
            --app "$APP" --tag "$RELEASE_TAG" --sha "$GITHUB_SHA" \
            --run-url "$RUN_URL" --notes-url "$NOTES_URL" \
            --released-at "$RELEASED_AT" \
            --version "${RELEASE_LINE}.${RUN_NUMBER}" \
            --build "$RUN_NUMBER" \
            --stamps stamps
      - name: Write the checksum manifest, naming the gated commit
        env:
          APP: ${{ matrix.app }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >
          node tooling/ci/release-manifest.mjs --write dist
          --app "$APP" --tag "$RELEASE_TAG" --sha "$GITHUB_SHA" --run-url "$RUN_URL"
      # why: written and then re-read. A manifest checked only by the process that wrote
      # it proves the writer was self-consistent, not that the assets on disk match.
      - name: Re-verify every asset against the manifest
        run: >
          node tooling/ci/release-manifest.mjs --verify dist
          --expect-formats --for-workflow .github/workflows/build-platforms.yml
      # why: the manifest answers "are these the bytes that were staged". This
      # answers "is what the record SAYS about them true" — the sizes, the
      # per-artefact versions, and the channels each file may actually be
      # submitted to. Two different questions over the same directory, and the
      # second one is the one a downloader and a store both read.
      - name: Grade the release record against the bytes beside it
        run: node tooling/ci/assert-release-json.mjs --dir dist
      # why: the publish below is tag-gated, so on every other run (the cron, a dispatch) the
      # record and its manifest left with the runner (O-NON-TAG-RELEASE-RECORD-DISCARDED). Named
      # release-record-<app>, never <app>-…: the first download above takes `<app>-*`, and a
      # re-run would pull an <app>- name into downloads/ and stage it as a build artifact.
      # `!cancelled()`: a record the grade refused is the one most worth keeping.
      - name: Keep the release record (non-tag runs)
        if: ${{ !cancelled() && github.ref_type != 'tag' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-record-${{ matrix.app }}
          path: |
            dist/release.json
            dist/SHA256SUMS
          if-no-files-found: warn
          retention-days: 90
      - name: Publish the GitHub Release (tag pushes only)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo "Built from commit \`${GITHUB_SHA}\`, which passed \`ci-gate\` before any binary in this release existed."
            echo
            echo "Verify every download with a tool you already have:"
            echo
            echo "    sha256sum -c SHA256SUMS"
            echo
            echo "Produced by ${RUN_URL}"
          } > dist-notes.md
          gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file dist-notes.md $(node tooling/ci/release-manifest.mjs --emit-assets dist)
          echo "RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url --jq .url)" >> "$GITHUB_ENV"
      - name: The release must carry the assets this job just uploaded
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "⬜ [14]O-7 reading back the release ${REPO}@${RELEASE_TAG}"
          node tooling/ops/post-deploy-smoke.mjs --release-repo "$REPO" --release-tag "$RELEASE_TAG" --release-manifest dist/SHA256SUMS
      - name: Record what shipped, per channel this release is the origin for
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          APP: ${{ matrix.app }}
        run: |
          set -euo pipefail
          for environment in $(node tooling/ci/release-manifest.mjs --emit-environments dist --app "$APP"); do
            node tooling/ci/record-deployment.mjs "$environment" "$RELEASE_URL"
          done
