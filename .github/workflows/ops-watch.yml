name: Ops watch

run-name: "Ops watch (${{ github.event_name }})"

# The measurements, retractions and traps behind this file are in
# docs/ci/ops-watch.md. Only `# why:` lines live here, and
# docs/ci/README.md carries the rules every workflow has to obey.

on:
  workflow_dispatch:
    # why: the land scripts dispatch this workflow after EVERY merge. The weekly failed-run ledger (~200
    # API requests, and red by design while a failure lacks a recorded cause) must not ride those: on
    # 2026-09-26 it turned ops-watch #526 and #527 red on the first two post-merge dispatches after #959.
    # A person who wants the ledger now asks for it with this input; the Monday slot runs it regardless.
    inputs:
      failure_ledger:
        description: 'Also run the weekly failed-run ledger (about 200 API requests; off for post-merge dispatches)'
        type: boolean
        default: false
      # why: the same rule for the Renovate backlog reader, which is red for as long as the queue outruns its floors.
      renovate_backlog:
        description: 'Also read the Renovate backlog against its floors (red while the queue outruns them; off for post-merge dispatches)'
        type: boolean
        default: false
      # why: the same rule for the code-scanning age reader, which is red while a high/critical alert stands untriaged past 7 days.
      code_scanning_age:
        description: 'Also read the open code-scanning alerts against their 7-day triage window (off for post-merge dispatches)'
        type: boolean
        default: false
      # why: the same rule for the tech-currency reader, which is red for as long as a proposal stands.
      tech_currency:
        description: 'Also read what the pipeline runs on against what its vendors retire (red while a proposal stands; off for post-merge dispatches)'
        type: boolean
        default: false
      # why: the same rule for the daily OSV scan of main, which is red for as long as an advisory stands.
      dependency_advisories:
        description: 'Also scan every tracked lockfile on main with OSV-Scanner (red while an advisory stands; off for post-merge dispatches)'
        type: boolean
        default: false
      # why: the platform Worker's six-hourly dispatch sets this and nothing else does. Nobody watches that run,
      # so its failure files the ops-watch issue as a scheduled run's does; land-script and hand dispatches leave it off.
      unattended:
        description: 'Set by the platform Worker cron only: nobody is watching this run, so a failure files the ops-watch issue (off for land-script and hand dispatches)'
        type: boolean
        default: false
  # why: TWELVE slots, and every gap was COMPUTED including the wrap past midnight --
  # a sorted list shows every gap except the circular one. GitHub delivers this
  # repository's scheduled runs 10.1% on time, so density is what buys the alarm
  # chain a real chance of firing; docs/ci/ops-watch.md carries the measurement.
  schedule:
    - cron: '30 7 * * *' # 07:30 UTC daily, 90 minutes after the cron it watches
    - cron: '45 7 * * 1' # Mondays, 15 minutes after the daily run has settled
    - cron: '50 8 * * *' # mid-morning slot (also healed the 2026-08-10 freeze same-day)
    - cron: '30 19 * * *' # evening slot — the standing densify
    - cron: '30 0 * * *' # fills the overnight hole
    - cron: '30 2 * * *' # ditto
    - cron: '30 4 * * *' # ditto
    - cron: '0 11 * * *' # fills the 08:50 -> 12:30 hole
    - cron: '30 12 * * *' # fills the 08:50 -> 19:30 hole
    - cron: '30 15 * * *' # ditto
    - cron: '30 17 * * *' # ditto
    - cron: '30 22 * * *' # closes the 19:30 -> 00:30 hole, the worst one left

# why: empty at file level; each job grants only what it needs. The alert job is
# the only one that may write issues.
permissions: {}

concurrency:
  # why: cancel-in-progress FALSE. These slots are the alarm clock; a later slot
  # killing the run in flight would silently drop the proof that slot existed for.
  group: ops-watch
  cancel-in-progress: false

jobs:
  heartbeats:
    name: Every declared duty is fresh — the heartbeat rail AND the register
    runs-on: ubuntu-24.04
    # why: 15, not 10 — the daily OSV steps below carry their own 3 + 5 minute bounds on top of the readers.
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node

      - name: The whole ops register — every duty, not just the heartbeat-backed ones
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GLITCHTIP_TOKEN: ${{ secrets.GLITCHTIP_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_READ_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tooling/ci/assert-ops-register.mjs

      - name: Read the heartbeat table from OUTSIDE Cloudflare
        if: ${{ !cancelled() }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_READ_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # why: set +e, or exit 2 (COVERAGE LOST) fails this step exactly like
        # exit 1 and the distinction check-heartbeats.mjs draws is lost here.
        run: |
          set +e
          node tooling/ops/check-heartbeats.mjs
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::error title=Heartbeats are UNKNOWN — the table was not read::check-heartbeats could not reach D1, could not read its schema, or found a job it has no expectation for. NOTHING was judged, so no job is known to be late; the step log names what could not be read."
          elif [ "$code" -eq 1 ]; then
            echo "::error title=A scheduled job has stopped beating::The heartbeat table was read and a job is missing or late past its window. The step log names the job, its newest beat and its window."
          fi
          exit "$code"

      # why: CLOUDFLARE_D1_TOKEN, not the read token: this reader executes guarded writes (its header).
      - name: Live D1 still runs every statement the Workers send it
        if: ${{ !cancelled() }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          node tooling/ops/check-d1-accepts-live-sql.mjs
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            # NO BACKTICKS ANYWHERE IN THESE STRINGS: they are double-quoted, so
            # a backtick opens a command substitution and the annotation would
            # silently execute part of itself.
            echo "::error title=D1 statement acceptance is UNKNOWN — nothing was executed::The check could not reach D1, could not read a schema, or a database did not refuse the known-bad control statement. NOTHING was judged. A negative control that comes back accepted means the harness is not talking to a real authorizer, and a sweep in that state waves every statement through — which is indistinguishable from a healthy one."
          elif [ "$code" -eq 1 ]; then
            echo "::error title=Live D1 REFUSES a statement the Workers deploy::A statement in services/*/src is rejected by D1's authorizer at runtime, or a write guarded by an unmatched key changed a row. The last time the first was true, every in-app account deletion had been failing with 503 for months while every check was green. The failing statement, its file and its line are in the step log."
          fi
          exit "$code"

      - name: Judge whether the analytics rail's silence is a FAULT
        if: ${{ !cancelled() }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_READ_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          node tooling/ops/check-analytics-liveness.mjs
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            # NO BACKTICKS ANYWHERE IN THESE STRINGS: they are double-quoted, so
            # a backtick opens a command substitution and the annotation would
            # silently execute part of itself.
            echo "::error title=Analytics liveness is UNKNOWN — the duty did not run::The reader could not reach D1, found no (portfolio) heartbeat row, or the row's detail did not carry the structured tokens it parses. NOTHING judged the rail. This fails on purpose: 'I could not tell' must never read as 'it is fine' — an empty events table already looks exactly like a quiet week."
          elif [ "$code" -eq 1 ]; then
            echo "::error title=The analytics rail is SILENT while users CONSENTED::Consent artifacts landed inside the same window and zero events did. Consent arrives on POST /v1/consent — a different route, transport and table — so reach is PROVEN and arrivals are ZERO. Check, in order: the client event queue flushing at all; POST /v1/events answering 2xx from the app origin (CORS); and the ingest dedup, which drops a duplicate event_id silently by design."
          fi
          exit "$code"

      # why (2026-10-01, PB-27): Box B and Box C config is applied over SSH and
      # re-vendored by hand, and nothing compared the two. Each box's cron posts
      # the hashes of its live compose, override and tunnel config to the
      # platform Worker (box-scoped secret, then D1); this READS that table and
      # compares it with tooling/ops/box-config-vendored.json. CI never SSHes in.
      # why: a STEP in this job, for the reason the name-clearance step below gives.
      - name: Each box's live config is the vendored config
        if: ${{ !cancelled() }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_READ_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          node tooling/ops/check-box-config-drift.mjs
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            # NO BACKTICKS ANYWHERE IN THESE STRINGS (see the step above).
            echo "::error title=Box config drift is UNKNOWN — nothing was compared::The box_config_manifest table could not be read, or tooling/ops/box-config-vendored.json carries an entry with no vendored hash. NOTHING was judged, and that is never a pass. The step log names what could not be read."
          elif [ "$code" -eq 1 ]; then
            echo "::error title=A box's live config is not the vendored config, or the box stopped reporting::A hash differs, a declared file is missing or undeclared, or a box has not posted inside its window. The step log names the box and the file. Re-vendor the live file (and refresh the register) or put the vendored file back on the box; the box cron is tooling/ops/boxes/post-config-manifest.sh."
          fi
          exit "$code"

      # why: the 30-day ceiling on apps/*/name-clearance.json, read DAILY and OFF
      # the pull-request path. ci.yml runs this guard without `--execute` on
      # purpose: every record shares a birthday, and a gate that refuses every
      # pull request on the day a window closes is a gate that gets skipped. Here a
      # stale record pages through the alert job instead.
      # why: a STEP in this job, not a job of its own. A new job joins a duty
      # row's `unit.jobs`, and every ops-watch run before it lacks that job, so
      # the row would read NO SUCCESSFUL RUN on main until one landed. This job
      # runs assert-ops-register, so it is no row's unit and ages none.
      # why: no `env:`. The guard reads JSON from the checkout and touches no
      # network and no secret; `--execute` turns one limb, the age of `asOf`,
      # from a warning into a finding.
      - name: Every name-clearance record is inside its 30-day ceiling
        if: ${{ !cancelled() }}
        run: |
          set +e
          node tooling/ci/assert-name-clearance.mjs --execute
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::error title=Name clearance is UNKNOWN - nothing was graded::The register, the catalogue, the schema or a record could not be read, so NO record was judged. That is never a pass: an unread record could be any age."
          elif [ "$code" -eq 1 ]; then
            echo "::error title=A name-clearance record is past its ceiling, or another finding stands::The step log names the record and the finding. Past 30 days, name-clearance.yml has not landed a refresh: read its newest scheduled run, which is red or absent, and what it says to do."
          fi
          exit "$code"

      # why: [rv2-security-004] an advisory against an UNCHANGED main was seen only when the next unrelated pull
      # request's security-scan met it (js-yaml #557, 2026-09-08; markdown-it PR #1063, 2026-09-30). These two
      # steps run ci.yml's own pinned OSV-Scanner and script over main, and a red one pages through `alert`.
      # why: STEPS in this job, not a job of their own, for the name-clearance step's reason above; a new job
      # was measured costing assert-ops-register's replay 45 GitHub requests against its ceiling of 30.
      # why: DUE, NOT ONE SLOT (#1095 review finding 5). The 07:30 slot alone was dropped as often
      # as GitHub drops slots (trap ci-16), and a dropped slot was a day with no scan that nothing
      # noticed. Any SCHEDULED run scans when the newest graded scan is over 20 h old, and past
      # 36 h the step warns; a dispatch scans only when it asks by name (trap ci-55).
      - name: Is the daily OSV scan of main due on this run
        id: osvdue
        if: ${{ !cancelled() && github.event_name == 'schedule' }}
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tooling/ops/osv-scan-due.mjs
      - name: Install OSV-Scanner (version and digest from tooling/versions.json)
        id: osv
        if: ${{ !cancelled() && (steps.osvdue.outputs.due == 'true' || inputs.dependency_advisories) }}
        timeout-minutes: 3
        run: node tooling/ci/install-pinned-tool.mjs osv-scanner --out "${RUNNER_TEMP}"

      - name: Known-vulnerable dependencies on main (canary, floor, then the tree)
        if: ${{ !cancelled() && steps.osv.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          set +e
          node tooling/ci/scan-dependencies.mjs --osv "${RUNNER_TEMP}/osv-scanner"
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::error title=The dependency scan is UNKNOWN - nothing was graded::OSV did not flag its canary lockfile, did not read every tracked lockfile, could not reach its database, or answered in a shape the script cannot read. NOTHING about main's dependencies is known from this run, and that is never a pass. The step log names which."
          elif [ "$code" -eq 1 ]; then
            echo "::error title=A known advisory stands against a lockfile on main::The step log names each vulnerable package, its lockfile and its advisory ids. Move it to a fixed version in a pull request; one that cannot be fixed yet is acknowledged in osv-scanner.toml with a dated ignoreUntil. The next pull request's security-scan is red on it too until then."
          fi
          exit "$code"

  status:
    name: Every enumerated surface produced its expected output
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node

      - name: Probe every surface the register enumerates
        run: |
          set +e
          node tooling/ops/status.mjs
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::error title=Ops status could not look::exit 2 — NOTHING was probed. This is not a healthy portfolio and it is not an unhealthy one; it is an unreadable register or an unreachable prober, and it must be treated as the more serious of the two."
          fi
          exit "$code"

  # why: lane status-page (O-PUBLIC-STATUS-PAGE-MISSING, R11-02). The public face of the probe above:
  # the SAME tooling/ops/status.mjs verdicts (no second checker, no new secret), rendered by
  # tooling/status/build-status.mjs and published to status.nikatru.com ONLY when a component's state
  # differs from the live status.json, or the last publish was on an earlier UTC day. Two identical
  # beats publish once. Inert until the lead creates the `nikatru-status` Pages project and the `status`
  # DNS record and sets STATUS_PAGE_LIVE=true (lead steps).
  status-page:
    name: Publish the status page when a state changes, and once a day
    if: vars.STATUS_PAGE_LIVE == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      actions: read
      checks: read
      deployments: write
    concurrency:
      group: status-page-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Refuse any ref but main
        id: ref
        run: node tooling/ci/assert-deploy-ref.mjs --allow main

      - uses: ./.github/actions/setup-node

      # why: it needs the ref check's result, so it names it (the reader-skip rule, O-OPS-WATCH-HEARTBEAT-READER-SKIPPED).
      - name: Read the surfaces and the live document, build, and decide
        id: build
        if: ${{ !cancelled() && steps.ref.outcome == 'success' }}
        run: |
          set -uo pipefail
          node tooling/ops/status.mjs --json "$RUNNER_TEMP/readings.json" > "$RUNNER_TEMP/status.log" 2>&1
          code=$?
          echo "status.mjs exit: $code"
          curl -fsS --max-time 15 https://status.nikatru.com/status.json -o "$RUNNER_TEMP/prev.json" || rm -f "$RUNNER_TEMP/prev.json"
          rm -rf build/status
          mkdir -p build/status
          cp -R sites/status/. build/status/
          node tooling/status/build-status.mjs --out build/status --readings "$RUNNER_TEMP/readings.json" --prev "$RUNNER_TEMP/prev.json" --github-output "$GITHUB_OUTPUT"

      # why: the page is published from main's HEAD, so it ships only bytes ci-gate passed.
      - name: ci-gate passed for this commit
        if: steps.build.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tooling/ci/assert-gate-passed.mjs ${{ github.sha }}

      - name: Deploy the status page to nikatru-status
        if: steps.build.outputs.publish == 'true'
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: '4.143.0'
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: build/status
          command: pages deploy . --project-name=nikatru-status --branch=main

      - name: Smoke — status.nikatru.com serves THIS build
        if: steps.build.outputs.publish == 'true'
        run: node tooling/status/build-status.mjs --smoke https://status.nikatru.com --built build/status/status.json

      - name: Record the deployed SHA
        if: always() && steps.deploy.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_DEPLOYMENT_ID: ${{ steps.deploy.outputs.pages-deployment-id }}
        run: node tooling/ci/record-deployment.mjs status-site https://status.nikatru.com --pages-deployment-id "$PAGES_DEPLOYMENT_ID"

  supabase-drift:
    name: The live auth config still matches what the repo recorded
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node

      - name: Compare the live Supabase auth config against tooling/mail-transport.json
        env:
          SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set +e
          node tooling/ops/verify-supabase-templates.mjs
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::error title=Supabase drift is UNKNOWN — nothing was compared::The script found no SUPABASE_PAT / SUPABASE_PROJECT_REF, or could not read the live auth config from the Management API (the log above says which), so NOTHING compared the live auth config against tooling/mail-transport.json or the DR templates in docs/platform/supabase/email-templates/. This fails on purpose: 'I could not look' must never read as 'I looked and it was fine'. OWNER ACTION — add SUPABASE_PAT and SUPABASE_PROJECT_REF as repository secrets. Until then this duty is unperformed, and on 2026-08-04 a one-field PATCH wiped the live SMTP block and reverted all three branded templates, recovering byte-for-byte only because those files happened to still match."
          elif [ "$code" -eq 1 ]; then
            echo "::error title=Supabase auth config has DRIFTED::The live project no longer matches what the repo recorded. Decide which side is wrong before editing either — the log above names every field and file that differs."
          fi
          exit "$code"

      # why: A KEY ROTATED ON THE AUTH HOST BREAKS SIGN-IN WITH NOTHING RED. The
      # site serves sites/nikatru/js/signin.js with the publishable key as a
      # literal, and every page still answers 200 when the auth host no longer
      # accepts it. This reads the script the LIVE site serves, takes its auth host
      # and its one sb_publishable_ key, and asks that host's /auth/v1/settings
      # with the key in `apikey`, as a browser would. The key is printed as sha8
      # only. It needs no secret: the key is public by design, so there is no `env:`.
      #
      # why: IN THIS JOB because it is the job that holds the live auth config
      # against what the repo recorded, and supabase-drift is already a unit of
      # duty.workflow.ops-watch.yml, so it needs no register row of its own. It runs
      # whatever the step above found: that step reads the hosted project and its
      # PAT, this one reads the self-hosted host with no credential at all.
      - name: The live site's sign-in key is accepted by the auth host
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        run: |
          set +e
          node tooling/ops/check-live-signin-key.mjs
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::error title=The live sign-in key is UNKNOWN - it was not judged::The site or the auth host did not answer, answered 429/5xx through every retry, hung, or answered something that says nothing about the key. NOTHING about whether sign-in works is known from this run, and that is never a pass. The step log names the URL."
          elif [ "$code" -eq 1 ]; then
            echo "::error title=Sign-in is broken - the live site's publishable key is refused or missing::Either the auth host refuses the key the live site serves (401/403: it was rotated on the host and not in sites/nikatru/js/signin.js), or the live script still holds the placeholder, carries no key or several, names no auth host, or is not served at all. The step log says which, with the key as sha8 only. Put the host's current publishable key in signin.js and redeploy the site; this red reaches ci-gate on every open pull request."
          fi
          exit "$code"

  prod-provenance:
    name: Every row in production traces to a released build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      deployments: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # why: fetch-depth 0 IS LOAD-BEARING. A table whose migration has not
          # reached production yet is judged by WHEN that migration merged —
          # `git log --diff-filter=A` on its file — and turns red 24 h later.
          # A shallow clone holds one commit, so every migration would look
          # added by the newest merge — a clock that restarts whenever main
          # moves, so the 24 h might never arrive. The reader
          # refuses a shallow clone (exit 2) rather than run that clock.
          # assert-prod-provenance.mjs limb 9 holds this line.
          fetch-depth: 0

      - uses: ./.github/actions/setup-node

      - name: Count the rows whose provenance does not resolve
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_READ_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set +e
          node tooling/ops/check-prod-provenance.mjs
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::error title=Production provenance is UNKNOWN — the duty did not run::The reader could not reach D1, could not derive the released-build set, or found a table with no provenance rule. NOTHING counted the rows in platform_db. This fails on purpose: 'I could not look' must never read as 'I looked and it was fine' — B-17's own evidence block records consent_artifacts as 0 for exactly that reason."
          elif [ "$code" -eq 1 ]; then
            echo "::error title=Production carries rows that trace to no released build, or lacks a table its migrations create::A live verification wrote to production and did not clean up, or a rail wrote a row it could not attribute — the log above names the table, the marker value and the count; do not delete anything before establishing which, since a consent artifact from a real person is not test residue. OR a migration merged more than 24 h ago (or already deployed) has not created its table in production — the log names the table, the migration file, when it merged and the hours since: find what is keeping deploy-workers from applying it."
          fi
          exit "$code"

  pages-deployments:
    name: The Cloudflare Pages builds nobody else can see actually landed
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # why: deployments: read is for check-worker-versions.mjs, which reads each
    # Worker's newest ledger record (GET .../deployments?environment=<unit>).
    permissions:
      deployments: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # why: fetch-depth 0 IS LOAD-BEARING AND IT IS THE ONE THING THAT MAKES
          # THIS JOB DIFFERENT FROM ITS SIBLINGS. The freshness limb asks
          # `git log -1 origin/main -- sites/<name>` for the commit Cloudflare
          # SHOULD be serving. A shallow clone has no origin/main, so that read
          # returns null and every git-connected project reports exit 2 — which
          # fails loudly rather than passing, but reports "I could not look" for
          # a checkout flag instead of for anything about Cloudflare.
          fetch-depth: 0

      - uses: ./.github/actions/setup-node

      # why: the Cloudflare Git integration deploys sites/nikatru ON THE MERGE
      # PUSH, on Cloudflare's side of the wire. It posts NO commit status, opens
      # NO GitHub Deployment and appears in NO Actions run — so on the Actions
      # page a build that FAILED is indistinguishable from one that was never
      # needed. Since [ADR 075] that project is the ROUTER for the app's public
      # address, so a stuck router serves 404s at nikatru.com/<id>/ while
      # deploy-web.yml, the app's own Pages project and the post-deploy smoke are
      # all three green. This step is the only observer that failure has.
      - name: Every Pages project's newest PRODUCTION deployment succeeded, at the commit main names
        if: ${{ !cancelled() }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_READ_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          node tooling/ops/check-pages-deployments.mjs
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            # NO BACKTICKS ANYWHERE IN THESE STRINGS: they are double-quoted, so
            # a backtick opens a command substitution and the annotation would
            # silently execute part of itself.
            echo "::error title=Cloudflare Pages deployments are UNKNOWN — nothing was graded::No credential, a non-200, unparseable JSON, a preview row returned for a production query, or a project set that derived to EMPTY. NOTHING was judged. An empty sweep prints the same ok as a complete one, and this is the one rail with no second witness anywhere — no commit status, no GitHub Deployment, no Actions run."
          elif [ "$code" -eq 1 ]; then
            echo "::error title=A Cloudflare Pages project is RED or STALE::Its newest production deployment failed, or it succeeded at a commit older than the newest one on main touching its source directory. Production is serving the PREVIOUS build, which answers 200 with older bytes. For the nikatru project this is the ROUTER for nikatru.com/<id>/, so the app can be perfectly deployed and still unreachable. The step log names the project, the deployment id and both commits."
          fi
          exit "$code"

      # why: PB-06, row O-LIVE-DUTY-RED-BLOCKS-THE-FIX-DEPLOY. deploy-workers.yml
      # records one GitHub Deployment per Worker, and rollback.mjs, plan-deploy.mjs
      # and check-prod-provenance.mjs all read that ledger as "what is live";
      # nothing re-read the Worker. Each /v1/health `build` must be the newest
      # record's sha; the shield (no health route) is read by its active Cloudflare
      # version against the record's worker_version_id. A READ: no secret beyond
      # the read token and this job's deployments: read.
      - name: Every live Worker serves the ledger's newest record
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_READ_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          node tooling/ops/check-worker-versions.mjs
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::error title=Live Worker versions are UNKNOWN - nothing was compared::A ledger read, a /v1/health read or the shield's Cloudflare read did not answer, a record carried nothing to compare, or deploy-workers.yml records a Worker this check cannot read. An unread Worker is not a matching one. The step log names the unit."
          elif [ "$code" -eq 1 ]; then
            echo "::error title=A live Worker is NOT the ledger's newest record::Production serves a build the deployment ledger does not name as newest: a rollback or a deploy outside deploy-workers.yml, or a record that never landed. Every reader of the ledger is now reasoning from the wrong build. The step log names the Worker and both commits."
          fi
          exit "$code"

      # why: PB-17, row O-LIVE-DUTY-RED-BLOCKS-THE-FIX-DEPLOY. tooling/ceilings.json's
      # actualsReadFrom block records that nobody reads the account's daily usage.
      # This reads the previous UTC day from the GraphQL Analytics API and grades it
      # against the declared ceilings; under 50% headroom is red. CLOUDFLARE_READ_TOKEN
      # ONLY (never the deploy token, rv2-security-001): until the owner mints it the
      # read is deferred to the same date as #1095's, and is COVERAGE LOST after it.
      - name: Cloudflare usage keeps half its declared ceilings free
        if: ${{ !cancelled() }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_READ_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          node tooling/ops/check-cloudflare-usage.mjs --cloudflare-read-pending-until 2026-10-21
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::error title=Cloudflare usage is UNKNOWN - nothing was graded::No read token past the deferral, a non-200, GraphQL errors, or a ceiling row this check grades against is missing. Unread usage is not usage inside its ceilings."
          elif [ "$code" -eq 1 ]; then
            echo "::error title=Cloudflare usage is past half a declared ceiling::A Workers, D1 or KV daily total used more than 50 percent of its ceiling in tooling/ceilings.json. The step log names the metric, the number and the ceiling."
          fi
          exit "$code"

  runner-budget:
    name: Actions quota cannot silently stop the scheduled proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node

      - name: Read the Actions usage ledger and compare it to the declared ceiling
        env:
          GH_BILLING_TOKEN: ${{ secrets.GH_BILLING_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set +e
          node tooling/ci/assert-runner-budget.mjs
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::error title=Actions quota is UNKNOWN — the duty did not run::NOTHING read the account's Actions billing ledger, so 'can the scheduled proofs still run tomorrow?' is unanswered. This fails on purpose: 'I could not look' must never read as 'I looked and it was fine'. OWNER ACTION — add a GH_BILLING_TOKEN repository secret from a token with billing read (classic PAT with the 'user' scope, or a fine-grained token with the account-level 'Plan' read permission). GITHUB_TOKEN is repository-scoped and is not expected to carry a billing dimension."
          elif [ "$code" -eq 1 ]; then
            echo "::error title=Actions usage is over a declared ceiling — billed spend or macOS minutes::Read the FAIL line(s) above: either the current billing period's net-billed Actions spend is over the declared ceiling, so a spending limit can stop runs from STARTING and every scheduled proof in this repository goes dark together; or its macOS minutes are over CURRENT_PERIOD_MACOS_MINUTES_CEILING, which nets \$0.00 while the public-repo discount holds and costs ten free minutes each the day it does not. For spend, establish WHICH assumption broke — did the repository go private, did a lane move to a larger runner class, or did another repository on this account exhaust the shared allowance — before touching the ceiling. For macOS, the per-SKU and per-repo lines name the lane."
          fi
          exit "$code"

  glitchtip:
    name: The live ops half — monitors, alarm chains, provider parity, GCP scope
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node

      - name: The register still matches the live GlitchTip monitors
        env:
          GLITCHTIP_TOKEN: ${{ secrets.GLITCHTIP_TOKEN }}
        run: |
          set +e
          node tooling/ops/verify-monitors.mjs
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::error title=Monitor reconciliation is UNKNOWN — GlitchTip was not read::The token is missing or refused, the instance did not answer, or the monitor list came back in a shape this script cannot read. NOTHING was reconciled, so nothing is known to have drifted."
          elif [ "$code" -eq 1 ]; then
            echo "::error title=The monitor register and live GlitchTip disagree::A declared host has no live monitor, a live monitor matches no row, or the register disagrees with the app catalogue. The step log names each one."
          fi
          exit "$code"

      - name: …and every monitor can still reach a mailbox
        if: always()
        env:
          GLITCHTIP_TOKEN: ${{ secrets.GLITCHTIP_TOKEN }}
        run: |
          set +e
          node tooling/ops/verify-alarm-chains.mjs
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::error title=Alarm chains are UNKNOWN — GlitchTip was not read::The monitor list, the project list or a project's alerts could not be read. NOTHING about those chains was judged."
          elif [ "$code" -eq 1 ]; then
            echo "::error title=An alarm chain no longer reaches a mailbox::A monitor has no project, a project has no alert with a recipient, or a chain has never been watched delivering. The step log names each one."
          fi
          exit "$code"

      - name: The app's federated-provider declaration matches the live project
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node tooling/ops/verify-auth-providers.mjs

      - name: The store service account is still powerless on GCP
        if: always()
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: node tooling/ops/verify-free-api-scope.mjs

      # ⏱ 2026-09-12 · THE WILDCARD IS ENFORCED HERE, FROM THE ZONE, AND NOWHERE
      # ELSE. [ADR 080] §4 deleted the proxied wildcard `*.nikatru.com`. On
      # 2026-09-11 the CI guard assert-catalog-reachable.mjs still REQUIRED it,
      # so main went red the moment it was deleted and the record was put back to
      # unblock deploys. The inverted limb was tried the same day and measured
      # wrong the other way: a runner resolved a fresh `wc-….nikatru.com` at
      # 17:42Z while 8.8.8.8 and 1.1.1.1 both said NXDOMAIN. A runner's resolver
      # lags the zone, so #673 made that limb report-only and the authoritative
      # question moved here, where it is scheduled, blocks no merge, and files
      # against the durable issue.
      #
      # why: IN THIS JOB rather than a new one. Every job in this workflow is the
      # unit of some duty row in tooling/ops/register.json, and assert-ops-register
      # REFUSES a job that is the unit of none ("a failure there would be watched
      # by nobody in this register") — measured on this branch, which tried a
      # separate `dns` job first. This job is already `duty.workflow.ops-watch.yml`'s
      # live-ops half, which is exactly what a zone record is.
      - name: The zone itself still holds no wildcard record
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_READ_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set +e
          node tooling/ops/check-wildcard-dns.mjs
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::error title=The wildcard state is UNKNOWN — the Cloudflare zone was not read::No token, the API refused, the zone did not resolve to exactly one id, or the record list came back in a shape this script cannot read. NOTHING about the wildcard is known from this run, and that is never a pass."
          elif [ "$code" -eq 1 ]; then
            echo "::error title=A wildcard DNS record exists, and ADR 080 section 4 deleted it::Every retired hostname goes on resolving while it stands, so a name nobody serves answers instead of failing. The step log names the record and its id."
          fi
          exit "$code"

      # ⏱ 2026-09-24 · THE RECORDS THAT MAKE SENT MAIL VERIFIABLE ARE READ HERE
      # (row O-MAIL-AUTH-DNS-UNGUARDED). tooling/mail-transport.json `authRecords`
      # declares the SPF, DKIM, DMARC and bounce-MX records of both ADR 029 rails.
      # Nothing read them before this step, so a DKIM key deleted in the dashboard
      # would have left every send reporting success while receivers junked the
      # mail. It asks two public DoH resolvers rather than the runner's own, which
      # was measured lagging the zone (the wildcard step above), and it needs no
      # secret, so there is no `env:`.
      #
      # why: IN THIS JOB, for the same reason the wildcard check is - every job in
      # this workflow must be the unit of a duty row in tooling/ops/register.json,
      # and what a zone publishes is exactly this job's live-ops half. Its own
      # `timeout-minutes` keeps a hung resolver from spending the steps after it.
      - name: The mail-auth DNS records still say what the register declares
        if: always()
        timeout-minutes: 3
        run: |
          set +e
          node tooling/ops/check-mail-auth-dns.mjs
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::error title=The mail-auth DNS records are UNKNOWN - they were not judged::Neither DoH resolver answered for a record, the two disagree (a SPLIT, which is what a record mid-change looks like), or the register's authRecords block is missing or malformed. NOTHING about those records is known from this run, and that is never a pass."
          elif [ "$code" -eq 1 ]; then
            echo "::error title=A mail-auth DNS record no longer says what the register declares::A missing or changed SPF, DKIM, DMARC or bounce-MX record makes receivers junk mail that still reports sent. If the DNS changed on purpose, change authRecords in tooling/mail-transport.json the same hour; this red reaches ci-gate on every open pull request. The step log names the record."
          fi
          exit "$code"

      # ⏱ 2026-09-24 · THE APPLE SIGNING DATES ARE HELD AGAINST APPLE HERE (row
      # O-APPLE-SIGNING-EXPIRY-UNWATCHED). The expiring.cert.apple-* and
      # expiring.profile.apple-* rows in tooling/ops/register.json were written by
      # apple-expiry-write.yml from App Store Connect, and ci-gate grades their
      # dates against leadDays. Nothing else asks Apple again, and on 2026-09-16
      # the profiles were re-minted twice after the first pair went INVALID: a
      # renewed certificate, a re-minted profile id or an INVALID profile would
      # leave a row grading a dead date green. This step reads the ids declared in
      # tooling/apple-provisioning.json and exits 1 on any of those. It runs the
      # checker in CHECK mode only; the write is the dispatch-only workflow, so
      # this job stays read-only.
      #
      # why: IN THIS JOB, for the same reason the wildcard check is - every job in
      # this workflow must be the unit of a duty row in tooling/ops/register.json,
      # and what a vendor console holds is exactly this job's live-ops half. The
      # three App Store Connect credentials reach this step alone, as step env,
      # and its own `timeout-minutes` keeps a hung read from spending the steps
      # after it.
      - name: The Apple signing certificates and profiles in register.json still match App Store Connect
        if: always()
        timeout-minutes: 3
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set +e
          node tooling/ops/check-apple-signing-expiry.mjs
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::error title=The Apple signing dates are UNKNOWN - App Store Connect was not read::A credential is missing, the key was refused (401 or 403), a read outlived the bounded retry, or an answer came back in a shape the checker cannot read. NOTHING about the certificates or profiles is known from this run, and that is never a pass."
          elif [ "$code" -eq 1 ]; then
            echo "::error title=An Apple certificate or profile no longer matches register.json::A date differs from App Store Connect, a row is missing, an id answered 404, or a profile is not ACTIVE. For a date or a missing row: cut a branch from main, dispatch apple-expiry-write.yml on it, open the pull request. A 404 or an INVALID profile is a re-mint first, by provision-apple on the laptop. This red reaches ci-gate on every open pull request. The step log names the row."
          fi
          exit "$code"

      # why: THE SECOND PLACE THE APP'S ADDRESS IS WRITTEN DOWN, AND THE ONE THAT
      # TOOK SIGN-IN OFFLINE. Measured 2026-09-12: the `nikatru-auth` Turnstile
      # widget allowed `localhost` and `subly.nikatru.com` while the app is served
      # from `nikatru.com`. Turnstile answers a page on a host it does not allow
      # with "Domain not allowed.", so the challenge never rendered and SIGN-IN AND
      # SIGN-UP WERE DEAD for every user - silently, because the page still loads
      # and the form still draws. Nobody had tried to sign in since the address
      # moved, so it surfaced days later, by accident, while somebody was doing
      # something else entirely.
      #
      # 🔴 IT WAS ALREADY WRITTEN DOWN AS AN OWNER ITEM and that changed nothing.
      # The address move recorded "the widget's own configured domain list is a
      # SEPARATE console setting and still names the old subdomain". A note is not a
      # check. This step is the check: it reads the widget the BUILD actually ships
      # (by sitekey, not by name - a widget can be renamed) and the hosts the
      # CATALOGUE says we serve, so neither side can go stale, and add an app on a
      # new host and it is asked about with no edit here.
      #
      # why: IN THIS JOB, for the same reason the wildcard check is - every job in
      # this workflow must be the unit of a duty row, and account state a console
      # holds is exactly this job's live-ops half.
      - name: Turnstile still allows every host the apps are served from
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_READ_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
        run: |
          set +e
          node tooling/ops/check-turnstile-hosts.mjs
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::error title=The Turnstile hostname list is UNKNOWN - the widget was not read::No token, no sitekey, or the API refused. An unreadable console is not a passing one: the list could say anything, including the retired subdomain that took sign-in offline on 2026-09-12."
          elif [ "$code" -eq 1 ]; then
            echo "::error title=Turnstile does not allow a host the apps are served from - SIGN-IN IS DEAD THERE::The challenge cannot render on a host the widget does not allow, and the failure is silent: the page loads, the form draws, and only the challenge refuses. Add the host on the widget carrying this sitekey, under Turnstile in the Cloudflare dashboard."
          fi
          exit "$code"

      # why: THE ONLY PLACE A RETIRED NAME STILL COSTS ANYTHING, and the one
      # place tooling/ci/assert-retired-names.mjs structurally cannot look. That
      # guard reads CONFIGS; a resource nothing references any more is invisible
      # to it and goes on existing, serving and billing.
      #
      # 🔴 MEASURED 2026-09-12: `subly` was gone from every config in the tree
      # and that guard was GREEN, while the account still held a `subly` Pages
      # project with 271 deployments and a `subly_db` D1 database. Both were
      # removed by hand that day, after somebody happened to look. Nothing in CI
      # could have said so, and nothing would have said so next month either.
      #
      # why: IN THIS JOB, like the wildcard and Turnstile checks above - account
      # state no config mentions is exactly this job's live-ops half.
      - name: No retired name is still a live resource in the account
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_READ_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          node tooling/ops/check-retired-names-live.mjs
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::error title=The live inventory is UNKNOWN - the account was not read::No token, or a resource kind the token cannot list. An unread account is not a clean one: reading four kinds of five and printing ok would make this check's coverage depend on which scopes the token holds that day."
          elif [ "$code" -eq 1 ]; then
            echo "::error title=A retired name is still a live resource - ADR 079::The tree stopped naming it, so the source guard is green and will stay green. The resource still exists, still serves and still appears in the dashboard. Delete or rename it in the Cloudflare dashboard."
          fi
          exit "$code"

      # why: THE LIVE HALF OF THE SANDBOX SERVICE-ROLE GUARD (ADR no.NNN, second
      # review of #1070). tooling/ci/wrangler-environments.mjs and
      # assert-money-config.mjs limb 1e refuse the key in config and in every
      # workflow step; a hand-run `wrangler secret put --env sandbox` is visible
      # only here. Reads binding NAMES through the Cloudflare API, never values.
      # IN THIS JOB for the same reason as the step above: account state no config shows.
      - name: No sandbox Worker holds the service-role key
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_READ_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          node tooling/ops/check-sandbox-service-role.mjs
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::error title=The sandbox Workers were NOT read::No token, or a read that did not answer. An unread sandbox is not a clean one."
          elif [ "$code" -eq 1 ]; then
            echo "::error title=A sandbox Worker holds SUPABASE_SERVICE_ROLE_KEY - ADR no.NNN::The sandbox shares production's identity project and that bearer makes GoTrue skip its captcha. Run wrangler secret delete SUPABASE_SERVICE_ROLE_KEY --env sandbox in that Worker's directory."
          fi
          exit "$code"

  edge-shield:
    # ⏱ 2026-09-26 · THE EDGE SHIELD IS STILL IN PATH (LEAD RULING SHIELD-R1 §7,
    # row O-BOXES-UNSHIELDED-FROM-SPIKES). services/edge-shield sits on two zone
    # routes in front of Box C's auth and Box B's crash intake and marks every
    # answer `x-nikatru-shield: <RELEASE>` — the deployed commit SHA, or `1` for a
    # version deployed without one (⏱ 2026-10-02: a refusal carries it too, #1115
    # review). A route deleted in the dashboard, the Worker
    # gone, or the Worker throwing (so the request passes straight to the origin)
    # all look exactly like a healthy box, because the origin still answers; the
    # header is the only difference. This asks one JWKS read and one keyless
    # envelope POST and reads the header off each. No secret: both are public.
    #
    # why: ITS OWN JOB, because it is the unit of its own duty row
    # (duty.edge-shield-in-path in tooling/ops/register.json): a step inside the
    # live-ops job would overlap duty.workflow.ops-watch.yml, which is judged by
    # that whole job, and assert-ops-register refuses overlapping units [INV3].
    # timeout-minutes covers the probe's second look (the Box B tunnel's US-edge
    # stalls, row O-OPS-PROBE-US-EDGE-STALL).
    #
    # why: THE MONDAY SLOT, LIKE failure-ledger, and a dispatch on demand. ⏱ 2026-09-27
    # (train W45), MEASURED: on every slot this job cost assert-ops-register's replay
    # 42 GitHub requests against its ceiling of 30 (27 without it, 27 on Mondays) —
    # a job with no success yet makes the unit scan read one job list per run back
    # through the whole page, and the replay is the frozen worst case. The weekly
    # cadence is the price; every deploy of the shield also runs the same probe as
    # its smoke, and `workflow_dispatch` runs it at any time.
    name: The edge shield is still in front of Box B and Box C
    if: github.event.schedule == '45 7 * * 1' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node

      - name: The edge shield is still in front of Box B and Box C
        run: |
          set +e
          node tooling/ops/check-edge-shield.mjs
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::error title=The edge shield is UNKNOWN - a probe never answered, or the probes do not cover its routes::Nothing about whether services/edge-shield is in front of Box B and Box C is known from this run, and that is never a pass. The step log names the probe or the route."
          elif [ "$code" -eq 1 ]; then
            echo "::error title=Shield not in path - Box B or Box C is taking traffic with no edge limit::A probe answered without x-nikatru-shield (the deployed SHA, or 1). Check the Worker routes on the nikatru.com zone (auth-api.nikatru.com/auth/v1/* and glitchtip.nikatru.com/api/*) and the edge-shield Worker's logs for exceptions; redeploy it from main. The step log names the probe."
          fi
          exit "$code"

      # why: LEAD RULING SHIELD-R3 — the other half of the shield is the zone's
      # per-IP credential rule, declared in tooling/edge-ratelimit-rule.json and
      # written only by deploy-workers.yml's edge-shield job. A dashboard edit, or the
      # rule deleted, leaves every box answering as before; comparing the live phase
      # with the file is the only way to see it. A READ: no --apply here, ever.
      # always(): the rule is compared even on a week the probe above is red.
      - name: The zone's per-IP credential rule is the declared one
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_READ_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set +e
          node tooling/ops/edge-ratelimit-rule.mjs
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::error title=The zone's per-IP credential rule is UNKNOWN::The nikatru.com http_ratelimit phase could not be read, so nothing is known about the per-IP limit on the credential endpoints from this run, and that is never a pass. The step log names the reason."
          elif [ "$code" -eq 1 ]; then
            echo "::error title=The zone's per-IP credential rule differs from tooling/edge-ratelimit-rule.json::The live rate-limiting rule on nikatru.com is not the declared one (the step log names each field). Redeploy edge-shield from main to restore it, or change the file in a PR if the live rule is right."
          fi
          exit "$code"

      # why (2026-10-01, lane fix-edge-as-code, O-EDGE-CONFIG-NOT-DECLARED): the rest of the
      # edge is declared in tooling/edge/zone.json - the proxied flag of every record, the
      # WAF custom rules, the Access apps - and this reads it back. Every Access-gated host
      # is also asked GET / from outside for the 302 to the Access login (PB-19: beszel and
      # logs were unwatched). A READ. CLOUDFLARE_READ_TOKEN ONLY, no fallback: the deploy
      # token is not known to hold Access read, and #1095's read token is the one the owner
      # mints with it. Until then the API limbs print UNREADABLE inside the same
      # pending-until date ci.yml gives #1095's own deferral, and exit 2 the day after.
      - name: The edge zone is the one tooling/edge/zone.json declares
        if: always()
        env:
          CLOUDFLARE_READ_TOKEN: ${{ secrets.CLOUDFLARE_READ_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          node tooling/ops/check-edge-zone.mjs --cloudflare-read-pending-until 2026-10-21
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::error title=The edge zone is UNKNOWN::The declaration did not validate, a Cloudflare read was refused, an Access-gate probe never answered, or CLOUDFLARE_READ_TOKEN is still unset past its pending-until date. Nothing about those parts is known from this run, and that is never a pass. The step log names each one."
          elif [ "$code" -eq 1 ]; then
            echo "::error title=The edge zone drifted from tooling/edge/zone.json::A proxiable record is DNS-only outside the declared list, a declared record or Access app is gone, an undeclared Access app or WAF rule appeared, or a gated host no longer answers the Access 302. The step log names each finding. Restore it in the dashboard, or change the file in a reviewed PR if the live zone is right."
          fi
          exit "$code"

      # why (2026-09-30, lane fix-auth-jwks-504): every ES256 verification rests on
      # the JWKS read the shield caches, and nothing counted how often a CLIENT got
      # it as a 5xx. Per UTC day over the week since the last run; over 1% on any
      # day is red. It counts eyeball requests ONLY: the shield's own Cache API
      # lookups log as 504 and once read as "12% of auth-api is 504s" while no
      # client got one (the script header). It also reports a day with more than 5
      # failed shield revalidations: each one opens up to a minute of STALE answers,
      # which are 200s. A READ; always(), like the rule above. It needs Zone
      # Analytics Read on nikatru.com (GraphQL httpRequestsAdaptiveGroups): proven for
      # the repository CLOUDFLARE_API_TOKEN by dispatch runs 36797307729 and
      # 36822297767. The read token the owner mints (rv2-security-001) must carry it
      # too, or this step exits 2 the day that token answers.
      - name: Clients get the JWKS as a 5xx on at most 1% of reads a day
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_READ_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set +e
          node tooling/ops/check-jwks-error-rate.mjs
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::error title=The JWKS error rate is UNKNOWN::The nikatru.com zone analytics could not be read, or no day had enough client reads to judge, so nothing is known about JWKS failures from this run, and that is never a pass. The step log names the reason (a token without Zone Analytics Read is named as such)."
          elif [ "$code" -eq 1 ]; then
            echo "::error title=Clients got the JWKS as a 5xx on over 1% of reads in a day, or the shield served it STALE after more than 5 failed origin reads::Every token verification rests on this read, and a stale 200 hides a Box C outage from monitor 17 for up to an hour. The step log names the day and which bound it crossed. Read Box C's envoy and cloudflared logs for that day (runbooks/boxes/boxc.md) and the edge-shield Worker's logs for shield_jwks_stale."
          fi
          exit "$code"

  failure-ledger:
    # why (B-5, 2026-09-29): this job REDS and `alert` pages on it, so its name says so. It was "print-only"
    # while its step ended `exit "$code"`; workflow-scan's printOnlyJobsThatFail refuses that contradiction.
    name: Failed-run ledger and guard yield (weekly; red pages the ops-watch issue)
    # why: the digest's slot predicate, verbatim. The ledger reads eight days of
    # failed runs, so one run a week is its whole cadence; every other slot skips.
    # why (2026-09-26): a dispatch runs the ledger only when it asks for it (inputs.failure_ledger); the digest
    # keeps its own slot predicate and prints 'did not run' for a skipped ledger.
    if: github.event.schedule == '45 7 * * 1' || (github.event_name == 'workflow_dispatch' && inputs.failure_ledger)
    runs-on: ubuntu-24.04
    # why: the ceiling. A cached walk of eight days is expected well under five
    # minutes, and every request is bounded by bounded-retry.mjs inside it.
    timeout-minutes: 20
    # why: read-only, exactly three scopes, because this job's own token is the
    # reader's credential (D1, 2026-09-25): contents for the checkout, actions
    # for the run lists, job lists and job logs, and pull-requests for the
    # reader's one pulls path (--no-prs skips it here). The reader writes
    # nothing.
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      exit: ${{ steps.ledger.outputs.exit }}
      unexplained: ${{ steps.ledger.outputs.unexplained }}
    steps:
      # why: fetch-depth 0 is load-bearing. The reader holds every merge commit its
      # causes register names to origin/main, and a shallow clone refuses (exit 2).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/setup-node

      - name: The ISO week the log cache is keyed by
        id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      # why: one cache per ISO week, so a re-dispatch inside the same week does not
      # re-read logs it already holds. The reader never caches a newest-run answer.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/triage
          key: failure-ledger-${{ steps.week.outputs.week }}

      # why: GH_TOKEN is this job's own token (D1, 2026-09-25), read-only by the
      # permissions above: no long-lived credential, no expiry, no owner step,
      # and the ledger reads only this repository, which the job token can. That
      # token's quota is shared with the other jobs here, so the reader guards
      # it: it asks GET /rate_limit first and refuses (exit 2, "quota floor")
      # unless the remaining quota minus its request ceiling is at least 400, and
      # --max-requests (default 300) is a hard ceiling, exit 2 at it.
      # why: --branch main reads main's runs only (push, schedule, workflow_dispatch); a PR's own reds belong to that PR and its land script (FIX-1 (C), 2026-09-25).
      - name: Every failed run of the last eight days, and the recorded cause it maps to
        id: ledger
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          since="$(date -u -d '8 days ago' +%Y-%m-%dT%H:%M:%SZ)"
          set +e
          node tooling/ops/triage-failed-runs.mjs --since "$since" --no-prs --branch main --cache-dir .cache/triage > "${RUNNER_TEMP}/ledger.txt" 2>&1
          code=$?
          set -e
          cat "${RUNNER_TEMP}/ledger.txt"
          unexplained="$(sed -n -E 's/^UNEXPLAINED: ([0-9]+)$/\1/p' "${RUNNER_TEMP}/ledger.txt" | tail -n 1)"
          echo "exit=${code}" >> "$GITHUB_OUTPUT"
          echo "unexplained=${unexplained:-none printed}" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 2 ]; then
            echo "::error title=The failed-run ledger is UNKNOWN - nothing was graded::The quota floor refused to start, the request ceiling was reached, a 403, a capped run list, an unreadable log, a malformed causes register, or a clone that cannot answer the merge-base check. The count above, if any, is over a SUBSET. The step log names which."
          elif [ "$code" -eq 1 ]; then
            echo "::error title=A failed run has no recorded cause, a recurring cause cannot be ranked, or a recorded fix is not on main::The step log lists each unexplained run with its signature, each cause matched by two or more runs with no firstSeen/lastSeen and no guard/row, or each cause whose merge commit is not an ancestor of origin/main. Add or complete the cause in tooling/ops/failed-run-causes.json, or fix the run."
          fi
          exit "$code"

      # why (B-1, B-2, B-3, 2026-09-29): the yield file is re-derived by one deliberate, credentialled fetch
      # (the job token's hourly quota is under that walk's ceiling), so the SCHEDULE's part is to say when it is
      # due and when it is not acted on: offline, no request. always(): a red ledger must not hide a stale yield.
      - name: The guard yield is fresh, attributed, and every zero-catch guard is dispositioned
        if: always()
        run: |
          set +e
          node tooling/ops/guard-yield.mjs --check
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::error title=The guard yield is UNKNOWN::tooling/guard-yield.json or tooling/enforcement-index.json could not be read, so nothing about guard yield is known from this run. The step log names which."
          elif [ "$code" -eq 1 ]; then
            echo "::error title=The guard yield is stale, blind, or not acted on::asOf is past MAX_AGE_DAYS (re-fetch with triage-failed-runs.mjs --yield), the unattributed share is over its limit (give the signatures a guard, then guard-yield.mjs --reattribute), or a zero-catch guard has no KEEP/MERGE/RETIRE. The step log names each."
          fi
          exit "$code"

  renovate-backlog:
    name: The Renovate queue drains at least as fast as it fills
    # why: the ledger's Monday slot: the register's unit scan then opens Monday runs only (scheduleWeekdays), and the read lands after Renovate's first Monday run.
    if: github.event.schedule == '45 7 * * 1' || (github.event_name == 'workflow_dispatch' && inputs.renovate_backlog)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # why: the reader's one GraphQL query reads #417 and its edit history (issues) and the open pull requests it counts as still waiting (pull-requests), under this job's own token.
    permissions:
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node

      - name: Read the Dependency Dashboard against its two floors
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          node tooling/ops/check-renovate-backlog.mjs
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::error title=The Renovate backlog is UNKNOWN - could not read #417::COVERAGE LOST, not clean. No token, the API refused, the issue is not an open Dependency Dashboard, the entry grammar changed, the floor file is unreadable, or an age could only be bounded from below. The step log names which."
          elif [ "$code" -eq 1 ]; then
            echo "::error title=The Renovate queue outruns its floor::The waiting count or the oldest entry's age is past tooling/ops/renovate-backlog-floor.json. Merge the waiting PRs and approve the majors waiting on the dashboard; NEVER tick create-all."
          fi
          exit "$code"

  code-scanning-age:
    name: No high or critical code-scanning alert stands untriaged past its window
    # why: the ledger's Monday slot, for the reason renovate-backlog gives: the register's unit scan then opens Monday runs only (scheduleWeekdays).
    if: github.event.schedule == '45 7 * * 1' || (github.event_name == 'workflow_dispatch' && inputs.code_scanning_age)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # why: GET /repos/{owner}/{repo}/code-scanning/alerts needs security-events: read, and nothing else, under this job's own token.
    permissions:
      security-events: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node

      - name: Read the open code-scanning alerts against their triage window
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set +e
          node tooling/ops/check-code-scanning-age.mjs
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::error title=The code-scanning alerts are UNKNOWN - could not read them::COVERAGE LOST, not clean. No token, the API refused (security-events: read, or code scanning off), a page that is not an alert array, an item missing its fields, or a truncated list. The step log names which."
          elif [ "$code" -eq 1 ]; then
            echo "::error title=A high or critical code-scanning alert is untriaged past its window::The step log lists each one with its rule, age and path:line. Fix it, or dismiss it on GitHub WITH a reason; a dismissal with no reason is graded as still open."
          fi
          exit "$code"

      # why: train P17 (security-001, security-022): where GitHub actually STORES each scoped secret,
      # read back against tooling/channel-register.json, names only. GITHUB_TOKEN cannot list
      # secrets, so it reads with SECRETS_READ_TOKEN (Secrets + Environments read, owner-minted);
      # until that exists the read is `unreadable` inside its dated ceiling, then COVERAGE LOST.
      # A STEP of this Monday security job, not a job of its own: a new job costs
      # assert-ops-register's replay more requests than its ceiling (docs/ci/ops-watch.md). LAST,
      # and always(): its red silences no reader before it, and theirs do not silence it.
      - name: Where GitHub stores each scoped secret matches the register (names only)
        if: always()
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ secrets.SECRETS_READ_TOKEN }}
        run: node tooling/ops/check-secret-scopes.mjs --unreadable-until 2026-11-30

  tech-currency:
    name: What the pipeline runs on is not being retired by its vendors
    # why: the Monday slot, for the reason the renovate-backlog job gives: the register's unit scan opens Monday runs only (scheduleWeekdays).
    if: github.event.schedule == '45 7 * * 1' || (github.event_name == 'workflow_dispatch' && inputs.tech_currency)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # why: every source is public (the GitHub changelog, raw action metadata, the Node.js schedule, the duty matrix's vendor pages), so no token is read.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node

      - name: Read the vendors' retirements against the tree
        run: |
          set +e
          node tooling/ops/check-tech-currency.mjs
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::error title=Tech currency is UNKNOWN - a source could not be read::COVERAGE LOST, not current. A read failed after the bounded plan, the changelog grammar changed or never reached its window, an action's metadata is gone, the Node schedule lacks a major the tree runs on, or a dated vendor page carried no date. The step log names which."
          elif [ "$code" -eq 1 ]; then
            echo "::error title=A vendor is retiring something the pipeline runs on::The step log names each proposal with its evidence and who uses it: a retired runtime or runner image, a Node major near end of life, or a duty-matrix source whose vendor page changed (or whose deadline passed) since it was read. Move the pin, or re-read the page and advance the row."
          fi
          exit "$code"

  alert:
    name: Open or refresh the ops-watch issue
    needs:
      [heartbeats, status, status-page, supabase-drift, prod-provenance, pages-deployments, runner-budget, glitchtip, edge-shield, failure-ledger, renovate-backlog, code-scanning-age, tech-currency]
    # why: unattended runs only -- a schedule, or the platform Worker's dispatch, which sets
    # `unattended` (2026-10-01; it ran on schedule alone while the Worker's runs went unfiled).
    # The issue is REUSED rather than reopened -- later failures arrive as comments and it is
    # never closed automatically, so closing it is the acknowledgement that a human looked.
    if: failure() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.unattended))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: File the failure against one durable issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TITLE: 'Scheduled duty is not reporting healthy'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          note="Failed: [run ${GITHUB_RUN_ID}, attempt ${GITHUB_RUN_ATTEMPT}](${RUN_URL}) at $(date -u '+%Y-%m-%d %H:%M UTC')."

          # Quoted heredoc on purpose — the body is markdown full of backticks,
          # and an unquoted one would execute them as commands.
          body="${RUNNER_TEMP}/ops-alert.md"
          { printf '%s\n\n' "$note"; cat <<'BODY'
          A scheduled duty is **absent, stale or explicitly failing**. The run log names which,
          and which of the three it is:

          - **ABSENT** — no heartbeat row inside 1.5x the job's declared cron interval. The timer
            has stopped, or the job can no longer write its own record.
          - **RED** — a fresh row that says the job FAILED. ⚠️ Note that a check asking only
            "did a row land today" would be **green on exactly this**.
          - **UNKNOWN** — no token, a non-200, unparseable JSON. Failing closed is deliberate:
            "I could not tell" must never read as "it is fine".
          - **DRIFT** — the live Supabase auth config no longer matches `tooling/mail-transport.json`
            or the DR templates in `docs/platform/supabase/email-templates/`. On 2026-08-04 a
            one-field `PATCH /config/auth` emptied the entire SMTP block and reverted all three
            branded templates; it recovered byte-for-byte only because those files still matched.
            **Decide which side is wrong before editing either** — if live is correct, update the
            repo copies *and* the register together; if live is wrong, restore it by sending the
            COMPLETE config, never one field.

          **Why this matters beyond the tick.** The Supabase keep-alive is the only thing standing
          between the shared auth project and its idle pause, and a paused auth project takes
          sign-in down across the whole portfolio.

          **This issue is reused.** Every later failure is added here as a comment instead of
          opening a new one, and it is **not closed automatically**. It stays open until a human
          closes it; closing it *is* the acknowledgement that someone looked.

          Filed automatically by the `alert` job in `.github/workflows/ops-watch.yml`.
          BODY
          } > "$body"

          # Looked up through the LIST api, not the search index: search lags
          # behind writes, and a lookup that misses opens a duplicate.
          existing="$(gh issue list --state open --limit 200 --json number,title \
            --jq '[.[] | select(.title == env.TITLE) | .number] | first // empty')"

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still red. ${note}"
            echo "::warning title=Ops watch still failing::commented on the already-open issue #${existing}"
          else
            url="$(gh issue create --title "$TITLE" --body-file "$body")"
            echo "::error title=Ops watch failed::opened ${url}"
          fi

  digest:
    name: Weekly digest
    # why: this pins the digest to ONE of the twelve cron slots. Without the schedule
    # equality every slot would send a weekly digest.
    # why: always(), because the digest reports the ledger's exit, and a red
    # ledger is the week the digest is most worth reading.
    needs: [failure-ledger]
    if: always() && (github.event.schedule == '45 7 * * 1' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node

      - name: Collect what the readers say
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_READ_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LEDGER_RESULT: ${{ needs.failure-ledger.result }}
          LEDGER_EXIT: ${{ needs.failure-ledger.outputs.exit }}
          LEDGER_UNEXPLAINED: ${{ needs.failure-ledger.outputs.unexplained }}
        run: |
          set +e
          {
            echo '## Surfaces'
            echo '```'
            node tooling/ops/status.mjs 2>&1
            echo "exit: $?"
            echo '```'
            echo '## Scheduled duties'
            echo '```'
            node tooling/ops/check-heartbeats.mjs 2>&1
            echo "exit: $?"
            echo '```'
            echo '## Declared gaps in the operations register'
            echo '```'
            # 🔴 THIS READER USED TO BE ONE PIPED LINE AND IT LIED IN BOTH
            # DIRECTIONS. `node … | grep -E '^(⬜|⚠)' || echo '(none printed)'`
            # threw the guard's exit away (a pipeline reports its LAST stage, so
            # the digest recorded grep's status, never the register's) AND the
            # grep filtered out every failure line, which this guard writes as
            # `✗ …`. A register in COVERAGE LOST therefore rendered in the weekly
            # digest as the single line "(none printed)" — the most reassuring
            # possible presentation of a red check. Repaired 2026-08-08 to match
            # its two siblings above: capture output and status SEPARATELY, then
            # echo the status.
            #
            # The status is captured on its own line, immediately after the
            # assignment and before any other command runs. `$?` inside an
            # argument list that contains a command substitution is the
            # SUBSTITUTION's status, which is how a whole session's guard checks
            # once read EXIT 0 while a guard was exiting 1 (CLAUDE.md).
            #
            # On a red register the WHOLE output is included, not a filtered
            # slice: filtering is what hid the failure, and the one run where the
            # digest is worth reading in full is the run where something broke.
            out="$(node tooling/ci/assert-ops-register.mjs 2>&1)"
            code=$?
            if [ "$code" -eq 0 ]; then
              printf '%s\n' "$out" | grep -E '^(⬜|⚠)' || echo '(none printed)'
            else
              printf '%s\n' "$out"
            fi
            echo "exit: $code"
            echo '```'
            # A skipped or cancelled ledger job leaves no exit output: that prints
            # as "did not run", never as a blank line that reads like a pass.
            echo '## Failed-run ledger'
            if [ -n "${LEDGER_EXIT}" ]; then
              echo "exit ${LEDGER_EXIT} — UNEXPLAINED ${LEDGER_UNEXPLAINED:-none printed} (0 = every failure in the last 8 days maps to a recorded cause)"
            else
              echo "exit: did not run (the failure-ledger job was ${LEDGER_RESULT:-not reached})"
            fi
          } > "${RUNNER_TEMP}/digest-body.md"
          set -e

      - name: Deliver it to one durable issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TITLE: 'Weekly ops digest'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          body="${RUNNER_TEMP}/digest.md"
          {
            printf '### %s — [run](%s)\n\n' "$(date -u '+%Y-%m-%d')" "${RUN_URL}"
            cat "${RUNNER_TEMP}/digest-body.md"
            printf '\n_Posted by the `digest` job in `.github/workflows/ops-watch.yml`. This issue is REUSED and is never closed automatically._\n'
          } > "$body"

          existing="$(gh issue list --state open --limit 200 --json number,title \
            --jq '[.[] | select(.title == env.TITLE) | .number] | first // empty')"

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file "$body"
          else
            gh issue create --title "$TITLE" --body-file "$body"
          fi
