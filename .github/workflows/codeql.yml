name: CodeQL
run-name: "CodeQL (${{ github.event_name }})"

# ─────────────────────────────────────────────────────────────────────────────
# CodeQL — semantic analysis of the JavaScript and TypeScript this repository
# actually ships and runs. [ADR 067] decision 4, phase 2 unit ci-security-lanes.
#
# 🔴 WHAT WAS MISSING, AND IT IS NOT WHAT THE EXISTING SCANNERS COVER. The
# `security-scan` job in ci.yml runs four tools and NONE of them reads this
# repository's own code as code:
#   · gitleaks     — looks for SECRETS in bytes. It does not parse anything.
#   · zizmor       — reads WORKFLOWS. Its subject is .github/, not services/.
#   · OSV-Scanner  — reads LOCKFILES. Its subject is what we depend on.
#   · Trivy        — reads dependencies and misconfiguration, not data flow.
# All four ask "is something we imported known-bad?" or "is a file shaped
# wrongly?". None of them can answer "does attacker-controlled input reach a
# dangerous sink in code we wrote", which is the question that matters for
# services/platform and services/subscriptiontracker-api — Workers that take unauthenticated
# HTTP, hold a D1 binding and sit in front of the identity stack.
#
# Measured on the day this landed (2026-09-06): 583 tracked .ts/.js/.mjs files —
# 376 under tooling/, 104 under extensions/, 97 under services/, 3 contracts/,
# 2 sites/, 1 packages/. So the subject set is real, and the extensions subtree
# ([ADR 067] decision 1) is inside it: extensions ship BUILD-FREE, meaning the
# source in this repository is the source that is submitted to a store, so
# analysing it here is analysing the shipped artefact rather than a proxy for it.
#
# ⚠️ WHAT THIS DOES NOT COVER, stated rather than implied: DART. The `javascript-
# typescript` pack does not read Flutter code, and CodeQL ships no Dart support
# at all, so apps/ and packages/ are outside this lane by construction — not by
# an omission somebody can quietly fix by adding a language to the matrix.
# ⏱ 2026-10-01 [rv2-security-006] — THIS LINE USED TO SAY THE DART SURFACE "IS
# COVERED" by the analyzer, and nothing that reads Dart traces data flow. What
# reads shipped Dart today, by name, and what each one asks:
#   · the Dart analyzer (`melos run analyze`, `flutter analyze` in ci.yml) —
#     types and lints; no taint, no sink;
#   · tooling/ci/assert-package-boundaries.mjs limbs c2/c3 — no package goes
#     around another's adapter (c2); no WebView import and no `dart:io`
#     Process in shipped Dart (c3);
#   · tooling/ci/assert-no-tls-pinning.mjs — no certificate pinning, no trust
#     override (`badCertificateCallback`, a private SecurityContext).
# Each is a DENY list over source text. None of them answers "does attacker-
# controlled input reach a dangerous sink" for Dart, so that question is OPEN
# for apps/ and packages/ — say so, never "covered".
#
# ⚠️ AND THIS IS AN ALERT SINK, NOT A MERGE GATE. Findings land in the repository
# Security tab; nothing here fails `ci-gate`, and that is deliberate. A scanner
# whose first false positive blocks every merge is a scanner that gets switched
# off, which is the reasoning ci.yml's Trivy step already records in prose. If a
# finding ever needs to block, the way to do it is a named, reviewed rule — not
# turning this whole lane into a required check.
#
# ⏱ 2026-09-30 · THAT RULE NOW EXISTS, AND THIS LANE IS STILL A SINK. 160 alerts
# were open and growing ~7 a day, because nothing read them. Two readers, both in
# ci.yml, neither of them this workflow:
#   · security-scan runs tooling/ci/assert-codeql-pr-no-new-high.mjs — a PR whose
#     OWN analysis here adds a high or critical alert fails ci-gate;
#   · guards-platform runs tooling/ci/assert-alert-disposition.mjs limb C — every
#     open alert on main is fixed in code or has an entry in
#     tooling/ci/codeql-dispositions.json.
# The first reads this workflow's analysis of refs/pull/<N>/merge, so a change to
# the `category` above or to the pull_request trigger must move it too.
# ⏱ 2026-10-01 · A THIRD, HERE, AND ONLY ON MAIN. The PR analysis is diff-informed,
# so an alert on an unchanged line passes the first reader and opens on main; the
# last step of `analyze` runs limb C after every analysis of main (push, schedule)
# and turns THAT run red. A pull request never runs it: nothing here fails ci-gate.
# ─────────────────────────────────────────────────────────────────────────────

on:
  # why: every base (2026-09-30) — a stacked PR must carry its own analysis for assert-codeql-pr-no-new-high.mjs.
  pull_request:
    # why: GitHub's three defaults, plus `ready_for_review`: a draft PR is not analysed
    # (analyze's `if:`), and ci.yml's CodeQL PR rule needs this run on the event that readies it.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    # 🔴 THE SLOT IS COMPUTED, NOT EYEBALLED — TRAPS ci-16. Across every workflow
    # in this repository the daily slots were 00:30 02:30 03:00 03:17 04:30 07:30
    # 08:50 11:00 12:30 15:30 17:30 19:30 22:30 UTC, whose WORST gap — measured
    # circularly, including the wrap past midnight, which a sorted list never
    # shows — was 3.00h at 04:30 → 07:30. 05:23 splits that one into 0.88h and
    # 2.12h. Not on the hour and not on the half hour on purpose: those are the
    # minutes every other repository on GitHub also picks, and a scheduler
    # measured at 10.1% on-time delivery does not need the extra queue.
    - cron: '23 5 * * *' # 05:23 UTC daily — splits the 04:30 → 07:30 hole
  workflow_dispatch:

# The workflow-level floor is READ-ONLY. The one elevated scope this lane needs
# — `security-events: write`, which is what lets the analysis upload a SARIF
# result to the Security tab — is granted ON THE JOB and nowhere else, because
# tooling/ci/assert-workflow-hardening.mjs is right about where a write scope
# belongs: a workflow-level grant is held by every job in the file, including any
# job somebody adds later without thinking about it. There is one job today, so
# the difference costs nothing now and is exactly the kind of thing that stops
# being free once it is a habit.
permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  analyze:
    name: Analyze JavaScript and TypeScript
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    # A job-level block REPLACES the workflow-level one outright, so `contents:
    # read` is restated here rather than inherited — dropping it would leave the
    # checkout unable to read a repository this job must read.
    permissions:
      contents: read
      security-events: write
    # Bounded, like every other job in this repository: an omitted
    # `timeout-minutes` inherits GitHub's default of SIX HOURS, and
    # tooling/ci/assert-workflow-hardening.mjs limb 4 refuses one.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # zizmor `artipacked`: a checkout leaves GITHUB_TOKEN in .git/config
          # for the rest of the job unless this is set. Nothing here pushes,
          # tags or commits, so the credential is not needed.
          persist-credentials: false

      - name: Initialise CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          # `security-and-quality` over the default `security-extended`: this
          # repository's own guards are written in .mjs and are the largest part
          # of the subject set, so the quality queries are reading the code that
          # decides whether every other check is honest.
          queries: security-and-quality
          # One paths-ignore (mason templates), with its reason in the file.
          config-file: ./.github/codeql/codeql-config.yml

      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:javascript-typescript

      # ⏱ 2026-10-01 · THE MAIN-SIDE HALF OF THE PR RULE (review 2 of the CodeQL
      # stack, finding 2). The PR analysis is diff-informed, so an alert whose
      # location is an UNCHANGED line passes assert-codeql-pr-no-new-high.mjs and
      # first opens HERE, on main. On a pull request limb C prints such an alert as
      # MAIN DEBT rather than reddening PRs that did not cause it; these steps are
      # where it turns red — on the analysis of the main commit that let it in,
      # right after the upload above (which waits for the alerts to be processed).
      # Steps, not a job: a second job would end this job's sole-job FF-2 exception
      # (tooling/ci/assert-failfast-coverage.mjs). security-events: write above
      # includes the read limb C needs. Not on pull_request: a PR's own alerts are
      # the PR rule's subject.
      - uses: ./.github/actions/setup-node
        if: ${{ github.event_name != 'pull_request' }}
      - name: Every open CodeQL alert on main is fixed in code or carries a disposition
        if: ${{ github.event_name != 'pull_request' }}
        timeout-minutes: 4
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # The history first: a fixed-in-tree claim is read at the commit main's
        # analysis last saw the alert at (`git show <sha>:…`). Spawns git
        # synchronously and exits, the shape that hung in ci.yml (2026-09-26), so
        # --single-threaded. `--analysis-of` refuses (exit 2) unless the analysis of THIS
        # commit is listed, and an empty alert read is exit 2 too (review of #1097, finding 4).
        run: |
          set -euo pipefail
          git fetch --quiet --unshallow origin
          node --single-threaded tooling/ci/assert-alert-disposition.mjs --limb C --analysis-of "$GITHUB_SHA"
