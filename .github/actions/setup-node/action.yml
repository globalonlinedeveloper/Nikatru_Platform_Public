name: Set up Node
description: Install the Node major pinned in tooling/versions.json, with the npm cache restored.

# why: the Node major is read from tooling/versions.json at run time rather than
# written here, so the pin has exactly one home and Renovate's customManager over
# that file is the only thing that has to move to advance it.

inputs:
  cache-dependency-path:
    description: Lockfile whose hash keys the npm cache. Empty disables caching.
    required: false
    default: ''
  node-version:
    description: A Node major to install instead of the pin. Only for a matrix that tests several majors on purpose.
    required: false
    # why: extensions-ci.yml's sims job runs on node 22 AND 24, so it names its
    # major; every other caller leaves this empty and takes versions.json's.
    default: ''

outputs:
  node-version:
    description: The Node major this action installed - the node-version input, or else tooling/versions.json's pin.
    value: ${{ steps.pin.outputs.node }}

runs:
  using: composite
  steps:
    - id: pin
      shell: bash
      # why: node is preinstalled on every GitHub-hosted runner, so this resolves
      # before setup-node replaces it.
      env:
        NODE_MAJOR: ${{ inputs.node-version }}
      run: |
        set -euo pipefail
        v="${NODE_MAJOR:-$(node -p "require(process.env.GITHUB_WORKSPACE + '/tooling/versions.json').node")}"
        test -n "$v"
        echo "node=$v" >> "$GITHUB_OUTPUT"
        # why: SPAWN_CEILING is the spawn-ceiling preload as an ABSOLUTE file URL, for every
        # later step's `node --import "$SPAWN_CEILING"`. A relative `--import` resolves
        # against the step's cwd, and #1160's ops-tooling job ran from the repository root
        # with `../tooling/...`, which left the checkout (run 37006580364). A URL, not a
        # path: node reads a bare `D:\...` import as a `d:` URL scheme on Windows.
        # tooling/ci/test/spawn-ceiling-cwd.test.mjs runs this exact expression, and the
        # quoted repo-relative path is how assert-guards-refuse-empty sees the preload edge.
        ceiling="$(node -p "require('url').pathToFileURL(require('path').resolve(process.env.GITHUB_WORKSPACE, 'tooling/scripts/spawn-ceiling.mjs')).href")"
        test -n "$ceiling"
        echo "SPAWN_CEILING=$ceiling" >> "$GITHUB_ENV"
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ steps.pin.outputs.node }}
        cache: ${{ inputs.cache-dependency-path != '' && 'npm' || '' }}
        cache-dependency-path: ${{ inputs.cache-dependency-path }}
        # why: from v5 setup-node caches on its own when package.json's
        # packageManager names npm. The root names pnpm today, so this changes
        # nothing now; it keeps "empty disables caching" true if that field moves.
        package-manager-cache: false
