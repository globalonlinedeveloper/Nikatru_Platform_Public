group 'com.nikatru.age_signals'
version '0.1.0'

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0] as int
def builtInKotlinEnabled = project.findProperty('android.builtInKotlin')?.toString() == 'true'

apply plugin: 'com.android.library'
// AGP 9+ registers the Kotlin Android plugin only when android.builtInKotlin=true;
// apply it ourselves otherwise (the same rule the workspace's other plugins follow).
if (agpMajor < 9 || !builtInKotlinEnabled) {
    apply plugin: 'kotlin-android'
}

android {
    namespace 'com.nikatru.age_signals'
    compileSdk 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // Play Age Signals supports Android 6.0 (API 23) and higher.
        minSdk 23
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    // [ADR 082] §5 — Google Play Age Signals (beta). Terms accepted by the owner
    // 2026-09-15 for the sign-up age gate ONLY: never analytics, ads or profiling.
    implementation 'com.google.android.play:age-signals:0.0.4'
}
