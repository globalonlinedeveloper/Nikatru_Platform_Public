name: nikatru_age_signals
description: >-
  The store age-signal adapters for [ADR 082] §5 — Google Play Age Signals on
  Android and Apple Declared Age Range on iOS — behind `packages/core`'s
  `AgeSignalSource` seam. The native code only fetches the store's raw answer;
  every decision about what that answer means is `core.ageSignalFromPlay` /
  `core.ageSignalFromApple`, tested in Dart. First-party on purpose: the one
  pub.dev binding (age_range_signals 0.9.0) has a single publisher, is pre-1.0
  and supports two platforms, and would sit between us and two beta vendor APIs.
version: 0.1.0
publish_to: none
resolution: workspace
repository: https://github.com/globalonlinedeveloper/Nikatru_Platform_Public

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

# NOTHING THIRD-PARTY ON THE DART SIDE: flutter (MethodChannel) and core only.
# The vendor SDKs are native: `com.google.android.play:age-signals` in
# android/build.gradle, and the DeclaredAgeRange system framework on iOS.
dependencies:
  flutter:
    sdk: flutter
  nikatru_core:
    path: ../core

dev_dependencies:
  nikatru_lints:
    path: ../analysis
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.nikatru.age_signals
        pluginClass: AgeSignalsPlugin
      ios:
        pluginClass: AgeSignalsPlugin
