name: nikatru_telemetry
description: >-
  GlitchTip/Sentry telemetry facade for NIKATRU apps. Isolates sentry_flutter
  behind a small TelemetryClient interface and scrubs Indian PII (PAN, Aadhaar,
  email, phone numbers) from every event before it leaves the device.
version: 0.1.0
publish_to: none

resolution: workspace
environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  # 9.26.0 is simply the newest stable (published 2026-07-30).
  # 🔴 RETRACTION: an earlier version of this comment said sentry_flutter broke
  # the macOS release build. THAT WAS WRONG and is disproven — removing the
  # dependency entirely still fails with the identical AOT error (probe E1), as
  # does keeping it with every Dart reference deleted (probe E2). sentry_flutter
  # was also already present in the last GREEN build. It is not implicated.
  # See tooling/versions.json $flutter_comment for what IS established.
  # (sentry-native's libcurl requirement on LINUX was real and separate — PR #78.)
  # sentry_flutter 9.x requires Dart >=3.5.0 / Flutter >=3.24.0. Data classes are
  # mutable in 9.x (beforeSend mutates in place).
  sentry_flutter: ^9.26.0

dev_dependencies:
  # [pipeline C-12] resolves the shared ruleset in analysis_options.yaml.
  nikatru_lints:
    path: ../analysis
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
