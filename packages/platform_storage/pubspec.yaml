name: nikatru_platform_storage
description: >-
  Concrete, plugin-backed implementations of the NIKATRU core storage seams
  (KeyValueStore, SecureStore) for all six platforms. Keeps packages/core pure
  Dart while apps get real persistence via one shared dependency (ADR 005).
version: 0.1.0
publish_to: none
resolution: workspace
repository: https://github.com/globalonlinedeveloper/Nikatru_Platform_Public

environment:
  sdk: ^3.9.0
  flutter: ">=3.47.5"

dependencies:
  flutter:
    sdk: flutter
  nikatru_core:
    path: ../core
  # Non-secret key-value persistence (prefs, flags, last-good config) — all 6
  # platforms. Secrets/tokens use a SecureStore impl instead.
  shared_preferences: ^2.2.0
  # Secret persistence (auth tokens, entitlement cache): OS Keychain/Keystore/
  # DPAPI, libsecret on Linux, WebCrypto on web.
  # 10.x ON PURPOSE, not 11: upstream says users on 9.x "must first upgrade to
  # v10.x to migrate data to newer ciphers before proceeding to v11.x", and 11
  # also needs compileSdk 37 (the app pins 36). 11 is its own change (M7b).
  flutter_secure_storage: ^10.0.0
  # [pipeline C-13] Store-review prompt. Lands HERE rather than in a package of
  # its own: [pipeline C-4] adjudicated that share_plus, app_links and
  # in_app_review all belong in this existing adapter, because a capability name
  # is not a reason to spawn a pubspec. MIT, verified publisher, and NOT
  # available on Linux or web — see ReviewCapabilities, which is consulted
  # before the plugin is ever touched.
  in_app_review: ^2.0.12
  # ⏱ 2026-09-28 · ST-X1 (audit D2/D31) — THE FILE EXPORTER (ShareFileExporter).
  # The smallest set that saves or shares a real file on all seven targets:
  # share_plus hands the bytes to the OS share sheet on android, ios, macos and
  # windows and, on web, downloads them where the browser cannot share a file.
  # On linux share_plus shares TEXT only, so the file goes through a save
  # dialog: file_selector_linux (GtkFileChooserNative, which is the XDG desktop
  # PORTAL under the snap's strict confinement — a folder path would name the
  # snap's private $HOME, never the user's). The linux implementation ALONE, not
  # the app-facing file_selector, so no ios/macos/android binary is linked for
  # a route those platforms do not take. [pipeline C-4] adjudicated share_plus
  # into THIS package. All BSD-3-Clause, publishers fluttercommunity.dev and
  # flutter.dev. share_plus is on 13.x because Train W55 (#1026) moved the
  # workspace to win32 ^6 (package_info_plus 10), which 12.x cannot solve
  # beside; 13.0.0 was the win32 bump and nothing else in the share API.
  # ExportCapabilities is the matrix.
  share_plus: ^13.3.0
  file_selector_linux: ^0.9.4
  file_selector_platform_interface: ^2.7.0

dev_dependencies:
  # [pipeline C-12] resolves the shared ruleset in analysis_options.yaml.
  nikatru_lints:
    path: ../analysis
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# ⏱ 2026-09-15 · [ADR 082] §5 — THIS PACKAGE IS ALSO A FLUTTER PLUGIN: the store
# age-signal adapters (lib/age_signals.dart) read Google Play Age Signals on
# android (android/, com.google.android.play:age-signals) and Apple Declared Age
# Range on ios (ios/, a system framework). They live HERE, not in a new package,
# per the locked 39-CHASSIS §2 adjudication in tooling/capability-register.json
# `packageEarnReasons`: platform capabilities land in platform_storage. Every
# store app needs the age gate, so linking the adapter everywhere is the intended
# surface. USE RESTRICTION: sign-up age gate only — nothing stored, logged or sent.
flutter:
  plugin:
    platforms:
      android:
        package: com.nikatru.platform_storage
        pluginClass: AgeSignalsPlugin
      ios:
        pluginClass: AgeSignalsPlugin
