name: nikatru_api_client
description: >-
  Generic, auth-agnostic HTTP client for NIKATRU app backends (Cloudflare
  Workers). Wraps Dio behind the RestClient seam; callers inject a base URL and
  a token provider — no auth SDK, no app-config, no app domain models.
version: 0.1.0
publish_to: none
resolution: workspace
repository: https://github.com/globalonlinedeveloper/Nikatru_Platform_Public

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  dio: ^5.4.0
  # [pipeline C-3/C-9] api_client hosts the dio implementations of core's
  # transport seams, so it depends on core for the interfaces. This is the
  # expected direction: core declares seams, adapters implement them.
  nikatru_core:
    path: ../core

dev_dependencies:
  # [pipeline C-12] resolves the shared ruleset in analysis_options.yaml.
  nikatru_lints:
    path: ../analysis
  lints: ^6.0.0
  test: ^1.25.0
