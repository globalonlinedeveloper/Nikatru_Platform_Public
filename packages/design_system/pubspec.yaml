name: nikatru_design_system
description: >-
  Shared design system for NIKATRU apps — colour/text/spacing tokens, a
  ThemeExtension carrying the brand tokens that don't fit ColorScheme, a
  buildAppTheme({seed, brightness}) factory, and a hand-rolled adaptive
  AppScaffold (NavigationBar → NavigationRail).
version: 0.1.0
publish_to: none
resolution: workspace
repository: https://github.com/globalonlinedeveloper/Nikatru_Platform_Public

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # ── WHY STATE AND ROUTING LIVE IN *THIS* PACKAGE (PHASE 0 — enabling only) ───
  # NOTHING HAS MOVED YET. These two lines exist so the shared chassis is ALLOWED
  # to host state and routing code later; today not one line of it is here. The
  # change is reversible by deleting these two dependency entries and nothing
  # else. Read that as the scope: this is a permission, not a migration.
  #
  # The package was chosen by MEASUREMENT against the guards, not by taste. The
  # portfolio has three candidate homes for shared state/routing and two of them
  # are closed:
  #
  #   · packages/core is FORBIDDEN a new dependency. Its dependency list is an
  #     ALLOWLIST, not a ban-list — `CORE_ALLOWED` in
  #     tooling/ci/assert-package-boundaries.mjs:115-118 has exactly two entries
  #     (`crypto`, `cryptography`), and :127-131 fails ANY name that is not one
  #     of them. Adding flutter_riverpod there is a build failure by
  #     construction, and rightly so: core is pure Dart, and `sdk: flutter` is
  #     the exact dependency limb A exists to reject.
  #
  #   · ANY OTHER package under packages/ is legal but expensive. Limb C derives
  #     the adapter set from the tree (assert-package-boundaries.mjs:190) — every
  #     package that is not core and not design_system and declares a
  #     third-party dep IS an adapter, and :197 records each of its third-party
  #     deps as a WRAPPED vendor. Putting riverpod/go_router in, say,
  #     platform_storage would therefore declare them "wrapped behind a seam",
  #     and :288-298 would then fail every app that imports them directly —
  #     roughly 66 existing import sites, none of which are going through a
  #     seam and none of which should. assert-adapter-capabilities.mjs:206
  #     applies the same derivation and would additionally demand a
  #     `capabilityMatrix` across all six platforms for two libraries that have
  #     no platform surface to matrix.
  #
  #   · packages/design_system is the one home where neither cost lands. It is
  #     EXPLICITLY EXCLUDED from the adapter derivation in both guards
  #     (assert-package-boundaries.mjs:190 and
  #     assert-adapter-capabilities.mjs:205 both `continue` on this name), so
  #     these libraries do not become wrapped vendors and no existing import
  #     site is retroactively illegal. Its own limb B (:154-158) bans exactly
  #     one thing — dependencies whose name starts with `nikatru_` — because the
  #     invariant that actually matters here is that the design system must not
  #     be able to see the DOMAIN. flutter_riverpod and go_router are
  #     domain-free infrastructure, so the invariant is untouched.
  #
  # assert-package-earned.mjs governs CREATING a package, not adding a
  # dependency to an existing one: its domain is `listDir('packages')` filtered
  # to directories (:77-80), it loops over packages (:112-118), and
  # `declaredDeps` is consulted ONLY to substantiate the single dependency named
  # in an `evidence` block (:137-146). This package is GRANDFATHERED in
  # tooling/capability-register.json and names no evidence.dependency, so its
  # pubspec is never read by that guard.
  #
  # Constraints are pinned to whatever apps/subscriptiontracker already resolves (its pubspec
  # is the source, not a guess) so the workspace resolution is unchanged.
  #
  # THE STANDING RULE THIS CREATES: what may live here is domain-FREE state and
  # routing plumbing — providers, router scaffolding, guards over generic
  # session state. The moment something in here needs to know what an app
  # SELLS, limb B is the wall and it belongs in the app.

  # State management — see the block above before adding a third entry here.
  flutter_riverpod: ^2.5.0

  # Navigation (real URLs on web; deep links on all 6 platforms).
  go_router: ^14.2.0

  # ── LOCALISATION — THE CHASSIS STRINGS ([ADR 067] decision 2) ───────────────
  # `l10n.yaml` in this directory drives gen-l10n over `lib/src/l10n/chassis_*.arb`
  # and emits `ChassisLocalizations`. gen-l10n's output imports
  # `package:intl/intl.dart`, so the hosting package MUST declare `intl` — and
  # this is the ONE package that can. Limb C of `assert-package-boundaries.mjs`
  # derives the adapter set from the tree at `:190` and `continue`s on exactly
  # two names, `core` and `design_system`; any OTHER package declaring `intl`
  # would record it as a WRAPPED vendor and `:288-298` would then fail the 16
  # tracked `apps/subscriptiontracker` files that import `package:intl` directly. Limb B
  # (`:154-158`) forbids this package only `nikatru_*` dependencies, and neither
  # of these is one.
  #
  # 🔴 THE CONSTRAINT IS WHAT apps/subscriptiontracker ALREADY RESOLVES, COPIED, NOT CHOSEN.
  # `apps/subscriptiontracker/pubspec.yaml:106` carries `intl: ">=0.19.0 <0.21.0"` with its own
  # note on why: every stamped app pulls `flutter_localizations`, and that SDK
  # package HARD-PINS `intl`. A tighter constraint here would fail the workspace
  # resolution against the SDK pin; a looser one would let the two drift. The
  # workspace `pubspec.lock` must not move for this edit — `git diff --stat
  # origin/main -- pubspec.lock` is empty on this branch (trap git-09).
  flutter_localizations:
    sdk: flutter
  intl: ">=0.19.0 <0.21.0"

dev_dependencies:
  # [pipeline C-12] resolves the shared ruleset in analysis_options.yaml.
  nikatru_lints:
    path: ../analysis
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# ── gen-l10n ([ADR 067] decision 2, unit `chassis-l10n`) ─────────────────────
# `flutter gen-l10n` REFUSES to write anything without this flag — it prints
# "Attempted to generate localizations code without having the flutter: generate
# flag turned on" and exits 0, which is a silent no-op wearing a success code.
# `l10n.yaml` beside this file carries the rest of the configuration, including
# why the OUTPUT of gen-l10n is gitignored here exactly as it is for apps — and
# what replaces a committed-file drift check now that it is. (This line claimed
# the opposite until 2026-09-06; the triplet has never been tracked on this
# branch.)
flutter:
  generate: true
