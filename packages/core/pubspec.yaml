name: nikatru_core
description: >-
  Core domain layer for NIKATRU apps — data models, a Result/Failure type and a
  content-pack loader. Pure Dart, framework-agnostic (no Flutter dependency).
version: 0.1.0
publish_to: none
resolution: workspace
repository: https://github.com/globalonlinedeveloper/Nikatru_Platform_Public

environment:
  sdk: ^3.9.0

dependencies:
  # Pure-Dart, portable (all 6 platforms incl. web), Dart-team maintained — used
  # for sha256 content-pack integrity.
  crypto: ^3.0.0
  # [pipeline C-6 · ADR 007 AMENDED 2026-07-26, owner] The Ed25519 verifier now
  # lives IN core. The purity constraint is "no Flutter, no plugins" — this is
  # pure Dart (Apache-2.0, verified publisher dint.dev) and works on web incl.
  # WASM. The old note said signing stayed out of core to keep it pure; the
  # result was that the ONLY PackVerifier impl was RejectingPackVerifier, so no
  # pack could ever load. A seam kept clean by having no implementation is not
  # portability, it is a dead capability.
  cryptography: ^2.9.0
  # MoneyFormatter (src/money/money_format.dart) renders Money through
  # `NumberFormat`, so core declares `intl` (2026-09-11). Pure Dart: rule A of
  # assert-package-boundaries holds, and limb C skips core for intl by name.
  # The constraint is the one packages/design_system and apps/subscriptiontracker
  # already carry, COPIED: flutter_localizations hard-pins intl, so a tighter
  # range would fail workspace resolution and a looser one would let them drift.
  intl: ">=0.19.0 <0.21.0"

dev_dependencies:
  # [pipeline C-12] resolves the shared ruleset in analysis_options.yaml.
  nikatru_lints:
    path: ../analysis
  lints: ^6.0.0
  test: ^1.25.0
