name: nikatru_auth_supabase
description: >-
  The identity adapter for NIKATRU apps — the ONLY package that imports the
  Supabase SDK. Implements core's AuthRepository seam so swapping identity
  providers means writing one more implementation, not touching any app.
version: 0.1.0
publish_to: none
resolution: workspace
repository: https://github.com/globalonlinedeveloper/Nikatru_Platform_Public

environment:
  sdk: ^3.9.0
  flutter: ">=3.47.5"

dependencies:
  flutter:
    sdk: flutter
  nikatru_core:
    path: ../core
  # [pipeline C-4] THE EARN-REASON: native-binary. supabase_flutter ships
  # platform code (secure-storage bridges, the deep-link/callback handling that
  # completes an OAuth redirect). That is what buys this package its own
  # existence — see `packageEarnReasons` in tooling/capability-register.json.
  #
  # [pipeline C-5] It is declared HERE and nowhere else. An app importing
  # `package:supabase_flutter/...` directly goes around the seam, and
  # assert-package-boundaries.mjs fails the build for it.
  supabase_flutter: ^2.16.0
  # ⏱ 2026-09-29 · native sign-in attestation. gotrue-dart takes a
  # `package:http` Client (`GoTrueClient(httpClient:)`, gotrue 2.26.0
  # gotrue_client.dart:156), and NativeAttestationClient is one: it binds each
  # native op to a fresh challenge and its exact body. Already in the workspace
  # lock through gotrue; declared because this package now imports it. The
  # constraint is packages/telemetry's, COPIED, to keep the two in step.
  http: ^1.2.0
  # ⏱ 2026-10-01 · EN-04 — the deep link the OS handed supabase_flutter, read
  # to class a FAILED native auth callback by its flow (a confirmation or a
  # provider return, not a reset). Already in the lock through
  # supabase_flutter's own deep-link listener, so no new binary ships; the
  # constraint is that lock's version, declared because this package now
  # imports it.
  app_links: ^7.2.1
  # ⏱ 2026-10-01 · EN-19 native sign-in sheets. Apple's sheet hands back the
  # provider's ID token, which goes to GoTrue's `signInWithIdToken`; no browser
  # opens. It ships native code, which is this package's existing earn-reason,
  # so no new package. Google's sheet waits (see NativeSignInSheets.forPlatform):
  # declaring google_sign_in links four unaudited Apple frameworks into every
  # iOS build.
  sign_in_with_apple: ^8.2.0

dev_dependencies:
  # [pipeline C-12] resolves the shared ruleset in analysis_options.yaml.
  nikatru_lints:
    path: ../analysis
  flutter_test:
    sdk: flutter
